<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Slow Form</title><desc id="desc">Promotional poster featuring a sculptural oak chair and the words Made at the speed of care.</desc>
