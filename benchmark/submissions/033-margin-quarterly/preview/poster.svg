<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Margin Quarterly — Issue 18</title>
  <desc id="desc">Promotional poster featuring the title The Distance Between with orbiting forms in chartreuse, coral, violet, and deep green.</desc>
  <rect width="1200" height="900" fill="#e8ff63"/>
  <g fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">
    <text x="56" y="62">MARGIN • QUARTERLY</text>
    <text x="1144" y="62" text-anchor="end">ISSUE 18 / 2026</text>
  </g>
  <line x1="56" y1="82" x2="1144" y2="82" stroke="#17241f" stroke-width="2"/>
  <g fill="none" stroke="#17241f" stroke-width="2">
    <ellipse cx="750" cy="490" rx="365" ry="115" transform="rotate(-17 750 490)"/>
    <ellipse cx="730" cy="500" rx="280" ry="82" transform="rotate(27 730 500)"/>
  </g>
  <circle cx="775" cy="452" r="145" fill="#98a2ff" stroke="#17241f" stroke-width="2"/>
  <circle cx="1002" cy="555" r="58" fill="#f06349" stroke="#17241f" stroke-width="2"/>
  <circle cx="535" cy="600" r="15" fill="#17241f"/>
  <g fill="#17241f" font-family="Georgia, 'Times New Roman', serif" font-weight="400" letter-spacing="-9">
    <text x="48" y="290" font-size="172">The distance</text>
    <text x="178" y="450" font-size="190">betw</text>
    <text x="660" y="450" font-size="190" fill="#f4efe4" stroke="#17241f" stroke-width="2" font-style="italic">e</text>
    <text x="752" y="450" font-size="190">en</text>
  </g>
  <g fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.8">
    <text x="55" y="590">CULTURE / PLACE / ATTENTION</text>
    <text x="1038" y="420">38°</text>
    <text x="870" y="650">2.4 KM</text>
  </g>
  <line x1="56" y1="754" x2="1144" y2="754" stroke="#17241f" stroke-width="2"/>
  <text x="56" y="809" fill="#17241f" font-family="Georgia, 'Times New Roman', serif" font-size="29">Ideas worth leaving room for.</text>
  <g fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.7">
    <text x="1144" y="795" text-anchor="end">A JOURNAL OF</text>
    <text x="1144" y="820" text-anchor="end">CONSIDERED DISTANCE</text>
  </g>
  <circle cx="600" cy="851" r="5" fill="#f06349"/>
</svg>
