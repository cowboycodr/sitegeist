<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Narra — Turn research into a living story</title>
  <desc id="desc">Editorial poster featuring connected research cards and a winding narrative thread.</desc>
  <rect width="1200" height="900" fill="#f3f0e8"/>
  <rect x="54" y="48" width="1092" height="804" fill="none" stroke="#cbc8bd"/>
  <g fill="none" stroke="#d95742" stroke-width="7"><path d="M104 120v46l32-46v46l32-46"/><circle cx="104" cy="120" r="8" fill="#f3f0e8"/><circle cx="136" cy="166" r="8" fill="#f3f0e8"/><circle cx="168" cy="120" r="8" fill="#f3f0e8"/></g>
  <text x="195" y="157" fill="#1d2b26" font-family="Georgia,serif" font-size="52" font-weight="bold">Narra</text>
  <text x="104" y="290" fill="#1d2b26" font-family="Georgia,serif" font-size="82">Turn research into</text>
  <text x="104" y="380" fill="#d95742" font-family="Georgia,serif" font-size="92" font-style="italic">a living story.</text>
  <path d="M120 584 C290 480 360 695 535 600 S790 475 1080 638" fill="none" stroke="#819189" stroke-width="3" stroke-dasharray="10 12"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(106 523) rotate(-3)"><rect width="245" height="160" fill="#fff" stroke="#d9d7cf"/><text x="20" y="31" fill="#7e8882" font-size="12" letter-spacing="2">SOURCE 01</text><rect x="20" y="50" width="64" height="65" fill="#bcc6b7"/><text x="101" y="73" fill="#1d2b26" font-family="Georgia,serif" font-size="23">A city beneath</text><text x="101" y="101" fill="#1d2b26" font-family="Georgia,serif" font-size="23">the city</text><text x="20" y="140" fill="#88918c" font-size="11">FIELD NOTES · MAY 14</text></g>
    <g transform="translate(460 538) rotate(2)"><rect width="272" height="178" fill="#fff" stroke="#d9d7cf"/><rect width="8" height="178" fill="#d95742"/><text x="27" y="35" fill="#7e8882" font-size="12" letter-spacing="2">EXCERPT 03</text><text x="27" y="78" fill="#1d2b26" font-family="Georgia,serif" font-size="22">“What we don’t see</text><text x="27" y="108" fill="#1d2b26" font-family="Georgia,serif" font-size="22">holds everything else</text><text x="27" y="138" fill="#1d2b26" font-family="Georgia,serif" font-size="22">together.”</text></g>
    <g transform="translate(817 538) rotate(-2)"><rect width="260" height="180" fill="#20352d"/><text x="22" y="35" fill="#a9b4ae" font-size="12" letter-spacing="2">INSIGHT 07</text><text x="22" y="83" fill="#f5f1e7" font-family="Georgia,serif" font-size="27">Maintenance is</text><text x="22" y="118" fill="#f5f1e7" font-family="Georgia,serif" font-size="27">a form of memory.</text><circle cx="235" cy="155" r="7" fill="#d95742"/></g>
  </g>
  <g fill="#d95742" stroke="#f3f0e8" stroke-width="7"><circle cx="120" cy="584" r="11"/><circle cx="591" cy="579" r="11"/><circle cx="1080" cy="638" r="11"/></g>
  <text x="104" y="805" fill="#59645e" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">CONTEXT, CONNECTED</text>
  <text x="1090" y="805" fill="#59645e" text-anchor="end" font-family="Arial,sans-serif" font-size="14">01—04</text>
</svg>
