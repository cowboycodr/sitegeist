<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Glyph Department</title><desc id="desc">Promotional poster for an independent type foundry.</desc>
  <rect width="1200" height="900" fill="#f1efe6"/>
  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#171713" stroke-width="2"/>
  <text x="48" y="72" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="-1">GLYPH DEPT.</text>
  <text x="1150" y="72" text-anchor="end" font-family="Courier New,monospace" font-size="14">INDEPENDENT TYPE FOUNDRY</text>
  <line x1="24" y1="98" x2="1176" y2="98" stroke="#171713" stroke-width="2"/>
  <text x="48" y="300" font-family="Arial,Helvetica,sans-serif" font-size="198" font-weight="900" letter-spacing="-15">TYPEFACES</text>
  <text x="48" y="478" font-family="Arial,Helvetica,sans-serif" font-size="198" font-weight="900" letter-spacing="-15">WITH SOME</text>
  <text x="1138" y="662" text-anchor="end" font-family="Georgia,serif" font-size="208" font-style="italic" letter-spacing="-13">thing to say.</text>
  <circle cx="1040" cy="255" r="92" fill="#ff5c35"/>
  <text x="1040" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="bold" fill="#171713">✳</text>
  <rect x="24" y="735" width="1152" height="141" fill="#d7ff38" stroke="#171713" stroke-width="2"/>
  <text x="48" y="785" font-family="Courier New,monospace" font-size="15">VARIABLE LETTERS THAT STRETCH, COLLIDE, AND PERFORM.</text>
  <text x="48" y="842" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900">BRUT</text>
  <text x="330" y="842" font-family="Georgia,serif" font-size="55" font-style="italic">Lilt</text>
  <text x="610" y="842" font-family="Courier New,monospace" font-size="44" font-weight="bold">RELAY MONO</text>
  <text x="1148" y="842" text-anchor="end" font-family="Courier New,monospace" font-size="15">CHICAGO / 2026</text>
</svg>
