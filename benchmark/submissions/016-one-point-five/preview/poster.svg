<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">One Point Five</title>
  <desc id="desc">Gallery poster for a climate data observatory, featuring the 1.5 degree threshold.</desc>
  <rect width="1200" height="900" fill="#f2f0e8"/>
  <rect x="720" width="480" height="900" fill="#d8ff45"/>
  <path d="M0 675H1200M720 0V900" fill="none" stroke="#101616" stroke-width="2"/>
  <circle cx="950" cy="419" r="260" fill="none" stroke="#101616" stroke-opacity=".35" stroke-width="2" transform="rotate(22 950 419) scale(1 .38)"/>
  <circle cx="950" cy="419" r="260" fill="none" stroke="#101616" stroke-opacity=".35" stroke-width="2" transform="rotate(-34 950 419) scale(1 .38)"/>
  <circle cx="696" cy="367" r="9" fill="#101616"/><circle cx="1174" cy="514" r="9" fill="#101616"/>
  <g fill="#101616" font-family="Arial,Helvetica,sans-serif">
    <circle cx="63" cy="64" r="27" fill="none" stroke="#101616" stroke-width="2"/>
    <text x="47" y="72" font-size="18" font-weight="700">1·5</text>
    <text x="106" y="72" font-size="22" font-weight="700">ONE POINT FIVE</text>
    <text x="61" y="204" font-size="15" font-weight="700" letter-spacing="3">CLIMATE DATA OBSERVATORY</text>
    <circle cx="43" cy="198" r="6" fill="#ff633f"/>
    <text x="50" y="350" font-size="106" font-weight="700" letter-spacing="-7">MAKE THE</text>
    <text x="50" y="445" font-size="106" font-family="Georgia,serif" font-style="italic">FUTURE</text>
    <text x="50" y="540" font-size="106" font-weight="700" letter-spacing="-7">MEASURABLE.</text>
    <text x="755" y="470" font-size="215" font-weight="700" letter-spacing="-18">1.5</text>
    <text x="1083" y="363" font-size="54" font-weight="700">°C</text>
    <text x="50" y="730" font-size="18" font-family="Georgia,serif">The planet is speaking in signals.</text>
    <text x="50" y="757" font-size="18" font-family="Georgia,serif">We make them legible—and actionable.</text>
    <text x="755" y="728" font-size="13" font-weight="700" letter-spacing="2">CURRENT WARMING</text>
    <text x="755" y="782" font-size="44" font-weight="700">1.31°C</text>
    <text x="970" y="728" font-size="13" font-weight="700" letter-spacing="2">CARBON BUDGET</text>
    <text x="970" y="782" font-size="44" font-weight="700">176 Gt</text>
    <text x="50" y="850" font-size="13" font-weight="700" letter-spacing="2">PLANETARY EVIDENCE FOR COLLECTIVE ACTION</text>
  </g>
</svg>
