<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Museum of Small Things</title><desc id="desc">Promotional poster featuring a brass key and archival typography.</desc>
  <rect width="1200" height="900" fill="#f2eee4"/><rect x="690" width="510" height="900" fill="#a6ad91"/>
  <g fill="#1d211c"><circle cx="75" cy="70" r="34" fill="none" stroke="#1d211c" stroke-width="2"/><text x="62" y="82" font-family="Georgia,serif" font-style="italic" font-size="36">M</text><circle cx="91" cy="50" r="4"/><text x="125" y="58" font-family="Arial,sans-serif" font-weight="bold" font-size="13" letter-spacing="2">MUSEUM OF</text><text x="125" y="78" font-family="Arial,sans-serif" font-weight="bold" font-size="13" letter-spacing="2">SMALL THINGS</text>
  <text x="70" y="204" font-family="Arial,sans-serif" font-weight="bold" font-size="13" letter-spacing="3">OPEN COLLECTION · 4,208 OBJECTS</text>
  <text x="66" y="325" font-family="Georgia,serif" font-size="100" letter-spacing="-5">Every</text><text x="66" y="420" font-family="Georgia,serif" font-size="100" letter-spacing="-5">small thing</text><text x="66" y="515" font-family="Georgia,serif" font-size="100" letter-spacing="-5">holds a</text><text x="66" y="610" fill="#a94e32" font-family="Georgia,serif" font-style="italic" font-size="105" letter-spacing="-5">world.</text>
  <line x1="70" y1="684" x2="390" y2="684" stroke="#1d211c"/><text x="70" y="725" font-family="Georgia,serif" font-size="24">Ordinary objects.</text><text x="70" y="757" font-family="Georgia,serif" font-size="24">Extraordinary stories.</text><text x="70" y="835" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="3">A LIVING DIGITAL ARCHIVE</text></g>
  <g transform="translate(905 400) rotate(-28)" filter="url(#shadow)"><circle cx="-120" cy="0" r="92" fill="#b78a3f" stroke="#62441f" stroke-width="26"/><circle cx="-120" cy="0" r="42" fill="#a6ad91" stroke="#765323" stroke-width="9"/><rect x="-35" y="-20" width="250" height="40" rx="8" fill="#9e722f" stroke="#5f421d" stroke-width="6"/><path d="M160 15v70h32V53h40V13" fill="#9e722f" stroke="#5f421d" stroke-width="6"/></g>
  <defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="18" dy="22" stdDeviation="13" flood-color="#27392d" flood-opacity=".35"/></filter></defs>
  <g fill="#39493b" font-family="Georgia,serif" font-style="italic" font-size="22"><text x="960" y="160" transform="rotate(5 960 160)">Found in her</text><text x="975" y="187" transform="rotate(5 975 187)">sewing tin</text><text x="755" y="675" transform="rotate(-6 755 675)">Bristol, 1987</text></g>
  <rect x="720" y="746" width="450" height="108" fill="#f2eee4"/><text x="745" y="781" fill="#1d211c" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="2">№ 0197 · BRASS</text><text x="745" y="819" fill="#1d211c" font-family="Georgia,serif" font-size="28">The key to nowhere</text><circle cx="1128" cy="800" r="23" fill="none" stroke="#1d211c"/><text x="1118" y="810" fill="#1d211c" font-family="Arial,sans-serif" font-size="23">↗</text>
</svg>
