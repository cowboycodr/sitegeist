<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Soft Earth Studio</title>
  <desc id="desc">Promotional artwork with two handmade vessels against an ochre sun and moss green field.</desc>
