<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Kintsu — care between appointments</title><desc id="desc">Promotional artwork with warm botanical arches and a daily reflection card.</desc>
  <rect width="1200" height="900" fill="#f3f0e8"/><rect x="770" width="430" height="900" fill="#c7d5c5"/>
  <circle cx="985" cy="450" r="300" fill="none" stroke="#17382e" opacity=".18"/><circle cx="985" cy="450" r="220" fill="none" stroke="#17382e" opacity=".16"/><circle cx="985" cy="450" r="140" fill="none" stroke="#17382e" opacity=".14"/><circle cx="813" cy="214" r="15" fill="#e88952"/>
  <circle cx="82" cy="80" r="25" fill="none" stroke="#17382e" stroke-width="2"/><text x="82" y="89" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#17382e">K</text><text x="125" y="91" font-family="Georgia,serif" font-size="35" fill="#17382e">Kintsu</text>
  <text x="82" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="3" fill="#17382e">WHOLE-PERSON MENTAL CARE</text>
  <text x="82" y="315" font-family="Georgia,serif" font-size="78" fill="#17382e">Care for the life</text><text x="82" y="398" font-family="Georgia,serif" font-size="78" font-style="italic" fill="#bd5b42">between</text><text x="345" y="398" font-family="Georgia,serif" font-size="78" fill="#17382e">appointments.</text>
  <text x="86" y="485" font-family="Arial,sans-serif" font-size="22" fill="#405c53">Reflection, therapy, and practical tools—</text><text x="86" y="520" font-family="Arial,sans-serif" font-size="22" fill="#405c53">together for all the moments that make a life.</text>
  <rect x="82" y="590" width="225" height="62" rx="2" fill="#17382e"/><text x="111" y="629" font-family="Arial,sans-serif" font-weight="bold" font-size="16" fill="#f8f5ed">BEGIN A CHECK-IN  ↗</text>
  <g transform="translate(790 285) rotate(-2)"><rect width="350" height="390" fill="#f8f5ed"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#61746c">TODAY · 9:41 AM</text><text x="306" y="47" font-size="23" fill="#bd5b42">✦</text><text x="28" y="130" font-family="Georgia,serif" font-size="32" fill="#17382e">How are you arriving</text><text x="28" y="169" font-family="Georgia,serif" font-size="32" fill="#17382e">in this moment?</text><line x1="44" y1="242" x2="306" y2="242" stroke="#8da096"/><circle cx="175" cy="242" r="13" fill="#bd5b42" stroke="#f8f5ed" stroke-width="6"/><text x="28" y="247" font-family="Arial,sans-serif" font-size="9" fill="#61746c">LOW</text><text x="312" y="247" font-family="Arial,sans-serif" font-size="9" fill="#61746c">LIGHT</text><line x1="28" y1="294" x2="322" y2="294" stroke="#d9ddd5"/><circle cx="51" cy="335" r="19" fill="#e3e9df"/><text x="45" y="342" font-size="20" fill="#bd5b42">◌</text><text x="84" y="330" font-family="Arial,sans-serif" font-weight="bold" font-size="13" fill="#17382e">A little more ease</text><text x="84" y="351" font-family="Arial,sans-serif" font-size="11" fill="#405c53">Your check-ins feel lighter than last week.</text></g>
  <text x="82" y="820" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#17382e">PRIVATE BY DESIGN  ·  HERE WHEN YOU NEED IT</text>
</svg>
