  <g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="70" y="78" font-weight="900" font-size="24" letter-spacing="2">SIGNAL HOUSE</text><text x="70" y="118" font-size="16" font-weight="700" letter-spacing="4">INDEPENDENT CREATIVE STUDIO</text>
  <text x="60" y="375" font-weight="900" font-size="176" letter-spacing="-14">MAKE</text><text x="60" y="530" font-family="Georgia,serif" font-style="italic" font-size="190" letter-spacing="-12">noise</text><text x="60" y="670" font-weight="900" font-size="144" letter-spacing="-11">WORTH</text><text x="60" y="805" font-weight="900" font-size="144" letter-spacing="-11">HEARING.</text>
