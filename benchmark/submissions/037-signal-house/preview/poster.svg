<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Signal House — Make noise worth hearing</title><desc id="desc">Bold lime poster with radiating signal rings and black editorial lettering.</desc>
  <rect width="1200" height="900" fill="#f0ff4b"/>
  <g fill="none" stroke="#111" stroke-width="3" opacity=".85" transform="translate(955 425)"><circle r="360"/><circle r="285"/><circle r="210"/><circle r="135"/></g>
