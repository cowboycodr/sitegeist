  <rect width="1200" height="900" fill="url(#night)"/><circle cx="790" cy="337" r="265" fill="url(#luna)"/><path d="M0 675 Q250 560 510 652 T1200 610V900H0Z" fill="#10100f"/><ellipse cx="710" cy="615" rx="450" ry="55" fill="#d9d1c3" opacity=".11" filter="url(#blur)"/>
