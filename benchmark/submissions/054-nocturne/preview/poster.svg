  <text x="68" y="394" fill="#e7e0d2" font-family="Georgia,serif" font-size="104" letter-spacing="-5">Scent</text><text x="68" y="490" fill="#aaa398" font-family="Georgia,serif" font-size="104" font-style="italic" letter-spacing="-5">after</text><text x="68" y="586" fill="#e7e0d2" font-family="Georgia,serif" font-size="104" letter-spacing="-5">dark.</text>
