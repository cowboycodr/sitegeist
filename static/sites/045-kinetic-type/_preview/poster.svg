<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic Type</title><desc id="desc">Promotional poster reading Letters made to move in black, acid yellow, hot pink, and electric blue.</desc>
  <rect width="1200" height="900" fill="#f1ff3f"/>
  <g fill="none" stroke="#101010" opacity=".35"><ellipse cx="880" cy="390" rx="270" ry="145" transform="rotate(-20 880 390)"/><ellipse cx="880" cy="390" rx="210" ry="105" transform="rotate(-20 880 390)"/></g>
  <text x="52" y="66" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#101010">INDEPENDENT TYPE FOUNDRY</text>
  <text x="1148" y="66" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#101010">KT ↗ 2026</text>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="900" fill="#101010" letter-spacing="-18">
    <text x="38" y="285" font-size="275">LETTERS</text>
    <text x="205" y="510" font-size="275">MADE TO</text>
    <text x="420" y="745" font-size="295" font-style="italic">MOVE<tspan fill="#ff5aa8">.</tspan></text>
  </g>
  <rect y="825" width="1200" height="75" fill="#101010"/>
  <text x="52" y="873" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" letter-spacing="2">VARIABLE FONTS</text>
  <text x="340" y="873" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f1ff3f">✳</text>
  <text x="395" y="873" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" letter-spacing="2">DISPLAY FAMILIES</text>
  <text x="740" y="873" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f1ff3f">✳</text>
  <text x="795" y="873" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" letter-spacing="2">CUSTOM TYPE</text>
</svg>
