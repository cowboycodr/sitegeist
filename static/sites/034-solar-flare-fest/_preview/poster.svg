<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Solar Flare Festival</title>
  <desc id="desc">Promotional poster in orange, yellow, violet, and black for a desert music festival in Joshua Tree.</desc>
  <rect width="1200" height="900" fill="#ff4b1f"/>
  <g stroke="#171019" stroke-width="1" opacity=".16">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200M0 800H1200"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/>
  </g>
  <circle cx="910" cy="275" r="260" fill="#ffd52e"/>
  <circle cx="760" cy="390" r="72" fill="#ed66c3" opacity=".85"/>
  <g fill="none" stroke="#171019" stroke-width="3">
    <circle cx="910" cy="275" r="195"/><circle cx="910" cy="275" r="145"/>
  </g>
  <circle cx="910" cy="275" r="8" fill="#171019"/>
  <path d="M0 755L108 711L202 742L311 627L407 727L510 666L619 743L743 635L831 720L950 574L1047 701L1139 651L1200 706V900H0Z" fill="#171019"/>
