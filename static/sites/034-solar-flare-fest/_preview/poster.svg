    <text x="120" y="505" fill="none" stroke="#171019" stroke-width="4" font-size="238">FLARE</text>
  </g>
  <text x="65" y="576" fill="#171019" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900" letter-spacing="-1">THREE NIGHTS. NO SMALL FEELINGS.</text>
  <g fill="#f3eddd" font-family="Arial,Helvetica,sans-serif">
