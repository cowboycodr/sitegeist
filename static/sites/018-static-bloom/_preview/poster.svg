<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Static Bloom</title><desc id="desc">Promotional poster in violet, acid green, coral, and black for the independent record label Static Bloom.</desc>
  <rect width="1200" height="900" fill="#7a43f2"/>
  <g fill="none" stroke="#171616" stroke-width="2" opacity=".7">
    <circle cx="915" cy="315" r="305"/><circle cx="915" cy="315" r="250" stroke-dasharray="12 12"/><circle cx="915" cy="315" r="198"/>
  </g>
  <circle cx="925" cy="300" r="205" fill="#d5ff3f"/>
  <circle cx="900" cy="330" r="205" fill="#ff664d" opacity=".88"/>
  <circle cx="925" cy="300" r="68" fill="#7a43f2" stroke="#171616" stroke-width="3"/>
  <g fill="#171616" font-family="Arial, Helvetica, sans-serif">
    <text x="65" y="77" font-size="20" font-weight="700" letter-spacing="5">RECORDS · EDITIONS · NOISE</text>
    <text x="65" y="170" font-size="130" font-weight="900" letter-spacing="-10">STATIC</text>
    <text x="65" y="283" font-size="130" font-weight="900" letter-spacing="-10">BLOOM</text>
    <text x="71" y="345" font-family="Georgia, serif" font-size="32" font-style="italic">Beautiful noise, carefully released.</text>
    <text x="67" y="705" font-size="235" font-weight="900" letter-spacing="-20">SB✣</text>
    <text x="70" y="778" font-size="28" font-weight="700" letter-spacing="2">INDEPENDENT SOUNDS / CHROMATIC OBJECTS</text>
    <text x="70" y="833" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">CHICAGO / EVERYWHERE — CAT. 018—026</text>
    <text x="880" y="307" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3">33⅓ RPM</text>
  </g>
  <g transform="translate(1030 650) rotate(9)">
    <circle r="91" fill="#f1efde" stroke="#171616" stroke-width="2"/>
    <text text-anchor="middle" y="-23" fill="#171616" font-family="monospace" font-size="15" font-weight="700">CAREFULLY</text>
    <text text-anchor="middle" y="7" fill="#171616" font-family="monospace" font-size="15" font-weight="700">RELEASED</text>
    <text text-anchor="middle" y="50" fill="#171616" font-family="Arial" font-size="42" font-weight="900">026</text>
  </g>
  <rect x="0" y="866" width="1200" height="34" fill="#d5ff3f"/>
</svg>
