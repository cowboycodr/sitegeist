<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Wild Culture — Good things take time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F0E4"/>
      <stop offset="45%" stop-color="#F0DCC0"/>
      <stop offset="100%" stop-color="#E8C9A4"/>
    </linearGradient>
    <linearGradient id="jarFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C96A"/>
      <stop offset="40%" stop-color="#E07A4A"/>
      <stop offset="100%" stop-color="#8B3A5C"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#E8A838" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A838" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Decorative culture rings -->
  <circle cx="160" cy="180" r="70" fill="none" stroke="#8B3A5C" stroke-width="2" opacity="0.18"/>
  <circle cx="160" cy="180" r="46" fill="none" stroke="#8B3A5C" stroke-width="1.5" opacity="0.22"/>
  <circle cx="160" cy="150" r="8" fill="#C45C7A" opacity="0.55"/>
  <circle cx="138" cy="195" r="6" fill="#E07A4A" opacity="0.5"/>
  <circle cx="185" cy="190" r="5" fill="#6B8F5A" opacity="0.5"/>

  <circle cx="1040" cy="720" r="90" fill="none" stroke="#8B3A5C" stroke-width="2" opacity="0.14"/>
  <circle cx="1040" cy="720" r="58" fill="none" stroke="#E07A4A" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1040" cy="680" r="9" fill="#E8A838" opacity="0.55"/>
  <circle cx="1005" cy="740" r="7" fill="#8B3A5C" opacity="0.45"/>
  <circle cx="1075" cy="745" r="6" fill="#6B8F5A" opacity="0.45"/>

  <!-- Floating bubbles -->
  <circle cx="280" cy="620" r="18" fill="none" stroke="#8B3A5C" stroke-width="1.5" opacity="0.22"/>
  <circle cx="320" cy="680" r="10" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="900" cy="200" r="14" fill="none" stroke="#8B3A5C" stroke-width="1.5" opacity="0.2"/>
  <circle cx="940" cy="250" r="8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="200" cy="400" r="6" fill="#E8A838" opacity="0.4"/>
  <circle cx="1050" cy="400" r="7" fill="#C45C7A" opacity="0.35"/>

  <!-- Large jar motif -->
  <g transform="translate(720, 140)">
    <!-- shadow -->
    <ellipse cx="160" cy="620" rx="95" ry="18" fill="#1F1612" opacity="0.12"/>
    <!-- lid -->
    <rect x="85" y="40" width="150" height="28" rx="5" fill="#2A1F18"/>
    <rect x="100" y="26" width="120" height="20" rx="4" fill="#3D2E24"/>
    <!-- body -->
    <path d="M90 68h140v24c0 10 8 18 8 34v280c0 28-22 42-78 42s-78-14-78-42V126c0-16 8-24 8-34V68z" fill="url(#jarFill)"/>
    <path d="M90 68h140v24c0 10 8 18 8 34v280c0 28-22 42-78 42s-78-14-78-42V126c0-16 8-24 8-34V68z" fill="url(#glassShine)"/>
    <path d="M90 68h140v24c0 10 8 18 8 34v280c0 28-22 42-78 42s-78-14-78-42V126c0-16 8-24 8-34V68z" fill="none" stroke="#2A1F18" stroke-width="4"/>
    <!-- layers -->
    <ellipse cx="160" cy="250" rx="58" ry="22" fill="#6B8F5A" opacity="0.9"/>
    <ellipse cx="160" cy="290" rx="62" ry="20" fill="#C45C7A" opacity="0.88"/>
    <ellipse cx="160" cy="326" rx="56" ry="17" fill="#E8A838" opacity="0.82"/>
    <ellipse cx="160" cy="358" rx="50" ry="14" fill="#7A4A8C" opacity="0.78"/>
    <!-- bubbles -->
    <circle cx="125" cy="175" r="7" fill="#FFFFFF" opacity="0.38"/>
    <circle cx="190" cy="200" r="5" fill="#FFFFFF" opacity="0.42"/>
    <circle cx="150" cy="210" r="3.5" fill="#FFFFFF" opacity="0.32"/>
    <circle cx="205" cy="165" r="4.5" fill="#FFFFFF" opacity="0.3"/>
    <!-- label -->
    <rect x="112" y="400" width="96" height="48" rx="6" fill="#F7F0E4" opacity="0.96"/>
    <text x="160" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#2A1F18" letter-spacing="2">WILD</text>
    <text x="160" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#8B3A5C" letter-spacing="1.5">CULTURE</text>
  </g>

  <!-- Brand copy -->
  <text x="96" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#8B3A5C" letter-spacing="6">FERMENTED IN BROOKLYN</text>
  <text x="96" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#1F1612" letter-spacing="-2">Wild</text>
  <text x="96" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#1F1612" letter-spacing="-2">Culture</text>
  <text x="96" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#8B3A5C">Good things take time.</text>

  <!-- Accent bar -->
  <rect x="96" y="630" width="120" height="6" rx="3" fill="#E07A4A"/>

  <!-- Product chips -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">
    <rect x="96" y="680" width="92" height="40" rx="20" fill="#8B3A5C"/>
    <text x="142" y="706" text-anchor="middle" fill="#F7F0E4">Kraut</text>
    <rect x="200" y="680" width="108" height="40" rx="20" fill="#E07A4A"/>
    <text x="254" y="706" text-anchor="middle" fill="#1F1612">Kimchi</text>
    <rect x="320" y="680" width="132" height="40" rx="20" fill="#E8A838"/>
    <text x="386" y="706" text-anchor="middle" fill="#1F1612">Kombucha</text>
    <rect x="464" y="680" width="88" height="40" rx="20" fill="#6B8F5A"/>
    <text x="508" y="706" text-anchor="middle" fill="#F7F0E4">Koji</text>
  </g>
</svg>
