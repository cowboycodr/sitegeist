<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Latent Gallery — Exhibition 13 / Emergence">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="45%" stop-color="#12102a"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </linearGradient>
    <radialGradient id="glowA" cx="28%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#8b7cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="72%" cy="58%" r="38%">
      <stop offset="0%" stop-color="#5ec8d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5ec8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="55%" cy="78%" r="30%">
      <stop offset="0%" stop-color="#e07a9a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e07a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ec8d4"/>
      <stop offset="50%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#e07a9a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2f0fa"/>
      <stop offset="100%" stop-color="#c9c2ff"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>
  <rect width="1200" height="900" fill="url(#glowC)"/>

  <!-- Soft field dots -->
  <g fill="#e8e6f0" opacity="0.55">
    <circle cx="180" cy="160" r="2.2"/>
    <circle cx="240" cy="220" r="1.4"/>
    <circle cx="320" cy="140" r="1.8"/>
    <circle cx="410" cy="250" r="1.2"/>
    <circle cx="520" cy="180" r="2"/>
    <circle cx="680" cy="130" r="1.5"/>
    <circle cx="790" cy="210" r="1.8"/>
    <circle cx="900" cy="150" r="1.3"/>
    <circle cx="980" cy="240" r="2.1"/>
    <circle cx="150" cy="420" r="1.6"/>
    <circle cx="260" cy="500" r="1.3"/>
    <circle cx="360" cy="380" r="2"/>
    <circle cx="480" cy="460" r="1.4"/>
    <circle cx="610" cy="390" r="1.7"/>
    <circle cx="740" cy="470" r="1.2"/>
    <circle cx="860" cy="400" r="2"/>
    <circle cx="960" cy="510" r="1.5"/>
    <circle cx="1050" cy="430" r="1.3"/>
    <circle cx="200" cy="620" r="1.4"/>
    <circle cx="330" cy="700" r="1.8"/>
    <circle cx="470" cy="650" r="1.2"/>
    <circle cx="600" cy="720" r="1.6"/>
    <circle cx="760" cy="660" r="1.3"/>
    <circle cx="890" cy="730" r="1.9"/>
    <circle cx="1020" cy="680" r="1.4"/>
  </g>

  <!-- Orbital motif -->
  <g fill="none" transform="translate(860 300)">
    <ellipse cx="0" cy="0" rx="170" ry="90" stroke="#8b7cff" stroke-width="1.5" opacity="0.55" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="130" ry="68" stroke="#5ec8d4" stroke-width="1.4" opacity="0.5" transform="rotate(24)"/>
    <ellipse cx="0" cy="0" rx="95" ry="50" stroke="#e07a9a" stroke-width="1.3" opacity="0.45" transform="rotate(-40)"/>
    <circle cx="0" cy="0" r="28" fill="#1a1630" stroke="#c9c2ff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="url(#ribbon)"/>
    <circle cx="118" cy="-42" r="5" fill="#5ec8d4"/>
    <circle cx="-96" cy="48" r="4" fill="#e07a9a"/>
    <circle cx="40" cy="78" r="3.5" fill="#8b7cff"/>
  </g>

  <!-- Flowing ribbon curves -->
  <path d="M80 640 C 220 560, 340 720, 500 640 S 780 540, 940 610 S 1100 700, 1160 660"
        fill="none" stroke="url(#ribbon)" stroke-width="2.5" opacity="0.75"/>
  <path d="M60 700 C 240 620, 360 780, 540 700 S 800 600, 980 680"
        fill="none" stroke="#8b7cff" stroke-width="1.4" opacity="0.35"/>

  <!-- Brand mark -->
  <g transform="translate(96 96)">
    <circle cx="18" cy="18" r="18" fill="url(#ribbon)"/>
    <circle cx="18" cy="18" r="24" fill="none" stroke="#8b7cff" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- Typography -->
  <text x="96" y="180" fill="#5ec8d4" font-family="Georgia, 'Palatino Linotype', serif" font-size="18" letter-spacing="6" font-weight="600">EXHIBITION 13 / EMERGENCE</text>
  <text x="96" y="280" fill="url(#titleGrad)" font-family="Georgia, 'Palatino Linotype', serif" font-size="86" font-weight="500">Latent Gallery</text>
  <text x="96" y="360" fill="#e8e6f0" font-family="Georgia, 'Palatino Linotype', serif" font-size="40" opacity="0.92">Art that never repeats itself.</text>
  <text x="96" y="430" fill="#9b98ad" font-family="Segoe UI, system-ui, sans-serif" font-size="22">Algorithmic editions · Living systems · Machine-assisted practices</text>

  <!-- Bottom bar -->
  <rect x="96" y="780" width="1008" height="1" fill="#e8e6f0" opacity="0.12"/>
  <text x="96" y="830" fill="#6a677c" font-family="Segoe UI, system-ui, sans-serif" font-size="16" letter-spacing="3">DIGITAL GALLERY · GENERATIVE ART · OPEN RUNTIME</text>
  <text x="900" y="830" fill="#9b98ad" font-family="Segoe UI, system-ui, sans-serif" font-size="16" text-anchor="end">Enter exhibition</text>
</svg>
