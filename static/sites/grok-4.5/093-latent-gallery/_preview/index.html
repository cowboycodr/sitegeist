<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Latent Gallery — Poster Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0b12;
      font-family: system-ui, sans-serif;
      color: #e8e6f0;
      padding: 1.5rem;
    }
    figure {
      margin: 0;
      max-width: 960px;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(232, 230, 240, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      color: #9b98ad;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Latent Gallery promotional poster for Exhibition 13 / Emergence">
    <figcaption>Latent Gallery — gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
