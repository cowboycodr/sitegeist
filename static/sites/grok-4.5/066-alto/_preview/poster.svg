<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6f3ec"/>
      <stop offset="55%" stop-color="#ebe6db"/>
      <stop offset="100%" stop-color="#dfe8e1"/>
    </linearGradient>
    <linearGradient id="panel" x1="620" y1="140" x2="1040" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f6b56"/>
      <stop offset="100%" stop-color="#2c4f3e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft architectural shapes -->
  <circle cx="180" cy="120" r="160" fill="#e8c4a8" opacity="0.35"/>
  <circle cx="1080" cy="780" r="220" fill="#8fa892" opacity="0.22"/>
  <rect x="80" y="70" width="1040" height="760" rx="40" fill="#fffcf7" opacity="0.45"/>

  <!-- Left composition: brand block -->
  <rect x="110" y="140" width="480" height="620" rx="32" fill="#fffcf7" stroke="#d7ddd6" stroke-width="2"/>

  <!-- Logo mark -->
  <rect x="160" y="200" width="72" height="72" rx="18" fill="#3f6b56"/>
  <path d="M176 252 L196 214 L216 252" stroke="#fffcf7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M184 238 H208" stroke="#fffcf7" stroke-width="6" stroke-linecap="round"/>

  <text x="250" y="250" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="48" font-weight="600" fill="#1c2420" letter-spacing="-1.5">Alto</text>

  <text x="160" y="340" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3f6b56" letter-spacing="4">A BETTER PLACE TO WORK</text>

  <text x="160" y="420" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="56" font-weight="600" fill="#1c2420" letter-spacing="-1.5">Room for your</text>
  <text x="160" y="490" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="56" font-weight="600" fill="#1c2420" letter-spacing="-1.5">best thinking.</text>

  <text x="160" y="560" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#3a463f">Flexible studios · Quiet rooms</text>
  <text x="160" y="596" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#3a463f">Thoughtful hospitality</text>

  <!-- Accent bar -->
  <rect x="160" y="660" width="120" height="8" rx="4" fill="#c47a4a"/>
  <text x="160" y="710" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#6a756e">Workspace · Membership</text>

  <!-- Right composition: geometric motif -->
  <rect x="640" y="140" width="450" height="620" rx="32" fill="url(#panel)"/>
  <rect x="700" y="220" width="220" height="160" rx="20" fill="#f7f3ea" opacity="0.95"/>
  <rect x="800" y="320" width="230" height="180" rx="20" fill="#d8e5db" opacity="0.9"/>
  <rect x="720" y="430" width="160" height="200" rx="18" fill="#2c4f3e"/>

  <!-- Peak mark in accent panel -->
  <path d="M752 580 L800 470 L848 580" stroke="#fffcf7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M772 540 H828" stroke="#fffcf7" stroke-width="14" stroke-linecap="round"/>

  <circle cx="980" cy="240" r="28" fill="#c47a4a"/>
  <circle cx="1000" cy="620" r="48" stroke="#e8c4a8" stroke-width="10" fill="none"/>
  <line x1="720" y1="260" x2="860" y2="260" stroke="#8fa892" stroke-width="8" stroke-linecap="round"/>
  <line x1="720" y1="292" x2="820" y2="292" stroke="#8fa892" stroke-width="8" stroke-linecap="round"/>
</svg>
