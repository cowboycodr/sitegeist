<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alto — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1c2420;
      padding: 1.5rem;
    }
    img {
      width: min(100%, 900px);
      height: auto;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Alto gallery poster: Room for your best thinking.">
</body>
</html>
