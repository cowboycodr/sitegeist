<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Field Notes — Poster Preview</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --ink: #1c1a16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }
    figure {
      margin: 0;
      width: min(100%, 900px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #c4b9a4;
      box-shadow: 0 18px 40px rgba(28, 26, 22, 0.1);
    }
    figcaption {
      margin-top: 0.85rem;
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: #3d3932;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Field Notes gallery poster: layered hills, a nestled building, and the words Field Notes — Buildings that belong.">
    <figcaption>Field Notes · Gallery poster</figcaption>
  </figure>
</body>
</html>
