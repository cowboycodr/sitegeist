<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Thermal — Heat, put to work.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="55%" stop-color="#141a22"/>
      <stop offset="100%" stop-color="#1a222c"/>
    </linearGradient>
    <linearGradient id="ember" x1="200" y1="700" x2="900" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c46a2b"/>
      <stop offset="45%" stop-color="#ff6b2c"/>
      <stop offset="100%" stop-color="#f0b060"/>
    </linearGradient>
    <linearGradient id="cool" x1="700" y1="200" x2="1050" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d7a8c"/>
      <stop offset="100%" stop-color="#5eb3c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#ff6b2c" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c46a2b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c0f14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="28%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#5eb3c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c0f14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft grid -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <path d="M0 180h1200M0 360h1200M0 540h1200M0 720h1200"/>
    <path d="M240 0v900M480 0v900M720 0v900M960 0v900"/>
  </g>

  <!-- Large motif: heat recovery coil -->
  <g transform="translate(620, 120)">
    <circle cx="260" cy="300" r="260" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="260" cy="300" r="200" fill="none" stroke="rgba(232,135,58,0.15)" stroke-width="1.5" stroke-dasharray="6 12"/>
    <circle cx="260" cy="300" r="140" fill="none" stroke="rgba(94,179,200,0.2)" stroke-width="1.5"/>

    <!-- Warm coils -->
    <g fill="none" stroke="url(#ember)" stroke-width="8" stroke-linecap="round">
      <path d="M80 420 C120 300, 160 220, 210 160"/>
      <path d="M120 450 C165 320, 220 230, 280 170"/>
      <path d="M165 470 C210 340, 280 245, 350 185"/>
      <path d="M215 485 C255 360, 340 265, 420 210"/>
    </g>
    <!-- Cool coils -->
    <g fill="none" stroke="url(#cool)" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <path d="M340 470 C390 370, 440 290, 500 230"/>
      <path d="M300 490 C355 385, 415 305, 480 250"/>
      <path d="M255 505 C315 400, 385 320, 455 270"/>
    </g>

    <!-- Core -->
    <circle cx="260" cy="280" r="52" fill="#0c0f14" stroke="url(#ember)" stroke-width="4"/>
    <path d="M260 248c-1.8 6.2-7.2 10.4-13.5 12.2 7.2 1.5 12.2 6.9 13.5 14.1 1.5-7.2 6.3-12.6 13.5-14.1-6.3-1.8-11.7-6-13.5-12.2z" fill="url(#ember)"/>
    <circle cx="260" cy="280" r="7" fill="#5eb3c8"/>

    <!-- Nodes -->
    <circle cx="350" cy="280" r="8" fill="#5eb3c8"/>
    <circle cx="170" cy="280" r="7" fill="#e8873a"/>
    <circle cx="260" cy="190" r="7" fill="#f0b060"/>
    <circle cx="260" cy="370" r="7" fill="#3d7a8c"/>
  </g>

  <!-- Brand block -->
  <g transform="translate(88, 160)">
    <!-- Logo mark -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#1c2530"/>
    <path d="M32 12c-1.8 6.3-7.2 10.5-13.5 12.3 7.2 1.5 12.3 6.9 13.5 14 1.5-7.1 6.3-12.5 13.5-14C39.2 22.5 33.8 18.3 32 12z" fill="url(#ember)"/>
    <circle cx="32" cy="46" r="4" fill="#5eb3c8"/>

    <text x="80" y="44" fill="#f2f0eb" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="6">THERMAL</text>

    <text x="0" y="140" fill="#f2f0eb" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Heat, put</text>
    <text x="0" y="220" fill="#f2f0eb" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">to work.</text>

    <rect x="0" y="260" width="48" height="3" rx="1.5" fill="#e8873a"/>

    <text x="0" y="310" fill="#8b98a8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26">
      Industrial heat recovery
    </text>
    <text x="0" y="348" fill="#8b98a8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26">
      returned as clean energy
    </text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="820" width="1200" height="80" fill="rgba(0,0,0,0.35)"/>
  <text x="88" y="868" fill="#c5cdd6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1">Closing the energy loop</text>
  <text x="1112" y="868" fill="#e8873a" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" letter-spacing="2">CLIMATE TECHNOLOGY</text>
</svg>
