<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kinetic Type — Letters made to move.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="0.55" stop-color="#12141a"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="glowA" x1="120" y1="40" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d2e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowB" x1="900" y1="120" x2="1180" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3de0c5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3de0c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="140" y1="300" x2="1060" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d2e"/>
      <stop offset="0.45" stop-color="#ff8a3d"/>
      <stop offset="0.75" stop-color="#e8c56a"/>
      <stop offset="1" stop-color="#3de0c5"/>
    </linearGradient>
    <linearGradient id="mark" x1="84" y1="84" x2="156" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4d2e"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e8c56a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="280" cy="180" r="260" fill="url(#glowA)"/>
  <circle cx="980" cy="260" r="220" fill="url(#glowB)"/>

  <!-- Soft grid -->
  <g stroke="rgba(244,241,234,0.05)" stroke-width="1">
    <path d="M0 180h1200M0 360h1200M0 540h1200M0 720h1200"/>
    <path d="M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/>
  </g>

  <!-- Ghost kinetic letters -->
  <g fill="none" stroke="rgba(244,241,234,0.09)" stroke-width="2" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="800">
    <text x="70" y="250" font-size="150" letter-spacing="-10">K</text>
    <text x="220" y="250" font-size="150" letter-spacing="-10">I</text>
    <text x="310" y="250" font-size="150" letter-spacing="-10">N</text>
    <text x="470" y="250" font-size="150" letter-spacing="-10">E</text>
    <text x="610" y="250" font-size="150" letter-spacing="-10">T</text>
    <text x="740" y="250" font-size="150" letter-spacing="-10">I</text>
    <text x="830" y="250" font-size="150" letter-spacing="-10">C</text>
  </g>

  <!-- Brand mark -->
  <rect x="84" y="84" width="72" height="72" rx="18" fill="url(#mark)"/>
  <text x="120" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="800" fill="#120a07">K</text>

  <text x="176" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#3de0c5">INDEPENDENT TYPE FOUNDRY</text>
  <text x="176" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f1ea">Kinetic Type</text>

  <!-- Main headline -->
  <text x="84" y="430" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#f4f1ea">Letters made</text>
  <text x="84" y="540" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4" fill="url(#word)">to move.</text>

  <!-- Axis chips motif -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="84" y="620" width="118" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(244,241,234,0.18)"/>
    <text x="143" y="648" text-anchor="middle" fill="#a8a59c">WEIGHT</text>

    <rect x="218" y="620" width="110" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(244,241,234,0.18)"/>
    <text x="273" y="648" text-anchor="middle" fill="#a8a59c">WIDTH</text>

    <rect x="344" y="620" width="118" height="44" rx="22" fill="rgba(255,77,46,0.14)" stroke="rgba(255,77,46,0.55)"/>
    <text x="403" y="648" text-anchor="middle" fill="#f4f1ea">MOTION</text>

    <rect x="478" y="620" width="128" height="44" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(244,241,234,0.18)"/>
    <text x="542" y="648" text-anchor="middle" fill="#a8a59c">OPTICAL</text>
  </g>

  <!-- Right specimen panel -->
  <rect x="760" y="300" width="356" height="420" rx="28" fill="#161922" stroke="rgba(244,241,234,0.14)"/>
  <rect x="784" y="324" width="308" height="210" rx="18" fill="#1c2030"/>
  <text x="938" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="10" fill="#f4f1ea">MOVE</text>
  <text x="938" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#6f6c64">VARIABLE LAB</text>

  <text x="804" y="590" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f6c64">WGHT</text>
  <rect x="804" y="604" width="268" height="8" rx="4" fill="rgba(244,241,234,0.08)"/>
  <rect x="804" y="604" width="176" height="8" rx="4" fill="#ff4d2e"/>
  <circle cx="980" cy="608" r="10" fill="#f4f1ea"/>

  <text x="804" y="650" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#6f6c64">WDTH</text>
  <rect x="804" y="664" width="268" height="8" rx="4" fill="rgba(244,241,234,0.08)"/>
  <rect x="804" y="664" width="210" height="8" rx="4" fill="#3de0c5"/>
  <circle cx="1014" cy="668" r="10" fill="#f4f1ea"/>

  <text x="804" y="710" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" fill="#a8a59c">12 families · 28 axes</text>

  <!-- Footer line -->
  <rect x="84" y="820" width="1032" height="1" fill="rgba(244,241,234,0.12)"/>
  <text x="84" y="858" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#a8a59c">Experimental typefaces for screens, identities, and motion systems.</text>
</svg>
