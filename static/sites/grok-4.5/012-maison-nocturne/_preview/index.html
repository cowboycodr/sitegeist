<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Maison Nocturne — Poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0a0c;
      color: #9a958c;
      font-family: Georgia, serif;
    }
    figure {
      margin: 0;
      max-width: min(96vw, 800px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(212, 184, 150, 0.25);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Maison Nocturne gallery poster">
    <figcaption>Preview · poster.svg</figcaption>
  </figure>
</body>
</html>
