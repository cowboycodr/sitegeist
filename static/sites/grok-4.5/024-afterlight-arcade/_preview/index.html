<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Afterlight Arcade — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0614;
      color: #f4eefc;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(96vw, 800px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      color: #8a7aa8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Afterlight Arcade gallery poster">
    <figcaption>Gallery poster · 4:3 · Afterlight Arcade</figcaption>
  </figure>
</body>
</html>
