<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Carbon Zero — Make every tonne visible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1210"/>
      <stop offset="45%" stop-color="#0f1a17"/>
      <stop offset="100%" stop-color="#12201c"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="22%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#3dce9a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3dce9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="88%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8b86d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dce9a"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6eb5c0"/>
      <stop offset="100%" stop-color="#9ad4dc"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b86d"/>
      <stop offset="100%" stop-color="#f0c98a"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dce9a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dce9a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3dce9a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowMint)"/>
  <rect width="1200" height="900" fill="url(#glowAmber)"/>

  <!-- Soft grid -->
  <g stroke="rgba(126,196,166,0.06)" stroke-width="1">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200M0 720h1200M0 840h1200"/>
    <path d="M120 0v900M240 0v900M360 0v900M480 0v900M600 0v900M720 0v900M840 0v900M960 0v900M1080 0v900"/>
  </g>

  <!-- Decorative molecular rings (motif) -->
  <g fill="none" stroke="#3dce9a" stroke-opacity="0.18" stroke-width="1.5">
    <circle cx="980" cy="180" r="72"/>
    <circle cx="980" cy="180" r="48"/>
    <circle cx="980" cy="180" r="24"/>
  </g>
  <g fill="#3dce9a" fill-opacity="0.45">
    <circle cx="980" cy="108" r="5"/>
    <circle cx="1044" cy="216" r="4"/>
    <circle cx="916" cy="216" r="4"/>
  </g>
  <g fill="none" stroke="#e8b86d" stroke-opacity="0.2" stroke-width="1.5">
    <circle cx="160" cy="720" r="56"/>
    <circle cx="160" cy="720" r="32"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(96, 88)">
    <rect width="56" height="56" rx="14" fill="#1a2c27" stroke="#3dce9a" stroke-opacity="0.4"/>
    <path d="M14 40V16h6.2c4.4 0 7.1 2.4 7.1 6.1 0 2.5-1.3 4.4-3.4 5.3L32 40h-5.1l-5.6-6.8H19.6V40H14zm4.2-10.2h2.1c2.2 0 3.5-1.1 3.5-2.8s-1.3-2.7-3.5-2.7h-2.1v5.5z" fill="#3dce9a"/>
    <path d="M34 40l6.4-18h4.6l6.4 18h-4.5l-1.1-3.5h-6.2L38.5 40H34zm5.9-6.9h4.2L42 26.5l-2.1 6.6z" fill="#e8b86d"/>
  </g>

  <!-- Wordmark & category -->
  <text x="172" y="118" fill="#e8f2ed" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Carbon Zero</text>
  <text x="172" y="148" fill="#7ec4a6" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2">CARBON ACCOUNTING</text>

  <!-- Hero copy -->
  <text x="96" y="280" fill="#e8f2ed" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="-2">Make every tonne</text>
  <text x="96" y="360" fill="#3dce9a" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="750" letter-spacing="-2">visible.</text>
  <text x="96" y="420" fill="#9bb5a8" font-family="Segoe UI, system-ui, sans-serif" font-size="24">Emissions intelligence for measurable climate progress.</text>

  <!-- Dashboard card motif -->
  <g transform="translate(96, 480)">
    <rect width="1008" height="300" rx="24" fill="#152420" stroke="rgba(126,196,166,0.22)" stroke-width="1.5"/>
    <rect x="0" y="0" width="1008" height="2" rx="1" fill="url(#cardEdge)"/>

    <!-- Left metrics -->
    <text x="48" y="56" fill="#6f8a7d" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="1.5">ENTERPRISE FOOTPRINT</text>
    <text x="48" y="120" fill="#e8f2ed" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.5">12,480</text>
    <text x="280" y="120" fill="#9bb5a8" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600">tCO₂e</text>
    <text x="48" y="160" fill="#3dce9a" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">↓ 8.4% vs last year</text>

    <!-- Scope bars -->
    <text x="520" y="56" fill="#9bb5a8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Scope 1 · Direct</text>
    <text x="920" y="56" fill="#e8f2ed" font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="end">10%</text>
    <rect x="520" y="68" width="440" height="14" rx="7" fill="#0a1210"/>
    <rect x="520" y="68" width="80" height="14" rx="7" fill="url(#bar1)"/>

    <text x="520" y="122" fill="#9bb5a8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Scope 2 · Energy</text>
    <text x="920" y="122" fill="#e8f2ed" font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="end">25%</text>
    <rect x="520" y="134" width="440" height="14" rx="7" fill="#0a1210"/>
    <rect x="520" y="134" width="185" height="14" rx="7" fill="url(#bar2)"/>

    <text x="520" y="188" fill="#9bb5a8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Scope 3 · Value chain</text>
    <text x="920" y="188" fill="#e8f2ed" font-family="ui-monospace, Consolas, monospace" font-size="14" text-anchor="end">65%</text>
    <rect x="520" y="200" width="440" height="14" rx="7" fill="#0a1210"/>
    <rect x="520" y="200" width="385" height="14" rx="7" fill="url(#bar3)"/>

    <!-- Bottom chips -->
    <rect x="48" y="220" width="168" height="40" rx="20" fill="rgba(61,206,154,0.12)" stroke="rgba(61,206,154,0.3)"/>
    <text x="132" y="246" fill="#3dce9a" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">GHG Protocol</text>

    <rect x="232" y="220" width="156" height="40" rx="20" fill="rgba(110,181,192,0.12)" stroke="rgba(110,181,192,0.3)"/>
    <text x="310" y="246" fill="#9ad4dc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Audit-ready</text>

    <rect x="404" y="220" width="148" height="40" rx="20" fill="rgba(232,184,109,0.12)" stroke="rgba(232,184,109,0.3)"/>
    <text x="478" y="246" fill="#f0c98a" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Scope 1–3</text>
  </g>
</svg>
