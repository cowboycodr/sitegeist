<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Garden — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1016;
      font-family: system-ui, sans-serif;
      color: #9aabbc;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(232, 238, 245, 0.12);
      border-radius: 8px;
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Pixel Garden gallery poster" width="1200" height="900">
    <figcaption>Pixel Garden — promotional poster (4:3)</figcaption>
  </figure>
</body>
</html>
