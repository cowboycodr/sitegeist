<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Pixel Garden — Small worlds. Strange rules.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="55%" stop-color="#0e141c"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a2f"/>
      <stop offset="100%" stop-color="#142820"/>
    </linearGradient>
    <pattern id="soilDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#3d2a1f"/>
      <rect x="0" y="0" width="4" height="4" fill="#4a3428"/>
      <rect x="8" y="8" width="4" height="4" fill="#2f2018"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Soft glows -->
  <rect x="720" y="40" width="280" height="200" fill="#f0c14a" opacity="0.06"/>
  <rect x="80" y="120" width="320" height="240" fill="#5ecf8a" opacity="0.05"/>

  <!-- Stars (pixel blocks) -->
  <rect x="96" y="72" width="8" height="8" fill="#dce8f5" opacity="0.75"/>
  <rect x="180" y="120" width="6" height="6" fill="#dce8f5" opacity="0.45"/>
  <rect x="300" y="56" width="8" height="8" fill="#dce8f5" opacity="0.65"/>
  <rect x="420" y="100" width="6" height="6" fill="#dce8f5" opacity="0.4"/>
  <rect x="560" y="48" width="8" height="8" fill="#dce8f5" opacity="0.7"/>
  <rect x="980" y="88" width="8" height="8" fill="#dce8f5" opacity="0.55"/>
  <rect x="1080" y="140" width="6" height="6" fill="#dce8f5" opacity="0.4"/>
  <rect x="860" y="60" width="6" height="6" fill="#dce8f5" opacity="0.5"/>

  <!-- Moon -->
  <rect x="940" y="80" width="56" height="56" fill="#f5e6b8"/>
  <rect x="952" y="92" width="20" height="20" fill="#e8d49a" opacity="0.55"/>

  <!-- Distant hills -->
  <rect x="0" y="420" width="1200" height="200" fill="url(#hill)"/>
  <rect x="0" y="380" width="160" height="40" fill="#1e3a2f"/>
  <rect x="160" y="400" width="120" height="20" fill="#1e3a2f"/>
  <rect x="400" y="360" width="220" height="60" fill="#1a3328"/>
  <rect x="620" y="390" width="140" height="30" fill="#1e3a2f"/>
  <rect x="900" y="370" width="200" height="50" fill="#1a3328"/>
  <rect x="1100" y="400" width="100" height="20" fill="#1e3a2f"/>

  <!-- Soil bed -->
  <rect x="80" y="560" width="1040" height="220" fill="url(#soilDots)"/>
  <rect x="80" y="548" width="1040" height="12" fill="#5a4030"/>

  <!-- Path -->
  <rect x="560" y="560" width="80" height="220" fill="#6b5344"/>
  <rect x="576" y="580" width="12" height="12" fill="#7a6252"/>
  <rect x="600" y="640" width="12" height="12" fill="#7a6252"/>
  <rect x="576" y="700" width="12" height="12" fill="#7a6252"/>

  <!-- Left tree -->
  <rect x="180" y="480" width="28" height="80" fill="#5c3d2e"/>
  <rect x="140" y="380" width="108" height="56" fill="#2f6f48"/>
  <rect x="156" y="340" width="76" height="48" fill="#3d8b5a"/>
  <rect x="172" y="308" width="44" height="40" fill="#5ecf8a"/>
  <rect x="128" y="400" width="28" height="28" fill="#2f6f48"/>
  <rect x="232" y="400" width="28" height="28" fill="#2f6f48"/>

  <!-- Mushrooms -->
  <rect x="300" y="520" width="16" height="40" fill="#e8dcc8"/>
  <rect x="284" y="492" width="48" height="32" fill="#e85d5d"/>
  <rect x="296" y="492" width="16" height="12" fill="#f4a0a0"/>
  <rect x="360" y="536" width="12" height="24" fill="#e8dcc8"/>
  <rect x="348" y="516" width="36" height="24" fill="#c45ad4"/>

  <!-- Center flowers -->
  <rect x="460" y="500" width="20" height="48" fill="#4a7c3f"/>
  <rect x="448" y="460" width="44" height="40" fill="#f0c14a"/>
  <rect x="460" y="448" width="20" height="16" fill="#f5d76e"/>

  <rect x="680" y="488" width="18" height="60" fill="#4a7c3f"/>
  <rect x="668" y="448" width="42" height="40" fill="#6ec8f0"/>
  <rect x="680" y="436" width="18" height="16" fill="#a8e0f8"/>

  <!-- Right bush -->
  <rect x="860" y="480" width="120" height="80" fill="#2f6f48"/>
  <rect x="888" y="448" width="64" height="40" fill="#3d8b5a"/>
  <rect x="880" y="500" width="16" height="16" fill="#7dcea0"/>
  <rect x="940" y="520" width="16" height="16" fill="#7dcea0"/>
  <rect x="910" y="540" width="16" height="16" fill="#5ecf8a"/>

  <!-- Fence -->
  <rect x="80" y="528" width="16" height="40" fill="#8b7355"/>
  <rect x="1104" y="528" width="16" height="40" fill="#8b7355"/>
  <rect x="96" y="540" width="1008" height="8" fill="#8b7355"/>

  <!-- Fireflies -->
  <rect x="340" y="300" width="12" height="12" fill="#f5e66e"/>
  <rect x="520" y="260" width="10" height="10" fill="#f5e66e" opacity="0.75"/>
  <rect x="760" y="320" width="12" height="12" fill="#f5e66e" opacity="0.9"/>
  <rect x="1000" y="280" width="10" height="10" fill="#f5e66e" opacity="0.6"/>

  <!-- Frame corners -->
  <rect x="32" y="32" width="24" height="24" fill="#5ecf8a"/>
  <rect x="1144" y="32" width="24" height="24" fill="#5ecf8a"/>
  <rect x="32" y="844" width="24" height="24" fill="#5ecf8a"/>
  <rect x="1144" y="844" width="24" height="24" fill="#5ecf8a"/>
  <rect x="32" y="32" width="120" height="6" fill="#5ecf8a" opacity="0.5"/>
  <rect x="1048" y="32" width="120" height="6" fill="#5ecf8a" opacity="0.5"/>
  <rect x="32" y="862" width="120" height="6" fill="#5ecf8a" opacity="0.5"/>
  <rect x="1048" y="862" width="120" height="6" fill="#5ecf8a" opacity="0.5"/>

  <!-- Brand panel -->
  <rect x="80" y="72" width="520" height="200" rx="8" fill="#0e141c" opacity="0.72"/>
  <rect x="80" y="72" width="520" height="200" rx="8" fill="none" stroke="#5ecf8a" stroke-width="3" opacity="0.45"/>

  <!-- Small plant mark -->
  <rect x="112" y="104" width="16" height="16" fill="#5ecf8a"/>
  <rect x="96" y="120" width="16" height="16" fill="#5ecf8a"/>
  <rect x="128" y="120" width="16" height="16" fill="#5ecf8a"/>
  <rect x="112" y="136" width="16" height="24" fill="#8b7355"/>

  <text x="160" y="140" fill="#e8eef5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">Pixel Garden</text>
  <text x="112" y="198" fill="#5ecf8a" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.8">Small worlds.</text>
  <text x="112" y="242" fill="#9aabbc" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.8">Strange rules.</text>

  <!-- Category chip -->
  <rect x="80" y="792" width="280" height="40" rx="6" fill="#151d28" stroke="#3d8b5a" stroke-width="2"/>
  <text x="100" y="818" fill="#a8e0c0" font-family="Consolas, Liberation Mono, monospace" font-size="18" letter-spacing="2">INDEPENDENT GAME STUDIO</text>
</svg>
