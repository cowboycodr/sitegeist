<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Moss and Matter — Materials that return to earth">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121812"/>
      <stop offset="48%" stop-color="#1a2418"/>
      <stop offset="100%" stop-color="#2a3d2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#4f7349" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a2418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="22%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#3d5c3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#121812" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft organic edge band -->
  <path d="M0 0h1200v90c-180 40-360 20-520 55-140 30-240 80-380 70C180 205 80 160 0 180V0z" fill="#243028" opacity="0.55"/>
  <path d="M0 900h1200v-70c-200-35-380-10-560-45-150-30-280-75-420-55-140 20-160 70-220 90H0z" fill="#1a2418" opacity="0.7"/>

  <!-- Mycelium network motif -->
  <g fill="none" stroke="#8fbc7a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M720 180 C780 240, 820 300, 860 390 C900 470, 940 520, 1020 580" stroke-width="2.2" opacity="0.55"/>
    <path d="M860 390 C800 410, 760 460, 740 530 C720 590, 700 640, 680 700" stroke-width="1.8" opacity="0.4"/>
    <path d="M860 390 C920 360, 980 350, 1050 370" stroke-width="1.6" opacity="0.35"/>
    <path d="M780 250 C740 280, 700 270, 660 240 C620 210, 580 200, 540 220" stroke-width="1.6" opacity="0.35"/>
    <path d="M920 480 C960 510, 1000 560, 1040 640" stroke-width="1.5" opacity="0.3"/>
    <path d="M200 620 C280 560, 340 500, 400 430 C450 370, 500 330, 560 300" stroke-width="2" opacity="0.4"/>
    <path d="M400 430 C380 480, 360 520, 320 580" stroke-width="1.5" opacity="0.3"/>
    <path d="M560 300 C600 280, 640 290, 680 320" stroke-width="1.4" opacity="0.28"/>
    <path d="M180 280 C240 320, 300 340, 360 320 C420 300, 460 260, 480 210" stroke-width="1.5" opacity="0.28"/>
    <path d="M900 200 C940 230, 970 280, 990 340" stroke-width="1.3" opacity="0.25"/>
  </g>

  <!-- Network nodes -->
  <g fill="#c4e0a8">
    <circle cx="860" cy="390" r="7" opacity="0.85"/>
    <circle cx="720" cy="180" r="4.5" opacity="0.55"/>
    <circle cx="1020" cy="580" r="5" opacity="0.55"/>
    <circle cx="740" cy="530" r="4" opacity="0.5"/>
    <circle cx="560" cy="300" r="6" opacity="0.7"/>
    <circle cx="400" cy="430" r="4.5" opacity="0.55"/>
    <circle cx="200" cy="620" r="4" opacity="0.4"/>
    <circle cx="1050" cy="370" r="3.5" opacity="0.45"/>
    <circle cx="540" cy="220" r="3.5" opacity="0.4"/>
    <circle cx="680" cy="700" r="3.5" opacity="0.4"/>
    <circle cx="480" cy="210" r="3" opacity="0.35"/>
  </g>

  <!-- Decorative leaf / spore mark (brand mark) -->
  <g transform="translate(148, 210)">
    <circle cx="48" cy="48" r="52" fill="none" stroke="#8fbc7a" stroke-width="2" opacity="0.55"/>
    <circle cx="48" cy="48" r="38" fill="none" stroke="#6b8f5e" stroke-width="1.2" opacity="0.4"/>
    <path d="M48 14c-5 10-15 15-24 17 9 2.5 16.5 10 19 21.5 2.5-11.5 10-19 19-21.5-9-2-14-9-14-17z" fill="#8fbc7a"/>
    <circle cx="48" cy="52" r="5" fill="#c4e0a8" opacity="0.75"/>
  </g>

  <!-- Category pill -->
  <rect x="148" y="360" width="220" height="36" rx="18" fill="#2f3d30" stroke="#6b8f5e" stroke-width="1.2"/>
  <text x="258" y="383" text-anchor="middle" fill="#c4e0a8" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="15" letter-spacing="3">BIOMATERIALS</text>

  <!-- Title -->
  <text x="148" y="470" fill="#f4f1e8" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="86" font-weight="600" letter-spacing="-1.5">Moss &amp; Matter</text>

  <!-- Tagline -->
  <text x="148" y="540" fill="#a8c49a" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="32" font-style="italic">Materials that return to earth.</text>

  <!-- Supporting line -->
  <text x="148" y="600" fill="#8fbc7a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" opacity="0.9">Mycelium packaging · textiles · interiors</text>

  <!-- Accent rule -->
  <rect x="148" y="640" width="120" height="3" rx="1.5" fill="#6b8f5e"/>

  <!-- Bottom label -->
  <text x="148" y="720" fill="#6b8f5e" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" letter-spacing="2.5" font-weight="600">GROWN, NOT MANUFACTURED</text>

  <!-- Small corner motif -->
  <g transform="translate(980, 720)" opacity="0.55">
    <path d="M40 10 C55 35, 70 50, 95 60 C70 65, 52 80, 40 105 C28 80, 10 65, -15 60 C10 50, 25 35, 40 10z" fill="#8fbc7a" opacity="0.7"/>
  </g>
</svg>
