<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <title>Moss &amp; Matter — Gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a2418;
      font-family: system-ui, sans-serif;
      color: #e8f0d8;
    }
    figure {
      margin: 0;
      width: min(100% - 2rem, 900px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Moss and Matter gallery poster">
    <figcaption>Preview poster for Moss &amp; Matter (4:3)</figcaption>
  </figure>
</body>
</html>
