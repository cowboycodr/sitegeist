<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Solar Flare festival poster — Joshua Tree, September 18–20">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0818"/>
      <stop offset="35%" stop-color="#1a0f2e"/>
      <stop offset="65%" stop-color="#2a1530"/>
      <stop offset="100%" stop-color="#120810"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="62%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="15%" stop-color="#f0b429"/>
      <stop offset="40%" stop-color="#ff6b2c"/>
      <stop offset="65%" stop-color="#ff3d6e"/>
      <stop offset="100%" stop-color="rgba(255,61,110,0)"/>
    </radialGradient>
    <radialGradient id="glowA" cx="30%" cy="40%" r="35%">
      <stop offset="0%" stop-color="rgba(217,70,239,0.45)"/>
      <stop offset="100%" stop-color="rgba(217,70,239,0)"/>
    </radialGradient>
    <radialGradient id="glowB" cx="75%" cy="55%" r="30%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.35)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="40%" stop-color="#f0b429"/>
      <stop offset="75%" stop-color="#ff6b2c"/>
      <stop offset="100%" stop-color="#ff3d6e"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e18"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>
    <linearGradient id="horizonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,159,67,0)"/>
      <stop offset="30%" stop-color="rgba(255,159,67,0.7)"/>
      <stop offset="55%" stop-color="rgba(255,61,110,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,107,44,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>

  <!-- Stars -->
  <g fill="#f6efe6" opacity="0.7">
    <circle cx="80" cy="70" r="1.5"/>
    <circle cx="160" cy="120" r="1"/>
    <circle cx="240" cy="55" r="1.2"/>
    <circle cx="320" cy="140" r="1"/>
    <circle cx="420" cy="80" r="1.5"/>
    <circle cx="90" cy="200" r="1"/>
    <circle cx="200" cy="250" r="1.2"/>
    <circle cx="1050" cy="90" r="1.5"/>
    <circle cx="1120" cy="160" r="1"/>
    <circle cx="980" cy="50" r="1.2"/>
    <circle cx="1080" cy="280" r="1"/>
    <circle cx="920" cy="130" r="1"/>
    <circle cx="50" cy="320" r="1"/>
    <circle cx="150" cy="380" r="0.8"/>
    <circle cx="1100" cy="350" r="1"/>
    <circle cx="850" cy="60" r="1"/>
    <circle cx="780" cy="110" r="0.8"/>
    <circle cx="500" cy="45" r="1"/>
  </g>

  <!-- Solar flare rays -->
  <g opacity="0.55" stroke-linecap="round">
    <line x1="744" y1="288" x2="980" y2="120" stroke="#ff6b2c" stroke-width="3"/>
    <line x1="744" y1="288" x2="1050" y2="220" stroke="#ff3d6e" stroke-width="2.5"/>
    <line x1="744" y1="288" x2="1020" y2="340" stroke="#f0b429" stroke-width="2"/>
    <line x1="744" y1="288" x2="920" y2="80" stroke="#ff9f43" stroke-width="2"/>
    <line x1="744" y1="288" x2="1100" y2="160" stroke="#ff6b2c" stroke-width="1.5"/>
    <line x1="744" y1="288" x2="880" y2="420" stroke="#d946ef" stroke-width="2"/>
    <line x1="744" y1="288" x2="600" y2="80" stroke="#f0b429" stroke-width="2"/>
    <line x1="744" y1="288" x2="540" y2="160" stroke="#ff6b2c" stroke-width="1.5"/>
    <line x1="744" y1="288" x2="500" y2="260" stroke="#ff3d6e" stroke-width="2"/>
  </g>

  <!-- Main sun / flare -->
  <circle cx="744" cy="288" r="220" fill="url(#sunCore)"/>
  <circle cx="744" cy="288" r="48" fill="#fff6e8" opacity="0.95"/>
  <circle cx="744" cy="288" r="72" fill="none" stroke="#f0b429" stroke-width="2" opacity="0.5"/>
  <circle cx="744" cy="288" r="100" fill="none" stroke="#ff6b2c" stroke-width="1.5" opacity="0.35"/>

  <!-- Horizon glow -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="url(#horizonLine)" stroke-width="3"/>
  <ellipse cx="700" cy="620" rx="380" ry="28" fill="rgba(255,107,44,0.2)"/>

  <!-- Desert dunes -->
  <path d="M0 700 C180 640, 320 680, 480 660 C640 640, 780 700, 960 650 C1080 620, 1160 660, 1200 640 L1200 900 L0 900 Z" fill="#160c18"/>
  <path d="M0 780 C200 720, 400 760, 580 740 C760 720, 900 780, 1100 750 C1160 740, 1200 760, 1200 760 L1200 900 L0 900 Z" fill="url(#dune1)"/>
  <path d="M0 850 C250 810, 500 870, 750 830 C950 800, 1100 850, 1200 820 L1200 900 L0 900 Z" fill="#0a0612"/>

  <!-- Joshua tree silhouettes -->
  <g fill="#0a0612" opacity="0.85">
    <!-- Left tree -->
    <path d="M180 780 L190 640 L200 780 Z"/>
    <path d="M190 700 L150 660 L155 655 L195 695 Z"/>
    <path d="M195 680 L240 640 L245 645 L200 685 Z"/>
    <ellipse cx="190" cy="635" rx="10" ry="14" />
    <ellipse cx="148" cy="655" rx="7" ry="10"/>
    <ellipse cx="245" cy="635" rx="7" ry="10"/>
    <!-- Right small tree -->
    <path d="M1050 800 L1056 720 L1062 800 Z"/>
    <path d="M1056 760 L1025 730 L1029 726 L1058 756 Z"/>
    <path d="M1058 750 L1085 725 L1088 729 L1061 754 Z"/>
    <ellipse cx="1056" cy="715" rx="7" ry="10"/>
  </g>

  <!-- Typography block -->
  <text x="80" y="160" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="22" font-weight="600" letter-spacing="6" fill="#ff9f43">JOSHUA TREE · SEP 18–20</text>

  <text x="80" y="280" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="108" font-weight="700" fill="url(#titleGrad)" letter-spacing="-2">Solar Flare</text>

  <text x="80" y="360" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="36" font-style="italic" fill="#f6efe6">Three nights. No small feelings.</text>

  <text x="80" y="430" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#b8a99a">Future-facing music · Radiant art · Nights without edges</text>

  <!-- Bottom bar -->
  <rect x="0" y="860" width="1200" height="40" fill="#07040d"/>
  <text x="600" y="886" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7a6b62">FESTIVAL PASSES · DESERT GATHERING</text>
</svg>
