<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Wavelength — Listen to the ocean change">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="45%" stop-color="#0a1c2e"/>
      <stop offset="100%" stop-color="#081420"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7ee8d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#061018" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee8d4"/>
      <stop offset="50%" stop-color="#5ec8ff"/>
      <stop offset="100%" stop-color="#e8b86d"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <circle cx="980" cy="160" r="220" fill="url(#orb)"/>
  <circle cx="180" cy="720" r="180" fill="url(#orb)" opacity="0.6"/>

  <!-- Depth grid -->
  <g stroke="#1a3a52" stroke-width="1" opacity="0.55">
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="440" x2="1120" y2="440"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="80" y1="680" x2="1120" y2="680"/>
    <line x1="200" y1="160" x2="200" y2="720"/>
    <line x1="400" y1="160" x2="400" y2="720"/>
    <line x1="600" y1="160" x2="600" y2="720"/>
    <line x1="800" y1="160" x2="800" y2="720"/>
    <line x1="1000" y1="160" x2="1000" y2="720"/>
  </g>

  <!-- Hydrophone motif -->
  <g transform="translate(140, 240)">
    <rect x="0" y="0" width="28" height="120" rx="6" fill="#0f2a40" stroke="#7ee8d4" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="14" cy="28" r="8" fill="none" stroke="#5ec8ff" stroke-width="2"/>
    <circle cx="14" cy="28" r="3" fill="#7ee8d4"/>
    <path d="M6 70 h16 M6 85 h16 M6 100 h12" stroke="#3d9e8c" stroke-width="2" stroke-linecap="round"/>
    <!-- cable -->
    <path d="M14 120 C14 160, 40 180, 80 200" fill="none" stroke="#2a7aa8" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- Large waveform -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M80 520 C160 420, 240 620, 320 520 S480 380, 560 520 S720 660, 800 520 S960 400, 1040 520 S1120 580, 1120 520"
      stroke="#e8b86d"
      stroke-width="3"
      opacity="0.35"
    />
    <path
      d="M80 480 C150 400, 220 560, 300 480 S460 360, 540 480 S700 600, 780 480 S940 380, 1020 480 S1120 540, 1120 480"
      stroke="#5ec8ff"
      stroke-width="4"
      opacity="0.55"
    />
    <path
      d="M80 500 C140 380, 200 620, 280 500 S440 340, 520 500 S680 640, 760 500 S920 360, 1000 500 S1120 560, 1120 500"
      stroke="url(#waveFill)"
      stroke-width="6"
      opacity="0.95"
    />
  </g>

  <!-- Sound rings near hydrophone -->
  <g fill="none" stroke="#7ee8d4" stroke-opacity="0.25">
    <circle cx="154" cy="268" r="40" stroke-width="1.5"/>
    <circle cx="154" cy="268" r="70" stroke-width="1.2"/>
    <circle cx="154" cy="268" r="100" stroke-width="1"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80, 72)">
    <rect width="56" height="56" rx="14" fill="#0f2a40" stroke="#7ee8d4" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M10 34 C16 18, 22 18, 28 34 S40 50, 46 34" fill="none" stroke="#7ee8d4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="16" r="3.5" fill="#5ec8ff"/>
  </g>

  <!-- Typography -->
  <text x="156" y="112" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="48" font-weight="600" fill="#e6f0f5" letter-spacing="1">Wavelength</text>
  <text x="80" y="180" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#7ee8d4" letter-spacing="6" text-transform="uppercase">OCEAN INTELLIGENCE</text>

  <text x="80" y="760" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="52" font-weight="600" fill="#e6f0f5">Listen to the ocean change.</text>
  <text x="80" y="820" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#8aa3b5">Open acoustic sensing for marine research</text>

  <!-- Corner badge -->
  <g transform="translate(900, 760)">
    <rect width="220" height="72" rx="12" fill="#0f2a40" stroke="#7ee8d4" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="20" y="32" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#7ee8d4" letter-spacing="2">148 NODES</text>
    <text x="20" y="54" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#e6f0f5">Active hydrophones</text>
  </g>
</svg>
