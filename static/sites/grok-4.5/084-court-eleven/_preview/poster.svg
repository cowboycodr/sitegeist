<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Court Eleven — New rituals for the old game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1210"/>
      <stop offset="55%" stop-color="#1a3d2e"/>
      <stop offset="100%" stop-color="#163528"/>
    </linearGradient>
    <linearGradient id="clayBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c45c3e"/>
      <stop offset="100%" stop-color="#a34830"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft court wash -->
  <rect x="80" y="70" width="1040" height="760" fill="none" stroke="#c8e86c" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Court diagram motif -->
  <g transform="translate(140 150)" fill="none" stroke="#f4f0e6" stroke-opacity="0.22">
    <rect x="0" y="0" width="920" height="520" stroke-width="3"/>
    <line x1="460" y1="0" x2="460" y2="520" stroke-width="2"/>
    <rect x="0" y="100" width="300" height="320" stroke-width="2"/>
    <rect x="620" y="100" width="300" height="320" stroke-width="2"/>
    <line x1="150" y1="100" x2="150" y2="420" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="770" y1="100" x2="770" y2="420" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="300" y1="260" x2="620" y2="260" stroke-width="2"/>
  </g>

  <!-- Accent clay strip -->
  <rect x="0" y="0" width="18" height="900" fill="url(#clayBand)"/>

  <!-- Large 11 mark -->
  <text x="980" y="780" text-anchor="end" fill="#c8e86c" fill-opacity="0.14" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="500" letter-spacing="-18">11</text>

  <!-- Brand block -->
  <g transform="translate(120 250)">
    <circle cx="36" cy="36" r="34" fill="none" stroke="#c8e86c" stroke-width="3"/>
    <text x="36" y="48" text-anchor="middle" fill="#f4f0e6" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600">11</text>

    <text x="0" y="140" fill="#f4f0e6" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="500" letter-spacing="-2">Court Eleven</text>
    <text x="4" y="200" fill="#c8e86c" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic">New rituals for the old game.</text>

    <rect x="4" y="240" width="72" height="4" fill="#c45c3e"/>

    <text x="4" y="300" fill="#d9d2c3" font-family="system-ui, -apple-system, sans-serif" font-size="22" letter-spacing="4" font-weight="600">BROOKLYN  ·  OPEN 06:00</text>
    <text x="4" y="348" fill="#d9d2c3" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill-opacity="0.9">Open play  ·  Coaching  ·  Recovery  ·  House</text>
  </g>

  <!-- Bottom label -->
  <rect x="0" y="840" width="1200" height="60" fill="#0c1210" fill-opacity="0.45"/>
  <text x="120" y="878" fill="#f4f0e6" font-family="system-ui, -apple-system, sans-serif" font-size="18" letter-spacing="3" font-weight="600">DESIGN-LED CITY TENNIS CLUB</text>
  <text x="1080" y="878" text-anchor="end" fill="#c8e86c" font-family="system-ui, -apple-system, sans-serif" font-size="18" letter-spacing="2">GOWANUS</text>
</svg>
