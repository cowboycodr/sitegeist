<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Court Eleven — Gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1a1a;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    figure {
      margin: 0;
      max-width: min(960px, 94vw);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #333;
      background: #0c1210;
    }
    figcaption {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Court Eleven gallery poster">
    <figcaption>Preview poster for Court Eleven (4:3, static SVG)</figcaption>
  </figure>
</body>
</html>
