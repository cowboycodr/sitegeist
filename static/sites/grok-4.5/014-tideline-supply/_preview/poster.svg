<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tideline Supply — Made for water without walls.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a22"/>
      <stop offset="45%" stop-color="#122b38"/>
      <stop offset="78%" stop-color="#1a4a5c"/>
      <stop offset="100%" stop-color="#2a6d6a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#a89070"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8f2f4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8f2f4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed coastal field -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="980" cy="160" rx="220" ry="140" fill="url(#glow)"/>
  <circle cx="980" cy="170" r="54" fill="#d4c4a8" opacity="0.88"/>
  <circle cx="980" cy="170" r="40" fill="#e8f2f4" opacity="0.12"/>

  <!-- Distant headland silhouette -->
  <path d="M0 430 L180 360 L280 390 L420 320 L560 370 L700 300 L860 350 L1020 280 L1200 340 L1200 520 L0 520 Z" fill="#0a1520" opacity="0.55"/>
  <path d="M0 450 L160 400 L300 430 L450 370 L620 420 L780 360 L960 400 L1200 370 L1200 520 L0 520 Z" fill="#122b38" opacity="0.7"/>

  <!-- Tideline / water meeting sand -->
  <path d="M0 520 C160 480 280 560 440 520 C600 480 720 560 880 515 C1000 485 1100 540 1200 510 L1200 900 L0 900 Z" fill="url(#sand)"/>
  <path d="M0 520 C160 480 280 560 440 520 C600 480 720 560 880 515 C1000 485 1100 540 1200 510" fill="none" stroke="#e8f2f4" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <path d="M0 548 C180 510 300 590 470 545 C640 500 760 585 930 540 C1040 512 1120 560 1200 535" fill="none" stroke="#2d7a8a" stroke-width="3.5" opacity="0.8"/>
  <path d="M0 575 C200 545 340 610 520 575 C700 540 820 610 1000 575 C1100 555 1160 590 1200 570" fill="none" stroke="#1a4a5c" stroke-width="2.5" opacity="0.45"/>

  <!-- Small board / field motif -->
  <g transform="translate(860 620) rotate(-18)">
    <ellipse cx="0" cy="0" rx="70" ry="14" fill="#0c1a22" opacity="0.55"/>
    <rect x="-8" y="-78" width="16" height="78" rx="8" fill="#e8f2f4" opacity="0.75"/>
    <path d="M-8 -70 Q0 -95 8 -70" fill="#c45c3e" opacity="0.85"/>
  </g>

  <!-- Brand block -->
  <g transform="translate(88 96)">
    <rect width="56" height="56" rx="6" fill="#e8f2f4"/>
    <path d="M10 36c6-4.5 12-4.5 18 0s12 4.5 18 0" fill="none" stroke="#122b38" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M10 42c6-4.5 12-4.5 18 0s12 4.5 18 0" fill="none" stroke="#2d7a8a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="28" cy="20" r="5" fill="none" stroke="#8b7355" stroke-width="2"/>
    <path d="M28 25 v7" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="164" y="124" fill="#d4c4a8" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="18" letter-spacing="6">PACIFIC FIELD GOODS</text>
  <text x="88" y="230" fill="#f7f5f0" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="600" letter-spacing="-1.5">Tideline Supply</text>
  <text x="88" y="310" fill="#e8f2f4" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="42" opacity="0.92">Made for water without walls.</text>

  <!-- Accent rule -->
  <rect x="88" y="348" width="120" height="3" fill="#c45c3e"/>

  <text x="88" y="400" fill="#d4c4a8" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" opacity="0.9">Durable coastal goods · Field-tested layers</text>

  <!-- Lower corner label -->
  <text x="88" y="840" fill="#0c1a22" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="3" opacity="0.7">REMOTE BREAKS · LONG DAYS OUTSIDE</text>
</svg>
