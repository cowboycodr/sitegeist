<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tiny Giants — Big wonder for little minds">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7EB"/>
      <stop offset="45%" stop-color="#FFE4A3"/>
      <stop offset="100%" stop-color="#FFD8CC"/>
    </linearGradient>
    <linearGradient id="hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FD4B8"/>
      <stop offset="100%" stop-color="#5FB896"/>
    </linearGradient>
    <linearGradient id="stage" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#C8F0DF"/>
      <stop offset="50%" stop-color="#FFE4A3"/>
      <stop offset="100%" stop-color="#FFD8CC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC44D"/>
      <stop offset="55%" stop-color="#F05A3A"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Soft orbs -->
  <circle cx="160" cy="140" r="120" fill="#6B5CE7" opacity="0.10"/>
  <circle cx="1040" cy="180" r="160" fill="#F05A3A" opacity="0.10"/>
  <circle cx="980" cy="720" r="140" fill="#0F9B94" opacity="0.12"/>

  <!-- Decorative hill -->
  <ellipse cx="600" cy="920" rx="780" ry="280" fill="url(#hill)"/>

  <!-- Main stage blob -->
  <ellipse cx="760" cy="470" rx="280" ry="260" fill="url(#stage)"/>
  <ellipse cx="760" cy="470" rx="280" ry="260" fill="none" stroke="#1C2430" stroke-width="6" opacity="0.08"/>

  <!-- Building blocks -->
  <g transform="translate(620 360) rotate(-12)">
    <rect x="0" y="0" width="110" height="110" rx="16" fill="#F05A3A"/>
    <rect x="10" y="10" width="90" height="18" rx="6" fill="#FFFFFF" opacity="0.25"/>
  </g>
  <g transform="translate(710 320) rotate(8)">
    <rect x="0" y="0" width="88" height="88" rx="14" fill="#FFC44D"/>
    <rect x="10" y="10" width="68" height="14" rx="5" fill="#FFFFFF" opacity="0.3"/>
  </g>
  <g transform="translate(680 430) rotate(4)">
    <rect x="0" y="0" width="78" height="78" rx="12" fill="#6B5CE7"/>
    <rect x="8" y="8" width="62" height="12" rx="4" fill="#FFFFFF" opacity="0.28"/>
  </g>

  <!-- Giant footprint -->
  <g transform="translate(820 430) rotate(18)">
    <ellipse cx="70" cy="110" rx="72" ry="100" fill="#0F9B94"/>
    <ellipse cx="28" cy="28" rx="22" ry="28" fill="#0F9B94"/>
    <ellipse cx="62" cy="18" rx="20" ry="26" fill="#0F9B94"/>
    <ellipse cx="96" cy="24" rx="18" ry="24" fill="#0F9B94"/>
    <ellipse cx="124" cy="42" rx="16" ry="20" fill="#0F9B94"/>
    <ellipse cx="78" cy="150" rx="22" ry="16" fill="#FFF7EB" opacity="0.25"/>
  </g>

  <!-- Magnifier -->
  <g transform="translate(700 470)">
    <circle cx="0" cy="0" r="58" fill="#FFFFFF" fill-opacity="0.35" stroke="#1C2430" stroke-width="16"/>
    <line x1="42" y1="42" x2="92" y2="98" stroke="#1C2430" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Sparks -->
  <circle cx="900" cy="300" r="10" fill="#FFC44D"/>
  <circle cx="900" cy="300" r="18" fill="#FFC44D" opacity="0.25"/>
  <circle cx="580" cy="420" r="8" fill="#F05A3A"/>
  <circle cx="580" cy="420" r="16" fill="#F05A3A" opacity="0.22"/>
  <circle cx="960" cy="560" r="9" fill="#6B5CE7"/>
  <circle cx="960" cy="560" r="17" fill="#6B5CE7" opacity="0.22"/>

  <!-- Brand mark -->
  <g transform="translate(96 88)">
    <rect width="72" height="72" rx="20" fill="url(#brand)"/>
    <circle cx="48" cy="28" r="10" fill="#FFF7EB"/>
    <circle cx="36" cy="40" r="8" fill="#1C2430"/>
  </g>

  <!-- Category pill -->
  <rect x="96" y="196" width="268" height="48" rx="24" fill="#FFFFFF" stroke="#1C2430" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="128" cy="220" r="8" fill="#F05A3A"/>
  <text x="148" y="227" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="20" font-weight="700" fill="#6B5CE7" letter-spacing="2">CHILDREN'S MUSEUM</text>

  <!-- Title -->
  <text x="96" y="320" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="96" font-weight="700" fill="#1C2430" letter-spacing="-2">Tiny Giants</text>

  <!-- Tagline -->
  <text x="96" y="400" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="42" font-style="italic" fill="#F05A3A">Big wonder for little minds.</text>

  <!-- Description lines -->
  <text x="96" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#3D4A5C">Where children build worlds, chase questions,</text>
  <text x="96" y="508" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#3D4A5C">and make magnificent messes.</text>

  <!-- Feature chips -->
  <g transform="translate(96 580)">
    <rect width="170" height="52" rx="26" fill="#FFFFFF"/>
    <text x="85" y="33" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C2430">12 play worlds</text>
  </g>
  <g transform="translate(286 580)">
    <rect width="180" height="52" rx="26" fill="#0F9B94"/>
    <text x="90" y="33" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Hands-on daily</text>
  </g>
  <g transform="translate(486 580)">
    <rect width="160" height="52" rx="26" fill="#F05A3A"/>
    <text x="80" y="33" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Ages 0–10</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="820" width="1200" height="80" fill="#1C2430"/>
  <text x="96" y="868" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FFC44D">Plan your visit · See today's activities</text>
  <text x="1104" y="868" text-anchor="end" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="24" font-weight="700" fill="#FFFFFF">Tiny Giants</text>
</svg>
