<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <title>Soft Earth Studio — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #2a1d17;
      font-family: system-ui, sans-serif;
      color: #ebe3d4;
    }
    figure {
      margin: 1.5rem;
      max-width: min(960px, 100% - 2rem);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Soft Earth Studio gallery poster">
    <figcaption>Gallery poster · 4:3 · Soft Earth Studio</figcaption>
  </figure>
</body>
</html>
