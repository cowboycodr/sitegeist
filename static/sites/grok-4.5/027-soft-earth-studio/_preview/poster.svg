<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Soft Earth Studio — Made slowly enough to keep the fingerprints.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="55%" stop-color="#ebe3d4"/>
      <stop offset="100%" stop-color="#dcc9b0"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e0b090"/>
      <stop offset="50%" stop-color="#c4785a"/>
      <stop offset="100%" stop-color="#8f4a35"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9a7c"/>
      <stop offset="100%" stop-color="#5a6a52"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9a98"/>
      <stop offset="100%" stop-color="#3d5654"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f4efe6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f4efe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a85a3f" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a85a3f"/>
      <stop offset="70%" stop-color="#a85a3f"/>
      <stop offset="100%" stop-color="#a85a3f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- soft landscape wash -->
  <path d="M0 620c120-80 260-110 400-70 150 42 240 20 360-40 100-50 220-40 340 20 60 30 80 20 100 10v360H0z" fill="#c4785a" opacity="0.12"/>
  <path d="M0 700c140-50 280-80 420-40 140 40 260 10 380-50 100-50 200-30 300 20 50 25 70 20 100 5v265H0z" fill="#6f7f64" opacity="0.14"/>
  <circle cx="920" cy="210" r="160" fill="url(#glow)"/>

  <!-- decorative arc / fingerprint motif -->
  <path d="M180 240c40-90 140-140 250-130" fill="none" stroke="#a85a3f" stroke-width="1.5" opacity="0.25"/>
  <path d="M200 260c35-70 120-110 210-100" fill="none" stroke="#a85a3f" stroke-width="1.2" opacity="0.2"/>
  <path d="M220 280c30-55 100-85 175-78" fill="none" stroke="#a85a3f" stroke-width="1" opacity="0.15"/>

  <!-- left bowl -->
  <ellipse cx="280" cy="620" rx="95" ry="18" fill="#3d2b22" opacity="0.1"/>
  <path d="M190 580c-8-55 40-110 90-110s98 55 90 110c-4 28-30 40-60 44h-60c-30-4-56-16-60-44z" fill="url(#bowl)"/>
  <ellipse cx="280" cy="470" rx="95" ry="28" fill="#a3b395"/>
  <ellipse cx="280" cy="470" rx="62" ry="16" fill="#3d2b22" opacity="0.12"/>

  <!-- center tall vase -->
  <ellipse cx="600" cy="680" rx="110" ry="20" fill="#3d2b22" opacity="0.12"/>
  <path d="M490 640c-18-90-12-220 20-320 14-44 48-90 90-90s76 46 90 90c32 100 38 230 20 320-6 28-30 42-64 48H554c-34-6-58-20-64-48z" fill="url(#pot)"/>
  <ellipse cx="600" cy="320" rx="98" ry="30" fill="#d49272"/>
  <ellipse cx="600" cy="320" rx="58" ry="16" fill="#3d2b22" opacity="0.22"/>
  <path d="M520 440c50-28 110-28 160 0" fill="none" stroke="#f4efe6" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <path d="M510 520c55-22 125-22 180 0" fill="none" stroke="#f4efe6" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
  <circle cx="545" cy="470" r="42" fill="#5b7c7a" opacity="0.28"/>

  <!-- right cup -->
  <ellipse cx="880" cy="640" rx="70" ry="14" fill="#3d2b22" opacity="0.1"/>
  <path d="M820 610c-8-70 12-130 40-150 10-8 24-12 20-12s10 4 20 12c28 20 48 80 40 150-3 22-16 32-36 36h-48c-20-4-33-14-36-36z" fill="url(#cup)"/>
  <ellipse cx="880" cy="460" rx="52" ry="16" fill="#8ab0ae"/>
  <ellipse cx="880" cy="460" rx="30" ry="9" fill="#3d2b22" opacity="0.18"/>
  <path d="M840 540c24-16 56-16 80 0" fill="none" stroke="#d8e4e2" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- brand block -->
  <rect x="120" y="100" width="480" height="6" rx="3" fill="url(#band)" opacity="0.6"/>
  <text x="120" y="175" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="28" font-weight="600" letter-spacing="8" fill="#a85a3f">HAND-THROWN CERAMICS</text>
  <text x="120" y="260" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="78" font-weight="600" fill="#3d2b22">Soft Earth</text>
  <text x="120" y="340" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="78" font-weight="600" fill="#3d2b22">Studio</text>
  <text x="120" y="400" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="28" font-style="italic" fill="#6b5c50">Made slowly enough to keep the fingerprints.</text>

  <!-- bottom caption bar -->
  <rect x="0" y="820" width="1200" height="80" fill="#3d2b22"/>
  <text x="600" y="868" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="24" fill="#ebe3d4" letter-spacing="3">IMPERFECT VESSELS · STUDIO RITUALS · GLAZE LANDSCAPES</text>
</svg>
