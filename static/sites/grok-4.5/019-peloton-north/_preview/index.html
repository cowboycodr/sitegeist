<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Peloton North — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a1216;
      color: #c9e8e4;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(960px, 92vw);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Peloton North gallery poster">
    <figcaption>Peloton North — preview poster (4:3)</figcaption>
  </figure>
</body>
</html>
