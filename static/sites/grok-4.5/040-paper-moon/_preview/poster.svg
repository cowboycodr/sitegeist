<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Paper Moon — Films that linger">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E18"/>
      <stop offset="45%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#141B2C"/>
    </linearGradient>
    <radialGradient id="moonFill" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="48%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#C9B48A"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rustGlow" cx="12%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#C45C48" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C45C48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="0.7" fill="#F3EBE0" opacity="0.18"/>
      <circle cx="42" cy="36" r="0.6" fill="#F3EBE0" opacity="0.12"/>
      <circle cx="78" cy="22" r="0.8" fill="#F3EBE0" opacity="0.14"/>
      <circle cx="96" cy="68" r="0.5" fill="#F3EBE0" opacity="0.1"/>
      <circle cx="24" cy="88" r="0.7" fill="#F3EBE0" opacity="0.12"/>
      <circle cx="60" cy="102" r="0.6" fill="#F3EBE0" opacity="0.15"/>
      <circle cx="110" cy="48" r="0.5" fill="#F3EBE0" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#warmGlow)"/>
  <rect width="1200" height="900" fill="url(#rustGlow)"/>
  <rect width="1200" height="900" fill="url(#grain)" opacity="0.55"/>

  <!-- Soft vignette -->
  <rect width="1200" height="900" fill="none" stroke="#000" stroke-width="120" opacity="0.22"/>

  <!-- Film sprocket rails -->
  <g opacity="0.55">
    <rect x="48" y="0" width="36" height="900" fill="#161C2C"/>
    <rect x="1116" y="0" width="36" height="900" fill="#161C2C"/>
    <!-- left holes -->
    <g fill="#0B0F1A">
      <rect x="56" y="40" width="20" height="14" rx="3"/>
      <rect x="56" y="100" width="20" height="14" rx="3"/>
      <rect x="56" y="160" width="20" height="14" rx="3"/>
      <rect x="56" y="220" width="20" height="14" rx="3"/>
      <rect x="56" y="280" width="20" height="14" rx="3"/>
      <rect x="56" y="340" width="20" height="14" rx="3"/>
      <rect x="56" y="400" width="20" height="14" rx="3"/>
      <rect x="56" y="460" width="20" height="14" rx="3"/>
      <rect x="56" y="520" width="20" height="14" rx="3"/>
      <rect x="56" y="580" width="20" height="14" rx="3"/>
      <rect x="56" y="640" width="20" height="14" rx="3"/>
      <rect x="56" y="700" width="20" height="14" rx="3"/>
      <rect x="56" y="760" width="20" height="14" rx="3"/>
      <rect x="56" y="820" width="20" height="14" rx="3"/>
    </g>
    <!-- right holes -->
    <g fill="#0B0F1A">
      <rect x="1124" y="40" width="20" height="14" rx="3"/>
      <rect x="1124" y="100" width="20" height="14" rx="3"/>
      <rect x="1124" y="160" width="20" height="14" rx="3"/>
      <rect x="1124" y="220" width="20" height="14" rx="3"/>
      <rect x="1124" y="280" width="20" height="14" rx="3"/>
      <rect x="1124" y="340" width="20" height="14" rx="3"/>
      <rect x="1124" y="400" width="20" height="14" rx="3"/>
      <rect x="1124" y="460" width="20" height="14" rx="3"/>
      <rect x="1124" y="520" width="20" height="14" rx="3"/>
      <rect x="1124" y="580" width="20" height="14" rx="3"/>
      <rect x="1124" y="640" width="20" height="14" rx="3"/>
      <rect x="1124" y="700" width="20" height="14" rx="3"/>
      <rect x="1124" y="760" width="20" height="14" rx="3"/>
      <rect x="1124" y="820" width="20" height="14" rx="3"/>
    </g>
  </g>

  <!-- Outer frame -->
  <rect x="108" y="72" width="984" height="756" rx="8" fill="none" stroke="#F3EBE0" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Crescent moon -->
  <g transform="translate(760 210)">
    <circle cx="0" cy="0" r="148" fill="url(#moonFill)"/>
    <path d="M42 -108a126 126 0 1 0 78 118A108 108 0 0 1 42 -108z" fill="#0B0F1A" opacity="0.22"/>
    <circle cx="-36" cy="-18" r="14" fill="#0B0F1A" opacity="0.08"/>
    <circle cx="18" cy="36" r="22" fill="#0B0F1A" opacity="0.07"/>
    <circle cx="-10" cy="72" r="10" fill="#0B0F1A" opacity="0.06"/>
    <!-- soft ring -->
    <circle cx="0" cy="0" r="168" fill="none" stroke="#D4A574" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="0" cy="0" r="188" fill="none" stroke="#D4A574" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- Small star field -->
  <g fill="#F3EBE0">
    <circle cx="220" cy="180" r="1.6" opacity="0.55"/>
    <circle cx="280" cy="240" r="1.2" opacity="0.4"/>
    <circle cx="340" cy="150" r="1.4" opacity="0.5"/>
    <circle cx="420" cy="210" r="1.1" opacity="0.35"/>
    <circle cx="250" cy="320" r="1.3" opacity="0.45"/>
    <circle cx="980" cy="560" r="1.4" opacity="0.4"/>
    <circle cx="1040" cy="620" r="1.1" opacity="0.35"/>
    <circle cx="200" cy="600" r="1.2" opacity="0.3"/>
  </g>

  <!-- Category -->
  <text x="160" y="190" fill="#D4A574" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="18" letter-spacing="6">INDEPENDENT CINEMA</text>

  <!-- Title -->
  <text x="160" y="320" fill="#F3EBE0" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="96" font-weight="600" letter-spacing="1">Paper Moon</text>

  <!-- Tagline rule -->
  <line x1="160" y1="360" x2="420" y2="360" stroke="#C45C48" stroke-width="2" opacity="0.85"/>

  <!-- Tagline -->
  <text x="160" y="420" fill="#E4D8C6" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="36" font-style="italic">Films that linger.</text>

  <!-- Description -->
  <text x="160" y="500" fill="#8A93A8" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20">Overlooked classics · Midnight oddities · New voices</text>

  <!-- Bottom bar -->
  <rect x="160" y="720" width="880" height="1" fill="#F3EBE0" opacity="0.12"/>
  <text x="160" y="770" fill="#8A93A8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="3">REPERTORY · 35MM · DCP · SINGLE SCREEN</text>
  <text x="1040" y="770" fill="#D4A574" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="2" text-anchor="end">TONIGHT</text>
</svg>
