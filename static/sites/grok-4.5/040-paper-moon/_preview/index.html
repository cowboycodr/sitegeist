<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paper Moon — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0f1a;
      color: #f3ebe0;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(243, 235, 224, 0.12);
      border-radius: 8px;
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      color: #8a93a8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Paper Moon gallery poster">
    <figcaption>Paper Moon — gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
