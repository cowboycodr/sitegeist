<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Agora Index — Public life, made legible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="55%" stop-color="#f0ebe1"/>
      <stop offset="100%" stop-color="#e4ddd0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162538"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a9e90"/>
      <stop offset="100%" stop-color="#1a7a6d"/>
    </linearGradient>
    <linearGradient id="barCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9783a"/>
      <stop offset="100%" stop-color="#c45c26"/>
    </linearGradient>
    <linearGradient id="barSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a8bb8"/>
      <stop offset="100%" stop-color="#2a6f9e"/>
    </linearGradient>
    <linearGradient id="barRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c96a74"/>
      <stop offset="100%" stop-color="#a63d4a"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#c45c26" opacity="0.07"/>
  <circle cx="120" cy="780" r="260" fill="#1a7a6d" opacity="0.07"/>

  <!-- Soft grid motif -->
  <g stroke="#0f1c2e" stroke-opacity="0.05" stroke-width="1">
    <path d="M80 120h1040M80 180h1040M80 240h1040"/>
    <path d="M200 60v200M320 60v200M440 60v200"/>
  </g>

  <!-- Top brand bar -->
  <rect x="72" y="64" width="56" height="56" rx="14" fill="#0f1c2e"/>
  <path d="M84 106V90.5L100 80l16 10.5V106" fill="none" stroke="#f4f0e8" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M92 106v-8h16v8" fill="none" stroke="#c45c26" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M82 108h36" stroke="#1a7a6d" stroke-width="2" stroke-linecap="round"/>

  <text x="148" y="90" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="36" font-weight="700" fill="#0f1c2e">Agora Index</text>
  <text x="148" y="118" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" fill="#6b7c8f" letter-spacing="1.5">CITY PULSE  ·  CIVIC DATA</text>

  <!-- Headline -->
  <text x="72" y="230" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="700" fill="#0f1c2e">Public life,</text>
  <text x="72" y="300" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="700" fill="#0f1c2e">made legible.</text>
  <text x="72" y="360" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#3d5166">Budgets · Housing · Transit · Participation</text>

  <!-- Signal cards row -->
  <g>
    <!-- Budget -->
    <rect x="72" y="420" width="250" height="200" rx="18" fill="#ffffff" stroke="#d4dde8" stroke-width="2"/>
    <rect x="92" y="440" width="40" height="40" rx="10" fill="#faf0d6"/>
    <text x="104" y="467" font-family="system-ui, sans-serif" font-size="18" fill="#c99212" font-weight="700">$</text>
    <text x="148" y="466" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0f1c2e">Budget</text>
    <text x="92" y="510" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0f1c2e">78</text>
    <rect x="92" y="540" width="210" height="12" rx="6" fill="#e8eef4"/>
    <rect x="92" y="540" width="164" height="12" rx="6" fill="url(#barCopper)"/>
    <text x="92" y="585" font-family="system-ui, sans-serif" font-size="16" fill="#6b7c8f">Clarity &amp; variance</text>

    <!-- Housing -->
    <rect x="342" y="420" width="250" height="200" rx="18" fill="#ffffff" stroke="#d4dde8" stroke-width="2"/>
    <rect x="362" y="440" width="40" height="40" rx="10" fill="#f8e8ea"/>
    <path d="M370 464l12-9 12 9v10h-8v-6h-8v6h-8z" fill="#a63d4a"/>
    <text x="418" y="466" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0f1c2e">Housing</text>
    <text x="362" y="510" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0f1c2e">61</text>
    <rect x="362" y="540" width="210" height="12" rx="6" fill="#e8eef4"/>
    <rect x="362" y="540" width="128" height="12" rx="6" fill="url(#barRose)"/>
    <text x="362" y="585" font-family="system-ui, sans-serif" font-size="16" fill="#6b7c8f">Access &amp; pipeline</text>

    <!-- Transit -->
    <rect x="612" y="420" width="250" height="200" rx="18" fill="#ffffff" stroke="#d4dde8" stroke-width="2"/>
    <rect x="632" y="440" width="40" height="40" rx="10" fill="#e5f0f8"/>
    <rect x="640" y="450" width="24" height="16" rx="4" fill="none" stroke="#2a6f9e" stroke-width="2"/>
    <circle cx="646" cy="472" r="2.5" fill="#2a6f9e"/>
    <circle cx="658" cy="472" r="2.5" fill="#2a6f9e"/>
    <text x="688" y="466" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0f1c2e">Transit</text>
    <text x="632" y="510" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0f1c2e">84</text>
    <rect x="632" y="540" width="210" height="12" rx="6" fill="#e8eef4"/>
    <rect x="632" y="540" width="176" height="12" rx="6" fill="url(#barSky)"/>
    <text x="632" y="585" font-family="system-ui, sans-serif" font-size="16" fill="#6b7c8f">Reliability &amp; equity</text>

    <!-- Participation -->
    <rect x="882" y="420" width="246" height="200" rx="18" fill="#ffffff" stroke="#d4dde8" stroke-width="2"/>
    <rect x="902" y="440" width="40" height="40" rx="10" fill="#e4f3f0"/>
    <path d="M910 466v-8l12-6 12 6v8" fill="none" stroke="#1a7a6d" stroke-width="2"/>
    <path d="M914 466v6M922 466v6M930 466v6" stroke="#1a7a6d" stroke-width="2"/>
    <text x="958" y="466" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0f1c2e">Civic</text>
    <text x="902" y="510" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0f1c2e">69</text>
    <rect x="902" y="540" width="206" height="12" rx="6" fill="#e8eef4"/>
    <rect x="902" y="540" width="142" height="12" rx="6" fill="url(#barTeal)"/>
    <text x="902" y="585" font-family="system-ui, sans-serif" font-size="16" fill="#6b7c8f">Voice &amp; process</text>
  </g>

  <!-- Bottom composite panel -->
  <rect x="72" y="660" width="1056" height="168" rx="22" fill="url(#panel)"/>
  <text x="108" y="720" font-family="system-ui, sans-serif" font-size="16" fill="#8aa0b5" letter-spacing="2">COMPOSITE INDEX</text>
  <text x="108" y="782" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#fbf8f2">72</text>
  <text x="210" y="782" font-family="system-ui, sans-serif" font-size="28" fill="#8aa0b5">/ 100</text>

  <!-- Mini sparkline -->
  <path d="M360 780 L420 768 L480 772 L540 750 L600 742 L660 748 L720 730 L780 720 L840 724 L900 710 L960 706 L1020 700"
        fill="none" stroke="#1a7a6d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 780 L420 768 L480 772 L540 750 L600 742 L660 748 L720 730 L780 720 L840 724 L900 710 L960 706 L1020 700 L1020 810 L360 810 Z"
        fill="#1a7a6d" opacity="0.18"/>
  <circle cx="1020" cy="700" r="8" fill="#c45c26"/>
  <text x="360" y="720" font-family="system-ui, sans-serif" font-size="18" fill="#c5d2df">Harbor City pulse · twelve months</text>
</svg>
