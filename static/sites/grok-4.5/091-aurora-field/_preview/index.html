<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Aurora Field — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0e12;
      font-family: system-ui, sans-serif;
      color: #c5d4ce;
    }
    figure {
      margin: 1.5rem;
      max-width: 960px;
      width: calc(100% - 3rem);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.95rem;
      color: #7a9088;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Aurora Field gallery poster" width="1200" height="900">
    <figcaption>Gallery poster · 4:3 · Aurora Field</figcaption>
  </figure>
</body>
</html>
