<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Glyph Department — Typefaces with something to say.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16140f"/>
      <stop offset="55%" stop-color="#12110f"/>
      <stop offset="100%" stop-color="#1a120f"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ff3d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d8ff3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8ff3d"/>
      <stop offset="50%" stop-color="#ff5a3c"/>
      <stop offset="100%" stop-color="#7ec8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="280" fill="url(#glowA)"/>
  <circle cx="1040" cy="760" r="320" fill="url(#glowB)"/>

  <!-- subtle grid -->
  <g stroke="rgba(243,239,230,0.05)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
  </g>

  <!-- brand mark -->
  <rect x="92" y="98" width="72" height="72" rx="16" fill="#d8ff3d"/>
  <text x="128" y="146" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" fill="#12110f" letter-spacing="-1">GD</text>
  <text x="188" y="132" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#f3efe6">Glyph Department</text>
  <text x="188" y="162" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#8a8478" letter-spacing="3">INDEPENDENT TYPE FOUNDRY</text>

  <!-- large colliding glyphs motif -->
  <g font-family="Futura, Avenir Next, Century Gothic, sans-serif" font-weight="800">
    <text x="90" y="430" font-size="260" fill="#d8ff3d" letter-spacing="-18" transform="skewX(-6)">Aa</text>
    <text x="430" y="430" font-size="260" fill="#ff5a3c" letter-spacing="-22" transform="translate(-24,0) rotate(-4 520 320)">gR</text>
    <text x="760" y="430" font-size="260" fill="#7ec8ff" letter-spacing="-16" transform="skewX(5)">Sy</text>
  </g>

  <!-- accent bar -->
  <rect x="92" y="490" width="180" height="8" rx="4" fill="url(#spec)"/>

  <!-- headline -->
  <text x="92" y="590" font-family="Futura, Avenir Next, Century Gothic, sans-serif" font-size="64" font-weight="800" fill="#f3efe6" letter-spacing="-2">Typefaces with</text>
  <text x="92" y="668" font-family="Futura, Avenir Next, Century Gothic, sans-serif" font-size="64" font-weight="800" fill="#f3efe6" letter-spacing="-2">something to <tspan fill="#d8ff3d">say.</tspan></text>

  <text x="92" y="740" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#c8c2b4">Variable letters stretch, collide, and perform.</text>

  <!-- family chips -->
  <g font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="92" y="780" width="110" height="42" rx="21" fill="none" stroke="rgba(243,239,230,0.22)"/>
    <text x="147" y="807" text-anchor="middle" fill="#f3efe6">Collide</text>
    <rect x="216" y="780" width="110" height="42" rx="21" fill="none" stroke="rgba(243,239,230,0.22)"/>
    <text x="271" y="807" text-anchor="middle" fill="#f3efe6">Stretch</text>
    <rect x="340" y="780" width="120" height="42" rx="21" fill="none" stroke="rgba(243,239,230,0.22)"/>
    <text x="400" y="807" text-anchor="middle" fill="#f3efe6">Perform</text>
  </g>
</svg>
