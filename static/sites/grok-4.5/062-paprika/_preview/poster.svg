<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Paprika — Dinner should feel alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="45%" stop-color="#4a2418"/>
      <stop offset="100%" stop-color="#8f240c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f0a040" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c43c1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf4eb"/>
      <stop offset="100%" stop-color="#e8d5bc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="280" fill="url(#glow)"/>
  <circle cx="160" cy="780" r="220" fill="#c43c1a" opacity="0.25"/>
  <circle cx="200" cy="160" r="90" fill="#f0a040" opacity="0.12"/>

  <!-- Soft geometric arcs -->
  <path d="M-40 620c180-80 320-40 480-100s280-40 420-20" fill="none" stroke="#f0a040" stroke-width="2" opacity="0.18"/>
  <path d="M100 760c200-60 360-20 520-70s300-30 480 10" fill="none" stroke="#faf4eb" stroke-width="2" opacity="0.08"/>

  <!-- Brand mark -->
  <g transform="translate(96, 88)">
    <circle cx="36" cy="36" r="36" fill="#c43c1a"/>
    <path d="M36 14c-2.4 7-4 13.6-4 20.4 0 5.2 1.4 9.6 4 12.6 2.6-3 4-7.4 4-12.6 0-6.8-1.6-13.4-4-20.4z" fill="#faf4eb"/>
    <path d="M24 28c4.4 2.8 8.4 4.4 12 4.4s7.6-1.6 12-4.4c-2.8 7.6-6.8 12.8-12 15.6-5.2-2.8-9.2-8-12-15.6z" fill="#f0a040"/>
    <circle cx="36" cy="24" r="4.4" fill="#3d6b4f"/>
    <text x="92" y="48" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#faf4eb" letter-spacing="-0.5">Paprika</text>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f0a040" letter-spacing="4">MADE NEARBY</text>

  <!-- Headline -->
  <text x="96" y="320" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="700" fill="#faf4eb">Dinner should</text>
  <text x="96" y="400" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="700" fill="#faf4eb">feel <tspan fill="#f0a040" font-style="italic">alive.</tspan></text>

  <!-- Tagline -->
  <text x="96" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#f3e8d8" opacity="0.85">Bold chef-made meals from independent kitchens.</text>

  <!-- Feature plate card -->
  <g transform="translate(700, 280)">
    <rect x="0" y="0" width="380" height="420" rx="28" fill="#2a1812" opacity="0.55"/>
    <rect x="16" y="16" width="348" height="388" rx="22" fill="#1c1410" stroke="rgba(250,244,235,0.12)" stroke-width="2"/>

    <!-- Plate -->
    <ellipse cx="190" cy="230" rx="120" ry="34" fill="rgba(0,0,0,0.35)"/>
    <ellipse cx="190" cy="210" rx="130" ry="40" fill="url(#plate)"/>
    <ellipse cx="190" cy="204" rx="110" ry="30" fill="#f3e8d8"/>

    <!-- Food -->
    <path d="M130 175c12-40 40-68 75-70 42-3 68 26 74 60 4 26-8 46-30 54-18 6-40 3-56-6-26-14-46-16-63-38z" fill="#c43c1a"/>
    <path d="M160 155c18-26 44-34 68-26 12 4 20 14 22 26-20-6-40-3-60 12-12 8-20 10-30 8 0-8 0-14 0-20z" fill="#e85d2a"/>
    <path d="M220 170c16-12 30-8 38 6 6 12-2 22-16 26-14 3-26-6-28-16-2-7 0-12 6-16z" fill="#3d6b4f"/>
    <path d="M110 210c35 12 78 16 128 6 28-6 52-6 72 4" stroke="#f0a040" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Steam -->
    <path d="M155 120c0-14 10-16 10-30M190 110c0-16 10-18 10-32M220 118c0-12 10-14 10-26" stroke="rgba(250,244,235,0.45)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <text x="190" y="300" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700" fill="#faf4eb">Smoked paprika chicken</text>
    <text x="190" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f3e8d8" opacity="0.7">Ember &amp; Rye · hot in 26 min</text>

    <rect x="110" y="356" width="160" height="30" rx="15" fill="#f0a040"/>
    <text x="190" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1410">TONIGHT'S FEATURE</text>
  </g>

  <!-- Bottom stats bar -->
  <rect x="0" y="780" width="1200" height="120" fill="rgba(28,20,16,0.45)"/>
  <text x="96" y="835" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" fill="#faf4eb">42</text>
  <text x="96" y="868" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f3e8d8" opacity="0.7">independent kitchens</text>

  <text x="360" y="835" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" fill="#faf4eb">28 min</text>
  <text x="360" y="868" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f3e8d8" opacity="0.7">avg. door-to-table</text>

  <text x="640" y="835" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" fill="#faf4eb">4.9</text>
  <text x="640" y="868" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f3e8d8" opacity="0.7">chef rating average</text>

  <text x="900" y="850" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f0a040" letter-spacing="1">FIND TONIGHT'S DINNER</text>
</svg>
