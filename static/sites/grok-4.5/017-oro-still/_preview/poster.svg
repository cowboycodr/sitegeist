<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Oro Still — Objects for your private mythology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a08"/>
      <stop offset="55%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0b0"/>
      <stop offset="45%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a1a"/>
    </linearGradient>
    <linearGradient id="gold-soft" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="100%" stop-color="#a67c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Subtle frame -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#c9a227" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#c9a227" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left brand block -->
  <g transform="translate(110, 180)">
    <!-- Mark -->
    <circle cx="36" cy="36" r="34" fill="none" stroke="#c9a227" stroke-width="1.4"/>
    <circle cx="36" cy="36" r="13" fill="none" stroke="#e8d5a3" stroke-width="1.1"/>
    <path d="M36 6v12M36 54v12M6 36h12M54 36h12" stroke="#c9a227" stroke-width="1.2" stroke-linecap="round"/>

    <text x="0" y="130" fill="#e8d5a3" font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif" font-size="72" letter-spacing="10">ORO STILL</text>
    <line x1="0" y1="158" x2="220" y2="158" stroke="#c9a227" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="210" fill="#c9a227" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" letter-spacing="6">HANDMADE IN FLORENCE</text>
    <text x="0" y="280" fill="#f3ece0" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="36" font-style="italic">Objects for your</text>
    <text x="0" y="330" fill="#f3ece0" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="36" font-style="italic">private mythology.</text>
    <text x="0" y="410" fill="#b0a48f" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="18" letter-spacing="1">Hand-cast jewelry · intimate artifacts</text>
  </g>

  <!-- Pendant motif (right) -->
  <g transform="translate(720, 140)">
    <path d="M160 20c0 0-4 22-4 48s4 34 4 48" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M160 20c0 0 4 22 4 48s-4 34-4 48" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <ellipse cx="160" cy="116" rx="8" ry="5" fill="url(#gold-soft)"/>
    <path d="M160 130
             C230 155 268 220 256 280
             C244 340 195 390 160 440
             C125 390 76 340 64 280
             C52 220 90 155 160 130Z"
          fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M160 168
             C205 188 232 232 225 275
             C218 312 185 350 160 385
             C135 350 102 312 95 275
             C88 232 115 188 160 168Z"
          fill="url(#gold-soft)" opacity="0.32"/>
    <circle cx="160" cy="275" r="26" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <circle cx="160" cy="275" r="9" fill="url(#gold-soft)"/>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="830" text-anchor="middle" fill="#8a7f6c" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="16" letter-spacing="4">JEWELRY · FLORENCE</text>
</svg>
