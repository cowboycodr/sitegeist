<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="55%" stop-color="#12151f"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="900" y1="80" x2="1100" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eb8b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eb8b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="100" y1="700" x2="500" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a54b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8a54b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#amberGlow)"/>

  <!-- Soft archive strata motif (right) -->
  <g opacity="0.9">
    <rect x="700" y="120" width="380" height="620" rx="8" transform="rotate(-7 890 430)" fill="#12151f" stroke="#e8a54b" stroke-opacity="0.2" stroke-width="1.5"/>
    <!-- strata lines -->
    <g transform="rotate(-7 890 430)" stroke="#e8a54b" stroke-opacity="0.14" stroke-width="1">
      <line x1="720" y1="180" x2="1060" y2="180"/>
      <line x1="720" y1="220" x2="1060" y2="220"/>
      <line x1="720" y1="260" x2="1060" y2="260"/>
      <line x1="720" y1="300" x2="1060" y2="300"/>
      <line x1="720" y1="340" x2="1060" y2="340"/>
      <line x1="720" y1="380" x2="1060" y2="380"/>
      <line x1="720" y1="420" x2="1060" y2="420"/>
      <line x1="720" y1="460" x2="1060" y2="460"/>
      <line x1="720" y1="500" x2="1060" y2="500"/>
      <line x1="720" y1="540" x2="1060" y2="540"/>
      <line x1="720" y1="580" x2="1060" y2="580"/>
      <line x1="720" y1="620" x2="1060" y2="620"/>
      <line x1="720" y1="660" x2="1060" y2="660"/>
      <line x1="720" y1="700" x2="1060" y2="700"/>
    </g>
    <!-- inner seal frame -->
    <rect x="780" y="240" width="220" height="280" rx="4" transform="rotate(-7 890 380)" fill="none" stroke="#5eb8b0" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="800" y="270" width="180" height="220" rx="2" transform="rotate(-7 890 380)" fill="#0a0c12" fill-opacity="0.55" stroke="#ebe6dc" stroke-opacity="0.12" stroke-width="1"/>
    <!-- mini vault glyph -->
    <g transform="rotate(-7 890 380)">
      <rect x="845" y="330" width="90" height="90" rx="6" stroke="#e8a54b" stroke-width="2"/>
      <text x="890" y="388" text-anchor="middle" fill="#ebe6dc" font-family="Georgia, 'Palatino Linotype', serif" font-size="28" font-weight="600">FA</text>
    </g>
  </g>

  <!-- Left content block -->
  <g>
    <!-- mark -->
    <rect x="96" y="168" width="56" height="56" rx="8" stroke="#e8a54b" stroke-width="2"/>
    <text x="124" y="205" text-anchor="middle" fill="#ebe6dc" font-family="Georgia, 'Palatino Linotype', serif" font-size="20" font-weight="600">FA</text>

    <text x="96" y="280" fill="#e8a54b" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="4">MEMORY INFRASTRUCTURE</text>

    <text x="96" y="370" fill="#ebe6dc" font-family="Georgia, 'Palatino Linotype', serif" font-size="72" font-weight="600">Future</text>
    <text x="96" y="450" fill="#ebe6dc" font-family="Georgia, 'Palatino Linotype', serif" font-size="72" font-weight="600">Archive</text>

    <text x="96" y="520" fill="#b8b2a6" font-family="Georgia, 'Palatino Linotype', serif" font-size="28">Save what tomorrow</text>
    <text x="96" y="558" fill="#b8b2a6" font-family="Georgia, 'Palatino Linotype', serif" font-size="28">should remember.</text>

    <!-- accent rule -->
    <rect x="96" y="600" width="120" height="3" rx="1.5" fill="#e8a54b"/>

    <text x="96" y="660" fill="#8a857a" font-family="system-ui, Segoe UI, sans-serif" font-size="18">Digital art · Cultural records · Online history</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="820" width="1200" height="80" fill="#0a0c12" fill-opacity="0.65"/>
  <line x1="0" y1="820" x2="1200" y2="820" stroke="#ebe6dc" stroke-opacity="0.12"/>
  <text x="96" y="868" fill="#5eb8b0" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="2">VAULT SEAL · CENTURY SCALE</text>
  <text x="1104" y="868" text-anchor="end" fill="#8a857a" font-family="system-ui, Segoe UI, sans-serif" font-size="16">Digital Preservation</text>
</svg>
