<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Salt Air — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8dfd0;
      font-family: system-ui, sans-serif;
      color: #2c2824;
      padding: 1.5rem;
    }
    figure {
      margin: 0;
      max-width: 960px;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(44, 40, 36, 0.15);
      background: #fbf8f2;
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      color: #6e655c;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Salt Air gallery poster: coastal inn against tide and sky">
    <figcaption>Salt Air — promotional poster (4:3), not part of the live site.</figcaption>
  </figure>
</body>
</html>
