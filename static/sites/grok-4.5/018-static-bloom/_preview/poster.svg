<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Static Bloom — Beautiful noise, carefully released.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0b10"/>
      <stop offset="55%" stop-color="#14121c"/>
      <stop offset="100%" stop-color="#1a1528"/>
    </linearGradient>
    <linearGradient id="bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e83d8a"/>
      <stop offset="45%" stop-color="#8b6cff"/>
      <stop offset="100%" stop-color="#2fd4c8"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e83d8a"/>
      <stop offset="50%" stop-color="#8b6cff"/>
      <stop offset="100%" stop-color="#2fd4c8"/>
    </linearGradient>
    <radialGradient id="glowM" cx="28%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#e83d8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e83d8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="78%" cy="60%" r="38%">
      <stop offset="0%" stop-color="#2fd4c8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2fd4c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="60%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#8b6cff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowM)"/>
  <rect width="1200" height="900" fill="url(#glowC)"/>
  <rect width="1200" height="900" fill="url(#glowV)"/>

  <!-- Soft grain-like dots -->
  <g fill="#f4f0e8" opacity="0.04">
    <circle cx="120" cy="140" r="1.5"/>
    <circle cx="260" cy="80" r="1"/>
    <circle cx="400" cy="200" r="1.2"/>
    <circle cx="980" cy="120" r="1.4"/>
    <circle cx="1080" cy="280" r="1"/>
    <circle cx="140" cy="720" r="1.3"/>
    <circle cx="320" cy="800" r="1"/>
    <circle cx="900" cy="760" r="1.5"/>
    <circle cx="1040" cy="680" r="1"/>
    <circle cx="700" cy="840" r="1.2"/>
  </g>

  <!-- Frame -->
  <rect x="48" y="48" width="1104" height="804" rx="28" fill="none" stroke="rgba(244,240,232,0.12)" stroke-width="2"/>
  <rect x="64" y="64" width="1072" height="772" rx="20" fill="none" stroke="rgba(232,61,138,0.18)" stroke-width="1"/>

  <!-- Vinyl motif -->
  <g transform="translate(780 450)">
    <circle r="248" fill="none" stroke="rgba(232,61,138,0.25)" stroke-width="1.5"/>
    <circle r="268" fill="none" stroke="rgba(139,108,255,0.18)" stroke-width="1"/>
    <circle r="288" fill="none" stroke="rgba(47,212,200,0.12)" stroke-width="1"/>

    <circle r="210" fill="#121018"/>
    <circle r="210" fill="none" stroke="rgba(244,240,232,0.08)" stroke-width="2"/>

    <!-- grooves -->
    <circle r="195" fill="none" stroke="#1c1a24" stroke-width="3"/>
    <circle r="185" fill="none" stroke="#18161f" stroke-width="2"/>
    <circle r="175" fill="none" stroke="#1c1a24" stroke-width="3"/>
    <circle r="165" fill="none" stroke="#18161f" stroke-width="2"/>
    <circle r="155" fill="none" stroke="#1c1a24" stroke-width="3"/>
    <circle r="145" fill="none" stroke="#18161f" stroke-width="2"/>
    <circle r="135" fill="none" stroke="#1c1a24" stroke-width="3"/>
    <circle r="125" fill="none" stroke="#18161f" stroke-width="2"/>
    <circle r="115" fill="none" stroke="#1c1a24" stroke-width="3"/>

    <!-- chromatic label -->
    <circle r="78" fill="url(#labelGrad)"/>
    <circle r="22" fill="#0c0b10"/>
    <circle r="8" fill="#2a2733"/>

    <text text-anchor="middle" y="-8" fill="#0c0b10" font-family="Georgia, 'Iowan Old Style', serif" font-size="18" font-weight="700" letter-spacing="2">STATIC</text>
    <text text-anchor="middle" y="16" fill="#0c0b10" font-family="Georgia, 'Iowan Old Style', serif" font-size="18" font-weight="700" letter-spacing="2">BLOOM</text>
  </g>

  <!-- Wordmark block -->
  <g transform="translate(110 210)">
    <text fill="#2fd4c8" font-family="ui-monospace, Consolas, monospace" font-size="16" letter-spacing="6">RECORDS · EDITIONS · NOISE</text>

    <text y="110" fill="#f4f0e8" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="600" letter-spacing="-2">Static</text>
    <text y="210" fill="url(#bloom)" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="600" letter-spacing="-2">Bloom</text>

    <text y="290" fill="#c8c2b6" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-style="italic">Beautiful noise,</text>
    <text y="332" fill="#c8c2b6" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-style="italic">carefully released.</text>

    <rect y="380" width="72" height="4" rx="2" fill="url(#bloom)"/>

    <text y="440" fill="#8a8496" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="3">INDEPENDENT LABEL · SB-048</text>
  </g>

  <!-- Corner catalog chip -->
  <g transform="translate(110 760)">
    <rect width="220" height="44" rx="22" fill="rgba(244,240,232,0.06)" stroke="rgba(244,240,232,0.14)"/>
    <text x="110" y="28" text-anchor="middle" fill="#f4f0e8" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2">CHROMATIC VINYL</text>
  </g>
</svg>
