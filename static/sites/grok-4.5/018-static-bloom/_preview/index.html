<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Static Bloom — Poster preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c0b10;
        color: #f4f0e8;
        font-family: system-ui, sans-serif;
      }
      img {
        width: min(96vw, 800px);
        height: auto;
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <img src="poster.svg" alt="Static Bloom gallery poster" width="1200" height="900" />
  </body>
</html>
