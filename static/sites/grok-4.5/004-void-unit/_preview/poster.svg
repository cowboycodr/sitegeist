<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Void Unit — Drop 07 poster">
  <defs>
    <radialGradient id="glow" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff3b2e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ff3b2e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a2a2e" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#09090b"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#fade)"/>

  <!-- Outer frame -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#2a2a2e" stroke-width="1"/>
  <rect x="52" y="52" width="1096" height="796" fill="none" stroke="#3d3d44" stroke-width="1" opacity="0.45"/>

  <!-- Top bar -->
  <text x="80" y="110" fill="#ff3b2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="6">DROP 07 · NO RESTOCK</text>
  <text x="1120" y="110" text-anchor="end" fill="#8a8a92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">VU-07</text>

  <!-- Unit mark motif -->
  <g transform="translate(900, 280)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#2a2a2e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#3d3d44" stroke-width="1"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#ff3b2e" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#ff3b2e"/>
    <path d="M0 -150 V-118 M0 118 V150 M-150 0 H-118 M118 0 H150" stroke="#e8e4dc" stroke-width="2"/>
    <path d="M-42 -42 L42 42 M42 -42 L-42 42" stroke="#e8e4dc" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Brand type -->
  <text x="80" y="320" fill="#e8e4dc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="96" font-weight="750" letter-spacing="-2">VOID</text>
  <text x="80" y="420" fill="#e8e4dc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="96" font-weight="750" letter-spacing="-2">UNIT</text>
  <text x="80" y="500" fill="#ff3b2e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="650" letter-spacing="1">UNIFORMS FOR THE</text>
  <text x="80" y="555" fill="#ff3b2e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="650" letter-spacing="1">AFTER-HOURS.</text>

  <!-- Bottom meta strip -->
  <rect x="80" y="680" width="1040" height="1" fill="#2a2a2e"/>
  <text x="80" y="740" fill="#8a8a92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="4">LIMITED SYSTEMS · 06 PIECES · 240 UNITS</text>
  <text x="80" y="790" fill="#e8e4dc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="6">STREETWEAR</text>
  <text x="1120" y="790" text-anchor="end" fill="#ff3b2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="4">LIVE</text>
</svg>
