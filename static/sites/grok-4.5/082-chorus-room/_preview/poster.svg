<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Chorus Room — Listening is better together">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171221"/>
      <stop offset="45%" stop-color="#100e18"/>
      <stop offset="100%" stop-color="#1a1428"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#e56b6b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e56b6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="70%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#4db6a0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4db6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vinylRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a314d"/>
      <stop offset="100%" stop-color="#15101f"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e56b6b"/>
      <stop offset="100%" stop-color="#e8b86d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2340"/>
      <stop offset="100%" stop-color="#181320"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a36b"/>
      <stop offset="100%" stop-color="#c44b6a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>
  <rect width="1200" height="900" fill="url(#glowC)"/>

  <!-- Soft grid motif -->
  <g opacity="0.06" stroke="#f7efe6" stroke-width="1">
    <path d="M0 180 H1200 M0 360 H1200 M0 540 H1200 M0 720 H1200"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(84, 78)">
    <circle cx="28" cy="28" r="28" fill="#e56b6b" opacity="0.14"/>
    <circle cx="28" cy="28" r="17" fill="none" stroke="#e56b6b" stroke-width="2.4"/>
    <circle cx="28" cy="28" r="6" fill="#e8b86d"/>
    <path d="M40 12c6.5 4.4 10 10.2 10 16.4" fill="none" stroke="#e56b6b" stroke-width="2.4" stroke-linecap="round"/>
    <text x="72" y="38" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#f7efe6" letter-spacing="-0.5">Chorus Room</text>
  </g>

  <!-- Live eyebrow -->
  <g transform="translate(84, 168)">
    <rect width="280" height="42" rx="21" fill="#4db6a0" fill-opacity="0.12" stroke="#4db6a0" stroke-opacity="0.35"/>
    <circle cx="28" cy="21" r="6" fill="#4db6a0"/>
    <text x="48" y="27" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#bfe9dc">12,408 listeners online</text>
  </g>

  <!-- Headline -->
  <text x="84" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="750" fill="#f7efe6" letter-spacing="-2.5">Listening is</text>
  <text x="84" y="372" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="750" fill="#f7efe6" letter-spacing="-2.5">better together.</text>

  <!-- Tagline / description -->
  <text x="84" y="440" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b7a99a">Live album rooms where friends trade</text>
  <text x="84" y="476" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b7a99a">discoveries and talk between tracks.</text>

  <!-- CTA pills -->
  <g transform="translate(84, 520)">
    <rect width="190" height="56" rx="28" fill="#e56b6b"/>
    <text x="95" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff8f4">Join a room</text>
    <rect x="210" width="210" height="56" rx="28" fill="#f7efe6" fill-opacity="0.06" stroke="#f7efe6" stroke-opacity="0.22"/>
    <text x="315" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#f7efe6">Start a session</text>
  </g>

  <!-- Category chip -->
  <g transform="translate(84, 780)">
    <rect width="150" height="36" rx="10" fill="#f7efe6" fill-opacity="0.06" stroke="#f7efe6" stroke-opacity="0.12"/>
    <text x="75" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8b86d" letter-spacing="1.5">SOCIAL MUSIC</text>
  </g>

  <!-- Featured room card -->
  <g transform="translate(640, 170)">
    <rect width="480" height="560" rx="32" fill="url(#cardGrad)" stroke="#f7efe6" stroke-opacity="0.16"/>
    <rect x="28" y="0" width="424" height="2" rx="1" fill="#f7efe6" fill-opacity="0.28"/>

    <!-- Vinyl -->
    <g transform="translate(48, 48)">
      <circle cx="70" cy="70" r="70" fill="url(#vinylRing)"/>
      <circle cx="70" cy="70" r="70" fill="none" stroke="#f7efe6" stroke-opacity="0.08"/>
      <circle cx="70" cy="70" r="58" fill="none" stroke="#0d0a14" stroke-width="2" opacity="0.5"/>
      <circle cx="70" cy="70" r="46" fill="none" stroke="#0d0a14" stroke-width="2" opacity="0.45"/>
      <circle cx="70" cy="70" r="34" fill="none" stroke="#0d0a14" stroke-width="2" opacity="0.4"/>
      <circle cx="70" cy="70" r="22" fill="url(#labelGrad)"/>
      <circle cx="70" cy="70" r="7" fill="#1a1020"/>
      <text x="70" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#1a1020">CR</text>
    </g>

    <text x="210" y="88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#bfe9dc">● Live · Side B</text>
    <text x="210" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#f7efe6">Midnight Motown</text>
    <text x="210" y="164" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#f7efe6">Circle</text>
    <text x="210" y="200" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8d8074">Hosted by Mira · 14 listening</text>

    <!-- Now playing -->
    <rect x="40" y="250" width="400" height="96" rx="16" fill="#000000" fill-opacity="0.28" stroke="#f7efe6" stroke-opacity="0.1"/>
    <rect x="56" y="268" width="60" height="60" rx="12" fill="url(#artGrad)"/>
    <text x="136" y="288" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#8d8074" letter-spacing="1.5">NOW PLAYING</text>
    <text x="136" y="316" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f7efe6">What’s Going On</text>
    <text x="136" y="342" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#b7a99a">Marvin Gaye · 1971</text>

    <!-- Waveform bars (static) -->
    <g transform="translate(380, 285)" fill="url(#labelGrad)">
      <rect x="0" y="24" width="5" height="18" rx="2.5"/>
      <rect x="9" y="12" width="5" height="30" rx="2.5"/>
      <rect x="18" y="4" width="5" height="38" rx="2.5"/>
      <rect x="27" y="16" width="5" height="26" rx="2.5"/>
      <rect x="36" y="8" width="5" height="34" rx="2.5"/>
    </g>

    <!-- Chat lines -->
    <text x="48" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#4db6a0">Jules</text>
    <text x="108" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#b7a99a">that horn line still ruins me</text>

    <text x="48" y="448" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#e56b6b">Mira</text>
    <text x="108" y="448" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#b7a99a">next up: Trouble Man OST?</text>

    <text x="48" y="496" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8b86d">Asha</text>
    <text x="108" y="496" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#b7a99a">already queued · stay for it</text>
  </g>
</svg>
