<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Clearwater Index — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1c24;
      font-family: system-ui, sans-serif;
      color: #d7e6ea;
    }
    figure {
      margin: 1rem;
      max-width: 960px;
      width: min(100% - 2rem, 960px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Clearwater Index promotional poster">
    <figcaption>Gallery poster · 4:3 · Clearwater Index</figcaption>
  </figure>
</body>
</html>
