<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Clearwater Index gallery poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07151b"/>
      <stop offset="45%" stop-color="#0b2b33"/>
      <stop offset="100%" stop-color="#0a5c63"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8f7f9"/>
      <stop offset="55%" stop-color="#3ec4d2"/>
      <stop offset="100%" stop-color="#1aa6b5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="rgba(58,196,210,0.35)"/>
      <stop offset="100%" stop-color="rgba(58,196,210,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Soft wave bands -->
  <path d="M0 640 C180 600 280 700 460 680 C640 660 720 580 900 600 C1040 616 1120 670 1200 650 L1200 900 L0 900 Z" fill="rgba(14,124,134,0.35)"/>
  <path d="M0 720 C200 690 320 760 500 740 C700 716 780 660 960 690 C1080 706 1140 740 1200 730 L1200 900 L0 900 Z" fill="rgba(10,92,99,0.55)"/>

  <!-- Top brand row -->
  <g transform="translate(80,72)">
    <rect width="56" height="56" rx="14" fill="#0e7c86"/>
    <path d="M28 12c-7.5 11-12.2 16.5-12.2 22a12.2 12.2 0 1 0 24.4 0C40.2 28.5 35.5 23 28 12z" fill="#a8e0e8"/>
    <path d="M20 33.5c1.6 3.6 4.4 5.4 8 5.4s6.4-1.8 8-5.4" fill="none" stroke="#0a5c63" stroke-width="2" stroke-linecap="round"/>
    <text x="76" y="28" fill="#a8e0e8" font-family="Georgia, 'Palatino Linotype', serif" font-size="18" letter-spacing="3">WATER SYSTEMS · PUBLIC DATA</text>
    <text x="76" y="58" fill="#f3f8f9" font-family="Georgia, 'Palatino Linotype', serif" font-size="42" font-weight="700">Clearwater Index</text>
  </g>

  <!-- Main headline -->
  <text x="80" y="250" fill="#ffffff" font-family="Georgia, 'Palatino Linotype', serif" font-size="72" font-weight="700">Know where</text>
  <text x="80" y="330" fill="#ffffff" font-family="Georgia, 'Palatino Linotype', serif" font-size="72" font-weight="700">every drop goes.</text>
  <text x="80" y="390" fill="#c5dce2" font-family="Segoe UI, system-ui, sans-serif" font-size="24">
    Supply · Quality · Maintenance · Long-term planning
  </text>

  <!-- Large drop motif -->
  <g transform="translate(820,160)">
    <ellipse cx="110" cy="280" rx="95" ry="22" fill="rgba(0,0,0,0.18)"/>
    <path d="M110 40 C55 130 20 185 20 245 a90 90 0 0 0 180 0 C200 185 165 130 110 40z" fill="url(#drop)"/>
    <path d="M70 230 c14 38 40 58 70 58" fill="none" stroke="rgba(10,92,99,0.45)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="180" r="14" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Metric cards -->
  <g transform="translate(80,470)">
    <rect width="300" height="150" rx="22" fill="url(#card)" stroke="rgba(168,224,232,0.25)" stroke-width="1.5"/>
    <text x="28" y="52" fill="#3ec4d2" font-family="Georgia, serif" font-size="42" font-weight="700">142</text>
    <text x="28" y="92" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="20">MGD treated daily</text>
    <text x="28" y="122" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Citywide finished water</text>

    <rect x="320" width="300" height="150" rx="22" fill="url(#card)" stroke="rgba(168,224,232,0.25)" stroke-width="1.5"/>
    <text x="348" y="52" fill="#3ec4d2" font-family="Georgia, serif" font-size="42" font-weight="700">1,860</text>
    <text x="348" y="92" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="20">miles of pipe</text>
    <text x="348" y="122" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Distribution network</text>

    <rect x="640" width="300" height="150" rx="22" fill="url(#card)" stroke="rgba(168,224,232,0.25)" stroke-width="1.5"/>
    <text x="668" y="52" fill="#3ec4d2" font-family="Georgia, serif" font-size="42" font-weight="700">98.7%</text>
    <text x="668" y="92" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="20">pressure reliability</text>
    <text x="668" y="122" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Last published year</text>
  </g>

  <!-- Flow steps strip -->
  <g transform="translate(80,680)">
    <rect width="1040" height="120" rx="24" fill="rgba(7,21,27,0.45)" stroke="rgba(168,224,232,0.18)" stroke-width="1.5"/>
    <!-- steps -->
    <circle cx="70" cy="60" r="22" fill="#0e7c86"/>
    <text x="70" y="66" text-anchor="middle" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">1</text>
    <text x="110" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">Source</text>
    <text x="110" y="80" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="15">Watersheds</text>

    <circle cx="320" cy="60" r="22" fill="#0e7c86"/>
    <text x="320" y="66" text-anchor="middle" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">2</text>
    <text x="360" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">Treat</text>
    <text x="360" y="80" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="15">3 plants</text>

    <circle cx="560" cy="60" r="22" fill="#0e7c86"/>
    <text x="560" y="66" text-anchor="middle" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">3</text>
    <text x="600" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">Deliver</text>
    <text x="600" y="80" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="15">12 zones</text>

    <circle cx="810" cy="60" r="22" fill="#0e7c86"/>
    <text x="810" y="66" text-anchor="middle" fill="#e8f7f9" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">4</text>
    <text x="850" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">Monitor</text>
    <text x="850" y="80" fill="#9bb8c0" font-family="Segoe UI, system-ui, sans-serif" font-size="15">24/7 quality</text>
  </g>
</svg>
