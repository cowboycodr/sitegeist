<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kintsu — Care for the life between appointments">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="45%" stop-color="#e8efe9"/>
      <stop offset="100%" stop-color="#f0e0d6"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#efe9df"/>
      <stop offset="50%" stop-color="#d5c4ad"/>
      <stop offset="100%" stop-color="#b89a82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e2b4"/>
      <stop offset="100%" stop-color="#c4a04a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#e8d4a0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8d4a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="180" r="260" fill="url(#glow)"/>
  <circle cx="160" cy="720" r="200" fill="#dce8e0" opacity="0.45"/>

  <!-- Soft frame -->
  <rect x="48" y="48" width="1104" height="804" rx="36" fill="none" stroke="#d9d0c0" stroke-width="2"/>
  <rect x="68" y="68" width="1064" height="764" rx="28" fill="none" stroke="#c4a04a" stroke-width="1" opacity="0.35"/>

  <!-- Brand mark -->
  <g transform="translate(110, 120)">
    <circle cx="28" cy="28" r="28" fill="#dce8e0" stroke="#3a5548" stroke-width="2"/>
    <path d="M16 38c4-12 8.5-20 12-20s8 8 12 20" fill="none" stroke="#c4a04a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M20 26h16" fill="none" stroke="#3a5548" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark and copy -->
  <text x="190" y="158" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="42" font-weight="600" fill="#1a2a22">Kintsu</text>
  <text x="190" y="192" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="3.2" fill="#3a5548">WHOLE-PERSON MENTAL CARE</text>

  <text x="110" y="320" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="600" fill="#1a2a22">Care for the life</text>
  <text x="110" y="400" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="600" fill="#1a2a22">between appointments.</text>

  <text x="110" y="470" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#3d4f45">Daily reflection · Therapy bridge · Practical tools</text>

  <!-- Accent rule -->
  <line x1="110" y1="520" x2="320" y2="520" stroke="#c4a04a" stroke-width="3" stroke-linecap="round"/>

  <!-- Kintsugi vessel motif -->
  <g transform="translate(720, 220)">
    <ellipse cx="170" cy="420" rx="120" ry="22" fill="#3a5548" opacity="0.1"/>
    <!-- Bowl body -->
    <path d="M70 140c-10 40-14 90-8 140 8 65 36 110 108 110s100-45 108-110c6-50 2-100-8-140" fill="url(#vessel)" stroke="#3a5548" stroke-width="4"/>
    <!-- Rim -->
    <path d="M62 140h216" fill="none" stroke="#3a5548" stroke-width="5" stroke-linecap="round"/>
    <path d="M95 140c6-40 28-70 75-70s69 30 75 70" fill="none" stroke="#3a5548" stroke-width="4"/>
    <!-- Gold seams -->
    <path d="M105 170c40 25 62 80 52 145" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 190c-18 42-12 95 12 135" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M140 280c28 10 64 6 88-18" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="158" cy="248" r="5" fill="#c4a04a"/>
    <circle cx="228" cy="320" r="4" fill="#c4a04a"/>
    <!-- Soft leaf accent -->
    <path d="M250 90c30 10 48 40 40 72-28-8-50-34-40-72z" fill="#6f8f7c" opacity="0.55"/>
    <path d="M250 90c-8 28 6 56 40 72" fill="none" stroke="#3a5548" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Bottom chips -->
  <g transform="translate(110, 620)">
    <rect width="220" height="64" rx="32" fill="#fffcf7" stroke="#d9d0c0" stroke-width="2"/>
    <circle cx="36" cy="32" r="8" fill="#c4a04a"/>
    <text x="56" y="38" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#3d4f45">Begin a check-in</text>

    <rect x="240" width="200" height="64" rx="32" fill="#3a5548"/>
    <text x="280" y="38" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#fffcf7">How it works</text>
  </g>

  <text x="110" y="780" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" fill="#6a7a70">Mental Wellness · Calm continuity between sessions</text>
</svg>
