<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Selene Mission</title>
  <desc id="desc">Gallery poster for Selene Mission — lunar habitat program</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="45%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#152038"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="68%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#7ee0ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7ee0ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7ee0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="42%" stop-color="#c9d4e6"/>
      <stop offset="78%" stop-color="#8fa0bc"/>
      <stop offset="100%" stop-color="#667891"/>
    </radialGradient>
    <linearGradient id="habitat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3fb"/>
      <stop offset="100%" stop-color="#9eb0cc"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f5fb"/>
      <stop offset="55%" stop-color="#7ee0ff"/>
      <stop offset="100%" stop-color="#e0c48a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#moonGlow)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="86" cy="78" r="1.6" opacity="0.7"/>
    <circle cx="164" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="240" cy="64" r="1.8" opacity="0.65"/>
    <circle cx="320" cy="180" r="1.1" opacity="0.45"/>
    <circle cx="410" cy="96" r="1.5" opacity="0.6"/>
    <circle cx="520" cy="48" r="1.3" opacity="0.5"/>
    <circle cx="610" cy="130" r="1.7" opacity="0.55"/>
    <circle cx="980" cy="72" r="1.4" opacity="0.6"/>
    <circle cx="1080" cy="150" r="1.8" opacity="0.5"/>
    <circle cx="1140" cy="88" r="1.2" opacity="0.45"/>
    <circle cx="90" cy="420" r="1.3" opacity="0.4"/>
    <circle cx="150" cy="520" r="1.6" opacity="0.5"/>
    <circle cx="70" cy="680" r="1.2" opacity="0.35"/>
    <circle cx="1110" cy="480" r="1.5" opacity="0.45"/>
    <circle cx="1040" cy="620" r="1.2" opacity="0.4"/>
    <circle cx="1160" cy="700" r="1.7" opacity="0.5"/>
  </g>

  <!-- orbit rings -->
  <circle cx="760" cy="390" r="290" fill="none" stroke="rgba(186,208,240,0.18)" stroke-width="1.5" stroke-dasharray="8 12"/>
  <circle cx="760" cy="390" r="340" fill="none" stroke="rgba(126,224,255,0.12)" stroke-width="1"/>
  <circle cx="760" cy="390" r="290" fill="none" stroke="none"/>
  <circle cx="760" cy="110" r="7" fill="#e0c48a"/>
  <circle cx="1040" cy="520" r="5" fill="#7ee0ff"/>

  <!-- moon -->
  <circle cx="760" cy="390" r="210" fill="url(#moonBody)"/>
  <circle cx="700" cy="330" r="28" fill="rgba(12,18,30,0.18)"/>
  <circle cx="820" cy="420" r="42" fill="rgba(12,18,30,0.22)"/>
  <circle cx="690" cy="460" r="22" fill="rgba(12,18,30,0.16)"/>
  <circle cx="850" cy="320" r="16" fill="rgba(12,18,30,0.14)"/>
  <circle cx="720" cy="300" r="8" fill="rgba(255,255,255,0.55)"/>

  <!-- habitat on surface -->
  <g transform="translate(670 410)">
    <ellipse cx="90" cy="118" rx="78" ry="12" fill="rgba(8,12,20,0.35)"/>
    <path d="M28 96c0-20 24-38 62-38s62 18 62 38v10H28V96z" fill="url(#habitat)"/>
    <rect x="58" y="52" width="64" height="42" rx="12" fill="#f4f7fc"/>
    <rect x="72" y="64" width="36" height="14" rx="4" fill="#7ee0ff" opacity="0.6"/>
    <path d="M78 52V34c0-8 6-14 12-14s12 6 12 14v18" stroke="#c9d4e6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="90" cy="18" r="8" fill="#e0c48a"/>
    <path d="M18 100h144" stroke="#a8b8d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 100l-14 20M144 100l14 20" stroke="#9eb0cc" stroke-width="4" stroke-linecap="round"/>
    <rect x="8" y="88" width="22" height="12" rx="3" fill="#b8c6dc"/>
    <rect x="150" y="88" width="22" height="12" rx="3" fill="#b8c6dc"/>
  </g>

  <!-- left copy block -->
  <g transform="translate(72 96)">
    <rect x="0" y="0" width="168" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(186,208,240,0.28)"/>
    <circle cx="22" cy="17" r="5" fill="#7ee0ff"/>
    <text x="38" y="22" fill="#7ee0ff" font-family="Segoe UI, system-ui, sans-serif" font-size="14" letter-spacing="2.4">LUNAR HABITAT · M01</text>

    <text x="0" y="130" fill="#e8eef8" font-family="Segoe UI, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">Selene</text>
    <text x="0" y="210" fill="url(#word)" font-family="Segoe UI, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">Mission</text>

    <text x="0" y="280" fill="#9fb0cc" font-family="Segoe UI, system-ui, sans-serif" font-size="28">The moon is our next address.</text>

    <rect x="0" y="330" width="72" height="4" rx="2" fill="#e0c48a"/>

    <text x="0" y="390" fill="#93a3bc" font-family="Segoe UI, system-ui, sans-serif" font-size="22">
      Private lunar program · autonomous surface habitat
    </text>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="800" width="1200" height="100" fill="rgba(5,7,12,0.55)"/>
  <text x="72" y="858" fill="#c9d4e6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" letter-spacing="3">MARE SERENITATIS  ·  PHASE 03 INTEGRATION  ·  AEROSPACE</text>
</svg>
