<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Selene Mission — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0e16;
      color: #c9d4e6;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100% - 2rem);
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(186, 208, 240, 0.16);
      display: block;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #05070c;
    }
    figcaption {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.92rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Selene Mission gallery poster">
    <figcaption>Selene Mission — promotional poster (4:3)</figcaption>
  </figure>
</body>
</html>
