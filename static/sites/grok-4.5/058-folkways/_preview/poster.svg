<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Folkways — Every song carries a place">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf6ef"/>
      <stop offset="45%" stop-color="#f0e6d4"/>
      <stop offset="100%" stop-color="#dcc9a8"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2f24"/>
      <stop offset="50%" stop-color="#1c1712"/>
      <stop offset="100%" stop-color="#2a211a"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#b54a32" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b54a32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#2f4a3c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2f4a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Subtle paper grain via dots -->
  <g fill="#1c1712" opacity="0.04">
    <circle cx="80" cy="70" r="1.5"/>
    <circle cx="220" cy="140" r="1"/>
    <circle cx="150" cy="320" r="1.2"/>
    <circle cx="980" cy="90" r="1.4"/>
    <circle cx="1100" cy="200" r="1"/>
    <circle cx="1050" cy="700" r="1.3"/>
    <circle cx="90" cy="780" r="1.1"/>
    <circle cx="400" cy="850" r="1"/>
    <circle cx="700" cy="60" r="1.2"/>
  </g>

  <!-- Decorative map silhouette (stylized continents) -->
  <g opacity="0.14" fill="#2f4a3c">
    <path d="M180 360 Q240 320 310 340 T420 360 Q440 410 400 460 T300 500 Q230 490 190 440 Z"/>
    <path d="M520 300 Q590 270 660 300 T740 350 Q750 410 700 450 T580 460 Q520 420 510 370 Z"/>
    <path d="M780 380 Q850 360 920 390 T1000 430 Q1010 490 950 530 T820 520 Q770 470 775 420 Z"/>
    <path d="M280 560 Q340 540 380 580 T400 680 Q350 720 290 700 T250 620 Z"/>
  </g>

  <!-- Archive pins -->
  <g>
    <circle cx="300" cy="400" r="8" fill="#b54a32"/>
    <circle cx="300" cy="400" r="16" fill="none" stroke="#b54a32" stroke-width="2" opacity="0.35"/>
    <circle cx="640" cy="360" r="8" fill="#b54a32"/>
    <circle cx="640" cy="360" r="16" fill="none" stroke="#b54a32" stroke-width="2" opacity="0.35"/>
    <circle cx="900" cy="440" r="8" fill="#b54a32"/>
    <circle cx="900" cy="440" r="16" fill="none" stroke="#b54a32" stroke-width="2" opacity="0.35"/>
    <circle cx="340" cy="640" r="7" fill="#c9a24a"/>
  </g>

  <!-- Vinyl disc motif -->
  <g transform="translate(860 220)">
    <circle cx="0" cy="0" r="148" fill="url(#discGrad)"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#c9a24a" stroke-width="4" opacity="0.7"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f3ebe0" stroke-width="0.8" opacity="0.12"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#f3ebe0" stroke-width="0.8" opacity="0.1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f3ebe0" stroke-width="0.8" opacity="0.1"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f3ebe0" stroke-width="0.8" opacity="0.1"/>
    <circle cx="0" cy="0" r="42" fill="#b54a32"/>
    <circle cx="0" cy="0" r="18" fill="#1c1712"/>
    <circle cx="0" cy="0" r="7" fill="#f3ebe0"/>
  </g>

  <!-- Waveform bars -->
  <g transform="translate(120 620)" fill="#b54a32">
    <rect x="0" y="28" width="10" height="44" rx="3" opacity="0.55"/>
    <rect x="18" y="16" width="10" height="68" rx="3" opacity="0.7"/>
    <rect x="36" y="34" width="10" height="32" rx="3" opacity="0.5"/>
    <rect x="54" y="8" width="10" height="84" rx="3" opacity="0.85"/>
    <rect x="72" y="22" width="10" height="56" rx="3" opacity="0.65"/>
    <rect x="90" y="12" width="10" height="76" rx="3" opacity="0.8"/>
    <rect x="108" y="30" width="10" height="40" rx="3" opacity="0.55"/>
    <rect x="126" y="4" width="10" height="92" rx="3" opacity="0.9"/>
    <rect x="144" y="20" width="10" height="60" rx="3" opacity="0.7"/>
    <rect x="162" y="14" width="10" height="72" rx="3" opacity="0.75"/>
    <rect x="180" y="26" width="10" height="48" rx="3" opacity="0.55"/>
    <rect x="198" y="10" width="10" height="80" rx="3" opacity="0.85"/>
    <rect x="216" y="24" width="10" height="52" rx="3" opacity="0.65"/>
    <rect x="234" y="6" width="10" height="88" rx="3" opacity="0.9"/>
    <rect x="252" y="18" width="10" height="64" rx="3" opacity="0.7"/>
    <rect x="270" y="32" width="10" height="36" rx="3" opacity="0.5"/>
    <rect x="288" y="12" width="10" height="76" rx="3" opacity="0.8"/>
    <rect x="306" y="22" width="10" height="56" rx="3" opacity="0.65"/>
  </g>

  <!-- Eyebrow -->
  <text x="120" y="210" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" letter-spacing="4" fill="#2f4a3c" font-weight="700">SOUNDS FROM THE ARCHIVE</text>

  <!-- Title -->
  <text x="120" y="310" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="108" font-weight="700" fill="#1c1712">Folkways</text>

  <!-- Tagline -->
  <text x="120" y="390" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="42" font-style="italic" fill="#b54a32">Every song carries a place.</text>

  <!-- Supporting line -->
  <text x="120" y="460" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#3a3229">Field recordings · Oral histories · Traditional music</text>

  <!-- Bottom rule -->
  <line x1="120" y1="780" x2="480" y2="780" stroke="#8a7460" stroke-width="2" opacity="0.4"/>
  <text x="120" y="820" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#8a7460" letter-spacing="1">MUSIC ARCHIVE</text>
</svg>
