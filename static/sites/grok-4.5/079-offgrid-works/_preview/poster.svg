<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Offgrid Works — A cabin with a steering wheel">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1411"/>
      <stop offset="42%" stop-color="#1a2f28"/>
      <stop offset="72%" stop-color="#2d4a3e"/>
      <stop offset="100%" stop-color="#c4a574"/>
    </linearGradient>
    <linearGradient id="ridgeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1f1a"/>
      <stop offset="100%" stop-color="#162822"/>
    </linearGradient>
    <linearGradient id="cabinBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d4"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12201b"/>
      <stop offset="100%" stop-color="#0b1411"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Soft moon -->
  <circle cx="940" cy="160" r="52" fill="#f0d9a8" opacity="0.92"/>
  <circle cx="940" cy="160" r="78" fill="#f0d9a8" opacity="0.12"/>
  <circle cx="940" cy="160" r="110" fill="#f0d9a8" opacity="0.05"/>

  <!-- Distant ridges -->
  <path d="M0 430 L160 340 L300 400 L460 280 L620 370 L780 250 L940 340 L1080 290 L1200 330 L1200 900 L0 900 Z" fill="url(#ridgeDark)" opacity="0.95"/>
  <path d="M0 520 L200 430 L380 500 L540 410 L720 490 L900 400 L1080 470 L1200 430 L1200 900 L0 900 Z" fill="#0a1511"/>

  <!-- Ground band -->
  <rect x="0" y="620" width="1200" height="280" fill="#080f0c"/>
  <path d="M0 620 Q300 590 600 615 T1200 600 L1200 900 L0 900 Z" fill="#0d1814"/>

  <!-- Subtle road -->
  <path d="M180 900 C360 760 520 720 720 700 C860 690 1000 700 1200 760 L1200 900 Z" fill="#121f1a" opacity="0.85"/>
  <path d="M420 900 C520 800 620 760 780 740" fill="none" stroke="#c4a574" stroke-width="3" stroke-dasharray="14 18" opacity="0.35"/>

  <!-- Electric camper -->
  <g transform="translate(280 470)">
    <!-- shadow -->
    <ellipse cx="320" cy="250" rx="280" ry="22" fill="#000" opacity="0.35"/>
    <!-- cabin body -->
    <rect x="40" y="70" width="520" height="140" rx="22" fill="url(#cabinBody)"/>
    <rect x="40" y="70" width="520" height="42" rx="22" fill="#2d4a3e"/>
    <rect x="40" y="92" width="520" height="20" fill="#2d4a3e"/>
    <!-- modular panels -->
    <rect x="70" y="125" width="100" height="60" rx="8" fill="#7eb8c9" opacity="0.75"/>
    <rect x="190" y="125" width="100" height="60" rx="8" fill="#7eb8c9" opacity="0.5"/>
    <rect x="320" y="118" width="130" height="70" rx="12" fill="#1a2f28"/>
    <rect x="338" y="132" width="46" height="30" rx="4" fill="#7eb8c9" opacity="0.45"/>
    <rect x="396" y="132" width="36" height="30" rx="4" fill="#7eb8c9" opacity="0.3"/>
    <!-- nose -->
    <path d="M40 130 H8 a14 14 0 0 0-14 14 v40 a14 14 0 0 0 14 14 H40" fill="#2d4a3e"/>
    <!-- solar / antenna -->
    <rect x="560" y="105" width="22" height="70" rx="4" fill="#c4a574"/>
    <path d="M571 68 v36" stroke="#c4a574" stroke-width="4" stroke-linecap="round"/>
    <circle cx="571" cy="56" r="12" fill="none" stroke="#7eb8c9" stroke-width="3"/>
    <circle cx="571" cy="56" r="4" fill="#7eb8c9"/>
    <!-- wheels -->
    <circle cx="150" cy="220" r="34" fill="#0b1411" stroke="#c4a574" stroke-width="7"/>
    <circle cx="150" cy="220" r="12" fill="#c4a574"/>
    <circle cx="450" cy="220" r="34" fill="#0b1411" stroke="#c4a574" stroke-width="7"/>
    <circle cx="450" cy="220" r="12" fill="#c4a574"/>
    <!-- steering wheel motif (small cabin detail) -->
    <circle cx="385" cy="152" r="10" fill="none" stroke="#e8dcc8" stroke-width="2" opacity="0.7"/>
    <path d="M385 144 v16 M377 152 h16" stroke="#e8dcc8" stroke-width="1.5" opacity="0.55"/>
  </g>

  <!-- Brand card -->
  <g transform="translate(80 70)">
    <rect x="0" y="0" width="520" height="280" rx="28" fill="url(#card)" opacity="0.92" stroke="#c4a574" stroke-width="2" stroke-opacity="0.35"/>
    <text x="40" y="68" fill="#c4a574" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">BUILT BEYOND THE MAP</text>
    <text x="40" y="130" fill="#f3eee4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="750">Offgrid Works</text>
    <text x="40" y="185" fill="#e0c48a" font-family="Georgia, Times New Roman, serif" font-size="30" font-style="italic">A cabin with a steering wheel.</text>
    <text x="40" y="235" fill="#b7c4bb" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20">Modular electric campers</text>
  </g>

  <!-- Bottom label bar -->
  <rect x="0" y="820" width="1200" height="80" fill="#080f0c" opacity="0.75"/>
  <text x="80" y="868" fill="#8a9a90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3">ADVENTURE VEHICLES · QUIET ROADS · REMOTE WORK</text>
  <circle cx="1080" cy="860" r="10" fill="none" stroke="#7eb8c9" stroke-width="3"/>
  <circle cx="1080" cy="860" r="3" fill="#7eb8c9"/>
</svg>
