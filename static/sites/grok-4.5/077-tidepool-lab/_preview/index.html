<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tidepool Lab — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e2133;
      font-family: system-ui, sans-serif;
      color: #f3ebe0;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Tidepool Lab gallery poster">
    <figcaption>Tidepool Lab — 4:3 gallery poster</figcaption>
  </figure>
</body>
</html>
