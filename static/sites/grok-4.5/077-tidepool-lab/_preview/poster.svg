<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Tidepool Lab</title>
  <desc id="poster-desc">Gallery poster for Tidepool Lab with a rocky tidepool motif, deep navy water, and sea-glass accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12324a"/>
      <stop offset="48%" stop-color="#0c2133"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad6d0"/>
      <stop offset="45%" stop-color="#2a7d8a"/>
      <stop offset="100%" stop-color="#14324a"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a52"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#7ec8c4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7ec8c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="920" cy="180" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="760" r="220" fill="#2a7d8a" opacity="0.08"/>

  <!-- Horizon band -->
  <path d="M0 250 C200 210 380 280 560 240 C740 200 900 250 1200 220 L1200 0 L0 0 Z" fill="#1c5670" opacity="0.18"/>

  <!-- Rocky shelf -->
  <path d="M80 620 C180 500 280 470 420 490 C540 508 620 560 760 540 C900 520 1000 560 1120 620 L1120 860 L80 860 Z" fill="url(#rock)"/>
  <path d="M120 630 C230 540 340 520 470 540 C600 560 690 610 820 590 C940 572 1020 610 1100 660" fill="none" stroke="#2a4a62" stroke-width="10" opacity="0.55"/>

  <!-- Tidepool water -->
  <ellipse cx="620" cy="620" rx="290" ry="145" fill="url(#pool)"/>
  <ellipse cx="620" cy="600" rx="210" ry="70" fill="#b8e0d2" opacity="0.28"/>
  <path d="M380 600 C470 560 560 575 640 590 C720 605 800 585 880 610" fill="none" stroke="#d7f2ec" stroke-width="5" opacity="0.55" stroke-linecap="round"/>

  <!-- Anemone -->
  <ellipse cx="500" cy="640" rx="42" ry="28" fill="#d9785c"/>
  <circle cx="485" cy="632" r="5" fill="#f3ebe0"/>
  <circle cx="502" cy="626" r="5" fill="#f3ebe0"/>
  <circle cx="518" cy="636" r="5" fill="#f3ebe0"/>
  <ellipse cx="710" cy="655" rx="30" ry="20" fill="#c45c48"/>

  <!-- Kelp fronds -->
  <path d="M780 670 C800 580 820 520 845 470" fill="none" stroke="#3d6b4f" stroke-width="14" stroke-linecap="round"/>
  <path d="M820 665 C845 590 870 540 900 495" fill="none" stroke="#5f8f6d" stroke-width="10" stroke-linecap="round"/>
  <path d="M860 675 C880 610 910 565 940 525" fill="none" stroke="#2f5d4a" stroke-width="8" stroke-linecap="round"/>

  <!-- Shell / hermit -->
  <ellipse cx="590" cy="680" rx="28" ry="18" fill="#e6d4b5"/>
  <path d="M615 680 C640 678 660 692 668 710" fill="none" stroke="#d2bf9d" stroke-width="8" stroke-linecap="round"/>

  <!-- Bubbles -->
  <circle cx="430" cy="590" r="8" fill="#7ec8c4" opacity="0.7"/>
  <circle cx="760" cy="600" r="6" fill="#b8e0d2" opacity="0.65"/>
  <circle cx="670" cy="560" r="5" fill="#9ad6d0" opacity="0.55"/>

  <!-- Brand mark -->
  <g transform="translate(92 88)">
    <rect width="72" height="72" rx="18" fill="#14324a"/>
    <ellipse cx="36" cy="44" rx="22" ry="13" fill="#2a7d8a"/>
    <ellipse cx="36" cy="40" rx="15" ry="8" fill="#7ec8c4" opacity="0.9"/>
    <circle cx="24" cy="28" r="4" fill="#b8e0d2"/>
    <circle cx="40" cy="24" r="3" fill="#d9785c"/>
  </g>

  <!-- Typography -->
  <text x="188" y="128" fill="#f3ebe0" font-family="Georgia, 'Palatino Linotype', serif" font-size="34" font-weight="600" letter-spacing="1">TIDEPOOL LAB</text>
  <text x="188" y="168" fill="#7ec8c4" font-family="Georgia, 'Palatino Linotype', serif" font-size="26" font-style="italic">Reading the edge of the sea.</text>

  <text x="92" y="250" fill="#e6d4b5" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="3">FIELD NOTE  ·  37.7749° N</text>

  <!-- Bottom caption bar -->
  <rect x="0" y="780" width="1200" height="120" fill="#071018" opacity="0.72"/>
  <text x="92" y="835" fill="#f3ebe0" font-family="Georgia, 'Palatino Linotype', serif" font-size="28">Biodiversity · Temperature · Resilient habitats</text>
  <text x="92" y="875" fill="#7ec8c4" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="2">OCEAN RESEARCH FIELD STATION</text>
</svg>
