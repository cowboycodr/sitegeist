<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Orbit — Money that moves with you">
  <defs>
    <radialGradient id="bg1" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#1a3a3a"/>
      <stop offset="55%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <radialGradient id="bg2" cx="90%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(232,196,122,0.22)"/>
      <stop offset="100%" stop-color="rgba(232,196,122,0)"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="40%" stop-color="#e8c47a"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="100%" stop-color="#121a2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg1)"/>
  <rect width="1200" height="900" fill="url(#bg2)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="80" cy="90" r="1.5"/>
    <circle cx="160" cy="200" r="1"/>
    <circle cx="240" cy="70" r="1.2"/>
    <circle cx="980" cy="120" r="1.4"/>
    <circle cx="1080" cy="240" r="1"/>
    <circle cx="920" cy="80" r="1.1"/>
    <circle cx="1100" cy="700" r="1.3"/>
    <circle cx="100" cy="760" r="1"/>
    <circle cx="200" cy="820" r="1.2"/>
    <circle cx="700" cy="60" r="1"/>
    <circle cx="50" cy="480" r="1.1"/>
    <circle cx="1140" cy="480" r="1"/>
  </g>

  <!-- Orbital rings (motif) -->
  <g transform="translate(780 430)" fill="none">
    <circle r="78" fill="url(#core)" filter="url(#soft)" opacity="0.95"/>
    <ellipse rx="210" ry="78" stroke="#7ec8c8" stroke-width="2.5" opacity="0.55" transform="rotate(-28)"/>
    <ellipse rx="210" ry="78" stroke="#e8c47a" stroke-width="2" opacity="0.4" transform="rotate(38)"/>
    <ellipse rx="280" ry="100" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" transform="rotate(-10)"/>
    <circle cx="168" cy="-92" r="10" fill="#7ec8c8"/>
    <circle cx="-150" cy="70" r="8" fill="#e8c47a"/>
    <circle cx="40" cy="145" r="6" fill="#f3efe6" opacity="0.8"/>
  </g>

  <!-- Floating mini cards -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="620" y="210" width="168" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(232,196,122,0.35)" stroke-width="1.5"/>
    <text x="640" y="242" fill="#f3efe6" font-size="18" font-weight="700">Save</text>
    <text x="640" y="268" fill="#8fd4a8" font-size="15" font-weight="600">+4.25% APY</text>

    <rect x="980" y="320" width="168" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(126,200,200,0.3)" stroke-width="1.5"/>
    <text x="1000" y="352" fill="#f3efe6" font-size="18" font-weight="700">Invest</text>
    <text x="1000" y="378" fill="#8fd4a8" font-size="15" font-weight="600">+$1,284</text>

    <rect x="640" y="560" width="180" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(232,196,122,0.28)" stroke-width="1.5"/>
    <text x="660" y="592" fill="#f3efe6" font-size="18" font-weight="700">Cross-border</text>
    <text x="660" y="618" fill="#7ec8c8" font-size="15" font-weight="600">EUR · GBP · JPY</text>
  </g>

  <!-- Brand block -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Logo mark -->
    <g transform="translate(96 118)">
      <circle cx="22" cy="22" r="10" fill="#e8c47a"/>
      <ellipse cx="22" cy="22" rx="26" ry="11" fill="none" stroke="#7ec8c8" stroke-width="2.5" transform="rotate(-28 22 22)"/>
      <ellipse cx="22" cy="22" rx="26" ry="11" fill="none" stroke="rgba(232,196,122,0.5)" stroke-width="2" transform="rotate(42 22 22)"/>
    </g>
    <text x="168" y="150" fill="#f3efe6" font-size="36" font-weight="700" letter-spacing="0.5">Orbit</text>

    <text x="96" y="230" fill="#7ec8c8" font-size="18" font-weight="700" letter-spacing="4">BANKING WITHOUT GRAVITY</text>
    <text x="96" y="320" fill="#f3efe6" font-size="64" font-weight="700" letter-spacing="-1.5">Money that</text>
    <text x="96" y="396" fill="#f3efe6" font-size="64" font-weight="700" letter-spacing="-1.5">moves with you.</text>
    <text x="96" y="470" fill="#9aa6bd" font-size="24">One account for saving, spending,</text>
    <text x="96" y="508" fill="#9aa6bd" font-size="24">investing, and living across borders.</text>

    <!-- CTA chip -->
    <rect x="96" y="560" width="220" height="56" rx="28" fill="#e8c47a"/>
    <text x="206" y="596" fill="#1a1408" font-size="20" font-weight="700" text-anchor="middle">Open an account</text>
  </g>
</svg>
