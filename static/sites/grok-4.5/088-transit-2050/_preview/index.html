<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Transit 2050 — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a2433;
      font-family: system-ui, sans-serif;
      color: #e8eef5;
    }
    figure {
      margin: 1rem;
      max-width: 900px;
      width: min(100% - 2rem, 900px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      opacity: 0.75;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Transit 2050 gallery poster">
    <figcaption>Gallery poster · 4:3 · Transit 2050</figcaption>
  </figure>
</body>
</html>
