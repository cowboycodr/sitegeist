<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Fellowship — Back the beautifully unreasonable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f12"/>
      <stop offset="55%" stop-color="#12181e"/>
      <stop offset="100%" stop-color="#1a2229"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#c4783a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c4783a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c4783a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e8dcc8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Frame -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#e8dcc8" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#c4783a" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Corner ticks -->
  <path d="M48 88V48H88" fill="none" stroke="#c4783a" stroke-width="2"/>
  <path d="M1112 48h40v40" fill="none" stroke="#c4783a" stroke-width="2"/>
  <path d="M48 812v40h40" fill="none" stroke="#c4783a" stroke-width="2"/>
  <path d="M1112 852h40v-40" fill="none" stroke="#c4783a" stroke-width="2"/>

  <!-- Schematic motif: precision cross + orbit -->
  <g transform="translate(860 280)" fill="none" stroke="#c4783a" stroke-opacity="0.55">
    <circle r="96" stroke-width="1.5"/>
    <circle r="62" stroke-width="1" stroke-opacity="0.7"/>
    <circle r="8" fill="#c4783a" stroke="none" opacity="0.9"/>
    <path d="M-120 0H120M0 -120V120" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M-42 -42L42 42M42 -42L-42 42" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="-118" y="-118" width="236" height="236" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Small mark -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="44" height="44" fill="none" stroke="#c4783a" stroke-width="1.75"/>
    <path d="M10 32V12h6.5c3.8 0 6.2 2 6.2 5.1 0 3.1-2.4 5.1-6.2 5.1H14.5V32H10zm4.5-11.2h1.5c1.5 0 2.4-.7 2.4-1.8s-.9-1.8-2.4-1.8h-1.5v3.6zM24.5 32l4.5-17h4.8L38.3 32h-4.4l-.8-3.1h-4.1L28.2 32h-3.7zm5.7-6.5h2.7l-1.35-5.2-1.35 5.2z" fill="#f3ece0"/>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="210" fill="#e09a52" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="20" letter-spacing="4">PRE-SEED / DEEP SYSTEMS</text>
  <line x1="96" y1="228" x2="176" y2="228" stroke="#c4783a" stroke-width="2"/>

  <!-- Title -->
  <text x="96" y="320" fill="#f3ece0" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="600" letter-spacing="-1.5">Fellowship</text>

  <!-- Tagline -->
  <text x="96" y="410" fill="#f3ece0" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="42" font-style="italic">Back the beautifully</text>
  <text x="96" y="468" fill="#f3ece0" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="42" font-style="italic">unreasonable.</text>

  <!-- Description block -->
  <text x="96" y="560" fill="#c9bfb0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22">An early-stage fund for technical founders</text>
  <text x="96" y="596" fill="#c9bfb0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22">building ambitious tools for the physical world.</text>

  <!-- Bottom meta bar -->
  <rect x="96" y="720" width="1008" height="1" fill="#e8dcc8" opacity="0.18"/>
  <text x="96" y="770" fill="#8a8174" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="2">VENTURE STUDIO</text>
  <text x="360" y="770" fill="#8a8174" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="2">ATOMS · ENERGY · SYSTEMS</text>
  <text x="820" y="770" fill="#c4783a" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="2">FELLOWSHIP.FUND</text>
</svg>
