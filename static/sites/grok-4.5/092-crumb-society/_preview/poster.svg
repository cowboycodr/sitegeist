<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="55%" stop-color="#2a1c12"/>
      <stop offset="100%" stop-color="#3d2414"/>
    </linearGradient>
    <linearGradient id="pastry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6d0"/>
      <stop offset="40%" stop-color="#e8c48a"/>
      <stop offset="100%" stop-color="#c47a3a"/>
    </linearGradient>
    <linearGradient id="butter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c47a3a"/>
      <stop offset="100%" stop-color="#a86a28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft glow -->
  <ellipse cx="900" cy="280" rx="280" ry="200" fill="#c47a3a" opacity="0.12"/>
  <ellipse cx="220" cy="620" rx="240" ry="180" fill="#e8c48a" opacity="0.08"/>

  <!-- Decorative crumb dots -->
  <g fill="#e8c48a" opacity="0.35">
    <circle cx="140" cy="160" r="5"/>
    <circle cx="175" cy="190" r="3.5"/>
    <circle cx="120" cy="210" r="4"/>
    <circle cx="200" cy="140" r="3"/>
    <circle cx="1050" cy="700" r="5"/>
    <circle cx="1080" cy="740" r="3.5"/>
    <circle cx="1020" cy="760" r="4"/>
    <circle cx="980" cy="120" r="3"/>
    <circle cx="1010" cy="145" r="2.5"/>
  </g>

  <!-- Laminated pastry stack motif (right) -->
  <g transform="translate(720, 200)">
    <rect x="0" y="20" width="340" height="48" rx="6" fill="#f5e6d0" transform="rotate(-8 170 44)"/>
    <rect x="10" y="72" width="340" height="32" rx="4" fill="#c47a3a" transform="rotate(-8 180 88)" opacity="0.9"/>
    <rect x="18" y="108" width="340" height="48" rx="6" fill="#e8c48a" transform="rotate(-8 188 132)"/>
    <rect x="28" y="160" width="340" height="32" rx="4" fill="#a86a28" transform="rotate(-8 198 176)"/>
    <rect x="36" y="196" width="340" height="48" rx="6" fill="#f0d5a8" transform="rotate(-8 206 220)"/>
    <rect x="46" y="248" width="340" height="28" rx="4" fill="#8b4518" transform="rotate(-8 216 262)"/>
    <rect x="54" y="280" width="340" height="42" rx="6" fill="#d4a060" transform="rotate(-8 224 301)"/>
  </g>

  <!-- Small pastry seal (left of type) -->
  <g transform="translate(140, 280)">
    <circle cx="70" cy="70" r="68" fill="none" stroke="#e8c48a" stroke-width="2" opacity="0.5"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="#c47a3a" stroke-width="1.5" opacity="0.4"/>
    <!-- Mini croissant shape -->
    <path d="M30 80 Q50 40 70 55 Q90 40 110 80 Q90 95 70 90 Q50 95 30 80Z" fill="url(#pastry)"/>
    <path d="M42 72 Q55 55 70 65 Q85 55 98 72" fill="none" stroke="#8b4518" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Brand wordmark -->
  <text x="140" y="480" fill="#f7f0e6" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="600" letter-spacing="-1.5">Crumb Society</text>

  <!-- Tagline -->
  <text x="140" y="555" fill="#e8c48a" font-family="Georgia, 'Iowan Old Style', serif" font-size="36" font-style="italic">Loud pastry. Quiet mornings.</text>

  <!-- Divider line -->
  <rect x="140" y="590" width="120" height="3" rx="1.5" fill="#c47a3a"/>

  <!-- Supporting line -->
  <text x="140" y="640" fill="#c4a882" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" letter-spacing="3">HERITAGE GRAIN · CULTURED BUTTER · SEASONAL FRUIT</text>

  <!-- Bottom bar accent -->
  <rect x="0" y="860" width="1200" height="40" fill="#c47a3a" opacity="0.85"/>
  <text x="600" y="887" text-anchor="middle" fill="#1a120c" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="4">FRESH FROM 7:00</text>
</svg>
