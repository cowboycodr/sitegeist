<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Civic Stack — Better tools for public life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#163A5F"/>
      <stop offset="100%" stop-color="#0D5C55"/>
    </linearGradient>
    <linearGradient id="layerTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A6B63"/>
      <stop offset="100%" stop-color="#14A896"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163A5F"/>
      <stop offset="100%" stop-color="#2A5F8F"/>
    </linearGradient>
    <linearGradient id="layerBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="100%" stop-color="#1A334D"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#14A896" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14A896" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Soft paper panel -->
  <rect x="72" y="72" width="1056" height="756" rx="28" fill="#F6F2EA" opacity="0.06"/>
  <rect x="72" y="72" width="1056" height="756" rx="28" fill="none" stroke="#F6F2EA" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Brand mark: stacked layers motif (left) -->
  <g transform="translate(140, 200)">
    <rect x="80" y="280" width="360" height="72" rx="16" fill="url(#layerBot)"/>
    <rect x="50" y="180" width="420" height="72" rx="16" fill="url(#layerMid)"/>
    <rect x="100" y="80" width="320" height="72" rx="16" fill="url(#layerTop)"/>

    <!-- subtle highlight lines on layers -->
    <rect x="120" y="104" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.35"/>
    <rect x="80" y="204" width="90" height="10" rx="5" fill="#FFFFFF" opacity="0.28"/>
    <rect x="110" y="304" width="70" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>

    <!-- base bar -->
    <rect x="60" y="380" width="400" height="18" rx="9" fill="#D9D0C0" opacity="0.35"/>
  </g>

  <!-- Copy block -->
  <g transform="translate(620, 230)">
    <text x="0" y="0" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#14A896">PUBLIC TECHNOLOGY</text>

    <text x="0" y="90" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="72" font-weight="750" fill="#F6F2EA">Civic Stack</text>

    <text x="0" y="160" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#EBE4D8">Better tools for public life.</text>

    <text x="0" y="230" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="22" fill="#C8D0D8">
      <tspan x="0" dy="0">Open infrastructure for clear,</tspan>
      <tspan x="0" dy="34">accessible digital services.</tspan>
    </text>

    <!-- Accent pill -->
    <rect x="0" y="320" width="220" height="48" rx="24" fill="#C45C3E"/>
    <text x="110" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Explore the platform</text>
  </g>

  <!-- Bottom meta -->
  <text x="600" y="800" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#8FA3B5">TECHNOLOGY FOR EVERYONE</text>
</svg>
