<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <title>Kinetic Foundry — Gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d11;
      color: #9aa3b5;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(100% - 2rem, 900px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Kinetic Foundry gallery poster" width="1200" height="900">
    <figcaption>Promotional poster for Kinetic Foundry (4:3)</figcaption>
  </figure>
</body>
</html>
