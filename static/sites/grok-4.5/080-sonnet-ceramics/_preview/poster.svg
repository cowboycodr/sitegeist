<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Sonnet Ceramics — Objects for slower rooms">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1e8"/>
      <stop offset="55%" stop-color="#efe4d6"/>
      <stop offset="100%" stop-color="#e4d3bf"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="20%" x2="50%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8fa8a3" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="vesselClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d4c0"/>
      <stop offset="50%" stop-color="#d4b59a"/>
      <stop offset="100%" stop-color="#b8896a"/>
    </linearGradient>
    <linearGradient id="vesselGlaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8bfba"/>
      <stop offset="100%" stop-color="#5f746f"/>
    </linearGradient>
    <linearGradient id="bowlGlaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d5e2de"/>
      <stop offset="100%" stop-color="#8fa8a3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="140" r="220" fill="#8fa8a3" opacity="0.12"/>
  <circle cx="180" cy="760" r="260" fill="#c4845e" opacity="0.1"/>
  <rect x="72" y="72" width="1056" height="756" rx="28" fill="none" stroke="#2c2420" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Soft stage -->
  <ellipse cx="760" cy="620" rx="280" ry="90" fill="url(#glow)"/>
  <ellipse cx="760" cy="640" rx="200" ry="28" fill="#3d2f26" opacity="0.08"/>

  <!-- Tall vessel motif -->
  <g transform="translate(640 180)">
    <path d="M40 90c0-42 36-72 80-72s80 30 80 72c0 14-6 26-14 38l-10 18c-8 16-10 32-10 50v130c0 56-22 96-46 96s-46-40-46-96V196c0-18-2-34-10-50l-10-18c-8-12-14-24-14-38z" fill="url(#vesselClay)"/>
    <path d="M68 92c6-28 30-48 52-48s46 20 52 48c4 12-2 24-10 36l-8 16c-6 14-8 30-8 48v118c0 38-14 64-26 64s-26-26-26-64V192c0-18-2-34-8-48l-8-16c-8-12-14-24-10-36z" fill="url(#vesselGlaze)" opacity="0.9"/>
    <ellipse cx="120" cy="24" rx="74" ry="18" fill="#ead7c4"/>
    <ellipse cx="120" cy="24" rx="52" ry="11" fill="#2c2420" opacity="0.28"/>
    <path d="M88 150c14-24 38-38 64-28" fill="none" stroke="#fff7ef" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Small bowl -->
  <g transform="translate(860 420)">
    <path d="M20 70c0-40 34-68 76-68s76 28 76 68c0 48-34 86-76 86S20 118 20 70z" fill="#d4b59a"/>
    <path d="M40 68c4-28 28-48 56-48s52 20 56 48c0 34-24 60-56 60S40 102 40 68z" fill="url(#bowlGlaze)" opacity="0.88"/>
    <ellipse cx="96" cy="22" rx="66" ry="16" fill="#e8d4c0"/>
    <ellipse cx="96" cy="22" rx="44" ry="10" fill="#2c2420" opacity="0.24"/>
  </g>

  <!-- Cup -->
  <g transform="translate(540 470)">
    <path d="M36 24h78c7 0 12 6 12 14v88c0 36-22 62-51 62S24 162 24 126V38c0-8 5-14 12-14z" fill="#c4845e"/>
    <path d="M50 42h52c4 0 7 3 7 8v70c0 24-14 40-33 40S42 144 42 120V50c0-5 3-8 8-8z" fill="#6d8a86" opacity="0.78"/>
    <path d="M126 70c22 6 34 20 34 42s-12 36-34 42" fill="none" stroke="#c4845e" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="75" cy="28" rx="44" ry="12" fill="#e0b99a"/>
    <ellipse cx="75" cy="28" rx="30" ry="7" fill="#2c2420" opacity="0.26"/>
  </g>

  <!-- Brand copy -->
  <g transform="translate(120 210)">
    <text x="0" y="0" fill="#5f746f" font-family="Georgia, 'Palatino Linotype', serif" font-size="22" letter-spacing="6">MADE IN SMALL EDITIONS</text>
    <text x="0" y="92" fill="#2c2420" font-family="Georgia, 'Palatino Linotype', serif" font-size="86" font-weight="500">Sonnet</text>
    <text x="0" y="168" fill="#2c2420" font-family="Georgia, 'Palatino Linotype', serif" font-size="86" font-weight="500">Ceramics</text>
    <rect x="0" y="204" width="72" height="4" rx="2" fill="#c4845e"/>
    <text x="0" y="268" fill="#5a4d44" font-family="Georgia, 'Palatino Linotype', serif" font-size="34">Objects for slower rooms.</text>
    <text x="0" y="320" fill="#7a6b60" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22">Hand-shaped vessels · coastal studio</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="820" width="1200" height="80" fill="#2c2420"/>
  <text x="120" y="868" fill="#f7f1e8" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" letter-spacing="3">CRAFT · STONEWARE · SMALL BATCH</text>
  <circle cx="1040" cy="860" r="10" fill="#8fa8a3"/>
  <circle cx="1075" cy="860" r="10" fill="#c4845e"/>
  <circle cx="1110" cy="860" r="10" fill="#e8d4c0"/>
</svg>
