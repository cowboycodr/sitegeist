<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sonnet Ceramics — Poster Preview</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1f1a17;
      font-family: system-ui, sans-serif;
      color: #f3ebe2;
    }
    figure {
      margin: 1.5rem;
      max-width: min(960px, calc(100vw - 2rem));
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Sonnet Ceramics gallery poster">
    <figcaption>Gallery poster · 4:3 · Sonnet Ceramics</figcaption>
  </figure>
</body>
</html>
