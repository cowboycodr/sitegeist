<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Common Thread — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1c1915;
      font-family: system-ui, sans-serif;
      color: #f4efe6;
      padding: 1.5rem;
    }
    figure {
      margin: 0;
      max-width: 960px;
      width: 100%;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Common Thread gallery poster: Clothes with a longer story">
    <figcaption>Gallery poster · 4:3 · Common Thread</figcaption>
  </figure>
</body>
</html>
