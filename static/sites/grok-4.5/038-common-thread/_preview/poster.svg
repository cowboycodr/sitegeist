<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Common Thread — Clothes with a longer story">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="55%" stop-color="#e8e0d2"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f4a3a"/>
      <stop offset="100%" stop-color="#1e3328"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a7a62"/>
      <stop offset="100%" stop-color="#c9845f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft radial accents -->
  <circle cx="980" cy="160" r="280" fill="#5a7a62" opacity="0.1"/>
  <circle cx="180" cy="760" r="220" fill="#b56a45" opacity="0.09"/>

  <!-- Decorative thread lines -->
  <g fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M-40 180 C 200 120, 320 280, 520 220 S 820 100, 1240 200" stroke="url(#thread)" stroke-width="2"/>
    <path d="M-40 260 C 220 200, 340 360, 540 300 S 840 180, 1240 280" stroke="#2f4a3a" stroke-width="1.2" opacity="0.35"/>
    <path d="M-40 700 C 240 640, 380 800, 600 740 S 900 620, 1240 720" stroke="url(#thread)" stroke-width="1.8" opacity="0.7"/>
  </g>
  <circle cx="520" cy="220" r="6" fill="#c9845f"/>
  <circle cx="600" cy="740" r="5" fill="#2f4a3a"/>

  <!-- Left brand block -->
  <g transform="translate(90, 120)">
    <!-- Mark -->
    <rect width="72" height="72" rx="18" fill="#2f4a3a"/>
    <path d="M20 50c8-16 24-16 32 0" fill="none" stroke="#f4efe6" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 38c6-11 18-11 24 0" fill="none" stroke="#c9845f" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="36" cy="24" r="4.5" fill="#f4efe6"/>

    <text x="0" y="130" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="28" fill="#b56a45" letter-spacing="6">EDITION 04</text>
    <text x="0" y="220" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="92" font-weight="600" fill="#1c1915" letter-spacing="-2">Common</text>
    <text x="0" y="320" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="92" font-weight="600" fill="#1c1915" letter-spacing="-2">Thread</text>
    <text x="0" y="400" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="36" fill="#3d3830" letter-spacing="-0.5">Clothes with a longer story.</text>
    <text x="0" y="460" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#6b645a">Seasonless essentials · Traceable fibers · Built to repair</text>
  </g>

  <!-- Right motif panel -->
  <g transform="translate(720, 160)">
    <rect width="390" height="520" rx="28" fill="url(#panel)"/>
    <!-- Thread artwork inside panel -->
    <g fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M30 90 C 120 50, 180 160, 280 110 S 370 60, 420 100" stroke="#5a7a62" stroke-width="2"/>
      <path d="M20 170 C 130 130, 190 240, 290 190 S 380 140, 430 180" stroke="#f4efe6" stroke-width="1.5" opacity="0.45"/>
      <path d="M10 260 C 140 220, 200 330, 300 280 S 390 220, 440 270" stroke="#c9845f" stroke-width="2.2"/>
      <path d="M20 350 C 150 310, 210 420, 310 370 S 400 310, 430 360" stroke="#f4efe6" stroke-width="1.4" opacity="0.35"/>
      <path d="M30 440 C 160 400, 220 510, 320 460" stroke="#5a7a62" stroke-width="1.8"/>
    </g>
    <circle cx="280" cy="110" r="5" fill="#c9845f"/>
    <circle cx="300" cy="280" r="6" fill="#f4efe6"/>
    <circle cx="320" cy="460" r="4" fill="#c9845f"/>

    <text x="36" y="56" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#c9845f" letter-spacing="3">TRACEABLE · REPAIRABLE</text>
    <text x="36" y="480" font-family="Georgia, 'Palatino Linotype', serif" font-size="28" fill="#f4efe6" font-weight="600">Built for the long wear</text>
    <text x="36" y="516" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#d8d0c4">Farm-to-finish fiber passports</text>
  </g>

  <!-- Bottom bar -->
  <rect y="820" width="1200" height="80" fill="#1c1915"/>
  <text x="90" y="868" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#f4efe6">Sustainable Fashion</text>
  <text x="1110" y="868" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#c9845f" text-anchor="end" letter-spacing="2">COMMON THREAD</text>
</svg>
