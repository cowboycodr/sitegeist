<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#f4f0e8"/>

  <!-- soft daylight wash -->
  <defs>
    <radialGradient id="glow" cx="32%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#f3e0b8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e8c48a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f4f0e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4d5b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d9ceb8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="massA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfd0"/>
      <stop offset="100%" stop-color="#cfc3ae"/>
    </linearGradient>
    <linearGradient id="massB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd2bd"/>
      <stop offset="100%" stop-color="#b8aa92"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#d9d1c3" stroke-width="1" opacity="0.55">
    <line x1="80" y1="120" x2="80" y2="780"/>
    <line x1="160" y1="120" x2="160" y2="780"/>
    <line x1="240" y1="120" x2="240" y2="780"/>
    <line x1="320" y1="120" x2="320" y2="780"/>
    <line x1="400" y1="120" x2="400" y2="780"/>
    <line x1="480" y1="120" x2="480" y2="780"/>
    <line x1="560" y1="120" x2="560" y2="780"/>
    <line x1="640" y1="120" x2="640" y2="780"/>
    <line x1="720" y1="120" x2="720" y2="780"/>
    <line x1="800" y1="120" x2="800" y2="780"/>
    <line x1="880" y1="120" x2="880" y2="780"/>
    <line x1="960" y1="120" x2="960" y2="780"/>
    <line x1="1040" y1="120" x2="1040" y2="780"/>
    <line x1="1120" y1="120" x2="1120" y2="780"/>
    <line x1="40" y1="200" x2="1160" y2="200"/>
    <line x1="40" y1="280" x2="1160" y2="280"/>
    <line x1="40" y1="360" x2="1160" y2="360"/>
    <line x1="40" y1="440" x2="1160" y2="440"/>
    <line x1="40" y1="520" x2="1160" y2="520"/>
    <line x1="40" y1="600" x2="1160" y2="600"/>
    <line x1="40" y1="680" x2="1160" y2="680"/>
  </g>

  <!-- architectural massing motif -->
  <g transform="translate(180, 170)">
    <rect x="0" y="380" width="840" height="120" fill="url(#floor)"/>
    <!-- left volume -->
    <rect x="80" y="160" width="260" height="220" fill="url(#massA)" stroke="#1f1c18" stroke-width="2.5"/>
    <!-- right taller volume -->
    <rect x="340" y="90" width="220" height="290" fill="url(#massB)" stroke="#1f1c18" stroke-width="2.5"/>
    <!-- light beams -->
    <path d="M130 0 L230 160 L185 160 L85 0 Z" fill="#fffcf7" opacity="0.55"/>
    <path d="M390 0 L490 90 L445 90 L345 0 Z" fill="#f3e0b8" opacity="0.65"/>
    <path d="M470 0 L540 90 L510 90 L440 0 Z" fill="#fffcf7" opacity="0.4"/>
    <!-- apertures -->
    <rect x="130" y="200" width="55" height="130" fill="#fffcf7" opacity="0.55" stroke="#1f1c18" stroke-width="1.5"/>
    <rect x="210" y="230" width="55" height="100" fill="#fffcf7" opacity="0.4" stroke="#1f1c18" stroke-width="1.5"/>
    <rect x="385" y="140" width="70" height="160" fill="#fffcf7" opacity="0.5" stroke="#1f1c18" stroke-width="1.5"/>
    <rect x="480" y="220" width="40" height="80" fill="#fffcf7" opacity="0.35" stroke="#1f1c18" stroke-width="1.5"/>
    <!-- roof lines -->
    <path d="M80 160 L210 70 L340 160" stroke="#1f1c18" stroke-width="2.5" fill="none"/>
    <!-- amber accent shaft -->
    <line x1="600" y1="40" x2="600" y2="380" stroke="#c9853a" stroke-width="3"/>
    <path d="M560 40 L600 0 L640 40" stroke="#c9853a" stroke-width="3" fill="none"/>
    <!-- horizon detail -->
    <line x1="80" y1="300" x2="560" y2="300" stroke="#1f1c18" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(72, 64)" stroke="#c9853a" stroke-width="2" fill="none">
    <rect x="0" y="16" width="18" height="20"/>
    <path d="M0 16 L18 2 L36 16"/>
    <path d="M22 8 L30 0 L38 8"/>
    <line x1="26" y1="8" x2="26" y2="36"/>
  </g>

  <!-- typography -->
  <text x="130" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#1f1c18" letter-spacing="1">Lumen Ark</text>
  <text x="72" y="780" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#1f1c18">Buildings shaped</text>
  <text x="72" y="860" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#1f1c18">by light.</text>
  <text x="820" y="860" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8a8276" letter-spacing="4">COPENHAGEN</text>
</svg>
