<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>Perigee House — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0e14;
      color: #c8d0da;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Perigee House gallery poster">
    <figcaption>Gallery poster · 4:3 · static artwork</figcaption>
  </figure>
</body>
</html>
