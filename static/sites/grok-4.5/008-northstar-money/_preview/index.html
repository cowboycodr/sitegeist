<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Northstar — Gallery poster</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a1220;
      color: #e8e4d8;
      padding: 1.5rem;
    }
    figure {
      margin: 0;
      width: min(100%, 900px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      color: rgba(232, 228, 216, 0.65);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Northstar gallery poster: A clearer way to grow wealth">
    <figcaption>Northstar — promotional gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
