<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Northstar — A clearer way to grow wealth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2342"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#1f8a7a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f8a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0b83a"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Constellation dots -->
  <g fill="#c9a227" opacity="0.55">
    <circle cx="980" cy="120" r="2.5"/>
    <circle cx="1040" cy="180" r="1.8"/>
    <circle cx="920" cy="200" r="1.5"/>
    <circle cx="1100" cy="260" r="2"/>
    <circle cx="160" cy="140" r="1.6"/>
    <circle cx="220" cy="210" r="2.2"/>
    <circle cx="100" cy="280" r="1.4"/>
    <circle cx="1080" cy="720" r="1.8"/>
    <circle cx="140" cy="760" r="2"/>
  </g>
  <g stroke="#c9a227" stroke-width="1" opacity="0.22" fill="none">
    <path d="M980 120 L1040 180 L1100 260"/>
    <path d="M160 140 L220 210 L100 280"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(96, 88)">
    <circle cx="28" cy="28" r="28" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.4"/>
    <path d="M28 6l4.2 13H46l-11 8 4.2 13L28 32.5 18.8 40l4.2-13-11-8h13.8L28 6z" fill="#c9a227"/>
    <text x="72" y="38" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Northstar</text>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="210" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="650" fill="#d7c070" letter-spacing="3">INVESTING, SIMPLIFIED</text>

  <!-- Headline -->
  <text x="96" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">A clearer way</text>
  <text x="96" y="365" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">to grow wealth.</text>

  <!-- Tag support -->
  <text x="96" y="430" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.68)">Confident long-term planning · Precise, useful data</text>

  <!-- CTA chips -->
  <g transform="translate(96, 470)">
    <rect width="200" height="52" rx="26" fill="#c9a227"/>
    <text x="100" y="33" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#071526">Build your plan</text>
    <rect x="220" width="210" height="52" rx="26" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <text x="325" y="33" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">See how it works</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(96, 580)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect width="180" height="88" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="36" font-size="14" fill="rgba(255,255,255,0.5)" letter-spacing="1">FEE DRAG CUT</text>
    <text x="20" y="66" font-size="28" font-weight="700" fill="#e0b83a">0.42%→0.18%</text>

    <rect x="200" width="180" height="88" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="220" y="36" font-size="14" fill="rgba(255,255,255,0.5)" letter-spacing="1">RUNWAY</text>
    <text x="220" y="66" font-size="28" font-weight="700" fill="#e0b83a">4.6 months</text>

    <rect x="400" width="180" height="88" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="420" y="36" font-size="14" fill="rgba(255,255,255,0.5)" letter-spacing="1">ADHERENCE</text>
    <text x="420" y="66" font-size="28" font-weight="700" fill="#e0b83a">91%</text>
  </g>

  <!-- Right panel card -->
  <g transform="translate(700, 200)">
    <rect width="400" height="480" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <text x="32" y="48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">PROJECTED NEST EGG</text>
    <text x="32" y="100" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-1">$1,248,600</text>
    <rect x="280" y="36" width="88" height="30" rx="15" fill="rgba(29,122,78,0.25)"/>
    <text x="324" y="56" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6ddea4">On track</text>

    <!-- Sparkline -->
    <path d="M32 220 C72 210 92 190 132 170 C172 150 192 160 232 135 C272 110 292 120 332 100 C360 88 372 92 368 92 L368 250 L32 250 Z" fill="url(#sparkFill)"/>
    <path d="M32 220 C72 210 92 190 132 170 C172 150 192 160 232 135 C272 110 292 120 332 100 C360 88 372 92 368 92" fill="none" stroke="url(#spark)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="368" cy="92" r="6" fill="#e0b83a"/>

    <!-- Allocation bar -->
    <rect x="32" y="290" width="336" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="290" width="185" height="14" rx="7" fill="#3b6ea5"/>
    <rect x="32" y="290" width="185" height="14" fill="#0d2342"/>
    <rect x="217" y="290" width="84" height="14" fill="#3b6ea5"/>
    <rect x="301" y="290" width="40" height="14" fill="#c9a227"/>
    <rect x="341" y="290" width="27" height="14" rx="0 7 7 0" fill="#a8b4c4"/>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">
      <circle cx="40" cy="340" r="5" fill="#0d2342"/>
      <text x="54" y="345">Equities 55%</text>
      <circle cx="180" cy="340" r="5" fill="#3b6ea5"/>
      <text x="194" y="345">Bonds 25%</text>
      <circle cx="40" cy="375" r="5" fill="#c9a227"/>
      <text x="54" y="380">Alts 12%</text>
      <circle cx="180" cy="375" r="5" fill="#a8b4c4"/>
      <text x="194" y="380">Cash 8%</text>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
      <text x="32" y="430" font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1">MONTHLY · HORIZON · RISK</text>
      <text x="32" y="460" font-size="20" font-weight="700" fill="#ffffff">$850  ·  22 yrs  ·  Balanced</text>
    </g>
  </g>

  <!-- Footer stripe -->
  <text x="96" y="840" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.4)">Fintech · Personal finance guidance</text>
</svg>
