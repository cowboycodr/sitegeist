<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NULL Laboratory — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d12;
      color: #e8eef8;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(125, 220, 255, 0.18);
      border-radius: 8px;
    }
    figcaption {
      margin-top: 0.75rem;
      color: #8b97ad;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="NULL Laboratory gallery poster">
    <figcaption>Gallery poster · 4:3 · static artwork</figcaption>
  </figure>
</body>
</html>
