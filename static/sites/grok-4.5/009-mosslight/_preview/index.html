<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Mosslight — Gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1f1c;
      font-family: system-ui, sans-serif;
      color: #c5d4c8;
    }
    figure {
      margin: 0;
      max-width: min(960px, 94vw);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Mosslight gallery poster: forest cabin under moss-green light with the tagline Disappear into the green.">
    <figcaption>Mosslight — promotional poster (4:3), not part of the live site.</figcaption>
  </figure>
</body>
</html>
