<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ember and Field — Roasted slowly. Remembered vividly.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1812"/>
      <stop offset="45%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a2214"/>
    </linearGradient>
    <linearGradient id="ember" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#8b3518"/>
      <stop offset="55%" stop-color="#c45c2a"/>
      <stop offset="100%" stop-color="#e07840"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4a2e"/>
      <stop offset="100%" stop-color="#232b1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#e07840" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e07840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Terrace field lower third -->
  <path d="M0 520 Q200 480 400 510 T800 500 T1200 520 L1200 900 L0 900 Z" fill="url(#field)"/>
  <path d="M0 600 Q250 570 500 595 T1000 585 T1200 610 L1200 900 L0 900 Z" fill="#2f3a24"/>
  <path d="M0 690 Q300 665 600 685 T1200 700 L1200 900 L0 900 Z" fill="#252e1c"/>
  <path d="M0 780 Q280 760 560 778 T1200 790 L1200 900 L0 900 Z" fill="#1a2214"/>

  <!-- Terrace contour lines -->
  <g fill="none" stroke="#8a9a6e" stroke-width="1.5" opacity="0.35">
    <path d="M0 540 Q200 500 400 530 T800 520 T1200 540"/>
    <path d="M0 620 Q250 590 500 615 T1000 605 T1200 630"/>
    <path d="M0 710 Q300 685 600 705 T1200 720"/>
  </g>

  <!-- Coffee tree marks on ridge -->
  <g stroke="#6b7a52" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="140" y1="500" x2="140" y2="560"/>
    <line x1="220" y1="495" x2="220" y2="555"/>
    <line x1="310" y1="505" x2="310" y2="565"/>
    <line x1="880" y1="500" x2="880" y2="560"/>
    <line x1="970" y1="492" x2="970" y2="552"/>
    <line x1="1050" y1="505" x2="1050" y2="565"/>
  </g>
  <g fill="#c45c2a">
    <circle cx="138" cy="512" r="5"/>
    <circle cx="146" cy="522" r="4"/>
    <circle cx="218" cy="508" r="5"/>
    <circle cx="312" cy="515" r="4.5"/>
    <circle cx="878" cy="512" r="5"/>
    <circle cx="972" cy="505" r="4.5"/>
    <circle cx="1048" cy="515" r="5"/>
  </g>

  <!-- Central ember / flame motif -->
  <g transform="translate(600 430)">
    <ellipse cx="0" cy="48" rx="70" ry="18" fill="#1a1410" opacity="0.35"/>
    <path d="M0 -70 C-28 -20 -36 20 -18 55 C-8 35 0 28 0 28 C0 28 8 35 18 55 C36 20 28 -20 0 -70Z" fill="url(#ember)"/>
    <path d="M0 -35 C-12 -8 -14 12 -6 30 C-2 20 0 16 0 16 C0 16 2 20 6 30 C14 12 12 -8 0 -35Z" fill="#f4efe6" opacity="0.35"/>
    <circle cx="0" cy="-78" r="10" fill="#c9a66b" opacity="0.85"/>
  </g>

  <!-- Gold arc horizon -->
  <path d="M180 380 Q600 280 1020 380" fill="none" stroke="#c9a66b" stroke-width="1.5" opacity="0.45"/>

  <!-- Diagonal field grain (subtle) -->
  <g stroke="#f4efe6" stroke-width="1" opacity="0.04">
    <path d="M0 100 L200 0"/>
    <path d="M0 200 L400 0"/>
    <path d="M0 300 L600 0"/>
    <path d="M100 400 L700 100"/>
    <path d="M900 0 L1200 150"/>
    <path d="M1000 0 L1200 100"/>
  </g>

  <!-- Brand lockup -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#c9a66b" letter-spacing="10">SMALL-BATCH COFFEE</text>
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="600" fill="#f4efe6" letter-spacing="2">Ember &amp; Field</text>
  <line x1="470" y1="320" x2="730" y2="320" stroke="#c45c2a" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#e8dfd0" letter-spacing="1">Roasted slowly. Remembered vividly.</text>

  <!-- Corner marks -->
  <g fill="none" stroke="#c9a66b" stroke-width="1.5" opacity="0.5">
    <path d="M48 48h40M48 48v40"/>
    <path d="M1152 48h-40M1152 48v40"/>
    <path d="M48 852h40M48 852v-40"/>
    <path d="M1152 852h-40M1152 852v-40"/>
  </g>
</svg>
