<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Lucid — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #eef2ff;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: block;
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      color: #9aa6c2;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Lucid gallery poster: Learn by seeing" width="1200" height="900" />
    <figcaption>Lucid — gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
