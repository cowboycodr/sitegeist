<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lucid — Learn by seeing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#121A30"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="280" cy="220" r="260" fill="url(#glowA)"/>
  <circle cx="980" cy="180" r="300" fill="url(#glowB)"/>
  <circle cx="900" cy="720" r="220" fill="url(#glowA)" opacity="0.5"/>

  <!-- Decorative grid -->
  <g stroke="rgba(148,163,184,0.08)" stroke-width="1">
    <path d="M80 120 H1120"/>
    <path d="M80 220 H1120"/>
    <path d="M80 320 H420"/>
    <path d="M120 80 V820"/>
    <path d="M220 80 V820"/>
  </g>

  <!-- Concept graph motif (right) -->
  <g transform="translate(730, 200)">
    <circle cx="200" cy="220" r="170" fill="none" stroke="rgba(148,163,184,0.14)" stroke-width="2"/>
    <circle cx="200" cy="220" r="120" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="2"/>
    <circle cx="200" cy="220" r="70" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="2"/>
    <circle cx="200" cy="220" r="48" fill="url(#core)"/>

    <!-- links -->
    <g stroke="rgba(165,180,252,0.45)" stroke-width="2">
      <line x1="200" y1="220" x2="95" y2="105"/>
      <line x1="200" y1="220" x2="320" y2="95"/>
      <line x1="200" y1="220" x2="355" y2="250"/>
      <line x1="200" y1="220" x2="85" y2="300"/>
      <line x1="200" y1="220" x2="250" y2="360"/>
      <line x1="95" y1="105" x2="320" y2="95"/>
      <line x1="320" y1="95" x2="355" y2="250"/>
      <line x1="85" y1="300" x2="250" y2="360"/>
    </g>

    <!-- nodes -->
    <circle cx="95" cy="105" r="11" fill="#5EEAD4"/>
    <circle cx="320" cy="95" r="9" fill="#A78BFA"/>
    <circle cx="355" cy="250" r="12" fill="#5EEAD4"/>
    <circle cx="85" cy="300" r="10" fill="#A78BFA"/>
    <circle cx="250" cy="360" r="9" fill="#FBBF24"/>
    <circle cx="140" cy="180" r="7" fill="#818CF8"/>
    <circle cx="280" cy="180" r="7" fill="#5EEAD4"/>
  </g>

  <!-- Wave motif (bottom left card) -->
  <g transform="translate(90, 560)">
    <rect width="520" height="220" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(148,163,184,0.2)" stroke-width="2"/>
    <text x="36" y="48" fill="#9AA6C2" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LIVE LAB</text>
    <path d="M36 130 C 80 80, 120 180, 170 130 S 260 80, 310 130 S 400 180, 450 120" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 130 C 80 150, 120 110, 170 130 S 260 160, 310 130 S 400 100, 450 140" fill="none" stroke="rgba(167,139,250,0.45)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="130" r="6" fill="#FBBF24"/>
    <circle cx="310" cy="130" r="6" fill="#5EEAD4"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(90, 96)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="url(#mark)" stroke-width="3"/>
    <circle cx="28" cy="28" r="10" fill="url(#mark)"/>
    <path d="M28 2v8M28 46v8M2 28h8M46 28h8" stroke="url(#mark)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title block -->
  <text x="170" y="140" fill="#EEF2FF" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">Lucid</text>
  <text x="90" y="250" fill="#EEF2FF" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="750" letter-spacing="-2.5">Learn by</text>
  <text x="90" y="345" fill="url(#mark)" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="750" letter-spacing="-2.5">seeing.</text>
  <text x="90" y="420" fill="#9AA6C2" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="500">Interactive courses · playful simulations</text>
  <text x="90" y="462" fill="#9AA6C2" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="500">Diagrams and experiments you can touch</text>

  <!-- Category chip -->
  <rect x="900" y="80" width="190" height="44" rx="22" fill="rgba(94,234,212,0.12)" stroke="rgba(94,234,212,0.35)" stroke-width="2"/>
  <text x="995" y="108" text-anchor="middle" fill="#5EEAD4" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="2">EDUCATION</text>
</svg>
