<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Slow Form — Made at the speed of care">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e8"/>
      <stop offset="55%" stop-color="#ebe3d6"/>
      <stop offset="100%" stop-color="#dccfb8"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="50%" stop-color="#a67c4e"/>
      <stop offset="100%" stop-color="#7a5233"/>
    </linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6340"/>
      <stop offset="100%" stop-color="#5c3a22"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a221a"/>
      <stop offset="100%" stop-color="#1c1712"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft radial warmth -->
  <circle cx="980" cy="120" r="320" fill="#c4a574" opacity="0.18"/>
  <circle cx="180" cy="780" r="280" fill="#8b4a2b" opacity="0.08"/>

  <!-- Fine border frame -->
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#c4b8a4" stroke-width="1.5"/>
  <rect x="60" y="60" width="1080" height="780" fill="none" stroke="#d4c8b8" stroke-width="1"/>

  <!-- Brand mark square -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="42" height="42" fill="none" stroke="#6b4428" stroke-width="2.5"/>
    <path d="M0 0 L42 42" stroke="#a67c4e" stroke-width="2.5"/>
    <path d="M0 0 L0 42 L42 42" fill="#c4a574" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="140" font-family="Georgia, 'Palatino Linotype', serif" font-size="28" letter-spacing="0.22em" fill="#1c1712" font-weight="600">SLOW FORM</text>
  <text x="160" y="172" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" letter-spacing="0.28em" fill="#8b4a2b" font-weight="600">FURNITURE FOR KEEPING</text>

  <!-- Hero furniture motif: numbered bench -->
  <g transform="translate(280, 250)">
    <!-- Ground shadow -->
    <ellipse cx="320" cy="430" rx="280" ry="22" fill="#1c1712" opacity="0.08"/>

    <!-- Seat -->
    <path d="M40 80 L600 80 L640 150 L0 150 Z" fill="url(#seat)"/>
    <!-- Grain strokes -->
    <path d="M70 100 Q220 90 360 105 T600 98" fill="none" stroke="#5c3a22" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M50 120 Q250 112 400 128 T620 122" fill="none" stroke="#5c3a22" stroke-opacity="0.16" stroke-width="1.2"/>
    <path d="M80 138 Q260 132 420 142" fill="none" stroke="#5c3a22" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Apron -->
    <path d="M0 150 L640 150 L640 200 L0 200 Z" fill="url(#apron)"/>
    <text x="320" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="0.18em" fill="#f4ebe0" opacity="0.85">Nº 041</text>

    <!-- Legs -->
    <rect x="48" y="200" width="36" height="210" rx="3" fill="#6b4428"/>
    <rect x="556" y="200" width="36" height="210" rx="3" fill="#6b4428"/>
    <rect x="48" y="200" width="36" height="210" rx="3" fill="#3d2818" opacity="0.18"/>
    <rect x="556" y="200" width="36" height="210" rx="3" fill="#3d2818" opacity="0.22"/>

    <!-- Stretchers hint -->
    <rect x="84" y="340" width="472" height="10" rx="2" fill="#8b6340" opacity="0.7"/>
  </g>

  <!-- Dark info band -->
  <rect x="60" y="700" width="1080" height="140" fill="url(#panel)"/>
  <text x="100" y="760" font-family="Georgia, 'Palatino Linotype', serif" font-size="42" fill="#f7f1e8">Made at the speed of care.</text>
  <text x="100" y="805" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#c4a574" letter-spacing="0.06em">Numbered furniture from local timber · built to patina</text>

  <!-- Corner edition mark -->
  <text x="1040" y="790" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" letter-spacing="0.2em" fill="#a67c4e">EST.</text>
  <text x="1040" y="818" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f7f1e8">SF</text>
</svg>
