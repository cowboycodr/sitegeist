<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="One Point Five — Make the future measurable">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="45%" stop-color="#0c1a24"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#3ee0c4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#1a6b8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec4a0"/>
      <stop offset="55%" stop-color="#e8b84a"/>
      <stop offset="100%" stop-color="#e85d4a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f8f7c"/>
      <stop offset="100%" stop-color="#3ee0c4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Soft grid -->
  <g stroke="#1c2d3a" stroke-width="1" opacity="0.55">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <!-- Orbit motif -->
  <g fill="none" transform="translate(760 300)">
    <ellipse cx="0" cy="0" rx="210" ry="120" stroke="#3ee0c4" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="150" ry="86" stroke="#3ee0c4" stroke-width="1.2" opacity="0.28"/>
    <ellipse cx="0" cy="0" rx="92" ry="52" stroke="#3ee0c4" stroke-width="1" opacity="0.22"/>
    <circle cx="0" cy="0" r="10" fill="#3ee0c4" opacity="0.85"/>
    <circle cx="128" cy="-48" r="7" fill="#f0d9b5"/>
    <path d="M-150 40 C-60 -30, 40 -55, 150 -10" stroke="#e8b84a" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Left content card -->
  <rect x="72" y="120" width="520" height="660" rx="28" fill="#102230" stroke="#2a4558" stroke-width="1.5"/>
  <rect x="72" y="120" width="8" height="660" rx="4" fill="#3ee0c4"/>

  <!-- Brand mark -->
  <g transform="translate(112 168)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#3ee0c4" stroke-width="2"/>
    <circle cx="22" cy="22" r="12" fill="none" stroke="#3ee0c4" stroke-width="1.2" opacity="0.5"/>
    <path d="M8 28c5-9 12-14 19-12s12 7 9 14" fill="none" stroke="#3ee0c4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="14" r="2.5" fill="#3ee0c4"/>
  </g>

  <text x="172" y="186" fill="#3ee0c4" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3">CLIMATE DATA OBSERVATORY</text>
  <text x="172" y="218" fill="#8aa0ae" font-family="system-ui, sans-serif" font-size="16">Planetary signals · 1.5°C guardrail</text>

  <text x="112" y="300" fill="#e8f0ef" font-family="Georgia, 'Iowan Old Style', serif" font-size="64" font-weight="600">One Point Five</text>
  <text x="112" y="368" fill="#f0d9b5" font-family="Georgia, 'Iowan Old Style', serif" font-size="34" font-style="italic">Make the future measurable.</text>

  <text x="112" y="430" fill="#8aa0ae" font-family="system-ui, sans-serif" font-size="20">
    Dense Earth-system data, rendered urgent and legible.
  </text>

  <!-- Metric chips -->
  <g font-family="Georgia, serif">
    <rect x="112" y="480" width="140" height="96" rx="14" fill="#0c1a24" stroke="#1c2d3a"/>
    <text x="128" y="512" fill="#5f7585" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">ANOMALY</text>
    <text x="128" y="552" fill="#e8f0ef" font-size="32" font-weight="600">1.28°</text>

    <rect x="268" y="480" width="140" height="96" rx="14" fill="#0c1a24" stroke="#1c2d3a"/>
    <text x="284" y="512" fill="#5f7585" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">BUDGET</text>
    <text x="284" y="552" fill="#e8f0ef" font-size="32" font-weight="600">230 Gt</text>

    <rect x="424" y="480" width="140" height="96" rx="14" fill="#0c1a24" stroke="#1c2d3a"/>
    <text x="440" y="512" fill="#5f7585" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">WINDOW</text>
    <text x="440" y="552" fill="#e8f0ef" font-size="32" font-weight="600">~6 yr</text>
  </g>

  <!-- Signal bars -->
  <text x="112" y="630" fill="#8aa0ae" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">SIGNAL STRENGTH</text>
  <rect x="112" y="650" width="440" height="10" rx="5" fill="#1a2f3d"/>
  <rect x="112" y="650" width="378" height="10" rx="5" fill="url(#bar)"/>
  <rect x="112" y="680" width="440" height="10" rx="5" fill="#1a2f3d"/>
  <rect x="112" y="680" width="320" height="10" rx="5" fill="#e8b84a"/>
  <rect x="112" y="710" width="440" height="10" rx="5" fill="#1a2f3d"/>
  <rect x="112" y="710" width="400" height="10" rx="5" fill="#e85d4a"/>

  <!-- Right gauge -->
  <g transform="translate(700 520)">
    <path d="M40 160 A140 140 0 0 1 320 160" fill="none" stroke="#1c2d3a" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 160 A140 140 0 0 1 320 160" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="80"/>
    <line x1="180" y1="160" x2="180" y2="40" stroke="#f4f7f5" stroke-width="4" stroke-linecap="round" transform="rotate(42 180 160)"/>
    <circle cx="180" cy="160" r="10" fill="#f4f7f5"/>
    <text x="180" y="130" text-anchor="middle" fill="#e8f0ef" font-family="Georgia, serif" font-size="42" font-weight="600">1.5°</text>
    <text x="180" y="200" text-anchor="middle" fill="#8aa0ae" font-family="system-ui, sans-serif" font-size="16">threshold instrument</text>
  </g>
</svg>
