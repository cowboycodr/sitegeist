<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>One Point Five — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a1016;
      color: #c5d0d6;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(960px, 94vw);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="One Point Five gallery poster">
    <figcaption>Gallery poster · 4:3 · One Point Five</figcaption>
  </figure>
</body>
</html>
