<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Milkweed School — Let curiosity get muddy.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5e5cc"/>
      <stop offset="55%" stop-color="#eef3e4"/>
      <stop offset="100%" stop-color="#f4e8d0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e8f58"/>
      <stop offset="100%" stop-color="#4a6b42"/>
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="100%" stop-color="#d4a84a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Soft sun -->
  <circle cx="980" cy="140" r="70" fill="#e8c66a" opacity="0.55"/>
  <circle cx="980" cy="140" r="42" fill="#f4e6b0" opacity="0.7"/>

  <!-- Distant canopy band -->
  <ellipse cx="120" cy="420" rx="160" ry="110" fill="#3d5c40"/>
  <ellipse cx="300" cy="390" rx="170" ry="120" fill="#2f4a32"/>
  <ellipse cx="500" cy="410" rx="155" ry="105" fill="#466b48"/>
  <ellipse cx="700" cy="385" rx="175" ry="125" fill="#2f4a32"/>
  <ellipse cx="900" cy="405" rx="160" ry="110" fill="#3d5c40"/>
  <ellipse cx="1080" cy="420" rx="140" ry="100" fill="#2f4a32"/>

  <!-- Ground -->
  <path d="M0 520 C200 470 380 540 600 500 C820 460 1000 530 1200 490 L1200 900 L0 900 Z" fill="url(#ground)"/>
  <path d="M0 620 C220 580 420 650 640 610 C860 570 1040 640 1200 600 L1200 900 L0 900 Z" fill="#5c7a4a" opacity="0.85"/>

  <!-- Trail -->
  <path d="M470 900 C520 720 560 640 600 560 C640 640 680 720 740 900" fill="#c4a574" opacity="0.9"/>

  <!-- Large milkweed left -->
  <g transform="translate(160,360)">
    <path d="M90 320 C85 220 95 140 88 40" stroke="#1e3222" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="40" cy="150" rx="55" ry="24" fill="#4a7a4e" transform="rotate(-38 40 150)"/>
    <ellipse cx="140" cy="190" rx="58" ry="26" fill="#3d6b42" transform="rotate(32 140 190)"/>
    <ellipse cx="45" cy="240" rx="50" ry="22" fill="#4a7a4e" transform="rotate(-28 45 240)"/>
    <ellipse cx="88" cy="38" rx="42" ry="58" fill="url(#pod)"/>
    <ellipse cx="88" cy="22" rx="20" ry="32" fill="#c45c26"/>
    <circle cx="74" cy="10" r="5" fill="#5c2a12"/>
    <circle cx="92" cy="4" r="4.5" fill="#5c2a12"/>
    <circle cx="104" cy="16" r="4" fill="#5c2a12"/>
  </g>

  <!-- Large milkweed right -->
  <g transform="translate(860,340)">
    <path d="M70 340 C78 230 68 150 74 45" stroke="#1e3222" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="160" rx="58" ry="25" fill="#3d6b42" transform="rotate(-42 20 160)"/>
    <ellipse cx="130" cy="200" rx="60" ry="26" fill="#4a7a4e" transform="rotate(28 130 200)"/>
    <ellipse cx="28" cy="250" rx="52" ry="23" fill="#3d6b42" transform="rotate(-22 28 250)"/>
    <ellipse cx="74" cy="42" rx="46" ry="62" fill="url(#pod)"/>
    <ellipse cx="74" cy="24" rx="22" ry="34" fill="#c45c26"/>
    <circle cx="60" cy="12" r="5" fill="#5c2a12"/>
    <circle cx="78" cy="5" r="4.5" fill="#5c2a12"/>
    <circle cx="92" cy="18" r="4" fill="#5c2a12"/>
  </g>

  <!-- Floating milkweed seeds -->
  <g fill="#f4e6b0" opacity="0.92">
    <ellipse cx="280" cy="160" rx="6" ry="18" transform="rotate(18 280 160)"/>
    <ellipse cx="340" cy="120" rx="5" ry="15" transform="rotate(-22 340 120)"/>
    <ellipse cx="780" cy="150" rx="6" ry="17" transform="rotate(30 780 150)"/>
    <ellipse cx="840" cy="100" rx="5" ry="14" transform="rotate(-12 840 100)"/>
    <ellipse cx="520" cy="180" rx="4.5" ry="13" transform="rotate(8 520 180)"/>
    <ellipse cx="650" cy="130" rx="5" ry="15" transform="rotate(-28 650 130)"/>
  </g>
  <g stroke="#e8c66a" stroke-width="1.5" opacity="0.7" fill="none">
    <path d="M280 178 Q275 195 278 210"/>
    <path d="M340 135 Q348 150 342 168"/>
    <path d="M780 167 Q772 185 776 200"/>
    <path d="M650 145 Q658 160 652 178"/>
  </g>

  <!-- Child figure with stick -->
  <g transform="translate(530,520)">
    <circle cx="55" cy="30" r="22" fill="#e8c4a0"/>
    <path d="M30 55 Q55 48 80 55 L88 145 Q55 160 22 145 Z" fill="#c45c26"/>
    <path d="M22 145 L12 210 M88 145 L98 210" stroke="#3a2a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M32 85 L-15 65 M78 88 L130 72" stroke="#e8c4a0" stroke-width="10" stroke-linecap="round"/>
    <path d="M-15 65 L-48 28" stroke="#8b6914" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 18 Q55 2 78 18" stroke="#3a2a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Card panel for title -->
  <rect x="90" y="620" width="520" height="210" rx="28" fill="#1e3222"/>
  <rect x="90" y="620" width="12" height="210" rx="4" fill="#c45c26"/>

  <text x="125" y="675" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="28" font-weight="700" fill="#e8c66a" letter-spacing="4">FOREST LEARNING</text>
  <text x="125" y="740" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="700" fill="#fffcf7">Milkweed School</text>
  <text x="125" y="795" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="32" font-style="italic" fill="#d8e6d0">Let curiosity get muddy.</text>

  <!-- Small brand mark -->
  <g transform="translate(1020,700)">
    <circle cx="40" cy="40" r="38" fill="#2f4a32" stroke="#e8c66a" stroke-width="3"/>
    <path d="M40 16c-1.5 4-6 7-10.5 7.5 3.5 1.8 5.8 5.3 6.2 9.5 1.8-3.3 4.8-5.5 8.5-6.4-2.8-2.3-4.2-5.8-4.2-10.6z" fill="#e8c66a"/>
    <path d="M40 20c1.1 3.3 4.5 5.4 8 5.6-2.6 1.4-4.4 4-4.8 7.3-1.4-2.5-3.6-4.3-6.5-5 2.1-1.8 3.3-4.5 3.3-7.9z" fill="#f4e6b0"/>
    <ellipse cx="40" cy="52" rx="5" ry="7" fill="#c45c26"/>
  </g>
</svg>
