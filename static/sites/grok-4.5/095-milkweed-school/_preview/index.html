<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Milkweed School — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1e3222;
      font-family: system-ui, sans-serif;
      color: #f7f1e4;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    figcaption {
      margin-top: 0.85rem;
      text-align: center;
      opacity: 0.8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Milkweed School gallery poster">
    <figcaption>Gallery poster · 4:3 · Milkweed School</figcaption>
  </figure>
</body>
</html>
