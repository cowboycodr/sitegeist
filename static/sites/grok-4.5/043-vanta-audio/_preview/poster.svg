<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#070708"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#d4a574" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070708" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="420" y1="300" x2="560" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a2e"/>
      <stop offset="0.55" stop-color="#141416"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="band" x1="400" y1="220" x2="800" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8d4b8"/>
      <stop offset="0.5" stop-color="#d4a574"/>
      <stop offset="1" stop-color="#8f6a42"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- concentric rings motif -->
  <circle cx="600" cy="400" r="95" stroke="#d4a574" stroke-width="1.2" opacity="0.22"/>
  <circle cx="600" cy="400" r="155" stroke="#d4a574" stroke-width="1.2" opacity="0.16"/>
  <circle cx="600" cy="400" r="220" stroke="#d4a574" stroke-width="1.2" opacity="0.1"/>
  <circle cx="600" cy="400" r="290" stroke="#d4a574" stroke-width="1" opacity="0.06"/>

  <!-- abstract headphones -->
  <path d="M430 400 C440 250 760 250 770 400" stroke="url(#band)" stroke-width="18" stroke-linecap="round"/>
  <path d="M450 398 C460 278 740 278 750 398" stroke="#1a1a1d" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="420" cy="470" rx="78" ry="108" fill="url(#cup)" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="420" cy="470" rx="42" ry="62" fill="#0a0a0c" stroke="#d4a574" stroke-width="1.2" opacity="0.75"/>
  <ellipse cx="420" cy="470" rx="14" ry="22" fill="#d4a574" opacity="0.35"/>
  <ellipse cx="780" cy="470" rx="78" ry="108" fill="url(#cup)" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="780" cy="470" rx="42" ry="62" fill="#0a0a0c" stroke="#d4a574" stroke-width="1.2" opacity="0.75"/>
  <ellipse cx="780" cy="470" rx="14" ry="22" fill="#d4a574" opacity="0.35"/>
  <path d="M430 400 v40" stroke="#d4a574" stroke-width="7" stroke-linecap="round"/>
  <path d="M770 400 v40" stroke="#d4a574" stroke-width="7" stroke-linecap="round"/>

  <!-- brand lockup -->
  <circle cx="120" cy="120" r="22" stroke="#d4a574" stroke-width="1.5" opacity="0.55"/>
  <circle cx="120" cy="120" r="12" stroke="#d4a574" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="3.5" fill="#d4a574"/>

  <text x="160" y="112" fill="#f3efe6" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="4">VANTA AUDIO</text>
  <text x="160" y="142" fill="#d4a574" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5">SERIES ONE</text>

  <text x="600" y="720" text-anchor="middle" fill="#f3efe6" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="-0.5">Hear the space between.</text>
  <text x="600" y="770" text-anchor="middle" fill="#8a8680" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="1">Reference headphones for depth, texture, and weight</text>

  <!-- bottom rule -->
  <line x1="420" y1="800" x2="780" y2="800" stroke="#d4a574" stroke-width="1" opacity="0.35"/>
</svg>
