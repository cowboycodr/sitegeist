<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>Soft Power — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1614;
      font-family: system-ui, sans-serif;
      color: #f3eee6;
    }
    figure {
      margin: 0;
      max-width: min(960px, 94vw);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(243, 238, 230, 0.15);
    }
    figcaption {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      opacity: 0.65;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Soft Power gallery poster" width="1200" height="900">
    <figcaption>Soft Power — gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
