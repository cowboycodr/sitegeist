<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Soft Power — culture magazine poster">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3eee6"/>
      <stop offset="100%" stop-color="#e6ddd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#c45c3a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c45c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Subtle grid motif -->
  <g stroke="#14110f" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="72" x2="1200" y2="72"/>
    <line x1="0" y1="828" x2="1200" y2="828"/>
  </g>

  <!-- Dark editorial block -->
  <rect x="80" y="120" width="520" height="660" fill="#14110f"/>
  <circle cx="480" cy="220" r="160" fill="#c45c3a" fill-opacity="0.38"/>
  <path d="M80 560 C180 500 260 620 360 540 S520 460 600 520 L600 780 L80 780 Z" fill="#2a2420"/>

  <!-- Frame accent on dark block -->
  <rect x="130" y="190" width="220" height="280" fill="none" stroke="#faf7f2" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="130" y1="255" x2="350" y2="255" stroke="#faf7f2" stroke-width="1" stroke-opacity="0.3"/>

  <text x="155" y="310" fill="#faf7f2" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" fill-opacity="0.92">Taste is</text>
  <text x="155" y="350" fill="#faf7f2" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" fill-opacity="0.92">infrastructure.</text>

  <!-- Issue mark -->
  <text x="130" y="700" fill="#c45c3a" font-family="ui-monospace, Consolas, monospace" font-size="16" letter-spacing="4">ISSUE NO. 12</text>
  <text x="130" y="745" fill="#faf7f2" font-family="Georgia, 'Iowan Old Style', serif" font-size="36" font-weight="600">Soft Power</text>

  <!-- Right side typography -->
  <text x="660" y="220" fill="#7a7268" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="5">CULTURE MAGAZINE</text>

  <text x="660" y="320" fill="#14110f" font-family="Georgia, 'Iowan Old Style', serif" font-size="72" font-weight="600" letter-spacing="-2">Soft</text>
  <text x="660" y="400" fill="#14110f" font-family="Georgia, 'Iowan Old Style', serif" font-size="72" font-weight="600" letter-spacing="-2">Power</text>

  <text x="660" y="470" fill="#9e4228" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-style="italic">The ideas shaping</text>
  <text x="660" y="512" fill="#9e4228" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-style="italic">how we live.</text>

  <!-- Accent rule -->
  <rect x="660" y="560" width="72" height="3" fill="#c45c3a"/>

  <text x="660" y="620" fill="#4a5560" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18">Taste · Influence</text>
  <text x="660" y="652" fill="#4a5560" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18">Design · Identity</text>

  <!-- Copper orb motif -->
  <circle cx="1000" cy="720" r="48" fill="none" stroke="#c45c3a" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="1000" cy="720" r="18" fill="#c45c3a" fill-opacity="0.85"/>
</svg>
