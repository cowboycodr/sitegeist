<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Latent Garden — Intelligence should feel alive">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f18"/>
      <stop offset="45%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#06100c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#3d7a55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3d7a55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="12%" r="35%">
      <stop offset="0%" stop-color="#e8b48a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8b48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soilGlow" cx="50%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#3d7a55" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3d7a55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3d2c"/>
      <stop offset="55%" stop-color="#3d7a55"/>
      <stop offset="100%" stop-color="#9dffc8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fbc9a"/>
      <stop offset="100%" stop-color="#3d7a55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>
  <rect width="1200" height="900" fill="url(#soilGlow)"/>

  <!-- Soft lattice of latent nodes -->
  <g opacity="0.28" stroke="#9dffc8" stroke-width="1" fill="none">
    <circle cx="180" cy="220" r="18"/>
    <circle cx="320" cy="300" r="12"/>
    <circle cx="250" cy="400" r="9"/>
    <circle cx="900" cy="240" r="14"/>
    <circle cx="1020" cy="340" r="10"/>
    <circle cx="960" cy="460" r="16"/>
    <circle cx="150" cy="560" r="8"/>
    <circle cx="1050" cy="580" r="11"/>
    <line x1="180" y1="220" x2="320" y2="300"/>
    <line x1="320" y1="300" x2="250" y2="400"/>
    <line x1="900" y1="240" x2="1020" y2="340"/>
    <line x1="1020" y1="340" x2="960" y2="460"/>
  </g>

  <!-- Decorative frame -->
  <rect x="48" y="48" width="1104" height="804" rx="28" fill="none" stroke="rgba(157,255,200,0.16)" stroke-width="2"/>
  <rect x="64" y="64" width="1072" height="772" rx="22" fill="none" stroke="rgba(232,180,138,0.1)" stroke-width="1"/>

  <!-- Central garden motif -->
  <g transform="translate(600 520)">
    <!-- Ground arc -->
    <ellipse cx="0" cy="120" rx="280" ry="36" fill="rgba(30,61,44,0.55)"/>
    <ellipse cx="0" cy="118" rx="180" ry="18" fill="rgba(61,122,85,0.25)"/>

    <!-- Stems and foliage cluster -->
    <g stroke="url(#stemGrad)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-120 110 C-130 40, -90 -40, -70 -130"/>
      <path d="M-60 115 C-50 30, -40 -50, -20 -150"/>
      <path d="M0 120 C5 20, 0 -60, 8 -180"/>
      <path d="M55 115 C70 25, 90 -40, 110 -145"/>
      <path d="M110 110 C140 30, 150 -30, 165 -120"/>
      <path d="M-160 100 C-175 40, -190 -10, -200 -70"/>
      <path d="M160 100 C180 35, 200 0, 220 -55"/>
    </g>

    <!-- Leaves -->
    <g fill="url(#leafGrad)" opacity="0.9">
      <ellipse cx="-95" cy="-20" rx="28" ry="12" transform="rotate(-35 -95 -20)"/>
      <ellipse cx="-40" cy="-50" rx="32" ry="13" transform="rotate(20 -40 -50)"/>
      <ellipse cx="30" cy="-70" rx="26" ry="11" transform="rotate(-15 30 -70)"/>
      <ellipse cx="95" cy="-40" rx="30" ry="12" transform="rotate(30 95 -40)"/>
      <ellipse cx="-175" cy="10" rx="22" ry="9" transform="rotate(-50 -175 10)"/>
      <ellipse cx="185" cy="15" rx="22" ry="9" transform="rotate(45 185 15)"/>
    </g>

    <!-- Blooms -->
    <g>
      <circle cx="-70" cy="-130" r="14" fill="#e8b48a"/>
      <circle cx="-70" cy="-130" r="26" fill="#e8b48a" opacity="0.18"/>
      <circle cx="-20" cy="-150" r="10" fill="#f0c9a8"/>
      <circle cx="8" cy="-180" r="16" fill="#9dffc8"/>
      <circle cx="8" cy="-180" r="32" fill="#9dffc8" opacity="0.15"/>
      <circle cx="110" cy="-145" r="12" fill="#e8b48a"/>
      <circle cx="165" cy="-120" r="9" fill="#8fbc9a"/>
      <circle cx="-200" cy="-70" r="8" fill="#9dffc8" opacity="0.85"/>
      <circle cx="220" cy="-55" r="8" fill="#e8b48a" opacity="0.9"/>
    </g>

    <!-- Seed core -->
    <circle cx="0" cy="105" r="16" fill="rgba(157,255,200,0.18)"/>
    <circle cx="0" cy="105" r="7" fill="#e8b48a"/>
  </g>

  <!-- Typography -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" fill="#f4efe6" text-anchor="middle">
    <text x="600" y="168" font-size="22" letter-spacing="8" fill="#8fbc9a" font-family="ui-monospace, 'SF Mono', Consolas, monospace">CREATIVE INTELLIGENCE</text>
    <text x="600" y="250" font-size="92" font-weight="600" letter-spacing="-1.5">Latent Garden</text>
    <text x="600" y="320" font-size="34" font-style="italic" fill="#9dffc8">Intelligence should feel alive.</text>
  </g>

  <!-- Bottom rule and tagline -->
  <line x1="420" y1="780" x2="780" y2="780" stroke="rgba(157,255,200,0.28)" stroke-width="1.5"/>
  <text x="600" y="820" text-anchor="middle" font-size="20" letter-spacing="3" fill="#8fbc9a" font-family="ui-monospace, 'SF Mono', Consolas, monospace">ORGANIC SIMULATIONS · OPEN ESSAYS</text>
</svg>
