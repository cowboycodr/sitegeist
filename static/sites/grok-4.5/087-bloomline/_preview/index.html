<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Bloomline — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1a1a;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Bloomline gallery poster: Flowers with a point of view">
    <figcaption>Bloomline — preview poster (4:3)</figcaption>
  </figure>
</body>
</html>
