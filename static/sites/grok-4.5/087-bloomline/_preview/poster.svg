<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Bloomline — Flowers with a point of view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3eee4"/>
      <stop offset="55%" stop-color="#e8e0d2"/>
      <stop offset="100%" stop-color="#d9cfc0"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a39a"/>
      <stop offset="100%" stop-color="#c86b5e"/>
    </linearGradient>
    <linearGradient id="petalSoft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cfc8"/>
      <stop offset="100%" stop-color="#d4a09a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e8574"/>
      <stop offset="100%" stop-color="#3d5246"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b88a"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#c86b5e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c86b5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- soft architectural frame -->
  <rect x="48" y="48" width="1104" height="804" rx="8" fill="none" stroke="#14201c" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="72" y="72" width="1056" height="756" rx="4" fill="none" stroke="#14201c" stroke-opacity="0.06" stroke-width="1"/>

  <!-- left ink panel -->
  <path d="M72 72h420v756H72z" fill="#14201c"/>
  <path d="M72 72h420v756H72z" fill="url(#glow)" opacity="0.5"/>

  <!-- brand lockup -->
  <g transform="translate(120 160)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#f3eee4" stroke-width="2"/>
    <path d="M28 10c5 5.5 7.5 11 7.5 16A7.5 7.5 0 0 1 28 33.5 7.5 7.5 0 0 1 20.5 26C20.5 21 23 15.5 28 10z" fill="#c86b5e"/>
    <path d="M17 23c6.5.4 12.2 3.2 15.8 8a7.5 7.5 0 0 1-6.2 3.7 7.5 7.5 0 0 1-7.3-6.2c-.4-2-.9-4-2.3-5.5z" fill="#6e8574"/>
    <path d="M39 23c-6.5.4-12.2 3.2-15.8 8a7.5 7.5 0 0 0 6.2 3.7 7.5 7.5 0 0 0 7.3-6.2c.4-2 .9-4 2.3-5.5z" fill="#b8956a"/>
    <circle cx="28" cy="27" r="3" fill="#f3eee4"/>
    <text x="72" y="38" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="42" fill="#f3eee4" letter-spacing="-1">Bloomline</text>
  </g>

  <text x="120" y="280" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="54" font-style="italic" fill="#d4a09a">Flowers with a</text>
  <text x="120" y="348" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="54" font-style="italic" fill="#f3eee4">point of view.</text>

  <line x1="120" y1="400" x2="300" y2="400" stroke="#c86b5e" stroke-width="2"/>

  <text x="120" y="460" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" letter-spacing="4" fill="#a8b9ad">SEASONAL STEMS / LONDON</text>

  <text x="120" y="540" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#e8e0d2" opacity="0.85">
    <tspan x="120" dy="0">Sculptural floral compositions</tspan>
    <tspan x="120" dy="32">for homes, gatherings, galleries,</tspan>
    <tspan x="120" dy="32">and unexpected Tuesdays.</tspan>
  </text>

  <text x="120" y="740" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" letter-spacing="3" fill="#6e8574">FLORAL DESIGN</text>

  <!-- sculptural bloom composition on cream side -->
  <g transform="translate(760 470)">
    <!-- vessel -->
    <path d="M-55 90c10 95 28 160 55 185 27-25 45-90 55-185z" fill="#1a2823"/>
    <ellipse cx="0" cy="90" rx="58" ry="16" fill="#0f1815"/>
    <path d="M-52 90c10-8 34-14 52-14s42 6 52 14" fill="none" stroke="#c4b5a0" stroke-width="2" opacity="0.45"/>

    <!-- stems -->
    <path d="M-18 80c-12-70-40-140-22-220" fill="none" stroke="url(#stem)" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 85c4-80 10-150 0-240" fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 80c16-65 38-130 28-210" fill="none" stroke="url(#stem)" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 40c-30-40-70-55-100-50" fill="none" stroke="url(#stem)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M14 30c35-35 70-40 100-28" fill="none" stroke="url(#stem)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- leaves -->
    <path d="M-40 -40c-35-12-62 10-64 42 34 6 60-12 64-42z" fill="#6e8574"/>
    <path d="M42 -70c38-6 58 22 54 52-34-4-54-22-54-52z" fill="#5a7362"/>
    <path d="M-55 20c-28 16-34 46-16 66 24-18 36-42 16-66z" fill="#7a927f"/>

    <!-- main bloom -->
    <g transform="translate(0 -160)">
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petal)" transform="rotate(0)"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petalSoft)" transform="rotate(51)"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petal)" transform="rotate(102)" opacity="0.95"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petalSoft)" transform="rotate(153)"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petal)" transform="rotate(204)" opacity="0.92"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petalSoft)" transform="rotate(255)"/>
      <ellipse cx="0" cy="-48" rx="36" ry="58" fill="url(#petal)" transform="rotate(306)" opacity="0.9"/>
      <circle cx="0" cy="0" r="22" fill="url(#gold)"/>
      <circle cx="0" cy="0" r="9" fill="#14201c" opacity="0.5"/>
    </g>

    <!-- secondary bloom -->
    <g transform="translate(-105 -10) scale(0.85)">
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#d4a09a" transform="rotate(15)"/>
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#c86b5e" transform="rotate(75)"/>
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#e8b4ac" transform="rotate(135)"/>
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#c86b5e" transform="rotate(195)"/>
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#d4a09a" transform="rotate(255)"/>
      <ellipse cx="0" cy="-36" rx="26" ry="42" fill="#b85a4e" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="14" fill="#b8956a"/>
    </g>

    <!-- bud -->
    <g transform="translate(105 -20)">
      <ellipse cx="0" cy="-14" rx="22" ry="36" fill="#c86b5e" transform="rotate(25)"/>
      <ellipse cx="6" cy="-6" rx="16" ry="26" fill="#e8a39a" transform="rotate(-10)"/>
      <ellipse cx="-4" cy="4" rx="12" ry="18" fill="#6e8574" opacity="0.7" transform="rotate(40)"/>
    </g>

    <!-- floating petals -->
    <ellipse cx="-160" cy="-180" rx="12" ry="22" fill="#d4a09a" opacity="0.5" transform="rotate(-25 -160 -180)"/>
    <ellipse cx="150" cy="-120" rx="10" ry="18" fill="#c86b5e" opacity="0.4" transform="rotate(30 150 -120)"/>
    <ellipse cx="170" cy="60" rx="9" ry="16" fill="#b8956a" opacity="0.35" transform="rotate(12 170 60)"/>
  </g>
</svg>
