<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Drift — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0e18;
      color: #ebe6dc;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      max-width: min(96vw, 960px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
      color: #a39e93;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Drift gallery poster: crescent moon over night waves with tagline A softer landing for your day." width="1200" height="900">
    <figcaption>Gallery poster for Drift (4:3)</figcaption>
  </figure>
</body>
</html>
