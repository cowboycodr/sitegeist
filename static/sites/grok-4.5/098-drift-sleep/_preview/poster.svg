<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Drift — A softer landing for your day">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="45%" stop-color="#101a32"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#f2ead9" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#c4a574" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="40%" stop-color="#f2ead9"/>
      <stop offset="100%" stop-color="#b89a68"/>
    </radialGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9aabd0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9aabd0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9aabd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Soft stars -->
  <g fill="#f2ead9" opacity="0.55">
    <circle cx="120" cy="110" r="1.6"/>
    <circle cx="210" cy="180" r="1.2"/>
    <circle cx="320" cy="90" r="1.4"/>
    <circle cx="480" cy="140" r="1.1"/>
    <circle cx="90" cy="260" r="1.3"/>
    <circle cx="980" cy="120" r="1.5"/>
    <circle cx="1080" cy="200" r="1.2"/>
    <circle cx="920" cy="80" r="1.1"/>
    <circle cx="1050" cy="320" r="1.4"/>
    <circle cx="150" cy="400" r="1.1"/>
    <circle cx="250" cy="320" r="1.3"/>
    <circle cx="860" cy="260" r="1.2"/>
  </g>

  <!-- Orbit rings -->
  <circle cx="760" cy="390" r="210" fill="none" stroke="#9aabd0" stroke-width="1.2" opacity="0.22"/>
  <circle cx="760" cy="390" r="160" fill="none" stroke="#c4a574" stroke-width="1" opacity="0.2"/>
  <circle cx="760" cy="390" r="210" fill="none" stroke="#9aabd0" stroke-width="1.2" opacity="0.22" stroke-dasharray="4 14"/>
  <circle cx="970" cy="390" r="5" fill="#9aabd0" opacity="0.7"/>
  <circle cx="640" cy="250" r="4" fill="#c4a574" opacity="0.8"/>

  <!-- Moon -->
  <circle cx="760" cy="390" r="118" fill="url(#moonGrad)"/>
  <circle cx="810" cy="360" r="100" fill="#101a32"/>
  <!-- Subtle moon edge light -->
  <path d="M700 320c28-36 78-52 122-40-18 8-34 22-44 42-16 32-14 68 4 96-40-8-76-40-82-98z" fill="#f2ead9" opacity="0.08"/>

  <!-- Drift waves -->
  <g fill="none" stroke="url(#waveStroke)" stroke-width="2" stroke-linecap="round">
    <path d="M80 640 C 220 600, 340 680, 480 640 S 740 600, 900 650 S 1080 700, 1140 660"/>
    <path d="M60 690 C 200 650, 360 730, 520 690 S 780 650, 940 700 S 1100 740, 1160 700" opacity="0.7"/>
    <path d="M100 740 C 240 710, 380 780, 540 740 S 800 710, 960 760 S 1120 790, 1180 750" opacity="0.45"/>
  </g>

  <!-- Brand block -->
  <g>
    <!-- Small crescent mark -->
    <circle cx="140" cy="200" r="22" fill="none" stroke="#c4a574" stroke-width="1.5" opacity="0.5"/>
    <path d="M150 186a16 16 0 1 0 5 23 13 13 0 1 1-5-23z" fill="#f2ead9"/>

    <text x="180" y="210" font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif" font-size="56" fill="#f2ead9" letter-spacing="2">Drift</text>
    <text x="140" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#c4a574" letter-spacing="6">SLEEP TECHNOLOGY</text>
    <text x="140" y="330" font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif" font-size="42" fill="#ebe6dc">A softer landing</text>
    <text x="140" y="382" font-family="Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif" font-size="42" fill="#dcc9a4" font-style="italic">for your day.</text>
    <text x="140" y="450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#9aabd0" letter-spacing="1">Sound · Breath · Gentle routines</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="840" width="1200" height="60" fill="#070b16" opacity="0.65"/>
  <text x="140" y="876" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#a39e93" letter-spacing="2">TONIGHT BEGINS HERE</text>
  <text x="900" y="876" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="18" fill="#c4a574" text-anchor="middle">Start winding down</text>
</svg>
