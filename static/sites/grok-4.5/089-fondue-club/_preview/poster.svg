<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Fondue Club — Dip irresponsibly.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A1019"/>
      <stop offset="45%" stop-color="#5C1D2A"/>
      <stop offset="100%" stop-color="#1A090E"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7D06A"/>
      <stop offset="50%" stop-color="#E8A83A"/>
      <stop offset="100%" stop-color="#C47A1A"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1218"/>
      <stop offset="100%" stop-color="#0F0609"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#E8A83A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A83A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#F7D06A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F7D06A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft decorative rings -->
  <circle cx="980" cy="220" r="180" fill="none" stroke="#F7D06A" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="980" cy="220" r="120" fill="none" stroke="#F7D06A" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="160" cy="720" r="140" fill="none" stroke="#FBF3E4" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Top category pill -->
  <rect x="72" y="72" width="220" height="44" rx="22" fill="rgba(251,243,228,0.08)" stroke="#F7D06A" stroke-opacity="0.35"/>
  <text x="182" y="100" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="18" letter-spacing="3.5" fill="#F7D06A">SUPPER CLUB</text>

  <!-- Brand wordmark -->
  <text x="72" y="220" font-family="Georgia, 'Palatino Linotype', serif" font-size="96" font-weight="700" fill="#FBF3E4" letter-spacing="-2">Fondue Club</text>
  <text x="72" y="300" font-family="Georgia, 'Palatino Linotype', serif" font-size="48" font-style="italic" fill="#E8A83A">Dip irresponsibly.</text>

  <!-- Supporting line -->
  <text x="72" y="370" font-family="system-ui, Segoe UI, sans-serif" font-size="24" fill="#F0E2C8" fill-opacity="0.8">Bubbling cheese · Cold wine · Unserious evenings</text>

  <!-- Divider -->
  <line x1="72" y1="420" x2="520" y2="420" stroke="#E8A83A" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Detail chips -->
  <text x="72" y="480" font-family="system-ui, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#FBF3E4">Next melt / Friday 8 PM</text>
  <text x="72" y="520" font-family="system-ui, Segoe UI, sans-serif" font-size="20" fill="#F0E2C8" fill-opacity="0.75">18 seats · Alpine three-cheese pot</text>

  <!-- Large fondue pot motif (right side) -->
  <g transform="translate(620, 180)">
    <!-- Steam -->
    <path d="M140 40c0-28 18-42 18-64" stroke="#F5E6C8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45"/>
    <path d="M200 18c0-32 20-48 20-72" stroke="#F5E6C8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M260 40c0-24 14-38 14-58" stroke="#F5E6C8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Pot stand -->
    <path d="M120 470 h220 l-18 36 H138z" fill="#0F0609"/>
    <ellipse cx="230" cy="470" rx="100" ry="14" fill="#1A0B10"/>

    <!-- Pot body -->
    <path d="M70 200 v160 c0 95 70 155 160 155s160-60 160-155V200" fill="url(#pot)"/>
    <ellipse cx="230" cy="200" rx="160" ry="40" fill="#2A1218"/>
    <ellipse cx="230" cy="200" rx="160" ry="40" fill="none" stroke="#6B2A38" stroke-width="4"/>

    <!-- Cheese surface -->
    <ellipse cx="230" cy="200" rx="138" ry="32" fill="url(#cheese)"/>
    <ellipse cx="230" cy="192" rx="90" ry="16" fill="#FFF3C4" opacity="0.45"/>

    <!-- Bubbles -->
    <circle cx="180" cy="192" r="9" fill="#FFF0B0" opacity="0.9"/>
    <circle cx="250" cy="205" r="7" fill="#FFE08A" opacity="0.85"/>
    <circle cx="290" cy="188" r="8" fill="#FFF0B0" opacity="0.8"/>
    <circle cx="210" cy="210" r="5" fill="#FFE8A0" opacity="0.75"/>

    <!-- Fork -->
    <g transform="translate(300,20) rotate(32)">
      <rect x="16" y="55" width="10" height="220" rx="4" fill="#C9A66B"/>
      <path d="M4 55 h34 v-40 c0-6-3-12-9-12h-3v34h-10V3h-3c-6 0-9 6-9 12z" fill="#E8E4DC"/>
      <rect x="8" y="3" width="4" height="34" fill="#D0CCC4"/>
      <rect x="18" y="3" width="4" height="34" fill="#D0CCC4"/>
      <rect x="28" y="3" width="4" height="34" fill="#D0CCC4"/>
    </g>

    <!-- Pot rim highlight -->
    <path d="M90 200c10-18 70-30 140-30s130 12 140 30" fill="none" stroke="#F7D06A" stroke-opacity="0.2" stroke-width="3"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="820" width="1200" height="80" fill="rgba(0,0,0,0.28)"/>
  <text x="72" y="868" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#FBF3E4">Grab a seat · Inspect the menu</text>
  <text x="1128" y="868" text-anchor="end" font-family="Georgia, 'Palatino Linotype', serif" font-size="22" font-style="italic" fill="#E8A83A">fondue club</text>
</svg>
