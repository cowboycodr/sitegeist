<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Blue Hour Club — Gallery Poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0f16;
      color: #9aadc2;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: 960px;
      width: calc(100% - 2rem);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    figcaption {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Blue Hour Club gallery poster">
    <figcaption>Blue Hour Club — promotional poster (4:3)</figcaption>
  </figure>
</body>
</html>
