<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Blue Hour Club — The city sounds better after midnight">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="45%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#3d6ea8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1a3a5f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="30%" stop-color="#0c1220"/>
      <stop offset="70%" stop-color="#080d16"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>
    <linearGradient id="shine" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6b9fd4" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#c9a227" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3d6ea8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a227" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft grid -->
  <g opacity="0.12" stroke="#6b9fd4" stroke-width="1">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200"/>
    <path d="M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/>
  </g>

  <!-- Frame -->
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#2a4a6e" stroke-width="1.5" opacity="0.55"/>
  <rect x="60" y="60" width="1080" height="780" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.25"/>

  <!-- Vinyl motif -->
  <g transform="translate(720 200)">
    <circle cx="200" cy="240" r="210" fill="url(#disc)" stroke="#2a4060" stroke-width="3"/>
    <circle cx="200" cy="240" r="190" fill="none" stroke="#1a2a40" stroke-width="1.5" opacity="0.85"/>
    <circle cx="200" cy="240" r="165" fill="none" stroke="#1a2a40" stroke-width="1.2" opacity="0.7"/>
    <circle cx="200" cy="240" r="140" fill="none" stroke="#1a2a40" stroke-width="1" opacity="0.55"/>
    <circle cx="200" cy="240" r="115" fill="none" stroke="#1a2a40" stroke-width="0.8" opacity="0.45"/>
    <circle cx="200" cy="240" r="72" fill="#1a3a5f" stroke="#c9a227" stroke-width="3"/>
    <circle cx="200" cy="240" r="28" fill="#070b12"/>
    <circle cx="200" cy="240" r="10" fill="#c9a227"/>
    <circle cx="200" cy="240" r="210" fill="url(#shine)"/>
    <text x="200" y="232" text-anchor="middle" fill="#c9a227" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="3">BLUE HOUR</text>
    <text x="200" y="252" text-anchor="middle" fill="#8eb4d8" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2">CHICAGO</text>
  </g>

  <!-- Note motif accents -->
  <g fill="#c9a227" opacity="0.55">
    <circle cx="180" cy="620" r="8"/>
    <circle cx="220" cy="635" r="8"/>
    <rect x="185" y="560" width="3" height="62" rx="1"/>
    <rect x="225" y="575" width="3" height="62" rx="1"/>
    <path d="M188 560h40v14c-8 6-20 8-40 4v-18z" opacity="0.85"/>
  </g>

  <!-- Typography block -->
  <text x="110" y="220" fill="#c9a227" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="6">LIVE IN CHICAGO</text>

  <text x="110" y="330" fill="#e8eef6" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="600">Blue Hour</text>
  <text x="110" y="420" fill="#e8eef6" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="600">Club</text>

  <rect x="110" y="460" width="280" height="2" fill="url(#goldLine)"/>

  <text x="110" y="520" fill="#8eb4d8" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic">The city sounds better</text>
  <text x="110" y="565" fill="#8eb4d8" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic">after midnight.</text>

  <text x="110" y="660" fill="#9aadc2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20">Searching sets · Resident artists · Low light</text>
  <text x="110" y="700" fill="#6d8299" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" letter-spacing="1">WICKER PARK  ·  DOORS 9 PM</text>

  <!-- Corner mark -->
  <g transform="translate(1040 720)" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.7">
    <circle cx="40" cy="40" r="28"/>
    <circle cx="40" cy="40" r="8" fill="#c9a227" stroke="none"/>
    <path d="M48 28v18a5 5 0 1 1-2.5-4.4V22l10-2.5v5L48 28z" fill="#c9a227" stroke="none"/>
  </g>
</svg>
