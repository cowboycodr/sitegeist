<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Museum of Small Things — Ordinary objects. Extraordinary stories.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f0e6"/>
      <stop offset="55%" stop-color="#ebe3d4"/>
      <stop offset="100%" stop-color="#e0d4c2"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c19a"/>
      <stop offset="50%" stop-color="#9a7f4a"/>
      <stop offset="100%" stop-color="#5c4a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e8c4b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8c4b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#5f7260" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5f7260" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft archival grid -->
  <g stroke="#1c1814" stroke-opacity="0.05" stroke-width="1">
    <path d="M80 80h1040M80 820h1040M80 80v740M1120 80v740"/>
    <path d="M100 100h1000M100 800h1000M100 100v700M1100 100v700"/>
  </g>

  <!-- Corner marks -->
  <g fill="none" stroke="#b4532a" stroke-width="2" stroke-linecap="round">
    <path d="M100 140V100h40"/>
    <path d="M1100 140V100h-40"/>
    <path d="M100 760v40h40"/>
    <path d="M1100 760v40h-40"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(140 160)">
    <rect width="72" height="72" rx="18" fill="#1c1814"/>
    <circle cx="36" cy="36" r="14" fill="none" stroke="#e8c4b0" stroke-width="2.5"/>
    <circle cx="36" cy="36" r="4.5" fill="#b4532a"/>
    <path d="M36 16v8M36 48v8M16 36h8M48 36h8" stroke="#f6f0e6" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Eyebrow -->
  <text x="240" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5f7260" letter-spacing="4">OPEN COLLECTION</text>
  <text x="240" y="222" font-family="system-ui, sans-serif" font-size="16" fill="#6b6156" letter-spacing="2">4,208 OBJECTS · CULTURE</text>

  <!-- Title -->
  <text x="140" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#1c1814" letter-spacing="-1.5">Museum of</text>
  <text x="140" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#1c1814" letter-spacing="-1.5">Small Things</text>

  <!-- Tagline -->
  <text x="140" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#3d352c">Ordinary objects. Extraordinary stories.</text>

  <!-- Accent rule -->
  <rect x="140" y="530" width="120" height="4" rx="2" fill="#b4532a"/>

  <!-- Description line -->
  <text x="140" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#6b6156">Emotional histories hidden inside the things people keep</text>

  <!-- Decorative key motif (right) -->
  <g transform="translate(720 220) rotate(-22)">
    <ellipse cx="150" cy="280" rx="90" ry="18" fill="#1c1814" fill-opacity="0.06"/>
    <circle cx="90" cy="120" r="58" fill="none" stroke="url(#keyGrad)" stroke-width="22"/>
    <circle cx="90" cy="120" r="26" fill="#f6f0e6"/>
    <rect x="138" y="104" width="180" height="32" rx="8" fill="url(#keyGrad)"/>
    <rect x="270" y="136" width="18" height="36" rx="4" fill="url(#keyGrad)"/>
    <rect x="298" y="136" width="18" height="52" rx="4" fill="url(#keyGrad)"/>
    <rect x="326" y="136" width="18" height="28" rx="4" fill="url(#keyGrad)"/>
  </g>

  <!-- Small object dots (collection motif) -->
  <g>
    <circle cx="160" cy="700" r="10" fill="#b4532a"/>
    <circle cx="200" cy="700" r="10" fill="#5f7260"/>
    <circle cx="240" cy="700" r="10" fill="#b8944a"/>
    <circle cx="280" cy="700" r="10" fill="#1c1814" fill-opacity="0.35"/>
  </g>
  <text x="310" y="706" font-family="system-ui, sans-serif" font-size="16" fill="#6b6156" letter-spacing="1.5">KEYS · TICKETS · STONES · KEEPSAKES</text>

  <!-- Bottom caption -->
  <text x="140" y="780" font-family="system-ui, sans-serif" font-size="18" fill="#3d352c" font-weight="600">museum of small things</text>
  <text x="900" y="780" font-family="system-ui, sans-serif" font-size="16" fill="#6b6156" text-anchor="end">digital gallery</text>
</svg>
