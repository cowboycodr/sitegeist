<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Poster — Museum of Small Things</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1c1814;
      font-family: system-ui, sans-serif;
      color: #f6f0e6;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100% - 2rem);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Museum of Small Things gallery poster">
    <figcaption>Gallery poster (4:3) — Museum of Small Things</figcaption>
  </figure>
</body>
</html>
