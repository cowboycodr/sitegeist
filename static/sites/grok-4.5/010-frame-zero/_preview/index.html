<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Frame Zero — Gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0b0a;
      color: #f4efe6;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(244, 239, 230, 0.15);
    }
    figcaption {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8176;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Frame Zero gallery poster: Films that refuse the expected." width="1200" height="900">
    <figcaption>Preview · poster.svg · 4:3</figcaption>
  </figure>
</body>
</html>
