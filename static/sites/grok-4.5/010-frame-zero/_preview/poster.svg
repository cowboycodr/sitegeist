<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Frame Zero — Films that refuse the expected.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161412"/>
      <stop offset="45%" stop-color="#0c0b0a"/>
      <stop offset="100%" stop-color="#1a100c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ff4d1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#f4efe6" opacity="0.04"/>
      <circle cx="4" cy="3" r="0.5" fill="#f4efe6" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#grain)"/>

  <!-- Outer film frame -->
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#f4efe6" stroke-width="2" opacity="0.22"/>
  <rect x="72" y="72" width="1056" height="756" fill="none" stroke="#ff4d1a" stroke-width="3"/>

  <!-- Left sprocket strip -->
  <rect x="72" y="72" width="52" height="756" fill="#0c0b0a"/>
  <g fill="#ff4d1a">
    <rect x="88" y="110" width="20" height="32" rx="1"/>
    <rect x="88" y="180" width="20" height="32" rx="1"/>
    <rect x="88" y="250" width="20" height="32" rx="1"/>
    <rect x="88" y="320" width="20" height="32" rx="1"/>
    <rect x="88" y="390" width="20" height="32" rx="1"/>
    <rect x="88" y="460" width="20" height="32" rx="1"/>
    <rect x="88" y="530" width="20" height="32" rx="1"/>
    <rect x="88" y="600" width="20" height="32" rx="1"/>
    <rect x="88" y="670" width="20" height="32" rx="1"/>
    <rect x="88" y="740" width="20" height="32" rx="1"/>
  </g>

  <!-- Right sprocket strip -->
  <rect x="1076" y="72" width="52" height="756" fill="#0c0b0a"/>
  <g fill="#ff4d1a">
    <rect x="1092" y="110" width="20" height="32" rx="1"/>
    <rect x="1092" y="180" width="20" height="32" rx="1"/>
    <rect x="1092" y="250" width="20" height="32" rx="1"/>
    <rect x="1092" y="320" width="20" height="32" rx="1"/>
    <rect x="1092" y="390" width="20" height="32" rx="1"/>
    <rect x="1092" y="460" width="20" height="32" rx="1"/>
    <rect x="1092" y="530" width="20" height="32" rx="1"/>
    <rect x="1092" y="600" width="20" height="32" rx="1"/>
    <rect x="1092" y="670" width="20" height="32" rx="1"/>
    <rect x="1092" y="740" width="20" height="32" rx="1"/>
  </g>

  <!-- Inner picture area accent -->
  <rect x="150" y="100" width="900" height="700" fill="#12100e" stroke="#f4efe6" stroke-width="1" opacity="0.95"/>
  <rect x="150" y="100" width="900" height="700" fill="url(#grain)"/>

  <!-- Accent arcs / motif -->
  <circle cx="780" cy="300" r="160" fill="none" stroke="#d6ff4a" stroke-width="2" opacity="0.45"/>
  <circle cx="780" cy="300" r="90" fill="none" stroke="#ff4d1a" stroke-width="1.5" opacity="0.35"/>
  <path d="M220 620 C380 420, 520 700, 980 280" fill="none" stroke="#f4efe6" stroke-width="1.5" opacity="0.2"/>

  <!-- Giant zero mark -->
  <text x="600" y="430" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="320" font-weight="700" fill="#d6ff4a" opacity="0.12">0</text>

  <!-- Eyebrow -->
  <text x="210" y="220" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="22" letter-spacing="8" fill="#ff4d1a">INDEPENDENT CINEMA</text>

  <!-- Title -->
  <text x="210" y="340" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="96" font-weight="700" fill="#f4efe6">Frame Zero</text>

  <!-- Tagline -->
  <text x="210" y="410" font-family="Georgia, 'Iowan Old Style', serif" font-size="34" fill="#c9c0b2">Films that refuse the expected.</text>

  <!-- Rule -->
  <rect x="210" y="450" width="120" height="3" fill="#d6ff4a"/>

  <!-- Supporting line -->
  <text x="210" y="520" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="18" letter-spacing="3" fill="#8a8176">LIVING FESTIVAL PROGRAM  ·  SEASON 10</text>
  <text x="210" y="560" font-family="Georgia, serif" font-size="24" fill="#f4efe6" opacity="0.85">Sharp new voices. Stories without a formula.</text>

  <!-- Bottom bar -->
  <rect x="150" y="700" width="900" height="100" fill="#0c0b0a"/>
  <text x="210" y="760" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="20" letter-spacing="4" fill="#d6ff4a">FZ-10</text>
  <text x="340" y="760" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="20" letter-spacing="3" fill="#8a8176">START WATCHING  ·  BROWSE THE PROGRAM</text>
  <text x="960" y="760" text-anchor="end" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ff4d1a">0</text>
</svg>
