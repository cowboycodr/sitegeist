<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Crumb Theory — A daily study in butter and flour">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe4"/>
      <stop offset="45%" stop-color="#f3e2c8"/>
      <stop offset="100%" stop-color="#e8c9a0"/>
    </linearGradient>
    <linearGradient id="croissant" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d9a0"/>
      <stop offset="45%" stop-color="#d48a3c"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1d14"/>
      <stop offset="100%" stop-color="#3f2a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8c47a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8c47a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="140" r="220" fill="url(#glow)"/>
  <circle cx="180" cy="720" r="180" fill="#c46a2d" opacity="0.08"/>

  <!-- Soft flour dust -->
  <g fill="#c46a2d" opacity="0.22">
    <circle cx="120" cy="160" r="5"/>
    <circle cx="190" cy="220" r="3.5"/>
    <circle cx="90" cy="280" r="2.5"/>
    <circle cx="1050" cy="700" r="4"/>
    <circle cx="1100" cy="640" r="3"/>
    <circle cx="980" cy="760" r="2.5"/>
    <circle cx="240" cy="780" r="3"/>
    <circle cx="860" cy="120" r="3"/>
  </g>

  <!-- Left cocoa panel accent -->
  <rect x="0" y="0" width="28" height="900" fill="#2c1d14"/>
  <rect x="28" y="0" width="10" height="900" fill="#c46a2d"/>

  <!-- Main card -->
  <rect x="120" y="110" width="960" height="680" rx="36" fill="#fffaf2" stroke="#e4d5c2" stroke-width="3"/>
  <rect x="120" y="110" width="960" height="680" rx="36" fill="none" stroke="#2c1d14" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Brand mark -->
  <g transform="translate(190 190)">
    <rect width="92" height="92" rx="24" fill="url(#panel)"/>
    <ellipse cx="46" cy="54" rx="28" ry="18" fill="#e8c47a"/>
    <path d="M20 52c8-14 18-22 26-22s18 8 26 22" fill="none" stroke="#c46a2d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="34" cy="50" r="2.8" fill="#2c1d14"/>
    <circle cx="46" cy="47" r="2.4" fill="#2c1d14"/>
    <circle cx="58" cy="51" r="2.6" fill="#2c1d14"/>
  </g>

  <!-- Title block -->
  <text x="310" y="235" fill="#2c1d14" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="64" font-weight="700" letter-spacing="-1.5">Crumb Theory</text>
  <text x="314" y="278" fill="#6e5848" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" letter-spacing="4" font-weight="600">BAKED EACH MORNING</text>

  <!-- Tagline -->
  <text x="190" y="380" fill="#2c1d14" font-family="Georgia, 'Iowan Old Style', serif" font-size="42" font-style="italic">A daily study in butter and flour.</text>

  <!-- Divider -->
  <line x1="190" y1="420" x2="480" y2="420" stroke="#c46a2d" stroke-width="3" stroke-linecap="round"/>

  <!-- Supporting copy -->
  <text x="190" y="480" fill="#6e5848" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24">Today's counter · Preorder boxes · Pastry notes</text>
  <text x="190" y="525" fill="#6e5848" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22">Neighborhood bakery on Maple &amp; 12th</text>

  <!-- Large croissant motif -->
  <g transform="translate(700 430)">
    <ellipse cx="160" cy="210" rx="150" ry="28" fill="#e4d5c2" opacity="0.7"/>
    <path d="M30 160c30-95 100-145 145-145s115 50 145 145c-50-32-98-44-145-44S80 128 30 160z" fill="url(#croissant)"/>
    <path d="M60 150c22-65 70-98 115-98s93 33 115 98c-32-18-70-26-115-26s-83 8-115 26z" fill="#f5e0b0" opacity="0.5"/>
    <path d="M95 142c14-40 42-60 75-60s61 20 75 60c-22-12-48-17-75-17s-53 5-75 17z" fill="#fff3d6" opacity="0.4"/>
    <!-- crumbs -->
    <circle cx="40" cy="70" r="5" fill="#c46a2d" opacity="0.45"/>
    <circle cx="280" cy="90" r="4" fill="#8b5a2b" opacity="0.35"/>
    <circle cx="300" cy="150" r="3.5" fill="#e8c47a" opacity="0.7"/>
    <circle cx="20" cy="120" r="3" fill="#d48a3c" opacity="0.5"/>
  </g>

  <!-- Bottom bar -->
  <rect x="120" y="700" width="960" height="90" rx="0" fill="#2c1d14"/>
  <rect x="120" y="700" width="960" height="90" fill="#2c1d14"/>
  <!-- clip bottom of card with rounded feel via overlay corners -->
  <path d="M120 700h960v54c0 20-16 36-36 36H156c-20 0-36-16-36-36V700z" fill="#2c1d14"/>
  <text x="190" y="755" fill="#e8c47a" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="2">COUNTER · PREORDER · NOTES</text>
  <text x="820" y="755" fill="#fffaf2" font-family="Georgia, serif" font-size="24" text-anchor="start">Open 7:30 am</text>
</svg>
