<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Raster Rush — Tiny pixels. Huge worlds.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12081F"/>
      <stop offset="45%" stop-color="#0A0612"/>
      <stop offset="100%" stop-color="#1A0820"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#B8FF00"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,245,230,0.06)" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Ambient color blocks -->
  <rect x="0" y="0" width="1200" height="18" fill="#FF2D95"/>
  <rect x="0" y="882" width="1200" height="18" fill="#00F0FF"/>

  <!-- Left pixel stack motif -->
  <g>
    <rect x="72" y="180" width="64" height="64" fill="#FF2D95"/>
    <rect x="152" y="180" width="64" height="64" fill="#00F0FF"/>
    <rect x="72" y="260" width="64" height="64" fill="#B8FF00"/>
    <rect x="152" y="260" width="64" height="64" fill="#FF6B00"/>
    <rect x="72" y="360" width="48" height="48" fill="#8B5CF6"/>
    <rect x="136" y="376" width="32" height="32" fill="#FF2D95"/>
    <rect x="184" y="360" width="48" height="48" fill="#00F0FF"/>
  </g>

  <!-- Right city / world silhouette -->
  <g opacity="0.95">
    <rect x="820" y="420" width="48" height="200" fill="#FF2D95"/>
    <rect x="884" y="360" width="36" height="260" fill="#00F0FF"/>
    <rect x="936" y="470" width="56" height="150" fill="#B8FF00"/>
    <rect x="1008" y="390" width="40" height="230" fill="#FF6B00"/>
    <rect x="1064" y="440" width="64" height="180" fill="#8B5CF6"/>
    <rect x="800" y="620" width="360" height="16" fill="#FF2D95" opacity="0.7"/>
    <!-- moon -->
    <rect x="1040" y="220" width="48" height="48" fill="#FFF5E6"/>
    <rect x="1056" y="236" width="20" height="20" fill="#12081F"/>
  </g>

  <!-- Running sprite (center-left) -->
  <g transform="translate(300 520)">
    <!-- ground stripe -->
    <rect x="-80" y="56" width="680" height="12" fill="#1A0F2E"/>
    <rect x="-80" y="56" width="680" height="4" fill="#FF2D95"/>
    <rect x="-60" y="72" width="28" height="6" fill="#00F0FF"/>
    <rect x="0" y="72" width="28" height="6" fill="#B8FF00"/>
    <rect x="60" y="72" width="28" height="6" fill="#FF6B00"/>
    <rect x="120" y="72" width="28" height="6" fill="#00F0FF"/>
    <rect x="180" y="72" width="28" height="6" fill="#B8FF00"/>
    <rect x="240" y="72" width="28" height="6" fill="#FF6B00"/>
    <rect x="300" y="72" width="28" height="6" fill="#00F0FF"/>
    <rect x="360" y="72" width="28" height="6" fill="#B8FF00"/>
    <rect x="420" y="72" width="28" height="6" fill="#FF6B00"/>
    <rect x="480" y="72" width="28" height="6" fill="#00F0FF"/>
    <!-- player -->
    <rect x="40" y="8" width="36" height="48" fill="#B8FF00"/>
    <rect x="52" y="18" width="10" height="10" fill="#0A0612"/>
    <rect x="36" y="24" width="10" height="8" fill="#FF2D95"/>
    <rect x="44" y="48" width="10" height="12" fill="#00F0FF"/>
    <rect x="62" y="48" width="10" height="12" fill="#00F0FF"/>
    <!-- coins -->
    <rect x="160" y="-20" width="20" height="20" fill="#00F0FF"/>
    <rect x="166" y="-14" width="8" height="8" fill="#FFF5E6"/>
    <rect x="230" y="-48" width="20" height="20" fill="#00F0FF"/>
    <rect x="236" y="-42" width="8" height="8" fill="#FFF5E6"/>
    <rect x="300" y="-12" width="20" height="20" fill="#00F0FF"/>
    <rect x="306" y="-6" width="8" height="8" fill="#FFF5E6"/>
    <!-- spike -->
    <polygon points="400,56 420,8 440,56" fill="#FF2D95"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(72 72)">
    <rect x="0" y="0" width="36" height="36" fill="#FF2D95"/>
    <rect x="44" y="0" width="36" height="36" fill="#00F0FF"/>
    <rect x="0" y="44" width="36" height="36" fill="#B8FF00"/>
    <rect x="44" y="44" width="36" height="36" fill="#FF6B00"/>
  </g>

  <!-- Eyebrow -->
  <rect x="180" y="88" width="260" height="36" rx="18" fill="rgba(255,45,149,0.15)" stroke="#FF2D95" stroke-width="2"/>
  <text x="310" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#FF2D95">INSERT IMAGINATION</text>

  <!-- Title -->
  <text x="72" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="900" letter-spacing="-2" fill="#FFF5E6">RASTER RUSH</text>
  <text x="72" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">Tiny pixels. Huge worlds.</text>

  <!-- Tag chips -->
  <g font-family="ui-monospace, Cascadia Code, monospace" font-size="18" font-weight="700">
    <rect x="72" y="700" width="150" height="40" rx="8" fill="rgba(255,45,149,0.18)" stroke="#FF2D95" stroke-width="2"/>
    <text x="147" y="726" text-anchor="middle" fill="#FF2D95">ARCADE</text>
    <rect x="238" y="700" width="170" height="40" rx="8" fill="rgba(0,240,255,0.12)" stroke="#00F0FF" stroke-width="2"/>
    <text x="323" y="726" text-anchor="middle" fill="#00F0FF">KINETIC</text>
    <rect x="424" y="700" width="180" height="40" rx="8" fill="rgba(184,255,0,0.12)" stroke="#B8FF00" stroke-width="2"/>
    <text x="514" y="726" text-anchor="middle" fill="#B8FF00">TACTILE</text>
  </g>

  <!-- Score chip -->
  <g>
    <rect x="900" y="88" width="200" height="56" rx="10" fill="rgba(10,6,18,0.85)" stroke="#B8FF00" stroke-width="3"/>
    <text x="1000" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="800" letter-spacing="2" fill="#B8FF00">COMBO x12</text>
  </g>

  <!-- Studio line -->
  <text x="72" y="800" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#C4B5D4">Indie studio · Kinetic arcade worlds · Loud color</text>
</svg>
