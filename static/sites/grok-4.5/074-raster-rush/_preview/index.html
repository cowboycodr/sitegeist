<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>Raster Rush — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0612;
      color: #fff5e6;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(960px, 94vw);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(255, 245, 230, 0.12);
      border-radius: 12px;
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      color: #c4b5d4;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Raster Rush gallery poster">
    <figcaption>Raster Rush — promotional gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
