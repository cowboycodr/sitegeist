<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lumen Clinic — A clearer view of your health">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5f6"/>
      <stop offset="45%" stop-color="#f6f3ed"/>
      <stop offset="100%" stop-color="#e4f0ee"/>
    </linearGradient>
    <linearGradient id="lens" x1="0.25" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#d9eef0"/>
      <stop offset="40%" stop-color="#7eb8c9"/>
      <stop offset="100%" stop-color="#2f6f7d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7eb8c9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f1c24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#1f8a7a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f1c24" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2f6f7d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="160" r="280" fill="#7eb8c9" opacity="0.14"/>
  <circle cx="180" cy="760" r="220" fill="#1f8a7a" opacity="0.1"/>
  <circle cx="640" cy="420" r="340" fill="url(#glow)"/>

  <!-- Decorative rays -->
  <g stroke="#c9a227" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M600 120 v70"/>
    <path d="M600 710 v70"/>
    <path d="M300 450 h70"/>
    <path d="M830 450 h70"/>
    <path d="M390 240 l48 48"/>
    <path d="M762 662 l48 48"/>
    <path d="M390 660 l48 -48"/>
    <path d="M762 238 l48 -48"/>
  </g>

  <!-- Lens motif -->
  <g filter="url(#soft)">
    <circle cx="600" cy="450" r="210" fill="#ffffff" opacity="0.55"/>
    <circle cx="600" cy="450" r="188" fill="url(#lens)"/>
    <circle cx="600" cy="450" r="148" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="600" cy="450" r="96" fill="url(#core)"/>
    <circle cx="560" cy="410" r="34" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- Brand chip -->
  <g transform="translate(78 72)">
    <rect width="250" height="64" rx="32" fill="#ffffff" fill-opacity="0.88" stroke="#0f1c24" stroke-opacity="0.08"/>
    <circle cx="36" cy="32" r="18" fill="#0f1c24"/>
    <circle cx="36" cy="32" r="10" stroke="#7eb8c9" stroke-width="1.5" fill="none"/>
    <circle cx="36" cy="32" r="4.5" fill="#1f8a7a"/>
    <text x="68" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f1c24">Lumen Clinic</text>
  </g>

  <!-- Title block -->
  <text x="78" y="720" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="750" fill="#0f1c24" letter-spacing="-1.5">A clearer view</text>
  <text x="78" y="785" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="750" fill="#1f8a7a" letter-spacing="-1.5">of your health.</text>
  <text x="78" y="835" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#4a6070">Membership diagnostics · Preventive care</text>

  <!-- Small status card -->
  <g transform="translate(860 680)">
    <rect width="260" height="112" rx="20" fill="#ffffff" fill-opacity="0.95" stroke="#0f1c24" stroke-opacity="0.06"/>
    <text x="24" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1c24">Clarity Report</text>
    <text x="24" y="68" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#4a6070">Signals organized.</text>
    <text x="24" y="92" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#14685c" font-weight="600">Guidance, not noise.</text>
  </g>
</svg>
