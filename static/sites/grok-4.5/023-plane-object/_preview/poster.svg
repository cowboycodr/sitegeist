<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Plane Object — Furniture with nothing to hide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3efe7"/>
      <stop offset="55%" stop-color="#ebe4d6"/>
      <stop offset="100%" stop-color="#e0d6c4"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c49a"/>
      <stop offset="100%" stop-color="#b8894f"/>
    </linearGradient>
    <linearGradient id="woodMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b07a"/>
      <stop offset="100%" stop-color="#8a6232"/>
    </linearGradient>
    <linearGradient id="woodLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c09a"/>
      <stop offset="100%" stop-color="#a67840"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c646c"/>
      <stop offset="100%" stop-color="#2c3035"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c56a55" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c56a55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Soft architectural grid motif -->
  <g opacity="0.18" stroke="#8a6232" stroke-width="1">
    <line x1="80" y1="120" x2="80" y2="780"/>
    <line x1="160" y1="120" x2="160" y2="780"/>
    <line x1="1040" y1="120" x2="1040" y2="780"/>
    <line x1="1120" y1="120" x2="1120" y2="780"/>
    <line x1="80" y1="180" x2="1120" y2="180"/>
    <line x1="80" y1="720" x2="1120" y2="720"/>
  </g>

  <!-- Brand mark (stacked planes) -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="52" height="10" rx="1.5" fill="#8a6232"/>
    <rect x="16" y="18" width="52" height="10" rx="1.5" fill="#b8894f"/>
    <rect x="0" y="36" width="52" height="10" rx="1.5" fill="#8a6232"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1a1814" letter-spacing="-0.5">Plane Object</text>
  <text x="180" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3f2d" letter-spacing="3">OBJECTS FOR MODERN ROOMS</text>

  <!-- Hero furniture composition: modular desk + shelf planes -->
  <g transform="translate(200, 230)">
    <!-- Floor shadow -->
    <ellipse cx="400" cy="520" rx="320" ry="28" fill="#1a1814" opacity="0.12"/>

    <!-- Back shelf planes -->
    <g transform="translate(80, 40)">
      <rect x="40" y="20" width="520" height="28" rx="3" fill="url(#woodTop)" transform="rotate(-1.5 300 34)"/>
      <rect x="70" y="90" width="480" height="24" rx="3" fill="url(#woodMid)" transform="rotate(1 310 102)"/>
      <rect x="100" y="155" width="420" height="20" rx="3" fill="url(#woodLow)" transform="rotate(-0.8 310 165)"/>
      <!-- uprights -->
      <rect x="70" y="45" width="16" height="200" rx="2" fill="url(#steel)"/>
      <rect x="530" y="45" width="16" height="200" rx="2" fill="url(#steel)"/>
    </g>

    <!-- Desk plane in front -->
    <g transform="translate(120, 260)">
      <rect x="0" y="0" width="560" height="36" rx="3" fill="url(#woodTop)"/>
      <!-- accent edge strip -->
      <rect x="0" y="-12" width="560" height="12" rx="2" fill="#9a3f2d"/>
      <!-- legs -->
      <rect x="36" y="36" width="22" height="160" rx="2" fill="url(#steel)"/>
      <rect x="502" y="36" width="22" height="160" rx="2" fill="url(#steel)"/>
      <!-- cross brace suggestion -->
      <rect x="70" y="120" width="420" height="10" rx="1" fill="#b8894f" opacity="0.85"/>
    </g>

    <!-- Small bench / block accent -->
    <g transform="translate(40, 380)">
      <rect x="0" y="40" width="150" height="22" rx="2" fill="url(#woodMid)"/>
      <rect x="12" y="62" width="16" height="50" rx="2" fill="url(#steel)"/>
      <rect x="122" y="62" width="16" height="50" rx="2" fill="url(#steel)"/>
      <rect x="18" y="0" width="114" height="40" rx="3" fill="#cfc6b4"/>
    </g>
  </g>

  <!-- Title block -->
  <text x="96" y="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#1a1814" letter-spacing="-1.5">Furniture with</text>
  <text x="96" y="842" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#1a1814" letter-spacing="-1.5">nothing to hide.</text>

  <!-- Right side tag -->
  <g transform="translate(820, 760)">
    <rect x="0" y="0" width="284" height="88" rx="12" fill="#1a1814"/>
    <text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f3efe7">Modular · Flat-pack</text>
    <text x="24" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d8b98a">Honest materials</text>
  </g>
</svg>
