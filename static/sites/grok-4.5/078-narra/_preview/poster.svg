<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Narra — Turn research into a living story">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="55%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4533a"/>
      <stop offset="100%" stop-color="#c4923a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#d4533a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4533a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1f7a72" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1f7a72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft paper panel -->
  <rect x="72" y="78" width="1056" height="744" rx="36" fill="#f6f1e8" opacity="0.04"/>
  <rect x="96" y="102" width="1008" height="696" rx="28" fill="none" stroke="#f6f1e8" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Brand mark -->
  <g transform="translate(130, 160)">
    <circle cx="0" cy="8" r="14" fill="#d4533a"/>
    <circle cx="48" cy="0" r="11" fill="#1f7a72"/>
    <circle cx="42" cy="42" r="14" fill="#d4533a"/>
    <circle cx="6" cy="46" r="10" fill="#c4923a"/>
    <path d="M10 14 L38 5 M38 8 L36 32 M32 38 L14 42 M10 36 L4 18" stroke="#f6f1e8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="210" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="72" font-weight="700" fill="#f6f1e8" letter-spacing="-1.5">Narra</text>
  <text x="130" y="280" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1f7a72" letter-spacing="6">CONTEXT, CONNECTED</text>

  <!-- Tagline -->
  <text x="130" y="360" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="52" fill="#f6f1e8">Turn research into a</text>
  <text x="130" y="430" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="52" font-style="italic" fill="#d4533a">living story.</text>

  <!-- Narrative map motif -->
  <g transform="translate(130, 500)">
    <path d="M20 160 C120 160 140 30 260 40 S420 200 540 150 S700 20 780 40" fill="none" stroke="url(#thread)" stroke-width="6" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="20" cy="160" r="22" fill="#f6f1e8" stroke="#d4533a" stroke-width="5"/>
    <circle cx="260" cy="40" r="26" fill="#d4533a" stroke="#b33f2a" stroke-width="4"/>
    <circle cx="540" cy="150" r="22" fill="#f6f1e8" stroke="#2c3548" stroke-width="4"/>
    <circle cx="780" cy="40" r="28" fill="#1f7a72" stroke="#165c56" stroke-width="4"/>
    <!-- Labels -->
    <text x="20" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#c8c0b2">Setup</text>
    <text x="260" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f6f1e8">Tension</text>
    <text x="540" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#c8c0b2">Evidence</text>
    <text x="780" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f6f1e8">Claim</text>
  </g>

  <!-- Small cards suggestion -->
  <g transform="translate(860, 180)">
    <rect x="0" y="0" width="200" height="90" rx="16" fill="#f6f1e8" opacity="0.92"/>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5c667a" letter-spacing="2">SOURCES</text>
    <text x="20" y="64" font-family="Georgia, serif" font-size="20" fill="#141a24">18 linked</text>
    <rect x="20" y="120" width="200" height="90" rx="16" fill="#f6f1e8" opacity="0.92"/>
    <text x="40" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5c667a" letter-spacing="2">NOTES</text>
    <text x="40" y="184" font-family="Georgia, serif" font-size="20" fill="#141a24">On the map</text>
  </g>

  <!-- Footer line -->
  <text x="130" y="780" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" fill="#8a93a3">Knowledge Technology · Narrative maps for research teams</text>
</svg>
