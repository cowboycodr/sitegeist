<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Margin Quarterly — Poster preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1c1915;
      font-family: Georgia, serif;
      color: #f3eee4;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #3d3830;
    }
    figcaption {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Margin Quarterly gallery poster">
    <figcaption>Gallery poster · 4:3 · preview/poster.svg</figcaption>
  </figure>
</body>
</html>
