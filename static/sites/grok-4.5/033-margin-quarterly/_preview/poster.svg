<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Margin Quarterly — Ideas worth leaving room for.">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="55%" stop-color="#efe6d6"/>
      <stop offset="100%" stop-color="#e5d9c6"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1915" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c1915" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Paper ground -->
  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect width="1200" height="900" fill="url(#inkFade)"/>

  <!-- Outer margin frame -->
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#cfc4b4" stroke-width="1"/>
  <rect x="64" y="64" width="1072" height="772" fill="none" stroke="#1c1915" stroke-width="1.25" opacity="0.18"/>

  <!-- Left margin bar (signature motif) -->
  <rect x="96" y="120" width="8" height="660" fill="#9c4030"/>
  <rect x="112" y="120" width="1" height="660" fill="#c4a882" opacity="0.7"/>

  <!-- Small corner annotation marks -->
  <g fill="none" stroke="#6b645a" stroke-width="1" opacity="0.55">
    <path d="M96 120h28M96 120v28"/>
    <path d="M1104 120h-28M1104 120v28"/>
    <path d="M96 780h28M96 780v-28"/>
    <path d="M1104 780h-28M1104 780v-28"/>
  </g>

  <!-- Volume label -->
  <text x="160" y="168" fill="#9c4030" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6">ISSUE 18 · SPRING 2026</text>

  <!-- Wordmark -->
  <text x="160" y="320" fill="#1c1915" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="600" letter-spacing="-3">Margin</text>
  <text x="168" y="372" fill="#6b645a" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" letter-spacing="10" font-weight="500">QUARTERLY</text>

  <!-- Horizontal rule as "margin line" -->
  <line x1="160" y1="420" x2="520" y2="420" stroke="#cfc4b4" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="160" y="490" fill="#1c1915" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic">Ideas worth leaving room for.</text>

  <!-- Theme block -->
  <text x="160" y="580" fill="#3d3830" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" letter-spacing="4">THE DISTANCE BETWEEN</text>
  <text x="160" y="620" fill="#6b645a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Cultural criticism · Generous type · Collectible editions</text>

  <!-- Right-side book plate motif -->
  <g transform="translate(760, 200)">
    <rect x="0" y="0" width="260" height="360" fill="#1c1915"/>
    <rect x="16" y="16" width="228" height="328" fill="none" stroke="#c4a882" stroke-width="1" opacity="0.55"/>
    <text x="36" y="70" fill="#c4a882" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" letter-spacing="3">VOL. V · NO. 18</text>
    <text x="36" y="150" fill="#f3eee4" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600">Margin</text>
    <text x="36" y="200" fill="#e8dcc8" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">The distance</text>
    <text x="36" y="230" fill="#e8dcc8" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">between</text>
    <circle cx="200" cy="300" r="22" fill="none" stroke="#9c4030" stroke-width="1.5"/>
    <text x="36" y="320" fill="#c4a882" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" letter-spacing="2">№ 0184 / 3200</text>
  </g>

  <!-- Bottom colophon -->
  <text x="160" y="740" fill="#6b645a" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" letter-spacing="3">LONGFORM JOURNAL · PRINTED FOR PATIENT READERS</text>
</svg>
