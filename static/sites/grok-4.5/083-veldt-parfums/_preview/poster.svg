<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Veldt Parfums — Landscapes, bottled.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8aa94"/>
      <stop offset="40%" stop-color="#e0d4c0"/>
      <stop offset="72%" stop-color="#c9b896"/>
      <stop offset="100%" stop-color="#8a7355"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5740"/>
      <stop offset="100%" stop-color="#3d3226"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#4a433c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5c544c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6a6258" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Distant hills -->
  <path d="M0 420 Q180 360 360 400 T720 380 T1200 410 L1200 520 L0 520 Z" fill="#9a8a72" opacity="0.55"/>
  <path d="M0 460 Q250 410 500 455 T1000 440 T1200 470 L1200 560 L0 560 Z" fill="#7a6a52" opacity="0.5"/>

  <!-- Soft smoke plume -->
  <ellipse cx="920" cy="280" rx="140" ry="48" fill="url(#smoke)"/>
  <ellipse cx="980" cy="240" rx="100" ry="36" fill="#6a6258" opacity="0.18"/>
  <ellipse cx="860" cy="250" rx="70" ry="28" fill="#5c544c" opacity="0.12"/>

  <!-- Rain strokes (mineral) -->
  <g stroke="#d0d8dc" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <line x1="180" y1="120" x2="195" y2="200"/>
    <line x1="240" y1="100" x2="258" y2="190"/>
    <line x1="300" y1="130" x2="315" y2="210"/>
    <line x1="360" y1="90" x2="378" y2="185"/>
    <line x1="420" y1="115" x2="434" y2="195"/>
  </g>

  <!-- Grassland field -->
  <path d="M0 500 Q300 470 600 510 T1200 490 L1200 900 L0 900 Z" fill="url(#field)"/>

  <!-- Grass stems -->
  <g stroke="#2c241c" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M60 620 Q75 540 65 470"/>
    <path d="M110 640 Q130 550 115 480"/>
    <path d="M170 610 Q185 530 178 460"/>
    <path d="M230 650 Q250 555 235 490"/>
    <path d="M300 630 Q318 545 308 475"/>
    <path d="M380 660 Q400 560 385 500"/>
    <path d="M460 640 Q478 555 470 485"/>
    <path d="M540 670 Q560 580 548 510"/>
    <path d="M640 650 Q658 565 650 495"/>
    <path d="M740 665 Q760 575 748 505"/>
    <path d="M840 645 Q858 560 850 490"/>
    <path d="M940 660 Q960 570 948 500"/>
    <path d="M1040 640 Q1058 555 1050 485"/>
    <path d="M1120 655 Q1140 570 1128 500"/>
  </g>
  <g stroke="#4a3c2a" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M90 700 Q100 640 95 590"/>
    <path d="M200 720 Q215 650 205 600"/>
    <path d="M340 710 Q355 645 348 595"/>
    <path d="M500 730 Q515 660 508 610"/>
    <path d="M700 715 Q715 650 708 600"/>
    <path d="M880 725 Q895 655 888 605"/>
    <path d="M1080 710 Q1095 645 1088 595"/>
  </g>

  <!-- Bottle silhouette -->
  <g transform="translate(540 280)">
    <rect x="42" y="0" width="36" height="14" rx="1" fill="#2c2824"/>
    <rect x="48" y="14" width="24" height="10" fill="#3d3832"/>
    <path d="M30 24 L90 24 L86 150 Q60 168 34 150 Z" fill="#f0e8da" stroke="#c4b8a4" stroke-width="1.5"/>
    <line x1="40" y1="55" x2="80" y2="55" stroke="#a89880" stroke-width="1"/>
    <text x="60" y="78" text-anchor="middle" fill="#5a5044" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">VELDT</text>
    <text x="60" y="94" text-anchor="middle" fill="#7a7064" font-family="Georgia, 'Times New Roman', serif" font-size="8" letter-spacing="2">No. 06</text>
  </g>

  <!-- Brand panel -->
  <rect x="0" y="0" width="1200" height="8" fill="#1e1b17"/>
  <rect x="0" y="892" width="1200" height="8" fill="#1e1b17"/>

  <text x="600" y="780" text-anchor="middle" fill="#f4efe6" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="8">VELDT PARFUMS</text>
  <text x="600" y="830" text-anchor="middle" fill="#d4c8b0" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" letter-spacing="2">Landscapes, bottled.</text>
</svg>
