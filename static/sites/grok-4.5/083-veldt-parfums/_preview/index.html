<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Veldt Parfums — Gallery Poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1e1b17;
      font-family: system-ui, sans-serif;
      color: #d4c8b0;
    }
    figure {
      margin: 0;
      width: min(96vw, 900px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(212, 200, 176, 0.2);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Veldt Parfums gallery poster: grassland horizon with bottle and tagline Landscapes, bottled.">
    <figcaption>Preview poster · 4:3 · static SVG</figcaption>
  </figure>
</body>
</html>
