<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Form Haus — Space, reduced to its essence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e2d6"/>
      <stop offset="55%" stop-color="#f6f2ea"/>
      <stop offset="100%" stop-color="#d4cdc0"/>
    </linearGradient>
    <linearGradient id="mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2822"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1a1814" stroke-width="1" opacity="0.06">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="820" x2="1200" y2="820"/>
  </g>

  <!-- Outer frame -->
  <rect x="80" y="80" width="1040" height="740" fill="none" stroke="#1a1814" stroke-width="1.25" opacity="0.22"/>

  <!-- Architectural composition: monumental reduced forms -->
  <g>
    <!-- Tall dark mass -->
    <rect x="220" y="220" width="280" height="480" fill="url(#mass)"/>
    <!-- Copper volume -->
    <rect x="520" y="320" width="180" height="380" fill="#9a6b45"/>
    <!-- Pale stone volume -->
    <rect x="720" y="280" width="200" height="420" fill="#fbf8f3"/>
    <!-- Window slits on dark mass -->
    <rect x="260" y="280" width="60" height="90" fill="#e8e2d6" opacity="0.18"/>
    <rect x="350" y="280" width="60" height="90" fill="#e8e2d6" opacity="0.12"/>
    <rect x="260" y="400" width="60" height="90" fill="#e8e2d6" opacity="0.12"/>
    <rect x="350" y="400" width="60" height="90" fill="#e8e2d6" opacity="0.18"/>
    <rect x="260" y="520" width="60" height="70" fill="#e8e2d6" opacity="0.1"/>
    <rect x="350" y="520" width="60" height="70" fill="#e8e2d6" opacity="0.15"/>
    <!-- Copper slit windows -->
    <rect x="560" y="380" width="40" height="240" fill="#1a1814" opacity="0.28"/>
    <rect x="620" y="420" width="32" height="200" fill="#1a1814" opacity="0.18"/>
    <!-- Pale volume details -->
    <rect x="760" y="340" width="50" height="80" fill="#1a1814" opacity="0.1"/>
    <rect x="830" y="340" width="50" height="80" fill="#1a1814" opacity="0.14"/>
    <rect x="760" y="450" width="120" height="10" fill="#9a6b45" opacity="0.7"/>
    <rect x="760" y="490" width="90" height="6" fill="#1a1814" opacity="0.12"/>
    <!-- Ground plane -->
    <rect x="180" y="700" width="780" height="1.5" fill="#1a1814" opacity="0.35"/>
    <rect x="180" y="720" width="420" height="1" fill="#1a1814" opacity="0.15"/>
    <!-- Accent circle / sun -->
    <circle cx="900" cy="200" r="42" fill="none" stroke="#9a6b45" stroke-width="1.5" opacity="0.75"/>
    <circle cx="900" cy="200" r="6" fill="#9a6b45" opacity="0.85"/>
  </g>

  <!-- Typography -->
  <text x="220" y="175" fill="#9a6b45" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" letter-spacing="6">ARCHITECTURE · COPENHAGEN</text>

  <text x="220" y="790" fill="#1a1814" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="72" font-weight="400" letter-spacing="-1.5">Form Haus</text>

  <text x="620" y="785" fill="#3d3a34" font-family="Georgia, 'Iowan Old Style', Palatino, serif" font-size="26" font-style="italic">Space, reduced to its essence.</text>
</svg>
