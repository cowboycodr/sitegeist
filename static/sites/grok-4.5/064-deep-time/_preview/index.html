<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Deep Time — Gallery Poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e1218;
      color: #e8e4d9;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 1rem;
      max-width: min(960px, 100%);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      color: #a39e8f;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" width="1200" height="900" alt="Deep Time gallery poster: Four billion years, still unfolding.">
    <figcaption>Preview poster · 4:3 · Deep Time</figcaption>
  </figure>
</body>
</html>
