<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Deep Time — Four billion years, still unfolding.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120c"/>
      <stop offset="35%" stop-color="#152018"/>
      <stop offset="65%" stop-color="#121a24"/>
      <stop offset="100%" stop-color="#0e1218"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stratum1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <linearGradient id="stratum2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2a1e"/>
      <stop offset="100%" stop-color="#142018"/>
    </linearGradient>
    <linearGradient id="stratum3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2838"/>
      <stop offset="100%" stop-color="#121c28"/>
    </linearGradient>
    <linearGradient id="stratum4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#e8d5a3" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#c9a227" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0e1218" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#core)"/>

  <!-- Geological strata bands -->
  <path d="M0 520 L1200 480 L1200 560 L0 600 Z" fill="url(#stratum1)" opacity="0.9"/>
  <path d="M0 590 L1200 555 L1200 640 L0 680 Z" fill="url(#stratum2)" opacity="0.95"/>
  <path d="M0 665 L1200 630 L1200 720 L0 760 Z" fill="url(#stratum3)"/>
  <path d="M0 740 L1200 710 L1200 900 L0 900 Z" fill="url(#stratum4)"/>

  <!-- Stratum edge highlights -->
  <path d="M0 520 L1200 480" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.35"/>
  <path d="M0 590 L1200 555" fill="none" stroke="#3d8b7a" stroke-width="1.5" opacity="0.4"/>
  <path d="M0 665 L1200 630" fill="none" stroke="#4a7c9b" stroke-width="1.5" opacity="0.35"/>
  <path d="M0 740 L1200 710" fill="none" stroke="#8b7355" stroke-width="1.5" opacity="0.3"/>

  <!-- Concentric deep-time rings (motif) -->
  <g transform="translate(900 280)" fill="none" stroke="#c9a227">
    <circle r="200" stroke-width="1.2" opacity="0.2"/>
    <circle r="155" stroke-width="1.4" opacity="0.3"/>
    <circle r="110" stroke-width="1.6" opacity="0.45"/>
    <circle r="70" stroke-width="1.8" opacity="0.55"/>
    <circle r="35" stroke-width="2" opacity="0.7"/>
    <!-- Spiral path through rings -->
    <path d="M0 -200 Q90 -90 0 0 Q-70 70 0 155 Q55 185 0 200" stroke="#e8d5a3" stroke-width="2.2" opacity="0.75"/>
    <circle r="8" fill="#c9a227" stroke="none" opacity="0.85"/>
  </g>

  <!-- Subtle fossil ammonite silhouette, left -->
  <g transform="translate(220 620)" opacity="0.22" fill="none" stroke="#e8d5a3" stroke-width="2">
    <circle r="70"/>
    <circle r="48"/>
    <circle r="28"/>
    <path d="M0 -70 Q40 -20 0 0 Q-28 20 0 48 Q18 58 0 70"/>
  </g>

  <!-- Category label -->
  <text x="96" y="168" fill="#c9a227" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="22" letter-spacing="6" font-weight="600">NATURAL HISTORY</text>

  <!-- Title -->
  <text x="96" y="280" fill="#e8e4d9" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="108" font-weight="600" letter-spacing="-2">Deep Time</text>

  <!-- Tagline -->
  <text x="96" y="360" fill="#e8d5a3" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="36" font-style="italic">Four billion years, still unfolding.</text>

  <!-- Divider -->
  <rect x="96" y="400" width="120" height="3" rx="1.5" fill="#c9a227" opacity="0.8"/>

  <!-- Description line -->
  <text x="96" y="450" fill="#a39e8f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22">Fossils · Climates · Extinction</text>

  <!-- Bottom caption on strata -->
  <text x="96" y="830" fill="#6e6a60" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" letter-spacing="3">AN ATLAS OF EARTH</text>
  <text x="1104" y="830" fill="#6e6a60" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" text-anchor="end">4.6 Ga → now</text>
</svg>
