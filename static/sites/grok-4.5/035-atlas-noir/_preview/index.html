<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Atlas Noir — Poster Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0b0d;
      color: #e8e2d6;
      font-family: system-ui, sans-serif;
    }
    figure {
      margin: 0;
      width: min(96vw, 960px);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(201, 164, 92, 0.3);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: #9a9488;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Atlas Noir gallery poster: Go where the map ends." width="1200" height="900">
    <figcaption>Atlas Noir — gallery poster</figcaption>
  </figure>
</body>
</html>
