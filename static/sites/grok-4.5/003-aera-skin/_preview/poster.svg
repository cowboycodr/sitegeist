<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Aera Skin — Your skin, in a softer light.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf8f4"/>
      <stop offset="42%" stop-color="#f3ebe3"/>
      <stop offset="100%" stop-color="#e4d0c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#fffcf9" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e4d0c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a89e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="28%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#d4ddd6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4ddd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="40%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#fffcf9"/>
      <stop offset="55%" stop-color="#e4d0c8"/>
      <stop offset="100%" stop-color="#c9a89e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Soft frame -->
  <rect x="48" y="48" width="1104" height="804" rx="28" fill="none" stroke="#c9a89e" stroke-width="1.25" opacity="0.55"/>
  <rect x="64" y="64" width="1072" height="772" rx="20" fill="none" stroke="#8f7369" stroke-width="0.75" opacity="0.2"/>

  <!-- Brand mark (left cluster) -->
  <g transform="translate(160, 200)">
    <circle cx="90" cy="90" r="88" fill="none" stroke="#8f7369" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="90" cy="90" rx="48" ry="78" fill="none" stroke="#7d8f80" stroke-width="1.35" opacity="0.65" transform="rotate(28 90 90)"/>
    <ellipse cx="90" cy="90" rx="28" ry="46" fill="url(#orb)" opacity="0.85"/>
    <circle cx="90" cy="90" r="14" fill="#fffcf9" opacity="0.9"/>
    <circle cx="58" cy="48" r="5" fill="#fffcf9" opacity="0.65"/>
    <circle cx="128" cy="62" r="3.5" fill="#fffcf9" opacity="0.5"/>
  </g>

  <!-- Large soft light motif (right) -->
  <g transform="translate(720, 180)" opacity="0.9">
    <ellipse cx="160" cy="200" rx="170" ry="210" fill="#fffcf9" opacity="0.35"/>
    <ellipse cx="160" cy="200" rx="110" ry="150" fill="none" stroke="#8f7369" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="160" cy="200" rx="72" ry="105" fill="none" stroke="#7d8f80" stroke-width="1.1" opacity="0.45"/>
    <ellipse cx="160" cy="200" rx="40" ry="60" fill="#e4d0c8" opacity="0.45"/>
    <circle cx="160" cy="200" r="16" fill="#fffcf9" opacity="0.85"/>
  </g>

  <!-- Typography -->
  <text x="160" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="8" fill="#7d8f80" font-weight="500">BARRIER-FIRST SKINCARE</text>
  <text x="160" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#2a221f" font-weight="500">Aera Skin</text>
  <text x="160" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#5c4a43" font-style="italic">Your skin, in a softer light.</text>

  <!-- Accent line -->
  <line x1="160" y1="700" x2="320" y2="700" stroke="#c9a89e" stroke-width="2"/>

  <text x="160" y="760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8f7369" letter-spacing="1.5">Clinical clarity · Tactile ritual · Quiet luxury</text>
</svg>
