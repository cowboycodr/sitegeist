<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Lumen Quantum</title>
  <desc id="description">Computing beyond certainty. A gallery poster for a quantum systems laboratory.</desc>
  <defs>
    <radialGradient id="field" cx="78%" cy="46%" r="46%">
      <stop offset="0" stop-color="#0e5a46" stop-opacity=".72" />
      <stop offset=".48" stop-color="#093126" stop-opacity=".4" />
      <stop offset="1" stop-color="#06110f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#06110f" stop-opacity=".98" />
      <stop offset=".42" stop-color="#06110f" stop-opacity=".83" />
      <stop offset=".82" stop-color="#06110f" stop-opacity=".04" />
    </linearGradient>
    <pattern id="grid" width="67" height="67" patternUnits="userSpaceOnUse">
      <path d="M67 0H0V67" fill="none" stroke="#eef0e8" stroke-opacity=".035" />
    </pattern>
    <filter id="glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="11" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: "Courier New", Courier, monospace; letter-spacing: 3px; }
      .hairline { fill: none; stroke-width: 2; }
      .label { fill: #eef0e8; fill-opacity: .49; font-size: 13px; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#06110f" />
  <rect width="1600" height="1200" fill="url(#field)" />
  <rect width="1600" height="1200" fill="url(#grid)" />

  <g opacity=".94">
    <path d="M840 760 1610 342" stroke="#65edc6" stroke-opacity=".17" stroke-width="2" />
    <path d="m1110 110 270 950" stroke="#65edc6" stroke-opacity=".13" stroke-width="2" />
    <ellipse cx="1290" cy="565" rx="385" ry="195" class="hairline" stroke="#65edc6" stroke-opacity=".48" transform="rotate(19 1290 565)" />
    <ellipse cx="1290" cy="565" rx="345" ry="146" class="hairline" stroke="#65edc6" stroke-opacity=".4" transform="rotate(72 1290 565)" />
    <ellipse cx="1290" cy="565" rx="230" ry="160" class="hairline" stroke="#c8ff4d" stroke-opacity=".25" transform="rotate(-31 1290 565)" />
    <g fill="#c8ff4d" filter="url(#glow)">
      <circle cx="1142" cy="328" r="4" /><circle cx="1500" cy="444" r="4" />
      <circle cx="1062" cy="745" r="4" /><circle cx="1410" cy="812" r="4" />
    </g>
    <circle cx="1290" cy="565" r="7" fill="#65edc6" filter="url(#glow)" />
  </g>
  <rect width="1600" height="1200" fill="url(#shade)" />

  <g class="sans">
    <path d="M68 139h1464M68 1048h1464" stroke="#eef0e8" stroke-opacity=".14" />

    <g transform="translate(89 91)">
      <circle r="19" fill="none" stroke="#eef0e8" stroke-opacity=".8" stroke-width="2" />
      <ellipse rx="18" ry="7" fill="none" stroke="#c8ff4d" stroke-width="2" transform="rotate(48)" />
      <ellipse rx="18" ry="7" fill="none" stroke="#c8ff4d" stroke-opacity=".9" stroke-width="2" transform="rotate(-42)" />
      <circle r="3" fill="#c8ff4d" />
    </g>
    <text x="126" y="100" fill="#c8ff4d" font-size="25">Lumen</text>
    <text x="203" y="100" fill="#eef0e8" font-size="24">Quantum</text>

    <g class="mono" font-size="13" fill="#eef0e8" fill-opacity=".64">
      <text x="1263" y="96">QUANTUM SYSTEMS</text>
      <path d="M1424 91h49" stroke="#c8ff4d" stroke-width="2" />
      <text x="1490" y="96">2026</text>
      <text x="68" y="239" fill-opacity=".58">LQ / COMPUTE BEYOND CERTAINTY</text>
    </g>

    <text x="68" y="477" fill="#eef0e8" font-size="170" font-weight="400" letter-spacing="-10">Computing</text>
    <text x="188" y="639" fill="#eef0e8" font-size="170" font-weight="400" letter-spacing="-10">beyond</text>
    <text x="754" y="646" fill="#c8ff4d" font-family="Georgia, 'Times New Roman', serif" font-size="154" font-style="italic" letter-spacing="-7">certainty.</text>

    <text x="646" y="764" fill="#eef0e8" fill-opacity=".68" font-size="24">
      <tspan x="646" dy="0">Probabilistic research, engineered into practical</tspan>
      <tspan x="646" dy="36">infrastructure.</tspan>
    </text>

    <g class="mono">
      <text x="68" y="1092" class="label">ACTIVE QUBITS</text>
      <text x="68" y="1138" fill="#eef0e8" font-size="22" letter-spacing="1">128</text>
      <text x="292" y="1092" class="label">MEDIAN FIDELITY</text>
      <text x="292" y="1138" fill="#eef0e8" font-size="22" letter-spacing="1">99.97%</text>
      <text x="582" y="1092" class="label">CURRENT RUN</text>
      <text x="582" y="1138" fill="#c8ff4d" font-size="22" letter-spacing="1">LQ–SABLE / 0421</text>
      <text x="1334" y="1117" fill="#eef0e8" fill-opacity=".66" font-size="13">ENTER THE LAB</text>
    </g>
    <circle cx="1527" cy="1112" r="28" fill="#c8ff4d" />
    <text x="1527" y="1121" text-anchor="middle" fill="#06110f" font-size="28">↘</text>
  </g>
</svg>
