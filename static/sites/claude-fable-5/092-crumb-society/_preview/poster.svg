<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
	<title id="poster-title">Crumb Society — Loud pastry. Quiet mornings.</title>
	<rect width="1200" height="900" fill="#f6eedf"/>
	<rect x="30" y="30" width="1140" height="840" fill="none" stroke="#2a1b12" stroke-width="6"/>

	<!-- eyebrow pill -->
	<rect x="90" y="96" width="316" height="60" rx="30" fill="#f2c14e" stroke="#2a1b12" stroke-width="4"/>
	<circle cx="130" cy="126" r="9" fill="#c33b2a"/>
	<text x="152" y="137" font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="3" fill="#2a1b12">FRESH FROM 7:00</text>

	<!-- wordmark -->
	<text x="88" y="300" font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif" font-size="150" font-weight="800" letter-spacing="-2" fill="#2a1b12">CRUMB</text>
	<text x="88" y="440" font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif" font-size="150" font-weight="800" letter-spacing="-2" fill="#c33b2a">SOCIETY</text>

	<!-- tagline -->
	<text x="90" y="512" font-family="Georgia,'Times New Roman',serif" font-size="40" font-style="italic" fill="#8a5a2b">Loud pastry. Quiet mornings.</text>

	<!-- croissant motif -->
	<g transform="translate(770,150)">
		<path d="M40 190 C-10 160 0 90 60 60 L190 0 C230 -20 270 -20 310 0 L440 60 C500 90 510 160 460 190 C430 210 390 200 360 180 C320 210 280 220 250 220 C220 220 180 210 140 180 C110 200 70 210 40 190 Z"
			fill="#e8a33d" stroke="#2a1b12" stroke-width="10"/>
		<path d="M160 30 L190 200 M250 12 L250 210 M340 30 L310 200"
			fill="none" stroke="#2a1b12" stroke-width="10" stroke-linecap="round"/>
		<!-- crumbs -->
		<circle cx="20" cy="260" r="9" fill="#8a5a2b"/>
		<circle cx="120" cy="280" r="6" fill="#c33b2a"/>
		<circle cx="330" cy="270" r="8" fill="#8a5a2b"/>
		<circle cx="470" cy="245" r="6" fill="#c33b2a"/>
	</g>

	<!-- ticker band -->
	<rect x="30" y="580" width="1140" height="78" fill="#f2c14e" stroke="#2a1b12" stroke-width="6"/>
	<text x="600" y="632" text-anchor="middle" font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#2a1b12">MILLED TUESDAY · LAMINATED OVERNIGHT · BAKED AT 5 · DOORS AT 7</text>

	<!-- pastry cards row -->
	<g stroke="#2a1b12" stroke-width="6">
		<rect x="90" y="700" width="230" height="120" rx="16" fill="#fdf8ec"/>
		<rect x="356" y="700" width="230" height="120" rx="16" fill="#fdf8ec"/>
		<rect x="622" y="700" width="230" height="120" rx="16" fill="#fdf8ec"/>
		<rect x="888" y="700" width="222" height="120" rx="16" fill="#c33b2a"/>
	</g>
	<!-- danish -->
	<rect x="140" y="730" width="130" height="60" rx="12" fill="#f2c14e" stroke="#2a1b12" stroke-width="6"/>
	<circle cx="205" cy="760" r="18" fill="#c33b2a" stroke="#2a1b12" stroke-width="6"/>
	<!-- canelé -->
	<path d="M420 800 C410 760 425 728 471 728 C517 728 532 760 522 800 Z" fill="#8a5a2b" stroke="#2a1b12" stroke-width="6"/>
	<!-- morning bun -->
	<circle cx="737" cy="762" r="34" fill="#c98a4b" stroke="#2a1b12" stroke-width="6"/>
	<path d="M737 762 m-20 0 a20 20 0 0 1 40 0 a14 14 0 0 1 -28 0 a8 8 0 0 1 16 0" fill="none" stroke="#2a1b12" stroke-width="6" stroke-linecap="round"/>
	<!-- category tag -->
	<text x="999" y="750" text-anchor="middle" font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="3" fill="#f6eedf">BAKERY</text>
	<text x="999" y="792" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-style="italic" fill="#f6eedf">Gone by noon.</text>
</svg>
