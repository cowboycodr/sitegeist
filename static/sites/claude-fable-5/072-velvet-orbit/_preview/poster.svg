<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Velvet Orbit — Collection 04 Aphelion. Dress for another gravity.</title>
  <defs>
    <radialGradient id="p-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2148"/>
      <stop offset="55%" stop-color="#161129"/>
      <stop offset="100%" stop-color="#0e0b1c"/>
    </radialGradient>
    <linearGradient id="p-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f2fb"/>
      <stop offset="30%" stop-color="#9a92c4"/>
      <stop offset="55%" stop-color="#efeafd"/>
      <stop offset="78%" stop-color="#6b6096"/>
      <stop offset="100%" stop-color="#d8d2f0"/>
    </linearGradient>
    <linearGradient id="p-gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6e0f8"/>
      <stop offset="55%" stop-color="#8f86bb"/>
      <stop offset="100%" stop-color="#3a3060"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#p-glow)"/>

  <!-- star field -->
  <g fill="#cfc8ec">
    <circle cx="150" cy="140" r="2.4" opacity="0.8"/>
    <circle cx="1050" cy="180" r="2" opacity="0.7"/>
    <circle cx="960" cy="640" r="1.8" opacity="0.6"/>
    <circle cx="230" cy="620" r="1.6" opacity="0.55"/>
    <circle cx="620" cy="110" r="1.6" opacity="0.6"/>
    <circle cx="380" cy="250" r="1.4" opacity="0.5"/>
    <circle cx="860" cy="320" r="1.4" opacity="0.5"/>
  </g>

  <!-- orbit rings around the figure -->
  <g fill="none" stroke="url(#p-chrome)">
    <ellipse cx="600" cy="470" rx="470" ry="140" stroke-width="2.4" opacity="0.85" transform="rotate(-14 600 470)"/>
    <ellipse cx="600" cy="470" rx="360" ry="104" stroke-width="1.6" opacity="0.55" transform="rotate(-14 600 470)"/>
    <ellipse cx="600" cy="470" rx="560" ry="172" stroke-width="1.2" opacity="0.3" transform="rotate(-14 600 470)"/>
  </g>
  <circle cx="1010" cy="358" r="9" fill="#f4f2fb"/>

  <!-- gown silhouette -->
  <path d="M600 300 C576 300 566 322 566 344 L558 420 C520 508 486 600 500 700 C560 726 640 726 700 700 C714 600 680 508 642 420 L634 344 C634 322 624 300 600 300 Z" fill="url(#p-gown)"/>
  <path d="M558 420 C586 446 614 446 642 420" fill="none" stroke="#f4f2fb" stroke-width="3" opacity="0.75"/>
  <circle cx="600" cy="278" r="17" fill="#0e0b1c" stroke="#b0a6da" stroke-width="3"/>

  <!-- title block -->
  <text x="600" y="150" text-anchor="middle" fill="#9a8fc9" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="12">COLLECTION 04 / APHELION</text>
  <text x="600" y="228" text-anchor="middle" fill="#f4f2fb" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="16">VELVET ORBIT</text>

  <line x1="440" y1="782" x2="760" y2="782" stroke="#3f3766" stroke-width="1.5"/>
  <text x="600" y="830" text-anchor="middle" fill="#d8d2f0" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">Dress for another gravity.</text>
</svg>
