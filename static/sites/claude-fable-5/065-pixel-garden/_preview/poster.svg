<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Pixel Garden — Small worlds. Strange rules.">
  <rect width="1200" height="900" fill="#0b1120"/>
  <!-- pixel scene, 12.5px units -->
  <g shape-rendering="crispEdges">
    <!-- stars -->
    <rect x="100" y="80" width="12" height="12" fill="#8fb7ff"/>
    <rect x="280" y="140" width="12" height="12" fill="#f3e9d2"/>
    <rect x="480" y="60" width="12" height="12" fill="#8fb7ff"/>
    <rect x="700" y="110" width="12" height="12" fill="#f3e9d2"/>
    <rect x="1060" y="150" width="12" height="12" fill="#8fb7ff"/>
    <rect x="180" y="220" width="12" height="12" fill="#3d5580"/>
    <rect x="820" y="200" width="12" height="12" fill="#3d5580"/>
    <rect x="380" y="180" width="12" height="12" fill="#3d5580"/>
    <!-- moon -->
    <rect x="920" y="70" width="120" height="120" fill="#ffd166"/>
    <rect x="920" y="70" width="30" height="30" fill="#0b1120"/>
    <rect x="1010" y="70" width="30" height="30" fill="#0b1120"/>
    <rect x="920" y="160" width="30" height="30" fill="#0b1120"/>
    <rect x="1010" y="160" width="30" height="30" fill="#0b1120"/>
    <rect x="950" y="100" width="30" height="15" fill="#e0a94a"/>
    <!-- hills -->
    <rect x="0" y="560" width="1200" height="340" fill="#16223a"/>
    <rect x="0" y="610" width="520" height="290" fill="#1b2c48"/>
    <rect x="700" y="590" width="500" height="310" fill="#1b2c48"/>
    <!-- soil -->
    <rect x="0" y="730" width="1200" height="170" fill="#3a2a1e"/>
    <rect x="0" y="730" width="1200" height="22" fill="#5a3d2b"/>
    <!-- big blossom plant, right side -->
    <rect x="880" y="420" width="36" height="310" fill="#2f7a46"/>
    <rect x="916" y="470" width="80" height="36" fill="#3f9d5a"/>
    <rect x="996" y="470" width="36" height="36" fill="#7ee08a"/>
    <rect x="800" y="540" width="80" height="36" fill="#3f9d5a"/>
    <rect x="764" y="540" width="36" height="36" fill="#7ee08a"/>
    <rect x="844" y="340" width="108" height="80" fill="#ff8fab"/>
    <rect x="880" y="300" width="36" height="40" fill="#ffd166"/>
    <rect x="880" y="380" width="36" height="40" fill="#d95f80"/>
    <!-- sprouts along soil -->
    <rect x="150" y="640" width="24" height="90" fill="#3f9d5a"/>
    <rect x="126" y="616" width="24" height="24" fill="#ffd166"/>
    <rect x="174" y="600" width="24" height="24" fill="#7ee08a"/>
    <rect x="360" y="660" width="24" height="70" fill="#3f9d5a"/>
    <rect x="360" y="612" width="24" height="48" fill="#ff8fab"/>
    <rect x="560" y="650" width="24" height="80" fill="#3f9d5a"/>
    <rect x="536" y="626" width="24" height="24" fill="#7ee08a"/>
    <rect x="584" y="610" width="24" height="24" fill="#7ee08a"/>
    <!-- moonshroom -->
    <rect x="680" y="670" width="24" height="60" fill="#e8eefb"/>
    <rect x="656" y="630" width="72" height="40" fill="#8fb7ff"/>
    <rect x="668" y="642" width="12" height="12" fill="#e8eefb"/>
    <rect x="704" y="642" width="12" height="12" fill="#e8eefb"/>
    <!-- little creature -->
    <rect x="1060" y="656" width="72" height="48" fill="#8fb7ff"/>
    <rect x="1072" y="632" width="48" height="24" fill="#8fb7ff"/>
    <rect x="1084" y="644" width="12" height="12" fill="#0b1120"/>
    <rect x="1108" y="644" width="12" height="12" fill="#0b1120"/>
    <rect x="1060" y="704" width="12" height="24" fill="#6d93d8"/>
    <rect x="1120" y="704" width="12" height="24" fill="#6d93d8"/>
    <!-- fireflies -->
    <rect x="520" y="440" width="10" height="10" fill="#ffd166"/>
    <rect x="640" y="380" width="10" height="10" fill="#ffd166"/>
    <rect x="300" y="480" width="10" height="10" fill="#ffd166"/>
    <!-- frame -->
    <rect x="0" y="0" width="1200" height="16" fill="#26365a"/>
    <rect x="0" y="884" width="1200" height="16" fill="#26365a"/>
    <rect x="0" y="0" width="16" height="900" fill="#26365a"/>
    <rect x="1184" y="0" width="16" height="900" fill="#26365a"/>
  </g>
  <!-- title block -->
  <g font-family="'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="start">
    <text x="90" y="330" font-size="34" letter-spacing="10" fill="#ffd166" font-weight="700">INDEPENDENT GAME STUDIO</text>
    <text x="86" y="446" font-size="128" font-weight="700" letter-spacing="6" fill="#1e4d2e">PIXEL</text>
    <text x="80" y="440" font-size="128" font-weight="700" letter-spacing="6" fill="#7ee08a">PIXEL</text>
    <text x="86" y="576" font-size="128" font-weight="700" letter-spacing="6" fill="#1e4d2e">GARDEN</text>
    <text x="80" y="570" font-size="128" font-weight="700" letter-spacing="6" fill="#7ee08a">GARDEN</text>
    <text x="84" y="650" font-size="44" font-weight="700" fill="#ff8fab">Small worlds. Strange rules.</text>
  </g>
  <g font-family="'Cascadia Mono', Menlo, Consolas, monospace">
    <text x="600" y="836" font-size="26" letter-spacing="4" fill="#9fb0cf" text-anchor="middle">MOTH LANTERN &#183; ROOT CELLAR &#183; RAIN TAPE</text>
  </g>
</svg>
