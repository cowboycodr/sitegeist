<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Ember &amp; Field — Roasted slowly. Remembered vividly.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a12"/>
      <stop offset="1" stop-color="#221510"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e07a3f"/>
      <stop offset="1" stop-color="#f0b27a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#8a4a2b" stroke-width="2" opacity="0.6"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#8a4a2b" stroke-width="1" opacity="0.35"/>

  <!-- field ridgelines -->
  <path d="M40 700c180-60 340-90 560-90s380 30 560 90v160H40Z" fill="#35241a"/>
  <path d="M40 760c190-46 350-68 560-68s370 22 560 68v100H40Z" fill="#2b1a12"/>
  <path d="M120 690c150-44 300-64 480-64s330 20 480 64" fill="none" stroke="#b9a58a" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M170 730c135-34 275-50 430-50s295 16 430 50" fill="none" stroke="#b9a58a" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- ember bean-flame -->
  <circle cx="600" cy="380" r="238" fill="none" stroke="#8a4a2b" stroke-width="2" opacity="0.7"/>
  <circle cx="600" cy="380" r="196" fill="#35241a"/>
  <path d="M600 208c62 68 100 122 100 176a100 100 0 0 1-200 0c0-54 38-108 100-176Z" fill="url(#glow)"/>
  <path d="M600 292c-4 44-4 90 0 172" fill="none" stroke="#2b1a12" stroke-width="14" stroke-linecap="round"/>
  <circle cx="600" cy="380" r="238" fill="none" stroke="#e07a3f" stroke-width="1" opacity="0.35"/>

  <!-- sparks -->
  <circle cx="466" cy="196" r="5" fill="#e07a3f" opacity="0.8"/>
  <circle cx="742" cy="170" r="4" fill="#f0b27a" opacity="0.8"/>
  <circle cx="806" cy="286" r="3.5" fill="#e07a3f" opacity="0.6"/>
  <circle cx="396" cy="300" r="3.5" fill="#f0b27a" opacity="0.6"/>

  <!-- type -->
  <text x="600" y="112" text-anchor="middle" fill="#e07a3f" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="10">SMALL-BATCH COFFEE</text>
  <text x="600" y="712" text-anchor="middle" fill="#f6eddc" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="bold">Ember &amp; Field</text>
  <text x="600" y="778" text-anchor="middle" fill="#b9a58a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">Roasted slowly. Remembered vividly.</text>

  <line x1="440" y1="820" x2="560" y2="820" stroke="#8a4a2b" stroke-width="2"/>
  <circle cx="600" cy="820" r="6" fill="#e07a3f"/>
  <line x1="640" y1="820" x2="760" y2="820" stroke="#8a4a2b" stroke-width="2"/>
</svg>
