<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Alto — Room for your best thinking</title>
  <rect width="1200" height="900" fill="#f5f1e8"/>

  <!-- room composition, echoing the site's hero illustration -->
  <g>
    <rect x="700" y="140" width="380" height="620" fill="#ece6d8" stroke="#23281f" stroke-width="4"/>
    <rect x="700" y="140" width="380" height="150" fill="#c46a3f"/>
    <circle cx="890" cy="215" r="46" fill="#f5f1e8"/>
    <rect x="740" y="330" width="140" height="270" fill="#9aa88a"/>
    <rect x="910" y="330" width="130" height="120" fill="none" stroke="#23281f" stroke-width="4"/>
    <rect x="910" y="470" width="130" height="130" fill="#23281f"/>
    <path d="M740 660 H1040 M790 660 V720 M990 660 V720" stroke="#23281f" stroke-width="4" fill="none"/>
  </g>

  <!-- brand mark -->
  <path d="M120 210 L172 106 L224 210 H196 L172 156 L148 210 Z" fill="#c46a3f"/>

  <!-- wordmark and copy -->
  <text x="112" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="180" fill="#23281f">Alto</text>
  <text x="120" y="430" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30" letter-spacing="7" fill="#a9552f">A BETTER PLACE TO WORK</text>

  <text x="120" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#23281f">Room for your</text>
  <text x="120" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#23281f">best thinking.</text>

  <text x="120" y="700" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30" fill="#4c5244">Studios · Quiet rooms · The commons</text>

  <rect x="120" y="742" width="270" height="66" rx="33" fill="#c46a3f"/>
  <text x="255" y="785" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#ffffff">Find a space</text>

  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#d5cebd" stroke-width="2"/>
</svg>
