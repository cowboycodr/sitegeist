<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Salt Air — a coastal hotel. Stay close to the tide.</title>
  <defs>
    <linearGradient id="p-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e4"/>
      <stop offset=".6" stop-color="#e9dfc9"/>
      <stop offset="1" stop-color="#cfd2be"/>
    </linearGradient>
    <linearGradient id="p-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8784"/>
      <stop offset="1" stop-color="#1d3a39"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#p-sky)"/>

  <!-- sun -->
  <circle cx="920" cy="200" r="96" fill="#f2e8cf"/>
  <circle cx="920" cy="200" r="96" fill="none" stroke="#b1622f" stroke-width="3" opacity=".35"/>

  <!-- gulls -->
  <g fill="none" stroke="#2c3a37" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M700 170c22 7 42 7 64-3"/>
    <path d="M790 130c18 6 34 6 52-2"/>
  </g>

  <!-- sea -->
  <rect y="520" width="1200" height="380" fill="url(#p-sea)"/>
  <path d="M0 530c120-24 240-24 360 0s240 24 360 0 240-24 360 0 90 12 120 10v30c-30 2-60-2-120-14-120-24-240-24-360 0s-240 24-360 0-240-24-360 0z" fill="#f2ede1" opacity=".45"/>
  <path d="M0 640c140-20 280-20 420 0s280 20 420 0 280-20 360-6v26c-80-14-220-14-360 6s-280 20-420 0-280-20-420 0z" fill="#f2ede1" opacity=".28"/>
  <path d="M0 760c160-18 320-18 480 0s320 18 480 0 200-12 240-8v148H0z" fill="#e3d6b4"/>

  <!-- dune grass -->
  <g stroke="#6c5f4a" stroke-width="6" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M130 862v-84m0 84-24-38m24 38 28-46"/>
    <path d="M1060 872v-70m0 70-20-30m20 30 24-38"/>
  </g>

  <!-- wordmark panel -->
  <g>
    <rect x="220" y="230" width="760" height="330" rx="14" fill="#f6f1e4" stroke="#8b7d63" stroke-width="4"/>
    <rect x="236" y="246" width="728" height="298" rx="8" fill="none" stroke="#8b7d63" stroke-width="2" opacity=".5"/>

    <text x="600" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="12" fill="#b1622f">ROOMS BY THE SEA</text>

    <text x="600" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="122" letter-spacing="6" fill="#22403f">Salt Air</text>

    <path d="M420 470c30-18 60-18 90 0s60 18 90 0 60-18 90 0 60 18 90 0" fill="none" stroke="#2f5a58" stroke-width="7" stroke-linecap="round"/>

    <text x="600" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#2f5a58">Stay close to the tide.</text>
  </g>

  <!-- category badge -->
  <g>
    <rect x="470" y="606" width="260" height="54" rx="27" fill="#22403f"/>
    <text x="600" y="641" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="4" fill="#f6f1e4">COASTAL HOTEL</text>
  </g>
</svg>
