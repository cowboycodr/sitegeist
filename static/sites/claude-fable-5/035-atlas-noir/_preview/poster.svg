<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Atlas Noir — Go where the map ends.</title>
  <desc id="d">Gallery poster: gold contour lines and a compass rose on near-black, with the Atlas Noir wordmark.</desc>

  <rect width="1200" height="900" fill="#0d0c0a"/>

  <!-- graticule -->
  <g stroke="#8a7a55" stroke-width="1" opacity="0.14" fill="none">
    <path d="M300,0 V900 M600,0 V900 M900,0 V900"/>
    <path d="M0,300 H1200 M0,600 H1200"/>
  </g>

  <!-- contour field -->
  <g fill="none" stroke="#8a7a55" stroke-width="1.4" opacity="0.32">
    <path d="M-40,780 C200,690 340,740 560,640 C780,540 940,590 1140,490 C1200,460 1240,470 1260,460"/>
    <path d="M-40,700 C180,620 320,650 540,555 C760,460 920,505 1120,410 C1190,377 1240,390 1260,380"/>
    <path d="M-40,620 C160,550 300,565 520,475 C740,385 900,420 1100,330 C1180,294 1240,308 1260,298"/>
    <path d="M-40,540 C150,480 280,485 500,400 C720,310 880,340 1080,255 C1170,217 1240,230 1260,220"/>
    <path d="M-40,460 C140,410 260,410 480,330 C700,245 860,268 1060,190 C1160,150 1240,160 1260,152"/>
    <path d="M-40,840 C220,760 380,810 600,715 C820,620 980,668 1160,575 C1210,550 1245,558 1260,552"/>
  </g>

  <!-- compass rose -->
  <g opacity="0.9">
    <circle cx="960" cy="235" r="130" fill="none" stroke="#c2a05a" stroke-width="1.6"/>
    <circle cx="960" cy="235" r="100" fill="none" stroke="#c2a05a" stroke-width="0.9" stroke-dasharray="3 8"/>
    <circle cx="960" cy="235" r="58" fill="none" stroke="#8a7a55" stroke-width="0.9"/>
    <path d="M960 105 L975 235 L960 365 L945 235 Z" fill="#c2a05a"/>
    <path d="M830 235 L960 220 L1090 235 L960 250 Z" fill="#8a7a55"/>
    <path d="M868 143 L960 235 M1052 143 L960 235 M868 327 L960 235 M1052 327 L960 235" stroke="#8a7a55" stroke-width="0.9"/>
    <circle cx="960" cy="235" r="8" fill="#0d0c0a" stroke="#c2a05a" stroke-width="2"/>
    <text x="960" y="92" text-anchor="middle" fill="#ece5d8" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="4">N</text>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ece5d8">
    <text x="110" y="430" font-size="26" letter-spacing="12" fill="#c2a05a">BESPOKE JOURNEYS</text>
    <text x="102" y="560" font-size="128" letter-spacing="10">ATLAS</text>
    <text x="102" y="690" font-size="128" letter-spacing="10">NOIR</text>
    <text x="110" y="768" font-size="36" font-style="italic" fill="#c2a05a">Go where the map ends.</text>
  </g>

  <!-- footer rule -->
  <g>
    <path d="M110,830 H540 M660,830 H1090" stroke="#8a7a55" stroke-width="1.4"/>
    <path d="M600 812 L607 830 L600 848 L593 830 Z" fill="#c2a05a"/>
    <text x="600" y="878" text-anchor="middle" fill="#8a7a55" font-family="Georgia, serif" font-size="18" letter-spacing="6">LUXURY TRAVEL · PRIVATE EXPEDITIONS</text>
  </g>

  <!-- frame -->
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#c2a05a" stroke-width="1.6" opacity="0.7"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#8a7a55" stroke-width="0.8" opacity="0.5"/>
</svg>
