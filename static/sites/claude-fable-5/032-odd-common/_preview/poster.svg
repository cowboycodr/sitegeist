<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Odd Common — Make the familiar impossible to ignore.">
  <rect width="1200" height="900" fill="#f4f1e8"/>

  <!-- top rule + eyebrow -->
  <rect x="0" y="0" width="1200" height="70" fill="#16130e"/>
  <text x="80" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" letter-spacing="6" fill="#e3ff3f">INDEPENDENT CREATIVE PRACTICE</text>
  <circle cx="1120" cy="35" r="14" fill="#ff5233"/>

  <!-- big asterisk motif -->
  <g transform="translate(920 330) rotate(12)">
    <path d="M0 -190 L28 -74 L144 -122 L64 -26 L184 0 L64 26 L144 122 L28 74 L0 190 L-28 74 L-144 122 L-64 26 L-184 0 L-64 -26 L-144 -122 L-28 -74 Z" fill="#e3ff3f" stroke="#16130e" stroke-width="8"/>
    <circle r="42" fill="#ff5233" stroke="#16130e" stroke-width="8"/>
  </g>

  <!-- blue squiggle -->
  <path d="M60 700 Q 140 560, 220 640 T 380 640 T 540 640" fill="none" stroke="#2743ff" stroke-width="22" stroke-linecap="round"/>

  <!-- headline -->
  <g font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" fill="#16130e">
    <text x="80" y="250" font-size="120">MAKE THE</text>
    <text x="80" y="370" font-size="120">FAMILIAR</text>
    <text x="80" y="490" font-size="120" fill="#ff5233">IMPOSSIBLE</text>
    <text x="80" y="610" font-size="120">TO IGNORE.</text>
  </g>

  <!-- wordmark card -->
  <g transform="translate(660 660) rotate(-3)">
    <rect x="0" y="0" width="460" height="150" rx="20" fill="#16130e"/>
    <path d="M70 40 L78 66 L104 56 L86 75 L104 94 L78 84 L70 110 L62 84 L36 94 L54 75 L36 56 L62 66 Z" fill="#ff5233"/>
    <text x="130" y="92" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#e3ff3f">ODD COMMON</text>
  </g>

  <!-- bottom strip -->
  <rect x="0" y="840" width="1200" height="60" fill="#16130e"/>
  <text x="80" y="879" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" letter-spacing="4" fill="#f4f1e8">IDENTITY ✳ CAMPAIGNS ✳ DIGITAL WORLDS ✳ MOTION ✳ NAMING</text>
</svg>
