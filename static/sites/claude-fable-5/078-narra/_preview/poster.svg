<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Narra poster: a constellation of research nodes joined by an amber story thread, with the tagline Turn research into a living story.">
  <defs>
    <radialGradient id="glow-a" cx="80%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#e8a13c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8a13c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="5%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#5d7ad6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5d7ad6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#0e1424"/>
  <rect width="1200" height="900" fill="url(#glow-a)"/>
  <rect width="1200" height="900" fill="url(#glow-b)"/>

  <!-- faint background lattice of unconnected notes -->
  <g fill="#f4ede1" opacity="0.14">
    <circle cx="140" cy="150" r="7"/>
    <circle cx="330" cy="90" r="5"/>
    <circle cx="1080" cy="220" r="6"/>
    <circle cx="1010" cy="640" r="5"/>
    <circle cx="180" cy="700" r="6"/>
    <circle cx="590" cy="120" r="5"/>
    <circle cx="920" cy="90" r="7"/>
    <circle cx="90" cy="430" r="5"/>
  </g>
  <g stroke="#f4ede1" stroke-width="1.5" opacity="0.08" fill="none">
    <path d="M140 150 L330 90 L590 120 L920 90"/>
    <path d="M90 430 L180 700"/>
    <path d="M1080 220 L1010 640"/>
  </g>

  <!-- the narrative thread -->
  <g fill="none" stroke="#e8a13c" stroke-width="7" stroke-linecap="round">
    <path d="M210 620 C 340 560, 380 420, 480 350" stroke-dasharray="14 20"/>
    <path d="M480 350 C 610 260, 700 250, 830 230"/>
    <path d="M830 230 C 960 260, 1000 360, 940 470" stroke-dasharray="14 20"/>
  </g>

  <!-- thread nodes -->
  <g>
    <circle cx="210" cy="620" r="30" fill="#e8a13c"/>
    <circle cx="480" cy="350" r="26" fill="#f4ede1"/>
    <circle cx="830" cy="230" r="30" fill="#e8a13c"/>
    <circle cx="830" cy="230" r="46" fill="none" stroke="#e8a13c" stroke-width="4" opacity="0.6"/>
    <circle cx="940" cy="470" r="24" fill="#f4ede1"/>
  </g>

  <!-- node labels -->
  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="26" fill="#b9b3a6" text-anchor="middle">
    <text x="210" y="678">Sources</text>
    <text x="480" y="408">Notes</text>
    <text x="830" y="172">Insight</text>
    <text x="940" y="528">Draft</text>
  </g>

  <!-- wordmark and tagline -->
  <g text-anchor="middle">
    <text x="600" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#f4ede1" letter-spacing="4">Narra</text>
    <text x="600" y="800" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="34" fill="#e8a13c" letter-spacing="6">TURN RESEARCH INTO A LIVING STORY</text>
    <text x="600" y="850" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24" fill="#b9b3a6" letter-spacing="10">CONTEXT, CONNECTED</text>
  </g>

  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#e8a13c" stroke-width="2" opacity="0.35" rx="18"/>
</svg>
