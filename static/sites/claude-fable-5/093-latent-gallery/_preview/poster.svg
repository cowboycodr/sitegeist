<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Latent Gallery — Exhibition 13 / Emergence. Art that never repeats itself.</title>
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdf24b"/>
      <stop offset="1" stop-color="#8f83ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- flow-field strokes, the gallery's signature motif -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M-40 720 C 180 640, 300 760, 520 660 S 900 560, 1240 640" stroke="#ece9df" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M-40 760 C 200 690, 340 800, 560 700 S 920 610, 1240 690" stroke="#ece9df" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M-40 800 C 220 740, 380 840, 600 745 S 940 660, 1240 740" stroke="#8f83ff" stroke-opacity="0.35" stroke-width="2.5"/>
    <path d="M-40 840 C 240 790, 420 880, 640 790 S 960 710, 1240 790" stroke="#ece9df" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M-40 680 C 160 600, 280 720, 500 620 S 880 520, 1240 590" stroke="#cdf24b" stroke-opacity="0.5" stroke-width="2.5"/>
    <path d="M-40 120 C 220 190, 420 90, 660 160 S 1020 230, 1240 150" stroke="#ece9df" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M-40 80 C 240 150, 460 60, 700 120 S 1040 190, 1240 110" stroke="#8f83ff" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M-40 160 C 200 230, 400 130, 640 200 S 1000 270, 1240 190" stroke="#cdf24b" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- constellation nodes -->
  <g>
    <circle cx="150" cy="640" r="5" fill="#cdf24b"/>
    <circle cx="500" cy="620" r="4" fill="#ece9df" opacity="0.7"/>
    <circle cx="880" cy="560" r="6" fill="#8f83ff"/>
    <circle cx="1080" cy="615" r="4" fill="#cdf24b" opacity="0.8"/>
    <circle cx="240" cy="150" r="4" fill="#8f83ff" opacity="0.9"/>
    <circle cx="660" cy="160" r="5" fill="#cdf24b" opacity="0.9"/>
    <circle cx="1010" cy="222" r="4" fill="#ece9df" opacity="0.6"/>
  </g>

  <!-- wordmark glyph -->
  <circle cx="600" cy="300" r="34" fill="url(#glyph)"/>
  <circle cx="600" cy="300" r="46" fill="none" stroke="#ece9df" stroke-opacity="0.25" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="600" y="404" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="24" letter-spacing="7" fill="#cdf24b">EXHIBITION 13 / EMERGENCE</text>

  <!-- title -->
  <text x="600" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#ece9df">Latent Gallery</text>

  <!-- tagline -->
  <text x="600" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#9aa0ae">Art that never repeats itself.</text>

  <!-- footer rule and seed line -->
  <line x1="480" y1="612" x2="720" y2="612" stroke="#2a2e3a" stroke-width="2"/>
  <text x="600" y="648" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#8f83ff">SEED 4C7A1F · EDITION 1/1</text>
</svg>
