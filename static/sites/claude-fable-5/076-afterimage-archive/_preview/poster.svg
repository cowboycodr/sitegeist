<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Afterimage Archive — What remains after looking. A digital archive of experimental photography, 1968 to 1999.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#f4ead8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#d8b98a" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#7a5a3a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#100e0c" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.87  0 0 0 0 0.78  0 0 0 0.12 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#100e0c"/>

  <g filter="url(#grain)">
    <rect width="1200" height="900" fill="#100e0c"/>

    <!-- Afterimage motif: concentric solarization rings, off-centre right -->
    <circle cx="880" cy="380" r="330" fill="url(#glow)"/>
    <circle cx="880" cy="380" r="252" fill="none" stroke="#f0e7d6" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="880" cy="380" r="196" fill="none" stroke="#f0e7d6" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="880" cy="380" r="138" fill="none" stroke="#e2582c" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="880" cy="380" r="86" fill="none" stroke="#d8b98a" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="880" cy="380" r="40" fill="#100e0c" stroke="#f0e7d6" stroke-opacity="0.75" stroke-width="2"/>
    <circle cx="880" cy="380" r="10" fill="#e2582c"/>

    <!-- Photogram scatter: shadow objects left behind on the paper -->
    <line x1="700" y1="640" x2="1080" y2="560" stroke="#f0e7d6" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1060" cy="660" r="34" fill="#f0e7d6" fill-opacity="0.4"/>
    <rect x="720" y="680" width="130" height="16" fill="#f0e7d6" fill-opacity="0.45" transform="rotate(-14 785 688)"/>

    <!-- Plate edge -->
    <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#f0e7d6" stroke-opacity="0.24" stroke-width="2"/>
    <line x1="60" y1="838" x2="220" y2="838" stroke="#e2582c" stroke-opacity="0.85" stroke-width="4"/>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="220" font-family="ui-monospace, 'Courier New', monospace" font-size="26" letter-spacing="8" fill="#e2582c">ARCHIVE 001—947</text>

  <!-- Title -->
  <text x="90" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="128" fill="#f0e7d6">Afterimage</text>
  <text x="90" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="128" fill="#f0e7d6">Archive</text>

  <!-- Tagline -->
  <text x="96" y="580" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" fill="#d8b98a">What remains after looking.</text>

  <!-- Footline -->
  <text x="96" y="800" font-family="ui-monospace, 'Courier New', monospace" font-size="24" letter-spacing="3" fill="#b8ad97">EXPERIMENTAL PHOTOGRAPHY · 1968–1999</text>
</svg>
