<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Future Archive — Save what tomorrow should remember.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c266"/>
      <stop offset="1" stop-color="#b6742a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#2a3341" stroke-width="2"/>

  <!-- Strata motif -->
  <g>
    <rect x="180" y="640" width="840" height="64" rx="8" fill="#20262e"/>
    <rect x="250" y="556" width="700" height="64" rx="8" fill="#272f3a"/>
    <rect x="320" y="472" width="560" height="64" rx="8" fill="#2e3846"/>
    <rect x="390" y="388" width="420" height="64" rx="8" fill="#364253"/>
    <rect x="460" y="304" width="280" height="64" rx="8" fill="url(#gold)"/>
    <circle cx="600" cy="256" r="12" fill="#e8b64c"/>
    <line x1="600" y1="270" x2="600" y2="304" stroke="#e8b64c" stroke-width="3" stroke-dasharray="4 6"/>
  </g>
  <g stroke="#3d4a5c" stroke-width="2" fill="none">
    <path d="M180 672 H120 M1020 672 H1080 M250 588 H120 M950 588 H1080 M320 504 H140 M880 504 H1060"/>
  </g>
  <g fill="#7c8ba0" font-family="ui-monospace, Consolas, monospace" font-size="20">
    <text x="70" y="679">2090</text>
    <text x="70" y="595">2060</text>
    <text x="82" y="511">2030</text>
  </g>

  <!-- Text -->
  <text x="600" y="130" text-anchor="middle" fill="#e8b64c" font-family="ui-monospace, Consolas, monospace" font-size="24" letter-spacing="8">MEMORY INFRASTRUCTURE</text>
  <text x="600" y="200" text-anchor="middle" fill="#e9eef5" font-family="Georgia, 'Times New Roman', serif" font-size="84">Future Archive</text>
  <text x="600" y="790" text-anchor="middle" fill="#e8b64c" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">Save what tomorrow should remember.</text>
  <text x="600" y="838" text-anchor="middle" fill="#7c8ba0" font-family="ui-monospace, Consolas, monospace" font-size="19">DIGITAL PRESERVATION · FIXITY VERIFIED · PLANNED IN CENTURIES</text>
</svg>
