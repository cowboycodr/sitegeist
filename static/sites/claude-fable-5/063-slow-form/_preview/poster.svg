<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Slow Form — Made at the speed of care</title>

  <!-- ground -->
  <rect width="1200" height="900" fill="#f4eee3"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#29211a" stroke-width="3"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#a97f52" stroke-width="1.5"/>

  <!-- growth rings motif -->
  <g fill="none" stroke="#a97f52" stroke-width="2.5" opacity="0.5">
    <ellipse cx="850" cy="380" rx="290" ry="180"/>
    <ellipse cx="850" cy="380" rx="238" ry="145"/>
    <ellipse cx="850" cy="380" rx="186" ry="111"/>
    <ellipse cx="850" cy="380" rx="134" ry="78"/>
    <ellipse cx="850" cy="380" rx="84" ry="47"/>
    <ellipse cx="850" cy="380" rx="38" ry="20"/>
    <ellipse cx="850" cy="380" rx="10" ry="6"/>
  </g>

  <!-- chair silhouette over the rings -->
  <g stroke="#29211a" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M700 520 L700 780"/>
    <path d="M700 520 Q696 440 720 390"/>
    <path d="M980 640 L980 780"/>
    <path d="M700 640 Q850 616 980 640" stroke-width="19"/>
    <path d="M706 530 Q840 498 900 522" stroke-width="16"/>
    <path d="M770 634 L758 780"/>
    <path d="M912 630 L924 780"/>
  </g>

  <!-- edition stamp -->
  <g transform="translate(1032, 742)">
    <circle r="52" fill="none" stroke="#a4502c" stroke-width="4"/>
    <circle r="44" fill="none" stroke="#a4502c" stroke-width="1.5"/>
    <text x="0" y="12" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="34" fill="#a4502c">№41</text>
  </g>

  <!-- type block -->
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#29211a">
    <text x="96" y="176" font-size="26" letter-spacing="9" fill="#a4502c">FURNITURE FOR KEEPING</text>
    <text x="90" y="300" font-size="118" letter-spacing="1">Slow Form</text>
    <text x="96" y="392" font-size="46" font-style="italic" fill="#55483c">Made at the speed of care.</text>

    <text x="96" y="500" font-size="27" fill="#55483c">Numbered furniture shaped from</text>
    <text x="96" y="542" font-size="27" fill="#55483c">local timber, designed to gather</text>
    <text x="96" y="584" font-size="27" fill="#55483c">character over decades.</text>
  </g>

  <!-- rule + footline -->
  <line x1="96" y1="640" x2="560" y2="640" stroke="#29211a" stroke-width="2"/>
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="22" fill="#55483c">
    <text x="96" y="690">Oak · Elm · Ash · Sycamore</text>
    <text x="96" y="726">Joined without screws — repaired for life</text>
    <text x="96" y="808" font-size="20" letter-spacing="6" fill="#a97f52">THE OLD GRAIN STORE · WENFORD</text>
  </g>
</svg>
