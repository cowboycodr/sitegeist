<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>Slow Form — poster preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #29211a;
    padding: 2rem;
    box-sizing: border-box;
  }
  img {
    display: block;
    width: min(100%, 900px);
    height: auto;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
<img src="poster.svg" alt="Slow Form gallery poster: a line-drawn chair over oak growth rings, with the tagline ‘Made at the speed of care.’" width="1200" height="900">
</body>
</html>
