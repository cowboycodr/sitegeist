<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Perigee House — Earth has never looked this good.">
  <defs>
    <radialGradient id="earth" cx="50%" cy="115%" r="85%">
      <stop offset="0%" stop-color="#2f7fd4"/>
      <stop offset="42%" stop-color="#123c6e"/>
      <stop offset="70%" stop-color="#081a33"/>
      <stop offset="100%" stop-color="#04101f"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a9e2ff"/>
      <stop offset="100%" stop-color="#7fd0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#04101f"/>

  <!-- stars -->
  <g fill="#cfe6ff">
    <circle cx="90" cy="110" r="2"/><circle cx="240" cy="60" r="1.4"/><circle cx="420" cy="140" r="1.7"/>
    <circle cx="600" cy="55" r="2.2"/><circle cx="780" cy="120" r="1.4"/><circle cx="950" cy="70" r="1.8"/>
    <circle cx="1110" cy="130" r="1.5"/><circle cx="160" cy="230" r="1.4"/><circle cx="350" cy="270" r="1.9"/>
    <circle cx="540" cy="210" r="1.3"/><circle cx="730" cy="260" r="1.6"/><circle cx="920" cy="220" r="2"/>
    <circle cx="1090" cy="280" r="1.4"/><circle cx="70" cy="360" r="1.7"/><circle cx="280" cy="400" r="1.3"/>
    <circle cx="480" cy="350" r="1.5"/><circle cx="880" cy="380" r="1.4"/><circle cx="1140" cy="360" r="1.8"/>
    <circle cx="640" cy="410" r="1.3"/><circle cx="1020" cy="440" r="1.5"/>
  </g>

  <!-- Earth limb -->
  <circle cx="600" cy="2060" r="1400" fill="url(#earth)"/>
  <path d="M -40 700 A 1400 1400 0 0 1 1240 700" fill="none" stroke="#7fd0ff" stroke-opacity="0.25" stroke-width="16"/>
  <path d="M -40 712 A 1400 1400 0 0 1 1240 712" fill="none" stroke="url(#limb)" stroke-width="3.5"/>

  <!-- station -->
  <g transform="translate(940 240)">
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#c9d6e6" stroke-width="4"/>
    <rect x="-140" y="-24" width="48" height="48" rx="4" fill="#0e2440" stroke="#7fd0ff" stroke-width="2"/>
    <rect x="92" y="-24" width="48" height="48" rx="4" fill="#0e2440" stroke="#7fd0ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#0b1b33" stroke="#e8c789" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="19" fill="#123c6e" stroke="#a9e2ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="6.5" fill="#e8c789"/>
  </g>

  <!-- orbit ring motif -->
  <ellipse cx="600" cy="330" rx="470" ry="150" fill="none" stroke="#e8c789" stroke-opacity="0.35" stroke-width="2" transform="rotate(-8 600 330)"/>

  <!-- text -->
  <text x="600" y="300" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" letter-spacing="10" fill="#7fd0ff">LOW-EARTH ORBIT · 2031</text>
  <text x="600" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#dfe9f5">Perigee House</text>
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#e8c789">Earth has never looked this good.</text>

  <!-- ticker -->
  <text x="600" y="820" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" letter-spacing="4" fill="#9db4cc">ALT 410 KM · 16 SUNRISES / DAY · 12 SUITES</text>
</svg>
