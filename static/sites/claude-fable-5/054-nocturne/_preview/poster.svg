<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Nocturne — Scent after dark</title>
  <desc id="d">A gold crescent moon haloed above a dark perfume bottle on a midnight-blue field of faint stars.</desc>
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#1a2140"/>
      <stop offset="0.6" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c987" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8c987" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="0.55" stop-color="#131a30"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f55"/>
      <stop offset="1" stop-color="#191231"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e8c987">
    <circle cx="120" cy="140" r="2.4"/><circle cx="300" cy="80" r="1.6"/>
    <circle cx="1080" cy="120" r="2.2"/><circle cx="940" cy="220" r="1.5"/>
    <circle cx="180" cy="420" r="1.7"/><circle cx="1050" cy="470" r="1.8"/>
    <circle cx="90" cy="700" r="1.6"/><circle cx="1120" cy="720" r="1.5"/>
    <circle cx="520" cy="90" r="1.4"/><circle cx="760" cy="60" r="1.8"/>
  </g>
  <g fill="#d9dcea" opacity="0.7">
    <circle cx="220" cy="260" r="1.3"/><circle cx="860" cy="150" r="1.2"/>
    <circle cx="990" cy="330" r="1.3"/><circle cx="140" cy="560" r="1.2"/>
    <circle cx="1030" cy="600" r="1.2"/><circle cx="640" cy="130" r="1.1"/>
  </g>

  <!-- moon halo and crescent -->
  <circle cx="600" cy="330" r="260" fill="url(#halo)"/>
  <circle cx="600" cy="330" r="150" fill="none" stroke="#e8c987" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M672 200a150 150 0 1 0 66 214 118 118 0 0 1-66-214Z" fill="#e8c987" opacity="0.16"/>
  <circle cx="600" cy="330" r="182" fill="none" stroke="#e8c987" stroke-opacity="0.22" stroke-dasharray="3 12" stroke-width="1.6"/>

  <!-- bottle -->
  <g>
    <rect x="512" y="300" width="176" height="330" rx="20" fill="url(#glass)" stroke="#e8c987" stroke-opacity="0.6" stroke-width="2.2"/>
    <rect x="526" y="432" width="148" height="184" rx="13" fill="url(#liquid)"/>
    <rect x="576" y="252" width="48" height="52" rx="6" fill="#0d1226" stroke="#e8c987" stroke-opacity="0.6" stroke-width="1.8"/>
    <rect x="562" y="218" width="76" height="40" rx="9" fill="#e8c987" opacity="0.92"/>
    <line x1="542" y1="326" x2="542" y2="602" stroke="#f3e3bd" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
    <rect x="548" y="368" width="104" height="118" rx="5" fill="none" stroke="#e8c987" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="600" y="422" text-anchor="middle" fill="#e8c987" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="7">NOCTURNE</text>
    <text x="600" y="456" text-anchor="middle" fill="#9aa3c0" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="5">EXTRAIT DE NUIT</text>
  </g>

  <!-- titling -->
  <text x="600" y="712" text-anchor="middle" fill="#e8c987" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="14">PARFUMS DE NUIT</text>
  <text x="600" y="788" text-anchor="middle" fill="#f3e3bd" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="24">NOCTURNE</text>
  <line x1="380" y1="820" x2="560" y2="820" stroke="#e8c987" stroke-opacity="0.5" stroke-width="1.6"/>
  <line x1="640" y1="820" x2="820" y2="820" stroke="#e8c987" stroke-opacity="0.5" stroke-width="1.6"/>
  <circle cx="600" cy="820" r="4" fill="#e8c987"/>
  <text x="600" y="856" text-anchor="middle" fill="#9aa3c0" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" letter-spacing="3">Scent after dark.</text>
</svg>
