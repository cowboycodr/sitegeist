<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Plane Object — Furniture with nothing to hide.</title>
  <desc id="poster-desc">Gallery poster showing an exploded flat-pack shelf drawing in birch tones on warm paper, with the Plane Object wordmark and tagline.</desc>

  <!-- paper ground with faint 400 mm grid -->
  <rect width="1200" height="900" fill="#f6efe2"/>
  <g stroke="#1c1a17" stroke-opacity="0.06" stroke-width="2">
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#1c1a17" stroke-width="6"/>

  <!-- eyebrow -->
  <text x="90" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#e8542f">OBJECTS FOR MODERN ROOMS</text>

  <!-- wordmark glyph -->
  <g transform="translate(90, 170)">
    <rect x="0" y="0" width="86" height="86" fill="none" stroke="#e8542f" stroke-width="9"/>
    <line x1="0" y1="60" x2="86" y2="60" stroke="#e8542f" stroke-width="9"/>
    <line x1="26" y1="0" x2="26" y2="60" stroke="#e8542f" stroke-width="9"/>
  </g>

  <!-- title -->
  <text x="90" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-3" fill="#1c1a17">Plane</text>
  <text x="90" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-3" fill="#1c1a17">Object</text>

  <!-- tagline -->
  <text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#4c463d">Furniture with nothing to hide.</text>

  <!-- exploded shelf motif -->
  <g transform="translate(640, 140)">
    <!-- uprights -->
    <rect x="52" y="60" width="26" height="500" fill="#f2e3c9" stroke="#1c1a17" stroke-width="5"/>
    <rect x="392" y="60" width="26" height="500" fill="#f2e3c9" stroke="#1c1a17" stroke-width="5"/>
    <rect x="222" y="220" width="26" height="340" fill="#f2e3c9" stroke="#1c1a17" stroke-width="5"/>
    <!-- planks, drifting apart -->
    <g transform="translate(-14, -26)">
      <rect x="0" y="40" width="470" height="30" fill="#d9b98c" stroke="#1c1a17" stroke-width="5"/>
      <line x1="0" y1="55" x2="470" y2="55" stroke="#b58e5a" stroke-width="4"/>
    </g>
    <g transform="translate(-7, -13)">
      <rect x="0" y="200" width="470" height="30" fill="#e5cba3" stroke="#1c1a17" stroke-width="5"/>
      <line x1="0" y1="215" x2="470" y2="215" stroke="#c8a26f" stroke-width="4"/>
    </g>
    <rect x="0" y="360" width="470" height="30" fill="#d9b98c" stroke="#1c1a17" stroke-width="5"/>
    <line x1="0" y1="375" x2="470" y2="375" stroke="#b58e5a" stroke-width="4"/>
    <rect x="0" y="530" width="470" height="30" fill="#c8a26f" stroke="#1c1a17" stroke-width="5"/>
    <!-- brass bolts -->
    <circle cx="65" cy="29" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="405" cy="29" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="65" cy="202" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="405" cy="202" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="235" cy="375" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="65" cy="545" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <circle cx="405" cy="545" r="11" fill="#e8542f" stroke="#1c1a17" stroke-width="4"/>
    <!-- dimension line -->
    <g stroke="#1c1a17" stroke-width="5">
      <line x1="-30" y1="620" x2="500" y2="620"/>
      <line x1="-30" y1="608" x2="-30" y2="632"/>
      <line x1="500" y1="608" x2="500" y2="632"/>
    </g>
    <text x="235" y="668" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="2" fill="#4c463d">1 200 mm — three units wide</text>
  </g>

  <!-- footer strip -->
  <rect x="30" y="796" width="1140" height="74" fill="#1c1a17"/>
  <text x="90" y="843" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f6efe2">PLANE OBJECT</text>
  <text x="1110" y="843" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#d9b98c">400 MM GRID, FOREVER</text>
</svg>
