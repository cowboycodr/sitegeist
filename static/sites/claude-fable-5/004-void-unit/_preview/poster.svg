<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Void Unit — Drop 07 poster. Uniforms for the after-hours.">
  <rect width="1200" height="900" fill="#0b0b0d"/>

  <!-- faint vertical grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="750" y1="0" x2="750" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1050" y1="0" x2="1050" y2="900"/>
  </g>

  <!-- void motif -->
  <circle cx="920" cy="330" r="240" fill="none" stroke="#d6fb41" stroke-width="10"/>
  <circle cx="920" cy="330" r="86" fill="#d6fb41"/>
  <circle cx="920" cy="330" r="150" fill="none" stroke="#2a2a31" stroke-width="3"/>

  <!-- frame -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#2a2a31" stroke-width="3"/>

  <!-- eyebrow tag -->
  <rect x="84" y="96" width="378" height="58" fill="none" stroke="#d6fb41" stroke-width="3"/>
  <rect x="104" y="117" width="16" height="16" fill="#d6fb41"/>
  <text x="138" y="134" font-family="Consolas, Menlo, monospace" font-size="26" letter-spacing="4" fill="#d6fb41">DROP 07 · NO RESTOCK</text>

  <!-- title -->
  <text x="76" y="430" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="240" font-weight="700" letter-spacing="6" fill="#ececec">VOID</text>
  <text x="76" y="640" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="240" font-weight="700" letter-spacing="6" fill="#d6fb41">UNIT</text>

  <!-- tagline -->
  <text x="84" y="716" font-family="Consolas, Menlo, monospace" font-size="30" letter-spacing="8" fill="#ececec">UNIFORMS FOR THE AFTER-HOURS.</text>

  <!-- acid baseline strip -->
  <rect x="36" y="770" width="1128" height="62" fill="#d6fb41"/>
  <text x="66" y="811" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" letter-spacing="5" fill="#0b0b0d">LIMITED SYSTEMS · 350 UNITS · WHEN IT SELLS OUT, THE PATTERN DIES</text>

  <!-- corner ticks -->
  <g stroke="#d6fb41" stroke-width="4">
    <path d="M36 76 L36 36 L76 36" fill="none"/>
    <path d="M1124 36 L1164 36 L1164 76" fill="none"/>
    <path d="M1164 824 L1164 864 L1124 864" fill="none"/>
    <path d="M76 864 L36 864 L36 824" fill="none"/>
  </g>
</svg>
