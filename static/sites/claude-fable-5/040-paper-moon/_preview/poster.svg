<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Paper Moon — Films that linger.</title>
  <desc id="poster-desc">A gold paper crescent moon over a deep indigo night sky, above the cinema's name and tagline, with a dashed ticket-stub band along the bottom.</desc>

  <defs>
    <radialGradient id="sky" cx="72%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#232951"/>
      <stop offset="45%" stop-color="#171a2e"/>
      <stop offset="100%" stop-color="#10121f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3b34c" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#e3b34c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e3b34c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f4ecd9">
    <circle cx="120" cy="130" r="4" opacity="0.8"/>
    <circle cx="260" cy="90" r="3" opacity="0.55"/>
    <circle cx="410" cy="180" r="3.5" opacity="0.7"/>
    <circle cx="180" cy="300" r="3" opacity="0.5"/>
    <circle cx="330" cy="380" r="4" opacity="0.65"/>
    <circle cx="95" cy="470" r="3" opacity="0.45"/>
    <circle cx="520" cy="90" r="3" opacity="0.6"/>
    <circle cx="1080" cy="420" r="3.5" opacity="0.6"/>
    <circle cx="1130" cy="150" r="3" opacity="0.5"/>
    <circle cx="960" cy="520" r="3" opacity="0.45"/>
    <circle cx="620" cy="300" r="3" opacity="0.5"/>
    <circle cx="60" cy="640" r="3" opacity="0.4"/>
  </g>

  <!-- moon -->
  <circle cx="810" cy="270" r="420" fill="url(#glow)"/>
  <circle cx="810" cy="270" r="185" fill="#e3b34c"/>
  <circle cx="878" cy="220" r="152" fill="#171a2e"/>
  <circle cx="748" cy="330" r="12" fill="#171a2e" opacity="0.3"/>
  <circle cx="712" cy="264" r="17" fill="#171a2e" opacity="0.22"/>
  <circle cx="782" cy="392" r="9" fill="#171a2e" opacity="0.28"/>

  <!-- name and tagline -->
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" text-anchor="start">
    <text x="90" y="565" fill="#e3b34c" font-size="26" letter-spacing="10" font-weight="600">INDEPENDENT CINEMA</text>
    <text x="86" y="668" fill="#f4ecd9" font-size="112" font-weight="700" letter-spacing="2">Paper Moon</text>
    <text x="90" y="728" fill="#cfc7b2" font-size="40" font-style="italic">Films that linger.</text>
  </g>

  <!-- ticket stub band -->
  <g>
    <rect x="0" y="796" width="1200" height="104" fill="#f4ecd9"/>
    <line x1="0" y1="796" x2="1200" y2="796" stroke="#10121f" stroke-width="3" stroke-dasharray="14 12"/>
    <circle cx="300" cy="848" r="14" fill="#171a2e"/>
    <circle cx="900" cy="848" r="14" fill="#171a2e"/>
    <g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#10121f" text-anchor="middle">
      <text x="600" y="842" font-size="30" letter-spacing="8" font-weight="700">ADMIT ONE</text>
      <text x="600" y="876" font-size="20" letter-spacing="4">OVERLOOKED CLASSICS · MIDNIGHT ODDITIES · NEW VOICES</text>
    </g>
  </g>
</svg>
