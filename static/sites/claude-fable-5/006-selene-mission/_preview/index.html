<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Selene Mission — poster preview</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a12; padding: 2rem; box-sizing: border-box; }
    img { display: block; width: min(100%, 900px); aspect-ratio: 4 / 3; border: 1px solid #232d44; border-radius: 8px; }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Selene Mission gallery poster: a cratered moon with an amber orbit ring and a small habitat lander at its pole, above the title and tagline 'The moon is our next address.'">
</body>
</html>
