<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kiln Coffee — Heat reveals character.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="45%" stop-color="#d94f1e"/>
      <stop offset="100%" stop-color="#2a1712"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c120d"/>
      <stop offset="100%" stop-color="#241711"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Kiln arch -->
  <g transform="translate(770 170)">
    <path d="M20 560V240a190 190 0 0 1 380 0v320z" fill="url(#glow)"/>
    <path d="M20 560V240a190 190 0 0 1 380 0v320z" fill="none" stroke="#f3e5d3" stroke-opacity=".28" stroke-width="4"/>
    <g stroke="#ffb877" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85">
      <path d="M140 190c10-18-10-30 0-48"/>
      <path d="M210 174c10-18-10-30 0-48"/>
      <path d="M280 190c10-18-10-30 0-48"/>
    </g>
    <ellipse cx="210" cy="440" rx="112" ry="70" fill="#1c0f0b"/>
    <ellipse cx="210" cy="440" rx="112" ry="70" fill="none" stroke="#ffb877" stroke-opacity=".5" stroke-width="4"/>
    <g fill="#8a4a24">
      <ellipse cx="172" cy="426" rx="24" ry="16" transform="rotate(-18 172 426)"/>
      <ellipse cx="228" cy="414" rx="24" ry="16" transform="rotate(12 228 414)"/>
      <ellipse cx="256" cy="456" rx="24" ry="16" transform="rotate(-30 256 456)"/>
      <ellipse cx="192" cy="466" rx="24" ry="16" transform="rotate(24 192 466)"/>
    </g>
    <g stroke="#2a1712" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M163 416q9 11 18 22"/>
      <path d="M220 404q9 11 18 22"/>
      <path d="M247 445q9 11 18 22"/>
      <path d="M184 456q9 11 18 22"/>
    </g>
  </g>

  <!-- Roast curve -->
  <path d="M80 760 C 220 830, 420 838, 620 780 S 1040 620, 1140 560"
        fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <circle cx="1140" cy="560" r="12" fill="#ffb877"/>
  <line x1="900" y1="560" x2="900" y2="800" stroke="#f3e5d3" stroke-opacity=".3" stroke-dasharray="8 12" stroke-width="4"/>

  <!-- Wordmark and copy -->
  <g font-family="Palatino, 'Palatino Linotype', Georgia, serif">
    <text x="84" y="170" fill="#ffb877" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7">ROASTED THIS WEEK / BATCH 214</text>
    <text x="80" y="300" fill="#f3e5d3" font-size="128" font-weight="600">Kiln <tspan fill="#ff8a3d">Coffee</tspan></text>
    <text x="84" y="420" fill="#f3e5d3" font-size="66" font-style="italic">Heat reveals character.</text>
    <text x="84" y="500" fill="#cbb59e" font-family="Helvetica, Arial, sans-serif" font-size="30">Expressive coffees, developed with</text>
    <text x="84" y="544" fill="#cbb59e" font-family="Helvetica, Arial, sans-serif" font-size="30">patient, exact roast profiles.</text>
  </g>

  <!-- Flame mark -->
  <g transform="translate(84 580) scale(3.4)" fill="#ff8a3d">
    <path d="M12 1c1 6-7 9-7 17a7 7 0 0 0 14 0c0-4-2-6-3-8-1 3-2 4-4 5 1-4-1-9 0-14z"/>
  </g>

  <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#43302566" stroke-width="6"/>
</svg>
