<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Milkweed School — Let curiosity get muddy.</title>
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#f6f1e3"/>
      <stop offset="100%" stop-color="#e9dfc2"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#3c5531" stroke-width="4" rx="26"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#c9a26a" stroke-width="2" rx="18"/>

  <!-- milkweed stalk with split pod -->
  <g>
    <path d="M905 830 C912 660 906 540 888 430" fill="none" stroke="#41592f" stroke-width="14" stroke-linecap="round"/>
    <path d="M898 700 C980 690 1030 644 1044 584 C966 580 912 620 896 684 Z" fill="#5f7d47"/>
    <path d="M902 560 C822 550 774 506 762 448 C838 444 890 482 906 544 Z" fill="#6f8f5a"/>
    <path d="M888 430 C852 372 846 296 890 220 C956 268 976 350 946 430 C926 482 902 480 888 430 Z" fill="#8a5a33"/>
    <path d="M888 430 C858 380 854 314 886 252 C936 294 952 360 932 420 Z" fill="#f0e2c4"/>
    <path d="M890 258 C906 306 922 366 932 418" fill="none" stroke="#c9a26a" stroke-width="5" stroke-linecap="round"/>
    <g fill="#8a5a33">
      <ellipse cx="898" cy="300" rx="7" ry="11"/>
      <ellipse cx="912" cy="340" rx="7" ry="11"/>
      <ellipse cx="920" cy="384" rx="7" ry="11"/>
    </g>
  </g>

  <!-- drifting seeds -->
  <g stroke-linecap="round">
    <g transform="translate(1000 190) rotate(-12)">
      <g stroke="#fdf9ef" stroke-width="5">
        <line x1="0" y1="0" x2="-30" y2="-34"/><line x1="0" y1="0" x2="-12" y2="-40"/>
        <line x1="0" y1="0" x2="6" y2="-42"/><line x1="0" y1="0" x2="24" y2="-34"/>
        <line x1="0" y1="0" x2="36" y2="-16"/>
      </g>
      <g stroke="#e0d3ae" stroke-width="5">
        <line x1="0" y1="0" x2="-32" y2="-30"/><line x1="0" y1="0" x2="14" y2="-40"/><line x1="0" y1="0" x2="32" y2="-24"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#c9a26a" stroke-width="5"/>
      <ellipse cx="0" cy="26" rx="9" ry="14" fill="#8a5a33"/>
    </g>
    <g transform="translate(1090 330) rotate(14)">
      <g stroke="#fdf9ef" stroke-width="4">
        <line x1="0" y1="0" x2="-24" y2="-26"/><line x1="0" y1="0" x2="-8" y2="-32"/>
        <line x1="0" y1="0" x2="10" y2="-31"/><line x1="0" y1="0" x2="26" y2="-20"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c9a26a" stroke-width="4"/>
      <ellipse cx="0" cy="21" rx="7" ry="11" fill="#8a5a33"/>
    </g>
    <g transform="translate(780 150) rotate(6)">
      <g stroke="#f0e6cd" stroke-width="4">
        <line x1="0" y1="0" x2="-22" y2="-24"/><line x1="0" y1="0" x2="-4" y2="-30"/>
        <line x1="0" y1="0" x2="14" y2="-27"/><line x1="0" y1="0" x2="26" y2="-12"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="13" stroke="#c9a26a" stroke-width="4"/>
      <ellipse cx="0" cy="19" rx="6.5" ry="10" fill="#8a5a33"/>
    </g>
  </g>

  <!-- monarch -->
  <g transform="translate(700 260) rotate(-10)">
    <path d="M0 0 C-34 -42 -76 -46 -88 -18 C-96 8 -62 26 -8 12 Z" fill="#e07a2f" stroke="#2b2018" stroke-width="6"/>
    <path d="M0 6 C-30 40 -68 48 -80 26 C-88 10 -54 -8 -4 -2 Z" fill="#e8a25e" stroke="#2b2018" stroke-width="6"/>
    <path d="M4 0 C38 -42 80 -46 92 -18 C100 8 66 26 12 12 Z" fill="#e07a2f" stroke="#2b2018" stroke-width="6"/>
    <path d="M4 6 C34 40 72 48 84 26 C92 10 58 -8 8 -2 Z" fill="#e8a25e" stroke="#2b2018" stroke-width="6"/>
    <ellipse cx="2" cy="3" rx="8" ry="20" fill="#2b2018"/>
    <path d="M-2 -14 C-10 -28 -16 -33 -21 -35 M6 -14 C14 -28 20 -33 25 -35" fill="none" stroke="#2b2018" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ground line -->
  <path d="M90 812 C300 792 560 786 760 794 C920 800 1040 808 1110 814" fill="none" stroke="#c9b98e" stroke-width="8" stroke-linecap="round"/>

  <!-- text block -->
  <text x="110" y="228" font-family="'Avenir Next', Avenir, 'Segoe UI', Verdana, sans-serif" font-size="30" font-weight="700" letter-spacing="7" fill="#8a5a33">LEARNING OUTSIDE · AGES 4–11</text>
  <text x="104" y="360" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="118" font-weight="700" fill="#24391f">Milkweed</text>
  <text x="104" y="480" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="118" font-weight="700" fill="#24391f">School</text>
  <rect x="110" y="530" width="150" height="10" rx="5" fill="#e07a2f"/>
  <text x="110" y="612" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="52" font-style="italic" fill="#3c5531">Let curiosity get muddy.</text>
  <text x="110" y="680" font-family="'Avenir Next', Avenir, 'Segoe UI', Verdana, sans-serif" font-size="27" fill="#4c5a40">A forest learning community exploring ecology,</text>
  <text x="110" y="720" font-family="'Avenir Next', Avenir, 'Segoe UI', Verdana, sans-serif" font-size="27" fill="#4c5a40">craft, movement, and seasonal change.</text>
</svg>
