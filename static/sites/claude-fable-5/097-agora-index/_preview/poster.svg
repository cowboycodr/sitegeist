<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Agora Index — Public life, made legible.">
  <rect width="1200" height="900" fill="#f5f1e6"/>
  <circle cx="1120" cy="-40" r="360" fill="#0e7568" opacity="0.10"/>
  <circle cx="60" cy="940" r="320" fill="#d9572b" opacity="0.10"/>

  <!-- brand bars motif -->
  <g transform="translate(90,96)">
    <rect x="0" y="66" width="26" height="34" rx="5" fill="#0e7568"/>
    <rect x="38" y="42" width="26" height="58" rx="5" fill="#c1922c"/>
    <rect x="76" y="22" width="26" height="78" rx="5" fill="#d9572b"/>
    <rect x="114" y="0" width="26" height="100" rx="5" fill="#182338"/>
  </g>

  <text x="90" y="180" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" letter-spacing="10" fill="#d9572b" transform="translate(0,110)">CITY PULSE / UPDATED HOURLY</text>

  <text x="86" y="404" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="128" letter-spacing="-3" fill="#182338">Agora Index</text>
  <text x="90" y="482" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" fill="#45506a">Public life, made legible.</text>

  <!-- composite dial -->
  <g transform="translate(985,610)">
    <circle r="150" fill="#fdfaf2" stroke="#d8d0bc" stroke-width="2"/>
    <circle r="118" fill="none" stroke="#ece5d3" stroke-width="22"/>
    <circle r="118" fill="none" stroke="#0e7568" stroke-width="22" stroke-linecap="round"
            pathLength="100" stroke-dasharray="71 100" transform="rotate(-90)"/>
    <text y="18" text-anchor="middle" font-family="'SF Mono',Consolas,'Liberation Mono',monospace" font-weight="700" font-size="86" fill="#182338">71</text>
    <text y="62" text-anchor="middle" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" fill="#45506a">of 100 · steady</text>
  </g>

  <!-- signal chips -->
  <g font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(90,560)">
      <rect width="330" height="120" rx="18" fill="#fdfaf2" stroke="#d8d0bc"/>
      <rect width="330" height="8" rx="4" fill="#0e7568"/>
      <text x="26" y="52" font-size="26" font-weight="600" fill="#182338">Budget</text>
      <text x="304" y="56" text-anchor="end" font-family="'SF Mono',Consolas,monospace" font-weight="700" font-size="40" fill="#0a5a50">76</text>
      <polyline points="26,96 66,92 106,95 146,86 186,88 226,80 266,76 304,70" fill="none" stroke="#0e7568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(450,560)">
      <rect width="330" height="120" rx="18" fill="#fdfaf2" stroke="#d8d0bc"/>
      <rect width="330" height="8" rx="4" fill="#d9572b"/>
      <text x="26" y="52" font-size="26" font-weight="600" fill="#182338">Housing</text>
      <text x="304" y="56" text-anchor="end" font-family="'SF Mono',Consolas,monospace" font-weight="700" font-size="40" fill="#b23a2a">58</text>
      <polyline points="26,74 66,78 106,76 146,84 186,82 226,90 266,88 304,94" fill="none" stroke="#d9572b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(90,706)">
      <rect width="330" height="120" rx="18" fill="#fdfaf2" stroke="#d8d0bc"/>
      <rect width="330" height="8" rx="4" fill="#c1922c"/>
      <text x="26" y="52" font-size="26" font-weight="600" fill="#182338">Transit</text>
      <text x="304" y="56" text-anchor="end" font-family="'SF Mono',Consolas,monospace" font-weight="700" font-size="40" fill="#9a7414">81</text>
      <polyline points="26,98 66,94 106,95 146,88 186,84 226,86 266,76 304,68" fill="none" stroke="#c1922c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(450,706)">
      <rect width="330" height="120" rx="18" fill="#fdfaf2" stroke="#d8d0bc"/>
      <rect width="330" height="8" rx="4" fill="#7b4a8f"/>
      <text x="26" y="52" font-size="26" font-weight="600" fill="#182338">Participation</text>
      <text x="304" y="56" text-anchor="end" font-family="'SF Mono',Consolas,monospace" font-weight="700" font-size="40" fill="#7b4a8f">67</text>
      <polyline points="26,84 66,80 106,86 146,79 186,83 226,78 266,82 304,80" fill="none" stroke="#7b4a8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="90" y="866" font-family="'SF Mono',Consolas,'Liberation Mono',monospace" font-size="22" letter-spacing="3" fill="#45506a">CIVIC DATA · BUDGETS · HOUSING · TRANSIT · PARTICIPATION</text>
</svg>
