<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Sunday Supper — Come hungry. Stay awhile.</title>

  <rect width="1200" height="900" fill="#f6eedd"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#7a2e1f" stroke-width="4"/>
  <rect x="52" y="52" width="1096" height="796" fill="none" stroke="#7a2e1f" stroke-width="1.5"/>

  <!-- plate mark -->
  <g stroke="#7a2e1f" fill="none">
    <circle cx="600" cy="200" r="92" stroke-width="6"/>
    <circle cx="600" cy="200" r="56" stroke-width="3"/>
  </g>
  <!-- candle flame inside plate -->
  <path d="M600 172 c-14 20 -12 34 0 42 c12 -8 14 -22 0 -42 Z" fill="#c8963e"/>
  <rect x="590" y="214" width="20" height="26" rx="4" fill="none" stroke="#7a2e1f" stroke-width="4"/>

  <text x="600" y="368" text-anchor="middle" font-family="Gill Sans, Trebuchet MS, Verdana, sans-serif" font-size="26" font-weight="600" letter-spacing="12" fill="#5d6244">DINNER FROM FIVE</text>

  <text x="600" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#7a2e1f">Sunday Supper</text>

  <text x="600" y="556" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#2e2018">Come hungry. Stay awhile.</text>

  <!-- dotted menu rule -->
  <line x1="240" y1="620" x2="960" y2="620" stroke="#2e2018" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <text x="600" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2e2018" opacity="0.85">Generous seasonal plates · Natural wine · Unhurried evenings</text>

  <!-- table setting -->
  <g stroke="#2e2018" fill="none" stroke-width="4">
    <line x1="240" y1="790" x2="960" y2="790"/>
    <ellipse cx="430" cy="778" rx="86" ry="16"/>
    <ellipse cx="430" cy="774" rx="52" ry="10" stroke-width="2.5"/>
    <ellipse cx="770" cy="778" rx="86" ry="16"/>
    <ellipse cx="770" cy="774" rx="52" ry="10" stroke-width="2.5"/>
    <path d="M562 787 l7 -58 a14 16 0 1 1 28 0 l7 58"/>
    <path d="M624 787 l7 -58 a14 16 0 1 1 28 0 l7 58"/>
  </g>

  <text x="600" y="838" text-anchor="middle" font-family="Gill Sans, Trebuchet MS, Verdana, sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#5d6244">WEDNESDAY – SUNDAY · 212 ALDER STREET</text>
</svg>
