<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Deep Time — gallery poster</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 18px;
      padding: 24px;
      background: #0d0f14;
      color: #b6ae9f;
      font-family: "Avenir Next", "Segoe UI", Roboto, Arial, sans-serif;
      box-sizing: border-box;
    }
    figure { margin: 0; width: min(100%, 900px); }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 1px solid rgba(236, 228, 214, 0.16);
    }
    figcaption {
      margin-top: 12px;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Deep Time gallery poster: a spiral ammonite over layered rock strata.">
    <figcaption>Deep Time — 4:3 gallery poster (1200 × 900)</figcaption>
  </figure>
</body>
</html>
