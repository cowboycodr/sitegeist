<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pt">
  <title id="pt">Sonnet Ceramics — Objects for slower rooms</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8795a"/>
      <stop offset="1" stop-color="#9a5439"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b49a"/>
      <stop offset="1" stop-color="#8b9a7c"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d3b5"/>
      <stop offset="1" stop-color="#c9a878"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#d9c9ae" stroke-width="3"/>

  <!-- sun -->
  <circle cx="920" cy="240" r="110" fill="#e6b98a" opacity="0.7"/>

  <!-- shelf -->
  <rect x="140" y="640" width="920" height="14" rx="7" fill="#c9b79a"/>

  <!-- tall bottle -->
  <path d="M300 322h44c-4 36 0 52 16 76 24 36 36 72 36 122 0 74-44 120-74 120s-74-46-74-120c0-50 12-86 36-122 16-24 20-40 16-76Z" fill="url(#clay)"/>
  <path d="M266 420c-18 30-26 60-26 96" fill="none" stroke="#e8c3ab" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="322" cy="662" rx="86" ry="12" fill="#8f5238" opacity="0.25"/>

  <!-- wide bowl -->
  <path d="M448 452h300c0 100-56 188-150 188s-150-88-150-188Z" fill="url(#sage)"/>
  <ellipse cx="598" cy="452" rx="150" ry="26" fill="#c4cbb4"/>
  <path d="M486 512c10 52 40 88 76 100" fill="none" stroke="#cfd8c1" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="598" cy="662" rx="120" ry="13" fill="#5f6d53" opacity="0.22"/>

  <!-- small cup -->
  <path d="M796 490h172c0 84-30 150-86 150s-86-66-86-150Z" fill="url(#sand)"/>
  <ellipse cx="882" cy="490" rx="86" ry="18" fill="#f0e2c8"/>
  <path d="M964 528c30 4 46 22 42 44-4 20-26 30-50 26" fill="none" stroke="#c9a878" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="882" cy="662" rx="72" ry="12" fill="#a3855c" opacity="0.28"/>

  <!-- eyebrow -->
  <text x="600" y="130" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="8" fill="#9a5439">MADE IN SMALL EDITIONS</text>

  <!-- title -->
  <text x="600" y="740" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="96" font-weight="600" fill="#33302a">Sonnet Ceramics</text>

  <!-- tagline -->
  <text x="600" y="800" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="38" fill="#5d574c">Objects for slower rooms.</text>

  <!-- rule dots -->
  <circle cx="540" cy="176" r="5" fill="#d3b98f"/>
  <circle cx="600" cy="176" r="5" fill="#b76a4c"/>
  <circle cx="660" cy="176" r="5" fill="#8b9a7c"/>
</svg>
