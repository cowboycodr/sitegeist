<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Fellowship — Back the beautifully unreasonable.">
  <rect width="1200" height="900" fill="#f3eee3"/>

  <!-- contour field -->
  <g fill="none" stroke="#c14d21" stroke-width="3">
    <path d="M-40 810 C 200 720, 420 830, 640 760 S 1060 800, 1240 720"/>
    <path d="M-40 750 C 180 660, 430 770, 660 700 S 1040 740, 1240 650" opacity=".7"/>
    <path d="M-40 690 C 170 610, 440 710, 680 640 S 1020 680, 1240 580" opacity=".5"/>
    <path d="M-40 630 C 160 560, 450 650, 700 580 S 1000 620, 1240 510" opacity=".35"/>
    <path d="M-40 570 C 150 510, 460 590, 720 520 S 980 560, 1240 440" opacity=".2"/>
  </g>
  <g fill="#c14d21">
    <circle cx="300" cy="732" r="9"/>
    <circle cx="640" cy="760" r="9"/>
    <circle cx="960" cy="722" r="9"/>
  </g>

  <!-- frame -->
  <rect x="34" y="34" width="1132" height="832" fill="none" stroke="#21201b" stroke-width="3"/>

  <!-- compass glyph -->
  <g transform="translate(96 108)">
    <circle r="42" fill="none" stroke="#c14d21" stroke-width="7"/>
    <path d="M0 -42 V42 M-42 0 H42" stroke="#c14d21" stroke-width="7"/>
    <circle r="14" fill="#c14d21"/>
  </g>

  <!-- eyebrow -->
  <rect x="170" y="102" width="64" height="5" fill="#9c3c17"/>
  <text x="250" y="115" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#9c3c17">PRE-SEED / DEEP SYSTEMS</text>

  <!-- title -->
  <text x="92" y="330" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="150" font-weight="700" letter-spacing="-2" fill="#21201b">Fellowship</text>

  <!-- tagline -->
  <text x="96" y="428" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="52" fill="#21201b">Back the beautifully</text>
  <text x="96" y="496" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="52" font-style="italic" fill="#c14d21">unreasonable.</text>

  <!-- descriptor -->
  <text x="96" y="566" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#565246">An early-stage fund for technical founders</text>
  <text x="96" y="604" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#565246">building ambitious tools for the physical world.</text>

  <!-- category chip -->
  <rect x="900" y="76" width="216" height="52" rx="26" fill="#22372c"/>
  <text x="1008" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#f0ead9">VENTURE STUDIO</text>
</svg>
