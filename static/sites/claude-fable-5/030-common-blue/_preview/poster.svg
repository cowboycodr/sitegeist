<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Common Blue — The ocean belongs to everyone.</title>
  <defs>
    <radialGradient id="sky" cx="20%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#10486b"/>
      <stop offset="55%" stop-color="#0a2e47"/>
      <stop offset="100%" stop-color="#081f33"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- brand mark -->
  <g transform="translate(120 130)" stroke="#8fd8c7" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="52"/>
    <path d="M-42 8c11-9 18-9 29 0s18 9 29 0 18-9 26 0"/>
    <path d="M-32 26c9-8 15-8 23 0s15 8 23 0"/>
  </g>

  <text x="120" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#ffd166" letter-spacing="14" style="text-transform:uppercase">COASTAL ACTION NETWORK</text>

  <text x="114" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" fill="#eef6f4">Common Blue</text>

  <text x="120" y="520" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" fill="#b7cfd9">The ocean belongs to <tspan fill="#8fd8c7">everyone.</tspan></text>

  <!-- data ticks motif -->
  <g fill="#8fd8c7" opacity="0.9">
    <rect x="120" y="600" width="26" height="34" rx="4"/>
    <rect x="160" y="586" width="26" height="48" rx="4"/>
    <rect x="200" y="568" width="26" height="66" rx="4"/>
    <rect x="240" y="544" width="26" height="90" rx="4"/>
    <rect x="280" y="520" width="26" height="114" rx="4" fill="#ffd166"/>
  </g>
  <text x="340" y="612" font-family="Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#b7cfd9">Projects · Field data · Volunteers</text>

  <!-- layered waves -->
  <path d="M0 700c100-42 200-42 300 0s200 42 300 0 200-42 300 0 200 42 300 0v200H0z" fill="#0b3c5d" opacity="0.55"/>
  <path d="M0 748c100-34 200-34 300 0s200 34 300 0 200-34 300 0 200 34 300 0v152H0z" fill="#0a2e47" opacity="0.85"/>
  <path d="M0 800c100-26 200-26 300 0s200 26 300 0 200-26 300 0 200 26 300 0v100H0z" fill="#081f33"/>
  <path d="M0 700c100-42 200-42 300 0s200 42 300 0 200-42 300 0 200 42 300 0" fill="none" stroke="#8fd8c7" stroke-width="4" opacity="0.7"/>
</svg>
