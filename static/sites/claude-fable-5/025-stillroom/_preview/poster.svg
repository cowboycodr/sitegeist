<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Stillroom — a quieter place inside your day</title>

  <defs>
    <radialGradient id="paper" cx="35%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#f6f2e9"/>
      <stop offset="100%" stop-color="#e9e2d1"/>
    </radialGradient>
    <radialGradient id="vessel" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#a7bcab"/>
      <stop offset="100%" stop-color="#2e4a3d"/>
    </radialGradient>
    <radialGradient id="glowSage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9db3a2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9db3a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowClay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0714f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b0714f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>

  <!-- ambient orbs -->
  <circle cx="150" cy="120" r="360" fill="url(#glowSage)"/>
  <circle cx="1090" cy="640" r="420" fill="url(#glowClay)"/>
  <circle cx="980" cy="90" r="260" fill="url(#glowSage)"/>

  <!-- breathing vessel motif -->
  <g transform="translate(830 430)">
    <circle r="300" fill="none" stroke="#24352d" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="240" fill="none" stroke="#24352d" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
    <circle r="178" fill="url(#vessel)"/>
    <circle r="178" fill="none" stroke="#24352d" stroke-opacity="0.15" stroke-width="2"/>
    <text y="-6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f3efe6">Breathe in</text>
    <text y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="6" fill="#f3efe6" fill-opacity="0.8">5 · 5</text>
  </g>

  <!-- text block -->
  <g transform="translate(96 300)">
    <text font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" letter-spacing="7" fill="#94573a">DAILY PRACTICES FOR CALM</text>
    <text y="118" font-family="Georgia, 'Times New Roman', serif" font-size="118" fill="#2e4a3d">Stillroom</text>
    <text y="192" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#4d5e54">A quieter place</text>
    <text y="248" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#4d5e54">inside your day.</text>
    <line x1="4" y1="300" x2="248" y2="300" stroke="#9db3a2" stroke-width="4"/>
    <text y="352" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="26" fill="#4d5e54">Breathwork &#183; Meditation &#183; Spacious pacing</text>
  </g>

  <!-- footer band -->
  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#4d5e54">
    <text x="96" y="828">Resonant tide &#183; Box breathing &#183; Long exhale &#183; Grounding</text>
    <text x="1104" y="828" text-anchor="end" letter-spacing="4" fill="#94573a">WELLNESS</text>
  </g>

  <rect x="24" y="24" width="1152" height="852" rx="28" fill="none" stroke="#24352d" stroke-opacity="0.16" stroke-width="2"/>
</svg>
