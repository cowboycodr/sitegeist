<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Lumen Ark — Buildings shaped by light</title>
  <desc id="d">A pale arched hall with a golden sun and a beam of light, above the studio name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#f3e3c2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b84f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8b84f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#faf5ea"/>
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#2a2620" stroke-width="4"/>

  <!-- Arched hall vignette -->
  <rect x="330" y="110" width="540" height="470" fill="url(#sky)" stroke="#2a2620" stroke-width="4"/>
  <path d="M400 580 V330 A200 200 0 0 1 800 330 V580 Z" fill="#f8f2e6" stroke="#2a2620" stroke-width="3.5"/>
  <path d="M440 580 V340 A160 160 0 0 1 760 340 V580" fill="none" stroke="#2a2620" stroke-width="1.8"/>
  <line x1="600" y1="145" x2="600" y2="580" stroke="#2a2620" stroke-width="1.8"/>
  <line x1="470" y1="430" x2="730" y2="430" stroke="#2a2620" stroke-width="1.4"/>
  <line x1="455" y1="510" x2="745" y2="510" stroke="#2a2620" stroke-width="1.4"/>
  <circle cx="712" cy="222" r="38" fill="#e8b84f"/>
  <path d="M680 244 L440 580 H790 Z" fill="url(#beam)"/>
  <path d="M360 210 A250 250 0 0 1 840 210" fill="none" stroke="#c9973f" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="600" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="104" letter-spacing="6" fill="#2a2620">Lumen Ark</text>
  <line x1="470" y1="736" x2="730" y2="736" stroke="#c9973f" stroke-width="3"/>
  <text x="600" y="782" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="9" fill="#5c554a">BUILDINGS SHAPED BY LIGHT</text>
  <text x="600" y="826" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="21" letter-spacing="7" fill="#c9973f">ARCHITECTURE · COPENHAGEN</text>
</svg>
