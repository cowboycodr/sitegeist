<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Drift — poster preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06050f; padding: 2rem; box-sizing: border-box; }
  img { max-width: min(900px, 100%); height: auto; display: block; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border-radius: 8px; }
</style>
</head>
<body>
<img src="poster.svg" alt="Drift gallery poster: a crescent moon and breathing orb over night waves, with the tagline 'A softer landing for your day.'" width="1200" height="900">
</body>
