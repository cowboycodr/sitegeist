<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Paloma — wood fire, citrus, late nights. Restaurant in Roma Norte, Mexico City.">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#e2622b" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#e2622b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2622b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#f2b134" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f2b134" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#1c1310"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- citrus wheel -->
  <g transform="translate(880 300)">
    <circle r="235" fill="none" stroke="#f2b134" stroke-width="3" opacity="0.5"/>
    <circle r="185" fill="#8c3216"/>
    <g stroke="#f2b134" stroke-width="4" opacity="0.85">
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-160" y1="0" x2="160" y2="0"/>
      <line x1="-113" y1="-113" x2="113" y2="113"/>
      <line x1="113" y1="-113" x2="-113" y2="113"/>
    </g>
    <circle r="185" fill="none" stroke="#f2b134" stroke-width="7"/>
    <circle r="30" fill="#f2b134"/>
  </g>

  <!-- dove -->
  <g transform="translate(760 430) scale(1.35)" fill="#f6e9d8">
    <path d="M110 330c30-6 52-26 60-62 8 28 2 50-9 66 16-4 44-18 64-52 22-37 44-38 60-31-15 4-23 12-30 30-11 29-33 58-74 69-22 6-52 0-71-20Z" transform="translate(-110 -230)"/>
    <circle cx="182" cy="13" r="5"/>
  </g>

  <!-- frame -->
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#f6e9d8" stroke-opacity="0.28" stroke-width="2"/>

  <!-- text -->
  <text x="96" y="200" fill="#f2b134" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9" style="text-transform:uppercase">MEXICO CITY / ROMA NORTE</text>
  <text x="90" y="430" fill="#f6e9d8" font-family="Georgia, 'Times New Roman', serif" font-size="210">Paloma</text>
  <text x="96" y="530" fill="#e2622b" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52">Wood fire, citrus, late nights.</text>
  <text x="96" y="640" fill="#cbb8a3" font-family="Georgia, 'Times New Roman', serif" font-size="34">Coastal plates, mezcal, and warm evenings</text>
  <text x="96" y="690" fill="#cbb8a3" font-family="Georgia, 'Times New Roman', serif" font-size="34">around the fire.</text>

  <!-- footer rule + mark -->
  <line x1="96" y1="778" x2="1104" y2="778" stroke="#f6e9d8" stroke-opacity="0.28" stroke-width="2"/>
  <text x="96" y="826" fill="#f2b134" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6">CALLE COLIMA 214</text>
  <text x="1104" y="826" text-anchor="end" fill="#f2b134" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6">RESTAURANT</text>
</svg>
