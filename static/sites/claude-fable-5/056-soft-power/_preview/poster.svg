<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Soft Power — The ideas shaping how we live.</title>

  <!-- Paper ground -->
  <rect width="1200" height="900" fill="#f6f1e7"/>
  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#1d1a16" stroke-width="3"/>

  <!-- Motif: overlapping soft circles -->
  <g>
    <circle cx="880" cy="430" r="300" fill="none" stroke="#1d1a16" stroke-width="3"/>
    <circle cx="800" cy="390" r="185" fill="#e8a598" opacity="0.9"/>
    <circle cx="965" cy="475" r="155" fill="#d9b04c" opacity="0.85"/>
    <circle cx="910" cy="345" r="92" fill="#1d1a16"/>
    <path d="M640 610 Q880 510 1120 610" fill="none" stroke="#1d1a16" stroke-width="3"/>
  </g>

  <!-- Eyebrow -->
  <rect x="90" y="150" width="52" height="4" fill="#d07a68"/>
  <text x="160" y="160" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="6" fill="#d07a68">ISSUE NO. 12</text>

  <!-- Wordmark -->
  <text x="86" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-style="italic" fill="#1d1a16">Soft</text>
  <text x="86" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="bold" letter-spacing="8" fill="#1d1a16">POWER</text>

  <!-- Tagline -->
  <text x="90" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#4c463c">The ideas shaping</text>
  <text x="90" y="636" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#4c463c">how we <tspan fill="#d07a68">live</tspan>.</text>

  <!-- Baseline band -->
  <rect x="30" y="750" width="1140" height="120" fill="#1d1a16"/>
  <text x="90" y="822" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" letter-spacing="5" fill="#f6f1e7">CULTURE MAGAZINE</text>
  <text x="1110" y="822" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#e8a598">Taste · Influence · Design · Identity</text>
</svg>
