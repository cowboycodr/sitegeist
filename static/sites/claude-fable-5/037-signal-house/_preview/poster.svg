<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Signal House — Make noise worth hearing.">
  <rect width="1200" height="900" fill="#0d0d0f"/>

  <!-- top rule + eyebrow -->
  <rect x="90" y="96" width="1020" height="4" fill="#2a2a2e"/>
  <text x="90" y="150" font-family="Futura, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#d8f232">INDEPENDENT CREATIVE STUDIO</text>

  <!-- title -->
  <text x="84" y="330" font-family="Futura, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="168" font-weight="800" letter-spacing="-2" fill="#f4f4ee">SIGNAL</text>
  <text x="84" y="480" font-family="Futura, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="168" font-weight="800" letter-spacing="-2" fill="#d8f232">HOUSE</text>

  <!-- waveform motif -->
  <g fill="#d8f232">
    <rect x="90"  y="600" width="34" height="60"  rx="6"/>
    <rect x="144" y="570" width="34" height="120" rx="6"/>
    <rect x="198" y="540" width="34" height="180" rx="6"/>
    <rect x="252" y="585" width="34" height="90"  rx="6"/>
    <rect x="306" y="525" width="34" height="210" rx="6"/>
    <rect x="360" y="595" width="34" height="70"  rx="6"/>
    <rect x="414" y="555" width="34" height="150" rx="6"/>
    <rect x="468" y="510" width="34" height="240" rx="6"/>
    <rect x="522" y="580" width="34" height="100" rx="6"/>
    <rect x="576" y="545" width="34" height="170" rx="6"/>
    <rect x="630" y="600" width="34" height="60"  rx="6"/>
    <rect x="684" y="530" width="34" height="200" rx="6"/>
    <rect x="738" y="565" width="34" height="130" rx="6"/>
    <rect x="792" y="590" width="34" height="80"  rx="6"/>
    <rect x="846" y="520" width="34" height="220" rx="6"/>
    <rect x="900" y="575" width="34" height="110" rx="6"/>
    <rect x="954" y="550" width="34" height="160" rx="6"/>
    <rect x="1008" y="598" width="34" height="64" rx="6"/>
    <rect x="1062" y="560" width="34" height="140" rx="6"/>
  </g>
  <g fill="#2a2a2e">
    <rect x="90" y="628" width="1006" height="4"/>
  </g>

  <!-- tagline -->
  <text x="90" y="810" font-family="Futura, 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="2" fill="#f4f4ee">Make noise worth hearing.</text>

  <!-- corner mark -->
  <g fill="#d8f232">
    <rect x="1032" y="118" width="14" height="20"/>
    <rect x="1056" y="104" width="14" height="48"/>
    <rect x="1080" y="112" width="14" height="32"/>
  </g>
</svg>
