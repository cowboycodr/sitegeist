<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Zero Hour — The climate story, without distance.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12211f" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#12211f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12211f" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#12211f"/>

  <!-- Warming stripes motif -->
  <g>
    <rect x="0"    width="72"  height="900" fill="#23566b"/>
    <rect x="72"   width="72"  height="900" fill="#2e6d7d"/>
    <rect x="144"  width="72"  height="900" fill="#3b7f83"/>
    <rect x="216"  width="84"  height="900" fill="#55887a"/>
    <rect x="300"  width="96"  height="900" fill="#7d9070"/>
    <rect x="396"  width="108" height="900" fill="#a98f5d"/>
    <rect x="504"  width="120" height="900" fill="#c77f45"/>
    <rect x="624"  width="144" height="900" fill="#d76a34"/>
    <rect x="768"  width="168" height="900" fill="#e4552b"/>
    <rect x="936"  width="144" height="900" fill="#c53f1d"/>
    <rect x="1080" width="120" height="900" fill="#9c2c12"/>
  </g>
  <rect width="1200" height="900" fill="url(#fade)"/>

  <!-- Plate -->
  <rect x="90" y="150" width="1020" height="600" fill="#f4f0e6"/>
  <rect x="90" y="150" width="1020" height="600" fill="none" stroke="#14201d" stroke-width="6"/>
  <rect x="110" y="170" width="980" height="560" fill="none" stroke="#14201d" stroke-width="2"/>

  <!-- Brand mark: a clock face at the last minute -->
  <g transform="translate(600,286)">
    <circle r="62" fill="#e4552b"/>
    <circle r="62" fill="none" stroke="#14201d" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#14201d" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-14" y2="-38" stroke="#14201d" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#14201d"/>
  </g>

  <text x="600" y="404" text-anchor="middle" font-family="system-ui, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" letter-spacing="10" fill="#b23a17" font-weight="700">REPORTING FROM THE THRESHOLD</text>

  <text x="600" y="512" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="128" font-weight="700" fill="#14201d">Zero Hour</text>

  <line x1="330" y1="556" x2="870" y2="556" stroke="#14201d" stroke-width="3"/>

  <text x="600" y="614" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="38" font-style="italic" fill="#3d4d48">The climate story, without distance.</text>

  <text x="600" y="684" text-anchor="middle" font-family="system-ui, 'Helvetica Neue', Arial, sans-serif"
        font-size="21" letter-spacing="4" fill="#3d4d48">INVESTIGATIONS · LOCAL VOICES · VISUAL EVIDENCE</text>

  <!-- Footer band -->
  <text x="600" y="822" text-anchor="middle" font-family="system-ui, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" letter-spacing="8" fill="#f4f0e6">CLIMATE JOURNALISM · ISSUE 47</text>
</svg>
