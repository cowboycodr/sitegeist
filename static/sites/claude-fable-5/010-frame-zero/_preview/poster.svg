<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Frame Zero — Films that refuse the expected.</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1210"/>
      <stop offset="0.5" stop-color="#0c0b0e"/>
      <stop offset="1" stop-color="#17151b"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3d2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#ember)"/>

  <!-- filmstrip sprocket rails -->
  <g fill="#f2ede3" opacity="0.85">
    <g>
      <rect x="70" y="60" width="34" height="24" rx="5"/>
      <rect x="70" y="130" width="34" height="24" rx="5"/>
      <rect x="70" y="200" width="34" height="24" rx="5"/>
      <rect x="70" y="270" width="34" height="24" rx="5"/>
      <rect x="70" y="340" width="34" height="24" rx="5"/>
      <rect x="70" y="410" width="34" height="24" rx="5"/>
      <rect x="70" y="480" width="34" height="24" rx="5"/>
      <rect x="70" y="550" width="34" height="24" rx="5"/>
      <rect x="70" y="620" width="34" height="24" rx="5"/>
      <rect x="70" y="690" width="34" height="24" rx="5"/>
      <rect x="70" y="760" width="34" height="24" rx="5"/>
      <rect x="70" y="820" width="34" height="24" rx="5"/>
    </g>
    <g>
      <rect x="1096" y="60" width="34" height="24" rx="5"/>
      <rect x="1096" y="130" width="34" height="24" rx="5"/>
      <rect x="1096" y="200" width="34" height="24" rx="5"/>
      <rect x="1096" y="270" width="34" height="24" rx="5"/>
      <rect x="1096" y="340" width="34" height="24" rx="5"/>
      <rect x="1096" y="410" width="34" height="24" rx="5"/>
      <rect x="1096" y="480" width="34" height="24" rx="5"/>
      <rect x="1096" y="550" width="34" height="24" rx="5"/>
      <rect x="1096" y="620" width="34" height="24" rx="5"/>
      <rect x="1096" y="690" width="34" height="24" rx="5"/>
      <rect x="1096" y="760" width="34" height="24" rx="5"/>
      <rect x="1096" y="820" width="34" height="24" rx="5"/>
    </g>
  </g>

  <!-- countdown-leader circle with giant zero -->
  <g>
    <circle cx="600" cy="400" r="250" fill="none" stroke="#f2ede3" stroke-opacity="0.25" stroke-width="3"/>
    <circle cx="600" cy="400" r="212" fill="none" stroke="#f2ede3" stroke-opacity="0.16" stroke-width="2"/>
    <line x1="600" y1="120" x2="600" y2="680" stroke="#f2ede3" stroke-opacity="0.12" stroke-width="2"/>
    <line x1="320" y1="400" x2="880" y2="400" stroke="#f2ede3" stroke-opacity="0.12" stroke-width="2"/>
    <text x="600" y="400" text-anchor="middle" dominant-baseline="central"
          font-family="Georgia, 'Times New Roman', serif" font-size="430" font-weight="700"
          fill="#ff3d2e">0</text>
  </g>

  <!-- strand color ticks -->
  <g>
    <rect x="440" y="668" width="70" height="10" fill="#ffb454"/>
    <rect x="522" y="668" width="70" height="10" fill="#7fd1c3"/>
    <rect x="604" y="668" width="70" height="10" fill="#b39dff"/>
    <rect x="686" y="668" width="70" height="10" fill="#ff7ab0"/>
  </g>

  <!-- titles -->
  <text x="600" y="742" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700"
        fill="#f2ede3">Frame Zero</text>
  <text x="600" y="800" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" letter-spacing="8"
        fill="#c9c3b6">FILMS THAT REFUSE THE EXPECTED</text>
  <text x="600" y="96" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10"
        fill="#ff3d2e">INDEPENDENT CINEMA</text>

  <!-- outer frame -->
  <rect x="34" y="30" width="1132" height="840" fill="none" stroke="#ff3d2e" stroke-width="4"/>
</svg>
