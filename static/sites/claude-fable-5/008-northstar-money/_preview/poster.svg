<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Northstar — A clearer way to grow wealth.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091629"/>
      <stop offset="1" stop-color="#0d1f38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b64c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e8b64c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- faint star field -->
  <g fill="#eef1f6" opacity="0.5">
    <circle cx="140" cy="120" r="2.5"/>
    <circle cx="320" cy="80" r="1.8"/>
    <circle cx="520" cy="150" r="2.2"/>
    <circle cx="720" cy="70" r="1.6"/>
    <circle cx="880" cy="180" r="2.4"/>
    <circle cx="1060" cy="90" r="1.8"/>
    <circle cx="230" cy="240" r="1.5"/>
    <circle cx="640" cy="230" r="1.7"/>
    <circle cx="1120" cy="260" r="1.5"/>
    <circle cx="80" cy="360" r="1.6"/>
  </g>

  <!-- horizontal grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="100" y1="420" x2="1100" y2="420"/>
    <line x1="100" y1="510" x2="1100" y2="510"/>
    <line x1="100" y1="600" x2="1100" y2="600"/>
    <line x1="100" y1="690" x2="1100" y2="690"/>
  </g>

  <!-- growth curve rising toward the star -->
  <path d="M100 740 C 340 726, 520 670, 700 560 C 850 468, 940 380, 1010 288 L 1010 780 L 100 780 Z" fill="url(#glow)"/>
  <path d="M100 740 C 340 726, 520 670, 700 560 C 850 468, 940 380, 1010 288" fill="none" stroke="#e8b64c" stroke-width="9" stroke-linecap="round"/>

  <!-- north star -->
  <g transform="translate(1010 232)">
    <path d="M0 -74 L14 -14 L74 0 L14 14 L0 74 L-14 14 L-74 0 L-14 -14 Z" fill="#e8b64c"/>
    <circle r="9" fill="#0d1f38"/>
  </g>

  <!-- brand block -->
  <text x="100" y="176" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#7fb3ae">INVESTING, SIMPLIFIED</text>
  <text x="96" y="292" font-family="Georgia, Times New Roman, serif" font-size="132" font-weight="700" fill="#f7f5ef">Northstar</text>
  <text x="100" y="368" font-family="Georgia, Times New Roman, serif" font-size="42" font-style="italic" fill="#c3ccdb">A clearer way to grow wealth.</text>

  <!-- footer rule and category -->
  <line x1="100" y1="812" x2="1100" y2="812" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <text x="100" y="856" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#b9c3d4">FINTECH</text>
  <text x="1100" y="856" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#e8b64c">NORTHSTAR.MONEY</text>
</svg>
