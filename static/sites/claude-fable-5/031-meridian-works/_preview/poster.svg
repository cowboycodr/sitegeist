<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Meridian Works — Time, engineered into character.</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#1a2129"/>
      <stop offset="60%" stop-color="#10151a"/>
      <stop offset="100%" stop-color="#090c0f"/>
    </radialGradient>
    <radialGradient id="face" cx="38%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#232b33"/>
      <stop offset="70%" stop-color="#161c22"/>
      <stop offset="100%" stop-color="#0e1216"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9ae"/>
      <stop offset="45%" stop-color="#c8a35a"/>
      <stop offset="100%" stop-color="#7d6231"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#c8a35a" stroke-width="2" opacity="0.55"/>

  <!-- faint meridian line -->
  <line x1="600" y1="28" x2="600" y2="872" stroke="#c8a35a" stroke-width="1" opacity="0.18"/>

  <!-- watch dial -->
  <g transform="translate(600 400)">
    <circle r="248" fill="url(#metal)"/>
    <circle r="232" fill="#0b0e11"/>
    <circle r="224" fill="url(#face)"/>

    <!-- hour ticks -->
    <g stroke="#c8a35a" stroke-width="4">
      <line y1="-216" y2="-194"/>
      <line y1="-216" y2="-194" transform="rotate(30)"/>
      <line y1="-216" y2="-194" transform="rotate(60)"/>
      <line y1="-216" y2="-194" transform="rotate(90)"/>
      <line y1="-216" y2="-194" transform="rotate(120)"/>
      <line y1="-216" y2="-194" transform="rotate(150)"/>
      <line y1="-216" y2="-194" transform="rotate(180)"/>
      <line y1="-216" y2="-194" transform="rotate(210)"/>
      <line y1="-216" y2="-194" transform="rotate(240)"/>
      <line y1="-216" y2="-194" transform="rotate(270)"/>
      <line y1="-216" y2="-194" transform="rotate(300)"/>
      <line y1="-216" y2="-194" transform="rotate(330)"/>
    </g>
    <!-- minute ticks -->
    <g stroke="#8b93a0" stroke-width="1.6">
      <line y1="-216" y2="-206" transform="rotate(6)"/>
      <line y1="-216" y2="-206" transform="rotate(12)"/>
      <line y1="-216" y2="-206" transform="rotate(18)"/>
      <line y1="-216" y2="-206" transform="rotate(24)"/>
      <line y1="-216" y2="-206" transform="rotate(36)"/>
      <line y1="-216" y2="-206" transform="rotate(42)"/>
      <line y1="-216" y2="-206" transform="rotate(48)"/>
      <line y1="-216" y2="-206" transform="rotate(54)"/>
      <line y1="-216" y2="-206" transform="rotate(66)"/>
      <line y1="-216" y2="-206" transform="rotate(72)"/>
      <line y1="-216" y2="-206" transform="rotate(78)"/>
      <line y1="-216" y2="-206" transform="rotate(84)"/>
      <line y1="-216" y2="-206" transform="rotate(96)"/>
      <line y1="-216" y2="-206" transform="rotate(102)"/>
      <line y1="-216" y2="-206" transform="rotate(108)"/>
      <line y1="-216" y2="-206" transform="rotate(114)"/>
      <line y1="-216" y2="-206" transform="rotate(126)"/>
      <line y1="-216" y2="-206" transform="rotate(132)"/>
      <line y1="-216" y2="-206" transform="rotate(138)"/>
      <line y1="-216" y2="-206" transform="rotate(144)"/>
      <line y1="-216" y2="-206" transform="rotate(156)"/>
      <line y1="-216" y2="-206" transform="rotate(162)"/>
      <line y1="-216" y2="-206" transform="rotate(168)"/>
      <line y1="-216" y2="-206" transform="rotate(174)"/>
      <line y1="-216" y2="-206" transform="rotate(186)"/>
      <line y1="-216" y2="-206" transform="rotate(192)"/>
      <line y1="-216" y2="-206" transform="rotate(198)"/>
      <line y1="-216" y2="-206" transform="rotate(204)"/>
      <line y1="-216" y2="-206" transform="rotate(216)"/>
      <line y1="-216" y2="-206" transform="rotate(222)"/>
      <line y1="-216" y2="-206" transform="rotate(228)"/>
      <line y1="-216" y2="-206" transform="rotate(234)"/>
      <line y1="-216" y2="-206" transform="rotate(246)"/>
      <line y1="-216" y2="-206" transform="rotate(252)"/>
      <line y1="-216" y2="-206" transform="rotate(258)"/>
      <line y1="-216" y2="-206" transform="rotate(264)"/>
      <line y1="-216" y2="-206" transform="rotate(276)"/>
      <line y1="-216" y2="-206" transform="rotate(282)"/>
      <line y1="-216" y2="-206" transform="rotate(288)"/>
      <line y1="-216" y2="-206" transform="rotate(294)"/>
      <line y1="-216" y2="-206" transform="rotate(306)"/>
      <line y1="-216" y2="-206" transform="rotate(312)"/>
      <line y1="-216" y2="-206" transform="rotate(318)"/>
      <line y1="-216" y2="-206" transform="rotate(324)"/>
      <line y1="-216" y2="-206" transform="rotate(336)"/>
      <line y1="-216" y2="-206" transform="rotate(342)"/>
      <line y1="-216" y2="-206" transform="rotate(348)"/>
      <line y1="-216" y2="-206" transform="rotate(354)"/>
    </g>

    <text y="-96" text-anchor="middle" fill="#ece5d8" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" letter-spacing="8">MERIDIAN</text>
    <text y="-70" text-anchor="middle" fill="#8b93a0" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4">WORKS · CAL. MW-01</text>
    <text y="152" text-anchor="middle" fill="#8b93a0" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.5">SWISS LEVER · 28 800 A/H</text>

    <!-- hands at 10:09:36 -->
    <g transform="rotate(304.8)">
      <path d="M -6 24 L -6 -88 L 0 -116 L 6 -88 L 6 24 Z" fill="#ece5d8"/>
    </g>
    <g transform="rotate(57.6)">
      <path d="M -4.6 28 L -4.6 -144 L 0 -180 L 4.6 -144 L 4.6 28 Z" fill="#ece5d8"/>
    </g>
    <g transform="rotate(216)">
      <line y1="42" y2="-194" stroke="#c8a35a" stroke-width="3.2"/>
      <circle cy="32" r="9" fill="#c8a35a"/>
    </g>
    <circle r="7.5" fill="#c8a35a"/>
    <circle r="2.8" fill="#0b0e11"/>
  </g>

  <!-- type block -->
  <text x="600" y="742" text-anchor="middle" fill="#ece5d8" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="64" letter-spacing="3">Meridian Works</text>
  <line x1="440" y1="772" x2="760" y2="772" stroke="#7d6231" stroke-width="1.5"/>
  <text x="600" y="812" text-anchor="middle" fill="#c8a35a" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6">TIME, ENGINEERED INTO CHARACTER.</text>
  <text x="600" y="852" text-anchor="middle" fill="#8b93a0" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4">INDEPENDENT WATCHMAKING · LA CHAUX-DE-FONDS</text>
</svg>
