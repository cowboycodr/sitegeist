<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tideline Supply poster — sun over layered ocean waves with the tagline Made for water without walls">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e4f56"/>
      <stop offset="1" stop-color="#146b74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="880" cy="240" r="130" fill="#f1d9ac"/>
  <circle cx="880" cy="240" r="160" fill="none" stroke="#f1d9ac" stroke-opacity=".35" stroke-width="3"/>

  <!-- layered waves -->
  <path d="M0 560c150-70 300-70 450 0s300 70 450 0 200-60 300-30v370H0Z" fill="#1d7f83"/>
  <path d="M0 640c150-56 300-56 450 0s300 56 450 0 200-48 300-24v284H0Z" fill="#146b74" opacity=".9"/>
  <path d="M0 700c150-46 300-46 450 0s300 46 450 0 200-40 300-20v220H0Z" fill="#0e4f56"/>
  <path d="M0 780c150-36 300-36 450 0s300 36 450 0 200-32 300-16v136H0Z" fill="#0d2431"/>

  <!-- foam accents -->
  <path d="M40 566c60-24 120-24 180 0" fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <path d="M520 560c60-24 120-24 180 0" fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <path d="M300 648c50-20 100-20 150 0" fill="none" stroke="#c9a36a" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <path d="M860 640c50-20 100-20 150 0" fill="none" stroke="#c9a36a" stroke-width="6" stroke-linecap="round" opacity=".6"/>

  <!-- eyebrow -->
  <rect x="330" y="96" width="540" height="58" rx="29" fill="none" stroke="#f1d9ac" stroke-opacity=".6" stroke-width="2"/>
  <text x="600" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#f1d9ac">PACIFIC FIELD GOODS</text>

  <!-- title -->
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" fill="#f4efe6">Tideline</text>
  <text x="600" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" fill="#f4efe6">Supply</text>

  <!-- tagline -->
  <text x="600" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="40" fill="#f1d9ac">Made for water without walls.</text>

  <!-- divider -->
  <path d="M480 500c30-16 60-16 90 0s60 16 90 0 45-12 60-6" fill="none" stroke="#c9a36a" stroke-width="5" stroke-linecap="round"/>
</svg>
