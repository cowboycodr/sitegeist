<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Common Thread — Clothes with a longer story">
  <rect width="1200" height="900" fill="#f3eee4"/>
  <rect x="36" y="36" width="1128" height="828" rx="28" fill="none" stroke="#c9bda4" stroke-width="4" stroke-dasharray="18 14"/>

  <!-- running stitch across the poster -->
  <path d="M80 640 C 320 560 520 720 760 620 S 1080 560 1120 600" fill="none" stroke="#a8542c" stroke-width="6" stroke-dasharray="26 20" stroke-linecap="round"/>

  <!-- garment motif -->
  <g transform="translate(790 250)">
    <rect x="-40" y="-60" width="380" height="380" rx="26" fill="#e9e1d1"/>
    <path d="M90 30 l60 -28 60 28 28 42 -38 22 v126 h-100 v-126 l-38 -22 z" fill="#faf7f0" stroke="#26211a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M124 6 q26 32 52 0" fill="none" stroke="#26211a" stroke-width="7" stroke-linecap="round"/>
    <path d="M110 108 h80 M110 132 h80" stroke="#c9bda4" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>
    <!-- spool -->
    <g transform="translate(216 190)">
      <rect x="0" y="10" width="72" height="84" rx="12" fill="#a8542c" stroke="#26211a" stroke-width="6"/>
      <rect x="-8" y="0" width="88" height="16" rx="8" fill="#8c4322" stroke="#26211a" stroke-width="6"/>
      <rect x="-8" y="90" width="88" height="16" rx="8" fill="#8c4322" stroke="#26211a" stroke-width="6"/>
      <path d="M2 36 h68 M2 54 h68 M2 72 h68" stroke="#f3eee4" stroke-width="4.5"/>
    </g>
    <path d="M216 240 C 150 240 132 200 132 172" fill="none" stroke="#a8542c" stroke-width="6" stroke-dasharray="14 11" stroke-linecap="round"/>
    <circle cx="132" cy="172" r="8" fill="#a8542c"/>
  </g>

  <!-- text block -->
  <g fill="#26211a">
    <g>
      <rect x="96" y="150" width="196" height="52" rx="26" fill="none" stroke="#a8542c" stroke-width="3"/>
      <text x="194" y="184" text-anchor="middle" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22" letter-spacing="6" fill="#8c4322">EDITION 04</text>
    </g>
    <text x="92" y="310" font-family="Georgia,'Times New Roman',serif" font-size="104" letter-spacing="-2">Common</text>
    <text x="92" y="420" font-family="Georgia,'Times New Roman',serif" font-size="104" letter-spacing="-2">Thread</text>
    <text x="96" y="500" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="34" fill="#5b5344">Clothes with a longer story.</text>
  </g>

  <!-- footer line -->
  <g font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" fill="#5b6b4a">
    <text x="96" y="780" letter-spacing="3">TRACEABLE FIBERS</text>
    <text x="430" y="780" letter-spacing="3">SEASONLESS ESSENTIALS</text>
    <text x="850" y="780" letter-spacing="3">MADE TO MEND</text>
  </g>
  <circle cx="400" cy="772" r="5" fill="#a8542c"/>
  <circle cx="820" cy="772" r="5" fill="#a8542c"/>
</svg>
