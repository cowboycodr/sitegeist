<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Kintsu — Care for the life between appointments</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcae52"/>
      <stop offset="1" stop-color="#a87c2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f7f2e9"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#ddd0bb" stroke-width="2"/>

  <!-- mended vessel motif -->
  <g transform="translate(600 330)">
    <circle r="216" fill="#efe6d7"/>
    <circle r="216" fill="none" stroke="#d9cbb4" stroke-width="3"/>
    <path d="M0 -216 C -26 -128, 52 -90, -6 0 C -50 70, 44 116, 0 216"
          fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-178 38 C -100 26, -62 52, -6 2 C 50 -44, 116 -20, 180 -46"
          fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-6" cy="1" r="10" fill="#c8973f"/>
    <circle cx="0" cy="-216" r="6" fill="#c8973f"/>
    <circle cx="0" cy="216" r="6" fill="#c8973f"/>
    <circle cx="-178" cy="38" r="6" fill="#c8973f"/>
    <circle cx="180" cy="-46" r="6" fill="#c8973f"/>
  </g>

  <text x="600" y="648" text-anchor="middle" fill="#a87c2c"
        font-family="Georgia, 'Times New Roman', serif" font-size="26"
        letter-spacing="8">WHOLE-PERSON MENTAL CARE</text>

  <text x="600" y="742" text-anchor="middle" fill="#2b2723"
        font-family="Georgia, 'Times New Roman', serif" font-size="110"
        font-weight="600" letter-spacing="2">Kintsu</text>

  <path d="M470 776 C 512 770, 556 782, 600 776 C 644 770, 688 782, 730 776"
        fill="none" stroke="#c8973f" stroke-width="4" stroke-linecap="round"/>

  <text x="600" y="828" text-anchor="middle" fill="#5a5248"
        font-family="Georgia, 'Times New Roman', serif" font-size="32"
        font-style="italic">Care for the life between appointments.</text>
</svg>
