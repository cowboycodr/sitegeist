<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pt pd">
  <title id="pt">Crumb Theory</title>
  <desc id="pd">Poster for a neighborhood bakery: a hand-drawn loaf on a cream plate over a warm paper background, with the tagline "A daily study in butter and flour."</desc>

  <rect width="1200" height="900" fill="#fbf6ea"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#33231a" stroke-width="3"/>
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#c9873f" stroke-width="1.5"/>

  <!-- flour speckle -->
  <g fill="#c9873f" opacity=".35">
    <circle cx="140" cy="150" r="4"/><circle cx="1060" cy="180" r="3"/>
    <circle cx="200" cy="740" r="3"/><circle cx="1020" cy="720" r="4"/>
    <circle cx="110" cy="460" r="3"/><circle cx="1090" cy="470" r="3"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="10" fill="#c9873f">BAKED EACH MORNING</text>

  <!-- plate and loaf -->
  <circle cx="600" cy="440" r="215" fill="#f7edda"/>
  <circle cx="600" cy="440" r="215" fill="none" stroke="#33231a" stroke-width="3"/>
  <circle cx="600" cy="440" r="172" fill="none" stroke="#6d4f36" stroke-width="3" stroke-dasharray="2 16"/>
  <path d="M478 470c0-62 55-105 122-105s122 43 122 105c0 26-17 47-49 47H527c-32 0-49-21-49-47Z" fill="#c9873f"/>
  <path d="M478 470c0-62 55-105 122-105s122 43 122 105c0 26-17 47-49 47H527c-32 0-49-21-49-47Z" fill="none" stroke="#33231a" stroke-width="6"/>
  <path d="M538 428l15 36M600 417v43M662 428l-15 36" stroke="#33231a" stroke-width="7" stroke-linecap="round"/>
  <path d="M508 485c28 13 156 13 184 0" fill="none" stroke="#33231a" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <g fill="#33231a" opacity=".8">
    <circle cx="520" cy="560" r="5"/><circle cx="560" cy="575" r="4"/>
    <circle cx="625" cy="572" r="5"/><circle cx="675" cy="558" r="4"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="750" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="bold" fill="#33231a">Crumb Theory</text>
  <line x1="380" y1="782" x2="820" y2="782" stroke="#c9873f" stroke-width="3"/>
  <text x="600" y="822" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#6d4f36">A daily study in butter and flour.</text>
</svg>
