<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Blue Hour Club</title>
  <desc id="d">Gallery poster: a brass moon over a midnight Chicago skyline with the club's name and tagline.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a3f"/>
      <stop offset=".55" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#070d1f"/>
    </linearGradient>
    <radialGradient id="moon" cx=".35" cy=".35" r=".9">
      <stop offset="0" stop-color="#f4ead2"/>
      <stop offset="1" stop-color="#cdb98c"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0c471" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0c471" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="930" cy="200" r="170" fill="url(#glow)"/>
  <circle cx="930" cy="200" r="72" fill="url(#moon)"/>

  <!-- Skyline -->
  <g fill="#0b1430">
    <rect x="0" y="640" width="90" height="260"/>
    <rect x="100" y="560" width="70" height="340"/>
    <rect x="180" y="680" width="110" height="220"/>
    <rect x="300" y="600" width="60" height="300"/>
    <rect x="370" y="520" width="90" height="380"/>
    <rect x="470" y="660" width="120" height="240"/>
    <rect x="600" y="490" width="75" height="410"/>
    <rect x="685" y="620" width="100" height="280"/>
    <rect x="795" y="560" width="65" height="340"/>
    <rect x="870" y="660" width="115" height="240"/>
    <rect x="995" y="530" width="80" height="370"/>
    <rect x="1085" y="620" width="115" height="280"/>
  </g>
  <g fill="#d9a441" opacity=".85">
    <rect x="118" y="590" width="6" height="6"/><rect x="140" y="624" width="6" height="6"/>
    <rect x="392" y="550" width="6" height="6"/><rect x="420" y="588" width="6" height="6"/>
    <rect x="618" y="520" width="6" height="6"/><rect x="644" y="556" width="6" height="6"/>
    <rect x="812" y="590" width="6" height="6"/><rect x="1012" y="560" width="6" height="6"/>
    <rect x="1040" y="598" width="6" height="6"/><rect x="1118" y="650" width="6" height="6"/>
  </g>

  <!-- Panel scrim for legibility -->
  <rect x="0" y="330" width="1200" height="330" fill="#070d1f" opacity=".55"/>

  <!-- Mark -->
  <g transform="translate(600 250)">
    <circle r="46" fill="none" stroke="#d9a441" stroke-width="5"/>
    <path d="M0 -46 A46 46 0 0 0 0 46" fill="#d9a441" opacity=".35"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" letter-spacing="14" fill="#d9a441">LIVE IN CHICAGO</text>
  <text x="600" y="512" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="112" fill="#e8ddc8">Blue Hour Club</text>
  <text x="600" y="586" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="40" fill="#f0c471">The city sounds better after midnight.</text>

  <!-- Rule with dots -->
  <g stroke="#22315e" stroke-width="3">
    <line x1="330" y1="640" x2="560" y2="640"/>
    <line x1="640" y1="640" x2="870" y2="640"/>
  </g>
  <g fill="#d9a441">
    <circle cx="585" cy="640" r="5"/>
    <circle cx="615" cy="640" r="5"/>
  </g>

  <text x="600" y="710" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="26" letter-spacing="8" fill="#b8b09a">SEARCHING SETS · RESIDENT ARTISTS · LOW LIGHT</text>
  <text x="600" y="838" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="24" letter-spacing="6" fill="#7a7f95">DOORS 9 PM · SEVEN NIGHTS · 1147 N. LARRABEE</text>

  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#22315e" stroke-width="2"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#d9a441" stroke-width="1" opacity=".5"/>
</svg>
