<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Museum of Small Things — Ordinary objects. Extraordinary stories.">
  <rect width="1200" height="900" fill="#f5f0e6"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#26221c" stroke-width="4"/>
  <rect x="48" y="48" width="1104" height="804" fill="none" stroke="#b08d3f" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="600" y="150" text-anchor="middle" font-family="Verdana, 'Gill Sans', sans-serif" font-size="24" letter-spacing="9" fill="#b08d3f">OPEN COLLECTION · 4,208 OBJECTS</text>

  <!-- Title -->
  <text x="600" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#26221c">Museum of</text>
  <text x="600" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="#7c2f26">Small Things</text>

  <!-- Three plinths with objects -->
  <g stroke="#26221c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- shelf line -->
    <line x1="230" y1="660" x2="970" y2="660" stroke-width="7"/>

    <!-- Button on plinth -->
    <g>
      <rect x="300" y="618" width="120" height="42" fill="#26221c" stroke="none"/>
      <circle cx="360" cy="560" r="44" stroke="#7c2f26"/>
      <circle cx="345" cy="548" r="5" fill="#7c2f26" stroke="none"/>
      <circle cx="375" cy="548" r="5" fill="#7c2f26" stroke="none"/>
      <circle cx="345" cy="574" r="5" fill="#7c2f26" stroke="none"/>
      <circle cx="375" cy="574" r="5" fill="#7c2f26" stroke="none"/>
    </g>

    <!-- Key on taller plinth -->
    <g>
      <rect x="530" y="596" width="140" height="64" fill="#26221c" stroke="none"/>
      <g stroke="#7c2f26">
        <circle cx="570" cy="500" r="24"/>
        <circle cx="570" cy="500" r="9"/>
        <path d="M588 518l44 44"/>
        <path d="M616 546v18h-15"/>
      </g>
    </g>

    <!-- Teacup on plinth -->
    <g>
      <rect x="780" y="618" width="120" height="42" fill="#26221c" stroke="none"/>
      <g stroke="#7c2f26">
        <path d="M800 542h76v28a38 38 0 0 1-76 0z"/>
        <path d="M876 550h14a15 15 0 0 1 0 30h-12"/>
        <path d="M824 542l12 26-9 22" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- Tagline -->
  <text x="600" y="756" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#55503f">Ordinary objects. Extraordinary stories.</text>

  <!-- Accession stamp -->
  <text x="600" y="812" text-anchor="middle" font-family="Verdana, 'Gill Sans', sans-serif" font-size="19" letter-spacing="6" fill="#b08d3f">MST · CULTURE · EST. IN EVERY DRAWER</text>
</svg>
