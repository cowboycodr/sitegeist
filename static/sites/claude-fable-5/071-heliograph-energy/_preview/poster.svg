<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Heliograph — Power, beautifully placed.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#efe0bd"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b544"/>
      <stop offset="1" stop-color="#d97f28"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22372e"/>
      <stop offset="1" stop-color="#101d17"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- radiating heliograph lines -->
  <g stroke="#d99a3f" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="600" y1="120" x2="600" y2="200"/>
    <line x1="380" y1="180" x2="432" y2="244"/>
    <line x1="820" y1="180" x2="768" y2="244"/>
    <line x1="280" y1="360" x2="360" y2="384"/>
    <line x1="920" y1="360" x2="840" y2="384"/>
  </g>

  <!-- sun -->
  <circle cx="600" cy="400" r="168" fill="url(#sun)"/>
  <circle cx="600" cy="400" r="212" fill="none" stroke="#d99a3f" stroke-width="2.5" stroke-dasharray="4 14" opacity="0.7"/>

  <!-- panel field -->
  <g>
    <rect x="270" y="548" width="660" height="150" rx="10" fill="url(#panel)"/>
    <g stroke="#e8dcc2" stroke-width="2" opacity="0.35">
      <line x1="435" y1="548" x2="435" y2="698"/>
      <line x1="600" y1="548" x2="600" y2="698"/>
      <line x1="765" y1="548" x2="765" y2="698"/>
      <line x1="270" y1="623" x2="930" y2="623"/>
    </g>
    <rect x="270" y="548" width="660" height="150" rx="10" fill="none" stroke="#c9822f" stroke-width="3"/>
  </g>

  <!-- ground line -->
  <line x1="150" y1="740" x2="1050" y2="740" stroke="#1c2b23" stroke-width="2" opacity="0.35"/>

  <!-- wordmark -->
  <text x="600" y="808" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#1c2b23" letter-spacing="4">Heliograph</text>
  <text x="600" y="852" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#43554b" letter-spacing="7">POWER, BEAUTIFULLY PLACED.</text>

  <!-- eyebrow -->
  <text x="600" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#c9822f" letter-spacing="6">SOLAR INFRASTRUCTURE / 2026</text>
</svg>
