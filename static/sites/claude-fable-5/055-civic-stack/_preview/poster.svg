<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Civic Stack — Better tools for public life.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#eaf1ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6df0"/>
      <stop offset="1" stop-color="#1c4fd8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="920" cy="450" r="330" fill="#ffffff" opacity="0.7"/>

  <!-- Stacked-layers motif -->
  <g>
    <rect x="700" y="560" width="440" height="92" rx="16" fill="url(#blue)"/>
    <rect x="736" y="592" width="180" height="16" rx="8" fill="#c8d9ff"/>
    <rect x="736" y="618" width="112" height="12" rx="6" fill="#8fb0f7"/>
    <circle cx="1096" cy="606" r="19" fill="#7fd1b9"/>

    <rect x="738" y="436" width="364" height="92" rx="16" fill="#ffffff" stroke="#c8d5f2" stroke-width="3"/>
    <rect x="774" y="468" width="150" height="16" rx="8" fill="#31406b"/>
    <rect x="774" y="494" width="212" height="12" rx="6" fill="#9aa9cc"/>
    <circle cx="1060" cy="482" r="19" fill="#3a6df0"/>

    <rect x="776" y="312" width="288" height="92" rx="16" fill="#7fd1b9"/>
    <rect x="812" y="344" width="132" height="16" rx="8" fill="#0d4a38"/>
    <rect x="812" y="370" width="170" height="12" rx="6" fill="#2f7a63"/>
    <circle cx="1024" cy="358" r="19" fill="#ffffff"/>

    <rect x="826" y="228" width="188" height="54" rx="13" fill="#ffd166"/>
    <rect x="852" y="248" width="104" height="13" rx="6" fill="#7a5b12"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(96 236)">
    <g transform="translate(4 0)">
      <rect x="0" y="42" width="60" height="15" rx="4" fill="#1c4fd8"/>
      <rect x="7" y="21" width="46" height="15" rx="4" fill="#3a6df0"/>
      <rect x="15" y="0" width="30" height="15" rx="4" fill="#7fd1b9"/>
    </g>
    <text x="80" y="48" font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="42" font-weight="800" fill="#17233f" letter-spacing="-0.5">Civic Stack</text>
  </g>

  <text x="100" y="356" font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#1c4fd8">TECHNOLOGY FOR EVERYONE</text>

  <text font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="88" font-weight="800" fill="#17233f" letter-spacing="-2">
    <tspan x="94" y="460">Better tools</tspan>
    <tspan x="94" y="560">for public life.</tspan>
  </text>

  <text font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="30" fill="#5a6a92">
    <tspan x="98" y="632">Open infrastructure for clear, accessible</tspan>
    <tspan x="98" y="674">digital services in every city.</tspan>
  </text>

  <!-- CTA chips -->
  <g font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="26" font-weight="700">
    <rect x="98" y="718" width="316" height="66" rx="33" fill="#1c4fd8"/>
    <text x="256" y="761" text-anchor="middle" fill="#ffffff">Explore the platform</text>
    <rect x="434" y="718" width="290" height="66" rx="33" fill="none" stroke="#1c4fd8" stroke-width="3"/>
    <text x="579" y="761" text-anchor="middle" fill="#1c4fd8">Read case studies</text>
  </g>

  <text x="98" y="846" font-family="Avenir Next, Segoe UI, Trebuchet MS, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#5a6a92">PUBLIC TECHNOLOGY · 214 MEMBER GOVERNMENTS · OPEN SOURCE</text>
</svg>
