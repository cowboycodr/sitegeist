<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Form Haus — Space, reduced to its essence.</title>
  <rect width="1200" height="900" fill="#efece5"/>

  <!-- ground -->
  <rect x="0" y="640" width="1200" height="260" fill="#ddd7cb"/>
  <rect x="90" y="640" width="1020" height="8" fill="#2a2723"/>

  <!-- monolith hall -->
  <rect x="120" y="300" width="330" height="340" fill="#2a2723"/>
  <rect x="168" y="352" width="54" height="288" fill="#efece5"/>
  <rect x="258" y="352" width="54" height="288" fill="#efece5"/>
  <rect x="348" y="352" width="54" height="288" fill="#efece5"/>

  <!-- low pavilion -->
  <rect x="500" y="540" width="330" height="100" fill="#8b8375"/>
  <rect x="520" y="560" width="290" height="80" fill="#efece5"/>
  <rect x="500" y="526" width="330" height="14" fill="#2a2723"/>

  <!-- tower -->
  <rect x="900" y="240" width="150" height="400" fill="#b6ad9d"/>
  <rect x="926" y="276" width="98" height="12" fill="#2a2723"/>
  <rect x="926" y="332" width="98" height="12" fill="#2a2723"/>
  <rect x="926" y="388" width="98" height="12" fill="#2a2723"/>
  <rect x="926" y="444" width="98" height="12" fill="#2a2723"/>
  <rect x="926" y="500" width="98" height="12" fill="#2a2723"/>
  <rect x="926" y="556" width="98" height="12" fill="#2a2723"/>

  <!-- low sun -->
  <circle cx="680" cy="340" r="64" fill="#c1502e"/>

  <!-- masthead -->
  <rect x="90" y="112" width="34" height="34" fill="#c1502e"/>
  <text x="152" y="141" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="12" fill="#2a2723">FORM HAUS</text>
  <text x="90" y="196" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="8" fill="#57524a">ARCHITECTURE · COPENHAGEN</text>

  <!-- tagline -->
  <text x="90" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#2a2723">Space, reduced to its essence.</text>
  <rect x="90" y="822" width="180" height="6" fill="#c1502e"/>
</svg>
