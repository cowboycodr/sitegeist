<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Static Bloom — poster preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0c0a10;
    padding: 2rem;
    box-sizing: border-box;
  }
  img {
    max-width: min(90vw, 900px);
    height: auto;
    display: block;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    border-radius: 8px;
  }
</style>
</head>
<body>
<img src="poster.svg" alt="Static Bloom gallery poster: a chromatic vinyl record on a dark grainy background with the tagline 'Beautiful noise, carefully released.'" width="1200" height="900">
</body>
</html>
