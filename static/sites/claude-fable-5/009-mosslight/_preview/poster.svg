<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pt pd">
  <title id="pt">Mosslight</title>
  <desc id="pd">A lantern-lit cabin among dark fir trees under a pale moon, with the Mosslight wordmark and tagline "Disappear into the green."</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f17"/>
      <stop offset=".55" stop-color="#14372a"/>
      <stop offset="1" stop-color="#1c4a36"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcead9" stop-opacity="0"/>
      <stop offset="1" stop-color="#dcead9" stop-opacity=".4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <circle cx="930" cy="180" r="64" fill="#f2ead2" opacity=".9"/>
  <circle cx="930" cy="180" r="94" fill="#f2ead2" opacity=".08"/>

  <!-- tree lines -->
  <g fill="#0f2b20">
    <path d="M-40 700 140 380 320 700Z"/><path d="M230 700 410 330 590 700Z"/><path d="M700 700 880 360 1060 700Z"/><path d="M960 700 1120 400 1280 700Z"/>
  </g>
  <g fill="#123527">
    <path d="M-80 700 80 460 240 700Z"/><path d="M440 700 610 420 780 700Z"/><path d="M860 700 1020 470 1180 700Z"/>
  </g>
  <g fill="#1a4433">
    <path d="M60 700 210 500 360 700Z"/><path d="M330 700 490 490 650 700Z"/><path d="M1040 700 1180 520 1320 700Z"/>
  </g>

  <rect y="520" width="1200" height="180" fill="url(#mist)"/>

  <!-- cabin -->
  <g>
    <rect x="520" y="560" width="180" height="104" fill="#3b2f24"/>
    <path d="M498 564 610 484 722 564Z" fill="#241c14"/>
    <rect x="588" y="600" width="44" height="64" fill="#0f0c08"/>
    <rect x="540" y="586" width="30" height="30" fill="#f4c96b"/>
    <rect x="650" y="586" width="30" height="30" fill="#f4c96b"/>
    <circle cx="610" cy="620" r="120" fill="#f4c96b" opacity=".07"/>
  </g>

  <!-- ground band -->
  <rect y="700" width="1200" height="200" fill="#0d1f17"/>
  <path d="M0 700h1200v10c-200 14-400-12-600-2s-400 16-600 2Z" fill="#1a4433" opacity=".6"/>

  <!-- fern mark -->
  <g transform="translate(600 742)" stroke="#6fae83" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M0 46V-6"/>
    <path d="M0 6c-9-2-14-9-14-16 7 0 14 5 14 16Zm0 0c9-2 14-9 14-16-7 0-14 5-14 16Z" fill="#6fae83" stroke="none"/>
    <path d="M0 20c-11-2-18-9-18-18 9 0 18 7 18 18Zm0 0c11-2 18-9 18-18-9 0-18 7-18 18Z" fill="#6fae83" stroke="none" opacity=".7"/>
    <path d="M0 34c-13-2-20-9-20-20 10 0 20 8 20 20Zm0 0c13-2 20-9 20-20-10 0-20 8-20 20Z" fill="#6fae83" stroke="none" opacity=".45"/>
  </g>

  <text x="600" y="836" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="4" fill="#f4f1e6">Mosslight</text>
  <text x="600" y="876" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="24" letter-spacing="8" fill="#6fae83">DISAPPEAR INTO THE GREEN</text>
</svg>
