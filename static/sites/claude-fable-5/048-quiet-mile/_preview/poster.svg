<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Quiet Mile — The city, softened. Poster with a line-drawn electric bike.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#ece8df"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#d8d2c4" stroke-width="2"/>

  <!-- skyline haze -->
  <g stroke="#d4cec2" stroke-width="3" fill="none" opacity="0.65">
    <path d="M110 620 v-130 h80 v-60 h56 v190"/>
    <path d="M290 620 v-95 h70 v95"/>
    <path d="M860 620 v-160 h90 v160"/>
    <path d="M990 620 v-110 h72 v-40 h50 v150"/>
    <path d="M400 620 v-55 h60 v55"/>
  </g>
  <line x1="70" y1="640" x2="1130" y2="640" stroke="#cfc8ba" stroke-width="3"/>

  <!-- bike -->
  <g stroke="#2b2b28" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="430" cy="560" r="110"/>
    <circle cx="880" cy="560" r="110"/>
    <circle cx="430" cy="560" r="12" fill="#2b2b28"/>
    <circle cx="880" cy="560" r="12" fill="#2b2b28"/>
    <path d="M430 560 L610 365 L820 365"/>
    <path d="M430 560 L640 560 L610 365"/>
    <path d="M640 560 L820 365"/>
    <path d="M610 365 L592 308"/>
    <path d="M558 305 Q592 293 630 302"/>
    <path d="M880 560 L832 348"/>
    <path d="M832 348 Q829 324 853 315 L898 309"/>
    <circle cx="640" cy="560" r="21"/>
    <path d="M640 560 L679 599"/>
  </g>
  <!-- sage battery line -->
  <rect x="503" y="453" width="145" height="21" rx="10.5" transform="rotate(-42 575 463)" fill="#8a9b7c"/>

  <!-- motion whispers -->
  <g stroke="#8a9b7c" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <line x1="235" y1="538" x2="300" y2="538"/>
    <line x1="210" y1="572" x2="292" y2="572"/>
    <line x1="245" y1="606" x2="305" y2="606"/>
  </g>

  <!-- type -->
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="14" fill="#6e805f">URBAN ELECTRIC MOBILITY</text>
  <text x="600" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#2b2b28">Quiet Mile</text>
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="46" fill="#5c5a52">The city, softened.</text>

  <!-- footer rule and marks -->
  <line x1="470" y1="800" x2="730" y2="800" stroke="#8a9b7c" stroke-width="3"/>
  <text x="600" y="838" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#5c5a52">13.8 KG · 90 KM · &lt;29 DB</text>
</svg>
