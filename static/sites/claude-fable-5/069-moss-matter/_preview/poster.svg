<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Moss &amp; Matter — Materials that return to earth</title>
  <defs>
    <radialGradient id="cap" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8faa6d"/>
      <stop offset="100%" stop-color="#3f5a37"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="900" fill="#f4f0e4"/>
  <rect x="0" y="700" width="1200" height="200" fill="#2c3f26"/>
  <path d="M0 700 C 200 680, 420 715, 620 700 C 820 685, 1020 712, 1200 698 L 1200 900 L 0 900 Z" fill="#2c3f26"/>

  <!-- Mycelium threads reaching into the soil -->
  <g stroke="#8faa6d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M880 700 C 850 760, 800 790, 760 840"/>
    <path d="M880 700 C 910 765, 960 790, 990 845"/>
    <path d="M880 700 C 878 770, 885 810, 880 870"/>
    <path d="M820 780 C 795 800, 780 825, 776 850"/>
    <path d="M940 785 C 962 805, 972 828, 976 855"/>
    <path d="M300 700 C 280 750, 250 780, 230 830"/>
    <path d="M300 700 C 322 755, 352 780, 368 835"/>
    <path d="M300 700 C 300 760, 305 800, 298 860"/>
  </g>

  <!-- Mushroom -->
  <g>
    <rect x="856" y="560" width="48" height="150" rx="22" fill="#efe9d4" stroke="#c9bd97" stroke-width="4"/>
    <path d="M720 580 C 720 470, 795 400, 880 400 C 965 400, 1040 470, 1040 580 Z" fill="url(#cap)"/>
    <path d="M738 580 C 772 558, 988 558, 1022 580" fill="none" stroke="#24301f" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Small sprout -->
  <g>
    <rect x="282" y="620" width="30" height="90" rx="14" fill="#efe9d4" stroke="#c9bd97" stroke-width="3"/>
    <path d="M225 632 C 225 570, 262 534, 297 534 C 332 534, 369 570, 369 632 Z" fill="url(#cap)"/>
  </g>

  <!-- Spores -->
  <g fill="#5f7a4a">
    <circle cx="668" cy="360" r="9"/>
    <circle cx="1080" cy="420" r="7"/>
    <circle cx="1030" cy="330" r="5"/>
    <circle cx="410" cy="470" r="6"/>
    <circle cx="205" cy="470" r="5"/>
  </g>

  <!-- Type -->
  <text x="96" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="10" fill="#c07a3a">GROWN, NOT MANUFACTURED</text>
  <text x="92" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#2c3f26">Moss &amp; Matter</text>
  <text x="96" y="372" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" fill="#4a6b3d">Materials that return to earth.</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#4a5540">
    <text x="96" y="470">Packaging · Textiles · Interiors</text>
    <text x="96" y="522">grown from mycelium and agricultural waste</text>
  </g>

  <!-- Footer band label -->
  <text x="96" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="6" fill="#cfd6bf">BIOMATERIALS · COMPOSTS AT HOME IN 45 DAYS</text>
</svg>
