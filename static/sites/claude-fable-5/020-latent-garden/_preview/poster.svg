<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Latent Garden — Intelligence should feel alive.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17281c"/>
      <stop offset="0.7" stop-color="#24402c"/>
      <stop offset="1" stop-color="#2c4d34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8fc97a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8fc97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Growing stems -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 900 C200 760 150 660 210 540 C250 460 230 380 280 320" stroke="#4c8a52" stroke-width="7" opacity="0.8"/>
    <path d="M210 540 C270 500 300 440 310 380" stroke="#4c8a52" stroke-width="4.5" opacity="0.7"/>
    <path d="M195 700 C140 650 120 590 130 520" stroke="#8fc97a" stroke-width="4" opacity="0.55"/>

    <path d="M1010 900 C990 740 1060 660 1000 540 C960 460 990 370 940 300" stroke="#4c8a52" stroke-width="7" opacity="0.8"/>
    <path d="M1000 540 C940 500 910 430 905 370" stroke="#4c8a52" stroke-width="4.5" opacity="0.7"/>
    <path d="M1020 720 C1080 670 1100 600 1090 530" stroke="#8fc97a" stroke-width="4" opacity="0.55"/>

    <path d="M420 900 C440 820 400 760 430 690 C455 635 440 590 465 550" stroke="#8fc97a" stroke-width="5" opacity="0.5"/>
    <path d="M780 900 C760 820 805 755 775 690 C750 635 765 585 740 545" stroke="#8fc97a" stroke-width="5" opacity="0.5"/>
    <path d="M600 900 C605 850 590 815 600 775" stroke="#8fc97a" stroke-width="4" opacity="0.45"/>
  </g>

  <!-- Blooms -->
  <g>
    <circle cx="280" cy="320" r="14" fill="#f2b544"/>
    <circle cx="310" cy="380" r="9" fill="#e8724c"/>
    <circle cx="130" cy="520" r="8" fill="#f7f3e8" opacity="0.9"/>
    <circle cx="940" cy="300" r="14" fill="#e8724c"/>
    <circle cx="905" cy="370" r="9" fill="#f2b544"/>
    <circle cx="1090" cy="530" r="8" fill="#f7f3e8" opacity="0.9"/>
    <circle cx="465" cy="550" r="10" fill="#f2b544"/>
    <circle cx="740" cy="545" r="10" fill="#f7f3e8" opacity="0.9"/>
    <circle cx="600" cy="775" r="7" fill="#e8724c"/>
  </g>

  <!-- Drifting pollen -->
  <g fill="#f2b544" opacity="0.55">
    <circle cx="340" cy="220" r="4"/>
    <circle cx="860" cy="190" r="3.5"/>
    <circle cx="240" cy="430" r="3"/>
    <circle cx="980" cy="440" r="3"/>
    <circle cx="520" cy="640" r="3"/>
    <circle cx="700" cy="660" r="3.5"/>
  </g>
  <g fill="#f7f3e8" opacity="0.35">
    <circle cx="430" cy="170" r="2.5"/>
    <circle cx="770" cy="150" r="2.5"/>
    <circle cx="150" cy="300" r="2.5"/>
    <circle cx="1060" cy="320" r="2.5"/>
  </g>

  <!-- Leaf mark -->
  <g transform="translate(560, 210) scale(2.6)" fill="#8fc97a">
    <path d="M16 28 C16 20 10 18 6 12 C12 12 15 15 16 19 C17 13 21 8 27 6 C25 14 21 18 16 22 Z"/>
    <circle cx="16" cy="28" r="1.6"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#f7f3e8">Latent Garden</text>
  <text x="600" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" fill="#f2b544">Intelligence should feel alive.</text>
  <text x="600" y="566" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="24" letter-spacing="7" fill="#b9c7ab">CREATIVE INTELLIGENCE · ORGANIC SIMULATIONS · OPEN ESSAYS</text>

  <!-- Soil line -->
  <rect x="0" y="878" width="1200" height="22" fill="#122016"/>
</svg>
