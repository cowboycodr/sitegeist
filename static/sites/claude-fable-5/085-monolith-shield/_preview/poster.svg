<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Monolith Shield — Know what touches your systems.">
  <defs>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131b20"/>
      <stop offset="1" stop-color="#0c1114"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="#0a0d0f"/>

  <!-- faint grid -->
  <g stroke="#162026" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <!-- frame -->
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#223038" stroke-width="2"/>

  <!-- monolith shield glyph -->
  <g transform="translate(770,170)">
    <rect x="-30" y="-30" width="380" height="560" fill="url(#mono)" stroke="#223038" stroke-width="2"/>
    <path d="M160 40 L290 90 V250 C290 360 235 430 160 465 C85 430 30 360 30 250 V90 Z"
          fill="none" stroke="#55f2a0" stroke-width="10"/>
    <rect x="138" y="130" width="44" height="230" fill="#55f2a0"/>
    <g font-family="Consolas, Menlo, monospace" fill="#93a4a0" font-size="22" letter-spacing="3">
      <text x="160" y="510" text-anchor="middle">POSTURE 92/100</text>
    </g>
    <!-- signal ticks -->
    <g fill="#55f2a0">
      <rect x="30" y="-58" width="60" height="10"/>
      <rect x="100" y="-58" width="24" height="10"/>
      <rect x="134" y="-58" width="42" height="10" fill="#f2b544"/>
      <rect x="186" y="-58" width="80" height="10"/>
    </g>
  </g>

  <!-- eyebrow -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="96" y="150" width="392" height="52" fill="none" stroke="#2c7a54" stroke-width="2"/>
    <circle cx="126" cy="176" r="7" fill="#55f2a0"/>
    <text x="148" y="184" fill="#55f2a0" font-size="24" letter-spacing="4">SECURITY POSTURE / LIVE</text>
  </g>

  <!-- title -->
  <g font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6efe9" font-weight="800">
    <text x="92" y="330" font-size="118" letter-spacing="-2">MONOLITH</text>
    <text x="92" y="452" font-size="118" letter-spacing="-2" fill="#55f2a0">SHIELD</text>
  </g>

  <!-- tagline -->
  <text x="96" y="540" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" fill="#93a4a0">Know what touches your systems.</text>

  <!-- pillar strip -->
  <g font-family="Consolas, Menlo, monospace" font-size="24" letter-spacing="2">
    <rect x="96" y="620" width="580" height="66" fill="#10161a" stroke="#223038" stroke-width="2"/>
    <text x="120" y="662" fill="#55f2a0">01</text><text x="164" y="662" fill="#e6efe9">MAP EXPOSURE</text>
    <rect x="96" y="700" width="580" height="66" fill="#10161a" stroke="#223038" stroke-width="2"/>
    <text x="120" y="742" fill="#55f2a0">02</text><text x="164" y="742" fill="#e6efe9">VERIFY CONTROLS</text>
    <rect x="96" y="780" width="580" height="66" fill="#10161a" stroke="#223038" stroke-width="2"/>
    <text x="120" y="822" fill="#55f2a0">03</text><text x="164" y="822" fill="#e6efe9">RESPOND AT MACHINE SPEED</text>
  </g>

  <!-- footer tick -->
  <text x="1104" y="836" text-anchor="end" font-family="Consolas, Menlo, monospace"
        font-size="20" letter-spacing="3" fill="#93a4a0">CYBERSECURITY // 085</text>
</svg>
