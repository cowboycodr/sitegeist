<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Maison Nocturne — Tailored for the hours unseen</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1c2a"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8ddc8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#a8977a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0b12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#night)"/>
  <circle cx="600" cy="360" r="430" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#e8ddc8" fill-opacity="0.55">
    <circle cx="160" cy="140" r="2.2"/><circle cx="1030" cy="110" r="1.8"/>
    <circle cx="1110" cy="300" r="2.4"/><circle cx="90" cy="380" r="1.7"/>
    <circle cx="820" cy="80" r="1.5"/><circle cx="330" cy="90" r="2"/>
    <circle cx="1140" cy="560" r="1.8"/><circle cx="70" cy="620" r="2.1"/>
    <circle cx="240" cy="720" r="1.5"/><circle cx="990" cy="700" r="1.6"/>
  </g>

  <!-- draped gown motif -->
  <g stroke="#c9b98d" fill="none" stroke-width="2">
    <path d="M600 250 l-30 22 -12 58 -40 300 c50 34 114 34 164 0 l-40 -300 -12 -58 z"
          fill="#232538" fill-opacity="0.85" stroke-opacity="0.55"/>
    <path d="M574 330 c22 92 -34 200 -46 288 M626 330 c-22 92 34 200 46 288"
          stroke-opacity="0.35" stroke-width="1.6"/>
    <path d="M600 250 v382" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="600" cy="222" r="18" fill="#1b1c2a" stroke-opacity="0.45"/>
  </g>

  <!-- frame -->
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#c9b98d" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="60" y="60" width="1080" height="780" fill="none" stroke="#c9b98d" stroke-opacity="0.18" stroke-width="1"/>

  <!-- type -->
  <text x="600" y="140" text-anchor="middle" fill="#c9b98d"
        font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="26" letter-spacing="12">COLLECTION XII · PARIS</text>

  <text x="600" y="716" text-anchor="middle" fill="#e8ddc8"
        font-family="Didot, Bodoni MT, Georgia, serif"
        font-size="92" letter-spacing="8">MAISON NOCTURNE</text>

  <line x1="440" y1="756" x2="560" y2="756" stroke="#c9b98d" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M600 748 l8 8 -8 8 -8 -8 z" fill="#c9b98d"/>
  <line x1="640" y1="756" x2="760" y2="756" stroke="#c9b98d" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="600" y="806" text-anchor="middle" fill="#c9b98d"
        font-family="Didot, Bodoni MT, Georgia, serif" font-style="italic"
        font-size="34" letter-spacing="2">Tailored for the hours unseen.</text>
</svg>
