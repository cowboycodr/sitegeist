<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Fondue Club — Dip irresponsibly.</title>

  <rect width="1200" height="900" fill="#fff7e6"/>

  <!-- cheese drip from top -->
  <path d="M0 0h1200v54c-40 0-40 66-84 66s-36-48-78-48-34 30-72 30-40-70-84-70-36 40-74 40-38-22-80-22-36 60-78 60-36-42-74-42-42 18-84 18-34-48-76-48-38 34-80 34-36-24-74-24-42 54-84 54-34-36-72-36-42 20-84 20-36-60-78-60-34 44-76 44V0Z" fill="#f6c445"/>

  <!-- wine-red panel -->
  <rect x="70" y="190" width="1060" height="620" rx="34" fill="#521320"/>
  <rect x="86" y="206" width="1028" height="588" rx="24" fill="none" stroke="#f6c445" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- eyebrow -->
  <rect x="440" y="248" width="320" height="46" rx="23" fill="#f6c445"/>
  <text x="600" y="279" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="3" fill="#521320" font-weight="bold">NEXT MELT / FRI 8 PM</text>

  <!-- title -->
  <text x="600" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="bold" fill="#fff7e6">Fondue Club</text>
  <text x="600" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#f6c445">Dip irresponsibly.</text>

  <!-- pot scene -->
  <g transform="translate(600 640)">
    <!-- bubbles -->
    <circle cx="-52" cy="-118" r="12" fill="#f6c445"/>
    <circle cx="18" cy="-142" r="8" fill="#f6c445"/>
    <circle cx="-96" cy="-150" r="6" fill="#f6c445"/>
    <!-- fork -->
    <g transform="rotate(20 110 -80)">
      <rect x="106" y="-160" width="9" height="132" rx="4.5" fill="#a86a2e"/>
      <rect x="88" y="-40" width="38" height="26" rx="9" fill="#d9a15c"/>
    </g>
    <!-- rim -->
    <rect x="-186" y="-72" width="372" height="20" rx="10" fill="#7a2434"/>
    <!-- bowl -->
    <path d="M-160 -52h320l-26 108a34 34 0 0 1-33 26H-101a34 34 0 0 1-33-26Z" fill="#7a2434"/>
    <!-- cheese overflow -->
    <path d="M-150 -52c0 18 24 16 29 34 5 17 29 10 32-5 3-17 24-18 29 0 5 20 34 22 37 0 3-18 24-21 29-3 5 17 32 16 32-8 0-11 16-14 18-18Z" fill="#f6c445"/>
    <!-- burner flame -->
    <path d="M-14 92c-16 14-14 34 0 44 14-10 16-30 0-44Z" fill="#f6c445"/>
    <rect x="-70" y="140" width="140" height="12" rx="6" fill="#7a2434"/>
  </g>

  <!-- footer strip -->
  <text x="600" y="862" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="4" fill="#7a2434">SUPPER CLUB · BUBBLING CHEESE · COLD WINE · NO FIXED ADDRESS</text>
</svg>
