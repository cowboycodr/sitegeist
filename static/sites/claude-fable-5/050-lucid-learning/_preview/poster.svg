<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lucid — Learn by seeing.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="100%" stop-color="#faf7f0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#241f4e" stroke-width="3" rx="26"/>

  <!-- orbit motif -->
  <g transform="translate(870 330)">
    <circle r="250" fill="none" stroke="#241f4e" stroke-opacity="0.35" stroke-width="5"/>
    <circle r="196" fill="none" stroke="#ef6351" stroke-opacity="0.55" stroke-width="5"/>
    <circle r="142" fill="none" stroke="#241f4e" stroke-opacity="0.35" stroke-width="5"/>
    <circle r="92" fill="none" stroke="#ef6351" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="176" cy="-176" r="14" fill="#0f8b8d"/>
    <circle cx="-139" cy="139" r="14" fill="#ffd166" stroke="#241f4e" stroke-width="4"/>
    <circle cx="92" cy="0" r="12" fill="#ef6351"/>
    <circle r="46" fill="#241f4e"/>
    <circle r="21" fill="#ffd166"/>
  </g>

  <!-- refracted ray -->
  <g stroke-linecap="round">
    <line x1="120" y1="120" x2="330" y2="330" stroke="#ffd166" stroke-width="12"/>
    <line x1="330" y1="330" x2="430" y2="600" stroke="#ef6351" stroke-width="12"/>
    <circle cx="330" cy="330" r="11" fill="#241f4e"/>
  </g>

  <!-- wave -->
  <path d="M100 660 C 155 580, 210 580, 265 660 S 375 740, 430 660 S 540 580, 595 660 S 705 740, 760 660 S 870 580, 925 660 S 1035 740, 1090 660"
        fill="none" stroke="#0f8b8d" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <line x1="100" y1="660" x2="1090" y2="660" stroke="#241f4e" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 12"/>

  <!-- type -->
  <text x="100" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="10" fill="#0f8b8d" font-weight="700">IDEAS YOU CAN TOUCH</text>
  <text x="94" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="700" fill="#241f4e">Lucid</text>
  <text x="102" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-style="italic" fill="#ef6351">Learn by seeing.</text>

  <text x="100" y="810" font-family="system-ui, sans-serif" font-size="30" fill="#4a4470">Interactive courses · simulations · diagrams · experiments</text>
</svg>
