<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Relay Robotics — Robots that work the room.">
  <defs>
    <clipPath id="frame"><rect width="1200" height="900" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- warm paper background -->
    <rect width="1200" height="900" fill="#faf5ec"/>
    <!-- corridor scene -->
    <rect x="0" y="560" width="1200" height="340" fill="#e6d9c2"/>
    <path d="M0 560h1200" stroke="#d8ccb6" stroke-width="4"/>
    <!-- doors -->
    <rect x="80" y="250" width="150" height="310" rx="10" fill="#e8c9a6"/>
    <rect x="94" y="264" width="122" height="296" rx="8" fill="#f1e8d8"/>
    <circle cx="204" cy="410" r="7" fill="#5b6873"/>
    <rect x="985" y="290" width="130" height="270" rx="10" fill="#e8c9a6"/>
    <rect x="997" y="302" width="106" height="258" rx="8" fill="#d4f2e6"/>
    <circle cx="1010" cy="420" r="6" fill="#5b6873"/>
    <!-- guide path -->
    <path d="M60 700 C 300 700, 420 660, 1140 660" fill="none" stroke="#f0663f" stroke-width="7" stroke-dasharray="6 26" stroke-linecap="round"/>
    <!-- sparkles -->
    <path d="M900 190l9 22 22 9-22 9-9 22-9-22-22-9 22-9 9-22Z" fill="#f0663f"/>
    <path d="M320 150l6 15 15 6-15 6-6 15-6-15-15-6 15-6 6-15Z" fill="#f0663f" opacity="0.85"/>
    <path d="M1060 120l5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12Z" fill="#1f2a33" opacity="0.5"/>

    <!-- robot -->
    <g>
      <ellipse cx="600" cy="705" rx="185" ry="26" fill="#1f2a33" opacity="0.14"/>
      <!-- body -->
      <rect x="465" y="330" width="270" height="310" rx="84" fill="#1f2a33"/>
      <rect x="486" y="356" width="228" height="138" rx="56" fill="#141c23"/>
      <!-- eyes + smile -->
      <circle cx="557" cy="424" r="24" fill="#9fe8cf"/>
      <circle cx="643" cy="424" r="24" fill="#9fe8cf"/>
      <circle cx="564" cy="417" r="8" fill="#141c23"/>
      <circle cx="650" cy="417" r="8" fill="#141c23"/>
      <path d="M566 514q34 26 68 0" stroke="#9fe8cf" stroke-width="11" fill="none" stroke-linecap="round"/>
      <!-- antenna + beacon -->
      <rect x="591" y="272" width="18" height="58" rx="9" fill="#1f2a33"/>
      <circle cx="600" cy="258" r="18" fill="#f0663f"/>
      <!-- tray with parcels -->
      <rect x="502" y="226" width="196" height="28" rx="14" fill="#f0663f"/>
      <rect x="530" y="168" width="62" height="58" rx="10" fill="#d4f2e6"/>
      <rect x="604" y="152" width="74" height="74" rx="10" fill="#e8c9a6"/>
      <path d="M641 152v74M604 189h74" stroke="#faf5ec" stroke-width="6"/>
      <!-- base + wheels -->
      <rect x="498" y="574" width="204" height="70" rx="30" fill="#141c23"/>
      <circle cx="540" cy="672" r="30" fill="#141c23"/>
      <circle cx="660" cy="672" r="30" fill="#141c23"/>
      <circle cx="540" cy="672" r="13" fill="#faf5ec"/>
      <circle cx="660" cy="672" r="13" fill="#faf5ec"/>
    </g>

    <!-- eyebrow chip -->
    <rect x="392" y="762" width="416" height="44" rx="22" fill="#f0663f" opacity="0.14"/>
    <text x="600" y="792" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif" font-size="21" font-weight="800" letter-spacing="4" fill="#d24f2b">AUTONOMY FOR EVERYDAY SPACES</text>

    <!-- wordmark + tagline -->
    <text x="600" y="70" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#1f2a33">RELAY ROBOTICS</text>
    <text x="600" y="856" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="#1f2a33">Robots that work the room.</text>
  </g>
</svg>
