<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Oro Still — hand-cast jewelry from Florence. A gold ring with a single bead on a dark bronze field.">
  <defs>
    <radialGradient id="field" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a2013"/>
      <stop offset="100%" stop-color="#14100a"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cd8f"/>
      <stop offset="45%" stop-color="#b8913f"/>
      <stop offset="70%" stop-color="#f0dca6"/>
      <stop offset="100%" stop-color="#8d6a2a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#field)"/>
  <rect x="34" y="34" width="1132" height="832" fill="none" stroke="#5c4a2c" stroke-width="2"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#3a2e1b" stroke-width="1"/>

  <circle cx="600" cy="380" r="180" fill="none" stroke="url(#band)" stroke-width="34"/>
  <circle cx="600" cy="380" r="180" fill="none" stroke="#f6ead0" stroke-width="2" opacity=".35"/>
  <circle cx="600" cy="200" r="22" fill="url(#band)"/>
  <circle cx="600" cy="200" r="8" fill="#14100a"/>
  <path d="M380 590 Q600 540 820 590" fill="none" stroke="#5c4a2c" stroke-width="2.5"/>

  <text x="600" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="14" fill="#a68b56">HANDMADE IN FLORENCE</text>

  <text x="600" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="10" fill="#f2e9d8">ORO STILL</text>

  <line x1="480" y1="738" x2="720" y2="738" stroke="#8d6a2a" stroke-width="2"/>

  <text x="600" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#d8b96e">Objects for your private mythology.</text>
</svg>
