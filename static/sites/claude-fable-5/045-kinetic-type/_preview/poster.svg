<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Kinetic Type — Letters made to move.</title>
  <desc id="poster-desc">Poster for the Kinetic Type foundry: staggered uppercase letters on a dark ground with an acid-yellow accent.</desc>

  <rect width="1200" height="900" fill="#101014"/>

  <!-- baseline grid -->
  <g stroke="#f4f2ec" stroke-opacity="0.08" stroke-width="2">
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="130" font-family="Menlo, Consolas, monospace" font-size="26" letter-spacing="8" fill="#d8ff3e">INDEPENDENT TYPE FOUNDRY</text>
  <line x1="90" y1="156" x2="470" y2="156" stroke="#d8ff3e" stroke-width="4"/>

  <!-- headline: KINETIC solid, TYPE outlined, MOVE. slanted acid -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="84" y="330" font-size="190" letter-spacing="-8" fill="#f4f2ec">KINETIC</text>
    <text x="84" y="530" font-size="190" letter-spacing="-8" fill="none" stroke="#f4f2ec" stroke-width="4">TYPE</text>
    <g transform="translate(84 720) skewX(-12)">
      <text font-size="190" letter-spacing="-8" fill="#d8ff3e">MOVE.</text>
    </g>
  </g>

  <!-- rotated Kt mark echoing the wordmark -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="960" y="520" font-size="170" fill="#d8ff3e" letter-spacing="-8">K</text>
    <text x="1075" y="505" font-size="170" fill="#f4f2ec" transform="rotate(10 1075 505)">t</text>
  </g>

  <!-- violet motion trail behind the mark -->
  <g fill="none" stroke="#7a6cff" stroke-width="5" stroke-opacity="0.65">
    <path d="M 930 560 q 130 -40 250 10"/>
    <path d="M 920 585 q 140 -40 270 10"/>
    <path d="M 910 610 q 150 -40 290 10"/>
  </g>

  <!-- ticker strip -->
  <g>
    <rect x="0" y="790" width="1200" height="64" fill="#7a6cff" fill-opacity="0.12"/>
    <line x1="0" y1="790" x2="1200" y2="790" stroke="#f4f2ec" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="0" y1="854" x2="1200" y2="854" stroke="#f4f2ec" stroke-opacity="0.2" stroke-width="2"/>
    <text x="46" y="833" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="6" fill="#f4f2ec" fill-opacity="0.65">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm Nn Oo Pp Qq</text>
  </g>

  <!-- tagline -->
  <text x="1110" y="130" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="26" letter-spacing="4" fill="#f4f2ec" fill-opacity="0.75">LETTERS MADE TO MOVE.</text>
</svg>
