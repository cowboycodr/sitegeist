<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pTitle">
  <title id="pTitle">Rare Earth — Formed by pressure.</title>
  <defs>
    <linearGradient id="pAu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset=".5" stop-color="#b9924f"/>
      <stop offset="1" stop-color="#7d5f2c"/>
    </linearGradient>
    <linearGradient id="pAu2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2bd"/>
      <stop offset="1" stop-color="#93713a"/>
    </linearGradient>
    <linearGradient id="pStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8cf"/>
      <stop offset="1" stop-color="#2e6b62"/>
    </linearGradient>
    <radialGradient id="pGlowA" cx=".82" cy=".08" r=".9">
      <stop offset="0" stop-color="#2b2213"/>
      <stop offset="1" stop-color="#2b2213" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowB" cx=".05" cy=".95" r=".8">
      <stop offset="0" stop-color="#1c1710"/>
      <stop offset="1" stop-color="#1c1710" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#0f0d0a"/>
  <rect width="1200" height="900" fill="url(#pGlowA)"/>
  <rect width="1200" height="900" fill="url(#pGlowB)"/>

  <!-- hammered ring motif, right side -->
  <g transform="translate(830 470)">
    <path d="M0-260c168 13 285 134 276 307-9 181-142 319-302 311C-198 350-310 212-297 35-284-133-163-271 0-260Z"
          fill="none" stroke="url(#pAu)" stroke-width="54" stroke-linecap="round"/>
    <path d="M0-232c150 13 251 119 244 274-8 160-125 285-263 277-138-7-238-127-227-283C-235-116-134-243 0-232Z"
          fill="none" stroke="#120f0b" stroke-width="8" opacity=".5"/>
    <g stroke="#f7ead0" stroke-width="4" opacity=".4" stroke-linecap="round">
      <path d="M-148-172l28 25M82-244l12 34M242-120l-30 18M262 82l-35-6M158 250l-20-28M-46 300l8-35M-216 156l33-13M-238-36l35 8"/>
    </g>
    <!-- set stone -->
    <g transform="translate(0 328)">
      <path d="M-70-40h140l-28 52h-84Z" fill="url(#pAu2)"/>
      <path d="M0-118 62-48 0 46-62-48Z" fill="url(#pStone)" stroke="#0d0b08" stroke-width="4"/>
      <path d="M0-118 0 46M-62-48h124M-31-83 31-13M31-83-31-13" stroke="#eafffa" stroke-width="2.2" fill="none" opacity=".55"/>
    </g>
  </g>

  <!-- mineral flecks -->
  <g fill="#c8a35e">
    <circle cx="120" cy="120" r="5"/><circle cx="1105" cy="150" r="4"/>
    <circle cx="1130" cy="770" r="5"/><circle cx="90" cy="800" r="4"/>
    <circle cx="560" cy="70" r="3.5"/><circle cx="1040" cy="850" r="3.5"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(96 92) scale(2.1)" stroke="#e8c98a" fill="none">
    <path d="M16 3 27 12l-4 15H9L5 12Z" stroke-width="1.4"/>
    <path d="M16 3v24M5 12h22M9 27l7-15 7 15" stroke-width=".7" opacity=".55"/>
  </g>

  <!-- type -->
  <text x="100" y="290" fill="#c8a35e" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="10" style="text-transform:uppercase">OBJECTS OF PERMANENCE</text>
  <text x="94" y="410" fill="#f3ead9" font-family="Georgia, 'Times New Roman', serif" font-size="118" letter-spacing="2">Rare Earth</text>
  <text x="100" y="510" fill="#e8c98a" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-style="italic">Formed by pressure.</text>
  <text x="100" y="590" fill="#c9bda5" font-family="Georgia, 'Times New Roman', serif" font-size="27">Sculptural jewelry in recycled metals</text>
  <text x="100" y="632" fill="#c9bda5" font-family="Georgia, 'Times New Roman', serif" font-size="27">with traceable stones.</text>

  <!-- rule + footer line -->
  <path d="M100 700h300" stroke="#c8a35e" stroke-width="2"/>
  <text x="100" y="756" fill="#c8a35e" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6">JEWELRY · LISBON ATELIER</text>
</svg>
