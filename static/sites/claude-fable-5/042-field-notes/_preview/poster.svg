<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Field Notes — Buildings that belong.</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f1e6"/>
      <stop offset="1" stop-color="#ece5d3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>

  <!-- Contour lines rising behind the composition -->
  <g fill="none" stroke="#3d5230" stroke-width="2">
    <path d="M-40 300 C220 240 420 270 640 220 C860 172 1020 210 1240 160" opacity=".10"/>
    <path d="M-40 380 C210 310 430 345 650 290 C870 238 1030 280 1240 225" opacity=".14"/>
    <path d="M-40 460 C200 385 440 420 660 362 C880 306 1040 352 1240 292" opacity=".18"/>
    <path d="M-40 540 C195 460 450 495 670 435 C885 378 1050 425 1240 360" opacity=".22"/>
  </g>

  <!-- Hillside with a low house held below the ridge -->
  <path d="M-20 650 C220 560 430 600 640 545 C860 490 1030 540 1220 470 L1220 920 L-20 920 Z" fill="#a9b590"/>
  <path d="M-20 740 C240 660 470 690 700 640 C920 592 1080 630 1220 580 L1220 920 L-20 920 Z" fill="#7c8f60"/>

  <g>
    <rect x="480" y="596" width="240" height="76" fill="#d8c8a8"/>
    <path d="M464 596 L600 536 L736 596 Z" fill="#5b4636"/>
    <rect x="512" y="614" width="40" height="58" fill="#34503f"/>
    <rect x="572" y="614" width="40" height="58" fill="#34503f"/>
    <rect x="632" y="614" width="56" height="58" fill="#34503f"/>
  </g>

  <!-- Field walls following the slope -->
  <path d="M60 800 C300 760 620 780 900 740 C1040 720 1140 730 1220 716" fill="none" stroke="#5f7248" stroke-width="3" opacity=".6"/>
  <path d="M-20 860 C260 828 640 846 960 806 C1080 792 1160 798 1220 788" fill="none" stroke="#5f7248" stroke-width="3" opacity=".4"/>

  <circle cx="1010" cy="180" r="46" fill="#d9a441"/>

  <!-- Title block -->
  <g text-anchor="middle">
    <text x="600" y="176" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="10" fill="#93401e">ARCHITECTURE IN CONTEXT</text>
    <text x="600" y="292" font-family="Georgia, Times New Roman, serif" font-size="128" fill="#2c3d22">Field Notes</text>
    <text x="600" y="366" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="42" fill="#4c5540">Buildings that belong.</text>
  </g>

  <!-- Surveyor's mark echoing the wordmark -->
  <g transform="translate(600 428)">
    <path d="M-42 34 C-18 -6 -6 -12 0 -12 C10 -12 18 6 42 34" fill="none" stroke="#3d5230" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="8" fill="#b4552d"/>
  </g>

  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#2c3d22" stroke-width="3" opacity=".55"/>
</svg>
