<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lumen Clinic — A clearer view of your health.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f4e9d3"/>
      <stop offset="100%" stop-color="#f4e9d3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#faf6ee"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#0f3b3a" stroke-opacity="0.22" stroke-width="2"/>

  <circle cx="850" cy="450" r="330" fill="url(#glow)"/>

  <g fill="none" stroke="#0f3b3a" stroke-opacity="0.15" stroke-width="2">
    <circle cx="850" cy="450" r="290"/>
    <circle cx="850" cy="450" r="222"/>
    <circle cx="850" cy="450" r="154"/>
  </g>

  <g fill="none" stroke-linecap="round" transform="rotate(-90 850 450)">
    <circle cx="850" cy="450" r="290" stroke="#0f3b3a" stroke-width="11" stroke-dasharray="1300 1823"/>
    <circle cx="850" cy="450" r="222" stroke="#c97b4a" stroke-width="11" stroke-dasharray="840 1395"/>
    <circle cx="850" cy="450" r="154" stroke="#6f9d8f" stroke-width="11" stroke-dasharray="630 968"/>
  </g>

  <g fill="#0f3b3a">
    <circle cx="850" cy="160" r="9"/>
    <circle cx="1072" cy="450" r="8" fill="#c97b4a"/>
    <circle cx="850" cy="296" r="8" fill="#6f9d8f"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" fill="#0f3b3a">
    <text x="850" y="470" font-size="88">98</text>
    <text x="850" y="516" font-size="22" letter-spacing="6" fill="#5c6b66">LUMEN SCORE</text>
  </g>

  <g transform="translate(96 120)">
    <g fill="none" stroke="#0f3b3a" stroke-width="4">
      <circle cx="26" cy="26" r="24"/>
      <circle cx="26" cy="26" r="12"/>
    </g>
    <circle cx="26" cy="26" r="4" fill="#0f3b3a"/>
    <text x="70" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#0f3b3a">Lumen Clinic</text>
  </g>

  <text x="96" y="248" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" letter-spacing="5" fill="#c97b4a">PREVENTIVE CARE, REDESIGNED</text>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#0f3b3a">
    <tspan x="92" y="344">A clearer view</tspan>
    <tspan x="92" y="432">of your health.</tspan>
  </text>

  <text font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#5c6b66">
    <tspan x="96" y="502">Membership diagnostics that turn</tspan>
    <tspan x="96" y="540">complex health signals into calm,</tspan>
    <tspan x="96" y="578">actionable guidance.</tspan>
  </text>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="96" y="632" rx="34" width="216" height="68" fill="#0f3b3a"/>
    <text x="204" y="675" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Join Lumen</text>
    <rect x="332" y="632" rx="34" width="246" height="68" fill="none" stroke="#0f3b3a" stroke-width="3"/>
    <text x="455" y="675" text-anchor="middle" font-size="26" font-weight="600" fill="#0f3b3a">How it works</text>
  </g>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5c6b66">
    <text x="96" y="796"><tspan font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#0f3b3a">92</tspan>  biomarkers</text>
    <text x="330" y="796"><tspan font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#0f3b3a">4×</tspan>  seasonal reviews</text>
  </g>
