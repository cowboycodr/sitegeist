<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Court Eleven — New rituals for the old game.</title>

  <!-- Chalk background -->
  <rect width="1200" height="900" fill="#f4efe6"/>

  <!-- Court diagram in court green, tilted plane suggestion -->
  <g stroke="#2e4a3a" fill="none" opacity="0.9">
    <rect x="120" y="470" width="960" height="330" stroke-width="6"/>
    <rect x="120" y="512" width="960" height="246" stroke-width="3"/>
    <line x1="350" y1="512" x2="350" y2="758" stroke-width="3"/>
    <line x1="850" y1="512" x2="850" y2="758" stroke-width="3"/>
    <line x1="350" y1="635" x2="850" y2="635" stroke-width="3"/>
    <line x1="600" y1="462" x2="600" y2="808" stroke-width="8"/>
    <line x1="120" y1="635" x2="138" y2="635" stroke-width="3"/>
    <line x1="1062" y1="635" x2="1080" y2="635" stroke-width="3"/>
  </g>

  <!-- Clay ball resting on the baseline -->
  <circle cx="988" cy="430" r="38" fill="#b5502f"/>
  <path d="M 956 410 Q 988 430 956 450" fill="none" stroke="#f4efe6" stroke-width="5"/>
  <path d="M 1020 410 Q 988 430 1020 450" fill="none" stroke="#f4efe6" stroke-width="5"/>

  <!-- Eyebrow -->
  <text x="120" y="150" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#8f3a20">BROOKLYN / OPEN 06:00</text>

  <!-- Title -->
  <text x="112" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" letter-spacing="-3" fill="#1d211c">Court</text>
  <text x="112" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="150" letter-spacing="-3" fill="#1d211c">Eleven</text>

  <!-- Number badge -->
  <rect x="700" y="180" width="120" height="120" rx="12" fill="#b5502f"/>
  <text x="760" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f4efe6">11</text>

  <!-- Tagline -->
  <text x="120" y="860" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" fill="#8f3a20">New rituals for the old game.</text>
</svg>
