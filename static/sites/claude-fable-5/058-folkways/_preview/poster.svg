<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Folkways — Every song carries a place.</title>
  <desc id="d">Gallery poster for the Folkways music archive: a warm paper background with a gold waveform crossing a stylized map, rust markers, and the archive's name in serif type.</desc>

  <!-- paper ground -->
  <rect width="1200" height="900" fill="#f6efe2"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#2b241c" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#2b241c" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- faint graticule -->
  <g stroke="#2b241c" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 10">
    <path d="M60 250 H1140 M60 450 H1140 M60 650 H1140"/>
    <path d="M300 60 V840 M600 60 V840 M900 60 V840"/>
  </g>

  <!-- abstract landmasses -->
  <g fill="#e5d7b8" stroke="#2b241c" stroke-opacity="0.18" stroke-width="2">
    <path d="M150 560 q70 -60 150 -30 q60 24 50 84 q-8 50 -60 66 q-56 18 -110 -10 q-52 -28 -46 -70 q4 -26 16 -40 z"/>
    <path d="M880 520 q80 -44 160 -6 q56 28 44 88 q-10 50 -70 62 q-66 12 -118 -22 q-48 -32 -34 -80 q6 -24 18 -42 z"/>
    <path d="M480 640 q90 -40 180 0 q64 30 48 88 q-14 48 -80 56 q-78 10 -140 -28 q-54 -34 -34 -82 q8 -20 26 -34 z"/>
  </g>

  <!-- gold waveform motif -->
  <path d="M60 430 C110 370 160 490 210 430 C260 370 310 490 360 430 C410 380 460 480 510 430 C560 360 610 500 660 430 C710 375 760 485 810 430 C860 385 910 475 960 430 C1010 395 1060 465 1110 430 L1140 430"
        fill="none" stroke="#c9962f" stroke-width="7" stroke-linecap="round"/>

  <!-- recording site markers -->
  <g>
    <g transform="translate(210,430)"><circle r="20" fill="#b0502a" opacity="0.22"/><circle r="10" fill="#b0502a" stroke="#fff8ee" stroke-width="3"/></g>
    <g transform="translate(510,430)"><circle r="20" fill="#b0502a" opacity="0.22"/><circle r="10" fill="#b0502a" stroke="#fff8ee" stroke-width="3"/></g>
    <g transform="translate(810,430)"><circle r="20" fill="#b0502a" opacity="0.22"/><circle r="10" fill="#b0502a" stroke="#fff8ee" stroke-width="3"/></g>
    <g transform="translate(1060,455)"><circle r="20" fill="#4c5f3d" opacity="0.22"/><circle r="10" fill="#4c5f3d" stroke="#fff8ee" stroke-width="3"/></g>
  </g>

  <!-- circular emblem -->
  <g transform="translate(600,215)">
    <circle r="92" fill="none" stroke="#b0502a" stroke-width="8"/>
    <path d="M-52 0 Q-32 -46 -14 0 T22 0 T58 0" fill="none" stroke="#b0502a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- type -->
  <text x="600" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#2b241c" letter-spacing="2">Folkways</text>
  <text x="600" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#4c5f3d">Every song carries a place.</text>
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="10" fill="#8f3d1e">SOUNDS FROM THE ARCHIVE</text>

  <!-- footer rule -->
  <g stroke="#c9962f" stroke-width="4" stroke-linecap="round">
    <path d="M420 800 H780"/>
  </g>
  <circle cx="400" cy="800" r="6" fill="#b0502a"/>
  <circle cx="800" cy="800" r="6" fill="#b0502a"/>
</svg>
