<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Aera Skin — Your skin, in a softer light.</title>
  <defs>
    <radialGradient id="pglow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f4e3d7"/>
      <stop offset="60%" stop-color="#e9d2c3"/>
      <stop offset="100%" stop-color="#ddbfab"/>
    </radialGradient>
    <linearGradient id="pglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6f0"/>
      <stop offset="100%" stop-color="#e8d3c5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f7f2ec"/>

  <!-- soft arch of light -->
  <rect x="700" y="80" width="420" height="740" rx="210" fill="url(#pglow)"/>
  <ellipse cx="910" cy="700" rx="170" ry="26" fill="#c9a893" opacity=".35"/>

  <!-- serum bottle -->
  <g>
    <rect x="838" y="330" width="144" height="310" rx="28" fill="url(#pglass)" stroke="#b98d72" stroke-opacity=".45"/>
    <rect x="874" y="272" width="72" height="64" rx="12" fill="#3d2f28"/>
    <rect x="858" y="442" width="104" height="110" rx="8" fill="#fdfaf6"/>
    <text x="910" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#3d2f28" letter-spacing="4">AERA</text>
    <text x="910" y="514" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8a6f5e" letter-spacing="2.5">VEIL SERUM</text>
    <line x1="872" y1="530" x2="948" y2="530" stroke="#d8bfae" stroke-width="1.5"/>
  </g>

  <!-- droplets -->
  <circle cx="742" cy="200" r="9" fill="#b98d72" opacity=".5"/>
  <circle cx="1082" cy="270" r="13" fill="#b98d72" opacity=".35"/>
  <circle cx="1046" cy="742" r="8" fill="#b98d72" opacity=".5"/>
  <circle cx="724" cy="640" r="15" fill="#b98d72" opacity=".25"/>

  <!-- copy block -->
  <text x="96" y="200" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" letter-spacing="9" fill="#b98d72">BARRIER-FIRST SKINCARE</text>
  <text x="96" y="316" font-family="Georgia, serif" font-size="104" fill="#3d2f28" letter-spacing="6">AERA</text>
  <text x="96" y="424" font-family="Georgia, serif" font-size="104" fill="#3d2f28" letter-spacing="6">SKIN</text>
  <line x1="100" y1="474" x2="360" y2="474" stroke="#e9d6c8" stroke-width="3"/>
  <text x="96" y="548" font-family="Georgia, serif" font-size="40" fill="#6f5c50">Your skin, in a</text>
  <text x="96" y="602" font-family="Georgia, serif" font-size="40" font-style="italic" fill="#b98d72">softer light.</text>

  <!-- pill button -->
  <rect x="96" y="668" width="288" height="72" rx="36" fill="#3d2f28"/>
  <text x="240" y="713" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" letter-spacing="4" fill="#f7f2ec">SHOP THE RITUAL</text>

  <!-- footer strap -->
  <text x="96" y="822" font-family="Avenir Next, Segoe UI, sans-serif" font-size="19" letter-spacing="4" fill="#8a6f5e">FRAGRANCE-FREE · pH 4.8–5.5 · FOUR STEPS, NOTHING TO SUBTRACT</text>
</svg>
