<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Soft Earth Studio — Made slowly enough to keep the fingerprints.</title>
  <defs>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc9b2"/>
      <stop offset="0.55" stop-color="#b9764f"/>
      <stop offset="1" stop-color="#8a4a33"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee4d4"/>
      <stop offset="1" stop-color="#eee4d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f4ecdf"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#5c3a2b" stroke-opacity="0.28" stroke-width="2"/>

  <!-- ground band -->
  <rect x="38" y="640" width="1124" height="224" fill="#eee4d4"/>
  <line x1="38" y1="640" x2="1162" y2="640" stroke="#5c3a2b" stroke-opacity="0.22" stroke-width="2"/>

  <!-- large vessel -->
  <g transform="translate(770 190) scale(1.18)">
    <ellipse cx="180" cy="392" rx="140" ry="18" fill="#3c2f28" opacity="0.14"/>
    <path d="M120 60 C110 40 250 40 240 60 C232 78 226 96 228 130 C232 200 292 232 292 300 C292 368 236 396 180 396 C124 396 68 368 68 300 C68 232 128 200 132 130 C134 96 128 78 120 60 Z" fill="url(#glaze)"/>
    <path d="M124 62 C160 74 200 74 236 62 C230 80 226 98 228 128 C196 140 164 140 132 128 C134 98 130 80 124 62 Z" fill="url(#drip)" opacity="0.9"/>
    <path d="M132 128 C164 140 196 140 228 128 C229 146 233 160 240 174 C200 188 160 188 120 174 C127 160 131 146 132 128 Z" fill="#eee4d4" opacity="0.55"/>
    <ellipse cx="180" cy="52" rx="60" ry="12" fill="#5c3a2b"/>
    <ellipse cx="180" cy="52" rx="48" ry="8" fill="#42291f"/>
    <path d="M100 250 C130 262 230 262 260 250" stroke="#8a4a33" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M92 292 C130 306 230 306 268 292" stroke="#8a4a33" stroke-width="3" fill="none" opacity="0.35"/>
    <path d="M104 338 C140 350 220 350 256 338" stroke="#8a4a33" stroke-width="3" fill="none" opacity="0.25"/>
  </g>

  <!-- small companion bowl -->
  <g transform="translate(640 552) scale(0.55)">
    <ellipse cx="100" cy="204" rx="78" ry="9" fill="#3c2f28" opacity="0.12"/>
    <path d="M30 96 C30 84 170 84 170 96 C170 150 148 200 100 200 C52 200 30 150 30 96 Z" fill="#dcc9b2"/>
    <path d="M30 96 C30 84 170 84 170 96 C170 108 168 120 164 132 C122 146 78 146 36 132 C32 120 30 108 30 96 Z" fill="#7d8b6f" opacity="0.85"/>
    <ellipse cx="100" cy="92" rx="70" ry="12" fill="#8a6a4f"/>
    <ellipse cx="100" cy="92" rx="58" ry="8" fill="#6b4c37"/>
  </g>

  <!-- clay dot mark -->
  <circle cx="118" cy="150" r="17" fill="#8a4a33"/>
  <circle cx="112" cy="143" r="6" fill="#b9764f" opacity="0.8"/>

  <text x="152" y="162" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38" font-weight="700" fill="#42291f" letter-spacing="0.5">Soft Earth Studio</text>

  <text x="118" y="256" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="7" fill="#8a4a33">HAND-THROWN CERAMICS</text>

  <text x="112" y="356" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="76" font-weight="600" fill="#42291f">Made slowly</text>
  <text x="112" y="444" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="76" font-weight="600" fill="#42291f">enough to keep</text>
  <text x="112" y="532" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="76" font-weight="600" fill="#42291f">the fingerprints.</text>

  <text x="112" y="608" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="30" fill="#5c3a2b">Imperfect vessels, studio rituals, and the</text>
  <text x="112" y="648" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="30" fill="#5c3a2b">landscapes held inside every glaze.</text>

  <!-- glaze swatches -->
  <g transform="translate(112 716)">
    <circle cx="22" cy="22" r="22" fill="#8a4a33"/>
    <circle cx="82" cy="22" r="22" fill="#7d8b6f"/>
    <circle cx="142" cy="22" r="22" fill="#a3b0b3"/>
    <circle cx="202" cy="22" r="22" fill="#6e3520"/>
    <text x="252" y="30" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" letter-spacing="3" fill="#5c3a2b">RIVERBANK · ORCHARD ASH · SALT FOG · EMBER FIELD</text>
  </g>

  <text x="112" y="812" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#8a4a33">CERAMICS · 14 MILLRACE LANE · THU–SUN 10:00–17:00</text>
</svg>
