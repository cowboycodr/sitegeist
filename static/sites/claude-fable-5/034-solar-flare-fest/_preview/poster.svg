<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="posterTitle">
  <title id="posterTitle">Solar Flare festival poster — Three nights, no small feelings. Joshua Tree, September 18 to 20.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0614"/>
      <stop offset="0.6" stop-color="#1b0c2c"/>
      <stop offset="1" stop-color="#2b1038"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.45" stop-color="#ff9a3d"/>
      <stop offset="0.8" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.45" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- radiant sun behind the ridge -->
  <circle cx="600" cy="620" r="360" fill="url(#sun)"/>
  <g stroke="#ffb45e" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="600" y1="200" x2="600" y2="260"/>
    <line x1="240" y1="620" x2="300" y2="620"/>
    <line x1="900" y1="620" x2="960" y2="620"/>
    <line x1="350" y1="370" x2="392" y2="412"/>
    <line x1="808" y1="412" x2="850" y2="370"/>
  </g>

  <!-- desert ridge -->
  <path d="M0,760 L90,720 L180,748 L290,690 L400,738 L520,680 L640,732 L760,702 L880,745 L1000,698 L1100,736 L1200,712 L1200,900 L0,900 Z" fill="#140b21"/>
  <path d="M0,900 L0,790 L140,762 L300,792 L470,748 L640,786 L820,758 L1000,790 L1200,766 L1200,900 Z" fill="#0b0614"/>

  <!-- identity -->
  <text x="600" y="285" text-anchor="middle" fill="#ffe27a"
        font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif"
        font-size="30" font-weight="700" letter-spacing="10"
        style="text-transform:uppercase">JOSHUA TREE · SEP 18–20</text>

  <text x="600" y="470" text-anchor="middle" fill="url(#flare)"
        font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif"
        font-size="180" font-weight="800" letter-spacing="6">SOLAR</text>
  <text x="600" y="640" text-anchor="middle" fill="url(#flare)"
        font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif"
        font-size="180" font-weight="800" letter-spacing="6">FLARE</text>

  <text x="600" y="722" text-anchor="middle" fill="#f6ecf2"
        font-family="'Avenir Next Condensed','Arial Narrow',Arial,sans-serif"
        font-size="40" font-weight="700" letter-spacing="6">THREE NIGHTS. NO SMALL FEELINGS.</text>

  <text x="600" y="836" text-anchor="middle" fill="#c2b3c9"
        font-family="'Avenir Next','Segoe UI',Arial,sans-serif"
        font-size="24" letter-spacing="2">Future-facing music · Radiant art · Nights without edges</text>

  <rect x="8" y="8" width="1184" height="884" fill="none" stroke="#ffb45e" stroke-opacity="0.35" stroke-width="2"/>
</svg>
