<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Relic — Objects worth keeping. A curated vintage marketplace.">
  <!-- Parchment ground -->
  <rect width="1200" height="900" fill="#f4ecdd"/>
  <rect x="36" y="36" width="1128" height="828" fill="none" stroke="#c9b995" stroke-width="3"/>
  <rect x="52" y="52" width="1096" height="796" fill="none" stroke="#c9b995" stroke-width="1"/>

  <!-- Seal -->
  <g transform="translate(600 168)">
    <circle r="64" fill="none" stroke="#a4502a" stroke-width="4"/>
    <circle r="48" fill="none" stroke="#a4502a" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif" font-size="72" font-weight="700" fill="#a4502a">R</text>
  </g>

  <text x="600" y="292" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif" font-size="26" letter-spacing="12" fill="#a4502a">NEWLY UNEARTHED</text>

  <text x="600" y="416" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif" font-size="150" font-weight="700" letter-spacing="6" fill="#2b2118">RELIC</text>

  <line x1="380" y1="456" x2="820" y2="456" stroke="#2b2118" stroke-width="2"/>
  <text x="600" y="508" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif" font-size="38" font-style="italic" fill="#5c5044">Objects worth keeping.</text>

  <!-- Sitting-room motif -->
  <g transform="translate(320 496)">
    <!-- pendant lamp -->
    <line x1="280" y1="44" x2="280" y2="70" stroke="#2b2118" stroke-width="4"/>
    <path d="M232 112a48 44 0 0 1 96 0Z" fill="#a4502a" stroke="#2b2118" stroke-width="4"/>
    <circle cx="280" cy="122" r="8" fill="#b98a3c" stroke="#2b2118" stroke-width="3"/>
    <!-- chair -->
    <g stroke="#2b2118" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M60 160c-6-64 16-100 50-108"/>
      <path d="M60 160h132"/>
      <line x1="58" y1="192" x2="46" y2="280"/>
      <line x1="194" y1="192" x2="206" y2="280"/>
      <line x1="94" y1="192" x2="102" y2="280"/>
      <line x1="160" y1="192" x2="152" y2="280"/>
    </g>
    <rect x="46" y="160" width="160" height="32" rx="14" fill="#6b7455" stroke="#2b2118" stroke-width="4"/>
    <!-- side table with vase -->
    <g stroke="#2b2118" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="380" y1="196" x2="520" y2="196"/>
      <line x1="392" y1="196" x2="386" y2="280"/>
      <line x1="508" y1="196" x2="514" y2="280"/>
    </g>
    <path d="M424 194c0-14 12-17 9-34-3-14-11-17-11-34 0-15 9-23 21-23s21 8 21 23c0 17-8 20-11 34-3 17 9 20 9 34Z" fill="#e9dcc4" stroke="#2b2118" stroke-width="4"/>
    <!-- floor -->
    <line x1="0" y1="280" x2="560" y2="280" stroke="#2b2118" stroke-width="4"/>
  </g>

  <text x="600" y="826" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif" font-size="20" letter-spacing="8" fill="#b98a3c">FURNITURE · LIGHTING · EVERYDAY THINGS</text>
</svg>
