<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Margin Quarterly poster: a cream page with wide margins, two rust-red and ink-black blocks kept apart, and the tagline Ideas worth leaving room for.">
  <rect width="1200" height="900" fill="#f4efe6"/>
  <rect x="10" y="10" width="1180" height="880" fill="none" stroke="#1f1b16" stroke-width="8"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#c9bda7" stroke-width="2"/>

  <!-- masthead -->
  <text x="90" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#1f1b16"><tspan fill="#a3492e" font-style="italic">M—</tspan>Margin Quarterly</text>
  <line x1="90" y1="192" x2="1110" y2="192" stroke="#1f1b16" stroke-width="5"/>
  <text x="90" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="#7f371f">ISSUE 18 · THE DISTANCE BETWEEN</text>

  <!-- motif: two blocks kept apart by the margin -->
  <rect x="150" y="320" width="240" height="380" fill="#a3492e"/>
  <rect x="470" y="410" width="240" height="380" fill="#1f1b16"/>
  <line x1="390" y1="320" x2="470" y2="790" stroke="#1f1b16" stroke-width="3" stroke-dasharray="4 14"/>

  <!-- text column with generous margin -->
  <text x="790" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#1f1b16">Ideas worth</text>
  <text x="790" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#1f1b16">leaving <tspan font-style="italic" fill="#a3492e">room</tspan></text>
  <text x="790" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#1f1b16">for.</text>
  <line x1="790" y1="628" x2="960" y2="628" stroke="#a3492e" stroke-width="6"/>
  <text x="790" y="686" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#4d453b">A longform journal of</text>
  <text x="790" y="724" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#4d453b">cultural criticism &amp;</text>
  <text x="790" y="762" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#4d453b">collectible editions</text>

  <!-- folio line -->
  <text x="90" y="836" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="6" fill="#4d453b">PUBLISHED FOUR TIMES A YEAR</text>
  <text x="1110" y="836" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#a3492e">Nº 18</text>
</svg>
