<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="One Point Five — climate data observatory poster">
  <title>One Point Five — Make the future measurable.</title>
  <rect width="1200" height="900" fill="#0b1220"/>

  <!-- warming stripes band across the top -->
  <g>
    <rect x="0" y="0" width="120" height="46" fill="#2166ac"/>
    <rect x="120" y="0" width="110" height="46" fill="#4393c3"/>
    <rect x="230" y="0" width="110" height="46" fill="#92c5de"/>
    <rect x="340" y="0" width="110" height="46" fill="#d1e5f0"/>
    <rect x="450" y="0" width="110" height="46" fill="#fddbc7"/>
    <rect x="560" y="0" width="120" height="46" fill="#f4a582"/>
    <rect x="680" y="0" width="130" height="46" fill="#d6604d"/>
    <rect x="810" y="0" width="140" height="46" fill="#b2182b"/>
    <rect x="950" y="0" width="250" height="46" fill="#67001f"/>
  </g>

  <!-- faint anomaly trace with threshold line -->
  <g>
    <line x1="90" y1="330" x2="1110" y2="330" stroke="#ff4d4d" stroke-width="4" stroke-dasharray="18 14"/>
    <text x="1110" y="308" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ff4d4d">1.5&#176;C guardrail</text>
    <path d="M 90,700 L 190,690 L 290,702 L 390,680 L 490,688 L 590,668 L 690,640 L 790,600 L 890,540 L 990,450 L 1060,370 L 1096,336"
          fill="none" stroke="#ffb347" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1096" cy="336" r="12" fill="#ff5a3c"/>
    <line x1="90" y1="700" x2="1110" y2="700" stroke="#22314a" stroke-width="2"/>
  </g>

  <!-- title block -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="90" y="160" font-size="26" font-weight="700" letter-spacing="7" fill="#ffb347">CLIMATE DATA OBSERVATORY</text>
    <text x="90" y="268" font-size="104" font-weight="800" letter-spacing="-2" fill="#e8eef7">One Point <tspan fill="#ff5a3c">Five</tspan></text>
    <text x="90" y="852" font-size="40" font-weight="700" fill="#e8eef7">Make the future measurable.</text>
  </g>

  <!-- giant 1.5° badge -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <rect x="88" y="418" width="330" height="180" rx="24" fill="none" stroke="#ff5a3c" stroke-width="6"/>
    <text x="253" y="548" text-anchor="middle" font-size="120" font-weight="800" fill="#ff5a3c">1.5&#176;</text>
    <text x="90" y="648" font-size="26" fill="#93a3b8">2024 anomaly: +1.55&#176;C &#183; CO&#8322;: 424 ppm</text>
  </g>
</svg>
