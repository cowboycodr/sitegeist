<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Carbon Zero — Make every tonne visible.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f18"/>
      <stop offset="1" stop-color="#1b3a2c"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#5ce8a4" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1200" height="900" fill="url(#fade)"/>
    </mask>
    <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ce8a4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ce8a4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- brand mark -->
  <g transform="translate(90,84)">
    <rect width="88" height="88" rx="22" fill="#0a1a14" stroke="#2fb877" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="44" cy="44" r="22" fill="none" stroke="#5ce8a4" stroke-width="9"/>
  </g>
  <text x="204" y="142" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Carbon Zero</text>
  <text x="204" y="178" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#2fb877">CARBON ACCOUNTING</text>

  <!-- headline -->
  <text x="90" y="392" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Make every</text>
  <text x="90" y="500" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="96" font-weight="800" letter-spacing="-2"><tspan fill="#5ce8a4">tonne</tspan><tspan fill="#ffffff"> visible.</tspan></text>
  <text x="90" y="566" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="30" fill="#b9d2c4">Emissions intelligence for teams turning promises into progress.</text>

  <!-- dashboard card -->
  <g transform="translate(90,632)">
    <rect width="1020" height="184" rx="20" fill="#0a1a14" fill-opacity="0.85" stroke="#5ce8a4" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="42" cy="46" r="6" fill="#5ce8a4"/>
    <text x="62" y="53" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="21" fill="#9fbfae">Q2 2026 · Group footprint</text>
    <rect x="850" y="28" width="128" height="36" rx="18" fill="#5ce8a4"/>
    <text x="914" y="53" text-anchor="middle" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#0c1f18">ASSURED</text>
    <text x="40" y="132" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">12,847</text>
    <text x="40" y="162" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="20" fill="#86a796">tCO₂e · ▾ 18.4% year on year</text>
    <!-- sparkline -->
    <g transform="translate(460,84)">
      <path d="M0 18 L48 28 L96 22 L144 38 L192 32 L240 48 L288 42 L336 56 L384 52 L432 64 L480 60 L520 72 L520 88 L0 88 Z" fill="url(#sparkfill)"/>
      <path d="M0 18 L48 28 L96 22 L144 38 L192 32 L240 48 L288 42 L336 56 L384 52 L432 64 L480 60 L520 72" fill="none" stroke="#5ce8a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="520" cy="72" r="8" fill="#5ce8a4"/>
    </g>
  </g>
</svg>
