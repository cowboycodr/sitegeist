<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Bloomline — flowers with a point of view</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f7efe1"/>
      <stop offset="100%" stop-color="#efe2cc"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#1e3327" stroke-width="3"/>

  <!-- bouquet motif, right side -->
  <g transform="translate(760 110)">
    <circle cx="150" cy="260" r="230" fill="#f4e9d8"/>
    <!-- vase -->
    <path d="M92 470 L208 470 L192 590 Q150 604 108 590 Z" fill="#1e3327"/>
    <!-- stems -->
    <g fill="none" stroke="#2c4a36" stroke-width="6" stroke-linecap="round">
      <path d="M148 472 C144 380 140 300 132 220"/>
      <path d="M164 472 C184 380 210 290 252 210"/>
      <path d="M136 472 C104 380 66 310 36 260"/>
      <path d="M156 472 C164 370 200 280 268 340"/>
      <path d="M142 472 C128 370 96 230 150 110"/>
    </g>
    <!-- leaves -->
    <g fill="#2c4a36">
      <path d="M140 350 C104 338 82 316 74 288 C110 296 132 318 140 350 Z"/>
      <path d="M186 338 C222 328 244 306 252 278 C216 286 194 308 186 338 Z"/>
    </g>
    <!-- poppy -->
    <circle cx="132" cy="202" r="58" fill="#c73b2a"/>
    <circle cx="132" cy="202" r="38" fill="#e0553f"/>
    <circle cx="132" cy="202" r="14" fill="#1d1a14"/>
    <!-- anemone -->
    <g fill="#efe6f2">
      <ellipse cx="252" cy="176" rx="22" ry="37"/>
      <ellipse cx="252" cy="176" rx="22" ry="37" transform="rotate(60 252 176)"/>
      <ellipse cx="252" cy="176" rx="22" ry="37" transform="rotate(120 252 176)"/>
    </g>
    <circle cx="252" cy="176" r="12" fill="#3a2f4d"/>
    <!-- ranunculus -->
    <circle cx="34" cy="244" r="42" fill="#e8a03c"/>
    <circle cx="34" cy="244" r="30" fill="#f0b45e"/>
    <circle cx="34" cy="244" r="17" fill="#e8a03c"/>
    <circle cx="34" cy="244" r="7" fill="#8a5a1a"/>
    <!-- plum bud -->
    <ellipse cx="270" cy="332" rx="19" ry="29" fill="#5c3a5e"/>
    <!-- seed head -->
    <g fill="#b98a4a">
      <circle cx="150" cy="106" r="7"/><circle cx="134" cy="86" r="6"/>
      <circle cx="168" cy="84" r="6"/><circle cx="152" cy="64" r="5"/>
      <circle cx="178" cy="108" r="5"/><circle cx="124" cy="110" r="5"/>
    </g>
  </g>

  <!-- type, left side -->
  <g fill="#1e3327">
    <text x="96" y="200" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" letter-spacing="7" fill="#c73b2a">SEASONAL STEMS / LONDON</text>
    <text x="90" y="330" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="132" font-weight="600" letter-spacing="-2">Bloomline</text>
    <text x="96" y="430" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="52" font-style="italic">Flowers with a</text>
    <text x="96" y="496" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="52" font-style="italic" fill="#c73b2a">point of view.</text>
    <text x="96" y="590" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="27" fill="#3d5546">Sculptural compositions for homes,</text>
    <text x="96" y="628" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="27" fill="#3d5546">gatherings, galleries, and</text>
    <text x="96" y="666" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="27" fill="#3d5546">unexpected Tuesdays.</text>
  </g>

  <!-- button motif -->
  <g>
    <rect x="96" y="716" width="278" height="70" rx="35" fill="#c73b2a"/>
    <text x="235" y="761" text-anchor="middle" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#ffffff">SEND FLOWERS</text>
  </g>

  <!-- baseline rule -->
  <line x1="96" y1="830" x2="700" y2="830" stroke="#1e3327" stroke-width="2" opacity="0.35"/>
  <text x="96" y="818" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#3d5546">FLORAL DESIGN · EST. 2021</text>
</svg>
