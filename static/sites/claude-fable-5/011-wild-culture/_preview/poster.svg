<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Wild Culture — Good things take time.</title>
  <defs>
    <clipPath id="jar"><rect x="770" y="240" width="300" height="440" rx="46"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="#fff3e2"/>
  <rect x="34" y="34" width="1132" height="832" rx="34" fill="none" stroke="#2c1a12" stroke-width="8"/>

  <!-- scattered bubbles -->
  <g fill="#f4d7e0">
    <circle cx="150" cy="150" r="26"/>
    <circle cx="240" cy="740" r="38"/>
    <circle cx="640" cy="120" r="18"/>
    <circle cx="120" cy="470" r="14"/>
    <circle cx="560" cy="790" r="22"/>
  </g>
  <g fill="#dce8d4">
    <circle cx="1060" cy="140" r="30"/>
    <circle cx="700" cy="690" r="16"/>
    <circle cx="90" cy="640" r="20"/>
  </g>

  <!-- jar -->
  <rect x="770" y="240" width="300" height="440" rx="46" fill="#fbe7c8"/>
  <g clip-path="url(#jar)">
    <rect x="770" y="360" width="300" height="320" fill="#e2572b"/>
    <path d="M770 368 q38 -20 75 0 t75 0 t75 0 t75 0 V680 H770 Z" fill="#c8431f"/>
    <g fill="#fff3e2">
      <circle cx="840" cy="620" r="14"/>
      <circle cx="920" cy="580" r="10"/>
      <circle cx="990" cy="640" r="17"/>
      <circle cx="880" cy="500" r="8"/>
      <circle cx="960" cy="440" r="11"/>
      <circle cx="1020" cy="530" r="7"/>
    </g>
  </g>
  <rect x="770" y="240" width="300" height="440" rx="46" fill="none" stroke="#2c1a12" stroke-width="10"/>
  <rect x="800" y="178" width="240" height="64" rx="24" fill="#4a7c59" stroke="#2c1a12" stroke-width="10"/>
  <rect x="826" y="140" width="188" height="42" rx="16" fill="#3a6247" stroke="#2c1a12" stroke-width="10"/>
  <path d="M824 308 q96 40 192 0" fill="none" stroke="#2c1a12" stroke-width="7" stroke-linecap="round" opacity=".25"/>
  <text x="920" y="595" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#fff3e2">BATCH №9</text>
  <text x="920" y="634" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#fbe7c8">still going</text>

  <!-- copy -->
  <rect x="110" y="150" width="342" height="52" rx="26" fill="#4a7c59"/>
  <text x="281" y="185" text-anchor="middle" font-family="Avenir, 'Segoe UI', sans-serif" font-size="24" font-weight="bold" letter-spacing="3" fill="#fff3e2">FERMENTED IN BROOKLYN</text>

  <text x="110" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="bold" fill="#2c1a12">Wild</text>
  <text x="110" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="bold" fill="#2c1a12">Culture</text>

  <text x="110" y="545" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#e2572b">Good things take time.</text>

  <text x="110" y="625" font-family="Avenir, 'Segoe UI', sans-serif" font-size="27" fill="#2c1a12">Live cultures · seasonal pantry goods</text>
  <text x="110" y="665" font-family="Avenir, 'Segoe UI', sans-serif" font-size="27" fill="#2c1a12">&amp; hands-on workshops</text>

  <line x1="110" y1="712" x2="640" y2="712" stroke="#2c1a12" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>

  <text x="110" y="775" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#2c1a12">kraut ✺ kimchi ✺ kombucha ✺ miso</text>
</svg>
