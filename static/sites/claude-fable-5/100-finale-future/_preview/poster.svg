<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pt pd">
  <title id="pt">Finale</title>
  <desc id="pd">One hundred visions. One strange future. October 08–10, everywhere.</desc>
  <rect width="1200" height="900" fill="#0b0b12"/>

  <!-- pulse bars motif -->
  <g opacity="0.55">
    <rect x="880" y="250" width="46" height="400" rx="8" fill="#8b7bff"/>
    <rect x="944" y="180" width="46" height="540" rx="8" fill="#d8ff3e"/>
    <rect x="1008" y="300" width="46" height="300" rx="8" fill="#f2f0ea" opacity="0.35"/>
    <rect x="1072" y="140" width="46" height="620" rx="8" fill="#8b7bff"/>
    <rect x="1136" y="260" width="46" height="380" rx="8" fill="#d8ff3e"/>
  </g>

  <!-- frame lines -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#f2f0ea" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="0" y1="780" x2="1200" y2="780" stroke="#f2f0ea" stroke-opacity="0.16" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="80" y="88" font-family="Consolas, Menlo, monospace" font-size="26" letter-spacing="6" fill="#d8ff3e">OCTOBER 08–10 / EVERYWHERE</text>

  <!-- wordmark -->
  <text x="80" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="190" font-weight="800" letter-spacing="4" fill="#f2f0ea">FINALE<tspan fill="#d8ff3e">●</tspan></text>

  <!-- tagline -->
  <text x="80" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f2f0ea">ONE HUNDRED</text>
  <text x="80" y="530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="none" stroke="#8b7bff" stroke-width="2.5">VISIONS.</text>
  <text x="80" y="610" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f2f0ea">ONE STRANGE</text>
  <text x="80" y="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="none" stroke="#8b7bff" stroke-width="2.5">FUTURE.</text>

  <!-- footer strip -->
  <text x="80" y="842" font-family="Consolas, Menlo, monospace" font-size="24" letter-spacing="5" fill="#8b7bff">DIGITAL ART ● SOUND ● CODE ● PERFORMANCE ● CONVERSATION</text>

  <!-- vision number chip -->
  <g>
    <rect x="900" y="40" width="220" height="64" rx="32" fill="none" stroke="#d8ff3e" stroke-width="2.5"/>
    <text x="1010" y="82" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="30" letter-spacing="4" fill="#d8ff3e">Nº 100</text>
  </g>
</svg>
