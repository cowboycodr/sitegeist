<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Glyph Department — Typefaces with something to say.</title>
  <rect width="1200" height="900" fill="#101014"/>

  <!-- backdrop specimen glyphs -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="none" stroke="#2c2c36" stroke-width="2">
    <text x="-40" y="330" font-size="420" font-weight="900">A</text>
    <text x="880" y="860" font-size="460" font-weight="900" font-style="italic">g</text>
    <text x="500" y="250" font-size="260" font-weight="400">?</text>
  </g>

  <!-- giant featured glyph -->
  <text x="860" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="900"
        fill="#ff4d1c" text-anchor="middle">G</text>
  <text x="1005" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="300"
        font-style="italic" fill="#d8ff3e" text-anchor="middle">g</text>

  <!-- baseline / x-height guides over the glyph -->
  <g stroke="#d8ff3e" stroke-width="2" stroke-dasharray="10 8" opacity="0.55">
    <line x1="620" y1="560" x2="1160" y2="560"/>
    <line x1="620" y1="160" x2="1160" y2="160"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="20" fill="#d8ff3e" opacity="0.85">
    <text x="622" y="550">baseline</text>
    <text x="622" y="150">cap height</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="130" font-family="Menlo, Consolas, monospace" font-size="26" letter-spacing="8"
        fill="#d8ff3e">INDEPENDENT TYPE FOUNDRY</text>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f2efe6">
    <text x="76" y="480" font-size="150" font-weight="900" letter-spacing="-4">Glyph</text>
    <text x="76" y="620" font-size="150" font-weight="900" letter-spacing="-4">Dept<tspan fill="#ff4d1c">.</tspan></text>
  </g>

  <!-- tagline -->
  <text x="80" y="710" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#b9b5a8">
    Typefaces with <tspan font-style="italic" fill="#ff4d1c">something</tspan> to say.
  </text>

  <!-- footer specimen strip -->
  <rect x="0" y="790" width="1200" height="110" fill="#17171d"/>
  <line x1="0" y1="790" x2="1200" y2="790" stroke="#2c2c36" stroke-width="2"/>
  <text x="600" y="860" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="44" fill="#6d6a63">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm 0123456789 ¶ § ★</text>
</svg>
