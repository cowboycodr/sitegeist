<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Veldt Parfums — Landscapes, bottled.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ead8"/>
      <stop offset="0.55" stop-color="#e9d3ac"/>
      <stop offset="1" stop-color="#d9b47f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- Sun and distant smoke -->
  <circle cx="920" cy="250" r="90" fill="#c96f3a" opacity="0.85"/>
  <path d="M820 130c30 34 16 76-18 96 40-6 68-34 68-73 0-9-2-17-4-23z" fill="#6f6a5e" opacity="0.35"/>

  <!-- Grassland horizon bands -->
  <path d="M0 620 Q 200 570 400 600 T 800 592 T 1200 606 V900 H0 Z" fill="#a3814d" opacity="0.55"/>
  <path d="M0 668 Q 220 620 470 648 T 900 642 T 1200 656 V900 H0 Z" fill="#7d6136" opacity="0.75"/>
  <path d="M0 730 Q 250 700 540 718 T 1200 714 V900 H0 Z" fill="#4e3d24"/>

  <!-- Grass stems -->
  <g stroke="#2c2214" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M150 730v-80m0 22l-18-28m18 16l22-32"/>
    <path d="M340 726v-96m0 28l-20-32m20 18l18-28"/>
    <path d="M980 732v-76m0 18l-19-26m19 18l24-34"/>
    <path d="M1120 728v-88m0 24l-16-30m16 16l20-30"/>
  </g>

  <!-- Bottle -->
  <g>
    <rect x="558" y="330" width="84" height="60" rx="10" fill="#3a2d1a"/>
    <rect x="544" y="388" width="112" height="38" rx="8" fill="#8a7a5c"/>
    <path d="M498 426h204c22 74 30 138 30 202 0 100-56 152-132 152s-132-52-132-152c0-64 8-128 30-202z" fill="#e9d3ac" stroke="#4e3d24" stroke-width="4"/>
    <path d="M600 500c-34 52-34 112 0 164 34-52 34-112 0-164z" fill="#c96f3a" opacity="0.85"/>
    <circle cx="600" cy="582" r="16" fill="#f4ead8"/>
  </g>

  <!-- Type -->
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="#7d6136">OLFACTORY LANDSCAPE No. 06</text>
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#4e3d24">Veldt Parfums</text>

  <text x="600" y="836" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#f4ead8">Landscapes, bottled.</text>
  <line x1="450" y1="864" x2="750" y2="864" stroke="#d9b47f" stroke-width="2"/>
</svg>
