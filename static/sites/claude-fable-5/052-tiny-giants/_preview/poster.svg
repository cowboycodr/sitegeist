<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title">
  <title id="poster-title">Tiny Giants — Big wonder for little minds</title>
  <!-- background -->
  <rect width="1200" height="900" fill="#fffaf0"/>
  <circle cx="920" cy="450" r="360" fill="#ffb703"/>
  <circle cx="920" cy="450" r="360" fill="none" stroke="#073b4c" stroke-width="8" stroke-dasharray="3 38" stroke-linecap="round"/>

  <!-- stacked-block giant -->
  <g>
    <rect x="790" y="520" width="260" height="130" rx="24" fill="#ef6461"/>
    <circle cx="850" cy="585" r="15" fill="#ffb703"/>
    <circle cx="990" cy="585" r="15" fill="#ffb703"/>
    <rect x="818" y="400" width="204" height="112" rx="24" fill="#2ec4b6"/>
    <circle cx="862" cy="456" r="13" fill="#fffaf0"/>
    <circle cx="978" cy="456" r="13" fill="#fffaf0"/>
    <rect x="844" y="288" width="152" height="104" rx="24" fill="#fffaf0" stroke="#073b4c" stroke-width="8"/>
    <circle cx="890" cy="332" r="10" fill="#073b4c"/>
    <circle cx="950" cy="332" r="10" fill="#073b4c"/>
    <path d="M886 362 Q920 386 954 362" fill="none" stroke="#073b4c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- floating shapes -->
  <circle cx="655" cy="230" r="30" fill="#2ec4b6"/>
  <rect x="1122" y="200" width="58" height="58" rx="14" fill="#ef6461" transform="rotate(14 1151 229)"/>
  <path d="M1112 690 l30 54 h-60 z" fill="#073b4c"/>
  <circle cx="668" cy="668" r="18" fill="#fffaf0" stroke="#073b4c" stroke-width="8"/>

  <!-- text block -->
  <g font-family="Trebuchet MS, Verdana, sans-serif">
    <rect x="80" y="150" width="252" height="52" rx="26" fill="#073b4c"/>
    <circle cx="112" cy="176" r="8" fill="#ef6461"/>
    <text x="132" y="184" font-size="24" font-weight="bold" letter-spacing="4" fill="#fffaf0">NOW PLAYING</text>

    <text x="76" y="330" font-size="132" font-weight="bold" fill="#073b4c" letter-spacing="-3">Tiny</text>
    <text x="76" y="460" font-size="132" font-weight="bold" fill="#ef6461" letter-spacing="-3">Giants</text>
    <path d="M80 496 q26 -22 52 0 t52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#2ec4b6" stroke-width="10" stroke-linecap="round"/>

    <text x="80" y="580" font-size="42" font-weight="bold" fill="#073b4c">Big wonder for little minds.</text>
    <text x="80" y="640" font-size="27" fill="#073b4c" opacity="0.85">Build worlds. Chase questions.</text>
    <text x="80" y="678" font-size="27" fill="#073b4c" opacity="0.85">Make magnificent messes.</text>

    <rect x="80" y="726" width="330" height="66" rx="33" fill="#ef6461" stroke="#073b4c" stroke-width="6"/>
    <text x="245" y="769" font-size="27" font-weight="bold" fill="#fffaf0" text-anchor="middle">Plan your visit</text>
    <rect x="430" y="726" width="228" height="66" rx="33" fill="#fffaf0" stroke="#073b4c" stroke-width="6"/>
    <text x="544" y="769" font-size="27" font-weight="bold" fill="#073b4c" text-anchor="middle">Children&#8217;s Museum</text>
  </g>

  <!-- frame -->
  <rect x="14" y="14" width="1172" height="872" rx="34" fill="none" stroke="#073b4c" stroke-width="12"/>
</svg>
