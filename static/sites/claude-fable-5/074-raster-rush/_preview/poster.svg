<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Raster Rush — Tiny pixels. Huge worlds.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#12002b"/>
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="26" y="26" width="1148" height="848" fill="none" stroke="#ff2d78" stroke-width="8"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#16f4d0" stroke-width="3" stroke-opacity="0.5"/>

  <!-- corner pixels -->
  <g fill="#ffd23f">
    <rect x="26" y="26" width="28" height="28"/>
    <rect x="1146" y="26" width="28" height="28"/>
    <rect x="26" y="846" width="28" height="28"/>
    <rect x="1146" y="846" width="28" height="28"/>
  </g>

  <!-- invader sprite, 1 unit = 22px -->
  <g transform="translate(446,120)" fill="#16f4d0">
    <rect x="22" y="0" width="22" height="22"/><rect x="110" y="0" width="22" height="22"/>
    <rect x="44" y="22" width="22" height="22"/><rect x="66" y="22" width="22" height="22"/><rect x="88" y="22" width="22" height="22"/>
    <rect x="0" y="44" width="22" height="22"/><rect x="44" y="44" width="22" height="22"/><rect x="66" y="44" width="22" height="22"/><rect x="88" y="44" width="22" height="22"/><rect x="132" y="44" width="22" height="22"/>
    <rect x="22" y="44" width="22" height="22" fill="#fdf6ff"/><rect x="110" y="44" width="22" height="22" fill="#fdf6ff"/>
    <rect x="0" y="66" width="22" height="22"/><rect x="22" y="66" width="22" height="22"/><rect x="44" y="66" width="22" height="22"/><rect x="66" y="66" width="22" height="22"/><rect x="88" y="66" width="22" height="22"/><rect x="110" y="66" width="22" height="22"/><rect x="132" y="66" width="22" height="22"/>
    <rect x="22" y="88" width="22" height="22"/><rect x="110" y="88" width="22" height="22"/>
    <rect x="0" y="110" width="22" height="22"/><rect x="132" y="110" width="22" height="22"/>
  </g>

  <!-- side pixels -->
  <g>
    <rect x="150" y="180" width="30" height="30" fill="#ff7a00"/>
    <rect x="180" y="210" width="30" height="30" fill="#ffd23f"/>
    <rect x="990" y="160" width="30" height="30" fill="#ff2d78"/>
    <rect x="1020" y="190" width="30" height="30" fill="#16f4d0"/>
    <rect x="150" y="640" width="30" height="30" fill="#16f4d0"/>
    <rect x="1010" y="630" width="30" height="30" fill="#ffd23f"/>
    <rect x="980" y="660" width="30" height="30" fill="#ff7a00"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="330" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="34" letter-spacing="14" fill="#ffd23f" font-weight="bold">INSERT IMAGINATION</text>

  <!-- title with pixel drop shadows -->
  <text x="610" y="480" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="150" font-weight="bold" fill="#16f4d0" opacity="0.55">RASTER</text>
  <text x="600" y="470" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="150" font-weight="bold" fill="#ff2d78">RASTER</text>
  <text x="610" y="620" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="150" font-weight="bold" fill="#ff2d78" opacity="0.55">RUSH</text>
  <text x="600" y="610" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="150" font-weight="bold" fill="#16f4d0">RUSH</text>

  <!-- tagline plate -->
  <rect x="290" y="670" width="620" height="74" fill="#ffd23f"/>
  <rect x="302" y="682" width="620" height="74" fill="none" stroke="#ff2d78" stroke-width="6"/>
  <text x="600" y="719" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" letter-spacing="4" fill="#12002b">TINY PIXELS. HUGE WORLDS.</text>

  <!-- footer -->
  <text x="600" y="812" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="26" letter-spacing="10" fill="#9b86bf">GAME STUDIO · PRESS START</text>
</svg>
