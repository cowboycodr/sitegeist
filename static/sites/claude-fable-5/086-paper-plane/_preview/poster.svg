<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Paper Plane — a slow-travel journal</title>
  <desc id="d">A paper-textured poster with a rust-colored paper plane trailing a dotted flight path, the Paper Plane wordmark, and the tagline: go somewhere worth writing down.</desc>

  <!-- paper ground -->
  <rect width="1200" height="900" fill="#f6f0e4"/>
  <rect width="1200" height="900" fill="url(#wash)"/>
  <defs>
    <radialGradient id="wash" cx="18%" cy="12%" r="90%">
      <stop offset="0" stop-color="#c8973f" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#f6f0e4" stop-opacity="0"/>
      <stop offset="1" stop-color="#3e6b74" stop-opacity=".10"/>
    </radialGradient>
  </defs>

  <!-- border frame -->
  <rect x="34" y="34" width="1132" height="832" fill="none" stroke="#28241c" stroke-width="3"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#c8973f" stroke-width="1.5" stroke-dasharray="2 8"/>

  <!-- faint river motif -->
  <path d="M-20 700 C 220 640, 420 730, 640 650 S 1020 500, 1230 540" fill="none" stroke="#8fb6bd" stroke-width="30" stroke-linecap="round" opacity=".35"/>

  <!-- flight path -->
  <path d="M120 780 C 300 700, 420 730, 560 620 C 700 510, 700 430, 830 350 C 930 288, 960 250, 1010 195" fill="none" stroke="#3e6b74" stroke-width="4" stroke-dasharray="4 18" stroke-linecap="round"/>

  <!-- paper plane -->
  <g transform="translate(960,150) rotate(28)">
    <path d="M0 62 L188 0 L118 152 L84 92 Z" fill="#b5502a"/>
    <path d="M84 92 L188 0 L98 118 Z" fill="#8f3c1d"/>
    <path d="M0 62 L118 42 L84 92 Z" fill="#d3693c"/>
  </g>

  <!-- eyebrow badge -->
  <g font-family="Courier New, Courier, monospace" letter-spacing="6">
    <rect x="120" y="128" rx="26" width="440" height="52" fill="#fdf9ef" stroke="#b5502a" stroke-width="2.5"/>
    <text x="340" y="162" text-anchor="middle" font-size="24" fill="#8f3c1d">DISPATCH No. 28 / TBILISI</text>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#28241c">
    <text x="114" y="352" font-size="150" font-weight="bold" letter-spacing="-2">Paper</text>
    <text x="114" y="500" font-size="150" font-style="italic" fill="#b5502a" letter-spacing="-2">Plane</text>
    <text x="120" y="586" font-size="42" font-style="italic" fill="#5c5442">Go somewhere worth writing down.</text>
  </g>

  <!-- stamp -->
  <g transform="translate(985,720) rotate(-6)" font-family="Courier New, Courier, monospace">
    <rect x="-130" y="-44" width="260" height="88" rx="10" fill="none" stroke="#3e6b74" stroke-width="4"/>
    <text y="-8" text-anchor="middle" font-size="26" letter-spacing="4" fill="#3e6b74">POSTED</text>
    <text y="26" text-anchor="middle" font-size="22" letter-spacing="3" fill="#3e6b74">TBS &#8594; YOU</text>
  </g>

  <!-- footer line -->
  <g font-family="Courier New, Courier, monospace" fill="#5c5442">
    <text x="120" y="800" font-size="24" letter-spacing="6">A SLOW-TRAVEL JOURNAL</text>
    <text x="120" y="836" font-size="20" letter-spacing="4">CITY GUIDES &#183; TRAIN ROUTES &#183; STORIES FROM THE ROAD</text>
  </g>
</svg>
