<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Paprika — poster preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #1c0806;
    padding: 2rem;
    box-sizing: border-box;
  }
  img {
    width: min(100%, 960px);
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<img src="poster.svg" alt="Paprika gallery poster: a stylized paprika pepper with steam above the wordmark and the tagline “Dinner should feel alive.”">
</body>
</html>
