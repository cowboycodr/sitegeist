<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Paprika — Dinner should feel alive.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0f0c"/>
      <stop offset="1" stop-color="#5a1a10"/>
    </linearGradient>
    <linearGradient id="pepper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2632f"/>
      <stop offset="1" stop-color="#b2380f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- scattered spice flecks -->
  <g fill="#f2a516" opacity="0.55">
    <circle cx="120" cy="140" r="5"/>
    <circle cx="1080" cy="120" r="4"/>
    <circle cx="990" cy="760" r="6"/>
    <circle cx="180" cy="770" r="4"/>
    <circle cx="1110" cy="430" r="5"/>
    <circle cx="90" cy="460" r="4"/>
    <circle cx="610" cy="90" r="4"/>
  </g>

  <!-- pepper motif -->
  <g transform="translate(600 300)">
    <circle r="190" fill="#fff4e6"/>
    <circle r="168" fill="#d9481f" opacity="0.14"/>
    <path d="M32 -158c12-26 40-40 66-38 0 0-8 38-30 56 34 26 56 74 56 128 0 88-58 148-124 148S-124 76 -124 -12c0-72 48-126 116-130 14-1 32 3 40-16Z" fill="url(#pepper)"/>
    <path d="M16 -178c10-14 26-20 42-20" fill="none" stroke="#4c7a2f" stroke-width="14" stroke-linecap="round"/>
    <path d="M-70 -60c16-32 46-50 74-50" fill="none" stroke="#fff4e6" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <!-- steam -->
    <g stroke="#f2a516" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M-150 -210c0-24 16-30 16-52"/>
      <path d="M150 -220c0-24 16-30 16-52"/>
    </g>
  </g>

  <!-- eyebrow badge -->
  <g transform="translate(600 548)">
    <rect x="-118" y="-26" width="236" height="52" rx="26" fill="#d9481f"/>
    <text x="0" y="9" text-anchor="middle" fill="#fff4e6" font-family="'Avenir Next','Trebuchet MS','Segoe UI',sans-serif" font-size="24" font-weight="700" letter-spacing="5">MADE NEARBY</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="680" text-anchor="middle" fill="#fff4e6" font-family="'Avenir Next','Trebuchet MS','Segoe UI',sans-serif" font-size="132" font-weight="800" letter-spacing="2">Paprika</text>

  <!-- tagline -->
  <text x="600" y="748" text-anchor="middle" fill="#f2a516" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="40">Dinner should feel alive.</text>

  <!-- dashed rule -->
  <line x1="380" y1="796" x2="820" y2="796" stroke="#7a2a17" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <text x="600" y="842" text-anchor="middle" fill="#ffe9d2" font-family="'Avenir Next','Trebuchet MS','Segoe UI',sans-serif" font-size="24" font-weight="600" letter-spacing="4">CHEF-MADE · DELIVERED HOT · FOOD DELIVERY</text>

  <!-- frame -->
  <rect x="24" y="24" width="1152" height="852" rx="28" fill="none" stroke="#f2a516" stroke-width="4" opacity="0.65"/>
</svg>
