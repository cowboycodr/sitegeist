<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="NULL Laboratory — prototypes for uncertain futures">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#1d2a20" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#070a08"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#1d2a20" stroke-width="2"/>

  <!-- brand mark: null symbol -->
  <g stroke="#7cff6b" stroke-width="6" fill="none">
    <circle cx="120" cy="128" r="34"/>
    <line x1="96" y1="152" x2="144" y2="104"/>
  </g>

  <!-- eyebrow -->
  <g font-family="Menlo, Consolas, monospace">
    <rect x="182" y="106" width="330" height="44" fill="rgba(124,255,107,0.14)" stroke="#1d2a20"/>
    <rect x="198" y="122" width="12" height="12" fill="#7cff6b"/>
    <text x="226" y="137" font-size="20" letter-spacing="3" fill="#7cff6b">RESEARCH INDEX / 0090</text>
  </g>

  <!-- title -->
  <g font-family="Menlo, Consolas, monospace" font-weight="700">
    <text x="100" y="330" font-size="150" fill="#d9e4da" letter-spacing="-4">NULL</text>
    <text x="100" y="470" font-size="112" fill="none" stroke="#7cff6b" stroke-width="2.5" letter-spacing="-2">LABORATORY</text>
  </g>

  <!-- tagline -->
  <text x="100" y="546" font-family="Menlo, Consolas, monospace" font-size="30" fill="#8fa294">Prototypes for uncertain futures.</text>

  <!-- experiment ticker rows -->
  <g font-family="Menlo, Consolas, monospace" font-size="22">
    <g transform="translate(100 630)">
      <circle cx="10" cy="-7" r="6" fill="#7cff6b"/>
      <text x="34" y="0" fill="#7cff6b">EXP-014</text>
      <text x="164" y="0" fill="#8fa294">Peripheral Compiler</text>
      <text x="960" y="0" fill="#7cff6b" text-anchor="end">LIVE</text>
      <line x1="0" y1="24" x2="1000" y2="24" stroke="#1d2a20" stroke-dasharray="2 6"/>
    </g>
    <g transform="translate(100 700)">
      <circle cx="10" cy="-7" r="6" fill="#ffc861"/>
      <text x="34" y="0" fill="#7cff6b">EXP-023</text>
      <text x="164" y="0" fill="#8fa294">Sympathetic Cursor</text>
      <text x="960" y="0" fill="#ffc861" text-anchor="end">DRIFTING</text>
      <line x1="0" y1="24" x2="1000" y2="24" stroke="#1d2a20" stroke-dasharray="2 6"/>
    </g>
    <g transform="translate(100 770)">
      <circle cx="10" cy="-7" r="6" fill="#ff7a6b"/>
      <text x="34" y="0" fill="#7cff6b">EXP-036</text>
      <text x="164" y="0" fill="#8fa294">Consensus Keyboard</text>
      <text x="960" y="0" fill="#ff7a6b" text-anchor="end">HALTED</text>
      <line x1="0" y1="24" x2="1000" y2="24" stroke="#1d2a20" stroke-dasharray="2 6"/>
    </g>
  </g>

  <!-- scan line accent -->
  <rect x="40" y="580" width="1120" height="3" fill="#7cff6b" opacity="0.35"/>

  <!-- corner readout -->
  <text x="1100" y="140" font-family="Menlo, Consolas, monospace" font-size="22" fill="#8fa294" text-anchor="end">D199.a0</text>

  <!-- footer strip -->
  <text x="600" y="838" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#8fa294" text-anchor="middle">EXPERIMENTAL TECH · SPATIAL COMPUTING · MACHINE PERCEPTION</text>
</svg>
