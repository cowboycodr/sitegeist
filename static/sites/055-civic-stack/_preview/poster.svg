<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Civic Stack — Better tools for public life</title><desc id="desc">Promotional poster with civic service cards orbiting a central public-by-design circle.</desc>
  <rect width="1200" height="900" fill="#f4f1e8"/><rect x="735" width="465" height="900" fill="#0d6967"/>
  <g fill="#142f36"><rect x="70" y="66" width="18" height="35" rx="9"/><rect x="96" y="48" width="18" height="53" rx="9"/><rect x="122" y="58" width="18" height="43" rx="9"/><text x="160" y="89" font-family="Arial,sans-serif" font-size="28" font-weight="700">Civic Stack</text></g>
  <circle cx="947" cy="417" r="275" fill="none" stroke="#f4f1e8" stroke-opacity=".3" stroke-width="2"/><circle cx="947" cy="417" r="190" fill="#88d5c6"/><text x="947" y="387" text-anchor="middle" fill="#0d6967" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4">PUBLIC</text><text x="947" y="421" text-anchor="middle" fill="#0d6967" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4">BY</text><text x="947" y="455" text-anchor="middle" fill="#0d6967" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4">DESIGN</text>
  <text x="70" y="205" fill="#142f36" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">TECHNOLOGY FOR EVERYONE</text>
  <text x="65" y="335" fill="#142f36" font-family="Georgia,serif" font-size="104">Better tools</text><text x="65" y="445" fill="#142f36" font-family="Georgia,serif" font-size="104">for </text><text x="235" y="445" fill="#0d6967" font-family="Georgia,serif" font-size="104" font-style="italic">public life.</text>
  <text x="70" y="530" fill="#142f36" font-family="Arial,sans-serif" font-size="23">Open infrastructure for clear, accessible</text><text x="70" y="564" fill="#142f36" font-family="Arial,sans-serif" font-size="23">local government services.</text>
  <g transform="translate(720 154) rotate(-4)"><rect width="225" height="105" fill="#f4f1e8"/><circle cx="40" cy="42" r="20" fill="#f06e55"/><text x="76" y="32" fill="#142f36" font-family="Arial" font-size="11" letter-spacing="2">HOUSING</text><text x="76" y="55" fill="#142f36" font-family="Arial" font-size="14" font-weight="700">Application received</text><text x="76" y="76" fill="#61777a" font-family="Arial" font-size="11">Updated today</text></g>
  <g transform="translate(937 588) rotate(3)"><rect width="225" height="105" fill="#f4f1e8"/><circle cx="40" cy="42" r="20" fill="#f06e55"/><text x="76" y="32" fill="#142f36" font-family="Arial" font-size="11" letter-spacing="2">COMMUNITY</text><text x="76" y="55" fill="#142f36" font-family="Arial" font-size="14" font-weight="700">Next meeting</text><text x="76" y="76" fill="#61777a" font-family="Arial" font-size="11">Tuesday · 6:00 PM</text></g>
  <rect x="70" y="700" width="270" height="61" fill="#142f36"/><text x="95" y="738" fill="#fff" font-family="Arial" font-size="15" font-weight="700">EXPLORE THE PLATFORM</text><text x="70" y="832" fill="#142f36" font-family="Arial" font-size="12" font-weight="700" letter-spacing="2">BUILT IN THE OPEN  ·  DESIGNED WITH COMMUNITIES</text>
