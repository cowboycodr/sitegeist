<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Agora Index gallery poster</title><desc id="desc">A bold civic data poster with a circular index score and four colorful city signals.</desc>
  <rect width="1200" height="900" fill="#f3f0e8"/>
  <g fill="#18231f" font-family="Arial, Helvetica, sans-serif">
    <circle cx="69" cy="65" r="25" fill="none" stroke="#18231f" stroke-width="4"/><circle cx="69" cy="65" r="6" fill="#ff795f"/>
    <text x="108" y="74" font-size="30" font-weight="700" letter-spacing="1">AGORA INDEX</text>
    <text x="1140" y="70" text-anchor="end" font-size="17" font-weight="700" letter-spacing="2">CITY PULSE / OPEN DATA</text>
    <line x1="42" y1="110" x2="1158" y2="110" stroke="#18231f" stroke-width="4"/>
    <text x="52" y="213" font-family="Georgia, serif" font-size="92" letter-spacing="-5">Public life,</text>
    <text x="52" y="307" font-family="Georgia, serif" font-size="92" font-style="italic" letter-spacing="-5" fill="#ff795f">made legible.</text>
    <text x="57" y="361" font-size="19" font-weight="700" letter-spacing="2">HOUSING · BUDGET · TRANSIT · PARTICIPATION</text>
  </g>
  <circle cx="938" cy="266" r="157" fill="#d7ff63" stroke="#18231f" stroke-width="4"/>
  <circle cx="938" cy="266" r="126" fill="none" stroke="#18231f" stroke-width="2" opacity=".5"/>
  <circle cx="938" cy="266" r="90" fill="none" stroke="#18231f" stroke-width="2" opacity=".4"/>
  <text x="938" y="286" text-anchor="middle" fill="#18231f" font-family="Georgia, serif" font-size="112" letter-spacing="-7">74</text>
  <text x="938" y="335" text-anchor="middle" fill="#18231f" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">CITY PULSE / 100</text>
  <g stroke="#18231f" stroke-width="4">
    <rect x="42" y="424" width="279" height="382" fill="#d7ff63"/><rect x="321" y="424" width="279" height="382" fill="#f3f0e8"/><rect x="600" y="424" width="279" height="382" fill="#8db8ff"/><rect x="879" y="424" width="279" height="382" fill="#ff795f"/>
  </g>
  <g fill="#18231f" font-family="Arial, Helvetica, sans-serif">
    <text x="66" y="468" font-size="14" font-weight="700" letter-spacing="2">01 / HOUSING</text><text x="66" y="605" font-family="Georgia,serif" font-size="92" letter-spacing="-5">31%</text><text x="66" y="645" font-size="13" font-weight="700">INCOME / MEDIAN RENT</text><rect x="66" y="748" width="220" height="10" fill="none" stroke="#18231f" stroke-width="2"/><rect x="66" y="748" width="150" height="10"/>
    <text x="345" y="468" font-size="14" font-weight="700" letter-spacing="2">02 / BUDGET</text><text x="345" y="605" font-family="Georgia,serif" font-size="83" letter-spacing="-5">$42m</text><text x="345" y="645" font-size="13" font-weight="700">PUBLIC WORKS / FY26</text><rect x="345" y="748" width="220" height="10" fill="none" stroke="#18231f" stroke-width="2"/><rect x="345" y="748" width="178" height="10"/>
    <text x="624" y="468" font-size="14" font-weight="700" letter-spacing="2">03 / TRANSIT</text><text x="624" y="605" font-family="Georgia,serif" font-size="92" letter-spacing="-5">87%</text><text x="624" y="645" font-size="13" font-weight="700">ON-TIME ARRIVALS</text><rect x="624" y="748" width="220" height="10" fill="none" stroke="#18231f" stroke-width="2"/><rect x="624" y="748" width="191" height="10"/>
    <text x="903" y="468" font-size="14" font-weight="700" letter-spacing="2">04 / VOICE</text><text x="903" y="605" font-family="Georgia,serif" font-size="86" letter-spacing="-5">6.2k</text><text x="903" y="645" font-size="13" font-weight="700">PUBLIC RESPONSES</text><rect x="903" y="748" width="220" height="10" fill="none" stroke="#18231f" stroke-width="2"/><rect x="903" y="748" width="136" height="10"/>
    <text x="42" y="858" font-size="17" font-weight="700" letter-spacing="2">OPEN CIVIC INTELLIGENCE FOR EVERYONE.</text><text x="1158" y="858" text-anchor="end" font-family="Georgia,serif" font-size="23" font-style="italic">agora / a public gathering place</text>
  </g>
</svg>
