  <text x="70" y="352" fill="#102c28" font-family="Arial,Helvetica,sans-serif" font-size="93" font-weight="700" letter-spacing="-5">Make every</text><text x="70" y="452" fill="#7f9d8c" font-family="Georgia,serif" font-style="italic" font-size="104">tonne visible.</text>
  <text x="76" y="530" fill="#52675f" font-family="Arial,Helvetica,sans-serif" font-size="23">Measure clearly. Reduce meaningfully.</text>
