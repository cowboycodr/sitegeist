<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Carbon Zero — Make every tonne visible</title><desc id="desc">Promotional poster with a carbon intelligence graph and luminous circular motif.</desc>
