<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Crumb Society</title><desc id="desc">A bold bakery poster with a spiral pastry and the words Loud pastry, quiet mornings.</desc>
