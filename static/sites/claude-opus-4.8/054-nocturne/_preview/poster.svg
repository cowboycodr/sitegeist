<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Nocturne — Scent after dark, poster">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d1c"/>
      <stop offset="0.5" stop-color="#0d1122"/>
      <stop offset="1" stop-color="#05060e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="55%">
      <stop offset="0" stop-color="#a3aefc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a3aefc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f5f3ec"/>
      <stop offset="0.55" stop-color="#c9cbde"/>
      <stop offset="1" stop-color="#6d7093"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3aefc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a3aefc" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ec"/>
      <stop offset="0.7" stop-color="#bcbad2"/>
      <stop offset="1" stop-color="#7c7f9e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#dfe2f4">
    <circle cx="120" cy="130" r="2.4" opacity="0.7"/>
    <circle cx="250" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="360" cy="200" r="2" opacity="0.6"/>
    <circle cx="180" cy="300" r="1.4" opacity="0.4"/>
    <circle cx="520" cy="120" r="1.8" opacity="0.55"/>
    <circle cx="80" cy="480" r="2" opacity="0.5"/>
    <circle cx="1080" cy="520" r="2.2" opacity="0.6"/>
    <circle cx="990" cy="640" r="1.5" opacity="0.45"/>
    <circle cx="1130" cy="360" r="1.8" opacity="0.5"/>
    <circle cx="640" cy="770" r="1.6" opacity="0.5"/>
    <circle cx="300" cy="720" r="2" opacity="0.55"/>
    <circle cx="450" cy="820" r="1.4" opacity="0.4"/>
  </g>

  <!-- crescent moon -->
  <g transform="translate(915 235)">
    <circle r="110" fill="url(#moon)"/>
    <circle cx="46" r="98" fill="#0a0d1c"/>
    <circle r="110" fill="none" stroke="#a3aefc" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- flacon motif -->
  <g transform="translate(600 470)" stroke-linejoin="round">
    <rect x="-26" y="-150" width="52" height="34" rx="6" fill="#a3aefc" opacity="0.65"/>
    <rect x="-36" y="-120" width="72" height="20" rx="5" fill="#a3aefc" opacity="0.35"/>
    <path d="M-80 -95 h160 a24 24 0 0 1 24 24 v186 a30 30 0 0 1 -30 30 h-148 a30 30 0 0 1 -30 -30 v-186 a24 24 0 0 1 24 -24 z"
      fill="url(#glass)" stroke="#a3aefc" stroke-opacity="0.6" stroke-width="2"/>
    <ellipse cx="0" cy="35" rx="42" ry="58" fill="#b78bd0" opacity="0.3"/>
    <line x1="-78" y1="-58" x2="80" y2="-58" stroke="#a3aefc" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="720" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
    font-size="120" letter-spacing="6" fill="url(#title)">Nocturne</text>
  <text x="600" y="768" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
    font-size="34" fill="#b7bcd0">Scent after dark.</text>
  <text x="600" y="820" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="21" letter-spacing="10" fill="#a3aefc">PARFUMS DE NUIT</text>

  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#b7bcd0" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
