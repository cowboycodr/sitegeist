<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Carbon Zero — gallery poster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06110b; display: grid; place-items: center; }
    figure { margin: 0; width: min(94vw, 1000px); }
    img { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    figcaption { color: #8fae9d; font-family: "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; padding: 14px; }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Carbon Zero gallery poster — Make every tonne visible." width="1200" height="900" />
    <figcaption>Carbon Zero · 4:3 gallery poster</figcaption>
  </figure>
</body>
</html>
