<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Blue Hour Club — live jazz in Chicago">
  <defs>
    <radialGradient id="sky" cx="50%" cy="-6%" r="115%">
      <stop offset="0%" stop-color="#131b45"/>
      <stop offset="45%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#f0c98f"/>
      <stop offset="45%" stop-color="#e8b06a"/>
      <stop offset="100%" stop-color="rgba(232,176,106,0)"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c98f"/>
      <stop offset="100%" stop-color="#e8b06a"/>
    </linearGradient>
    <linearGradient id="keyshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(232,176,106,0.22)"/>
      <stop offset="45%" stop-color="rgba(232,176,106,0)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- glow haze -->
  <ellipse cx="600" cy="300" rx="520" ry="360" fill="url(#lamp)" opacity="0.55"/>
  <ellipse cx="150" cy="820" rx="360" ry="260" fill="#3d4f9c" opacity="0.18"/>

  <!-- lamp motif -->
  <circle cx="600" cy="300" r="128" fill="none" stroke="url(#amber)" stroke-width="6"/>
  <circle cx="600" cy="300" r="40" fill="url(#amber)"/>
  <circle cx="600" cy="300" r="128" fill="none" stroke="#f4efe4" stroke-width="1" opacity="0.35"/>

  <!-- eyebrow -->
  <text x="600" y="486" text-anchor="middle" fill="#e8b06a"
        font-family="Avenir Next, Segoe UI, system-ui, sans-serif"
        font-size="27" letter-spacing="13">LIVE IN CHICAGO</text>

  <!-- title -->
  <text x="600" y="586" text-anchor="middle" fill="#f4efe4"
        font-family="Iowan Old Style, Palatino Linotype, Georgia, serif"
        font-size="128" letter-spacing="1">Blue Hour</text>
  <text x="600" y="672" text-anchor="middle" fill="#f4efe4"
        font-family="Iowan Old Style, Palatino Linotype, Georgia, serif"
        font-size="64" letter-spacing="22">C L U B</text>

  <!-- tagline -->
  <text x="600" y="736" text-anchor="middle" fill="#cfd6f2"
        font-family="Iowan Old Style, Palatino Linotype, Georgia, serif"
        font-size="30" font-style="italic">The city sounds better after midnight.</text>

  <!-- piano keys strip -->
  <rect x="0" y="806" width="1200" height="94" fill="#10163a"/>
  <rect x="0" y="806" width="1200" height="94" fill="url(#keyshine)"/>
  <rect x="0" y="806" width="1200" height="4" fill="#e8b06a" opacity="0.6"/>
  <g fill="#060912">
    <rect x="72"  y="810" width="10" height="86"/>
    <rect x="168" y="810" width="10" height="86"/>
    <rect x="264" y="810" width="10" height="86"/>
    <rect x="360" y="810" width="10" height="86"/>
    <rect x="456" y="810" width="10" height="86"/>
    <rect x="552" y="810" width="10" height="86"/>
    <rect x="648" y="810" width="10" height="86"/>
    <rect x="744" y="810" width="10" height="86"/>
    <rect x="840" y="810" width="10" height="86"/>
    <rect x="936" y="810" width="10" height="86"/>
    <rect x="1032" y="810" width="10" height="86"/>
    <rect x="1128" y="810" width="10" height="86"/>
  </g>
</svg>
