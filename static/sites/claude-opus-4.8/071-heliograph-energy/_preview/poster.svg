<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Heliograph — Power, beautifully placed.">
  <defs>
    <radialGradient id="sky" cx="70%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#3a3168"/>
      <stop offset="55%" stop-color="#282253"/>
      <stop offset="100%" stop-color="#1c1740"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="55%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#f39119"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38316b"/>
      <stop offset="100%" stop-color="#4d4290"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#f6a723"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="860" cy="300" r="360" fill="#ffc857" opacity="0.10"/>
  <circle cx="860" cy="300" r="230" fill="#ffc857" opacity="0.10"/>

  <!-- radiating heliograph rays -->
  <g stroke="url(#glow)" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="860" y1="300" x2="860" y2="70"/>
    <line x1="860" y1="300" x2="1090" y2="300"/>
    <line x1="860" y1="300" x2="630" y2="300"/>
    <line x1="860" y1="300" x2="1022" y2="138"/>
    <line x1="860" y1="300" x2="698" y2="138"/>
    <line x1="860" y1="300" x2="1022" y2="462"/>
    <line x1="860" y1="300" x2="698" y2="462"/>
    <line x1="860" y1="300" x2="700" y2="200"/>
    <line x1="860" y1="300" x2="1020" y2="200"/>
    <line x1="860" y1="300" x2="700" y2="400"/>
    <line x1="860" y1="300" x2="1020" y2="400"/>
  </g>
  <circle cx="860" cy="300" r="86" fill="url(#sun)"/>

  <!-- brand mark + wordmark -->
  <g transform="translate(96 96)">
    <circle cx="34" cy="34" r="16" fill="#f6a723"/>
    <g stroke="#ffc857" stroke-width="5" stroke-linecap="round">
      <line x1="34" y1="4" x2="34" y2="16"/>
      <line x1="34" y1="52" x2="34" y2="64"/>
      <line x1="4" y1="34" x2="16" y2="34"/>
      <line x1="52" y1="34" x2="64" y2="34"/>
      <line x1="13" y1="13" x2="22" y2="22"/>
      <line x1="46" y1="46" x2="55" y2="55"/>
      <line x1="55" y1="13" x2="46" y2="22"/>
      <line x1="22" y1="46" x2="13" y2="55"/>
    </g>
    <text x="88" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#fdf7ec" letter-spacing="-1">Heliograph</text>
  </g>

  <!-- eyebrow -->
  <text x="96" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#c9713a">SOLAR INFRASTRUCTURE / 2026</text>

  <!-- headline -->
  <text x="92" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#fdf7ec" letter-spacing="-3">Power,</text>
  <text x="92" y="662" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#ffc857" letter-spacing="-3">beautifully</text>
  <text x="92" y="764" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#fdf7ec" letter-spacing="-3">placed.</text>

  <!-- tagline strip -->
  <text x="96" y="836" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="rgba(253,247,236,0.72)">Elegant solar for homes, campuses, and public space.</text>

  <!-- solar panel array at lower right -->
  <g transform="translate(760 620) rotate(-8)">
    <rect x="0" y="0" width="360" height="200" rx="14" fill="url(#panel)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <g stroke="rgba(255,255,255,0.20)" stroke-width="2">
      <line x1="90" y1="0" x2="90" y2="200"/>
      <line x1="180" y1="0" x2="180" y2="200"/>
      <line x1="270" y1="0" x2="270" y2="200"/>
      <line x1="0" y1="66" x2="360" y2="66"/>
      <line x1="0" y1="133" x2="360" y2="133"/>
    </g>
    <rect x="8" y="8" width="120" height="52" rx="4" fill="#ffc857" opacity="0.14"/>
  </g>
</svg>
