<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">Margin Quarterly — Issue 18</title>
  <desc id="posterDesc">A publishing poster for Margin Quarterly with the tagline "Ideas worth leaving room for."</desc>
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f331f"/>
      <stop offset="0.6" stop-color="#b5452b"/>
      <stop offset="1" stop-color="#6f2716"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#efe7d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f4efe4"/>

  <!-- marginal rule motif -->
  <line x1="150" y1="0" x2="150" y2="900" stroke="#d8cfba" stroke-width="2"/>
  <line x1="150" y1="0" x2="150" y2="900" stroke="#b5452b" stroke-width="2" stroke-dasharray="4 14"/>

  <!-- masthead -->
  <text x="200" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#26211b">Margin</text>
  <text x="200" y="152" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="10" fill="#8a7f6d">QUARTERLY</text>
  <text x="1050" y="120" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#b5452b">EST. 2009</text>
  <line x1="200" y1="185" x2="1050" y2="185" stroke="#d8cfba" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="200" y="270" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#b5452b">ISSUE 18 · THE DISTANCE BETWEEN</text>

  <!-- headline -->
  <text x="196" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#26211b" letter-spacing="-3">Ideas worth</text>
  <text x="196" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#26211b" letter-spacing="-3">leaving room</text>
  <text x="196" y="630" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#b5452b" letter-spacing="-3">for.</text>

  <!-- sub -->
  <text x="200" y="720" font-family="Georgia, serif" font-size="27" font-style="italic" fill="#574d40">Longform cultural criticism, generous typography,</text>
  <text x="200" y="758" font-family="Georgia, serif" font-size="27" font-style="italic" fill="#574d40">and editions worth keeping.</text>

  <!-- footer meta -->
  <line x1="200" y1="810" x2="1050" y2="810" stroke="#d8cfba" stroke-width="2"/>
  <text x="200" y="852" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#8a7f6d">PUBLISHING</text>
  <text x="1050" y="852" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#8a7f6d">AUTUMN · No. 18</text>

  <!-- collectible cover, upper right -->
  <g transform="translate(830 205) rotate(-3)">
    <rect x="0" y="0" width="220" height="290" rx="4" fill="#26211b" opacity="0.14"/>
    <rect x="-6" y="-6" width="220" height="290" rx="4" fill="url(#paperGrad)" stroke="#d8cfba"/>
    <rect x="-6" y="-6" width="18" height="290" rx="3" fill="url(#spine)"/>
    <text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#8a7f6d">MARGIN QUARTERLY</text>
    <text x="30" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b5452b">No. 18</text>
    <text x="30" y="150" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#26211b">The</text>
    <text x="30" y="188" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#26211b">distance</text>
    <text x="30" y="226" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#26211b">between</text>
    <rect x="30" y="244" width="86" height="3" fill="#b5452b"/>
    <text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#574d40">COLLECTIBLE EDITION</text>
  </g>
</svg>
