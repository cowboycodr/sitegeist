<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Salt Air — Poster preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16383e; padding: 2rem; }
  figure { margin: 0; max-width: 900px; width: 100%; }
  img { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.7); }
  figcaption { color: #7fb0ad; font-family: system-ui, sans-serif; text-align: center; margin-top: 1rem; letter-spacing: 0.04em; }
</style>
</head>
<body>
<figure>
  <img src="poster.svg" alt="Salt Air gallery poster — Stay close to the tide." />
  <figcaption>Salt Air · gallery poster (1200 × 900)</figcaption>
</figure>
</body>
</html>
