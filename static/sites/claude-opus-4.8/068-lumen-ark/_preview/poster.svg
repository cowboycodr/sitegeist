<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Lumen Ark — Buildings shaped by light">
	<defs>
		<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f4f0e8"/>
			<stop offset="1" stop-color="#ece5d8"/>
		</linearGradient>
		<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#241f1a"/>
			<stop offset="1" stop-color="#3c332a"/>
		</linearGradient>
		<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e7a34a" stop-opacity="0.85"/>
			<stop offset="1" stop-color="#e7a34a" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="slit" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e7a34a"/>
			<stop offset="1" stop-color="#c9772a"/>
		</linearGradient>
		<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#f2c079"/>
			<stop offset="1" stop-color="#c9772a"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#paper)"/>

	<!-- daylight beams across upper field -->
	<g opacity="0.55">
		<polygon points="300,0 420,0 640,900 460,900" fill="url(#beam)"/>
		<polygon points="520,0 590,0 780,900 660,900" fill="url(#beam)" opacity="0.7"/>
	</g>

	<!-- sun -->
	<circle cx="250" cy="180" r="88" fill="url(#sun)"/>
	<circle cx="250" cy="180" r="150" fill="#e7a34a" opacity="0.14"/>

	<!-- monolith with light slit (studio mark, enlarged) -->
	<g>
		<rect x="740" y="150" width="300" height="560" rx="20" fill="url(#ink)"/>
		<rect x="855" y="200" width="46" height="360" rx="23" fill="url(#slit)"/>
		<polygon points="855,560 901,560 960,710 796,710" fill="#e7a34a" opacity="0.28"/>
	</g>

	<!-- ground line -->
	<rect x="0" y="710" width="1200" height="4" fill="#d8cfbd"/>

	<!-- wordmark -->
	<text x="110" y="500" font-family="Palatino, Georgia, serif" font-size="132" letter-spacing="2" fill="#241f1a">Lumen<tspan font-style="italic" fill="#5a5147"> Ark</tspan></text>

	<text x="112" y="360" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="10" fill="#c9772a">ARCHITECTURE · COPENHAGEN</text>

	<text x="112" y="580" font-family="Palatino, Georgia, serif" font-size="46" fill="#5a5147" font-style="italic">Buildings shaped by light.</text>

	<text x="112" y="800" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#5a5147">Quiet, daylight-led spaces for culture and living.</text>
</svg>
