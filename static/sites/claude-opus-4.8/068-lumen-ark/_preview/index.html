<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
	<title>Lumen Ark — Gallery poster</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #241f1a; padding: 24px; }
		figure { margin: 0; width: min(100%, 900px); }
		img { width: 100%; height: auto; display: block; border-radius: 10px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7); }
		figcaption { color: #cfc7b8; font-family: Helvetica, Arial, sans-serif; font-size: 14px; letter-spacing: 0.08em; text-align: center; margin-top: 16px; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Lumen Ark gallery poster — Buildings shaped by light" />
		<figcaption>Lumen Ark · 4:3 gallery poster</figcaption>
	</figure>
</body>
</html>
