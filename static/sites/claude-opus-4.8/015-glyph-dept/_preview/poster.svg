<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img"
     aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Glyph Department</title>
  <desc id="poster-desc">Poster for Glyph Department, an independent type foundry: typefaces with something to say.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece5d7"/>
      <stop offset="1" stop-color="#f4efe6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#d9cfbc" stroke-width="2"/>

  <!-- top bar -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="78" y="86" width="46" height="46" rx="8" fill="#14110f"/>
    <text x="101" y="120" text-anchor="middle" font-family="Palatino, Georgia, serif"
          font-size="28" font-weight="700" letter-spacing="-2">
      <tspan fill="#f4efe6">G</tspan><tspan fill="#ff3b1f">D</tspan>
    </text>
    <text x="140" y="106" font-size="22" font-weight="700" fill="#14110f" letter-spacing="-0.5">Glyph Department</text>
    <text x="140" y="128" font-size="14" fill="#6a6155" letter-spacing="1.5">INDEPENDENT TYPE FOUNDRY</text>
    <text x="1122" y="118" text-anchor="end" font-size="15" fill="#6a6155"
          letter-spacing="4">TYPOGRAPHY</text>
  </g>

  <!-- variable-width specimen: the motif -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#14110f">
    <text x="90" y="380" font-size="230" font-weight="800" letter-spacing="-14"
          transform="translate(90,0) scale(0.62,1) translate(-90,0)">Aa</text>
    <text x="350" y="380" font-size="230" font-weight="600" letter-spacing="-14">Aa</text>
    <text x="640" y="380" font-size="230" font-weight="900" letter-spacing="-10"
          transform="translate(640,0) scale(1.45,1) translate(-640,0)" fill="#ff3b1f">Aa</text>
  </g>
  <text x="90" y="430" font-family="'SFMono-Regular', Menlo, monospace" font-size="20"
        fill="#6a6155" letter-spacing="2">weight 200 &#8594; 900 &#183; width 62% &#8594; 145%</text>

  <!-- headline -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#14110f">
    <text x="86" y="590" font-size="128" font-weight="800" letter-spacing="-6">Letters</text>
    <text x="86" y="700" font-family="Palatino, Georgia, serif" font-style="italic"
          font-size="128" font-weight="500" fill="#ff3b1f" letter-spacing="-4">that</text>
    <text x="440" y="700" font-size="128" font-weight="800" letter-spacing="-6"
          transform="translate(440,0) scale(1.08,1) translate(-440,0)">perform.</text>
  </g>

  <!-- tagline / footer -->
  <line x1="86" y1="748" x2="1114" y2="748" stroke="#d9cfbc" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="86" y="800" font-size="30" font-weight="600" fill="#14110f">Typefaces with something to say.</text>
    <text x="86" y="834" font-size="19" fill="#6a6155">
      Variable letters that stretch, collide, and perform across every screen.
    </text>
    <rect x="946" y="772" width="168" height="52" rx="26" fill="#14110f"/>
    <text x="1030" y="806" text-anchor="middle" font-size="20" font-weight="600" fill="#f4efe6">Test the type</text>
  </g>
</svg>
