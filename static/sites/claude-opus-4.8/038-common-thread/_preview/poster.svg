<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Common Thread — Clothes with a longer story. Sustainable fashion poster.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e6dcc8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#1d2740"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- woven grid texture -->
  <g stroke="#cdbfa9" stroke-width="1" opacity="0.55">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200M0 480H1200M0 540H1200M0 600H1200M0 660H1200M0 720H1200M0 780H1200M0 840H1200"/>
    <path d="M60 0V900M120 0V900M180 0V900M240 0V900M300 0V900M360 0V900M420 0V900M480 0V900M540 0V900M600 0V900M660 0V900M720 0V900M780 0V900M840 0V900M900 0V900M960 0V900M1020 0V900M1080 0V900M1140 0V900"/>
  </g>

  <!-- the common thread, one continuous line -->
  <path d="M-20 220 C 200 90, 340 360, 520 260 S 860 90, 1040 300 S 900 560, 700 500 S 320 620, 480 800 S 900 820, 1240 700"
        fill="none" stroke="#b3712b" stroke-width="10" stroke-linecap="round"/>
  <path d="M-20 220 C 200 90, 340 360, 520 260 S 860 90, 1040 300 S 900 560, 700 500 S 320 620, 480 800 S 900 820, 1240 700"
        fill="none" stroke="#8f5a20" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.45"/>

  <!-- brand mark -->
  <g transform="translate(96 120)">
    <path d="M0 26 C 14 4, 22 48, 32 26 S 50 4, 54 26" fill="none" stroke="#b3712b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="54" cy="26" r="6" fill="#2b3a55"/>
    <text x="76" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#241f1a">Common Thread</text>
  </g>

  <!-- eyebrow -->
  <text x="96" y="470" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="9" font-weight="700" fill="#b3712b">EDITION 04 · SUSTAINABLE FASHION</text>

  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="600" fill="#241f1a">
    <tspan x="90" y="580" font-size="112">Clothes with</tspan>
    <tspan x="90" y="694" font-size="112">a longer story.</tspan>
  </text>

  <!-- tagline -->
  <text x="96" y="768" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#5a5147">Seasonless essentials from traceable fibers, designed to be repaired.</text>

  <!-- stat chips -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="96" y="806" width="240" height="58" rx="29" fill="#2b3a55"/>
    <text x="216" y="843" font-size="24" font-weight="700" fill="#f4efe6" text-anchor="middle">100% traceable</text>
    <rect x="352" y="806" width="230" height="58" rx="29" fill="none" stroke="#a4553a" stroke-width="2"/>
    <text x="467" y="843" font-size="24" font-weight="700" fill="#a4553a" text-anchor="middle">Free mending</text>
  </g>

  <!-- endpoint bead -->
  <circle cx="1200" cy="700" r="12" fill="#2b3a55"/>
</svg>
