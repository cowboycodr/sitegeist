<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Museum of Small Things — Ordinary objects. Extraordinary stories.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="60%" stop-color="#f1ebde"/>
      <stop offset="100%" stop-color="#e7ddcb"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcf9f3"/>
      <stop offset="100%" stop-color="#efe6d5"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2620"/>
      <stop offset="100%" stop-color="#201b16"/>
    </linearGradient>
    <pattern id="hatch" width="26" height="26" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#efe6d5"/>
      <rect width="13" height="26" fill="#ece3d1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- corner accession marks -->
  <g fill="#b1a58c" font-family="Georgia, serif" font-size="20" letter-spacing="3">
    <text x="70" y="80">ACC. 1948.001</text>
    <text x="930" y="80">ACC. 2001.077</text>
    <text x="70" y="838">EST. 1948</text>
    <text x="898" y="838">4,208 OBJECTS</text>
  </g>

  <!-- seal -->
  <g transform="translate(600 150)">
    <circle r="52" fill="#26211c"/>
    <circle r="30" fill="none" stroke="#b56a3a" stroke-width="4"/>
    <circle r="8" fill="#f4efe6"/>
    <path d="M0 -46 v10 M0 36 v10 M-46 0 h10 M36 0 h10" stroke="#b56a3a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g fill="#26211c" text-anchor="middle" font-family="'Iowan Old Style', Palatino, Georgia, serif">
    <text x="600" y="288" font-size="82" font-weight="600" letter-spacing="-1">Museum of</text>
    <text x="600" y="372" font-size="82" font-weight="600" letter-spacing="-1">Small Things</text>
    <text x="600" y="428" font-size="34" font-style="italic" fill="#5c5348">Ordinary objects. Extraordinary stories.</text>
  </g>

  <!-- vitrine / display case -->
  <g transform="translate(430 500)">
    <!-- plinth -->
    <rect x="-30" y="300" width="400" height="52" rx="8" fill="url(#plinth)"/>
    <!-- case body -->
    <rect x="10" y="10" width="320" height="300" rx="10" fill="url(#case)" stroke="#d8cdba" stroke-width="3"/>
    <rect x="10" y="10" width="320" height="300" rx="10" fill="url(#hatch)" opacity="0.5"/>
    <rect x="10" y="10" width="320" height="300" rx="10" fill="none" stroke="#c9bda6" stroke-width="3"/>
    <!-- glass sheen -->
    <path d="M28 20 L120 20 L60 300 L28 300 Z" fill="#ffffff" opacity="0.28"/>

    <!-- the small thing: a brass key on a pin -->
    <g transform="translate(170 150) scale(2.05)" fill="none" stroke="#26211c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-20" cy="-16" r="16"/>
      <circle cx="-20" cy="-16" r="5" fill="#b56a3a" stroke="none"/>
      <path d="M-8 -4 L28 32 M20 24 L30 14 M10 14 L18 6"/>
    </g>
    <!-- pin shadow -->
    <ellipse cx="170" cy="292" rx="60" ry="9" fill="#26211c" opacity="0.10"/>

    <!-- plaque -->
    <rect x="86" y="322" width="168" height="10" rx="5" fill="#b56a3a"/>
  </g>

  <!-- caption -->
  <text x="600" y="862" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#8f4f28">A DIGITAL MUSEUM OF THE THINGS PEOPLE KEEP</text>
</svg>
