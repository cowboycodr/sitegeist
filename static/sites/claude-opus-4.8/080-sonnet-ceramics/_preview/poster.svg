<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Sonnet Ceramics — Objects for slower rooms.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0e6"/>
      <stop offset="1" stop-color="#efe4d3"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c07b5b"/>
      <stop offset="1" stop-color="#8a4d33"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa79f"/>
      <stop offset="1" stop-color="#6f8b84"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- sun disc -->
  <circle cx="945" cy="245" r="150" fill="#f2d9a8" opacity="0.85"/>

  <!-- shelf -->
  <rect x="655" y="640" width="470" height="16" rx="8" fill="#c9b291"/>
  <ellipse cx="890" cy="770" rx="290" ry="34" fill="#d8c1a1" opacity="0.5"/>

  <!-- tall vase -->
  <path d="M745 300c-14 52-60 70-60 165 0 140 28 175 28 175h96s28-35 28-175c0-95-46-113-60-165z" fill="url(#clay)"/>
  <ellipse cx="785" cy="300" rx="60" ry="16" fill="#6e3c27"/>

  <!-- bowl -->
  <path d="M905 520c0 62 46 100 96 100s96-38 96-100z" fill="url(#sea)"/>
  <ellipse cx="1001" cy="520" rx="96" ry="20" fill="#5c7972"/>

  <!-- small cup -->
  <path d="M902 640h96l-12 118c-2 16-18 26-36 26s-34-10-36-26z" fill="#e8d4bb"/>
  <ellipse cx="950" cy="640" rx="48" ry="11" fill="#cdb493"/>

  <!-- text block -->
  <text x="90" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="8" fill="#8a4d33">MADE IN SMALL EDITIONS</text>
  <text x="86" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="500" fill="#34281f">Sonnet</text>
  <text x="86" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="500" fill="#34281f">Ceramics</text>
  <text x="90" y="540" font-family="'Segoe UI', system-ui, sans-serif" font-size="40" fill="#5f5044">Objects for slower rooms.</text>

  <!-- pill mark -->
  <rect x="90" y="620" width="360" height="70" rx="35" fill="#b06a4c"/>
  <text x="270" y="666" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" fill="#f7f0e6">Shop the collection</text>

  <!-- footer motif line -->
  <text x="90" y="820" font-family="Georgia, serif" font-size="26" fill="#6f8b84" letter-spacing="2">Stoneware · Wheel-thrown · Coastal clay</text>
</svg>
