<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Afterimage Archive — gallery poster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0f; }
    body { display: grid; place-items: center; padding: 24px; }
    img { width: min(96vw, 1200px); aspect-ratio: 4 / 3; height: auto; border: 1px solid #2a2c33; border-radius: 8px; }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Afterimage Archive gallery poster: an orange exposure field haloed by cyan and magenta afterimages above the archive's wordmark." />
</body>
</html>
