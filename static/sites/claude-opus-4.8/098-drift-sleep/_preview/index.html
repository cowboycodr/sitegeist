<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Drift — gallery poster</title>
	<style>
		html, body { margin: 0; height: 100%; background: #070a17; }
		body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
		img { width: min(100%, 900px); height: auto; border-radius: 12px; box-shadow: 0 30px 80px -30px rgba(143,155,255,0.6); }
	</style>
</head>
<body>
	<img src="poster.svg" alt="Drift gallery poster: a crescent moon and glowing breath ring over a night-blue sky, with the wordmark Drift and the tagline A softer landing for your day.">
</body>
</html>
