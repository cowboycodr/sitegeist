<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
	<title id="poster-title">Civic Stack — Better tools for public life</title>
	<desc id="poster-desc">Poster showing the Civic Stack layered-slab motif with the site name and tagline.</desc>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#eef3fb"/>
		</linearGradient>
		<linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f0a733"/><stop offset="1" stop-color="#d98a15"/>
		</linearGradient>
		<linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#34b7a4"/><stop offset="1" stop-color="#148575"/>
		</linearGradient>
		<linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3f7ff0"/><stop offset="1" stop-color="#1f5fd6"/>
		</linearGradient>
		<linearGradient id="gDeep" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2b64c4"/><stop offset="1" stop-color="#143d8c"/>
		</linearGradient>
		<linearGradient id="gGrey" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6d8ec2"/><stop offset="1" stop-color="#445f8c"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<circle cx="1060" cy="120" r="360" fill="#1f5fd6" opacity="0.08"/>

	<!-- Brand lockup -->
	<g transform="translate(96,110)">
		<rect x="0" y="0"  width="70" height="17" rx="8" fill="#f0a733"/>
		<rect x="0" y="26" width="70" height="17" rx="8" fill="#1d9c8a"/>
		<rect x="0" y="52" width="70" height="17" rx="8" fill="#1f5fd6"/>
		<text x="96" y="52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="800" fill="#10233b" letter-spacing="-0.5">Civic Stack</text>
	</g>

	<!-- Eyebrow -->
	<g transform="translate(96,236)">
		<rect x="0" y="0" width="360" height="52" rx="26" fill="#cfe0fb"/>
		<text x="30" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#143d8c" letter-spacing="2">TECHNOLOGY FOR EVERYONE</text>
	</g>

	<!-- Headline -->
	<text x="96" y="392" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="800" fill="#10233b" letter-spacing="-2">Better tools</text>
	<text x="96" y="486" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="800" fill="#10233b" letter-spacing="-2">for public life.</text>

	<text x="98" y="558" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#40536b">Open infrastructure for clear, accessible</text>
	<text x="98" y="600" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#40536b">digital government services.</text>

	<!-- Layered slab motif -->
	<g transform="translate(690,470)">
		<g transform="skewX(-14)">
			<rect x="0" y="-232" width="300" height="86" rx="16" fill="url(#gAmber)"/>
			<rect x="0" y="-124" width="300" height="86" rx="16" fill="url(#gTeal)"/>
			<rect x="0" y="-16"  width="300" height="86" rx="16" fill="url(#gBlue)"/>
			<rect x="0" y="92"   width="300" height="86" rx="16" fill="url(#gDeep)"/>
			<rect x="0" y="200"  width="300" height="86" rx="16" fill="url(#gGrey)"/>
		</g>
		<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">
			<text x="34" y="-176">Services</text>
			<text x="34" y="-68">Identity</text>
			<text x="34" y="40">Payments</text>
			<text x="34" y="148">Records</text>
			<text x="34" y="256">Open data</text>
		</g>
	</g>

	<!-- Footer tagline bar -->
	<rect x="0" y="812" width="1200" height="88" fill="#10233b"/>
	<text x="96" y="866" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Better tools for public life.</text>
	<text x="1104" y="866" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" fill="#8f9dbd">Owned by communities</text>
</svg>
