<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Oro Still — Objects for your private mythology.</title>
  <desc id="poster-desc">A hand-cast gold object rendered on warm paper, with the Oro Still wordmark.</desc>
  <defs>
    <radialGradient id="p-gold" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f6e4b0" />
      <stop offset="45%" stop-color="#d9ae57" />
      <stop offset="100%" stop-color="#9a6f26" />
    </radialGradient>
    <radialGradient id="p-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#d7be82" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d7be82" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#f4ede0" />
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#d8cbb2" stroke-width="2" />
  <rect x="760" y="0" width="440" height="900" fill="url(#p-glow)" />

  <!-- eyebrow -->
  <text x="96" y="150" font-family="Optima, 'Avenir Next', 'Segoe UI', sans-serif"
        font-size="28" letter-spacing="10" fill="#b78a2e">HANDMADE IN FLORENCE</text>

  <!-- wordmark -->
  <text x="90" y="360" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="200" fill="#211d16">Oro</text>
  <text x="90" y="540" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="200" fill="#211d16">Still</text>

  <!-- tagline -->
  <text x="96" y="650" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="40" font-style="italic" fill="#4a4234">Objects for your private mythology.</text>

  <!-- footer marks -->
  <line x1="96" y1="720" x2="500" y2="720" stroke="#d8cbb2" stroke-width="2" />
  <text x="96" y="770" font-family="Optima, 'Avenir Next', 'Segoe UI', sans-serif"
        font-size="24" letter-spacing="6" fill="#4a4234">HAND-CAST JEWELRY · OLTRARNO ATELIER</text>

  <!-- the object -->
  <g transform="translate(890 420)">
    <path fill="none" stroke="#b78a2e" stroke-width="4"
          d="M0 -300 C -70 -220 -46 -156 0 -104 C 46 -156 70 -220 0 -300 Z" />
    <path fill="url(#p-gold)"
          d="M0 -140 C 150 -140 250 -14 250 152 C 250 300 150 400 0 400
             C -150 400 -250 300 -250 152 C -250 -14 -150 -140 0 -140 Z" />
    <path fill="#f3e6c4" opacity="0.5"
          d="M-120 20 C -70 -40 20 -46 60 -8 C 8 20 -30 78 -50 148 C -100 116 -128 72 -120 20 Z" />
    <ellipse cx="0" cy="160" rx="82" ry="104" fill="#3a2f22" opacity="0.9" />
    <ellipse cx="-24" cy="120" rx="26" ry="38" fill="#8f6a2c" opacity="0.65" />
  </g>
</svg>
