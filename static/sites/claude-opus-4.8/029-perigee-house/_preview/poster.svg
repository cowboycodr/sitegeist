<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="pt pd">
  <title id="pt">Perigee House — orbital hotel poster</title>
  <desc id="pd">A gold ring station arcing above a blue Earth limb against a starfield, with the Perigee House name and tagline.</desc>
  <defs>
    <radialGradient id="sky" cx="72%" cy="8%" r="90%">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="55%" stop-color="#080e1c"/>
      <stop offset="100%" stop-color="#04070f"/>
    </radialGradient>
    <radialGradient id="earth" cx="36%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7fd0ff"/>
      <stop offset="30%" stop-color="#2f7bd6"/>
      <stop offset="66%" stop-color="#123a72"/>
      <stop offset="100%" stop-color="#071930"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d9a2"/>
      <stop offset="100%" stop-color="#d9b16f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="2.4" opacity="0.85"/>
    <circle cx="300" cy="90" r="1.6" opacity="0.6"/>
    <circle cx="500" cy="180" r="2" opacity="0.7"/>
    <circle cx="210" cy="300" r="1.8" opacity="0.75"/>
    <circle cx="90" cy="470" r="2.2" opacity="0.8"/>
    <circle cx="640" cy="120" r="1.5" opacity="0.55"/>
    <circle cx="1080" cy="230" r="2.2" opacity="0.7"/>
    <circle cx="960" cy="420" r="1.6" opacity="0.6"/>
    <circle cx="160" cy="640" r="1.7" opacity="0.7"/>
    <circle cx="420" cy="70" r="1.4" opacity="0.5"/>
  </g>

  <!-- Earth limb -->
  <g>
    <circle cx="980" cy="330" r="360" fill="url(#earth)"/>
    <circle cx="980" cy="330" r="372" fill="none" stroke="#7fd0ff" stroke-width="2" opacity="0.4"/>
    <circle cx="980" cy="330" r="360" fill="none" stroke="#04070f" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- Ring station -->
  <g transform="rotate(-26 600 470)">
    <ellipse cx="600" cy="470" rx="430" ry="150" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <ellipse cx="600" cy="470" rx="430" ry="150" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
    <circle cx="1030" cy="470" r="13" fill="url(#gold)"/>
    <circle cx="170" cy="470" r="9" fill="url(#gold)"/>
    <circle cx="600" cy="320" r="7" fill="#f2d9a2"/>
  </g>

  <!-- Text -->
  <g fill="#eaf0f6" font-family="Helvetica Neue, Arial, sans-serif">
    <text x="90" y="150" font-size="26" letter-spacing="10" fill="#5fb3ff">LOW-EARTH ORBIT · 2031</text>
  </g>
  <text x="86" y="640" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="126" font-weight="600" fill="#eaf0f6" letter-spacing="-2">Perigee</text>
  <text x="86" y="760" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="126" font-weight="600" fill="url(#gold)" letter-spacing="-2">House</text>
  <text x="92" y="828" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38" fill="#9fb0c4" font-style="italic">Earth has never looked this good.</text>
</svg>
