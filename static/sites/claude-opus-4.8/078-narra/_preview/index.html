<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
	<title>Narra — Gallery poster</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0c15; padding: 24px; }
		figure { margin: 0; width: min(100%, 900px); }
		img { width: 100%; height: auto; display: block; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
		figcaption { color: #b6afc4; font-family: ui-sans-serif, system-ui, Arial, sans-serif; text-align: center; margin-top: 14px; font-size: .9rem; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Narra gallery poster — Turn research into a living story" />
		<figcaption>Narra · 4:3 gallery poster</figcaption>
	</figure>
</body>
</html>
