<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Narra — Turn research into a living story">
	<defs>
		<radialGradient id="glowA" cx="30%" cy="20%" r="70%">
			<stop offset="0%" stop-color="#e9a04b" stop-opacity="0.22" />
			<stop offset="60%" stop-color="#e9a04b" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="glowB" cx="85%" cy="90%" r="60%">
			<stop offset="0%" stop-color="#e8735a" stop-opacity="0.2" />
			<stop offset="60%" stop-color="#e8735a" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#e9a04b" />
			<stop offset="100%" stop-color="#e8735a" />
		</linearGradient>
		<linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#1e1b2b" />
			<stop offset="100%" stop-color="#191627" />
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="#14121d" />
	<rect width="1200" height="900" fill="url(#glowA)" />
	<rect width="1200" height="900" fill="url(#glowB)" />
	<rect x="20" y="20" width="1160" height="860" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

	<!-- Eyebrow -->
	<text x="90" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="7" fill="#e9a04b" font-weight="bold">CONTEXT, CONNECTED</text>

	<!-- Wordmark motif -->
	<g transform="translate(90 200)">
		<path d="M8 34 L60 14 M8 34 L26 92 M60 14 L74 86 M26 92 L74 86 M8 34 L74 86" stroke="#7fd0c4" stroke-width="2.4" fill="none" opacity="0.8" />
		<circle cx="8" cy="34" r="10" fill="#e9a04b" />
		<circle cx="60" cy="14" r="8" fill="#e8735a" />
		<circle cx="26" cy="92" r="8" fill="#7fd0c4" />
		<circle cx="74" cy="86" r="10" fill="#e9a04b" />
	</g>

	<!-- Title -->
	<text x="200" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#f4ede1" font-weight="600" letter-spacing="-2">Narra</text>

	<text x="90" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#f4ede1" font-weight="600">Turn research into a</text>
	<text x="90" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#e9a04b" font-style="italic" font-weight="600">living story.</text>

	<text x="90" y="556" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="27" fill="#ded6c6">Sources, notes, and ideas — threaded into one clear narrative map.</text>

	<!-- Narrative map motif: nodes on a spine -->
	<g transform="translate(90 620)">
		<!-- connecting threads -->
		<path d="M40 40 C 20 100, 20 100, 40 160 M40 160 C 20 220, 20 220, 40 220" fill="none" stroke="#7fd0c4" stroke-width="3" opacity="0.6" />
		<path d="M40 40 C 300 20, 620 60, 720 40" fill="none" stroke="#7fd0c4" stroke-width="3" stroke-dasharray="9 7" opacity="0.5" />
		<path d="M40 160 C 320 150, 560 150, 720 170" fill="none" stroke="#e9a04b" stroke-width="3" stroke-dasharray="9 7" opacity="0.5" />

		<!-- Node 1: source -->
		<g transform="translate(0 8)">
			<rect x="0" y="0" width="360" height="64" rx="12" fill="url(#node)" stroke="#3a3550" />
			<rect x="0" y="0" width="6" height="64" rx="3" fill="#e8735a" />
			<text x="26" y="28" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#e8735a" font-weight="bold">SOURCE</text>
			<text x="26" y="52" font-family="Georgia, serif" font-size="24" fill="#f4ede1">1854 cholera map</text>
		</g>

		<!-- Node 2: note -->
		<g transform="translate(0 128)">
			<rect x="0" y="0" width="360" height="64" rx="12" fill="url(#node)" stroke="#3a3550" />
			<rect x="0" y="0" width="6" height="64" rx="3" fill="#e9a04b" />
			<text x="26" y="28" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#e9a04b" font-weight="bold">NOTE</text>
			<text x="26" y="52" font-family="Georgia, serif" font-size="24" fill="#f4ede1">Deaths cluster on one pump</text>
		</g>

		<!-- Node 3: idea (the claim) -->
		<g transform="translate(660 8)">
			<circle cx="60" cy="32" r="52" fill="#14121d" stroke="url(#warm)" stroke-width="3" />
			<circle cx="60" cy="32" r="14" fill="#7fd0c4" opacity="0.9" />
		</g>
		<g transform="translate(560 130)">
			<rect x="0" y="0" width="300" height="64" rx="12" fill="url(#node)" stroke="#3a3550" />
			<rect x="0" y="0" width="6" height="64" rx="3" fill="#7fd0c4" />
			<text x="26" y="28" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#7fd0c4" font-weight="bold">IDEA</text>
			<text x="26" y="52" font-family="Georgia, serif" font-size="22" fill="#f4ede1">Water carries it</text>
		</g>
	</g>

	<text x="90" y="855" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="20" fill="#b6afc4" letter-spacing="1">Knowledge Technology · Narra</text>
</svg>
