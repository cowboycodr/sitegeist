<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Sunday Supper — Come hungry. Stay awhile.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f6efe2"/>
			<stop offset="1" stop-color="#efe4cf"/>
		</linearGradient>
		<radialGradient id="glow" cx="82%" cy="8%" r="70%">
			<stop offset="0" stop-color="#d9a441" stop-opacity="0.35"/>
			<stop offset="0.6" stop-color="#d9a441" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="plate" cx="40%" cy="34%" r="70%">
			<stop offset="0" stop-color="#fff8ec"/>
			<stop offset="0.62" stop-color="#efe2cc"/>
			<stop offset="0.8" stop-color="#e3d2b4"/>
			<stop offset="1" stop-color="#d8c4a2"/>
		</radialGradient>
		<radialGradient id="food" cx="40%" cy="38%" r="70%">
			<stop offset="0" stop-color="#c8622f"/>
			<stop offset="0.7" stop-color="#7c2c30"/>
			<stop offset="1" stop-color="#5e1f22"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>
	<rect x="26" y="26" width="1148" height="848" fill="none" stroke="#7c2c30" stroke-width="3" rx="20" opacity="0.5"/>

	<!-- Plate motif -->
	<g transform="translate(830 470)">
		<circle r="290" fill="url(#plate)"/>
		<circle r="290" fill="none" stroke="#ffffff" stroke-width="26" opacity="0.55"/>
		<circle r="176" fill="url(#food)"/>
		<circle r="176" fill="none" stroke="#000000" stroke-width="0" opacity="0"/>
		<!-- steam -->
		<g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55">
			<path d="M-70 -300 q30 -40 0 -80 q-30 -40 0 -80"/>
			<path d="M0 -320 q30 -40 0 -80 q-30 -40 0 -80"/>
			<path d="M70 -300 q30 -40 0 -80 q-30 -40 0 -80"/>
		</g>
	</g>

	<!-- Fork & knife mark -->
	<g transform="translate(120 110)" fill="none" stroke="#7c2c30" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="34" cy="34" r="46" stroke-width="6"/>
		<path d="M20 12v18a7 7 0 0 0 14 0V12M27 12v45M52 12c-5 2-8 9-8 18s3 11 8 11v16"/>
	</g>

	<!-- Wordmark -->
	<text x="120" y="360" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="52" letter-spacing="8" fill="#c8622f" font-weight="700">DINNER FROM FIVE</text>
	<text x="116" y="470" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="140" fill="#2a201a" font-weight="600">Sunday</text>
	<text x="116" y="600" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="140" fill="#7c2c30" font-weight="600">Supper</text>

	<text x="120" y="690" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#6b5c4e">Come hungry. Stay awhile.</text>

	<!-- Booking chip -->
	<g transform="translate(120 748)">
		<rect width="330" height="70" rx="35" fill="#7c2c30"/>
		<text x="165" y="46" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#f6efe2" font-weight="700">Book a table</text>
	</g>
	<text x="120" y="838" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#6d7444" font-weight="600">Seasonal plates · Natural wine · 114 Larch Street</text>
</svg>
