<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
	<title id="poster-title">Crumb Theory — a daily study in butter and flour</title>
	<desc id="poster-desc">Bakery poster with the Crumb Theory wordmark, a crumb-dotted seal, and today's counter list.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f7f0e3"/>
			<stop offset="1" stop-color="#fdf9f0"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.8" cy="0.05" r="0.7">
			<stop offset="0" stop-color="#e9b64a" stop-opacity="0.42"/>
			<stop offset="1" stop-color="#e9b64a" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>
	<rect x="26" y="26" width="1148" height="848" rx="26" fill="none" stroke="#e0d3bd" stroke-width="2"/>

	<!-- Eyebrow -->
	<text x="96" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#b06a2c" font-weight="bold">BAKED EACH MORNING</text>

	<!-- Wordmark -->
	<text x="92" y="300" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="150" font-weight="bold" fill="#2e2118" letter-spacing="-3">Crumb</text>
	<text x="96" y="430" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="128" font-style="italic" fill="#b06a2c" letter-spacing="-2">Theory</text>

	<!-- Tagline -->
	<text x="98" y="512" font-family="Georgia, serif" font-size="38" fill="#4a382a">A daily study in butter and flour.</text>

	<!-- Seal / motif: crumb-dotted circle -->
	<g transform="translate(960,260)">
		<circle r="150" fill="none" stroke="#2e2118" stroke-width="5"/>
		<circle r="128" fill="none" stroke="#e9b64a" stroke-width="2.5" stroke-dasharray="4 12"/>
		<circle cx="-46" cy="-52" r="15" fill="#b06a2c"/>
		<circle cx="34" cy="-64" r="9" fill="#2e2118"/>
		<circle cx="62" cy="10" r="17" fill="#e9b64a"/>
		<circle cx="-28" cy="46" r="11" fill="#4a382a"/>
		<circle cx="14" cy="30" r="7" fill="#b06a2c"/>
		<circle cx="-70" cy="18" r="6" fill="#2e2118"/>
		<circle cx="42" cy="-24" r="6" fill="#7a6551"/>
		<text x="0" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="4" fill="#7a6551">EST · RYE &amp; VINE</text>
	</g>

	<!-- Counter card -->
	<g transform="translate(96,588)">
		<rect width="1008" height="236" rx="18" fill="#2e2118"/>
		<text x="40" y="66" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#e9b64a">TODAY · ON THE COUNTER</text>

		<g font-family="'Iowan Old Style', Palatino, Georgia, serif" fill="#f7f0e3">
			<text x="40" y="128" font-size="34">Butter croissant</text>
			<text x="968" y="128" font-size="34" text-anchor="end" fill="#e9b64a">$4.50</text>
			<line x1="40" y1="150" x2="968" y2="150" stroke="#f7f0e3" stroke-opacity="0.22" stroke-dasharray="3 9"/>

			<text x="40" y="188" font-size="34">Country sourdough</text>
			<text x="968" y="188" font-size="34" text-anchor="end" fill="#e9b64a">$8.00</text>
			<line x1="40" y1="210" x2="968" y2="210" stroke="#f7f0e3" stroke-opacity="0.22" stroke-dasharray="3 9"/>
		</g>
	</g>
</svg>
