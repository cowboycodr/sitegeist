<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Quiet Mile — The city, softened. A silent, lightweight electric bike gliding over concentric rings of quiet.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ea"/>
      <stop offset="1" stop-color="#e5e3d7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.56" r="0.55">
      <stop offset="0" stop-color="#c7d3bd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c7d3bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- quiet rings motif -->
  <g transform="translate(600 508)">
    <circle r="470" fill="url(#halo)"/>
    <g fill="none" stroke="#8ea183">
      <circle r="150" stroke-width="2.4" opacity="0.85"/>
      <circle r="230" stroke-width="2" opacity="0.6"/>
      <circle r="315" stroke-width="1.8" opacity="0.4"/>
      <circle r="400" stroke-width="1.6" opacity="0.22"/>
    </g>
  </g>

  <!-- bike -->
  <g transform="translate(600 520)" stroke="#1c2620" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="-175" cy="60" r="110"/>
    <circle cx="175" cy="60" r="110"/>
    <path d="M-175 60 L-15 60 L100 -120 L175 60"/>
    <path d="M-15 60 L-80 -120 L100 -120"/>
    <path d="M-80 -120 L-112 -158"/>
    <path d="M100 -120 L138 -170"/>
  </g>
  <g transform="translate(600 520)" stroke="#4c6247" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M-138 -158 L-80 -158"/>
    <path d="M120 -190 L184 -202"/>
  </g>
  <g transform="translate(600 520)">
    <circle cx="-175" cy="60" r="18" fill="#4c6247"/>
    <circle cx="175" cy="60" r="18" fill="#4c6247"/>
    <path d="M-15 60 q22 -13 46 0" stroke="#c98a4b" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Iowan Old Style', Palatino, Georgia, serif">
    <text x="600" y="150" text-anchor="middle" fill="#1c2620" font-size="112" font-weight="600" letter-spacing="1">Quiet Mile</text>
    <text x="600" y="212" text-anchor="middle" fill="#4c6247" font-size="40" font-style="italic">The city, softened.</text>
  </g>

  <!-- eyebrow / category -->
  <g font-family="'Segoe UI', system-ui, Arial, sans-serif">
    <text x="600" y="820" text-anchor="middle" fill="#43514a" font-size="27" letter-spacing="7">SILENT · LIGHTWEIGHT · ELECTRIC</text>
  </g>

  <!-- corner stat marks -->
  <g font-family="'Iowan Old Style', Palatino, Georgia, serif" fill="#1c2620">
    <text x="96" y="470" font-size="46" font-weight="600">14<tspan font-size="24" fill="#4c6247"> kg</tspan></text>
    <text x="1104" y="470" text-anchor="end" font-size="46" font-weight="600">42<tspan font-size="24" fill="#4c6247"> dB</tspan></text>
  </g>
</svg>
