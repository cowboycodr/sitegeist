<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Quiet Mile — gallery poster</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #d7d3c6;
    display: grid; place-items: center;
    padding: 24px; box-sizing: border-box;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
  }
  figure { margin: 0; max-width: 960px; width: 100%; }
  img {
    display: block; width: 100%; height: auto;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(28, 38, 32, 0.28);
  }
  figcaption {
    text-align: center; margin-top: 14px;
    color: #43514a; font-size: 14px; letter-spacing: .04em;
  }
</style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Quiet Mile gallery poster — The city, softened.">
    <figcaption>Quiet Mile · gallery poster (4:3)</figcaption>
  </figure>
</body>
</html>
