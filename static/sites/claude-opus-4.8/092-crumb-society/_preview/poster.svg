<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Crumb Society — Loud pastry. Quiet mornings.">
  <defs>
    <linearGradient id="butter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d79a"/>
      <stop offset=".6" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#e79b3f"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4dd"/>
      <stop offset="1" stop-color="#f7d79a"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b661"/>
      <stop offset="1" stop-color="#d98b34"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#fbf3e4"/>
  <rect x="40" y="40" width="1120" height="820" rx="34" fill="none" stroke="#402216" stroke-width="3" opacity=".22"/>

  <!-- Eyebrow -->
  <g transform="translate(96 130)">
    <circle cx="9" cy="-6" r="9" fill="#c23b4a"/>
    <text x="30" y="0" font-family="Georgia, serif" font-size="30" font-weight="700" letter-spacing="6" fill="#6b3d1e">FRESH FROM 7:00</text>
  </g>

  <!-- Wordmark -->
  <text x="92" y="330" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#2a1d14">Crumb</text>
  <text x="92" y="450" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#c23b4a">Society</text>

  <!-- Tagline -->
  <text x="96" y="560" font-family="Georgia, serif" font-size="52" fill="#2a1d14">Loud pastry.</text>
  <text x="96" y="622" font-family="Georgia, serif" font-size="52" fill="#6b3d1e">Quiet mornings.</text>

  <!-- Description -->
  <text x="96" y="700" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#6b3d1e">Heritage grain, cultured butter, and seasonal</text>
  <text x="96" y="738" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#6b3d1e">fruit laminated into daily rituals.</text>

  <!-- Pill -->
  <rect x="96" y="782" width="360" height="66" rx="33" fill="#402216"/>
  <text x="276" y="825" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700" fill="#fbf3e4">See today's bake</text>

  <!-- Laminated motif card -->
  <g transform="translate(760 210)">
    <rect x="0" y="0" width="340" height="470" rx="28" fill="url(#butter)"/>
    <g transform="rotate(-6 170 235)">
      <g>
        <rect x="70" y="70" width="200" height="26" rx="13" fill="url(#layer)"/>
        <rect x="70" y="112" width="200" height="26" rx="13" fill="url(#layerB)"/>
        <rect x="70" y="154" width="200" height="26" rx="13" fill="url(#layer)"/>
        <rect x="70" y="196" width="200" height="26" rx="13" fill="url(#layerB)"/>
        <rect x="70" y="238" width="200" height="26" rx="13" fill="url(#layer)"/>
        <rect x="70" y="280" width="200" height="26" rx="13" fill="url(#layerB)"/>
        <rect x="70" y="322" width="200" height="26" rx="13" fill="url(#layer)"/>
      </g>
    </g>
    <rect x="24" y="404" width="196" height="44" rx="22" fill="#402216"/>
    <text x="122" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#fbf3e4">No. 07 — LAMINATED</text>
  </g>

  <!-- Crumb dots motif -->
  <g fill="#6b3d1e" opacity=".5">
    <circle cx="620" cy="150" r="6"/>
    <circle cx="660" cy="180" r="4"/>
    <circle cx="600" cy="200" r="3"/>
    <circle cx="700" cy="760" r="6"/>
    <circle cx="660" cy="800" r="4"/>
    <circle cx="720" cy="820" r="3"/>
  </g>
</svg>
