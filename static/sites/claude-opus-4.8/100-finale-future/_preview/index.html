<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Finale — poster preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #06060c; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  img { width: min(100%, 1000px); height: auto; border-radius: 12px; box-shadow: 0 30px 80px -30px rgba(255, 77, 141, 0.5); }
</style>
</head>
<body>
<main>
  <img src="poster.svg" alt="Finale gallery poster — One hundred visions. One strange future.">
</main>
</body>
</html>
