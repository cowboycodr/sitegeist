<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Finale — One hundred visions. One strange future. A festival of digital culture, October 08 to 10, everywhere.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b18"/>
      <stop offset="0.6" stop-color="#07070f"/>
      <stop offset="1" stop-color="#06060c"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.12" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#46e0d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#46e0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowPink)"/>
  <rect width="1200" height="900" fill="url(#glowTeal)"/>

  <!-- constellation motif -->
  <g stroke="#78c8dc" stroke-opacity="0.28" stroke-width="1.2">
    <line x1="150" y1="230" x2="330" y2="300"/>
    <line x1="330" y1="300" x2="270" y2="470"/>
    <line x1="270" y1="470" x2="120" y2="520"/>
    <line x1="330" y1="300" x2="510" y2="250"/>
    <line x1="900" y1="640" x2="1040" y2="560"/>
    <line x1="1040" y1="560" x2="1080" y2="710"/>
    <line x1="900" y1="640" x2="980" y2="770"/>
    <line x1="980" y1="770" x2="1080" y2="710"/>
  </g>
  <g fill="#ff78aa">
    <circle cx="150" cy="230" r="4.5"/>
    <circle cx="330" cy="300" r="6"/>
    <circle cx="270" cy="470" r="4"/>
    <circle cx="120" cy="520" r="5"/>
    <circle cx="510" cy="250" r="3.5"/>
    <circle cx="900" cy="640" r="5.5"/>
    <circle cx="1040" cy="560" r="4"/>
    <circle cx="1080" cy="710" r="5"/>
    <circle cx="980" cy="770" r="4.5"/>
  </g>
  <g fill="#46e0d0" fill-opacity="0.75">
    <circle cx="720" cy="180" r="3"/>
    <circle cx="600" cy="420" r="2.6"/>
    <circle cx="200" cy="700" r="3"/>
    <circle cx="1120" cy="300" r="2.6"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(96,150)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" fill="#ff4d8d" font-size="34" font-weight="700">▲</text>
    <text x="46" y="0" fill="#eef0ff" font-size="40" font-weight="800" letter-spacing="1">Finale</text>
  </g>

  <text x="96" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#46e0d0" font-size="26" font-weight="700" letter-spacing="8">OCTOBER 08–10  /  EVERYWHERE</text>

  <!-- headline -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800">
    <text x="90" y="430" fill="#eef0ff" font-size="128" letter-spacing="-3">One hundred</text>
    <text x="90" y="560" fill="#eef0ff" font-size="128" letter-spacing="-3">visions.</text>
    <text x="90" y="700" fill="url(#accentText)" font-size="128" letter-spacing="-3">One strange future.</text>
  </g>

  <!-- lede -->
  <text x="96" y="790" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a9ac2" font-size="30">Digital art, sound, code, performance — beyond the interface.</text>

  <!-- counters -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(96,845)">
      <rect x="0" y="-24" width="3" height="34" fill="#ff4d8d"/>
      <text x="18" y="-4" fill="#eef0ff" font-size="34" font-weight="800">100 visions</text>
    </g>
    <g transform="translate(430,845)">
      <rect x="0" y="-24" width="3" height="34" fill="#46e0d0"/>
      <text x="18" y="-4" fill="#eef0ff" font-size="34" font-weight="800">3 days</text>
    </g>
    <g transform="translate(650,845)">
      <rect x="0" y="-24" width="3" height="34" fill="#ffd24d"/>
      <text x="18" y="-4" fill="#eef0ff" font-size="34" font-weight="800">12 stages · Free</text>
    </g>
  </g>
</svg>
