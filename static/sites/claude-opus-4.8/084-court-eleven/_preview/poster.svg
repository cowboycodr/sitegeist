<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Court Eleven — New rituals for the old game.">
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
      .sans  { font-family: "Helvetica Neue", "Segoe UI", system-ui, Arial, sans-serif; }
    </style>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- paper ground -->
    <rect width="1200" height="900" fill="#f3ece0"/>

    <!-- upper clay court motif -->
    <g stroke="rgba(26,25,22,0.13)" stroke-width="3" fill="none">
      <rect x="150" y="70" width="900" height="330"/>
      <rect x="150" y="150" width="900" height="170"/>
      <line x1="600" y1="150" x2="600" y2="320"/>
      <line x1="150" y1="235" x2="1050" y2="235" stroke-dasharray="4 14"/>
      <line x1="380" y1="70" x2="380" y2="400"/>
      <line x1="820" y1="70" x2="820" y2="400"/>
    </g>

    <!-- ball -->
    <circle cx="978" cy="128" r="42" fill="#c2603a"/>
    <path d="M948 100 q30 28 0 56" stroke="#f3ece0" stroke-width="3" fill="none"/>
    <path d="M1008 100 q-30 28 0 56" stroke="#f3ece0" stroke-width="3" fill="none"/>

    <!-- eyebrow -->
    <text class="sans" x="150" y="500" font-size="26" letter-spacing="8" font-weight="700" fill="#a94e2c">BROOKLYN · OPEN 06:00</text>

    <!-- wordmark -->
    <text class="serif" x="146" y="620" font-size="150" fill="#1a1916" letter-spacing="-2">Court</text>
    <text class="serif" x="146" y="770" font-size="150" fill="#1a1916" letter-spacing="-2">Eleven<tspan class="serif" font-style="italic" fill="#c2603a">.</tspan></text>

    <!-- tagline -->
    <text class="serif" x="152" y="838" font-size="40" font-style="italic" fill="#3d5a49">New rituals for the old game.</text>

    <!-- right-side plate: number 11 -->
    <g transform="translate(760,540)">
      <rect x="0" y="0" width="290" height="290" rx="22" fill="#3d5a49"/>
      <rect x="26" y="26" width="238" height="238" rx="6" fill="none" stroke="#f3ece0" stroke-width="3"/>
      <line x1="145" y1="26" x2="145" y2="264" stroke="#c2603a" stroke-width="3"/>
      <line x1="26" y1="145" x2="264" y2="145" stroke="#f3ece0" stroke-width="2"/>
      <text class="serif" x="145" y="205" font-size="150" text-anchor="middle" fill="#f3ece0">11</text>
    </g>

    <!-- frame line -->
    <rect x="14" y="14" width="1172" height="872" fill="none" stroke="#1a1916" stroke-width="3"/>
  </g>
</svg>
