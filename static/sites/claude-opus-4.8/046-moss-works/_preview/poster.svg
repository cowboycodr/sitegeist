<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Moss Works — Let the wild back in. Ecological landscape design poster.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2e9" />
      <stop offset="1" stop-color="#e2ead0" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#557d55" />
      <stop offset="1" stop-color="#16241a" />
    </linearGradient>
    <linearGradient id="frond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d8a8" />
      <stop offset="1" stop-color="#7d9e6f" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />

  <!-- horizon and ground -->
  <circle cx="930" cy="230" r="120" fill="#faf9f2" opacity="0.7" />
  <path d="M0 640 Q300 570 620 620 T1200 600 V900 H0 Z" fill="url(#ground)" />
  <path d="M0 720 Q320 660 640 710 T1200 690 V900 H0 Z" fill="#16241a" opacity="0.6" />

  <!-- distinctive motif: paired moss fronds -->
  <g transform="translate(880 470)">
    <g fill="none" stroke="url(#frond)" stroke-width="12" stroke-linecap="round">
      <path d="M60 20 C160 130 160 300 60 420 C-40 300 -40 130 60 20 Z" />
      <path d="M60 70 L60 380" />
      <path d="M60 130 L150 96" /><path d="M60 180 L-30 146" />
      <path d="M60 230 L150 200" /><path d="M60 280 L-30 250" />
    </g>
    <circle cx="60" cy="20" r="16" fill="#c9d8a8" />
  </g>

  <!-- foreground stems -->
  <g stroke="#2c4a33" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M150 760 C144 620 168 520 196 430" />
    <path d="M196 440 C196 440 250 458 256 512" />
    <path d="M196 500 C196 500 138 516 138 566" />
    <path d="M196 560 C196 560 252 578 258 624" />
    <path d="M330 780 C324 660 300 560 280 480" />
    <path d="M280 490 C280 490 330 500 340 546" />
  </g>
  <g fill="#b7745a">
    <circle cx="196" cy="424" r="20" /><circle cx="280" cy="474" r="17" />
    <circle cx="120" cy="560" r="13" />
  </g>
  <g fill="#e8c14e">
    <circle cx="256" cy="512" r="12" /><circle cx="340" cy="546" r="11" />
  </g>

  <!-- brand mark -->
  <g transform="translate(96 96)">
    <circle cx="40" cy="40" r="40" fill="#2c4a33" />
    <g fill="none" stroke="#c9d8a8" stroke-width="4.5" stroke-linecap="round">
      <path d="M40 14 C52 22 52 58 40 66 C28 58 28 22 40 14 Z" />
      <path d="M40 26 L40 62" />
    </g>
    <circle cx="40" cy="40" r="4.5" fill="#c9d8a8" />
  </g>
  <text x="196" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" letter-spacing="7" fill="#557d55" font-weight="700">MOSS WORKS</text>
  <text x="196" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="5" fill="#3d6344">ECOLOGICAL LANDSCAPE DESIGN</text>

  <!-- eyebrow + headline -->
  <text x="96" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" letter-spacing="6" fill="#b7745a" font-weight="700">GARDENS FOR THE FUTURE</text>
  <text x="90" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="132" fill="#1e3324" font-weight="600">Let the wild</text>
  <text x="90" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="132" fill="#3d6344" font-weight="600" font-style="italic">back in.</text>

  <!-- tagline strip -->
  <text x="96" y="828" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#f4f2e9">Living landscapes that make room for biodiversity — and for people.</text>
</svg>
