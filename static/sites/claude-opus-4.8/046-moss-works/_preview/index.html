<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Moss Works — Gallery poster</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #16241a;
      display: grid;
      place-items: center;
      padding: 4vmin;
      box-sizing: border-box;
    }
    img {
      width: min(100%, 1200px);
      height: auto;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Moss Works promotional poster: Let the wild back in." />
</body>
</html>
