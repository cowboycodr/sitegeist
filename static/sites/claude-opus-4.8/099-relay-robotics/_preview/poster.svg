<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Relay Robotics — Robots that work the room.">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#12333d"/>
			<stop offset="0.62" stop-color="#0c232b"/>
			<stop offset="1" stop-color="#0a1e25"/>
		</linearGradient>
		<linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#eef7f4"/>
			<stop offset="1" stop-color="#cfe6df"/>
		</linearGradient>
		<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#e7efec"/>
		</linearGradient>
		<style>
			.f { font-family: "Segoe UI", system-ui, sans-serif; }
		</style>
	</defs>

	<rect width="1200" height="900" fill="#f5f6f2"/>

	<!-- Stage panel -->
	<rect x="60" y="60" width="1080" height="780" rx="40" fill="url(#sky)"/>

	<!-- Perspective floor grid -->
	<g stroke="#4fd1b5" stroke-opacity="0.16" stroke-width="2">
		<line x1="360" y1="840" x2="120" y2="600"/>
		<line x1="520" y1="840" x2="430" y2="600"/>
		<line x1="680" y1="840" x2="600" y2="600"/>
		<line x1="840" y1="840" x2="770" y2="600"/>
		<line x1="1000" y1="840" x2="1080" y2="600"/>
		<line x1="120" y1="660" x2="1080" y2="660"/>
		<line x1="150" y1="720" x2="1050" y2="720"/>
		<line x1="90" y1="790" x2="1110" y2="790"/>
	</g>

	<!-- Ping rings -->
	<g fill="none" stroke="#4fd1b5" stroke-opacity="0.4" stroke-width="3">
		<circle cx="285" cy="330" r="26"/>
		<circle cx="930" cy="430" r="20"/>
	</g>

	<!-- Robot -->
	<g transform="translate(600 470)">
		<!-- shadow -->
		<ellipse cx="0" cy="330" rx="150" ry="26" fill="#000" opacity="0.35"/>

		<!-- signal beacon -->
		<line x1="0" y1="-190" x2="0" y2="-150" stroke="#ff8b6b" stroke-width="8"/>
		<circle cx="0" cy="-200" r="18" fill="#ff8b6b"/>
		<circle cx="0" cy="-200" r="44" fill="none" stroke="#ff8b6b" stroke-opacity="0.45" stroke-width="6"/>

		<!-- head -->
		<rect x="-118" y="-150" width="236" height="118" rx="52" fill="url(#head)"/>
		<circle cx="-42" cy="-92" r="24" fill="#0f2a33"/>
		<circle cx="42" cy="-92" r="24" fill="#0f2a33"/>
		<rect x="-56" y="-100" width="28" height="9" rx="4" fill="#4fd1b5"/>
		<rect x="28" y="-100" width="28" height="9" rx="4" fill="#4fd1b5"/>

		<!-- body -->
		<rect x="-140" y="-48" width="280" height="330" rx="46" fill="url(#body)"/>
		<rect x="-104" y="-4" width="208" height="70" rx="18" fill="#0f2a33"/>
		<text x="0" y="42" text-anchor="middle" class="f" font-size="34" font-weight="700" fill="#4fd1b5">Relay One</text>
		<!-- bay -->
		<rect x="-104" y="98" width="208" height="150" rx="18" fill="#d6e5e0" stroke="#0f2a33" stroke-opacity="0.15" stroke-width="2"/>
		<rect x="-40" y="166" width="80" height="14" rx="7" fill="#1f8f78"/>
	</g>

	<!-- Wordmark badge -->
	<g transform="translate(110 118)">
		<rect x="0" y="0" width="70" height="70" rx="20" fill="#f5f6f2"/>
		<circle cx="35" cy="42" r="16" fill="#4fd1b5"/>
		<circle cx="35" cy="16" r="7" fill="#ff8b6b"/>
		<rect x="31" y="22" width="8" height="12" fill="#4fd1b5"/>
		<text x="92" y="50" class="f" font-size="40" font-weight="750" fill="#f5f6f2">Relay<tspan fill="#4fd1b5">·</tspan>Robotics</text>
	</g>

	<!-- Category chip -->
	<g transform="translate(880 108)">
		<rect x="0" y="0" width="200" height="46" rx="23" fill="#4fd1b5" fill-opacity="0.18"/>
		<text x="100" y="30" text-anchor="middle" class="f" font-size="20" font-weight="700" fill="#4fd1b5" letter-spacing="2">ROBOTICS</text>
	</g>

	<!-- Tagline -->
	<text x="600" y="808" text-anchor="middle" class="f" font-size="52" font-weight="750" fill="#f5f6f2">Robots that <tspan fill="#4fd1b5">work the room.</tspan></text>
</svg>
