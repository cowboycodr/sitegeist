<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Lucid — Learn by seeing. An education studio of interactive simulations.">
  <defs>
    <radialGradient id="glowV" cx="82%" cy="-4%" r="70%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="6%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#4fe6c4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#4fe6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fe6c4"/>
      <stop offset="50%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#ff77b0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#6a55f0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0e1230"/>
  <rect width="1200" height="900" fill="url(#glowV)"/>
  <rect width="1200" height="900" fill="url(#glowT)"/>

  <!-- brand -->
  <g transform="translate(90,84)">
    <g>
      <circle cx="26" cy="26" r="24" fill="none" stroke="#8b7bff" stroke-width="4"/>
      <circle cx="26" cy="26" r="10" fill="#8b7bff"/>
      <path d="M26 2 A24 24 0 0 1 50 26" fill="none" stroke="#ffc857" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="70" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="800" fill="#eef1ff" letter-spacing="-1">Lucid</text>
  </g>

  <!-- eyebrow -->
  <text x="90" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="6" fill="#4fe6c4">IDEAS YOU CAN TOUCH</text>

  <!-- headline -->
  <text x="86" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="132" font-weight="800" fill="#eef1ff" letter-spacing="-4">Learn by</text>
  <g>
    <rect x="88" y="470" width="470" height="24" rx="8" fill="#ffc857" opacity="0.28"/>
    <text x="86" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="132" font-weight="800" fill="#ffc857" letter-spacing="-4">seeing.</text>
  </g>

  <!-- subtext -->
  <text x="90" y="628" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#a7adde">Interactive courses turn difficult ideas into playful</text>
  <text x="90" y="670" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#a7adde">simulations, diagrams, and experiments.</text>

  <!-- CTA pills -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-weight="700" font-size="26">
    <rect x="90" y="720" width="270" height="66" rx="33" fill="url(#btn)"/>
    <text x="225" y="762" text-anchor="middle" fill="#ffffff">Start exploring</text>
    <rect x="378" y="720" width="262" height="66" rx="33" fill="none" stroke="#3a3f74" stroke-width="2"/>
    <text x="509" y="762" text-anchor="middle" fill="#eef1ff">Browse subjects</text>
  </g>

  <!-- motif panel: pendulum wave + interference -->
  <g transform="translate(742,236)">
    <rect x="0" y="0" width="372" height="430" rx="24" fill="#171c44" stroke="#2a2f60" stroke-width="1.5"/>

    <!-- pendulum wave -->
    <line x1="34" y1="46" x2="338" y2="46" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5">
      <line x1="52" y1="46" x2="40" y2="196"/>
      <line x1="86" y1="46" x2="70" y2="214"/>
      <line x1="120" y1="46" x2="108" y2="224"/>
      <line x1="154" y1="46" x2="150" y2="228"/>
      <line x1="188" y1="46" x2="192" y2="224"/>
      <line x1="222" y1="46" x2="232" y2="214"/>
      <line x1="256" y1="46" x2="268" y2="196"/>
      <line x1="290" y1="46" x2="300" y2="172"/>
      <line x1="324" y1="46" x2="330" y2="146"/>
    </g>
    <g>
      <circle cx="40" cy="196" r="9" fill="#4fe6c4"/>
      <circle cx="70" cy="214" r="9" fill="#63d9c9"/>
      <circle cx="108" cy="224" r="9" fill="#86c9cd"/>
      <circle cx="150" cy="228" r="9" fill="#b0b4cf"/>
      <circle cx="192" cy="224" r="9" fill="#d69bc3"/>
      <circle cx="232" cy="214" r="9" fill="#ee88b8"/>
      <circle cx="268" cy="196" r="9" fill="#ff77b0"/>
      <circle cx="300" cy="172" r="9" fill="#ff77b0"/>
      <circle cx="330" cy="146" r="9" fill="#ff88aa"/>
    </g>

    <!-- interference waves -->
    <g transform="translate(0,300)" fill="none" stroke-width="3">
      <line x1="24" y1="55" x2="348" y2="55" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M24 55 Q60 15 96 55 T168 55 T240 55 T312 55 T348 55" stroke="#4fe6c4" stroke-opacity="0.85"/>
      <path d="M24 55 Q54 90 84 55 T144 55 T204 55 T264 55 T324 55 T348 55" stroke="#ff77b0" stroke-opacity="0.85"/>
      <path d="M24 55 C70 -8 110 118 156 55 S250 -6 300 60 348 40 348 40" stroke="url(#sum)" stroke-width="4"/>
    </g>
  </g>

  <!-- footer tag -->
  <text x="742" y="706" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#4fe6c4">EDUCATION STUDIO</text>
  <circle cx="1110" cy="820" r="6" fill="#ffc857"/>
  <text x="90" y="856" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#6b70a3">lucid — interactive simulations · diagrams · experiments</text>
</svg>
