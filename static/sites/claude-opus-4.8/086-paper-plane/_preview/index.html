<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paper Plane — gallery poster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #22303f; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    img { width: min(100%, 900px); aspect-ratio: 4 / 3; height: auto; border-radius: 10px;
          box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7); }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Paper Plane gallery poster: a cream airmail postcard with a folded paper plane and a dashed flight path.">
</body>
</html>
