<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Odd Common — Make the familiar impossible to ignore.">
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#16130f" opacity="0.16"/>
    </pattern>
    <style>
      .h { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
      .m { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .s { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="900" fill="#f4efe6"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect x="26" y="26" width="1148" height="848" fill="none" stroke="#16130f" stroke-width="6" rx="26"/>

  <!-- header -->
  <g transform="translate(72 96)">
    <circle cx="26" cy="26" r="24" fill="none" stroke="#16130f" stroke-width="6"/>
    <path d="M28 50 a24 24 0 1 0 24-24 a17 19 0 0 1 -24 24 z" fill="#ff4d3d" stroke="#16130f" stroke-width="6"/>
    <circle cx="52" cy="26" r="6" fill="#2f6bff"/>
    <text x="72" y="38" class="h" font-size="34" fill="#16130f">Odd Common</text>
  </g>
  <text x="1128" y="134" text-anchor="end" class="m" font-size="20" fill="#4a453c" letter-spacing="0.18em">CREATIVE&#160;AGENCY</text>
  <line x1="72" y1="176" x2="1128" y2="176" stroke="#16130f" stroke-width="3"/>

  <!-- eyebrow -->
  <g transform="translate(72 250)">
    <circle cx="8" cy="-6" r="8" fill="#ff4d3d"/>
    <circle cx="11" cy="-3" r="8" fill="#2f6bff" opacity="0.85"/>
    <text x="32" y="0" class="m" font-size="21" fill="#4a453c" letter-spacing="0.16em">INDEPENDENT&#160;CREATIVE&#160;PRACTICE</text>
  </g>

  <!-- headline -->
  <g class="h" fill="#16130f" font-size="112">
    <text x="70" y="380">Make the</text>
    <text x="70" y="492">familiar</text>
    <rect x="66" y="536" width="560" height="112" fill="none" stroke="#2f6bff" stroke-width="6" rx="14"/>
    <text x="90" y="622" fill="#ff4d3d">impossible</text>
    <text x="70" y="734">to ignore.</text>
  </g>

  <!-- motif: spot the odd one -->
  <g transform="translate(820 250)">
    <rect x="-24" y="-24" width="332" height="332" rx="24" fill="#ece5d6" stroke="#16130f" stroke-width="6"/>
    <text x="0" y="6" class="m" font-size="18" fill="#4a453c" letter-spacing="0.12em">SPOT THE ODD ONE</text>
    <g>
      <circle cx="30" cy="70" r="30" fill="#ffcf3a"/>
      <circle cx="112" cy="70" r="30" fill="#ffcf3a"/>
      <circle cx="194" cy="70" r="30" fill="#ffcf3a"/>
      <circle cx="276" cy="70" r="30" fill="#ffcf3a"/>
      <circle cx="30" cy="152" r="30" fill="#ffcf3a"/>
      <!-- odd one -->
      <path d="M112 122 q34 -6 30 30 q6 34 -30 30 q-34 6 -30 -30 q-6 -34 30 -30 z" fill="#ff4d3d" stroke="#16130f" stroke-width="5"/>
      <circle cx="194" cy="152" r="30" fill="#ffcf3a"/>
      <circle cx="276" cy="152" r="30" fill="#ffcf3a"/>
      <circle cx="30" cy="234" r="30" fill="#ffcf3a"/>
      <circle cx="112" cy="234" r="30" fill="#ffcf3a"/>
      <circle cx="194" cy="234" r="30" fill="#ffcf3a"/>
      <circle cx="276" cy="234" r="30" fill="#ffcf3a"/>
    </g>
  </g>

  <!-- footer strip -->
  <g transform="translate(0 802)">
    <line x1="72" y1="0" x2="1128" y2="0" stroke="#16130f" stroke-width="3"/>
    <text x="72" y="42" class="s" font-size="26" fill="#16130f">Bold identities · playful campaigns · useful digital worlds.</text>
    <text x="1128" y="42" text-anchor="end" class="m" font-size="22" fill="#2f6bff">oddcommon.studio</text>
  </g>
</svg>
