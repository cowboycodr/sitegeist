<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
	<title id="poster-title">Tideline Supply</title>
	<desc id="poster-desc">Pacific field goods — made for water without walls. A layered swell motif over a deep ocean background.</desc>

	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0f3341" />
			<stop offset="1" stop-color="#071c26" />
		</linearGradient>
		<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#1f6f7a" />
			<stop offset="1" stop-color="#0c2b38" />
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#sky)" />

	<!-- sun / tide marker -->
	<circle cx="600" cy="250" r="94" fill="none" stroke="#43a6a8" stroke-width="7" />
	<circle cx="600" cy="250" r="94" fill="#43a6a8" opacity="0.10" />

	<!-- layered swells -->
	<path d="M0 560 C 220 490 380 640 600 560 S 980 490 1200 560 V900 H0 Z" fill="#1f6f7a" opacity="0.55" />
	<path d="M0 620 C 260 550 420 700 660 620 S 1020 550 1200 620 V900 H0 Z" fill="#43a6a8" opacity="0.4" />
	<path d="M0 690 C 260 630 440 760 680 690 S 1040 630 1200 690 V900 H0 Z" fill="#e7d7b8" opacity="0.22" />

	<!-- foam lines -->
	<g fill="none" stroke="#e8f1ec" stroke-width="4" stroke-linecap="round" opacity="0.5">
		<path d="M120 500 C 260 470 300 530 460 500" />
		<path d="M720 470 C 860 440 900 500 1060 470" />
	</g>

	<!-- eyebrow -->
	<text x="600" y="120" text-anchor="middle" fill="#43a6a8" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="14" font-weight="600">PACIFIC FIELD GOODS</text>

	<!-- wordmark -->
	<text x="600" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" fill="#e8f1ec">Tideline<tspan fill="#43a6a8"> Supply</tspan></text>

	<!-- tagline -->
	<text x="600" y="810" text-anchor="middle" fill="#cfe0df" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic">Made for water without walls.</text>

	<!-- accent pill -->
	<rect x="500" y="700" width="200" height="10" rx="5" fill="#d8794a" />
</svg>
