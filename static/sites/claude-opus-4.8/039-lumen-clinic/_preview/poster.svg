<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Lumen Clinic — A clearer view of your health">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2331"/>
      <stop offset="1" stop-color="#0a151d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6fe0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#7bc4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7bc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe0c8"/>
      <stop offset="1" stop-color="#7bc4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- frame -->
  <rect x="24" y="24" width="1152" height="852" rx="30" fill="none" stroke="rgba(159,190,203,0.18)" stroke-width="2"/>

  <!-- brand mark + name -->
  <g transform="translate(96 118)">
    <circle cx="30" cy="18" r="26" fill="none" stroke="#6fe0c8" stroke-width="4" opacity="0.9"/>
    <circle cx="30" cy="18" r="16" fill="none" stroke="#7bc4ff" stroke-width="4" opacity="0.75"/>
    <circle cx="30" cy="18" r="6" fill="#6fe0c8"/>
    <text x="78" y="14" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700" fill="#eaf4f6" letter-spacing="-0.5">Lumen Clinic</text>
    <text x="78" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#9fbecb">PREVENTIVE HEALTH</text>
  </g>

  <!-- headline -->
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#eaf4f6">
    <text x="96" y="404" font-size="88" font-weight="700" letter-spacing="-2">A clearer view</text>
    <text x="96" y="500" font-size="88" font-weight="700" letter-spacing="-2">of your health.</text>
  </g>
  <text x="98" y="562" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#9fbecb">Complex health signals, turned into calm,</text>
  <text x="98" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#9fbecb">actionable guidance.</text>

  <!-- pill CTA -->
  <g transform="translate(98 660)">
    <rect width="252" height="66" rx="33" fill="#6fe0c8"/>
    <text x="126" y="42" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#05222a">Join Lumen</text>
  </g>

  <!-- signal ring motif -->
  <g transform="translate(890 400)">
    <circle r="220" fill="none" stroke="rgba(159,190,203,0.12)" stroke-width="1.5"/>
    <circle r="165" fill="none" stroke="rgba(159,190,203,0.10)" stroke-width="1.5"/>
    <circle r="110" fill="none" stroke="rgba(159,190,203,0.08)" stroke-width="1.5"/>
    <!-- track -->
    <circle r="205" fill="none" stroke="rgba(159,190,203,0.16)" stroke-width="22"/>
    <!-- arc ~86% -->
    <circle r="205" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"
      stroke-dasharray="1108 1288" transform="rotate(-90)"/>
    <!-- signal dots -->
    <circle cx="205" cy="0" r="9" fill="#6fe0c8"/>
    <circle cx="0" cy="-205" r="9" fill="#7bc4ff"/>
    <circle cx="-145" cy="145" r="9" fill="#ffd59e"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="96" font-weight="700" fill="#eaf4f6" letter-spacing="-3">86</text>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#9fbecb">WELLNESS INDEX</text>
  </g>

  <!-- footer tag -->
  <text x="96" y="812" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#6fe0c8">MEMBERSHIP DIAGNOSTICS · 60+ BIOMARKERS · CLINICIAN-REVIEWED</text>
</svg>
