<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Atlas Noir — Go where the map ends.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0c0c10"/>
			<stop offset="1" stop-color="#131318"/>
		</linearGradient>
		<radialGradient id="halo" cx="76%" cy="20%" r="60%">
			<stop offset="0" stop-color="#caa46a" stop-opacity="0.20"/>
			<stop offset="1" stop-color="#caa46a" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#e4c98f"/>
			<stop offset="1" stop-color="#b98f52"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#halo)"/>

	<!-- topographic contour field -->
	<g fill="none" stroke="#caa46a" stroke-width="1.4">
		<path d="M-20 640 C180 590 320 660 480 610 C640 560 780 640 960 590 C1080 556 1160 596 1240 560" opacity="0.28"/>
		<path d="M-20 690 C170 640 330 700 500 650 C660 604 800 684 980 632 C1090 600 1170 640 1240 606" opacity="0.24"/>
		<path d="M-20 740 C160 694 340 748 510 700 C680 654 820 728 1000 678 C1100 650 1180 686 1240 656" opacity="0.20"/>
		<path d="M-20 792 C150 750 350 796 520 752 C690 710 840 774 1020 728 C1110 704 1190 736 1240 710" opacity="0.16"/>
		<path d="M-20 590 C190 540 310 606 470 560 C620 516 770 592 950 546 C1075 512 1150 552 1240 520" opacity="0.30"/>
		<path d="M-20 540 C200 494 300 556 460 512 C610 470 760 544 940 500 C1070 468 1145 506 1240 476" opacity="0.22"/>
	</g>

	<!-- eyebrow -->
	<text x="110" y="220" fill="#caa46a" font-family="Optima, 'Segoe UI', Avenir, sans-serif" font-size="26" letter-spacing="9" font-weight="600">BESPOKE JOURNEYS</text>

	<!-- title -->
	<text x="104" y="360" fill="#ece6d8" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="140" font-weight="500" letter-spacing="-1">Go where</text>
	<text x="104" y="490" fill="#ece6d8" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="140" font-weight="500" letter-spacing="-1">the map ends.</text>

	<!-- description -->
	<text x="110" y="560" fill="#b6b1a4" font-family="Optima, 'Segoe UI', Avenir, sans-serif" font-size="30">Remote landscapes. Rare access. Impeccable restraint.</text>

	<!-- compass emblem -->
	<g transform="translate(980 250)">
		<circle r="118" fill="none" stroke="#ece6d8" stroke-width="1.2" opacity="0.30"/>
		<circle r="150" fill="none" stroke="#caa46a" stroke-width="1" opacity="0.45"/>
		<path d="M0 -140 L26 0 L0 140 L-26 0 Z" fill="url(#brass)"/>
		<path d="M-140 0 L0 -22 L140 0 L0 22 Z" fill="none" stroke="#e4c98f" stroke-width="1.4"/>
		<circle r="9" fill="#0c0c10" stroke="#e4c98f" stroke-width="1.6"/>
		<text x="0" y="-160" fill="#b6b1a4" font-family="serif" font-size="20" text-anchor="middle" letter-spacing="3">N</text>
	</g>

	<!-- wordmark -->
	<g transform="translate(110 780)">
		<g transform="translate(0 -22)">
			<circle cx="20" cy="0" r="20" fill="none" stroke="#caa46a" stroke-width="1.2" opacity="0.5"/>
			<path d="M20 -18 L24 0 L20 18 L16 0 Z" fill="#caa46a"/>
		</g>
		<text x="58" y="-8" fill="#ece6d8" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="42" letter-spacing="4">Atlas<tspan fill="#caa46a">Noir</tspan></text>
	</g>

	<text x="1090" y="778" fill="#b6b1a4" font-family="Optima, 'Segoe UI', sans-serif" font-size="22" text-anchor="end" letter-spacing="4">LUXURY TRAVEL · EST 1998</text>

	<rect x="0.5" y="0.5" width="1199" height="899" fill="none" stroke="#caa46a" stroke-width="1" opacity="0.25"/>
</svg>
