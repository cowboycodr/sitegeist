<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Offgrid Works — gallery poster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1a22; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    img { width: min(100%, 1200px); height: auto; border-radius: 12px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.7); }
  </style>
</head>
<body>
  <img src="poster.svg" alt="Offgrid Works gallery poster: an electric camper under a night sky above a pine ridge, with the tagline 'A cabin with a steering wheel.'" />
</body>
</html>
