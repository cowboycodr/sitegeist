<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Rare Earth — sculptural jewelry, formed by pressure">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#211c17"/>
			<stop offset="1" stop-color="#12100c"/>
		</linearGradient>
		<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#eccb8f"/>
			<stop offset="0.5" stop-color="#a9773f"/>
			<stop offset="1" stop-color="#6b4a24"/>
		</linearGradient>
		<radialGradient id="gem" cx="0.4" cy="0.32" r="0.85">
			<stop offset="0" stop-color="#a8bca8"/>
			<stop offset="0.55" stop-color="#5c6b52"/>
			<stop offset="1" stop-color="#2c3327"/>
		</radialGradient>
		<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#a9773f" stop-opacity="0.28"/>
			<stop offset="1" stop-color="#a9773f" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect x="28" y="28" width="1144" height="844" fill="none" stroke="#a9773f" stroke-width="1.5" opacity="0.5"/>

	<!-- concentric pressure rings -->
	<g fill="none" stroke="#a9773f" opacity="0.22">
		<circle cx="835" cy="450" r="300" stroke-width="1"/>
		<circle cx="835" cy="450" r="235" stroke-width="1"/>
		<circle cx="835" cy="450" r="170" stroke-width="1"/>
	</g>
	<circle cx="835" cy="450" r="300" fill="url(#halo)"/>

	<!-- raw crystal motif -->
	<g transform="translate(835 430)">
		<polygon points="0,-200 96,-84 70,138 -70,138 -96,-84" fill="url(#gem)" stroke="#c99a5b" stroke-width="3"/>
		<polygon points="0,-200 0,138 -96,-84" fill="#ffffff" opacity="0.10"/>
		<polygon points="0,-200 96,-84 0,20" fill="#ffffff" opacity="0.18"/>
		<polyline points="-96,-84 0,20 96,-84" fill="none" stroke="#c99a5b" stroke-width="1.6" opacity="0.8"/>
		<polyline points="0,20 -70,138 M0,20 70,138" fill="none" stroke="#c99a5b" stroke-width="1.6" opacity="0.8"/>
		<polygon points="16,-120 42,-64 20,-50 4,-96" fill="#ffffff" opacity="0.32"/>
	</g>

	<!-- gold band cradling the stone -->
	<path d="M655 560 Q835 730 1015 560" fill="none" stroke="url(#metal)" stroke-width="34" stroke-linecap="round"/>
	<path d="M672 552 Q835 706 998 552" fill="none" stroke="#f0d9a8" stroke-width="3" opacity="0.55" stroke-linecap="round"/>

	<!-- mark -->
	<g transform="translate(96 96)">
		<polygon points="26,0 46,15 39,44 13,44 6,15" fill="none" stroke="#a9773f" stroke-width="2.4"/>
		<polygon points="26,0 26,52 6,15" fill="#a9773f" opacity="0.2"/>
		<path d="M6 15 L26 26 L46 15 M26 26 L26 44" fill="none" stroke="#f3ede2" stroke-width="1.6"/>
	</g>

	<!-- eyebrow -->
	<text x="150" y="128" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="20" letter-spacing="7" fill="#c99a5b">OBJECTS OF PERMANENCE</text>

	<!-- title -->
	<text x="92" y="440" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="150" fill="#f3ede2" letter-spacing="-2">Rare</text>
	<text x="92" y="580" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="150" fill="#f3ede2" letter-spacing="-2">Earth</text>

	<!-- tagline -->
	<text x="98" y="668" font-family="Iowan Old Style, Palatino, Georgia, serif" font-style="italic" font-size="46" fill="#c99a5b">Formed by pressure.</text>

	<!-- description -->
	<text x="98" y="742" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24" fill="#cfc6b6">Sculptural jewelry made with recycled</text>
	<text x="98" y="778" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24" fill="#cfc6b6">metals, traceable stones, and an</text>
	<text x="98" y="814" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24" fill="#cfc6b6">instinct for imperfection.</text>

	<!-- footer chips -->
	<g font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="16" letter-spacing="3" fill="#8a8172">
		<text x="820" y="838">RECYCLED · TRACEABLE · 1 OF 1</text>
	</g>
</svg>
