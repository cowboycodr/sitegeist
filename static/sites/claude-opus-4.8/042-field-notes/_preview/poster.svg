<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Field Notes — Buildings that belong. Landscape-led architecture.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#ece4d6"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#sky)"/>

    <!-- topographic contour motif -->
    <g fill="none" stroke="#4a5b3f" stroke-width="2.4">
      <path d="M-40 250 C180 250 220 130 460 130 C700 130 760 300 1000 300 C1140 300 1180 250 1260 250" opacity="0.30"/>
      <path d="M-40 320 C180 320 230 200 470 200 C710 200 770 370 1010 370 C1150 370 1190 320 1260 320" opacity="0.26"/>
      <path d="M-40 390 C180 390 240 270 480 270 C720 270 780 440 1020 440 C1160 440 1200 390 1260 390" opacity="0.22"/>
      <path d="M-40 460 C180 460 250 340 490 340 C730 340 790 510 1030 510 C1170 510 1210 460 1260 460" opacity="0.18"/>
      <path d="M-40 530 C180 530 260 410 500 410 C740 410 800 580 1040 580 C1180 580 1220 530 1260 530" opacity="0.14"/>
    </g>

    <!-- clay contour accents lower -->
    <g fill="none" stroke="#b4623f" stroke-width="2.4">
      <path d="M-40 640 C220 640 300 560 560 560 C820 560 900 690 1120 690 C1200 690 1240 660 1300 660" opacity="0.4"/>
      <path d="M-40 720 C220 720 300 650 560 650 C820 650 900 780 1120 780 C1200 780 1240 750 1300 750" opacity="0.3"/>
    </g>

    <!-- brand mark -->
    <g transform="translate(96 128)" stroke="#b4623f" fill="none" stroke-width="4">
      <path d="M0 60 C24 60 24 30 60 30 C96 30 96 60 120 60"/>
      <path d="M0 42 C24 42 24 12 60 12 C96 12 96 42 120 42" opacity="0.6"/>
      <path d="M0 78 C24 78 24 48 60 48 C96 48 96 78 120 78" opacity="0.35"/>
    </g>

    <text x="96" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="8" fill="#b4623f">ARCHITECTURE IN CONTEXT</text>

    <text x="90" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#35422e">Field Notes</text>

    <text x="96" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#24261f">Buildings that belong.</text>

    <text x="96" y="628" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#4c5043">Low-impact homes, retreats &amp; generous public spaces.</text>

    <!-- pill -->
    <g transform="translate(96 700)">
      <rect x="0" y="0" width="300" height="72" rx="36" fill="#4a5b3f"/>
      <text x="150" y="47" text-anchor="middle" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f4efe6">View projects</text>
    </g>

    <rect x="0" y="0" width="1200" height="900" fill="none" stroke="#cdc3b0" stroke-width="2"/>
  </g>
</svg>
