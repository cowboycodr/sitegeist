<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Deep Time — gallery poster</title>
<style>
  html,body{margin:0;height:100%;background:#070910;color:#9aa8bd;font-family:Georgia,serif}
  .frame{min-height:100%;display:grid;place-items:center;padding:24px}
  img{width:min(1200px,100%);height:auto;border:1px solid #27303f;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  figcaption{text-align:center;margin-top:14px;letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;color:#f2c14e}
</style>
</head>
<body>
  <figure class="frame">
    <img src="poster.svg" alt="Deep Time gallery poster: an atlas of Earth across four billion years.">
    <figcaption>Deep Time — 4:3 gallery poster</figcaption>
  </figure>
</body>
</html>
