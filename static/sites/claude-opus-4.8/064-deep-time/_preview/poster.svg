<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Deep Time — four billion years, still unfolding.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a12"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#d68a3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d68a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strataFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Stratigraphic column, lower band -->
  <g>
    <rect x="0" y="560" width="1200" height="70" fill="#8a5a3c"/>
    <rect x="0" y="630" width="1200" height="58" fill="#a86a30"/>
    <rect x="0" y="688" width="1200" height="66" fill="#7f9a6a"/>
    <rect x="0" y="754" width="1200" height="56" fill="#5a8b96"/>
    <rect x="0" y="810" width="1200" height="50" fill="#c9743a"/>
    <rect x="0" y="860" width="1200" height="40" fill="#e0c88a"/>
    <rect x="0" y="560" width="1200" height="340" fill="url(#strataFade)"/>
    <!-- sediment speckle lines -->
    <g stroke="#000000" stroke-opacity="0.18" stroke-width="2">
      <line x1="0" y1="596" x2="1200" y2="596"/>
      <line x1="0" y1="659" x2="1200" y2="659"/>
      <line x1="0" y1="721" x2="1200" y2="721"/>
      <line x1="0" y1="782" x2="1200" y2="782"/>
    </g>
  </g>

  <!-- Ammonite spiral motif -->
  <g transform="translate(940 300)" fill="none" stroke="#e0c88a" stroke-width="9" stroke-linecap="round" opacity="0.92">
    <path d="M0 0 a10 10 0 1 1 12 -12 a34 34 0 1 1 -40 22 a58 58 0 1 1 70 -34 a82 82 0 1 1 -100 46 a106 106 0 1 1 130 -58"/>
  </g>
  <g transform="translate(940 300)" stroke="#c9743a" stroke-width="2" opacity="0.5">
    <line x1="0" y1="0" x2="118" y2="-56"/>
    <line x1="0" y1="0" x2="70" y2="88"/>
    <line x1="0" y1="0" x2="-96" y2="42"/>
  </g>

  <!-- Eyebrow -->
  <text x="90" y="180" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif"
        font-size="30" letter-spacing="11" fill="#d68a3c" font-weight="600">AN ATLAS OF EARTH</text>

  <!-- Title -->
  <text x="84" y="330" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="188" fill="#e8dcc2" font-weight="600" letter-spacing="-2">Deep</text>
  <text x="84" y="500" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="188" fill="#e8dcc2" font-weight="600" letter-spacing="-2">Time</text>

  <!-- Tagline -->
  <text x="90" y="700" font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="42" fill="#f2e9db" font-style="italic">Four billion years, still unfolding.</text>

  <!-- Category footer -->
  <text x="90" y="770" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif"
        font-size="24" letter-spacing="6" fill="#14100c" font-weight="600">NATURAL HISTORY · THE STRATIGRAPH HALL</text>
</svg>
