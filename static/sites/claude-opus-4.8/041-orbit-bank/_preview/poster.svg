<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Orbit — Money that moves with you.">
	<defs>
		<radialGradient id="bg" cx="76%" cy="8%" r="90%">
			<stop offset="0" stop-color="#241f57"/>
			<stop offset="55%" stop-color="#0f0f28"/>
			<stop offset="100%" stop-color="#0a0a16"/>
		</radialGradient>
		<radialGradient id="glow" cx="8%" cy="90%" r="70%">
			<stop offset="0" stop-color="#123b45" stop-opacity="0.8"/>
			<stop offset="100%" stop-color="#123b45" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="planet" cx="35%" cy="30%" r="75%">
			<stop offset="0" stop-color="#c3b9ff"/>
			<stop offset="60%" stop-color="#5a4bd6"/>
			<stop offset="100%" stop-color="#2c2470"/>
		</radialGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#8b7bff"/>
			<stop offset="1" stop-color="#57d9c8"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>

	<!-- Orbit motif -->
	<g transform="translate(860 470)" fill="none">
		<circle r="300" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
		<circle r="210" stroke="#8b7bff" stroke-opacity="0.35" stroke-width="2"/>
		<circle r="120" stroke="#57d9c8" stroke-opacity="0.35" stroke-width="2"/>
		<circle cx="0" cy="-300" r="16" fill="#8b7bff"/>
		<circle cx="0" cy="-300" r="16" fill="#8b7bff" opacity="0.35" stroke="#8b7bff" stroke-width="10" stroke-opacity="0.25"/>
		<circle cx="182" cy="105" r="13" fill="#57d9c8"/>
		<circle cx="-85" cy="-85" r="9" fill="#ffffff"/>
		<circle r="70" fill="url(#planet)"/>
	</g>

	<!-- Brand -->
	<g transform="translate(90 108)">
		<circle cx="26" cy="26" r="24" fill="none" stroke="#8b7bff" stroke-width="4"/>
		<circle cx="26" cy="26" r="8" fill="#57d9c8"/>
		<text x="66" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="700" fill="#eef0ff">Orbit</text>
	</g>

	<!-- Eyebrow -->
	<g transform="translate(90 250)">
		<rect x="0" y="-30" width="330" height="44" rx="22" fill="#57d9c8" fill-opacity="0.08" stroke="#57d9c8" stroke-opacity="0.35"/>
		<text x="24" y="0" font-family="Segoe UI, system-ui, sans-serif" font-size="21" letter-spacing="3" fill="#57d9c8">BANKING WITHOUT GRAVITY</text>
	</g>

	<!-- Headline -->
	<text x="86" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#eef0ff">Money that</text>
	<text x="86" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#eef0ff">moves</text>
	<text x="470" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#accent)">with you.</text>

	<!-- Lede -->
	<text x="90" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#a6a8c8">One simple account for saving, spending,</text>
	<text x="90" y="642" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#a6a8c8">investing, and living across borders.</text>

	<!-- CTA pill -->
	<g transform="translate(90 700)">
		<rect width="300" height="66" rx="33" fill="url(#accent)"/>
		<text x="150" y="42" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0a0a16">Open an account</text>
	</g>

	<!-- Stats -->
	<g font-family="Segoe UI, system-ui, sans-serif" transform="translate(92 812)">
		<text x="0" y="0" font-size="44" font-weight="800" fill="#eef0ff">0</text>
		<text x="0" y="34" font-size="19" fill="#7a7ca0">Hidden fees</text>
		<text x="200" y="0" font-size="44" font-weight="800" fill="#eef0ff">150+</text>
		<text x="200" y="34" font-size="19" fill="#7a7ca0">Currencies</text>
		<text x="420" y="0" font-size="44" font-weight="800" fill="#eef0ff">1.2M</text>
		<text x="420" y="34" font-size="19" fill="#7a7ca0">Orbiters</text>
	</g>
</svg>
