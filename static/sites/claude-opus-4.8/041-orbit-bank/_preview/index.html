<title>Orbit — Poster preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05060f; padding: 24px; }
  figure { margin: 0; width: min(960px, 100%); }
  img { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: 0 30px 90px -40px rgba(0,0,0,0.9); }
  figcaption { color: #7a83b4; font-family: system-ui, Arial, sans-serif; font-size: 14px; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<figure>
  <img src="poster.svg" alt="Orbit gallery poster: Money that moves with you." />
  <figcaption>Orbit — gallery poster (4:3). Promotional artwork, not the website.</figcaption>
</figure>
</body>
