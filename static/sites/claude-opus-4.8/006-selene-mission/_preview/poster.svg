<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Selene Mission — The moon is our next address</title>
  <desc id="poster-desc">Poster showing a crescent moon over a starfield with the Selene Mission name and tagline.</desc>
  <defs>
    <radialGradient id="sky" cx="78%" cy="10%" r="110%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="55%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f2f3f8"/>
      <stop offset="42%" stop-color="#d9dce6"/>
      <stop offset="80%" stop-color="#9ba0b3"/>
      <stop offset="100%" stop-color="#5c6172"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c274"/>
      <stop offset="100%" stop-color="#f0b45a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="2.4"/>
    <circle cx="300" cy="90" r="1.6"/>
    <circle cx="470" cy="200" r="2"/>
    <circle cx="210" cy="320" r="1.4"/>
    <circle cx="640" cy="120" r="1.8"/>
    <circle cx="90" cy="470" r="1.6"/>
    <circle cx="380" cy="430" r="2.2"/>
    <circle cx="150" cy="640" r="1.8"/>
    <circle cx="520" cy="560" r="1.4"/>
    <circle cx="720" cy="330" r="1.6"/>
    <circle cx="1040" cy="600" r="2"/>
    <circle cx="1120" cy="250" r="1.6"/>
    <circle cx="960" cy="150" r="1.4"/>
    <circle cx="60" cy="800" r="1.8"/>
    <circle cx="430" cy="720" r="1.4"/>
  </g>

  <!-- orbit -->
  <circle cx="880" cy="300" r="300" fill="none" stroke="#9aa3c4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="1092" cy="88" r="9" fill="url(#amber)"/>
  <circle cx="1092" cy="88" r="20" fill="#f0b45a" opacity="0.18"/>

  <!-- moon -->
  <circle cx="880" cy="300" r="205" fill="url(#moon)"/>
  <circle cx="880" cy="300" r="205" fill="none" stroke="#d9dce6" stroke-opacity="0.18" stroke-width="34"/>
  <g fill="#7c8194" opacity="0.75">
    <circle cx="815" cy="245" r="30"/>
    <circle cx="930" cy="215" r="18"/>
    <circle cx="905" cy="345" r="44"/>
    <circle cx="820" cy="360" r="16"/>
    <circle cx="965" cy="300" r="12"/>
  </g>
  <path d="M880 95 a205 205 0 1 0 0 410 a150 150 0 0 1 0 -410 z" fill="#05060d" opacity="0.30"/>

  <!-- eyebrow badge -->
  <g transform="translate(90 470)">
    <rect x="0" y="0" width="330" height="46" rx="23" fill="#f0b45a" fill-opacity="0.16" stroke="#9aa3c4" stroke-opacity="0.35"/>
    <text x="26" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="20" letter-spacing="4" fill="#f0b45a" font-weight="600">LUNAR HABITAT · M01</text>
  </g>

  <!-- name -->
  <text x="88" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="118" font-weight="800" letter-spacing="-2" fill="#e8ecf7">Selene</text>
  <text x="90" y="694" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="14" fill="#f0b45a">MISSION</text>

  <!-- tagline -->
  <text x="92" y="782" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="700" fill="#e8ecf7">The moon is our next address.</text>
  <text x="92" y="828" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#9aa3c4">A private lunar program preparing its first surface habitat.</text>

  <line x1="92" y1="720" x2="560" y2="720" stroke="#9aa3c4" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
