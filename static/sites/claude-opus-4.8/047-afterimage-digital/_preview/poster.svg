<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Afterimage Digital — Art beyond the frame.">
	<defs>
		<radialGradient id="bg" cx="76%" cy="8%" r="90%">
			<stop offset="0%" stop-color="#150f33"/>
			<stop offset="45%" stop-color="#0a0818"/>
			<stop offset="100%" stop-color="#050510"/>
		</radialGradient>
		<radialGradient id="core" cx="35%" cy="32%" r="70%">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="40%" stop-color="#46e6ff"/>
			<stop offset="100%" stop-color="#9a7bff"/>
		</radialGradient>
		<radialGradient id="echo" cx="50%" cy="50%" r="50%">
			<stop offset="45%" stop-color="#ff5cc8" stop-opacity="0"/>
			<stop offset="72%" stop-color="#ff5cc8" stop-opacity="0.85"/>
			<stop offset="100%" stop-color="#ff5cc8" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="halo" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#46e6ff" stop-opacity="0.55"/>
			<stop offset="100%" stop-color="#46e6ff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.4">
			<stop offset="15%" stop-color="#ffffff"/>
			<stop offset="58%" stop-color="#46e6ff"/>
			<stop offset="95%" stop-color="#ff5cc8"/>
		</linearGradient>
		<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#78ffd6" stop-opacity="0"/>
			<stop offset="50%" stop-color="#78ffd6" stop-opacity="0.5"/>
			<stop offset="100%" stop-color="#9a7bff" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>

	<!-- afterimage orbit rings -->
	<g fill="none" stroke-linecap="round" opacity="0.85">
		<ellipse cx="820" cy="360" rx="300" ry="200" stroke="#46e6ff" stroke-opacity="0.28" stroke-width="1.5"/>
		<ellipse cx="820" cy="360" rx="230" ry="150" stroke="#9a7bff" stroke-opacity="0.30" stroke-width="1.5"/>
		<ellipse cx="820" cy="360" rx="160" ry="105" stroke="#ff5cc8" stroke-opacity="0.30" stroke-width="1.5"/>
	</g>

	<!-- drifting light ribbon -->
	<path d="M 60 620 C 300 560 520 700 760 600 S 1160 560 1180 640" fill="none" stroke="url(#ribbon)" stroke-width="10" opacity="0.7"/>

	<!-- the afterimage motif: core + echoing after-glows -->
	<circle cx="820" cy="360" r="260" fill="url(#halo)"/>
	<circle cx="905" cy="405" r="150" fill="url(#echo)" opacity="0.55"/>
	<circle cx="862" cy="384" r="135" fill="url(#echo)" opacity="0.75"/>
	<circle cx="820" cy="360" r="120" fill="url(#core)"/>

	<!-- floating motes -->
	<g>
		<circle cx="200" cy="220" r="6" fill="#46e6ff"/>
		<circle cx="330" cy="150" r="4" fill="#ff5cc8"/>
		<circle cx="1060" cy="180" r="5" fill="#ffcf6b"/>
		<circle cx="150" cy="470" r="4" fill="#9a7bff"/>
		<circle cx="1110" cy="520" r="6" fill="#78ffd6"/>
	</g>

	<!-- wordmark -->
	<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
		<text x="90" y="215" fill="#46e6ff" font-size="26" font-weight="700" letter-spacing="8">EXHIBITION 017 · ON VIEW</text>
		<text x="86" y="360" fill="url(#ink)" font-size="128" font-weight="800" letter-spacing="-3">Art beyond</text>
		<text x="86" y="486" fill="url(#ink)" font-size="128" font-weight="800" letter-spacing="-3">the frame.</text>
	</g>

	<!-- footer bar -->
	<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
		<circle cx="104" cy="800" r="15" fill="url(#core)"/>
		<circle cx="112" cy="806" r="12" fill="url(#echo)" opacity="0.8"/>
		<text x="140" y="808" fill="#eef0ff" font-size="34" font-weight="700" letter-spacing="1">Afterimage <tspan fill="#a6a6c8" font-weight="400">Digital</tspan></text>
		<text x="140" y="842" fill="#6d6d92" font-size="22">A gallery of luminous, interactive work — light that lingers.</text>
	</g>
</svg>
