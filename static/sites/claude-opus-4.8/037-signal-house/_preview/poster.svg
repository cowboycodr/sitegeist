<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="posterTitle posterDesc">
	<title id="posterTitle">Signal House — Make noise worth hearing.</title>
	<desc id="posterDesc">Gallery poster for Signal House, an independent culture-first creative studio.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#16131f" />
			<stop offset="1" stop-color="#0a0810" />
		</linearGradient>
		<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#ff4326" />
			<stop offset="1" stop-color="#ffd23f" />
		</linearGradient>
		<radialGradient id="glow" cx="0.85" cy="0.12" r="0.7">
			<stop offset="0" stop-color="#ff4326" stop-opacity="0.28" />
			<stop offset="1" stop-color="#ff4326" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)" />
	<rect width="1200" height="900" fill="url(#glow)" />

	<!-- brand mark -->
	<g transform="translate(96 96)">
		<g>
			<rect x="0" y="26" width="14" height="30" rx="4" fill="#ff4326" />
			<rect x="22" y="0" width="14" height="56" rx="4" fill="#ffd23f" />
			<rect x="44" y="18" width="14" height="38" rx="4" fill="#45d6cf" />
			<rect x="66" y="8" width="14" height="48" rx="4" fill="#ff4326" />
		</g>
		<text x="100" y="42" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f4efe6">Signal House</text>
	</g>

	<!-- eyebrow -->
	<g transform="translate(96 250)">
		<rect x="0" y="-30" width="330" height="46" rx="23" fill="none" stroke="rgba(244,239,230,0.2)" />
		<text x="26" y="0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#45d6cf">INDEPENDENT CREATIVE STUDIO</text>
	</g>

	<!-- headline -->
	<g font-family="Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-4" fill="#f4efe6">
		<text x="92" y="440" font-size="150">Make noise</text>
		<text x="92" y="580" font-size="150">worth <tspan fill="#ff4326">hearing.</tspan></text>
	</g>

	<!-- lead -->
	<text x="96" y="660" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#c9c3b8">Identities, campaigns, and digital worlds for ambitious brands.</text>

	<!-- equalizer motif -->
	<g transform="translate(96 720)">
		<rect x="0" y="60" width="26" height="60" rx="6" fill="url(#bar)" />
		<rect x="38" y="14" width="26" height="106" rx="6" fill="url(#bar)" />
		<rect x="76" y="82" width="26" height="38" rx="6" fill="url(#bar)" />
		<rect x="114" y="0" width="26" height="120" rx="6" fill="url(#bar)" />
		<rect x="152" y="44" width="26" height="76" rx="6" fill="url(#bar)" />
		<rect x="190" y="70" width="26" height="50" rx="6" fill="url(#bar)" />
		<rect x="228" y="24" width="26" height="96" rx="6" fill="url(#bar)" />
		<rect x="266" y="88" width="26" height="32" rx="6" fill="url(#bar)" />
	</g>

	<!-- on air chip -->
	<g transform="translate(940 150)">
		<rect x="-2" y="-34" width="180" height="52" rx="26" fill="rgba(255,67,38,0.14)" stroke="rgba(255,67,38,0.5)" />
		<circle cx="30" cy="-8" r="9" fill="#ff4326" />
		<text x="52" y="-1" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#ffd23f">ON AIR</text>
	</g>

	<!-- waveform accent -->
	<path d="M760 700 Q 810 610 860 700 T 960 700 T 1060 700 T 1160 700" fill="none" stroke="#45d6cf" stroke-width="6" stroke-linecap="round" opacity="0.85" />

	<!-- tagline footer -->
	<text x="1104" y="836" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#c9c3b8">Make noise worth hearing.</text>
</svg>
