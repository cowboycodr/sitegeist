<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Void Unit — Drop 07 — Uniforms for the after-hours">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#d6ff2b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d6ff2b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#23232a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- registration mark motif -->
  <g transform="translate(100 110)" stroke="#d6ff2b" stroke-width="4" fill="none">
    <rect x="0" y="0" width="70" height="70"/>
    <path d="M35 -14v22M35 62v22M-14 35h22M62 35h22"/>
    <circle cx="35" cy="35" r="12"/>
  </g>

  <!-- eyebrow -->
  <text x="196" y="158" fill="#d6ff2b" font-family="'DejaVu Sans Mono',monospace" font-size="26" letter-spacing="8">DROP 07 · NO RESTOCK</text>

  <!-- wordmark -->
  <text x="96" y="470" fill="#ededed" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="300" letter-spacing="-6">VOID</text>
  <text x="96" y="720" fill="none" stroke="#ededed" stroke-width="3" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="300" letter-spacing="-6">UNIT</text>

  <!-- tagline -->
  <text x="100" y="800" fill="#8b8b93" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="42" letter-spacing="2" text-transform="uppercase">UNIFORMS FOR THE AFTER-HOURS</text>

  <!-- side data column -->
  <g font-family="'DejaVu Sans Mono',monospace" font-size="22" letter-spacing="4" fill="#8b8b93">
    <text x="1120" y="470" text-anchor="end">400 UNITS</text>
    <text x="1120" y="510" text-anchor="end" fill="#d6ff2b">SEALED AT CLOSE</text>
    <text x="1120" y="550" text-anchor="end">SERIAL VU07</text>
  </g>

  <!-- garment silhouette accent -->
  <g transform="translate(880 560)" stroke="#2a2a30" stroke-width="3" fill="#141418">
    <path d="M60 40 L100 8 H160 L200 40 L240 100 L212 128 L192 108 V320 H68 V108 L48 128 L20 100 Z"/>
    <circle cx="130" cy="80" r="14" fill="none" stroke="#d6ff2b"/>
    <path d="M130 94 V220" stroke="#d6ff2b" stroke-dasharray="4 8"/>
  </g>

  <!-- footer strip -->
  <rect x="40" y="820" width="1120" height="40" fill="#d6ff2b"/>
  <text x="600" y="847" text-anchor="middle" fill="#000000" font-family="'DejaVu Sans Mono',monospace" font-weight="700" font-size="20" letter-spacing="6">LIMITED SYSTEM — NO RESTOCK — VOID UNIT</text>
</svg>
