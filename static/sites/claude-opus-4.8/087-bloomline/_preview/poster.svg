<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Bloomline — Flowers with a point of view. A sculptural floral studio poster.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f4efe6"/>
			<stop offset="1" stop-color="#e7dcc4"/>
		</linearGradient>
		<radialGradient id="petalA" cx="0.4" cy="0.35" r="0.85">
			<stop offset="0" stop-color="#e98cab"/>
			<stop offset="1" stop-color="#b64a6f"/>
		</radialGradient>
		<linearGradient id="vaseG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbf8f1"/>
			<stop offset="1" stop-color="#ddd0b6"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect x="28" y="28" width="1144" height="844" fill="none" stroke="#23301f" stroke-opacity="0.18" stroke-width="2"/>

	<!-- Eyebrow -->
	<text x="90" y="132" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#3a5a3f">SEASONAL STEMS / LONDON</text>

	<!-- Wordmark -->
	<text x="86" y="300" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="150" font-weight="600" fill="#23301f" letter-spacing="-2">Bloomline</text>

	<!-- Tagline -->
	<text x="90" y="386" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="52" font-style="italic" fill="#b64a6f">Flowers with a point of view.</text>

	<!-- Description -->
	<text x="90" y="470" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#4b5a44">Sculptural floral compositions for homes,</text>
	<text x="90" y="512" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#4b5a44">gatherings, galleries, and unexpected Tuesdays.</text>

	<!-- Pill -->
	<rect x="90" y="576" width="284" height="72" rx="36" fill="#23301f"/>
	<text x="232" y="622" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4efe6">Send flowers</text>

	<!-- Footer note -->
	<text x="90" y="820" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#4b5a44">FLORAL DESIGN · STUDIO No. 087</text>

	<!-- Sculptural bouquet motif, right side -->
	<g transform="translate(880 0)">
		<!-- stems -->
		<g stroke="#3a5a3f" fill="none" stroke-linecap="round">
			<path d="M120 700 C 30 560 -10 420 60 210" stroke-width="9"/>
			<path d="M126 700 C 210 540 260 420 190 180" stroke-width="9"/>
			<path d="M128 700 C 128 560 130 420 125 250" stroke-width="9"/>
			<path d="M70 460 C 10 440 -20 410 -34 380" stroke-width="6"/>
			<path d="M186 400 C 250 388 284 360 300 328" stroke-width="6"/>
		</g>
		<!-- leaves -->
		<path d="M-34 380 c-40 -12 -66 -40 -72 -72 38 4 66 30 72 72z" fill="#3a5a3f"/>
		<path d="M300 328 c42 -14 70 -42 76 -76 -40 6 -70 34 -76 76z" fill="#3a5a3f"/>
		<path d="M128 500 c-30 -22 -44 -56 -40 -90 34 16 52 54 40 90z" fill="#4b5a44"/>

		<!-- blooms -->
		<g transform="translate(60 210)">
			<ellipse rx="44" ry="80" fill="url(#petalA)"/>
			<ellipse rx="80" ry="44" fill="url(#petalA)"/>
			<circle r="30" fill="#cf7c4a"/>
		</g>
		<g transform="translate(190 180)">
			<ellipse rx="38" ry="70" fill="#d9668a"/>
			<ellipse rx="70" ry="38" fill="#d9668a"/>
			<circle r="26" fill="#e6dcc8"/>
			<circle r="11" fill="#cf7c4a"/>
		</g>
		<g transform="translate(125 250)">
			<circle r="52" fill="#e7b7cb"/>
			<circle r="24" fill="#b64a6f"/>
		</g>

		<!-- vase -->
		<path d="M52 700 q-18 -104 20 -138 h108 q40 34 22 138 a94 44 0 0 1 -150 0z" fill="url(#vaseG)" stroke="#3a5a3f" stroke-opacity="0.28" stroke-width="3"/>
	</g>
</svg>
