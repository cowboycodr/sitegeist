<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tiny Giants — Big wonder for little minds">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff8ec" />
			<stop offset="1" stop-color="#ffe9cf" />
		</linearGradient>
		<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#12233a" />
			<stop offset="1" stop-color="#1c3350" />
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#sky)" />

	<!-- soft blobs -->
	<circle cx="220" cy="220" r="150" fill="#ffcf3f" opacity="0.4" />
	<circle cx="1010" cy="700" r="130" fill="#4ecdc4" opacity="0.35" />
	<circle cx="150" cy="720" r="90" fill="#a06bff" opacity="0.3" />

	<!-- decorative stars -->
	<g fill="#a06bff">
		<path d="M980 150 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z" />
	</g>
	<g fill="#4ecdc4">
		<path d="M120 380 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" />
	</g>
	<g fill="#ff6b6b">
		<path d="M1090 300 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" />
	</g>

	<!-- eyebrow -->
	<g transform="translate(96 150)">
		<circle cx="12" cy="-6" r="11" fill="#ff6b6b" />
		<text x="34" y="0" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#a06bff">NOW PLAYING</text>
	</g>

	<!-- title -->
	<text x="92" y="330" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="120" font-weight="800" fill="#12233a">Tiny <tspan fill="#ff6b6b">Giants</tspan></text>
	<text x="96" y="440" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="62" font-weight="800" fill="#12233a">Big wonder for</text>
	<text x="96" y="512" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="62" font-weight="800" fill="#12233a">little minds.</text>

	<text x="98" y="580" font-family="'Trebuchet MS',sans-serif" font-size="30" fill="#12233a" opacity="0.82">A hands-on museum where children build worlds,</text>
	<text x="98" y="620" font-family="'Trebuchet MS',sans-serif" font-size="30" fill="#12233a" opacity="0.82">chase questions, and make magnificent messes.</text>

	<!-- pill button -->
	<g transform="translate(98 680)">
		<rect width="330" height="76" rx="38" fill="#ff6b6b" />
		<text x="165" y="50" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="30" font-weight="800" fill="#ffffff">Plan your visit</text>
	</g>
	<g transform="translate(448 680)">
		<rect width="360" height="76" rx="38" fill="none" stroke="#12233a" stroke-width="4" />
		<text x="180" y="50" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="28" font-weight="800" fill="#12233a">Today's activities</text>
	</g>

	<!-- the tiny giant motif -->
	<g transform="translate(880 400)">
		<ellipse cx="80" cy="360" rx="120" ry="20" fill="#12233a" opacity="0.12" />
		<rect x="-30" y="140" width="42" height="92" rx="20" fill="#ff6b6b" />
		<rect x="150" y="140" width="42" height="92" rx="20" fill="#ff6b6b" />
		<rect x="8" y="120" width="150" height="180" rx="46" fill="#ff6b6b" />
		<rect x="24" y="270" width="42" height="48" rx="16" fill="#12233a" />
		<rect x="100" y="270" width="42" height="48" rx="16" fill="#12233a" />
		<circle cx="82" cy="60" r="80" fill="#ffcf3f" />
		<circle cx="56" cy="52" r="10" fill="#12233a" />
		<circle cx="108" cy="52" r="10" fill="#12233a" />
		<path d="M50 84 q32 30 64 0" fill="none" stroke="#12233a" stroke-width="9" stroke-linecap="round" />
		<circle cx="30" cy="72" r="12" fill="#ff9fb2" opacity="0.85" />
		<circle cx="134" cy="72" r="12" fill="#ff9fb2" opacity="0.85" />
	</g>
</svg>
