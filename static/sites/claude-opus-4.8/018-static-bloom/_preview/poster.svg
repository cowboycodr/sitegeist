<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Static Bloom — beautiful noise, carefully released">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#140b1f"/>
			<stop offset="1" stop-color="#090610"/>
		</linearGradient>
		<radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#f2b8ff" stop-opacity="0.5"/>
			<stop offset="1" stop-color="#f2b8ff" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#54e6c8" stop-opacity="0.4"/>
			<stop offset="1" stop-color="#54e6c8" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#f2b8ff"/>
			<stop offset="0.33" stop-color="#7aa8ff"/>
			<stop offset="0.66" stop-color="#54e6c8"/>
			<stop offset="1" stop-color="#ffcf6b"/>
		</linearGradient>
		<linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f2b8ff"/>
			<stop offset="1" stop-color="#7aa8ff"/>
		</linearGradient>
		<radialGradient id="grooves" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#1a1226"/>
			<stop offset="1" stop-color="#0c0812"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<circle cx="990" cy="180" r="420" fill="url(#glowRose)"/>
	<circle cx="120" cy="820" r="380" fill="url(#glowMint)"/>

	<!-- record motif -->
	<g transform="translate(860 470)">
		<circle r="300" fill="url(#grooves)" stroke="#f2b8ff" stroke-opacity="0.14"/>
		<g fill="none" stroke="#241a30" stroke-width="2">
			<circle r="270"/><circle r="240"/><circle r="210"/><circle r="180"/><circle r="150"/><circle r="120"/>
		</g>
		<circle r="285" fill="none" stroke="url(#spectrum)" stroke-width="6" stroke-opacity="0.55"/>
		<circle r="90" fill="url(#label)"/>
		<circle r="90" fill="none" stroke="#0b0710" stroke-opacity="0.5" stroke-width="10"/>
		<text x="0" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#180a1e">SB</text>
		<circle r="8" fill="#0b0710"/>
	</g>

	<!-- brand mark -->
	<g transform="translate(96 118)">
		<circle cx="26" cy="0" r="26" fill="none" stroke="url(#spectrum)" stroke-width="6"/>
		<circle cx="26" cy="0" r="7" fill="#54e6c8"/>
	</g>
	<text x="160" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f4ecff" letter-spacing="0.5">Static<tspan fill="#f2b8ff">Bloom</tspan></text>

	<!-- headline -->
	<text x="96" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="#f4ecff" letter-spacing="-3">Beautiful</text>
	<text x="96" y="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="#f2b8ff" letter-spacing="-3">noise.</text>

	<text x="99" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#54e6c8" letter-spacing="10">RECORDS · EDITIONS · NOISE</text>

	<text x="98" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#b7a7cf">Carefully released — a fiercely independent label</text>
	<text x="98" y="638" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#b7a7cf">of chromatic records &amp; limited vinyl.</text>

	<!-- spectrum bar -->
	<rect x="98" y="716" width="560" height="8" rx="4" fill="url(#spectrum)"/>

	<!-- footer chips -->
	<g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
		<rect x="98" y="770" width="196" height="56" rx="28" fill="#f4ecff"/>
		<text x="196" y="806" text-anchor="middle" fill="#170a1d">Hear the latest</text>
		<rect x="312" y="770" width="220" height="56" rx="28" fill="none" stroke="#f2b8ff" stroke-opacity="0.4"/>
		<text x="422" y="806" text-anchor="middle" fill="#f4ecff">Visit the archive</text>
	</g>
</svg>
