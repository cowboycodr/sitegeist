<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Afterlight Arcade — One more run before sunrise.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160a33"/>
      <stop offset="0.55" stop-color="#0a0618"/>
      <stop offset="1" stop-color="#05030f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.35" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24e0ff"/>
      <stop offset="0.55" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- sunrise disc with scan bands -->
  <g>
    <circle cx="600" cy="430" r="205" fill="url(#sun)"/>
    <g fill="#05030f" opacity="0.85">
      <rect x="380" y="470" width="440" height="12"/>
      <rect x="380" y="500" width="440" height="16"/>
      <rect x="380" y="536" width="440" height="22"/>
      <rect x="380" y="578" width="440" height="30"/>
    </g>
  </g>

  <!-- neon perspective grid floor -->
  <g stroke="#24e0ff" stroke-width="2" opacity="0.55">
    <line x1="600" y1="640" x2="-260" y2="900"/>
    <line x1="600" y1="640" x2="140" y2="900"/>
    <line x1="600" y1="640" x2="380" y2="900"/>
    <line x1="600" y1="640" x2="600" y2="900"/>
    <line x1="600" y1="640" x2="820" y2="900"/>
    <line x1="600" y1="640" x2="1060" y2="900"/>
    <line x1="600" y1="640" x2="1460" y2="900"/>
  </g>
  <g stroke="#ff2e97" stroke-width="2" opacity="0.5">
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="756" x2="1200" y2="756"/>
    <line x1="0" y1="828" x2="1200" y2="828"/>
  </g>

  <!-- glider motif -->
  <g transform="translate(600 636)">
    <path d="M0 -34 L26 30 L0 14 L-26 30 Z" fill="url(#ink)"/>
    <path d="M0 -34 L26 30 L0 14 L-26 30 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- marquee frame -->
  <rect x="120" y="96" width="960" height="150" rx="24" fill="none" stroke="url(#ink)" stroke-width="3" opacity="0.8"/>

  <!-- brand mark -->
  <g transform="translate(168 138)">
    <rect x="0" y="0" width="66" height="66" rx="16" fill="none" stroke="url(#ink)" stroke-width="5"/>
    <circle cx="33" cy="33" r="10" fill="url(#ink)"/>
    <path d="M33 8v11M33 47v11M8 33h11M47 33h11" stroke="url(#ink)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="266" y="158" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="34" letter-spacing="7" fill="#24e0ff" font-weight="700">INDEPENDENT GAMES UNIVERSE</text>
  <text x="264" y="222" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="72" fill="#ffffff" font-weight="800">Afterlight <tspan fill="#ff2e97">Arcade</tspan></text>

  <!-- tagline -->
  <text x="600" y="784" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="46" fill="#eef0ff" font-weight="700">One more run before sunrise.</text>

  <!-- press start chip -->
  <g transform="translate(600 830)">
    <rect x="-150" y="0" width="300" height="52" rx="26" fill="none" stroke="url(#ink)" stroke-width="3"/>
    <text x="0" y="35" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="26" letter-spacing="5" fill="#ffb84d" font-weight="700">PRESS START</text>
  </g>
</svg>
