<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Relic — Objects worth keeping. A curated vintage marketplace.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ecd9"/>
      <stop offset="1" stop-color="#e9d8ba"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5673c"/>
      <stop offset="1" stop-color="#8a3f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b1852f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b1852f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="900" fill="url(#glow)"/>
  <rect x="34" y="34" width="1132" height="832" fill="none" stroke="#8a3f22" stroke-width="2" opacity="0.55"/>
  <rect x="46" y="46" width="1108" height="808" fill="none" stroke="#b1852f" stroke-width="1" opacity="0.5"/>

  <!-- Relic mark -->
  <g transform="translate(150 132)" fill="none" stroke="#8a3f22">
    <circle cx="0" cy="0" r="46" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" stroke-width="3"/>
    <path d="M0 -46 V46 M-46 0 H46" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="8" fill="#8a3f22" stroke="none"/>
  </g>
  <text x="212" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="10" fill="#2a231c">EST. 1890 · CURATED</text>

  <!-- Wordmark -->
  <text x="150" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="290" font-weight="700" letter-spacing="4" fill="#2a231c">Relic</text>

  <!-- Tagline -->
  <text x="156" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" fill="#a8532e">Objects worth keeping.</text>

  <!-- Description -->
  <text x="158" y="612" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5c5347">Enduring furniture, rare design, and beautifully</text>
  <text x="158" y="654" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5c5347">weathered everyday things — vetted and dated.</text>

  <!-- Category pill -->
  <rect x="158" y="712" width="392" height="66" rx="33" fill="#2a231c"/>
  <text x="354" y="755" font-family="Helvetica, Arial, sans-serif" font-size="27" letter-spacing="4" fill="#f3ead9" text-anchor="middle">VINTAGE MARKETPLACE</text>

  <!-- Armchair motif -->
  <g transform="translate(858 402) scale(2.1)">
    <ellipse cx="60" cy="106" rx="46" ry="7" fill="#000" opacity="0.1"/>
    <path d="M30 54q-8 2-8 20v22q0 6 7 6t7-6V72q3-12-6-18z" fill="url(#chair)"/>
    <path d="M90 54q8 2 8 20v22q0 6-7 6t-7-6V72q-3-12 6-18z" fill="url(#chair)"/>
    <path d="M32 44q0-28 28-28t28 28v14q0 8-7 8H39q-7 0-7-8z" fill="url(#chair)"/>
    <rect x="36" y="66" width="48" height="24" rx="7" fill="#9c4d2b"/>
    <path d="M38 90v18M82 90v18" stroke="#5a2e19" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 34q20-9 40 0" fill="none" stroke="#e7cfa6" stroke-width="1.5" opacity="0.55"/>
  </g>

  <circle cx="1006" cy="196" r="52" fill="none" stroke="#b1852f" stroke-width="3" opacity="0.7"/>
  <circle cx="1006" cy="196" r="34" fill="none" stroke="#b1852f" stroke-width="3" opacity="0.5"/>
</svg>
