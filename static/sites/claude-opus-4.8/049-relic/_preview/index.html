<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Relic — Gallery poster</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a231c; padding: 24px; }
    figure { margin: 0; width: min(960px, 100%); }
    img { width: 100%; height: auto; display: block; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    figcaption { color: #d7ccb9; font-family: Georgia, serif; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Relic gallery poster — Objects worth keeping." />
    <figcaption>Relic · Vintage Marketplace poster (4:3)</figcaption>
  </figure>
</body>
</html>
