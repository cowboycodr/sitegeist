<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Monolith Security — Nothing gets through.">
	<defs>
		<radialGradient id="bg" cx="72%" cy="8%" r="90%">
			<stop offset="0%" stop-color="#0d1a20" />
			<stop offset="45%" stop-color="#080d12" />
			<stop offset="100%" stop-color="#05070a" />
		</radialGradient>
		<linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#0f1a24" />
			<stop offset="50%" stop-color="#1c2f40" />
			<stop offset="100%" stop-color="#0c151d" />
		</linearGradient>
		<linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#2fa8ff" stop-opacity="0.10" />
			<stop offset="50%" stop-color="#3fe7c6" stop-opacity="0.34" />
			<stop offset="100%" stop-color="#2fa8ff" stop-opacity="0.10" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#2fa8ff" />
			<stop offset="100%" stop-color="#3fe7c6" />
		</linearGradient>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b" />
			<feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
		</filter>
		<clipPath id="slabClip"><rect x="470" y="250" width="180" height="420" rx="10" /></clipPath>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)" />

	<!-- faint grid -->
	<g stroke="#12202b" stroke-width="1" opacity="0.55">
		<line x1="0" y1="150" x2="1200" y2="150" />
		<line x1="0" y1="450" x2="1200" y2="450" />
		<line x1="0" y1="750" x2="1200" y2="750" />
	</g>

	<!-- shield rings, centered on the slab -->
	<g transform="translate(560,460)" fill="none">
		<circle r="250" stroke="#3fe7c6" stroke-opacity="0.10" stroke-width="1.5" />
		<circle r="216" stroke="#3fe7c6" stroke-opacity="0.07" stroke-width="1.5" />
		<circle r="182" stroke="#3fe7c6" stroke-opacity="0.05" stroke-width="1.5" />
		<path d="M 250 0 A 250 250 0 0 1 155 195" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
		<path d="M -250 0 A 250 250 0 0 1 -155 -195" stroke="#3fe7c6" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
	</g>

	<!-- deflected threats -->
	<g>
		<circle cx="835" cy="300" r="5" fill="#ffb454" opacity="0.9" />
		<circle cx="880" cy="470" r="4" fill="#ffb454" opacity="0.7" />
		<circle cx="820" cy="620" r="5" fill="#ffb454" opacity="0.8" />
		<circle cx="300" cy="360" r="4" fill="#ffb454" opacity="0.7" />
		<circle cx="335" cy="560" r="5" fill="#ffb454" opacity="0.85" />
		<circle cx="415" cy="705" r="4" fill="#3fe7c6" opacity="0.8" />
		<circle cx="700" cy="710" r="4" fill="#3fe7c6" opacity="0.7" />
	</g>

	<!-- the monolith -->
	<g filter="url(#glow)">
		<rect x="470" y="250" width="180" height="420" rx="10" fill="url(#slab)" stroke="#3fe7c6" stroke-opacity="0.6" stroke-width="2" />
	</g>
	<g clip-path="url(#slabClip)">
		<rect x="470" y="250" width="180" height="420" fill="url(#core)" />
		<g stroke="#3fe7c6" stroke-opacity="0.16" stroke-width="1.4">
			<line x1="486" y1="296" x2="634" y2="296" />
			<line x1="486" y1="342" x2="634" y2="342" />
			<line x1="486" y1="388" x2="634" y2="388" />
			<line x1="486" y1="434" x2="634" y2="434" />
			<line x1="486" y1="480" x2="634" y2="480" />
			<line x1="486" y1="526" x2="634" y2="526" />
			<line x1="486" y1="572" x2="634" y2="572" />
			<line x1="486" y1="618" x2="634" y2="618" />
		</g>
		<rect x="470" y="452" width="180" height="4" fill="#eafffb" opacity="0.9" />
	</g>

	<!-- wordmark glyph, top left -->
	<g transform="translate(96,86)">
		<rect x="0" y="0" width="46" height="46" rx="11" fill="#0d131a" stroke="#1b2733" stroke-width="1.5" />
		<rect x="16" y="7" width="14" height="32" rx="2" fill="#142230" stroke="#3fe7c6" stroke-width="1.4" />
		<rect x="20" y="13" width="6" height="20" rx="1.5" fill="#3fe7c6" />
	</g>
	<text x="158" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.5" fill="#e8eef4">Monolith<tspan fill="#3fe7c6"> Security</tspan></text>

	<!-- eyebrow -->
	<g transform="translate(96,300)">
		<circle cx="8" cy="-6" r="6" fill="#3fe7c6" />
		<text x="26" y="0" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="21" letter-spacing="4" fill="#3fe7c6">ZERO-TRUST INFRASTRUCTURE</text>
	</g>

	<!-- headline -->
	<text x="92" y="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" fill="#e8eef4">Nothing</text>
	<text x="92" y="548" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" fill="#e8eef4">gets <tspan fill="#3fe7c6">through.</tspan></text>

	<!-- supporting line -->
	<text x="96" y="626" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#90a2b4">Adaptive infrastructure protecting critical systems</text>
	<text x="96" y="662" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#90a2b4">without slowing the people who run them.</text>

	<!-- footer strip -->
	<g transform="translate(96,806)" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="20" fill="#64788b">
		<text x="0" y="0" fill="#3fe7c6">Cybersecurity</text>
		<text x="200" y="0">SOC 2 · ISO 27001 · FedRAMP-ready</text>
	</g>
	<text x="1104" y="806" text-anchor="end" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="20" fill="#3fe7c6">Perimeter online · 0 breaches</text>
</svg>
