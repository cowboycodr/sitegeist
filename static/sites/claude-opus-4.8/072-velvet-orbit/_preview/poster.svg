<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Velvet Orbit — Dress for another gravity.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160d2a" />
      <stop offset="0.55" stop-color="#0a0712" />
      <stop offset="1" stop-color="#060410" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dd6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#7c4dd6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#a9b4c6" />
      <stop offset="1" stop-color="#7c4dd6" />
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#a9b4c6" />
      <stop offset="1" stop-color="#4a2c8f" />
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6" />
      <stop offset="1" stop-color="#7c4dd6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <ellipse cx="820" cy="430" rx="520" ry="430" fill="url(#glow)" />

  <!-- Orbit motif -->
  <g transform="translate(820 430)" fill="none" stroke-linecap="round">
    <ellipse rx="330" ry="330" stroke="#c8b9f0" stroke-opacity="0.30" stroke-width="2" />
    <ellipse rx="240" ry="240" stroke="#c8b9f0" stroke-opacity="0.22" stroke-width="2" />
    <ellipse rx="150" ry="150" stroke="#c8b9f0" stroke-opacity="0.16" stroke-width="2" />
    <circle r="66" fill="url(#core)" stroke="none" />
    <circle cx="0" cy="-330" r="18" fill="url(#body)" stroke="none" />
    <circle cx="208" cy="120" r="13" fill="url(#body)" stroke="none" />
    <circle cx="-115" cy="97" r="10" fill="url(#body)" stroke="none" />
  </g>

  <!-- Brand mark -->
  <g transform="translate(96 96)">
    <ellipse cx="18" cy="18" rx="26" ry="11" fill="none" stroke="url(#metal)" stroke-width="2.4" />
    <circle cx="18" cy="18" r="7" fill="url(#metal)" />
    <text x="66" y="26" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="30" fill="#f2ecff" letter-spacing="1">Velvet Orbit</text>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="470" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="8" fill="#7d729c">COLLECTION 04 / APHELION</text>

  <!-- Headline -->
  <text x="92" y="560" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="96" fill="#f2ecff">Dress for</text>
  <text x="92" y="660" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="96" fill="url(#metal)">another gravity.</text>

  <!-- Sub copy -->
  <text x="96" y="726" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" fill="#b3a8cf">Sculptural tailoring in liquid metallic textiles.</text>

  <!-- CTA pill -->
  <g transform="translate(96 774)">
    <rect width="286" height="58" rx="29" fill="url(#metal)" />
    <text x="143" y="38" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#180f2c" font-weight="600">ENTER COLLECTION</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="899" fill="none" stroke="#7c4dd6" stroke-opacity="0.25" stroke-width="1" />
</svg>
