<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Paper Moon — Gallery poster</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #141026; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .card { width: min(100%, 720px); aspect-ratio: 4 / 3; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); border-radius: 12px; overflow: hidden; }
  img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <figure class="card" style="margin:0">
    <img src="poster.svg" alt="Paper Moon gallery poster: a glowing paper moon over a midnight sky with the cinema's name in italic serif.">
  </figure>
</body>
</html>
