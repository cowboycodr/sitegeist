<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Paper Moon — independent cinema poster">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0919"/>
      <stop offset="0.55" stop-color="#141026"/>
      <stop offset="1" stop-color="#1d1838"/>
    </linearGradient>
    <radialGradient id="moonBody" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.55" stop-color="#f4d58d"/>
      <stop offset="1" stop-color="#e6b64c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4d58d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#f4d58d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f4d58d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d98a7a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d98a7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#rose)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="130" r="2.4" opacity="0.9"/>
    <circle cx="300" cy="90" r="1.6" opacity="0.6"/>
    <circle cx="230" cy="230" r="1.8" opacity="0.7"/>
    <circle cx="70" cy="330" r="1.5" opacity="0.6"/>
    <circle cx="520" cy="120" r="1.7" opacity="0.7"/>
    <circle cx="1090" cy="620" r="2.2" opacity="0.8"/>
    <circle cx="1140" cy="470" r="1.5" opacity="0.6"/>
    <circle cx="180" cy="640" r="1.8" opacity="0.7"/>
    <circle cx="90" cy="760" r="2" opacity="0.7"/>
    <circle cx="420" cy="800" r="1.5" opacity="0.5"/>
    <circle cx="640" cy="70" r="1.6" opacity="0.6"/>
  </g>

  <!-- moon -->
  <g>
    <circle cx="870" cy="300" r="330" fill="url(#glow)"/>
    <circle cx="870" cy="300" r="185" fill="url(#moonBody)"/>
    <circle cx="838" cy="266" r="40" fill="#c88f28" opacity="0.28"/>
    <circle cx="930" cy="330" r="26" fill="#c88f28" opacity="0.24"/>
    <circle cx="900" cy="248" r="18" fill="#c88f28" opacity="0.22"/>
    <circle cx="840" cy="352" r="14" fill="#c88f28" opacity="0.2"/>
  </g>

  <!-- title -->
  <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">
    <text x="90" y="565" font-size="46" letter-spacing="10" fill="#f4d58d" font-weight="700">TONIGHT AT</text>
    <text x="86" y="700" font-size="176" font-style="italic" font-weight="700" fill="#f4efe4">Paper</text>
    <text x="86" y="840" font-size="176" font-style="italic" font-weight="700" fill="#f4efe4">Moon</text>
  </g>

  <!-- tagline + rule -->
  <line x1="640" y1="770" x2="1110" y2="770" stroke="#f4d58d" stroke-opacity="0.35" stroke-width="1.5"/>
  <g font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" fill="#b7afc9">
    <text x="640" y="748" font-size="34" font-style="italic" fill="#f4efe4">Films that linger.</text>
    <text x="640" y="812" font-size="24" letter-spacing="3">INDEPENDENT REPERTORY CINEMA</text>
    <text x="640" y="850" font-size="22" fill="#b7afc9">Classics · Midnight oddities · New voices</text>
  </g>
</svg>
