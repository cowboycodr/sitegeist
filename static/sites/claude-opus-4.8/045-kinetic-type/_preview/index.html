<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Kinetic Type — gallery poster</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0e; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  figure { margin: 0; width: min(100%, 900px); }
  img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  figcaption {
    color: #b8b4a9;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    text-align: center;
    margin-top: 14px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<figure>
  <img src="poster.svg" alt="Kinetic Type gallery poster: bold wordmark on ink with an acid-green accent">
  <figcaption>Kinetic Type — gallery poster (4:3)</figcaption>
</figure>
</body>
</html>
