<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Kinetic Type — an independent type foundry poster">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="900" rx="0"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141418"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#fade)"/>

    <!-- Kinetic motif: echoed, skewing letterforms behind the wordmark -->
    <g font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="360" letter-spacing="-16">
      <text x="120" y="470" fill="#17170c" transform="skewX(-14)">Kt</text>
      <text x="150" y="470" fill="#2a2a12" transform="skewX(-9)">Kt</text>
      <text x="180" y="470" fill="#3f3f18" transform="skewX(-4)">Kt</text>
    </g>

    <!-- Accent bar -->
    <rect x="0" y="150" width="1200" height="4" fill="#d8ff3a" opacity="0.35"/>

    <!-- Eyebrow -->
    <text x="120" y="120" fill="#d8ff3a" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="14">INDEPENDENT TYPE FOUNDRY</text>

    <!-- Wordmark -->
    <g font-family="Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-8">
      <text x="116" y="470" fill="#f3efe6" font-size="230">Kinetic</text>
      <text x="116" y="690" fill="#f3efe6" font-size="230">Type<tspan fill="#d8ff3a">.</tspan></text>
    </g>

    <!-- Italic serif accent word, the "moving" letter -->
    <text x="700" y="470" fill="#ff5b34" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="150" transform="rotate(-6 780 430)">move</text>

    <!-- Tagline -->
    <text x="120" y="775" fill="#b8b4a9" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="40">Letters made to move.</text>

    <!-- Specimen ribbon -->
    <text x="120" y="835" fill="#7c7a72" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" letter-spacing="4">Display · Grotesk · Serif · Mono · Variable</text>

    <!-- Brand mark tile -->
    <g transform="translate(1000, 60)">
      <rect width="120" height="120" rx="26" fill="#d8ff3a"/>
      <text x="42" y="86" fill="#0c0c0e" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="88">K</text>
      <text x="72" y="70" fill="#0c0c0e" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="64">t</text>
    </g>

    <!-- Border -->
    <rect x="4" y="4" width="1192" height="892" fill="none" stroke="#d8ff3a" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
