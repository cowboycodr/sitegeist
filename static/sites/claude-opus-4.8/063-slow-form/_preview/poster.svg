<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Slow Form — made at the speed of care">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#eaddc4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9822f"/>
      <stop offset="1" stop-color="#7c4f1c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect x="34" y="34" width="1132" height="832" fill="none" stroke="#cbb995" stroke-width="2"/>

  <!-- growth rings motif -->
  <g fill="none" stroke="#7c4f1c" transform="translate(905 250)">
    <circle r="18" stroke-width="3" opacity=".9"/>
    <circle r="42" stroke-width="3" opacity=".78"/>
    <circle cx="3" cy="-2" r="68" stroke-width="3" opacity=".64"/>
    <circle cx="-2" cy="3" r="96" stroke-width="3" opacity=".5"/>
    <circle cx="2" cy="-2" r="126" stroke-width="3" opacity=".36"/>
    <circle r="158" stroke-width="3" opacity=".24"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="150" font-family="Avenir Next, Segoe UI, sans-serif" font-size="30" letter-spacing="10" fill="#7c4f1c">FURNITURE FOR KEEPING</text>

  <!-- wordmark / headline -->
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#2a2118">
    <text x="76" y="360" font-size="150" font-weight="600" letter-spacing="-2">Slow Form</text>
    <text x="80" y="470" font-size="72" font-style="italic" fill="#7c4f1c">Made at the speed of care.</text>
  </g>

  <!-- tagline / description -->
  <text x="80" y="560" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="34" fill="#5c4f3d">Numbered furniture shaped from local timber,</text>
  <text x="80" y="606" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="34" fill="#5c4f3d">designed to gather character over decades.</text>

  <!-- furniture silhouette: a bench -->
  <g transform="translate(80 660)">
    <rect x="0" y="0" width="520" height="34" rx="10" fill="url(#wood)"/>
    <rect x="40" y="34" width="26" height="150" rx="6" fill="#7c4f1c"/>
    <rect x="454" y="34" width="26" height="150" rx="6" fill="#7c4f1c"/>
    <path d="M66 96 H454" stroke="#7c4f1c" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- numbered tag -->
  <g transform="translate(720 720)">
    <circle r="86" fill="none" stroke="#2a2118" stroke-width="2.5"/>
    <text x="0" y="-14" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" letter-spacing="6" fill="#5c4f3d">NO.</text>
    <text x="0" y="46" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="76" font-weight="600" fill="#7c4f1c">07</text>
  </g>

  <text x="80" y="828" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" letter-spacing="6" fill="#5c4f3d">LOCAL TIMBER · BY APPOINTMENT · MADE TO LAST</text>
</svg>
