<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
	<title>Transit 2050 — Gallery poster</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070d1a; padding: 24px; }
		figure { margin: 0; max-width: 960px; width: 100%; }
		img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8); }
		figcaption { color: #9db0d0; font-family: 'Segoe UI', system-ui, Arial, sans-serif; text-align: center; margin-top: 14px; font-size: 0.9rem; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Transit 2050 gallery poster: a stylized transit network over the tagline The city moves when everyone can." width="1200" height="900" />
		<figcaption>Transit 2050 — gallery poster (4:3), authoring wrapper only.</figcaption>
	</figure>
</body>
</html>
