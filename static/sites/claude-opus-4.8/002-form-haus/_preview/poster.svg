<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Form Haus — Space, reduced to its essence.">
	<defs>
		<linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#d4cec2"/>
			<stop offset="1" stop-color="#e3ded5"/>
		</linearGradient>
		<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbf7ef" stop-opacity="0.95"/>
			<stop offset="1" stop-color="#fbf7ef" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="#ece8e1"/>

	<!-- top rule + eyebrow -->
	<line x1="90" y1="120" x2="1110" y2="120" stroke="#c7c1b5" stroke-width="1.5"/>
	<text x="90" y="105" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#b5522f">ARCHITECTURE · COPENHAGEN</text>

	<!-- brand mark -->
	<g transform="translate(1010,60)">
		<rect x="0" y="0" width="46" height="46" fill="none" stroke="#1a1917" stroke-width="2.4"/>
		<rect x="15" y="15" width="16" height="16" fill="#b5522f"/>
	</g>

	<!-- aperture motif -->
	<g transform="translate(760,210)">
		<rect x="0" y="0" width="350" height="470" fill="url(#concrete)" stroke="#c7c1b5" stroke-width="1.5"/>
		<polygon points="52,52 175,52 175,418 52,418" fill="url(#beam)"/>
		<rect x="52" y="52" width="246" height="366" fill="none" stroke="#1a1917" stroke-width="3.5"/>
		<rect x="52" y="52" width="123" height="366" fill="#f6f2ea" fill-opacity="0.55"/>
	</g>

	<!-- title -->
	<text x="90" y="345" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="150" fill="#1a1917">Form</text>
	<text x="90" y="480" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="150" fill="#1a1917">Haus</text>

	<!-- tagline -->
	<text x="94" y="565" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="42" font-style="italic" fill="#4a473f">Space, reduced to its essence.</text>

	<!-- description -->
	<text x="94" y="640" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#4a473f">A Copenhagen practice creating monumental spaces</text>
	<text x="94" y="674" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#4a473f">with a disciplined, deeply human point of view.</text>

	<!-- bottom rule + facts -->
	<line x1="90" y1="775" x2="1110" y2="775" stroke="#c7c1b5" stroke-width="1.5"/>
	<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1a1917">
		<text x="90" y="825" font-size="20" font-weight="700" letter-spacing="4" fill="#4a473f">FOUNDED</text>
		<text x="90" y="862" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38">2009</text>
		<text x="430" y="825" font-size="20" font-weight="700" letter-spacing="4" fill="#4a473f">PRACTICE</text>
		<text x="430" y="862" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38">Copenhagen</text>
		<text x="850" y="825" font-size="20" font-weight="700" letter-spacing="4" fill="#4a473f">COMPLETED</text>
		<text x="850" y="862" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="38">48 works</text>
	</g>
</svg>
