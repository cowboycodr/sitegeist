<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Wild Culture — Good things take time. A Brooklyn fermentation studio.">
	<defs>
		<radialGradient id="glowGold" cx="82%" cy="8%" r="70%">
			<stop offset="0%" stop-color="#e6a93b" stop-opacity="0.4"/>
			<stop offset="60%" stop-color="#e6a93b" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowOlive" cx="-5%" cy="105%" r="65%">
			<stop offset="0%" stop-color="#5b7a3f" stop-opacity="0.35"/>
			<stop offset="60%" stop-color="#5b7a3f" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="brineGrad" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#d9c98f"/>
			<stop offset="100%" stop-color="#cbb877"/>
		</linearGradient>
		<clipPath id="jarClip">
			<rect x="812" y="286" width="248" height="360" rx="26"/>
		</clipPath>
	</defs>

	<rect width="1200" height="900" fill="#f4ecdc"/>
	<rect width="1200" height="900" fill="url(#glowGold)"/>
	<rect width="1200" height="900" fill="url(#glowOlive)"/>

	<!-- Jar motif -->
	<g>
		<rect x="856" y="252" width="160" height="30" rx="12" fill="#c0653f"/>
		<rect x="812" y="286" width="248" height="360" rx="26" fill="#fbf6ea" fill-opacity="0.6" stroke="#5b7a3f" stroke-opacity="0.4" stroke-width="6"/>
		<g clip-path="url(#jarClip)">
			<rect x="812" y="430" width="248" height="216" fill="url(#brineGrad)"/>
			<circle cx="880" cy="560" r="16" fill="#e6a93b" fill-opacity="0.75"/>
			<circle cx="945" cy="500" r="11" fill="#e6a93b" fill-opacity="0.7"/>
			<circle cx="990" cy="580" r="20" fill="#e6a93b" fill-opacity="0.7"/>
			<circle cx="905" cy="470" r="8" fill="#e6a93b" fill-opacity="0.8"/>
			<circle cx="960" cy="430" r="13" fill="#e6a93b" fill-opacity="0.6"/>
			<circle cx="855" cy="500" r="9" fill="#e6a93b" fill-opacity="0.7"/>
		</g>
	</g>

	<!-- Brand mark -->
	<g>
		<rect x="90" y="96" width="66" height="66" rx="18" fill="#5b7a3f"/>
		<circle cx="112" cy="130" r="9" fill="#f2c14e"/>
		<circle cx="132" cy="120" r="12" fill="#f2c14e"/>
		<circle cx="128" cy="144" r="6" fill="#f2c14e"/>
		<text x="176" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#2c2a22">Wild Culture</text>
	</g>

	<!-- Eyebrow -->
	<text x="92" y="330" font-family="Georgia, serif" font-size="26" letter-spacing="6" font-weight="700" fill="#c0653f">FERMENTED IN BROOKLYN</text>

	<!-- Headline -->
	<text x="88" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="130" font-weight="700" fill="#2c2a22" letter-spacing="-2">Good things</text>
	<text x="88" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="130" font-weight="700" fill="#3f5a2b" letter-spacing="-2">take time.</text>

	<!-- Sub -->
	<text x="92" y="686" font-family="Georgia, serif" font-size="30" fill="#4a473b">Live cultures · seasonal pantry · hands-on workshops.</text>

	<!-- Pill -->
	<rect x="92" y="734" width="300" height="72" rx="36" fill="#3f5a2b"/>
	<text x="242" y="780" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#f4ecdc" text-anchor="middle">Open the pantry</text>

	<rect x="416" y="734" width="290" height="72" rx="36" fill="none" stroke="#3f5a2b" stroke-width="3"/>
	<text x="561" y="780" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#3f5a2b" text-anchor="middle">Book a workshop</text>
</svg>
