<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Vanta Audio — Series One reference headphones. Hear the space between.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#16131e" />
      <stop offset="55%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2731" />
      <stop offset="0.55" stop-color="#121116" />
      <stop offset="1" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="driver" cx="42%" cy="40%" r="75%">
      <stop offset="0" stop-color="#e6ac6c" />
      <stop offset="0.35" stop-color="#8a5b34" />
      <stop offset="1" stop-color="#0a0a0d" />
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2a768" />
      <stop offset="1" stop-color="#b7743c" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="24" y="24" width="1152" height="852" rx="20" fill="none" stroke="#23222a" stroke-width="1.5" />

  <!-- concentric acoustic rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="600" cy="392" r="300" stroke="rgba(111,107,208,0.12)" stroke-width="1.5" />
    <circle cx="600" cy="392" r="238" stroke="rgba(215,151,90,0.16)" stroke-width="1.5" />
    <circle cx="600" cy="392" r="176" stroke="rgba(215,151,90,0.24)" stroke-width="1.5" />
  </g>

  <!-- headphones -->
  <g transform="translate(600 392)">
    <path d="M -210 20 A 210 210 0 0 1 210 20" fill="none" stroke="#33313a" stroke-width="26" stroke-linecap="round" />
    <path d="M -210 20 A 210 210 0 0 1 210 20" fill="none" stroke="#6a4a2c" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <g>
      <rect x="-243" y="4" width="102" height="196" rx="46" fill="url(#cup)" stroke="#3a3742" stroke-width="3" />
      <circle cx="-192" cy="102" r="36" fill="url(#driver)" />
      <circle cx="-192" cy="102" r="36" fill="none" stroke="#e2a768" stroke-width="2" opacity="0.5" />
    </g>
    <g>
      <rect x="141" y="4" width="102" height="196" rx="46" fill="url(#cup)" stroke="#3a3742" stroke-width="3" />
      <circle cx="192" cy="102" r="36" fill="url(#driver)" />
      <circle cx="192" cy="102" r="36" fill="none" stroke="#e2a768" stroke-width="2" opacity="0.5" />
    </g>
  </g>

  <!-- eyebrow -->
  <g text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif">
    <text x="600" y="712" fill="#e2a768" font-size="22" letter-spacing="9" font-weight="700">SERIES ONE</text>
  </g>

  <!-- title -->
  <text x="600" y="782" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#f3f0ec">
    Hear the <tspan font-style="italic" fill="#e2a768">space</tspan> between.
  </text>

  <!-- wordmark -->
  <g transform="translate(600 128)" text-anchor="middle">
    <circle cx="-116" cy="-8" r="12" fill="none" stroke="#e2a768" stroke-width="1.6" />
    <circle cx="-116" cy="-8" r="4" fill="#d7975a" />
    <text x="8" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="12" fill="#f3f0ec">VANTA <tspan font-weight="300" fill="#9a9aa6">AUDIO</tspan></text>
  </g>

  <!-- pill -->
  <g transform="translate(600 838)">
    <rect x="-108" y="-22" width="216" height="44" rx="22" fill="url(#amber)" />
    <text x="0" y="7" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#1a1206">Listen closer</text>
  </g>
</svg>
