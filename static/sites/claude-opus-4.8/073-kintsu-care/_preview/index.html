<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
	<title>Kintsu — Poster preview</title>
	<style>
		html, body { margin: 0; height: 100%; }
		body { display: grid; place-items: center; background: #2a2622; padding: 24px; }
		figure { margin: 0; width: min(1200px, 100%); }
		img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.7); }
		figcaption { color: #cdbfa5; font: 400 14px/1.5 system-ui, sans-serif; text-align: center; margin-top: 12px; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Kintsu gallery poster: a ceramic bowl mended with golden seams beside the tagline 'Care for the life between appointments.'">
		<figcaption>Kintsu — 4:3 gallery poster</figcaption>
	</figure>
</body>
</html>
