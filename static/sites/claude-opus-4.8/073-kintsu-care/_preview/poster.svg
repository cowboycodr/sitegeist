<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
	<title id="poster-title">Kintsu — Care for the life between appointments</title>
	<desc id="poster-desc">A calm poster showing a ceramic bowl mended with golden seams over a warm paper background.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f8f3e9"/>
			<stop offset="1" stop-color="#efe6d5"/>
		</linearGradient>
		<linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e9dfc9"/>
			<stop offset="1" stop-color="#d9c9a8"/>
		</linearGradient>
		<linearGradient id="seam" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#e6c47e"/>
			<stop offset="0.5" stop-color="#c69a4d"/>
			<stop offset="1" stop-color="#a67c2e"/>
		</linearGradient>
		<radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect x="28" y="28" width="1144" height="844" rx="34" fill="none" stroke="#e2d7c3" stroke-width="2"/>
	<ellipse cx="820" cy="470" rx="360" ry="360" fill="url(#halo)"/>

	<!-- Wordmark and text -->
	<g font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif">
		<g transform="translate(96,120)">
			<rect x="0" y="0" width="70" height="70" rx="20" fill="#6f8b7d"/>
			<path d="M35 12 V58 M35 24 L52 15 M35 36 L20 46 M35 45 L50 54" fill="none" stroke="#e6c47e" stroke-width="4.4" stroke-linecap="round"/>
			<circle cx="35" cy="35" r="4" fill="#f8f3e9"/>
			<text x="92" y="52" font-size="48" font-weight="600" fill="#2a2622" letter-spacing="0.5">Kintsu</text>
		</g>

		<text x="96" y="322" font-size="26" letter-spacing="6" fill="#a67c2e" font-weight="600">WHOLE-PERSON MENTAL CARE</text>
		<text x="94" y="412" font-size="82" font-weight="600" fill="#2a2622">Care for the life</text>
		<text x="94" y="502" font-size="82" font-weight="600" fill="#2a2622">between</text>
		<text x="94" y="592" font-size="82" font-weight="600" fill="#2a2622">appointments.</text>

		<text x="96" y="672" font-size="30" fill="#5c554d">Daily reflection, therapy, and practical</text>
		<text x="96" y="712" font-size="30" fill="#5c554d">tools — mended together in gold.</text>

		<g transform="translate(96,772)">
			<rect x="0" y="0" width="290" height="64" rx="32" fill="#c69a4d"/>
			<text x="145" y="42" font-size="27" font-weight="600" fill="#2c2413" text-anchor="middle">Begin a check-in</text>
		</g>
	</g>

	<!-- Mended bowl motif -->
	<g transform="translate(778,300)">
		<ellipse cx="150" cy="360" rx="185" ry="26" fill="#d3c4a6" opacity="0.7"/>
		<path d="M-6 120 Q150 6 306 120 Q282 330 150 372 Q18 330 -6 120 Z" fill="url(#bowl)" stroke="#cdbc98" stroke-width="4"/>
		<path d="M-6 120 Q150 176 306 120" fill="none" stroke="#cdbc98" stroke-width="4" opacity="0.65"/>
		<g fill="none" stroke="url(#seam)" stroke-linecap="round">
			<path d="M150 30 L144 122 L172 236 L158 366" stroke-width="7"/>
			<path d="M144 122 L66 154 L2 188" stroke-width="5.5"/>
			<path d="M172 236 L258 218 L300 176" stroke-width="5.5"/>
			<path d="M158 366 L104 322 L52 322" stroke-width="4.6"/>
			<path d="M144 122 L214 96 L262 78" stroke-width="4.6"/>
		</g>
		<g fill="#a67c2e">
			<circle cx="2" cy="188" r="6"/>
			<circle cx="300" cy="176" r="6"/>
			<circle cx="52" cy="322" r="5"/>
			<circle cx="262" cy="78" r="5"/>
		</g>
	</g>

	<text x="1104" y="836" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="24" fill="#8a7f70" text-anchor="end" font-style="italic">Mental Wellness</text>
</svg>
