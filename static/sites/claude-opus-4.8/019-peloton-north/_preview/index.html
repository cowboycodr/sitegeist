<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Peloton North — gallery poster</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080d18; padding: 24px; }
  figure { margin: 0; width: min(960px, 100%); }
  img { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
  figcaption { color: #6d80a4; font-family: Helvetica, Arial, sans-serif; font-size: 0.85rem; text-align: center; margin-top: 14px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<figure>
  <img src="poster.svg" alt="Peloton North gallery poster: an Oslo cycling collective, take the longer road." />
  <figcaption>Peloton North · gallery poster (1200 × 900)</figcaption>
</figure>
</body>
</html>
