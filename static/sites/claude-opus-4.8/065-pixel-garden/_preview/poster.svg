<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Pixel Garden — Small worlds. Strange rules.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a2e"/>
      <stop offset="0.55" stop-color="#141426"/>
      <stop offset="1" stop-color="#122019"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7bd88f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7bd88f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.88" cy="0" r="0.65">
      <stop offset="0" stop-color="#b28dff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b28dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#glowL)"/>
  <rect width="1200" height="900" fill="url(#glowR)"/>

  <!-- stars -->
  <g fill="#3a4d6b">
    <rect x="120" y="110" width="6" height="6"/><rect x="300" y="70" width="5" height="5"/>
    <rect x="520" y="130" width="6" height="6"/><rect x="760" y="90" width="5" height="5"/>
    <rect x="980" y="150" width="6" height="6"/><rect x="1080" y="80" width="5" height="5"/>
    <rect x="210" y="210" width="5" height="5"/><rect x="640" y="60" width="6" height="6"/>
  </g>
  <g fill="#8fa6d8">
    <rect x="180" y="60" width="6" height="6"/><rect x="880" y="120" width="6" height="6"/>
    <rect x="420" y="190" width="5" height="5"/><rect x="1020" y="220" width="5" height="5"/>
  </g>

  <!-- ground -->
  <rect x="0" y="690" width="1200" height="210" fill="#243a2a"/>
  <rect x="0" y="690" width="1200" height="12" fill="#31563a"/>
  <g fill="#3b6547">
    <rect x="60" y="720" width="6" height="6"/><rect x="180" y="740" width="6" height="6"/>
    <rect x="360" y="726" width="6" height="6"/><rect x="560" y="744" width="6" height="6"/>
    <rect x="760" y="722" width="6" height="6"/><rect x="960" y="742" width="6" height="6"/>
    <rect x="1100" y="726" width="6" height="6"/>
  </g>

  <!-- pixel plants (rects, 12px grid) -->
  <!-- plant A: pink bloom -->
  <g>
    <rect x="150" y="560" width="12" height="132" fill="#5bbf74"/>
    <rect x="126" y="608" width="24" height="12" fill="#7bd88f"/>
    <rect x="162" y="644" width="24" height="12" fill="#7bd88f"/>
    <rect x="132" y="512" width="48" height="48" fill="#ff8fb1"/>
    <rect x="144" y="524" width="24" height="24" fill="#ffd76e"/>
    <rect x="120" y="524" width="12" height="24" fill="#ff8fb1"/>
    <rect x="180" y="524" width="12" height="24" fill="#ff8fb1"/>
    <rect x="144" y="500" width="24" height="12" fill="#ff8fb1"/>
    <rect x="144" y="560" width="24" height="12" fill="#ff8fb1"/>
  </g>

  <!-- plant B: lilac bloom tall -->
  <g>
    <rect x="300" y="500" width="12" height="192" fill="#4aa9c4"/>
    <rect x="276" y="560" width="24" height="12" fill="#79cfe0"/>
    <rect x="312" y="600" width="24" height="12" fill="#79cfe0"/>
    <rect x="282" y="452" width="48" height="48" fill="#b28dff"/>
    <rect x="294" y="464" width="24" height="24" fill="#ffe08a"/>
    <rect x="270" y="464" width="12" height="24" fill="#b28dff"/>
    <rect x="330" y="464" width="12" height="24" fill="#b28dff"/>
    <rect x="294" y="440" width="24" height="12" fill="#b28dff"/>
  </g>

  <!-- plant C: right side, orange -->
  <g>
    <rect x="1010" y="540" width="12" height="152" fill="#c99a3f"/>
    <rect x="986" y="588" width="24" height="12" fill="#e8c463"/>
    <rect x="1022" y="620" width="24" height="12" fill="#e8c463"/>
    <rect x="992" y="492" width="48" height="48" fill="#ff9d6e"/>
    <rect x="1004" y="504" width="24" height="24" fill="#fff0b0"/>
    <rect x="980" y="504" width="12" height="24" fill="#ff9d6e"/>
    <rect x="1040" y="504" width="12" height="24" fill="#ff9d6e"/>
  </g>

  <!-- plant D: small sprout -->
  <g>
    <rect x="1110" y="620" width="12" height="72" fill="#5bbf74"/>
    <rect x="1086" y="632" width="24" height="12" fill="#7bd88f"/>
    <rect x="1122" y="632" width="24" height="12" fill="#7bd88f"/>
    <rect x="1098" y="596" width="36" height="24" fill="#ffd76e"/>
  </g>

  <!-- seed mark -->
  <g transform="translate(150,128)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#20233a" stroke="#b28dff" stroke-opacity="0.4" stroke-width="3"/>
    <rect x="16" y="16" width="16" height="16" rx="4" fill="#7bd88f"/>
    <rect x="38" y="16" width="16" height="16" rx="4" fill="#ffd76e"/>
    <rect x="16" y="38" width="16" height="16" rx="4" fill="#ff8fb1"/>
    <rect x="38" y="38" width="16" height="16" rx="4" fill="#b28dff"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="330" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="122" font-weight="800" letter-spacing="-2">
    <tspan fill="#eef1ff">Pixel</tspan><tspan fill="#7bd88f">Garden</tspan>
  </text>
  <text x="154" y="404" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#ffd76e">Small worlds. Strange rules.</text>

  <!-- category badge -->
  <g transform="translate(238,137)">
    <rect x="0" y="0" width="252" height="52" rx="26" fill="#20233a" stroke="#7bd88f" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="24" y="21" width="12" height="12" rx="3" fill="#7bd88f"/>
    <text x="52" y="34" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#a6acd4" letter-spacing="2">INDIE GAMES</text>
  </g>

  <!-- bottom description -->
  <text x="150" y="800" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="30" font-weight="600" fill="#a6acd4">A tiny studio growing playful, atmospheric worlds</text>
  <text x="150" y="842" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="30" font-weight="600" fill="#a6acd4">for curious players of every age.</text>
</svg>
