<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Kinetic Foundry — Machines with a human sense of motion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f13"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ff5a2c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#4fe0d0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fe0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a333d"/>
      <stop offset="1" stop-color="#1a2129"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#4fe0d0"/>
    </linearGradient>
    <radialGradient id="tip" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff5a2c"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <ellipse cx="300" cy="640" rx="520" ry="420" fill="url(#glowB)"/>

  <!-- grid -->
  <g stroke="rgba(160,178,196,0.10)" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <!-- frame -->
  <rect x="28" y="28" width="1144" height="844" rx="30" fill="none" stroke="rgba(160,178,196,0.22)"/>

  <!-- eyebrow -->
  <text x="80" y="118" fill="#ffb066" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" letter-spacing="10">APPLIED&#160;ROBOTICS</text>

  <!-- wordmark -->
  <text x="76" y="250" fill="#eef3f7" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-3">Kinetic</text>
  <text x="76" y="366" fill="url(#wordmark)" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-3">Foundry</text>

  <!-- tagline -->
  <text x="80" y="470" fill="#b9c4d0" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="500">Machines with a human sense of motion.</text>

  <!-- articulated arm motif (right) -->
  <g transform="translate(880 720)">
    <!-- reach arc -->
    <path d="M-250 -30 A 300 300 0 0 1 40 -300" fill="none" stroke="rgba(79,224,208,0.35)" stroke-width="3" stroke-dasharray="6 12"/>
    <!-- base -->
    <rect x="-60" y="-20" width="120" height="26" rx="8" fill="#20272f" stroke="rgba(160,178,196,0.25)"/>
    <rect x="-30" y="-52" width="60" height="36" rx="9" fill="url(#limb)" stroke="rgba(160,178,196,0.22)"/>
    <!-- upper limb -->
    <g transform="translate(0 -46) rotate(-24)">
      <rect x="-17" y="-140" width="34" height="150" rx="16" fill="url(#limb)" stroke="rgba(160,178,196,0.25)"/>
      <circle cx="0" cy="-136" r="9" fill="#0c0f13"/>
      <!-- forearm -->
      <g transform="translate(0 -136) rotate(52)">
        <rect x="-14" y="-128" width="28" height="136" rx="14" fill="url(#limb)" stroke="rgba(160,178,196,0.25)"/>
        <circle cx="0" cy="-124" r="7" fill="#0c0f13"/>
        <!-- wrist + gripper -->
        <g transform="translate(0 -124) rotate(-20)">
          <circle r="18" fill="#161c23" stroke="#4fe0d0" stroke-width="3"/>
          <path d="M-6 -9 L-22 -30" stroke="url(#tip)" stroke-width="8" stroke-linecap="round"/>
          <path d="M6 -9 L22 -30" stroke="url(#tip)" stroke-width="8" stroke-linecap="round"/>
          <circle r="6" fill="#ff8a3d"/>
        </g>
      </g>
      <circle cx="0" cy="-8" r="11" fill="#0c0f13" stroke="#ff8a3d" stroke-width="3"/>
    </g>
  </g>

  <!-- logo mark -->
  <g transform="translate(1010 96)">
    <rect x="0" y="0" width="94" height="94" rx="24" fill="#12171d" stroke="rgba(160,178,196,0.28)" stroke-width="2.4"/>
    <circle cx="28" cy="66" r="11" fill="none" stroke="#ff8a3d" stroke-width="6"/>
    <circle cx="64" cy="30" r="11" fill="none" stroke="#4fe0d0" stroke-width="6"/>
    <path d="M28 66 L47 47 L64 30" stroke="#b9c4d0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="47" cy="47" r="5" fill="#ff8a3d"/>
  </g>

  <!-- spec chips -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22">
    <g transform="translate(80 560)">
      <rect x="0" y="0" width="196" height="52" rx="26" fill="none" stroke="rgba(160,178,196,0.3)"/>
      <circle cx="30" cy="26" r="6" fill="#4fe0d0"/>
      <text x="50" y="34" fill="#b9c4d0">7-axis reach</text>
    </g>
    <g transform="translate(292 560)">
      <rect x="0" y="0" width="240" height="52" rx="26" fill="none" stroke="rgba(160,178,196,0.3)"/>
      <circle cx="30" cy="26" r="6" fill="#ff8a3d"/>
      <text x="50" y="34" fill="#b9c4d0">&#60;180&#181;m precision</text>
    </g>
    <g transform="translate(80 630)">
      <rect x="0" y="0" width="286" height="52" rx="26" fill="none" stroke="rgba(160,178,196,0.3)"/>
      <circle cx="30" cy="26" r="6" fill="#4fe0d0"/>
      <text x="50" y="34" fill="#b9c4d0">force-aware &#38; safe</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="80" y="826" fill="#8a97a6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" letter-spacing="4">DEXTEROUS&#160;SYSTEMS&#160;·&#160;ADAPTABLE&#160;TOOLS&#160;·&#160;SAFER&#160;WORK</text>
</svg>
