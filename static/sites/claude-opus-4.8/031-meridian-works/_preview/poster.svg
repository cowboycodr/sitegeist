<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Meridian Works</title>
  <desc id="poster-desc">Independent watchmaking poster with an analog dial motif and the tagline: Time, engineered into character.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171c" />
      <stop offset="1" stop-color="#08090c" />
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="36%" r="75%">
      <stop offset="0" stop-color="#23272f" />
      <stop offset="0.7" stop-color="#14171c" />
      <stop offset="1" stop-color="#0b0d11" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8a24a" stop-opacity="0.22" />
      <stop offset="1" stop-color="#c8a24a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#c8a24a" stroke-opacity="0.35" stroke-width="2" />

  <!-- Header -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="80" y="118" fill="#c8a24a" font-size="26" letter-spacing="9" font-weight="700">INDEPENDENT WATCHMAKING</text>
  </g>

  <!-- Dial motif -->
  <g transform="translate(870 450)">
    <circle r="300" fill="url(#glow)" />
    <circle r="230" fill="none" stroke="#3a3f49" stroke-width="5" />
    <circle r="214" fill="url(#face)" stroke="#c8a24a" stroke-width="2" />
    <g fill="#e9e4d8" font-family="Georgia, serif" font-size="30" text-anchor="middle">
      <text x="0" y="-150">12</text>
      <text x="152" y="12">3</text>
      <text x="0" y="176">6</text>
      <text x="-152" y="12">9</text>
    </g>
    <!-- hands: hour to 10, minute to 2 -->
    <line x1="0" y1="0" x2="-78" y2="-45" stroke="#e9e4d8" stroke-width="10" stroke-linecap="round" />
    <line x1="0" y1="0" x2="112" y2="-65" stroke="#e9e4d8" stroke-width="7" stroke-linecap="round" />
    <line x1="0" y1="24" x2="0" y2="-172" stroke="#c8a24a" stroke-width="3" stroke-linecap="round" />
    <circle r="9" fill="#c8a24a" />
    <circle r="3.5" fill="#0b0d11" />
    <text x="0" y="120" fill="#c8a24a" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="5" text-anchor="middle" opacity="0.85">CALIBER MW-01</text>
  </g>

  <!-- Wordmark -->
  <g font-family="Georgia, Times New Roman, serif">
    <text x="80" y="430" fill="#ffffff" font-size="150" font-weight="500" letter-spacing="-2">Meridian</text>
    <text x="86" y="560" fill="#c8a24a" font-size="150" font-weight="500" letter-spacing="10">WORKS</text>
  </g>

  <line x1="88" y1="626" x2="470" y2="626" stroke="#c8a24a" stroke-width="2" stroke-opacity="0.5" />

  <text x="88" y="700" fill="#e9e4d8" font-family="Georgia, serif" font-size="40" font-style="italic">Time, engineered into character.</text>
  <text x="88" y="762" fill="#9498a1" font-family="Helvetica Neue, Arial, sans-serif" font-size="24">Precise movements · enduring materials · patient assembly</text>

  <!-- minute ticks drawn explicitly -->
  <g transform="translate(870 450)" stroke="#6e7480" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-206" x2="0" y2="-214" transform="rotate(6)" />
    <line x1="0" y1="-206" x2="0" y2="-214" transform="rotate(12)" />
    <line x1="0" y1="-206" x2="0" y2="-214" transform="rotate(18)" />
    <line x1="0" y1="-206" x2="0" y2="-214" transform="rotate(24)" />
