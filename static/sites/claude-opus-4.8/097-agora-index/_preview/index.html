<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Agora Index — gallery poster</title>
	<style>
		html, body { margin: 0; background: #0b1016; color: #e8eef5;
			font-family: ui-sans-serif, system-ui, Arial, sans-serif; }
		main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
		figure { margin: 0; width: min(100%, 900px); }
		img { width: 100%; height: auto; display: block; border-radius: 16px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
		figcaption { margin-top: 12px; color: #9db0c4; font-size: 0.9rem; text-align: center; }
	</style>
</head>
<body>
	<main>
		<figure>
			<img src="poster.svg" alt="Agora Index gallery poster: Public life, made legible.">
			<figcaption>Agora Index — 4:3 gallery poster (authoring preview, not the website).</figcaption>
		</figure>
	</main>
</body>
</html>
