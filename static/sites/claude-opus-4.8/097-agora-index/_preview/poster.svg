<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Agora Index — public life, made legible.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#111a26"/>
			<stop offset="1" stop-color="#0b1016"/>
		</linearGradient>
		<linearGradient id="col" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#4fd1c5"/>
			<stop offset="1" stop-color="#f4b740"/>
		</linearGradient>
		<radialGradient id="glowT" cx="0.15" cy="0.1" r="0.7">
			<stop offset="0" stop-color="#4fd1c5" stop-opacity="0.18"/>
			<stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowA" cx="0.9" cy="0.12" r="0.7">
			<stop offset="0" stop-color="#f4b740" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#f4b740" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glowT)"/>
	<rect width="1200" height="900" fill="url(#glowA)"/>
	<rect x="24" y="24" width="1152" height="852" rx="28" fill="none" stroke="#2a3543" stroke-width="2"/>

	<!-- Colonnade mark -->
	<g transform="translate(96 108)">
		<rect x="-14" y="-10" width="150" height="86" rx="14" fill="#141b26" stroke="#2a3543" stroke-width="2"/>
		<rect x="8"  y="34" width="16" height="32" rx="4" fill="url(#col)"/>
		<rect x="38" y="12" width="16" height="54" rx="4" fill="url(#col)"/>
		<rect x="68" y="26" width="16" height="40" rx="4" fill="url(#col)"/>
		<rect x="98" y="2"  width="16" height="64" rx="4" fill="url(#col)"/>
	</g>

	<text x="266" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="2" fill="#e8eef5" font-weight="700">Agora Index</text>

	<!-- Eyebrow -->
	<g transform="translate(96 250)">
		<circle cx="9" cy="-8" r="9" fill="#4fd1c5"/>
		<text x="30" y="-1" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="24" letter-spacing="6" fill="#9db0c4">CITY PULSE · UPDATED HOURLY</text>
	</g>

	<!-- Headline -->
	<text x="94" y="380" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#f3ead6">Public life,</text>
	<text x="94" y="498" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#f3ead6">made <tspan fill="#f4b740">legible.</tspan></text>

	<text x="98" y="572" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="30" fill="#c8d5e2">Budgets · Housing · Transit · Participation — one district at a time.</text>

	<!-- Signal cards -->
	<g font-family="ui-sans-serif, system-ui, Arial, sans-serif">
		<!-- card 1 -->
		<g transform="translate(96 636)">
			<rect width="248" height="176" rx="18" fill="#1b2430" stroke="#2a3543"/>
			<text x="22" y="46" font-size="18" letter-spacing="2" fill="#9db0c4">BUDGET</text>
			<text x="22" y="98" font-size="46" font-weight="800" fill="#e8eef5">71<tspan font-size="22" fill="#9db0c4"> % delivered</tspan></text>
			<path d="M22 150 L62 138 L102 144 L142 120 L182 128 L226 108" fill="none" stroke="#f4b740" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
		<!-- card 2 -->
		<g transform="translate(364 636)">
			<rect width="248" height="176" rx="18" fill="#1b2430" stroke="#2a3543"/>
			<text x="22" y="46" font-size="18" letter-spacing="2" fill="#9db0c4">HOUSING</text>
			<text x="22" y="98" font-size="46" font-weight="800" fill="#e8eef5">58<tspan font-size="22" fill="#9db0c4"> permits</tspan></text>
			<path d="M22 150 L62 146 L102 128 L142 132 L182 112 L226 96" fill="none" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
		<!-- card 3 -->
		<g transform="translate(632 636)">
			<rect width="248" height="176" rx="18" fill="#1b2430" stroke="#2a3543"/>
			<text x="22" y="46" font-size="18" letter-spacing="2" fill="#9db0c4">TRANSIT</text>
			<text x="22" y="98" font-size="46" font-weight="800" fill="#e8eef5">88<tspan font-size="22" fill="#9db0c4"> % on-time</tspan></text>
			<path d="M22 140 L62 132 L102 138 L142 126 L182 130 L226 118" fill="none" stroke="#7bd88f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
		<!-- card 4 -->
		<g transform="translate(900 636)">
			<rect width="204" height="176" rx="18" fill="#1b2430" stroke="#2a3543"/>
			<text x="22" y="46" font-size="18" letter-spacing="2" fill="#9db0c4">PARTICIPATION</text>
			<text x="22" y="98" font-size="46" font-weight="800" fill="#e8eef5">34<tspan font-size="20" fill="#9db0c4"> %</tspan></text>
			<path d="M22 150 L58 144 L94 150 L130 126 L166 132 L182 116" fill="none" stroke="#f2788f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
	</g>
</svg>
