<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Solar Flare festival poster">
  <defs>
    <radialGradient id="bg" cx="72%" cy="16%" r="90%">
      <stop offset="0%" stop-color="#2a0a2e"/>
      <stop offset="58%" stop-color="#160718"/>
      <stop offset="100%" stop-color="#120616"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf4d"/>
      <stop offset="38%" stop-color="#ff7a1a"/>
      <stop offset="68%" stop-color="#ff2e78"/>
      <stop offset="80%" stop-color="#ff2e78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffcf4d"/>
      <stop offset="48%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff2e78"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a2ff2"/>
      <stop offset="100%" stop-color="#ff2e78"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- violet glow -->
  <circle cx="150" cy="820" r="260" fill="url(#blob)" opacity="0.35"/>

  <!-- corona rays -->
  <g transform="translate(860 250)" opacity="0.85">
    <g fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <line x1="0" y1="-320" x2="0" y2="-250"/>
      <line x1="0" y1="320" x2="0" y2="250"/>
      <line x1="-320" y1="0" x2="-250" y2="0"/>
      <line x1="320" y1="0" x2="250" y2="0"/>
      <line x1="-226" y1="-226" x2="-177" y2="-177"/>
      <line x1="226" y1="226" x2="177" y2="177"/>
      <line x1="226" y1="-226" x2="177" y2="-177"/>
      <line x1="-226" y1="226" x2="-177" y2="177"/>
      <line x1="-123" y1="-296" x2="-96" y2="-231"/>
      <line x1="123" y1="296" x2="96" y2="231"/>
      <line x1="296" y1="-123" x2="231" y2="-96"/>
      <line x1="-296" y1="123" x2="-231" y2="96"/>
      <line x1="123" y1="-296" x2="96" y2="-231"/>
      <line x1="-123" y1="296" x2="-96" y2="231"/>
      <line x1="296" y1="123" x2="231" y2="96"/>
      <line x1="-296" y1="-123" x2="-231" y2="-96"/>
    </g>
  </g>

  <!-- sun disc -->
  <circle cx="860" cy="250" r="230" fill="url(#sun)"/>
  <circle cx="860" cy="250" r="150" fill="#ffcf4d" opacity="0.9"/>
  <circle cx="815" cy="210" r="60" fill="#fff2e6" opacity="0.55"/>

  <!-- eyebrow -->
  <text x="90" y="150" fill="#ffcf4d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="10">JOSHUA TREE · SEP 18–20</text>

  <!-- title -->
  <text x="84" y="520" fill="url(#ink)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="196" font-weight="800" letter-spacing="-6">Solar</text>
  <text x="84" y="700" fill="#fff2e6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="196" font-weight="800" letter-spacing="-6">Flare</text>

  <!-- tagline -->
  <text x="90" y="782" fill="#d6a58f" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600">Three nights. No small feelings.</text>

  <!-- footer stats -->
  <line x1="90" y1="824" x2="1110" y2="824" stroke="#ff7a1a" stroke-opacity="0.3" stroke-width="2"/>
  <text x="90" y="866" fill="#ffcf4d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">3 NIGHTS</text>
  <text x="330" y="866" fill="#d6a58f" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">40+ ARTISTS</text>
  <text x="640" y="866" fill="#d6a58f" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">6 STAGES</text>
  <text x="900" y="866" fill="#ff2e78" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">DESERT FEST</text>
</svg>
