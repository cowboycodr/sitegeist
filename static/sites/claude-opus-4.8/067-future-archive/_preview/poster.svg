<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Future Archive</title>
  <desc id="pdesc">Concentric preservation rings above the wordmark Future Archive and the tagline Save what tomorrow should remember.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#12233c"/>
      <stop offset="45%" stop-color="#0b1526"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecb45c"/>
      <stop offset="100%" stop-color="#b57e2c"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55e0c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#55e0c8"/>
      <stop offset="100%" stop-color="#55e0c8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="852" rx="26" fill="none" stroke="#26374f" stroke-width="2"/>

  <!-- concentric preservation rings motif -->
  <g transform="translate(600 372)">
    <circle r="250" fill="none" stroke="#1f9d8c" stroke-width="2" stroke-dasharray="4 26" opacity="0.75"/>
    <circle r="205" fill="none" stroke="#22344f" stroke-width="2"/>
    <circle r="162" fill="none" stroke="#55e0c8" stroke-width="2" stroke-dasharray="2 18" opacity="0.7"/>
    <circle r="120" fill="none" stroke="#2a3d59" stroke-width="2"/>
    <circle r="82" fill="none" stroke="#55e0c8" stroke-width="2.2"/>
    <circle r="48" fill="none" stroke="#ecb45c" stroke-width="2.4"/>
    <circle r="17" fill="url(#core)"/>
    <g fill="#55e0c8">
      <circle cx="0" cy="-250" r="5"/>
      <circle cx="250" cy="0" r="5" fill="#ecb45c"/>
      <circle cx="0" cy="250" r="5"/>
      <circle cx="-250" cy="0" r="5" fill="#ecb45c"/>
    </g>
  </g>

  <!-- eyebrow -->
  <text x="600" y="638" text-anchor="middle" fill="#55e0c8"
        font-family="'Segoe UI', system-ui, sans-serif" font-size="26"
        font-weight="700" letter-spacing="10">MEMORY INFRASTRUCTURE</text>

  <!-- wordmark -->
  <text x="600" y="736" text-anchor="middle" fill="#f3ead6"
        font-family="'Iowan Old Style', Palatino, Georgia, serif"
        font-size="118" font-weight="600" letter-spacing="-1">Future <tspan fill="#ecb45c" font-style="italic">Archive</tspan></text>

  <rect x="430" y="770" width="340" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="600" y="826" text-anchor="middle" fill="#a9bccb"
        font-family="'Segoe UI', system-ui, sans-serif" font-size="30"
        letter-spacing="1">Save what tomorrow should remember.</text>
</svg>
