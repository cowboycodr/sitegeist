<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Nightjar FM — poster preview</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center;
			background: #070a14; padding: 24px; }
		img { width: min(100%, 900px); aspect-ratio: 4 / 3; height: auto;
			border-radius: 14px; box-shadow: 0 30px 80px -30px #000; }
	</style>
</head>
<body>
	<img src="poster.svg" alt="Nightjar FM gallery poster">
</body>
</html>
