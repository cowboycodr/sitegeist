<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="posterTitle posterDesc">
	<title id="posterTitle">Common Blue — coastal action network</title>
	<desc id="posterDesc">A poster for Common Blue with a deep blue tide, layered waves, and the tagline: the ocean belongs to everyone.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#eaf6fc"/>
			<stop offset="1" stop-color="#cfe8f4"/>
		</linearGradient>
		<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2f9bd6"/>
			<stop offset="1" stop-color="#073b5c"/>
		</linearGradient>
		<clipPath id="orb"><circle cx="895" cy="360" r="235"/></clipPath>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>

	<!-- brand mark -->
	<g transform="translate(96 88)">
		<circle cx="30" cy="30" r="30" fill="#073b5c"/>
		<path d="M4 38c8 0 8-8 16-8s8 8 16 8 8-8 16-8" fill="none" stroke="#e9f6fb" stroke-width="4.5" stroke-linecap="round"/>
		<path d="M4 24c8 0 8-8 16-8s8 8 16 8 8-8 16-8" fill="none" stroke="#86d1e8" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
		<text x="78" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#073b5c" letter-spacing="0.5">Common Blue</text>
	</g>

	<!-- eyebrow -->
	<text x="96" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#0a6fb0">COASTAL ACTION NETWORK</text>

	<!-- headline -->
	<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#073b5c" font-weight="800" letter-spacing="-1">
		<text x="94" y="392" font-size="96">The ocean</text>
		<text x="94" y="490" font-size="96">belongs to</text>
		<text x="94" y="588" font-size="96">everyone.</text>
	</g>

	<!-- supporting line -->
	<text x="96" y="662" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" fill="#3a5866">Restoration projects · open field data · local volunteers</text>

	<!-- stat pills -->
	<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
		<g transform="translate(96 712)">
			<rect width="230" height="96" rx="18" fill="#ffffff" stroke="#e6dcc4"/>
			<text x="24" y="46" font-size="40" font-weight="800" fill="#0a6fb0">742 ha</text>
			<text x="24" y="76" font-size="20" fill="#3a5866">restored</text>
		</g>
		<g transform="translate(346 712)">
			<rect width="210" height="96" rx="18" fill="#ffffff" stroke="#e6dcc4"/>
			<text x="24" y="46" font-size="40" font-weight="800" fill="#0a6fb0">128</text>
			<text x="24" y="76" font-size="20" fill="#3a5866">projects</text>
		</g>
		<g transform="translate(576 712)">
			<rect width="250" height="96" rx="18" fill="#ffffff" stroke="#e6dcc4"/>
			<text x="24" y="46" font-size="40" font-weight="800" fill="#0a6fb0">9,400+</text>
			<text x="24" y="76" font-size="20" fill="#3a5866">volunteers</text>
		</g>
	</g>

	<!-- tide orb -->
	<circle cx="895" cy="360" r="235" fill="url(#sea)"/>
	<g clip-path="url(#orb)">
		<path d="M640 380 q64 -40 128 0 t128 0 t128 0 t128 0 V620 H640 Z" fill="#4fb3dd" opacity="0.55"/>
		<path d="M640 430 q64 -36 128 0 t128 0 t128 0 t128 0 V620 H640 Z" fill="#86d1e8" opacity="0.7"/>
		<path d="M640 480 q64 -30 128 0 t128 0 t128 0 t128 0 V620 H640 Z" fill="#e9f6fb" opacity="0.9"/>
	</g>
	<circle cx="895" cy="360" r="234" fill="none" stroke="#e9f6fb" stroke-width="3" opacity="0.5"/>

	<!-- bottom wave band -->
	<path d="M0 838 q150 -44 300 0 t300 0 t300 0 t300 0 V900 H0 Z" fill="#073b5c"/>
</svg>
