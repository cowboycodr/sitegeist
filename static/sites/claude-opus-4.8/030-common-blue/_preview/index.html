<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
	<title>Common Blue — gallery poster</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #073b5c; padding: 24px; }
		figure { margin: 0; width: min(100%, 960px); }
		img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6); }
		figcaption { color: #e9f6fb; font-family: system-ui, sans-serif; text-align: center; margin-top: 14px; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Common Blue poster: the ocean belongs to everyone — a coastal action network." />
		<figcaption>Common Blue — 4:3 gallery poster</figcaption>
	</figure>
</body>
</html>
