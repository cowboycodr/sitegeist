<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Chorus Room — Listening is better together">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1533"/>
      <stop offset="1" stop-color="#120c1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="0.6" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="520" fill="url(#glow)" opacity="0.10"/>

  <!-- brand -->
  <g transform="translate(90,96)">
    <g>
      <rect x="0"  y="14" width="10" height="26" rx="5" fill="#ffcf6b"/>
      <rect x="16" y="0"  width="10" height="54" rx="5" fill="#ff7a59"/>
      <rect x="32" y="8"  width="10" height="38" rx="5" fill="#b48cff"/>
      <rect x="48" y="18" width="10" height="20" rx="5" fill="#7fe0c4"/>
    </g>
    <text x="80" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#f4eefe">Chorus Room</text>
  </g>

  <!-- presence pill -->
  <g transform="translate(860,100)">
    <rect x="0" y="0" width="250" height="46" rx="23" fill="#241a3d" stroke="#3a2c5c"/>
    <circle cx="26" cy="23" r="7" fill="#7fe0c4"/>
    <text x="44" y="30" font-family="system-ui, sans-serif" font-size="19" fill="#b6a8d6"><tspan fill="#f4eefe" font-weight="700">12,408</tspan> online</text>
  </g>

  <!-- headline -->
  <g transform="translate(90,270)">
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#f4eefe" font-size="112" letter-spacing="-2">
      <tspan x="0" y="0">Listening is</tspan>
      <tspan x="0" y="128">better <tspan fill="#ff7a59" font-style="italic">together.</tspan></tspan>
    </text>
    <text x="4" y="212" font-family="system-ui, sans-serif" font-size="30" fill="#b6a8d6">
      <tspan x="4" y="212">Live album rooms where friends trade discoveries</tspan>
      <tspan x="4" y="252">and talk between the tracks.</tspan>
    </text>
  </g>

  <!-- CTA buttons -->
  <g transform="translate(90,760)" font-family="system-ui, sans-serif" font-weight="700" font-size="26">
    <rect x="0" y="0" width="228" height="66" rx="33" fill="url(#hot)"/>
    <text x="114" y="42" text-anchor="middle" fill="#38160a">Join a room</text>
    <rect x="248" y="0" width="266" height="66" rx="33" fill="none" stroke="#3a2c5c" stroke-width="2"/>
    <text x="381" y="42" text-anchor="middle" fill="#f4eefe">Start a session</text>
  </g>

  <!-- orbit motif with album card -->
  <g transform="translate(880,520)">
    <circle r="230" fill="none" stroke="#ffcf6b" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="182" fill="none" stroke="#ff7a59" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="134" fill="none" stroke="#b48cff" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="200" cy="-70" r="12" fill="#7fe0c4"/>
    <circle cx="-190" cy="60" r="12" fill="#ffcf6b"/>
    <circle cx="120" cy="185" r="12" fill="#ff7a59"/>
    <circle cx="-140" cy="-150" r="12" fill="#b48cff"/>

    <!-- album cover in the middle -->
    <g transform="translate(-104,-104)">
      <rect width="208" height="208" rx="22" fill="url(#hot)"/>
      <circle cx="150" cy="56" r="42" fill="#ffffff" opacity="0.16"/>
      <circle cx="150" cy="56" r="10" fill="#150f22" opacity="0.55"/>
      <g transform="translate(20,120)">
        <rect x="0"   y="-10" width="11" height="30" rx="5" fill="url(#bar)"/>
        <rect x="20"  y="-40" width="11" height="60" rx="5" fill="url(#bar)"/>
        <rect x="40"  y="-24" width="11" height="44" rx="5" fill="url(#bar)"/>
        <rect x="60"  y="-52" width="11" height="72" rx="5" fill="url(#bar)"/>
        <rect x="80"  y="-16" width="11" height="36" rx="5" fill="url(#bar)"/>
        <rect x="100" y="-44" width="11" height="64" rx="5" fill="url(#bar)"/>
        <rect x="120" y="-6"  width="11" height="26" rx="5" fill="url(#bar)"/>
        <rect x="140" y="-34" width="11" height="54" rx="5" fill="url(#bar)"/>
      </g>
    </g>
  </g>
</svg>
