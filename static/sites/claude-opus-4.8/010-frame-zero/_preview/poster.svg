<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Frame Zero — Films that refuse the expected.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f0a020" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0a020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1916"/>
      <stop offset="1" stop-color="#100e0c"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#grain)"/>

  <!-- film strip top -->
  <g>
    <rect x="0" y="70" width="1200" height="70" fill="url(#strip)"/>
    <g fill="#0a0908">
      <!-- sprocket holes -->
      <rect x="20" y="82" width="26" height="20" rx="4"/>
      <rect x="90" y="82" width="26" height="20" rx="4"/>
      <rect x="160" y="82" width="26" height="20" rx="4"/>
      <rect x="230" y="82" width="26" height="20" rx="4"/>
      <rect x="300" y="82" width="26" height="20" rx="4"/>
      <rect x="370" y="82" width="26" height="20" rx="4"/>
      <rect x="440" y="82" width="26" height="20" rx="4"/>
      <rect x="510" y="82" width="26" height="20" rx="4"/>
      <rect x="580" y="82" width="26" height="20" rx="4"/>
      <rect x="650" y="82" width="26" height="20" rx="4"/>
      <rect x="720" y="82" width="26" height="20" rx="4"/>
      <rect x="790" y="82" width="26" height="20" rx="4"/>
      <rect x="860" y="82" width="26" height="20" rx="4"/>
      <rect x="930" y="82" width="26" height="20" rx="4"/>
      <rect x="1000" y="82" width="26" height="20" rx="4"/>
      <rect x="1070" y="82" width="26" height="20" rx="4"/>
      <rect x="1140" y="82" width="26" height="20" rx="4"/>
      <rect x="20" y="108" width="26" height="20" rx="4"/>
      <rect x="90" y="108" width="26" height="20" rx="4"/>
      <rect x="160" y="108" width="26" height="20" rx="4"/>
      <rect x="230" y="108" width="26" height="20" rx="4"/>
      <rect x="300" y="108" width="26" height="20" rx="4"/>
      <rect x="370" y="108" width="26" height="20" rx="4"/>
      <rect x="440" y="108" width="26" height="20" rx="4"/>
      <rect x="510" y="108" width="26" height="20" rx="4"/>
      <rect x="580" y="108" width="26" height="20" rx="4"/>
      <rect x="650" y="108" width="26" height="20" rx="4"/>
      <rect x="720" y="108" width="26" height="20" rx="4"/>
      <rect x="790" y="108" width="26" height="20" rx="4"/>
      <rect x="860" y="108" width="26" height="20" rx="4"/>
      <rect x="930" y="108" width="26" height="20" rx="4"/>
      <rect x="1000" y="108" width="26" height="20" rx="4"/>
      <rect x="1070" y="108" width="26" height="20" rx="4"/>
      <rect x="1140" y="108" width="26" height="20" rx="4"/>
    </g>
  </g>

  <!-- eyebrow -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <circle cx="112" cy="214" r="8" fill="#e0503a"/>
    <text x="132" y="221" fill="#b6ad9c" font-size="26" letter-spacing="6" font-weight="700">INDEPENDENT CINEMA</text>
  </g>

  <!-- countdown leader motif -->
  <g transform="translate(905 430)">
    <circle r="205" fill="#100e0c" stroke="#2c2823" stroke-width="2"/>
    <circle r="176" fill="none" stroke="#f0a020" stroke-width="3" opacity="0.85"/>
    <circle r="140" fill="none" stroke="#2c2823" stroke-width="2"/>
    <line x1="-205" y1="0" x2="205" y2="0" stroke="#f0a020" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-205" x2="0" y2="205" stroke="#f0a020" stroke-width="2" opacity="0.5"/>
    <path d="M0 -205 A205 205 0 0 1 205 0 L0 0 Z" fill="#f0a020" opacity="0.10"/>
    <text x="0" y="118" text-anchor="middle" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="360" font-weight="700" fill="#f3ede1">0</text>
  </g>

  <!-- title -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" fill="#f3ede1" font-weight="800">
    <text x="106" y="440" font-size="150" letter-spacing="-4">Films that</text>
    <text x="106" y="580" font-size="150" letter-spacing="-4">refuse the</text>
    <text x="106" y="720" font-size="150" letter-spacing="-4" fill="#f0a020">expected.</text>
  </g>

  <!-- wordmark footer -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="106" y="828" fill="#f3ede1" font-size="34" font-weight="800" letter-spacing="2">FRAME<tspan fill="#f0a020">ZERO</tspan></text>
    <text x="1094" y="828" text-anchor="end" fill="#7d7566" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3">TWELVE NIGHTS · ONE SCREEN</text>
  </g>
</svg>
