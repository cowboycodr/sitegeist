<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Bloom — gallery poster</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #10231b;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
  }
  img {
    width: min(1200px, 100%);
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
  <img src="poster.svg" alt="Bloom gallery poster: Medicine, grown differently." />
</body>
</html>
