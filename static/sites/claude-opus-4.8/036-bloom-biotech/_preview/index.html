<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Bloom — gallery poster</title>
<style>
  html,body{margin:0;height:100%;background:#07130f;
    display:grid;place-items:center;padding:24px;box-sizing:border-box}
  figure{margin:0;width:min(100%,900px)}
  img{width:100%;height:auto;border-radius:16px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
  figcaption{color:#a9c3b4;font-family:system-ui,sans-serif;font-size:.85rem;
    text-align:center;margin-top:14px;letter-spacing:.04em}
</style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Bloom gallery poster: a radiant living bloom of green and rose petals with the tagline Medicine, grown differently." />
    <figcaption>Bloom — promotional gallery poster (4:3). Not part of the website.</figcaption>
  </figure>
</body>
</html>
