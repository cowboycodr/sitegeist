<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Bloom — Medicine, grown differently. A radiant bloom of petals over a warm paper background.">
  <defs>
    <radialGradient id="bg" cx="78%" cy="8%" r="90%">
      <stop offset="0%" stop-color="#f7e4ec"/>
      <stop offset="42%" stop-color="#f2efe2"/>
      <stop offset="100%" stop-color="#eae6d6"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f7d9a0"/>
      <stop offset="55%" stop-color="#e9b949"/>
      <stop offset="100%" stop-color="#c98f2c"/>
    </radialGradient>
    <linearGradient id="petalA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c9dc"/>
      <stop offset="100%" stop-color="#d98cae"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6d8b0"/>
      <stop offset="100%" stop-color="#4f9b6c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="852" rx="34" fill="none" stroke="rgba(28,74,53,0.18)" stroke-width="2"/>

  <!-- Bloom motif -->
  <g transform="translate(852 470) scale(1.02)">
    <g fill="url(#petalB)" opacity="0.9">
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(0)"/>
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(60)"/>
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(120)"/>
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(180)"/>
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(240)"/>
      <path d="M0 0 C0 -150 40 -210 40 -210 C40 -210 80 -150 80 0 C80 100 40 140 0 140 Z" transform="rotate(300)"/>
    </g>
    <g fill="url(#petalA)" opacity="0.96">
      <path d="M0 0 C5 -110 30 -150 30 -150 C30 -150 55 -110 55 0 C55 75 30 100 0 100 Z" transform="rotate(30)"/>
      <path d="M0 0 C5 -110 30 -150 30 -150 C30 -150 55 -110 55 0 C55 75 30 100 0 100 Z" transform="rotate(102)"/>
      <path d="M0 0 C5 -110 30 -150 30 -150 C30 -150 55 -110 55 0 C55 75 30 100 0 100 Z" transform="rotate(174)"/>
      <path d="M0 0 C5 -110 30 -150 30 -150 C30 -150 55 -110 55 0 C55 75 30 100 0 100 Z" transform="rotate(246)"/>
      <path d="M0 0 C5 -110 30 -150 30 -150 C30 -150 55 -110 55 0 C55 75 30 100 0 100 Z" transform="rotate(318)"/>
    </g>
    <circle cx="40" cy="-35" r="66" fill="url(#core)"/>
    <g fill="#1c4a35" opacity="0.85">
      <circle cx="40" cy="-35" r="7"/>
      <circle cx="18" cy="-47" r="5"/>
      <circle cx="62" cy="-45" r="5"/>
      <circle cx="28" cy="-19" r="5"/>
      <circle cx="54" cy="-17" r="5"/>
    </g>
  </g>

  <!-- Brand + logotype -->
  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif">
    <g transform="translate(96 118)">
      <g fill="none" stroke="#2f6b4f" stroke-width="4">
        <path d="M0 0c0-32 16-48 16-48s16 16 16 48-16 48-16 48-16-16-16-48Z" transform="rotate(0 16 0)"/>
        <path d="M0 0c0-32 16-48 16-48s16 16 16 48-16 48-16 48-16-16-16-48Z" transform="rotate(72 16 0)"/>
        <path d="M0 0c0-32 16-48 16-48s16 16 16 48-16 48-16 48-16-16-16-48Z" transform="rotate(144 16 0)"/>
        <path d="M0 0c0-32 16-48 16-48s16 16 16 48-16 48-16 48-16-16-16-48Z" transform="rotate(216 16 0)"/>
        <path d="M0 0c0-32 16-48 16-48s16 16 16 48-16 48-16 48-16-16-16-48Z" transform="rotate(288 16 0)"/>
      </g>
      <circle cx="16" cy="0" r="8" fill="#d98cae"/>
      <text x="52" y="14" font-size="42" font-weight="700" fill="#10231b" letter-spacing="0.5">Bloom</text>
    </g>

    <text x="96" y="220" font-size="26" letter-spacing="8" fill="#2f6b4f" font-weight="600">BIOLOGY IN MOTION</text>
  </g>

  <!-- Headline (serif) -->
  <g font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" fill="#10231b">
    <text x="94" y="360" font-size="118" font-weight="700" letter-spacing="-2">Medicine,</text>
    <text x="94" y="480" font-size="118" font-weight="700" letter-spacing="-2" fill="#2f6b4f">grown</text>
    <text x="94" y="600" font-size="118" font-weight="700" letter-spacing="-2" fill="#2f6b4f">differently.</text>
  </g>

  <!-- Tagline strip -->
  <g font-family="Iowan Old Style, Palatino Linotype, Georgia, serif">
    <text x="96" y="690" font-size="34" fill="#3a5347">Regenerative therapies engineered from</text>
    <text x="96" y="736" font-size="34" fill="#3a5347">cells, fungi, and the intelligence of plants.</text>
  </g>

  <!-- Footer kingdoms -->
  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif" transform="translate(96 812)">
    <g>
      <circle cx="0" cy="-6" r="10" fill="#7bbf8a"/>
      <text x="22" y="2" font-size="26" fill="#10231b" font-weight="600">Cells</text>
    </g>
    <g transform="translate(190 0)">
      <circle cx="0" cy="-6" r="10" fill="#d98cae"/>
      <text x="22" y="2" font-size="26" fill="#10231b" font-weight="600">Fungi</text>
    </g>
    <g transform="translate(390 0)">
      <circle cx="0" cy="-6" r="10" fill="#e9b949"/>
      <text x="22" y="2" font-size="26" fill="#10231b" font-weight="600">Plants</text>
    </g>
  </g>
</svg>
