<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Bloom — Medicine, grown differently.</title>
  <desc id="pdesc">Gallery poster for Bloom, a biotechnology concept: a radiant living bloom of green and rose petals over a deep moss background.</desc>
  <defs>
    <radialGradient id="bg" cx="80%" cy="8%" r="105%">
      <stop offset="0" stop-color="#123227"/>
      <stop offset="55%" stop-color="#0b1e17"/>
      <stop offset="100%" stop-color="#07130f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff9bb4" stop-opacity=".35"/>
      <stop offset="60%" stop-color="#ff9bb4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0a3"/><stop offset="1" stop-color="#0f7a5b"/>
    </linearGradient>
    <linearGradient id="pInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd18a"/><stop offset="1" stop-color="#ff9bb4"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#fff4de"/><stop offset=".5" stop-color="#ffd18a"/>
      <stop offset="1" stop-color="#ff9bb4"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffd18a"/><stop offset=".55" stop-color="#ff9bb4"/>
      <stop offset="1" stop-color="#6ee7b0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#halo)"/>
  <rect x="20" y="20" width="1160" height="860" rx="30" fill="none" stroke="rgba(150,214,178,.18)" stroke-width="2"/>

  <!-- concentric guide rings -->
  <g transform="translate(820 440)" fill="none">
    <circle r="330" stroke="rgba(110,231,176,.12)" stroke-width="2"/>
    <circle r="250" stroke="rgba(255,155,180,.14)" stroke-width="2"/>
  </g>

  <!-- floating spores -->
  <g fill="#6ee7b0">
    <circle cx="540" cy="180" r="6" opacity=".8"/>
    <circle cx="1120" cy="300" r="5" opacity=".7"/>
    <circle cx="1080" cy="640" r="7" opacity=".8"/>
    <circle cx="600" cy="720" r="5" opacity=".6"/>
    <circle cx="520" cy="520" r="4" opacity=".7"/>
  </g>

  <!-- BLOOM motif -->
  <g transform="translate(820 440)">
    <g fill="url(#pOuter)" opacity=".92">
      <path transform="rotate(0)"   d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
      <path transform="rotate(60)"  d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
      <path transform="rotate(120)" d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
      <path transform="rotate(180)" d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
      <path transform="rotate(240)" d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
      <path transform="rotate(300)" d="M0 -13 C102 -66 133 -244 0 -332 C-133 -244 -102 -66 0 -13Z"/>
    </g>
    <g fill="url(#pInner)" transform="rotate(30)">
      <path transform="rotate(0)"   d="M0 -9 C66 -49 88 -173 0 -230 C-88 -173 -66 -49 0 -9Z"/>
      <path transform="rotate(72)"  d="M0 -9 C66 -49 88 -173 0 -230 C-88 -173 -66 -49 0 -9Z"/>
      <path transform="rotate(144)" d="M0 -9 C66 -49 88 -173 0 -230 C-88 -173 -66 -49 0 -9Z"/>
      <path transform="rotate(216)" d="M0 -9 C66 -49 88 -173 0 -230 C-88 -173 -66 -49 0 -9Z"/>
      <path transform="rotate(288)" d="M0 -9 C66 -49 88 -173 0 -230 C-88 -173 -66 -49 0 -9Z"/>
    </g>
    <circle r="76" fill="url(#core)"/>
    <g fill="#0b1a13" opacity=".55">
      <circle cx="0" cy="0" r="7"/><circle cx="-26" cy="-18" r="5.4"/>
      <circle cx="26" cy="-18" r="5.4"/><circle cx="0" cy="27" r="5.4"/>
      <circle cx="-22" cy="18" r="4.4"/><circle cx="22" cy="18" r="4.4"/>
    </g>
  </g>

  <!-- Text block -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">
    <text x="90" y="150" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif"
          font-size="26" letter-spacing="7" fill="#6ee7b0" font-weight="600">BIOTECHNOLOGY</text>
    <text x="86" y="330" font-size="150" font-weight="600" fill="url(#wordmark)" letter-spacing="-4">Bloom</text>
    <text x="90" y="440" font-size="58" font-weight="600" fill="#eaf5ee">Medicine,</text>
    <text x="90" y="510" font-size="58" font-weight="600" fill="#ffb7c6">grown differently.</text>
    <text x="90" y="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif"
          font-size="27" fill="#a9c3b4">Regenerative therapies from cells,</text>
    <text x="90" y="638" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif"
          font-size="27" fill="#a9c3b4">fungi, and the intelligence of plants.</text>
  </g>

  <!-- tag chips -->
  <g font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="600">
    <g>
      <rect x="90" y="720" width="150" height="52" rx="26" fill="none" stroke="rgba(110,231,176,.5)" stroke-width="2"/>
      <text x="165" y="753" fill="#6ee7b0" text-anchor="middle">Cellular</text>
    </g>
    <g>
      <rect x="256" y="720" width="160" height="52" rx="26" fill="none" stroke="rgba(255,209,138,.5)" stroke-width="2"/>
      <text x="336" y="753" fill="#ffd18a" text-anchor="middle">Mycelial</text>
    </g>
    <g>
      <rect x="432" y="720" width="176" height="52" rx="26" fill="none" stroke="rgba(255,155,180,.5)" stroke-width="2"/>
      <text x="520" y="753" fill="#ff9bb4" text-anchor="middle">Botanical</text>
    </g>
  </g>
</svg>
