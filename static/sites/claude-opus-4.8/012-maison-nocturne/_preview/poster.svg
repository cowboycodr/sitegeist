<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Maison Nocturne — Tailored for the hours unseen.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#08080c"/>
      <stop offset="0.6" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="1" r="0.7">
      <stop offset="0" stop-color="#5a5078" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5a5078" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a24"/>
      <stop offset="1" stop-color="#0b0b11"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="-100" y1="120" x2="1300" y2="380"/>
    <line x1="-100" y1="260" x2="1300" y2="520"/>
    <line x1="-100" y1="400" x2="1300" y2="660"/>
    <line x1="-100" y1="540" x2="1300" y2="800"/>
  </g>

  <!-- Silhouette figure motif -->
  <g transform="translate(860 210)">
    <rect x="-40" y="-30" width="360" height="600" rx="6" fill="url(#fig)" stroke="#d6d0c4" stroke-opacity="0.12"/>
    <g transform="translate(140 60) scale(1.15)">
      <path d="M0 0c-14 0-22 8-24 18l-34 20c-8 5-10 12-10 22v152h136V78c0-10-2-17-10-22l-34-20C22 26 14 18 0 18 0 12 0 6 0 0z" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M0 18l-30 22v172M0 18l30 22v172" fill="none" stroke="#e2c78d" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M0 18v170" stroke="#e2c78d" stroke-opacity="0.7" stroke-width="1.6"/>
      <circle cx="0" cy="96" r="3" fill="#e2c78d" fill-opacity="0.7"/>
      <circle cx="0" cy="126" r="3" fill="#e2c78d" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Mark -->
  <g transform="translate(96 118)">
    <circle cx="26" cy="26" r="22" fill="none" stroke="#c9a86a" stroke-width="2.2"/>
    <path d="M26 4 A22 22 0 0 0 26 48 A15 15 0 0 1 26 4 Z" fill="#c9a86a"/>
    <text x="70" y="22" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="8" font-weight="700" fill="#ece7dc">MAISON</text>
    <text x="70" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="8" font-weight="700" fill="#c9a86a">NOCTURNE</text>
  </g>

  <!-- Eyebrow -->
  <text x="96" y="360" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" letter-spacing="9" fill="#e2c78d">COLLECTION XII · PARIS</text>

  <!-- Headline -->
  <g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#ece7dc">
    <text x="92" y="470" font-size="112" letter-spacing="-2">Tailored</text>
    <text x="92" y="576" font-size="112" letter-spacing="-2">for the hours</text>
    <text x="92" y="682" font-size="112" font-style="italic" fill="#e2c78d">unseen.</text>
  </g>

  <!-- Tagline -->
  <text x="96" y="760" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28" fill="#b7b2a6">Sculptural silhouettes, shaped in nocturnal restraint.</text>

  <!-- Footer coords -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" letter-spacing="5" fill="#8a8579">
    <text x="96" y="822">48°51′ N</text>
    <circle cx="230" cy="816" r="3" fill="#c9a86a"/>
    <text x="256" y="822">2°21′ E</text>
    <circle cx="360" cy="816" r="3" fill="#c9a86a"/>
    <text x="386" y="822">RUE DES OMBRES</text>
  </g>

  <rect x="12" y="12" width="1176" height="876" rx="4" fill="none" stroke="#c9a86a" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
