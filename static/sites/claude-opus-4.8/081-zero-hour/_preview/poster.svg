<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Zero Hour — independent climate journalism poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0e"/>
      <stop offset="1" stop-color="#131a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="14%" r="60%">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Warming stripes band -->
  <g>
    <rect x="0" y="726" width="1200" height="174" fill="#0b0f0e"/>
    <g>
      <rect x="0"    y="726" width="60" height="174" fill="#1a4478"/>
      <rect x="60"   y="726" width="60" height="174" fill="#2a5488"/>
      <rect x="120"  y="726" width="60" height="174" fill="#3f6c9c"/>
      <rect x="180"  y="726" width="60" height="174" fill="#5f8ab0"/>
      <rect x="240"  y="726" width="60" height="174" fill="#87a9c4"/>
      <rect x="300"  y="726" width="60" height="174" fill="#b7cbd9"/>
      <rect x="360"  y="726" width="60" height="174" fill="#dce8ee"/>
      <rect x="420"  y="726" width="60" height="174" fill="#f4efe6"/>
      <rect x="480"  y="726" width="60" height="174" fill="#f6d9b6"/>
      <rect x="540"  y="726" width="60" height="174" fill="#f4b98c"/>
      <rect x="600"  y="726" width="60" height="174" fill="#f09a5f"/>
      <rect x="660"  y="726" width="60" height="174" fill="#ff6b35"/>
      <rect x="720"  y="726" width="60" height="174" fill="#e8502a"/>
      <rect x="780"  y="726" width="60" height="174" fill="#d13a22"/>
      <rect x="840"  y="726" width="60" height="174" fill="#bd2a1c"/>
      <rect x="900"  y="726" width="60" height="174" fill="#a81f18"/>
      <rect x="960"  y="726" width="60" height="174" fill="#951814"/>
      <rect x="1020" y="726" width="60" height="174" fill="#821210"/>
      <rect x="1080" y="726" width="60" height="174" fill="#6f0d0d"/>
      <rect x="1140" y="726" width="60" height="174" fill="#5c0a0a"/>
    </g>
    <text x="80" y="840" font-family="Georgia, serif" font-size="26" fill="#0b0f0e" font-weight="700">1900</text>
    <text x="1120" y="840" font-family="Georgia, serif" font-size="26" fill="#f4efe6" font-weight="700" text-anchor="end">NOW</text>
  </g>

  <!-- Clock motif -->
  <g transform="translate(905,250)">
    <circle r="150" fill="none" stroke="url(#ring)" stroke-width="10"/>
    <circle r="150" fill="#0b0f0e" opacity="0.35"/>
    <g stroke="#9fb0a8" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-130" x2="0" y2="-110"/>
      <line x1="130" y1="0" x2="110" y2="0"/>
      <line x1="0" y1="130" x2="0" y2="110"/>
      <line x1="-130" y1="0" x2="-110" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-96" stroke="#f4efe6" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#ff6b35" stroke-width="9" stroke-linecap="round"/>
    <circle r="12" fill="#ff6b35"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="30" letter-spacing="8" fill="#ff6b35" font-weight="700">REPORTING FROM THE THRESHOLD</text>

  <!-- Wordmark -->
  <text x="76" y="330" font-family="Georgia, serif" font-size="150" fill="#f4efe6" font-weight="700">Zero</text>
  <text x="76" y="470" font-family="Georgia, serif" font-size="150" fill="#ff6b35" font-weight="700">Hour</text>

  <!-- Tagline -->
  <text x="80" y="560" font-family="Georgia, serif" font-size="42" font-style="italic" fill="#ffb020">The climate story, without distance.</text>

  <!-- Description -->
  <text x="80" y="628" font-family="system-ui, sans-serif" font-size="27" fill="#c3ccc6">Independent reporting through investigations,</text>
  <text x="80" y="666" font-family="system-ui, sans-serif" font-size="27" fill="#c3ccc6">local voices, and visual evidence.</text>
</svg>
