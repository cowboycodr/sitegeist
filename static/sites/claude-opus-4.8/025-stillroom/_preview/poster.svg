<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Stillroom — a quieter place inside your day.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#1c242c"/>
      <stop offset="55%" stop-color="#141a20"/>
      <stop offset="100%" stop-color="#0f1318"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#f4e0c6"/>
      <stop offset="60%" stop-color="#c39a6b"/>
      <stop offset="100%" stop-color="#9a7647"/>
    </radialGradient>
    <radialGradient id="sage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ba398" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#8ba398" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7b287" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#d7b287" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="250" cy="150" r="430" fill="url(#sage)"/>
  <circle cx="980" cy="820" r="430" fill="url(#sand)"/>

  <!-- Breathing orb motif -->
  <g transform="translate(600 430)">
    <circle r="300" fill="none" stroke="#d7b287" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle r="240" fill="none" stroke="#8ba398" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle r="185" fill="url(#sage)"/>
    <circle r="180" fill="none" stroke="#d7b287" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="118" fill="url(#core)"/>
    <ellipse cx="-34" cy="-40" rx="46" ry="34" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle" fill="#eef1ee" font-family="Iowan Old Style, Palatino, Georgia, serif">
    <text x="600" y="748" font-size="112" letter-spacing="2">Stillroom</text>
  </g>
  <text x="600" y="806" text-anchor="middle" fill="#d7b287"
        font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="10">A QUIETER PLACE INSIDE YOUR DAY</text>
  <text x="600" y="852" text-anchor="middle" fill="#8b968f"
        font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" letter-spacing="3">Breathwork &#183; Meditation &#183; Wellness</text>
</svg>
