<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Fellowship — Back the beautifully unreasonable. A venture studio for the physical world.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f0e5" />
      <stop offset="1" stop-color="#e9dfcd" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dd8a2c" stop-opacity="0.55" />
      <stop offset="1" stop-color="#dd8a2c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="28" y="28" width="1144" height="844" rx="26" fill="none" stroke="#d3c7b2" stroke-width="2" />

  <!-- orbit motif -->
  <g transform="translate(880 470)" opacity="0.9">
    <circle cx="0" cy="0" r="260" fill="url(#glow)" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#2f6f6a" stroke-width="2.5" opacity="0.55" />
    <ellipse cx="0" cy="0" rx="120" ry="46" fill="none" stroke="#2f6f6a" stroke-width="2.5" opacity="0.4" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#dd8a2c" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="200" ry="76" fill="none" stroke="#dd8a2c" stroke-width="2.5" opacity="0.4" />
    <circle cx="0" cy="0" r="288" fill="none" stroke="#12161f" stroke-width="2" opacity="0.18" />
    <circle cx="0" cy="0" r="26" fill="#12161f" />
    <circle cx="200" cy="0" r="15" fill="#dd8a2c" />
    <circle cx="-105" cy="-58" r="8" fill="#2f6f6a" />
  </g>

  <!-- header -->
  <g transform="translate(96 120)">
    <g>
      <circle cx="22" cy="22" r="20" fill="none" stroke="#12161f" stroke-width="2" opacity="0.7" />
      <ellipse cx="22" cy="22" rx="20" ry="8" fill="none" stroke="#12161f" stroke-width="2" opacity="0.5" />
      <circle cx="22" cy="22" r="5.5" fill="#12161f" />
      <circle cx="40" cy="19.5" r="3.4" fill="#dd8a2c" />
    </g>
    <text x="62" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#12161f">Fellowship</text>
  </g>

  <!-- eyebrow -->
  <text x="96" y="330" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="7" font-weight="700" fill="#b96d17">PRE-SEED / DEEP SYSTEMS</text>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#12161f">
    <text x="94" y="430" font-size="96" font-weight="700" letter-spacing="-2">Back the</text>
    <text x="94" y="530" font-size="96" font-weight="700" letter-spacing="-2">beautifully</text>
    <text x="94" y="630" font-size="96" font-weight="700" font-style="italic" fill="#b96d17" letter-spacing="-2">unreasonable.</text>
  </g>

  <!-- subline -->
  <text x="96" y="708" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#2b323f">An early-stage fund for technical founders building</text>
  <text x="96" y="746" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#2b323f">ambitious tools for the physical world.</text>

  <!-- pill -->
  <g transform="translate(96 792)">
    <rect x="0" y="0" width="230" height="56" rx="28" fill="#12161f" />
    <text x="115" y="37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f6f0e5">Venture Studio</text>
  </g>

  <text x="1104" y="838" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5c6270">fellowship-fund</text>
</svg>
