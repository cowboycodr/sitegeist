<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Fellowship — Gallery poster</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12161f; padding: 24px; }
    figure { margin: 0; width: min(100%, 900px); }
    img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7); }
    figcaption { color: #cfc6b6; font-family: Georgia, serif; font-style: italic; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <figure>
    <img src="poster.svg" alt="Fellowship gallery poster: Back the beautifully unreasonable." />
    <figcaption>Fellowship — a venture studio for the physical world.</figcaption>
  </figure>
</body>
</html>
