<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Kiln Coffee — Heat reveals character.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1a1310"/>
			<stop offset="1" stop-color="#120c0a"/>
		</linearGradient>
		<radialGradient id="glow" cx="78%" cy="30%" r="60%">
			<stop offset="0" stop-color="#e8632a" stop-opacity="0.34"/>
			<stop offset="1" stop-color="#e8632a" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#c24418"/>
			<stop offset="1" stop-color="#f0a54a"/>
		</linearGradient>
		<linearGradient id="area" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#e8632a" stop-opacity="0"/>
			<stop offset="1" stop-color="#e8632a" stop-opacity="0.4"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>

	<!-- frame -->
	<rect x="40" y="40" width="1120" height="820" rx="26" fill="none" stroke="rgba(246,239,228,0.14)" stroke-width="2"/>

	<!-- eyebrow -->
	<text x="96" y="150" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#f0a54a" font-weight="700">ROASTED THIS WEEK / BATCH 214</text>

	<!-- flame mark -->
	<g transform="translate(96 190)">
		<path d="M40 6c22 24 42 40 42 74a42 42 0 0 1-84 0c0-16 8-27 18-36C30 30 36 20 40 6Z" fill="url(#flame)"/>
		<path d="M40 62c11 12 19 21 19 34a19 19 0 0 1-38 0c0-9 5-15 11-21C36 68 38 66 40 62Z" fill="#f6efe4" opacity="0.9"/>
	</g>

	<!-- title -->
	<text x="94" y="420" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="128" font-weight="600" fill="#f6efe4">Heat reveals</text>
	<text x="94" y="560" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="128" font-weight="600" font-style="italic" fill="#e8632a">character.</text>

	<!-- lede -->
	<text x="96" y="650" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#d9cebb">Expressive coffees, developed with patient,</text>
	<text x="96" y="698" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#d9cebb">exact roast profiles.</text>

	<!-- roast curve motif -->
	<g transform="translate(96 740)">
		<line x1="0" y1="0" x2="1008" y2="0" stroke="rgba(246,239,228,0.14)" stroke-width="2"/>
		<path d="M0 -6 C220 -14 360 -60 560 -96 C740 -128 900 -140 1008 -150 L1008 0 L0 0 Z" fill="url(#area)"/>
		<path d="M0 -6 C220 -14 360 -60 560 -96 C740 -128 900 -140 1008 -150" fill="none" stroke="#e8632a" stroke-width="6" stroke-linecap="round"/>
		<circle cx="612" cy="-104" r="11" fill="#f0a54a" stroke="#120c0a" stroke-width="4"/>
	</g>

	<!-- brand wordmark -->
	<text x="1104" y="822" text-anchor="end" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="40" fill="#f6efe4">Kiln<tspan fill="#e8632a">Coffee</tspan></text>
</svg>
