<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Soft Power — Culture Magazine</title>
  <desc id="poster-desc">Poster for Soft Power, an independent culture magazine. Issue No. 12. The ideas shaping how we live.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8442b"/>
      <stop offset="0.55" stop-color="#b83a24"/>
      <stop offset="1" stop-color="#1c1a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#b98a2e" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#b98a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#f4efe6"/>

  <!-- top rule / masthead -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <line x1="80" y1="120" x2="1120" y2="120" stroke="#d8cfbe" stroke-width="2"/>
    <circle cx="104" cy="88" r="18" fill="none" stroke="#c8442b" stroke-width="3"/>
    <path d="M113 80c-2-2.4-5.1-3.8-8.7-3.8-5.5 0-9.5 3-9.5 7.5 0 4 2.9 6 8.4 7.2 4.2 1 5.7 1.9 5.7 3.8 0 2-1.9 3.2-4.9 3.2-3.2 0-5.7-1.4-7.5-3.6" fill="none" stroke="#1c1a17" stroke-width="4" stroke-linecap="round"/>
    <text x="140" y="98" font-size="34" font-weight="700" fill="#1c1a17" letter-spacing="0.5">Soft Power</text>
    <text x="1120" y="96" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" letter-spacing="5" fill="#4a453d">CULTURE MAGAZINE</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <circle cx="88" cy="228" r="9" fill="#c8442b"/>
    <text x="108" y="236" font-size="26" font-weight="700" letter-spacing="7" fill="#c8442b">ISSUE No. 12</text>
  </g>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1c1a17">
    <text x="76" y="360" font-size="118" font-weight="700" letter-spacing="-2">The ideas</text>
    <text x="76" y="478" font-size="118" font-weight="700" letter-spacing="-2">shaping how</text>
    <text x="76" y="596" font-size="118" font-weight="700" letter-spacing="-2">we live.</text>
  </g>

  <!-- subhead -->
  <text x="80" y="676" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" fill="#4a453d">Independent reporting on taste, influence, design,</text>
  <text x="80" y="712" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" fill="#4a453d">identity, and the forces behind culture.</text>

  <!-- feature plate motif -->
  <g transform="translate(80 762)">
    <rect width="1040" height="66" rx="33" fill="#1c1a17"/>
    <text x="34" y="42" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#f4efe6">Read the latest issue</text>
    <text x="1006" y="42" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#b98a2e">→ ARCHIVE</text>
  </g>

  <!-- decorative plate top-right -->
  <g transform="translate(760 150)">
    <rect width="360" height="300" rx="14" fill="url(#plate)"/>
    <rect width="360" height="300" rx="14" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="-20" y1="110" x2="380" y2="52"/>
      <line x1="-20" y1="170" x2="380" y2="112" opacity="0.7"/>
      <line x1="-20" y1="230" x2="380" y2="172" opacity="0.45"/>
    </g>
    <circle cx="268" cy="86" r="60" fill="#ffffff" opacity="0.85"/>
    <circle cx="268" cy="86" r="60" fill="url(#glow)"/>
  </g>
</svg>
