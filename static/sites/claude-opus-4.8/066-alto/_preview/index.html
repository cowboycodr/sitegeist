<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Alto — Gallery poster</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2c261e; padding: 24px; }
  figure { margin: 0; max-width: 1000px; width: 100%; }
  img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); }
  figcaption { color: #d9cfbf; font-family: Georgia, serif; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<figure>
  <img src="poster.svg" alt="Alto gallery poster: Room for your best thinking.">
  <figcaption>Alto — a 4:3 gallery poster</figcaption>
</figure>
</body>
</html>
