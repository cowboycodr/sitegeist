<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Alto — Room for your best thinking.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f3ea"/>
      <stop offset="1" stop-color="#efe4d2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ede0"/>
      <stop offset="1" stop-color="#e7d4bb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="820" rx="34" fill="none" stroke="#2c261e" stroke-width="3" opacity="0.55"/>

  <!-- eyebrow -->
  <text x="96" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="7" fill="#a85735" font-weight="bold">A BETTER PLACE TO WORK</text>

  <!-- brand mark -->
  <g transform="translate(96,196)">
    <path d="M0 92V52a46 46 0 0 1 92 0v40" fill="none" stroke="#c9744d" stroke-width="8" stroke-linecap="round"/>
    <path d="M46 92V22" fill="none" stroke="#2c261e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="210" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#2c261e">Alto</text>

  <!-- headline -->
  <text x="96" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="118" fill="#2c261e">Room for your</text>
  <text x="96" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-style="italic" fill="#a85735">best thinking.</text>

  <!-- tagline -->
  <text x="98" y="672" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#5c5346">Flexible studios, quiet rooms, and thoughtful hospitality.</text>

  <!-- arch motif -->
  <g transform="translate(760,540)">
    <rect x="0" y="0" width="110" height="300" rx="55" fill="url(#glass)" stroke="#2c261e" stroke-width="4"/>
    <rect x="130" y="-70" width="110" height="370" rx="55" fill="#c9744d" opacity="0.16" stroke="#2c261e" stroke-width="4"/>
    <rect x="260" y="-140" width="110" height="440" rx="55" fill="url(#glass)" stroke="#2c261e" stroke-width="4"/>
    <line x1="55" y1="80" x2="55" y2="290" stroke="#2c261e" stroke-width="2.5" opacity="0.35"/>
    <line x1="315" y1="-60" x2="315" y2="290" stroke="#2c261e" stroke-width="2.5" opacity="0.35"/>
    <circle cx="185" cy="120" r="34" fill="#c9744d" stroke="#2c261e" stroke-width="4"/>
  </g>

  <!-- footer pill -->
  <rect x="96" y="742" width="300" height="72" rx="36" fill="#c9744d"/>
  <text x="246" y="788" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Find a space</text>
  <text x="1104" y="800" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#5c5346">WORKSPACE</text>
</svg>
