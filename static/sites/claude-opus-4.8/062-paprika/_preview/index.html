<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Paprika — Poster preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1a12; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  figure { margin: 0; width: min(960px, 100%); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); border-radius: 12px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<main>
  <figure>
    <img src="poster.svg" alt="Paprika gallery poster: Dinner should feel alive." />
  </figure>
</main>
</body>
</html>
