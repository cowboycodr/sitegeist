<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="pt pd">
  <title id="pt">Paprika — Dinner should feel alive.</title>
  <desc id="pd">Promotional poster for Paprika, a food delivery service of bold chef-made meals from independent kitchens.</desc>
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#fff6ec"/>
      <stop offset="60%" stop-color="#ffe9d3"/>
      <stop offset="100%" stop-color="#f6d6b6"/>
    </radialGradient>
    <radialGradient id="plate" cx="40%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0dcc4"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d34121"/>
      <stop offset="100%" stop-color="#f0873a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- eyebrow -->
  <text x="96" y="150" font-family="Georgia, serif" font-size="30" letter-spacing="10" fill="#d34121" font-weight="bold">MADE NEARBY</text>

  <!-- headline -->
  <text x="92" y="300" font-family="Georgia, serif" font-size="128" font-weight="bold" fill="#2a1a12" letter-spacing="-2">Dinner should</text>
  <text x="92" y="430" font-family="Georgia, serif" font-size="128" font-weight="bold" fill="#2a1a12" letter-spacing="-2">feel <tspan fill="#d34121">alive</tspan>.</text>
  <rect x="330" y="405" width="285" height="22" rx="8" fill="#f2b431" opacity="0.55"/>

  <text x="96" y="520" font-family="Trebuchet MS, sans-serif" font-size="34" fill="#7a5c4b">Bold chef-made meals from independent kitchens,</text>
  <text x="96" y="565" font-family="Trebuchet MS, sans-serif" font-size="34" fill="#7a5c4b">delivered hot and ready for the table.</text>

  <!-- pill button -->
  <rect x="96" y="630" width="430" height="86" rx="43" fill="url(#band)"/>
  <text x="311" y="684" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Find tonight&#39;s dinner</text>

  <!-- plate motif -->
  <g transform="translate(870 470)">
    <circle r="330" fill="url(#plate)"/>
    <circle r="262" fill="none" stroke="#e7cba7" stroke-width="4"/>
    <path d="M0 -170c78 0 138 52 138 116 0 70-62 138-138 138s-138-68-138-138C-138 -118 -78 -170 0 -170z" fill="#c9412a"/>
    <path d="M0 -138c60 0 106 38 106 88 0 56-46 106-106 106s-106-50-106-106C-106 -100 -60 -138 0 -138z" fill="#e2683a"/>
    <circle cx="-46" cy="-62" r="22" fill="#8f2318"/>
    <circle cx="52" cy="-18" r="17" fill="#f4a24a"/>
    <circle cx="4" cy="46" r="15" fill="#7fae4b"/>
    <circle cx="-74" cy="18" r="12" fill="#f4c85a"/>
    <path d="M-26 -110c22 12 30 32 20 54" fill="none" stroke="#5f8a34" stroke-width="14" stroke-linecap="round"/>
    <!-- steam -->
    <path d="M-70 -196c-14 -20 6 -32 -8 -52" fill="none" stroke="#e9b48a" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 -206c-14 -20 6 -32 -8 -52" fill="none" stroke="#e9b48a" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
    <path d="M70 -196c-14 -20 6 -32 -8 -52" fill="none" stroke="#e9b48a" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- brand lockup -->
  <g transform="translate(96 802)">
    <path d="M20 4c14 0 21 9 21 19 0 5-2 9-4 12 11 6 18 17 18 29 0 16-14 26-35 26S-15 80-15 64c0-12 7-23 18-29-2-3-4-7-4-12C-1 13 6 4 20 4z" fill="#d34121" transform="scale(0.8)"/>
    <text x="60" y="40" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#a72d13">Paprika</text>
  </g>
</svg>
