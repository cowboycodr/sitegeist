<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Moss &amp; Matter — Materials that return to earth</title>
  <desc id="poster-desc">Gallery poster for Moss &amp; Matter, a biomaterials studio growing packaging, textiles, and interiors from mycelium and agricultural waste.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7ee"/>
      <stop offset="1" stop-color="#eee7d4"/>
    </linearGradient>
    <radialGradient id="dish" cx="42%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f7f4e8"/>
      <stop offset="0.7" stop-color="#e5dcc4"/>
      <stop offset="1" stop-color="#d3caae"/>
    </radialGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9db06a"/>
      <stop offset="1" stop-color="#b8794a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ambient spores -->
  <g fill="#6f8f4e" opacity="0.4">
    <circle cx="140" cy="180" r="4"/>
    <circle cx="1040" cy="150" r="3"/>
    <circle cx="1090" cy="620" r="4"/>
    <circle cx="90" cy="700" r="3"/>
    <circle cx="1010" cy="810" r="3.5"/>
    <circle cx="180" cy="470" r="3"/>
  </g>

  <!-- petri dish motif with mycelium -->
  <g transform="translate(830 470)">
    <circle r="270" fill="url(#dish)" stroke="#4a6b34" stroke-width="3" opacity="0.95"/>
    <circle r="230" fill="none" stroke="#4a6b34" stroke-width="2" stroke-dasharray="10 12" opacity="0.4"/>
    <g stroke="#4a6b34" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M0 0 L140 -70 M140 -70 L200 -100 M140 -70 L180 -20"/>
      <path d="M0 0 L-120 -110 M-120 -110 L-170 -150 M-120 -110 L-150 -60"/>
      <path d="M0 0 L-160 90 M-160 90 L-210 120 M-160 90 L-130 150"/>
      <path d="M0 0 L60 180 M60 180 L100 220 M60 180 L20 210"/>
      <path d="M0 0 L190 60 M190 60 L230 90"/>
    </g>
    <circle r="24" fill="#4a6b34"/>
    <g fill="#6f8f4e">
      <circle cx="200" cy="-100" r="9"/>
      <circle cx="-170" cy="-150" r="8"/>
      <circle cx="-210" cy="120" r="8"/>
      <circle cx="100" cy="220" r="9"/>
      <circle cx="230" cy="90" r="7"/>
    </g>
    <g fill="#b8794a" opacity="0.8">
      <circle cx="180" cy="-20" r="6"/>
      <circle cx="-150" cy="-60" r="6"/>
      <circle cx="-130" cy="150" r="6"/>
      <circle cx="20" cy="210" r="6"/>
    </g>
  </g>

  <!-- text block -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">
    <text x="90" y="150" font-family="ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif" font-size="26" letter-spacing="8" font-weight="700" fill="#4a6b34">GROWN, NOT MANUFACTURED</text>

    <text x="86" y="330" font-size="118" font-weight="600" fill="#1d2a1c">Moss &amp;</text>
    <text x="86" y="450" font-size="118" font-weight="600" fill="#1d2a1c">Matter</text>

    <rect x="92" y="486" width="360" height="12" rx="6" fill="url(#underline)" opacity="0.7"/>

    <text x="90" y="580" font-size="40" font-style="italic" fill="#4a6b34">Materials that return to earth.</text>

    <text x="90" y="655" font-family="ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif" font-size="27" fill="#5d6b52">Packaging, textiles, and interiors grown</text>
    <text x="90" y="694" font-family="ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif" font-size="27" fill="#5d6b52">from mycelium and agricultural waste.</text>
  </g>

  <!-- footer tags -->
  <g font-family="ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600">
    <g fill="#4a6b34">
      <rect x="90" y="770" width="230" height="52" rx="26" fill="#6f8f4e" opacity="0.18"/>
      <text x="118" y="804">Home-compostable</text>
    </g>
    <g fill="#b8794a">
      <rect x="340" y="770" width="210" height="52" rx="26" fill="#b8794a" opacity="0.16"/>
      <text x="368" y="804">Biomaterials studio</text>
    </g>
  </g>
</svg>
