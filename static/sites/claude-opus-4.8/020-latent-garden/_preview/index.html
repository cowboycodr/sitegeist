<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Latent Garden — Poster preview</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center;
			background: #0a120c; padding: 24px; }
		figure { margin: 0; max-width: 960px; width: 100%; }
		img { width: 100%; height: auto; display: block; border-radius: 12px;
			box-shadow: 0 30px 70px -30px rgba(0,0,0,0.9); }
		figcaption { color: #7fae5a; font-family: Georgia, serif; text-align: center;
			margin-top: 16px; font-size: 0.95rem; }
	</style>
</head>
<body>
	<figure>
		<img src="poster.svg" alt="Latent Garden gallery poster: an organic sprout motif over a dark botanical field with the tagline Intelligence should feel alive.">
		<figcaption>Gallery poster · 4:3 · authoring preview</figcaption>
	</figure>
</body>
</html>
