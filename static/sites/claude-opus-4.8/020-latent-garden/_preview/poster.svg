<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Latent Garden — Intelligence should feel alive.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0f1c13"/>
			<stop offset="1" stop-color="#0a120c"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.28" cy="0.34" r="0.8">
			<stop offset="0" stop-color="#a8e05f" stop-opacity="0.35"/>
			<stop offset="1" stop-color="#a8e05f" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#7fae5a"/>
			<stop offset="1" stop-color="#c9f26b"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>

	<!-- flow-field tendrils motif -->
	<g fill="none" stroke-linecap="round" opacity="0.85">
		<path d="M120 900 C 180 640 90 520 220 380 C 300 290 230 200 330 120" stroke="#7fae5a" stroke-width="3" opacity="0.55"/>
		<path d="M250 900 C 300 680 210 560 340 430 C 430 340 380 250 470 190" stroke="#a8e05f" stroke-width="3" opacity="0.5"/>
		<path d="M980 900 C 940 640 1060 520 940 380 C 860 280 950 200 860 120" stroke="#7fae5a" stroke-width="3" opacity="0.5"/>
		<path d="M1090 900 C 1040 700 1130 560 1010 440 C 930 360 1000 250 920 200" stroke="#c9f26b" stroke-width="2.5" opacity="0.4"/>
		<path d="M60 760 C 200 720 320 780 440 700" stroke="#c9f26b" stroke-width="1.5" opacity="0.3"/>
		<path d="M760 800 C 900 760 1040 820 1160 740" stroke="#c9f26b" stroke-width="1.5" opacity="0.3"/>
	</g>

	<!-- petals -->
	<g opacity="0.9">
		<circle cx="330" cy="120" r="10" fill="#c9f26b"/>
		<circle cx="470" cy="190" r="7" fill="#f0a6c0"/>
		<circle cx="860" cy="120" r="9" fill="#c9f26b"/>
		<circle cx="920" cy="200" r="6" fill="#f0a6c0"/>
	</g>

	<!-- central sprout mark -->
	<g transform="translate(600 300)">
		<path d="M0 250 C0 150 0 90 0 30" fill="none" stroke="url(#stem)" stroke-width="9" stroke-linecap="round"/>
		<path d="M0 150 C-70 130 -110 80 -95 -5 C-15 10 20 65 0 150 Z" fill="#a8e05f" opacity="0.9"/>
		<path d="M0 110 C70 90 110 40 95 -45 C15 -30 -20 25 0 110 Z" fill="#c9f26b" opacity="0.65"/>
		<circle cx="0" cy="-30" r="26" fill="#c9f26b"/>
		<circle cx="0" cy="-30" r="12" fill="#f0a6c0"/>
	</g>

	<!-- wordmark -->
	<text x="600" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#f3f1e3" letter-spacing="2">Latent Garden</text>
	<text x="600" y="712" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#c9f26b">Intelligence should feel alive.</text>

	<!-- eyebrow + category -->
	<text x="600" y="792" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" fill="#7fae5a" letter-spacing="10">CREATIVE INTELLIGENCE</text>
	<text x="600" y="838" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#cfd3bf" letter-spacing="4">AI RESEARCH STUDIO · GROWN, NOT MANUFACTURED</text>
</svg>
