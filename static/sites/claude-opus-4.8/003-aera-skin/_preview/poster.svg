<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Aera Skin — Your skin, in a softer light.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#f7ede2"/>
			<stop offset="1" stop-color="#efe6da"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
			<stop offset="0" stop-color="#f7e4d6"/>
			<stop offset="1" stop-color="#f7e4d6" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fffdf9"/>
			<stop offset="1" stop-color="#ecdfce"/>
		</linearGradient>
	</defs>

	<rect width="1200" height="900" fill="url(#bg)"/>
	<rect width="1200" height="900" fill="url(#glow)"/>
	<rect x="24" y="24" width="1152" height="852" rx="30" fill="none" stroke="#e2d6c7" stroke-width="2"/>

	<!-- eyebrow -->
	<g transform="translate(96 150)">
		<rect x="0" y="-6" width="42" height="2" fill="#b9765f"/>
		<text x="60" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="7" fill="#9c5c47">BARRIER-FIRST SKINCARE</text>
	</g>

	<!-- wordmark + headline -->
	<g transform="translate(94 260)">
		<circle cx="26" cy="-16" r="24" fill="none" stroke="#b9765f" stroke-width="2.5"/>
		<path d="M26 -38c-11 11-11 33 0 44 11-11 11-33 0-44Z" fill="#7f9179"/>
		<text x="70" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#2b2420">Aera <tspan font-style="italic" fill="#b9765f">Skin</tspan></text>
	</g>

	<text x="94" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#2b2420">Your skin, in a</text>
	<text x="94" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#2b2420"><tspan font-style="italic" fill="#9c5c47">softer</tspan> light.</text>

	<text x="96" y="620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#6a5f56">Clinical clarity. Tactile ritual. A quieter luxury.</text>

	<!-- pill button -->
	<g transform="translate(96 680)">
		<rect x="0" y="0" width="290" height="72" rx="36" fill="#2b2420"/>
		<text x="145" y="47" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f5efe7">Shop the ritual</text>
	</g>
	<g transform="translate(410 680)">
		<rect x="0.5" y="0.5" width="280" height="71" rx="36" fill="none" stroke="#c9b9a5" stroke-width="2"/>
		<text x="140" y="47" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#2b2420">Take the skin quiz</text>
	</g>

	<!-- bottle motif -->
	<g transform="translate(870 250)">
		<rect x="-30" y="-30" width="320" height="470" rx="40" fill="#f3e2d4"/>
		<rect x="-30" y="-30" width="320" height="470" rx="40" fill="#7f9179" opacity="0.08"/>
		<rect x="70" y="10" width="120" height="330" rx="30" fill="url(#bottle)" stroke="#e2d6c7" stroke-width="2"/>
		<rect x="102" y="-42" width="56" height="54" rx="12" fill="#9c5c47"/>
		<rect x="110" y="-66" width="40" height="28" rx="9" fill="#b9765f"/>
		<rect x="94" y="120" width="72" height="96" rx="14" fill="#f5efe7" stroke="#e2d6c7" stroke-width="1.5"/>
		<path d="M130 148c-12 12-12 32 0 46 12-14 12-34 0-46Z" fill="#7f9179"/>
		<text x="130" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#6a5f56">AERA</text>
	</g>
</svg>
