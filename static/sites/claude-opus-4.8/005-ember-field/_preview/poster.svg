<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ember and Field — small-batch coffee poster">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#2f1d14"/>
      <stop offset="55%" stop-color="#20120c"/>
      <stop offset="100%" stop-color="#160c08"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="64%" r="62%">
      <stop offset="0%" stop-color="#ffe0a0"/>
      <stop offset="42%" stop-color="#f2732a"/>
      <stop offset="100%" stop-color="#8a2410"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5561f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e5561f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a34"/>
      <stop offset="100%" stop-color="#331e15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- corner rule -->
  <rect x="56" y="56" width="1088" height="788" rx="26" fill="none" stroke="#e5561f" stroke-opacity="0.28" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="110" y="176" fill="#e6a94b" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9" font-weight="700">SMALL-BATCH COFFEE</text>

  <!-- wordmark -->
  <text x="106" y="330" fill="#f6efe3" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700">Ember</text>
  <text x="106" y="470" fill="#f6efe3" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700">
    <tspan fill="#e5561f" font-style="italic">&amp;</tspan> Field</text>

  <!-- tagline -->
  <text x="110" y="580" fill="#d9c8b4" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic">Roasted slowly. Remembered vividly.</text>

  <!-- description -->
  <text x="110" y="666" fill="#a8927e" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="28">Seasonal coffee traced from highland farms</text>
  <text x="110" y="706" fill="#a8927e" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="28">to small-batch roasts and the rituals they become.</text>

  <!-- category pill -->
  <rect x="110" y="756" width="188" height="54" rx="27" fill="#e5561f"/>
  <text x="204" y="791" fill="#1c110c" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="2">COFFEE</text>

  <!-- ember motif with cup -->
  <g transform="translate(910 470)">
    <circle cx="0" cy="0" r="300" fill="url(#halo)"/>

    <!-- steam -->
    <g stroke="#ffe9cf" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-46 -232 q28 -34 0 -68 q-28 -34 0 -68"/>
      <path d="M0 -252 q30 -36 0 -74 q-30 -36 0 -74"/>
      <path d="M46 -232 q28 -34 0 -68 q-28 -34 0 -68"/>
    </g>

    <!-- ember flame -->
    <path d="M0 -196 c48 78 96 108 96 188 a96 96 0 0 1 -192 0 c0 -46 16 -80 48 -124 0 46 16 62 32 78 16 -30 16 -78 16 -142z" fill="url(#ember)"/>

    <!-- cup -->
    <path d="M-150 60 h300 l-30 150 a70 70 0 0 1 -70 56 h-30 a70 70 0 0 1 -70 -56 z" fill="url(#cup)"/>
    <path d="M150 78 h44 a54 54 0 0 1 0 108 h-30" fill="none" stroke="#5a3626" stroke-width="22"/>
    <ellipse cx="0" cy="60" rx="150" ry="30" fill="#3a231b"/>
    <ellipse cx="0" cy="58" rx="150" ry="26" fill="#241009"/>
    <ellipse cx="-40" cy="284" rx="132" ry="24" fill="#160c08" opacity="0.6"/>
  </g>
</svg>
