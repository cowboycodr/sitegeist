<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Frame Zero</title><desc id="desc">Promotional poster for an independent film festival, featuring a glowing orbital frame.</desc>
  <defs>
    <radialGradient id="core"><stop offset="0" stop-color="#f2f0e9"/><stop offset=".03" stop-color="#101010"/><stop offset=".18" stop-color="#777"/><stop offset=".27" stop-color="#111"/><stop offset=".52" stop-color="#444"/><stop offset=".6" stop-color="#0b0b0b"/></radialGradient>
    <pattern id="scan" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 8.5h9" stroke="#fff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="#101010"/><rect width="1200" height="900" fill="url(#scan)"/>
  <rect x="35" y="35" width="1130" height="830" fill="none" stroke="#555"/>
  <text x="70" y="92" fill="#f2f0e9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">INDEPENDENT CINEMA / 2026</text>
  <text x="1128" y="92" fill="#d8ff43" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="end">08—14 AUG</text>
  <ellipse cx="830" cy="410" rx="270" ry="345" fill="none" stroke="#aaa" stroke-width="2" transform="rotate(41 830 410)"/>
