  <rect x="70" y="744" width="260" height="72" fill="#d8ff43"/><text x="94" y="789" fill="#101010" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="2">WATCH ONLINE ↗</text>
  <text x="1128" y="780" fill="#f2f0e9" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" letter-spacing="2">06 FILMS / 04 COUNTRIES</text>
