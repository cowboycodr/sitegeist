  <circle cx="830" cy="410" r="190" fill="url(#core)"/>
  <circle cx="830" cy="410" r="10" fill="#fff"/><circle cx="830" cy="410" r="45" fill="none" stroke="#fff" stroke-opacity=".6"/>
  <circle cx="650" cy="152" r="11" fill="#d8ff43"/><circle cx="650" cy="152" r="28" fill="#d8ff43" fill-opacity=".13"/>
  <text x="68" y="346" fill="#f2f0e9" font-family="Arial,Helvetica,sans-serif" font-size="148" font-weight="900" letter-spacing="-11">FRAME</text>
  <text x="145" y="472" fill="#d8ff43" font-family="Georgia,serif" font-size="150" font-style="italic" letter-spacing="-12">ZERO</text>
