<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Fellowship</title><desc id="desc">A graphic poster with orbit lines and the phrase Back the beautifully unreasonable.</desc>
  <rect width="1200" height="900" fill="#f1f0ea"/>
  <path d="M0 82H1200M80 0V900M1120 0V900" fill="none" stroke="#171916" stroke-opacity=".22"/>
  <g transform="translate(1005 227)" fill="none" stroke="#171916">
    <circle r="190"/><circle r="118" stroke-dasharray="8 9"/><circle r="65" fill="#d9ff43"/>
    <circle r="8" fill="#171916"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171916">
    <text x="80" y="53" font-size="19" font-weight="700" letter-spacing="2">FELLOWSHIP</text>
    <text x="1120" y="53" text-anchor="end" font-size="11" letter-spacing="2">PRE-SEED / DEEP SYSTEMS</text>
    <text x="80" y="320" font-size="135" font-weight="700" letter-spacing="-8">BACK THE</text>
    <text x="80" y="490" font-family="Georgia, serif" font-size="160" font-style="italic" fill="#3157ff" letter-spacing="-8">beautifully</text>
    <text x="80" y="640" font-size="132" font-weight="700" letter-spacing="-8">UNREASONABLE.</text>
    <text x="82" y="760" font-family="Georgia, serif" font-size="25">For technical founders building ambitious tools</text>
    <text x="82" y="794" font-family="Georgia, serif" font-size="25">for the physical world.</text>
    <circle cx="1050" cy="753" r="74" fill="#d9ff43" stroke="#171916"/>
    <text x="1050" y="746" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5">MEET THE</text>
    <text x="1050" y="766" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5">PORTFOLIO ↓</text>
    <text x="80" y="860" font-size="10" letter-spacing="2">FEL—001 / EST. 2026</text>
    <text x="1120" y="860" text-anchor="end" font-size="10" letter-spacing="2">CHICAGO · SF · ANYWHERE</text>
  </g>
