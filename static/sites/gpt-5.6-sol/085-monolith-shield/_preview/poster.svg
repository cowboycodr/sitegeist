<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Monolith Shield</title><desc id="d">Promotional poster featuring a luminous cybersecurity radar and the line Know what touches your systems.</desc>
