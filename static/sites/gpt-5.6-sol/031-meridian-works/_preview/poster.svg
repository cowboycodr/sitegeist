<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Works</title><desc id="desc">Promotional artwork for an independent watchmaker, featuring a black mechanical watch dial on warm ivory.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#f7f3ea"/><stop offset="1" stop-color="#d5d0c5"/></radialGradient><radialGradient id="dial"><stop stop-color="#30332d"/><stop offset=".7" stop-color="#10120f"/><stop offset="1"/></radialGradient><linearGradient id="steel" x2="1" y2="1"><stop stop-color="#f1efe7"/><stop offset=".22" stop-color="#4d5049"/><stop offset=".5" stop-color="#d8d7d1"/><stop offset=".74" stop-color="#343631"/><stop offset="1" stop-color="#b9b8b1"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="24"/></filter></defs>
  <rect width="1200" height="900" fill="url(#bg)"/><circle cx="796" cy="415" r="370" fill="none" stroke="#151713" stroke-opacity=".1"/><circle cx="796" cy="415" r="305" fill="none" stroke="#151713" stroke-opacity=".07"/>
  <text x="75" y="90" font-family="Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="4" fill="#151713">INDEPENDENT WATCHMAKING</text><line x1="75" y1="112" x2="445" y2="112" stroke="#151713" stroke-opacity=".35"/>
  <text x="74" y="255" font-family="Georgia,serif" font-size="100" letter-spacing="-5" fill="#151713">Time,</text><text x="74" y="350" font-family="Georgia,serif" font-size="100" font-style="italic" letter-spacing="-5" fill="#b58b52">engineered</text><text x="74" y="445" font-family="Georgia,serif" font-size="100" letter-spacing="-5" fill="#151713">into character.</text>
  <text x="80" y="665" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#151713">SERIES 01  /  36 PIECES</text><text x="80" y="708" font-family="Georgia,serif" font-size="23" fill="#5a5b54">Precise movements.</text><text x="80" y="738" font-family="Georgia,serif" font-size="23" fill="#5a5b54">Enduring materials.</text><text x="80" y="768" font-family="Georgia,serif" font-size="23" fill="#5a5b54">Patient assembly.</text>
  <ellipse cx="875" cy="750" rx="230" ry="52" fill="#151713" opacity=".25" filter="url(#shadow)"/>
  <g transform="translate(855 435) rotate(8)"><rect x="-103" y="-430" width="206" height="860" rx="44" fill="#211f1c"/><rect x="-88" y="-415" width="176" height="830" rx="34" fill="none" stroke="#8b7659" stroke-opacity=".45" stroke-dasharray="7 7"/><circle r="264" fill="url(#steel)"/><circle r="234" fill="#1c1e19"/><circle r="218" fill="url(#dial)" stroke="#b58b52" stroke-opacity=".45" stroke-width="2"/>
  <g stroke="#c6a76c" stroke-width="5"><line y1="-195" y2="-166"/><line y1="195" y2="166"/><line x1="-195" x2="-166"/><line x1="195" x2="166"/><line transform="rotate(30)" y1="-195" y2="-176"/><line transform="rotate(60)" y1="-195" y2="-176"/><line transform="rotate(120)" y1="-195" y2="-176"/><line transform="rotate(150)" y1="-195" y2="-176"/><line transform="rotate(210)" y1="-195" y2="-176"/><line transform="rotate(240)" y1="-195" y2="-176"/><line transform="rotate(300)" y1="-195" y2="-176"/><line transform="rotate(330)" y1="-195" y2="-176"/></g>
  <text y="-93" text-anchor="middle" fill="#d0b77f" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="5">MERIDIAN</text><text y="-67" text-anchor="middle" fill="#998763" font-family="Georgia,serif" font-size="13" letter-spacing="4">WORKS</text>
  <line y1="4" y2="-113" stroke="#d2bb82" stroke-width="8" transform="rotate(-48)"/><line y1="5" y2="-162" stroke="#d2bb82" stroke-width="4" transform="rotate(42)"/><line y1="16" y2="-180" stroke="#a74d39" stroke-width="2" transform="rotate(174)"/><circle r="12" fill="#c6a76c"/><circle cy="96" r="55" fill="none" stroke="#69675c"/><line y1="96" y2="64" stroke="#a74d39" stroke-width="2" transform="rotate(70 0 96)"/><text y="181" text-anchor="middle" fill="#706e63" font-family="Arial,sans-serif" font-size="8" letter-spacing="3">MECHANICAL · 21 JEWELS</text></g>
  <g transform="translate(75 820)" fill="none" stroke="#151713" stroke-width="2"><circle cx="18" cy="18" r="17"/><path d="M10 25V11l8 10 8-10v14M18 6v8"/></g><text x="120" y="843" font-family="Arial,sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#151713">MERIDIAN</text><text x="238" y="843" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#151713">Works</text><text x="1120" y="843" text-anchor="end" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#151713">M—01 / OBSIDIAN</text>
