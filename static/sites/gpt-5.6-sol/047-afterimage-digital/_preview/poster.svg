<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Afterimage Digital — Art beyond the frame</title>
  <desc id="desc">A promotional poster with luminous overlapping colour fields on black.</desc>
  <defs>
    <radialGradient id="violet"><stop offset="0" stop-color="#fff"/><stop offset=".06" stop-color="#7efff2"/><stop offset=".22" stop-color="#7461ff"/><stop offset=".68" stop-color="#6e22ca" stop-opacity=".32"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient>
    <radialGradient id="lime"><stop offset="0" stop-color="#f8ffc9"/><stop offset=".12" stop-color="#d9ff43"/><stop offset=".45" stop-color="#37bd91" stop-opacity=".66"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop offset="0" stop-color="#ffdec7"/><stop offset=".14" stop-color="#ff6ea9"/><stop offset=".65" stop-color="#a52c9a" stop-opacity=".25"/><stop offset="1" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1H6" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="#08090b"/>
  <rect width="1200" height="900" fill="url(#lines)"/>
  <circle cx="824" cy="395" r="415" fill="url(#violet)"/>
  <circle cx="568" cy="740" r="300" fill="url(#lime)"/>
  <circle cx="1055" cy="700" r="210" fill="url(#pink)"/>
  <circle cx="824" cy="395" r="120" fill="none" stroke="#ccfff9" stroke-width="2" opacity=".9"/>
  <circle cx="824" cy="395" r="245" fill="none" stroke="#d9ff43" stroke-width="2" opacity=".72"/>
  <circle cx="824" cy="395" r="365" fill="none" stroke="#ff63bb" opacity=".5"/>
  <circle cx="824" cy="395" r="26" fill="#fff" filter="url(#glow)"/>
  <g fill="#f2f0e9" font-family="Arial,Helvetica,sans-serif">
    <circle cx="62" cy="61" r="12" fill="none" stroke="#f2f0e9"/><circle cx="62" cy="61" r="4" fill="#d9ff43"/>
    <text x="88" y="69" font-size="25" font-weight="700" letter-spacing="-1">Afterimage</text><text x="223" y="69" font-size="25" fill="#86868c">Digital</text>
    <text x="1138" y="68" text-anchor="end" font-size="15" letter-spacing="3">EXHIBITION 017</text>
    <text x="58" y="370" font-size="124" font-weight="700" letter-spacing="-8">Art beyond</text>
    <text x="158" y="483" font-family="Georgia,serif" font-style="italic" font-size="132" letter-spacing="-7" fill="none" stroke="#f2f0e9" stroke-width="2">the frame.</text>
    <text x="60" y="808" font-size="16" letter-spacing="3">RESIDUAL LIGHT</text>
    <text x="60" y="844" font-size="14" fill="#a7a7ad">04—28 JULY 2026  ·  CHICAGO / ONLINE</text>
    <text x="1138" y="844" text-anchor="end" font-size="15" font-weight="700" letter-spacing="2" fill="#d9ff43">ENTER THE EXHIBITION ↘</text>
  </g>
</svg>
