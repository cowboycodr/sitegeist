<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Drift — A softer landing for your day</title>
  <desc id="desc">Promotional artwork with a luminous moon, gentle orbit lines, and the Drift sleep companion wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f3e9"/><stop offset=".6" stop-color="#ede5f5"/><stop offset="1" stop-color="#d9cdf1"/></linearGradient>
    <radialGradient id="moon" cx="32%" cy="27%" r="78%"><stop stop-color="#fffef9"/><stop offset=".68" stop-color="#f5f0f4"/><stop offset="1" stop-color="#d9cdea"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#594987" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <path d="M0 0h620c80 156 94 325 42 506-46 161-126 293-240 394H0Z" fill="#f8f4eb" opacity=".78"/>
  <g fill="none" stroke="#6d608e" stroke-opacity=".17">
    <circle cx="838" cy="444" r="365"/>
    <circle cx="838" cy="444" r="274"/>
    <circle cx="838" cy="444" r="205"/>
  </g>
  <circle cx="838" cy="444" r="260" fill="url(#halo)" filter="url(#blur)"/>
  <circle cx="838" cy="444" r="190" fill="url(#moon)" filter="url(#shadow)"/>
  <circle cx="780" cy="490" r="24" fill="#9e8cc5" opacity=".11"/>
  <circle cx="892" cy="365" r="15" fill="#fff" opacity=".72"/>
  <circle cx="904" cy="518" r="12" fill="#9581bc" opacity=".08"/>
  <g fill="#665781" font-family="Georgia, serif"><text x="1052" y="222" font-size="30">✦</text><text x="631" y="279" font-size="23">✧</text><text x="1070" y="682" font-size="38">·</text></g>
  <g transform="translate(82 75)" fill="#25213f">
    <path d="M38 32A29 29 0 0 1 14 3a27 27 0 1 0 24 29Z"/>
    <text x="55" y="31" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-2">drift</text>
  </g>
  <text x="82" y="274" fill="#25213f" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">TONIGHT BEGINS HERE</text>
  <line x1="82" y1="245" x2="123" y2="245" stroke="#25213f"/>
  <text x="78" y="374" fill="#25213f" font-family="Georgia, serif" font-size="77" letter-spacing="-3">A softer</text>
  <text x="78" y="449" fill="#25213f" font-family="Georgia, serif" font-size="77" letter-spacing="-3">landing for</text>
  <text x="78" y="524" fill="#8674cc" font-family="Georgia, serif" font-size="77" font-style="italic" letter-spacing="-3">your day.</text>
  <text x="83" y="588" fill="#6f6981" font-family="Arial, sans-serif" font-size="17">Sound, breath, and quiet cues</text>
  <text x="83" y="616" fill="#6f6981" font-family="Arial, sans-serif" font-size="17">for an easier night.</text>
  <g transform="translate(82 692)">
    <rect width="232" height="60" rx="30" fill="#25213f"/>
    <text x="28" y="37" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">BEGIN TONIGHT</text>
    <text x="193" y="38" fill="#fff" font-family="Arial, sans-serif" font-size="20">↗</text>
  </g>
  <g transform="translate(726 631)">
    <rect width="244" height="101" rx="15" fill="#fff" fill-opacity=".65" stroke="#fff"/>
    <text x="20" y="28" fill="#6f6981" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">TONIGHT'S DRIFT</text>
    <text x="184" y="31" fill="#25213f" font-family="Georgia, serif" font-size="23">18 min</text>
    <rect x="20" y="48" width="204" height="4" rx="2" fill="#d8d0e2"/><rect x="20" y="48" width="132" height="4" rx="2" fill="#8674cc"/>
    <text x="20" y="77" fill="#6f6981" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">BEGIN</text>
    <text x="167" y="80" fill="#25213f" font-family="Arial, sans-serif" font-size="16" font-weight="700">10:12 PM</text>
  </g>
  <text x="1117" y="833" fill="#6e6484" font-family="Georgia, serif" font-style="italic" font-size="16" text-anchor="end">Your evening, gently re-tuned.</text>
</svg>
