<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Maison Nocturne — Collection XII</title>
  <desc id="desc">Promotional poster featuring sculptural nocturnal silhouettes beneath an oxblood moon.</desc>
  <defs>
    <radialGradient id="moon" cx="38%" cy="32%" r="68%"><stop stop-color="#a64145"/><stop offset=".55" stop-color="#711820"/><stop offset="1" stop-color="#351015"/></radialGradient>
    <linearGradient id="blackDress" x1="0" x2="1"><stop stop-color="#060606"/><stop offset=".38" stop-color="#4b4540"/><stop offset=".47" stop-color="#080808"/><stop offset=".74" stop-color="#292623"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <linearGradient id="redDress" x1="0" x2="1"><stop stop-color="#3b0a10"/><stop offset=".35" stop-color="#8e2831"/><stop offset=".48" stop-color="#31080d"/><stop offset=".72" stop-color="#701820"/><stop offset="1" stop-color="#210609"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#171512"/>
  <path d="M0 117H1200M86 0V900M1114 0V900" stroke="#eee9df" stroke-opacity=".16"/>
  <circle cx="863" cy="426" r="320" fill="url(#moon)"/>
  <text x="987" y="720" fill="#eee9df" fill-opacity=".07" font-family="Georgia,serif" font-size="315" text-anchor="middle">XII</text>
  <g>
    <ellipse cx="825" cy="305" rx="31" ry="40" fill="#2b211d"/>
    <path d="M756 345 892 345 935 405 909 541 1010 900 657 900 741 539 714 405Z" fill="url(#blackDress)"/>
    <path d="m756 352 68 76 68-76-26 131-42-36-43 36Z" fill="#080808"/>
  </g>
  <g>
    <ellipse cx="577" cy="429" rx="23" ry="31" fill="#2b211d"/>
    <path d="M520 457 624 457 667 492 642 628 725 900 445 900 508 625 480 494Z" fill="url(#redDress)"/>
    <path d="m511 460 122 18-55 110-24-70Z" fill="#5b141a"/>
  </g>
  <text x="86" y="96" fill="#eee9df" font-family="Georgia,serif" font-size="31">MAISON</text>
  <text x="110" y="127" fill="#eee9df" font-family="Georgia,serif" font-size="31" font-style="italic">NOCTURNE</text>
  <text x="86" y="272" fill="#eee9df" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">COLLECTION XII · PARIS</text>
  <text x="82" y="384" fill="#eee9df" font-family="Georgia,serif" font-size="82" letter-spacing="-4">TAILORED</text>
  <text x="82" y="468" fill="#eee9df" font-family="Georgia,serif" font-size="82" letter-spacing="-4">FOR THE HOURS</text>
  <text x="82" y="552" fill="#b49b70" font-family="Georgia,serif" font-size="87" font-style="italic" letter-spacing="-4">UNSEEN.</text>
  <line x1="86" y1="768" x2="326" y2="768" stroke="#eee9df" stroke-opacity=".55"/>
  <text x="86" y="798" fill="#eee9df" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">PARIS · EST. 1996</text>
  <text x="1114" y="812" fill="#eee9df" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" text-anchor="end">MAISONNOCTURNE</text>
