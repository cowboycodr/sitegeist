    <text x="60" y="200" font-family="Georgia, serif" font-size="118" letter-spacing="-7">Intelligence</text>
    <text x="156" y="306" font-family="Georgia, serif" font-style="italic" font-size="118" letter-spacing="-7">should feel alive.</text>
    <line x1="60" y1="674" x2="1140" y2="674" stroke="#153128" stroke-width="2"/>
    <text x="60" y="724" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CREATIVE INTELLIGENCE</text>
    <text x="60" y="785" font-family="Georgia, serif" font-size="31">Organic simulations · open essays</text>
    <text x="60" y="825" font-family="Georgia, serif" font-size="31">and many small, lively questions.</text>
