<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Soft Power — Issue No. 12</title>
  <desc id="desc">Promotional artwork with bold editorial typography and overlapping fields of coral, blue, acid yellow, and ink.</desc>
  <rect width="1200" height="900" fill="#f2efea"/>
  <rect x="690" width="510" height="900" fill="#d7e36c"/>
  <circle cx="775" cy="245" r="310" fill="#f06f55"/>
  <circle cx="1120" cy="440" r="340" fill="#4363c7"/>
  <circle cx="844" cy="450" r="142" fill="#11120f"/>
  <path d="M0 92H1200M0 825H1200" stroke="#11120f" stroke-width="2"/>
  <text x="55" y="58" fill="#11120f" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ISSUE NO. 12</text>
  <text x="1145" y="58" text-anchor="end" fill="#11120f" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">SUMMER 2026</text>
  <text x="55" y="255" fill="#11120f" font-family="Georgia, serif" font-size="186" letter-spacing="-13">Soft</text>
  <text x="55" y="418" fill="#4363c7" font-family="Georgia, serif" font-size="186" font-style="italic" letter-spacing="-13">Power</text>
  <text x="60" y="575" fill="#11120f" font-family="Georgia, serif" font-size="50">The ideas shaping</text>
  <text x="60" y="632" fill="#11120f" font-family="Georgia, serif" font-size="50">how we live.</text>
  <text x="60" y="765" fill="#11120f" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">DESIGN  ✦  IDENTITY  ✦  CITIES  ✦  MEDIA</text>
  <text x="55" y="865" fill="#11120f" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">INDEPENDENT CULTURE MAGAZINE</text>
  <text x="1145" y="865" text-anchor="end" fill="#11120f" font-family="Georgia, serif" font-size="22" font-style="italic">The shape of influence</text>
</svg>
