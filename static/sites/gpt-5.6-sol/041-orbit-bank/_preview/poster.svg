    <text x="23" y="123" fill="#181819" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="2">OPEN AN ACCOUNT  ↗</text>
  </g>
  <text x="1132" y="825" fill="#76767a" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">MONEY IN MOTION</text>
