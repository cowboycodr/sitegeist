<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Orbit — Money that moves with you</title>
  <desc id="desc">A dark promotional poster with an Orbit bank card, lime orbital rings, and the Orbit wordmark.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9ff45"/><stop offset="1" stop-color="#91c91d"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#181819"/>
  <circle cx="915" cy="310" r="270" fill="#252528"/>
  <g fill="none" stroke="#f2efe6" stroke-opacity=".14" stroke-width="2">
    <ellipse cx="800" cy="445" rx="570" ry="230" transform="rotate(-18 800 445)"/>
    <ellipse cx="800" cy="445" rx="475" ry="175" transform="rotate(23 800 445)"/>
    <ellipse cx="800" cy="445" rx="255" ry="455" transform="rotate(48 800 445)"/>
  </g>
  <circle cx="1110" cy="320" r="16" fill="#c9ff45"/>
  <circle cx="564" cy="708" r="8" fill="#bea2e8"/>
  <g transform="translate(68 60)" fill="none" stroke="#f2efe6" stroke-width="4">
    <circle cx="23" cy="23" r="9"/><ellipse cx="23" cy="23" rx="22" ry="9" transform="rotate(-28 23 23)"/>
  </g>
  <text x="130" y="96" fill="#f2efe6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="8">ORBIT</text>
  <text x="70" y="195" fill="#98978f" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5">BANKING WITHOUT GRAVITY</text>
  <text x="66" y="315" fill="#f2efe6" font-family="Georgia, Times, serif" font-size="100" letter-spacing="-5">Money that</text>
  <text x="66" y="410" fill="#f2efe6" font-family="Georgia, Times, serif" font-size="100" letter-spacing="-5">moves</text>
  <text x="340" y="410" fill="#c9ff45" font-family="Georgia, Times, serif" font-size="100" font-style="italic" letter-spacing="-5">with you.</text>
  <g transform="translate(703 470) rotate(-11)" filter="url(#shadow)">
    <rect width="400" height="250" rx="23" fill="#29292c" stroke="#444448"/>
    <g transform="translate(27 26)" fill="none" stroke="#c9ff45" stroke-width="2.5"><circle cx="17" cy="17" r="7"/><ellipse cx="17" cy="17" rx="16" ry="7" transform="rotate(-28 17 17)"/></g>
    <text x="73" y="54" fill="#f2efe6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="4">ORBIT</text>
    <rect x="29" y="105" width="48" height="35" rx="6" fill="#d6b760"/>
    <path d="M29 116h48M29 128h48M45 105v35M61 105v35" stroke="#9e812e"/>
    <text x="29" y="190" fill="#f2efe6" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">5821  ••••  ••••  1048</text>
    <text x="29" y="222" fill="#8b8b8e" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3">WORLD DEBIT</text>
    <circle cx="345" cy="210" r="15" fill="#f2efe6" fill-opacity=".8"/><circle cx="365" cy="210" r="15" fill="#c9ff45" fill-opacity=".8"/>
  </g>
