<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
 <title id="title">Plane Object</title><desc id="desc">Promotional poster featuring an orange modular console and bold typographic forms.</desc>
 <rect width="1200" height="900" fill="#f2f0e9"/><rect x="0" width="1200" height="78" fill="#171814"/>
 <text x="54" y="51" fill="#f2f0e9" font-family="Arial,sans-serif" font-size="22" font-weight="700">PLANE / OBJECT</text><circle cx="254" cy="45" r="6" fill="#e8ff49"/>
 <text x="1145" y="50" text-anchor="end" fill="#f2f0e9" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">OBJECTS FOR MODERN ROOMS</text>
 <rect y="78" width="1200" height="590" fill="#65635b"/><path d="M0 575 L1200 510 L1200 668 L0 668Z" fill="#77746b"/>
 <g transform="translate(650 215)" stroke="#8a351c" stroke-width="5" filter="url(#s)"><path d="M0 35 L420 10 L420 91 L0 116Z" fill="#d25e36"/><path d="M0 225 L420 200 L420 270 L0 295Z" fill="#d25e36"/><path d="M0 105 L58 102 L58 400 L0 405Z" fill="#d25e36"/><path d="M362 83 L420 80 L420 380 L362 385Z" fill="#d25e36"/></g>
