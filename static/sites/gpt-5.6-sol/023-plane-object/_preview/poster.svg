 <text x="48" y="224" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="103" font-weight="800" letter-spacing="-7">NOTHING</text><text x="48" y="319" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="103" font-weight="800" letter-spacing="-7">TO HIDE.</text>
 <text x="54" y="390" fill="#f7f5ee" font-family="Georgia,serif" font-size="27" font-style="italic">Fewer parts. More possibilities.</text>
 <rect y="668" width="1200" height="52" fill="#e8ff49"/><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">FLAT PACK, NEVER FLAT  ✳  MADE TO BE REMADE  ✳  NO GLUE. NO MYSTERY.</text>
