<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Aera Skin</title><desc id="desc">A warm editorial poster featuring the Aera Cloud Milk bottle and the words Your skin, in a softer light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#e9dfd2"/><stop offset=".58" stop-color="#d7bea9"/><stop offset="1" stop-color="#8b988e"/></linearGradient>
    <linearGradient id="glass"><stop stop-color="#d5cbbc"/><stop offset=".42" stop-color="#fffaf1"/><stop offset="1" stop-color="#b7afa2"/></linearGradient>
    <linearGradient id="cap"><stop stop-color="#59655e"/><stop offset=".5" stop-color="#8c978e"/><stop offset="1" stop-color="#4a5750"/></linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%"><stop stop-color="#fff9ef"/><stop offset=".55" stop-color="#dfcdb9"/><stop offset="1" stop-color="#8a978d"/></radialGradient>
    <filter id="shadow" x="-50%" y="-40%" width="200%" height="220%"><feDropShadow dx="28" dy="35" stdDeviation="22" flood-color="#26312d" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="855" cy="380" r="280" fill="#f2e6d6" opacity=".56"/>
  <g fill="none" stroke="#fff8ea" stroke-opacity=".55" stroke-width="2">
    <ellipse cx="850" cy="400" rx="410" ry="130" transform="rotate(-25 850 400)"/><ellipse cx="850" cy="400" rx="410" ry="130" transform="rotate(25 850 400)"/>
  </g>
  <text x="70" y="70" fill="#202b26" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="8">AERA</text>
  <text x="168" y="55" fill="#202b26" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">SKIN</text>
  <text x="73" y="180" fill="#202b26" font-family="Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="4">BARRIER-FIRST SKINCARE</text>
  <text x="68" y="295" fill="#202b26" font-family="Georgia,serif" font-size="90" letter-spacing="-4">Your skin,</text>
  <text x="68" y="388" fill="#202b26" font-family="Georgia,serif" font-size="90" letter-spacing="-4">in a <tspan fill="#a66f52" font-style="italic">softer</tspan></text>
  <text x="68" y="481" fill="#202b26" font-family="Georgia,serif" font-size="90" letter-spacing="-4">light.</text>
  <text x="74" y="575" fill="#3f4944" font-family="Arial,sans-serif" font-size="17">Clinical clarity. Tactile ritual.</text>
  <text x="74" y="602" fill="#3f4944" font-family="Arial,sans-serif" font-size="17">A quieter kind of luxury.</text>
  <g filter="url(#shadow)">
    <ellipse cx="874" cy="800" rx="245" ry="62" fill="#cbbcac"/>
    <rect x="790" y="307" width="155" height="112" rx="7" fill="url(#cap)"/>
    <rect x="821" y="406" width="93" height="49" fill="#ede7dd"/>
    <rect x="731" y="443" width="273" height="382" rx="36" fill="url(#glass)"/>
    <text x="868" y="570" fill="#202b26" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="8">AERA</text>
    <text x="868" y="655" fill="#202b26" text-anchor="middle" font-family="Georgia,serif" font-size="16" letter-spacing="4">CLOUD MILK</text>
    <text x="868" y="755" fill="#202b26" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">BARRIER ESSENCE</text>
    <text x="868" y="773" fill="#202b26" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">100 ML / 3.4 FL OZ</text>
  </g>
  <circle cx="1090" cy="135" r="62" fill="url(#orb)"/>
  <circle cx="108" cy="782" r="19" fill="#829086"/><circle cx="147" cy="782" r="19" fill="#c59878"/><circle cx="186" cy="782" r="19" fill="#f6eee3"/>
  <text x="1088" y="850" fill="#202b26" text-anchor="end" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">THE QUIET RITUAL · 01</text>
</svg>
