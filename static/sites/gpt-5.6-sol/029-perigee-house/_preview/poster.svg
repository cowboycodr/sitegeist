 <text x="70" y="270" fill="#eae8df" font-family="Georgia,serif" font-size="82" letter-spacing="-3">EARTH HAS</text><text x="70" y="355" fill="#eae8df" font-family="Georgia,serif" font-size="82" letter-spacing="-3">NEVER LOOKED</text><text x="70" y="440" fill="#e36b4d" font-family="Georgia,serif" font-size="82" font-style="italic" letter-spacing="-3">THIS GOOD.</text>
