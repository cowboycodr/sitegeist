<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Future Archive</title>
  <desc id="desc">Promotional poster for Future Archive, featuring a vivid archival card and the words save what tomorrow should remember.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#19211c" stroke-opacity=".11" stroke-width="1"/></pattern>
    <pattern id="bars" width="17" height="40" patternUnits="userSpaceOnUse"><path d="M0 0h4v40H0zm8 0h2v40H8zm13 0h3v40h-3z" fill="#19211c"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="#eee9dc"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <g fill="#19211c" font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="72" font-size="25" font-weight="700">FUTURE ARCHIVE</text>
    <text x="1136" y="69" text-anchor="end" font-family="Courier New, monospace" font-size="13">MEMORY INFRASTRUCTURE / 067</text>
  </g>
  <path d="M64 92h1072" stroke="#19211c"/>
  <g transform="translate(695 124) rotate(6 190 275)">
    <rect x="18" y="22" width="380" height="550" fill="#19211c"/>
    <rect width="380" height="550" fill="#d9ff43" stroke="#19211c" stroke-width="3"/>
    <g fill="#19211c" font-family="Courier New, monospace" font-size="12"><text x="24" y="37">FA—00067</text><text x="356" y="37" text-anchor="end">PERMANENT</text></g>
    <g transform="translate(85 105)" fill="#19211c">
      <circle cx="30" cy="30" r="28"/><circle cx="105" cy="30" r="27" fill="none" stroke="#19211c" stroke-width="4"/><circle cx="180" cy="30" r="28"/>
      <circle cx="30" cy="105" r="27" fill="none" stroke="#19211c" stroke-width="4"/><circle cx="105" cy="105" r="28"/><circle cx="180" cy="105" r="28"/>
      <circle cx="30" cy="180" r="28"/><circle cx="105" cy="180" r="28"/><circle cx="180" cy="180" r="27" fill="none" stroke="#19211c" stroke-width="4"/>
    </g>
    <text x="24" y="407" fill="#19211c" font-family="Georgia, Times New Roman, serif" font-size="41">Culture is a</text>
    <text x="24" y="450" fill="#19211c" font-family="Georgia, Times New Roman, serif" font-size="41">living file.</text>
    <rect x="24" y="486" width="332" height="35" fill="url(#bars)"/>
  </g>
  <g fill="none" stroke="#cb4b30" stroke-width="2">
    <ellipse cx="868" cy="390" rx="290" ry="100" transform="rotate(-27 868 390)"/>
    <ellipse cx="868" cy="390" rx="260" ry="77" transform="rotate(49 868 390)"/>
  </g>
  <g fill="#19211c" font-family="Georgia, Times New Roman, serif" font-size="85" letter-spacing="-4">
    <text x="64" y="260">Save what</text><text x="64" y="343">tomorrow</text><text x="64" y="426">should</text>
  </g>
  <text x="64" y="509" fill="#cb4b30" font-family="Georgia, Times New Roman, serif" font-size="85" font-style="italic" letter-spacing="-4">remember.</text>
  <g font-family="Courier New, monospace" fill="#19211c">
    <text x="64" y="612" font-size="14">LONG-TERM PRESERVATION FOR</text>
    <text x="64" y="638" font-size="14">THE FRAGILE HISTORY MADE ONLINE.</text>
    <circle cx="70" cy="699" r="6" fill="#cb4b30"/><text x="89" y="704" font-size="12">ARCHIVE / ACCESS / AFTERLIFE</text>
  </g>
  <path d="M64 786h1072" stroke="#19211c"/>
  <g fill="#19211c" font-family="Courier New, monospace" font-size="12">
    <text x="64" y="825">DIGITAL PRESERVATION</text><text x="600" y="825" text-anchor="middle">41°52′N / 87°37′W</text><text x="1136" y="825" text-anchor="end">INTENDED LIFESPAN: ∞</text>
  </g>
  <g transform="translate(64 847)" fill="#19211c"><rect width="16" height="16"/><rect x="24" width="16" height="16"/><rect x="48" width="16" height="16"/><rect x="72" width="16" height="16" fill="none" stroke="#19211c"/></g>
</svg>
