<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">NULL Laboratory</title><desc id="desc">Promotional poster featuring a fluorescent spatial research grid and the phrase Prototypes for uncertain futures.</desc>
  <rect width="1200" height="900" fill="#10110e"/>
  <g stroke="#f1f0e9" stroke-opacity=".12" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200M0 800H1200"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/>
  </g>
  <g transform="translate(66 62)" fill="#f1f0e9">
    <g transform="rotate(45 20 20)"><rect width="18" height="18"/><rect x="22" width="18" height="18" fill="none" stroke="#f1f0e9"/><rect y="22" width="18" height="18" fill="none" stroke="#f1f0e9"/><rect x="22" y="22" width="18" height="18"/></g>
    <text x="64" y="14" font-family="Arial, sans-serif" font-size="16" font-weight="700">NULL</text><text x="64" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700">LABORATORY</text>
  </g>
  <text x="1130" y="82" fill="#dfff3f" text-anchor="end" font-family="Courier New, monospace" font-size="13" letter-spacing="2">RESEARCH INDEX / 0090</text>
  <g transform="translate(864 218)">
    <circle cx="0" cy="0" r="134" fill="none" stroke="#dfff3f" stroke-width="2"/><path d="M-185 0H185M0-185V185" stroke="#dfff3f" stroke-width="2"/><circle cx="0" cy="0" r="12" fill="#dfff3f"/><circle cx="100" cy="-90" r="8" fill="#dfff3f"/>
  </g>
  <text x="62" y="420" fill="#f1f0e9" font-family="Arial, sans-serif" font-size="108" letter-spacing="-7">Prototypes for</text>
  <rect x="0" y="448" width="1200" height="174" fill="#dfff3f"/>
  <text x="54" y="572" fill="#10110e" font-family="Arial, sans-serif" font-size="124" font-weight="700" letter-spacing="-8">uncertain futures.</text>
  <text x="64" y="700" fill="#f1f0e9" font-family="Arial, sans-serif" font-size="21">Spatial computing / Machine perception / Strange interfaces</text>
  <g transform="translate(64 794)" fill="#f1f0e9" font-family="Courier New, monospace" font-size="13" letter-spacing="2"><text>GHOST GEOMETRY</text><text x="374">SOFT WITNESS</text><text x="742">ODD DELIGHT</text></g>
  <path d="M64 758H1136" stroke="#f1f0e9" stroke-opacity=".5"/>
  <g transform="translate(64 830)" fill="#dfff3f"><rect width="6" height="22"/><rect x="12" width="6" height="8"/><rect x="24" width="6" height="17"/><rect x="36" width="6" height="12"/><rect x="48" width="6" height="22"/><rect x="60" width="6" height="5"/></g>
  <text x="1136" y="850" fill="#f1f0e9" text-anchor="end" font-family="Courier New, monospace" font-size="12" letter-spacing="2">PROTOTYPES FOR UNCERTAIN FUTURES.</text>
</svg>
