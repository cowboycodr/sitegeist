<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Field</title><desc id="desc">Promotional poster for a northern astronomical observatory</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#061013"/><stop offset="1" stop-color="#133236"/></linearGradient><linearGradient id="glow"><stop stop-color="#c9f06a" stop-opacity="0"/><stop offset=".5" stop-color="#b7f4a6" stop-opacity=".7"/><stop offset="1" stop-color="#8ed7c7" stop-opacity="0"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="22"/></filter></defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <g fill="#ecfff6" opacity=".75"><circle cx="90" cy="100" r="2"/><circle cx="220" cy="190" r="1.5"/><circle cx="1050" cy="110" r="2"/><circle cx="980" cy="275" r="1.5"/><circle cx="735" cy="95" r="1"/><circle cx="590" cy="210" r="2"/><circle cx="420" cy="115" r="1"/><circle cx="1120" cy="440" r="1"/><circle cx="150" cy="390" r="1.5"/></g>
  <path d="M250 -100 C430 150 850 30 1080 410" fill="none" stroke="url(#glow)" stroke-width="150" filter="url(#blur)" opacity=".8"/>
  <g transform="translate(72 70)" fill="none" stroke="#acd8d1"><circle cx="20" cy="20" r="18"/><path d="M-6 28 47 12" stroke="#c9f06a"/><circle cx="31" cy="11" r="3" fill="#c9f06a" stroke="none"/></g>
  <text x="135" y="103" fill="#f2f0e8" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="5">AURORA FIELD</text>
  <text x="75" y="490" fill="#f2f0e8" font-family="Georgia, serif" font-size="145" letter-spacing="-8">A darker sky.</text>
  <text x="75" y="630" fill="#c9f06a" font-family="Georgia, serif" font-style="italic" font-size="145" letter-spacing="-8">A clearer universe.</text>
  <path d="M0 745 150 680 300 725 450 615 590 710 735 650 890 730 1030 655 1200 700 1200 900 0 900Z" fill="#050b0c"/>
  <text x="75" y="820" fill="#acd8d1" font-family="Arial, sans-serif" font-size="15" letter-spacing="4">64.1466° N  /  PUBLIC NIGHTS + RESEARCH RESIDENCIES</text>
</svg>
