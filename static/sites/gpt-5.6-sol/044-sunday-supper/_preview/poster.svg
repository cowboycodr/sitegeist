<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Sunday Supper</title>
  <desc id="desc">Promotional poster featuring a warm supper plate and the phrase Come hungry, stay awhile.</desc>
  <rect width="1200" height="900" fill="#efe6d4"/>
  <circle cx="928" cy="270" r="240" fill="#d39a3d"/>
  <path d="M0 748 C260 680 470 800 705 728 C870 677 1035 680 1200 735 V900 H0Z" fill="#bd4434"/>
  <g transform="translate(850 405) rotate(-9)">
    <circle r="210" fill="#f7f0e2" stroke="#26382d" stroke-width="5"/>
    <circle r="188" fill="none" stroke="#26382d" stroke-width="2"/>
    <circle r="115" fill="none" stroke="#26382d" stroke-opacity=".35" stroke-width="2"/>
    <path d="M-76-12c45-66 101-62 110-40-48 10-76 36-110 40Z" fill="#26382d"/>
    <path d="M-53 74c53-58 112-39 115-14-48-2-82 16-115 14Z" fill="#26382d"/>
    <circle cx="-18" cy="8" r="41" fill="#bd4434" stroke="#26382d" stroke-width="4"/>
    <circle cx="69" cy="34" r="31" fill="#bd4434" stroke="#26382d" stroke-width="4"/>
    <circle cx="54" cy="-64" r="25" fill="#bd4434" stroke="#26382d" stroke-width="4"/>
  </g>
  <g fill="#26382d">
    <text x="72" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6">DINNER FROM FIVE</text>
    <line x1="72" y1="112" x2="332" y2="112" stroke="#26382d" stroke-width="2"/>
    <text x="67" y="254" font-family="Georgia, serif" font-size="142" letter-spacing="-8">Come</text>
    <text x="67" y="380" font-family="Georgia, serif" font-size="142" letter-spacing="-8">hungry.</text>
    <text x="67" y="505" font-family="Georgia, serif" font-size="142" font-style="italic" letter-spacing="-8" fill="#bd4434">Stay awhile.</text>
    <text x="72" y="590" font-family="Georgia, serif" font-size="27">Generous plates · Natural wine · Unhurried evenings</text>
  </g>
  <g fill="#efe6d4">
    <text x="72" y="795" font-family="Georgia, serif" font-weight="700" font-size="56" letter-spacing="-3">Sunday</text>
    <text x="118" y="838" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="56" letter-spacing="-3">Supper</text>
    <text x="924" y="811" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TUESDAY—SUNDAY</text>
    <text x="924" y="847" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">18 LINDEN STREET</text>
  </g>
</svg>
