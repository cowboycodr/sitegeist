<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Deep Time</title>
  <desc id="desc">Gallery poster featuring a monumental fossil ammonite and the words Four billion years, still unfolding.</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="43%" r="68%"><stop offset="0" stop-color="#d7cfb9"/><stop offset=".62" stop-color="#e7e1d2"/><stop offset="1" stop-color="#d8d0bc"/></radialGradient>
    <filter id="texture" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="3" seed="12" result="n"/><feComposite in="n" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="multiply"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <path d="M0 1h1200M0 836h1200M401 0v900" stroke="#17211e" stroke-opacity=".19" fill="none"/>
  <g fill="none" stroke="#17211e" stroke-width="3" transform="translate(44 40)"><circle cx="22" cy="22" r="20"/><path d="M11 14c8 2 16 7 22 17M9 24c9-1 18 3 25 10M17 5c1 11 7 22 17 30"/></g>
  <text x="100" y="58" fill="#17211e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DEEP</text>
  <text x="100" y="75" fill="#17211e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TIME</text>
  <text x="52" y="157" fill="#17211e" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4">AN ATLAS OF EARTH</text>
  <text x="52" y="253" fill="#17211e" font-family="Georgia, serif" font-size="79" letter-spacing="-4">Four billion</text>
  <text x="52" y="329" fill="#17211e" font-family="Georgia, serif" font-size="79" letter-spacing="-4">years,</text>
  <text x="52" y="405" fill="#a5422e" font-family="Georgia, serif" font-size="79" font-style="italic" letter-spacing="-4">still unfolding.</text>
  <text x="52" y="492" fill="#17211e" font-family="Georgia, serif" font-size="20">A museum of fossils, climates,</text>
  <text x="52" y="521" fill="#17211e" font-family="Georgia, serif" font-size="20">extinction—and improbable survival.</text>
  <g transform="translate(525 82) rotate(-4 340 340)" filter="url(#texture)">
    <circle cx="340" cy="340" r="299" fill="#c9bea5" fill-opacity=".54" stroke="none"/>
    <path d="M551 529c-99 102-284 105-392 12C34 433 35 225 174 107 307-6 513 26 607 170c82 125 50 303-65 379-92 60-228 47-294-37-63-80-43-200 34-250 67-43 161-22 196 42 31 57 11 130-39 159-44 26-100 8-116-31-14-33 2-70 31-81 24-9 49 6 51 27" fill="#80755d" stroke="#2f2c25" stroke-width="9" stroke-linecap="round"/>
    <path d="M125 170l104 59M86 277l127 15M91 394l130-29M148 502l100-73M242 571l50-103M357 596l-14-118M468 561l-77-104M560 477l-119-61M613 361l-142-7M600 235l-134 42M535 124l-103 90M432 67l-52 121M316 52l7 137M209 87l61 117" fill="none" stroke="#423c30" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="#17211e" font-family="Arial, sans-serif" font-size="11" letter-spacing="2"><text x="52" y="865">NATURAL HISTORY / DT—042</text><text x="823" y="865">FOUR BILLION YEARS → TODAY</text></g>
  <circle cx="1126" cy="57" r="7" fill="#a5422e"/>
