<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Afterlight Arcade</title>
  <desc id="desc">A neon arcade cabinet races toward a striped sunset beneath the words one more run before sunrise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080512"/><stop offset=".58" stop-color="#160a25"/><stop offset="1" stop-color="#351040"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffdc5b"/><stop offset="1" stop-color="#ff315f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#451149"/><stop offset=".54" stop-color="#ea3d61"/><stop offset=".55" stop-color="#130923"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <clipPath id="screenClip"><rect x="704" y="196" width="337" height="322" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="922" cy="389" r="330" fill="none" stroke="#9a63ff" stroke-opacity=".15"/>
  <circle cx="922" cy="389" r="268" fill="none" stroke="#9a63ff" stroke-opacity=".22"/>
  <path d="M0 752h1200" stroke="#ff406c" stroke-opacity=".5"/>
  <g stroke="#39e7e1" stroke-opacity=".18">
    <path d="M0 900 600 752 1200 900M170 900 600 752 1030 900M350 900 600 752 850 900M520 900 600 752 680 900"/>
    <path d="M0 790h1200M0 830h1200M0 870h1200"/>
  </g>

  <g transform="translate(72 62)">
    <g transform="rotate(45 24 24)"><rect x="2" y="2" width="44" height="44" fill="none" stroke="#39e7e1" stroke-width="4"/><rect x="8" y="8" width="12" height="12" fill="#ff406c"/><rect x="28" y="28" width="12" height="12" fill="#ff406c"/></g>
    <text x="68" y="21" fill="#f7f1df" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" letter-spacing="3">AFTERLIGHT</text>
    <text x="69" y="44" fill="#ff406c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900" letter-spacing="9">ARCADE</text>
  </g>

  <text x="72" y="257" fill="#39e7e1" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="6">INDEPENDENT GAMES UNIVERSE</text>
  <rect x="72" y="274" width="62" height="4" fill="#ff406c"/>
  <text x="65" y="383" fill="#f7f1df" font-family="Arial,Helvetica,sans-serif" font-size="105" font-weight="900" letter-spacing="-7">ONE MORE</text>
  <text x="65" y="480" fill="#f7f1df" font-family="Arial,Helvetica,sans-serif" font-size="105" font-weight="900" letter-spacing="-7">RUN</text>
  <text x="65" y="569" fill="none" stroke="#ff406c" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="-5">BEFORE</text>
  <text x="65" y="641" fill="none" stroke="#ff406c" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="-5">SUNRISE.</text>
  <text x="71" y="703" fill="#9f96ad" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="1">ORIGINAL WORLDS. IMPOSSIBLE SCORES.</text>

  <g filter="url(#glow)" opacity=".75"><circle cx="874" cy="353" r="112" fill="#ff406c"/></g>
  <g>
    <path d="M709 130h328l43 38-17 437-42 39 34 155H690l34-155-42-39-17-437z" fill="#171023" stroke="#62406d" stroke-width="4"/>
    <path d="M698 151h350l-8 76H706z" fill="#21152d" stroke="#4e355a" stroke-width="3"/>
    <text x="728" y="192" fill="#ff406c" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="5">AFTERLIGHT</text>
    <circle cx="984" cy="186" r="6" fill="#39e7e1"/><circle cx="1007" cy="186" r="6" fill="#39e7e1"/>
    <rect x="689" y="216" width="367" height="344" rx="24" fill="#05030a"/>
    <rect x="704" y="230" width="337" height="316" rx="10" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)">
      <circle cx="874" cy="354" r="113" fill="url(#sun)" filter="url(#glow)"/>
      <g fill="#7c1b49"><rect x="745" y="356" width="260" height="7"/><rect x="740" y="380" width="270" height="13"/><rect x="730" y="410" width="290" height="20"/><rect x="720" y="447" width="310" height="29"/></g>
      <g stroke="#39e7e1" stroke-opacity=".46"><path d="M704 546 872 403 1041 546M758 546 872 403 986 546M815 546 872 403 929 546"/><path d="M704 490h337M704 520h337"/></g>
      <path d="M872 411 905 495l-33-19-33 19z" fill="#39e7e1" filter="url(#glow)"/>
    </g>
    <text x="721" y="250" fill="#39e7e1" font-family="monospace" font-size="12">HI 094280</text>
    <path d="M711 579h321l-29 126H740z" fill="#21152d" stroke="#4d3558" stroke-width="3"/>
    <rect x="782" y="615" width="19" height="75" rx="8" fill="#06030a"/><ellipse cx="791" cy="612" rx="29" ry="23" fill="#ff406c"/>
    <ellipse cx="929" cy="645" rx="28" ry="15" fill="#ff406c"/><ellipse cx="987" cy="645" rx="28" ry="15" fill="#39e7e1"/>
    <path d="M741 705h263l20 73H720z" fill="#0d0915" stroke="#3f2c49" stroke-width="3"/>
  </g>
  <g transform="rotate(-7 640 330)"><rect x="581" y="304" width="119" height="48" fill="#f7f1df"/><rect x="588" y="312" width="119" height="48" fill="#ff406c"/><text x="603" y="343" fill="#fff" font-family="monospace" font-size="18" font-weight="900">+42,800</text></g>
  <g transform="rotate(6 1025 585)"><rect x="968" y="561" width="141" height="49" fill="#3a5314"/><rect x="960" y="553" width="141" height="49" fill="#c8f34f"/><text x="975" y="584" fill="#080512" font-family="monospace" font-size="17" font-weight="900">NEW HIGH</text></g>
  <rect x="66" y="802" width="1068" height="1" fill="#f7f1df" opacity=".15"/>
  <circle cx="78" cy="841" r="5" fill="#c8f34f"/><text x="94" y="847" fill="#f7f1df" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2">1,284 PLAYERS IN THE AFTERLIGHT</text>
  <text x="1134" y="847" text-anchor="end" fill="#6f667c" font-family="monospace" font-size="14" letter-spacing="2">WEEK // 32</text>
</svg>
