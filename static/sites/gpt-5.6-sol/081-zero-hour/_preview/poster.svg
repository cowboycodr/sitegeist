<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Zero Hour</title><desc id="desc">Gallery poster for an independent climate journalism publication.</desc>
  <rect width="1200" height="900" fill="#f3f0e7"/>
  <rect x="0" y="0" width="1200" height="48" fill="#e9ff55"/>
  <text x="45" y="31" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">REPORTING FROM THE THRESHOLD</text>
  <text x="1150" y="31" text-anchor="end" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">ISSUE 017</text>
  <path d="M0 48h1200M50 680h1100" stroke="#121313" stroke-width="2"/>
  <rect x="760" y="48" width="440" height="632" fill="#ff5b3d"/>
  <g fill="none" stroke="#121313" stroke-width="2">
    <circle cx="980" cy="365" r="185"/><circle cx="980" cy="365" r="136"/>
  </g>
  <circle cx="980" cy="365" r="102" fill="#e9ff55" stroke="#121313" stroke-width="2"/>
  <text x="980" y="360" text-anchor="middle" font-family="Impact, Arial Narrow, sans-serif" font-size="75" letter-spacing="-3">+1.48°</text>
  <text x="980" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ABOVE PRE-INDUSTRIAL</text>
  <text x="48" y="151" font-family="Impact, Arial Narrow, sans-serif" font-size="124" letter-spacing="-5">ZERO</text>
  <text x="48" y="248" font-family="Impact, Arial Narrow, sans-serif" font-size="124" letter-spacing="-5">HOUR</text>
  <text x="47" y="383" font-family="Georgia, serif" font-style="italic" font-size="67">The climate story,</text>
  <text x="47" y="457" font-family="Georgia, serif" font-style="italic" font-size="67">without distance.</text>
  <text x="50" y="555" font-family="Arial, sans-serif" font-size="18" letter-spacing="1">INVESTIGATIONS  /  LOCAL VOICES  /  VISUAL EVIDENCE</text>
  <path d="M50 589h550" stroke="#121313" stroke-width="2"/>
  <text x="50" y="735" font-family="Impact, Arial Narrow, sans-serif" font-size="67" letter-spacing="-1">THE FUTURE IS</text>
  <text x="50" y="802" font-family="Impact, Arial Narrow, sans-serif" font-size="67" letter-spacing="-1">ALREADY HERE.</text>
  <rect x="760" y="680" width="440" height="220" fill="#2f5fff"/>
  <text x="805" y="759" font-family="Arial, sans-serif" fill="#f3f0e7" font-size="13" font-weight="700" letter-spacing="2">INDEPENDENT CLIMATE JOURNALISM</text>
  <text x="805" y="841" font-family="Impact, Arial Narrow, sans-serif" fill="#f3f0e7" font-size="67">ZEROHOUR / 26</text>
</svg>
