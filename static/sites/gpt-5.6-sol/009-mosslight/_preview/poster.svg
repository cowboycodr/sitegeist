  <rect width="1200" height="900" fill="#17382d"/>
  <rect x="540" width="660" height="900" fill="url(#g)"/>
  <circle cx="965" cy="190" r="115" fill="#ded9a9" opacity=".68"/>
  <path d="M540 590 690 390l120 150 155-243 235 320v283H540Z" fill="#496f58"/>
  <path d="M540 700 720 460l120 160 116-180 244 290v170H540Z" fill="#214638"/>
  <g fill="#0f2f26"><path d="m570 786 75-414 77 414Z"/><path d="m1040 780 71-390 75 390Z"/><path d="m932 775 60-325 62 325Z"/></g>
  <path d="M716 652h306v172H716Z" fill="#273b31"/><path d="m692 652 177-119 180 119Z" fill="#142c24"/><rect x="768" y="691" width="78" height="81" fill="#d8c477"/><rect x="906" y="677" width="73" height="64" fill="#d8c477"/>
  <rect x="540" width="660" height="900" filter="url(#noise)" opacity=".14"/>
  <g fill="#f1efe4"><path d="M86 94v40m0-25-15-13m15 23 20-17m-20 32H67h40" fill="none" stroke="#f1efe4" stroke-width="3"/><text x="128" y="125" font-family="Georgia,serif" font-size="34" font-weight="bold">Mosslight</text></g>
  <text x="84" y="235" fill="#b5c1b7" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="4">CABINS IN THE CASCADES</text>
  <text x="80" y="360" fill="#f2f0e6" font-family="Georgia,serif" font-size="96" letter-spacing="-5">Disappear</text>
  <text x="80" y="458" fill="#f2f0e6" font-family="Georgia,serif" font-size="96" letter-spacing="-5">into the</text>
  <text x="80" y="556" fill="#c3ad68" font-family="Georgia,serif" font-size="96" font-style="italic" letter-spacing="-5">green.</text>
  <line x1="84" y1="638" x2="450" y2="638" stroke="#71877d"/>
  <text x="84" y="690" fill="#c8d0c9" font-family="Georgia,serif" font-size="24">Forest quiet. Creek water.</text><text x="84" y="725" fill="#c8d0c9" font-family="Georgia,serif" font-size="24">Nowhere else to be.</text>
  <text x="84" y="820" fill="#f1efe4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="3">NORTH BEND · WASHINGTON</text>
</svg>
