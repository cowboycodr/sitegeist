<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Mosslight</title><desc id="desc">Promotional artwork for restorative forest cabins in the Cascades</desc>
