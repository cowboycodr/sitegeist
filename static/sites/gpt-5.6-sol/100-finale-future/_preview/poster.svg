<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Finale festival poster</title>
  <desc id="desc">Acid yellow poster with Finale in large black type, overlapping violet and orange circles, and festival details.</desc>
  <rect width="1200" height="900" fill="#f0ff45"/>
  <g stroke="#101010" stroke-width="3">
    <circle cx="205" cy="345" r="245" fill="#725cff"/>
    <circle cx="955" cy="666" r="220" fill="#ff5b35"/>
    <circle cx="942" cy="165" r="68" fill="#f4f1e8"/>
  </g>
  <path d="M0 82H1200M0 730H1200" stroke="#101010" stroke-width="3"/>
  <g fill="#101010" font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="52" font-size="24" font-weight="700" letter-spacing="4">DIGITAL CULTURE FESTIVAL</text>
    <text x="1148" y="52" text-anchor="end" font-size="24" font-weight="700" letter-spacing="3">100 VISIONS</text>
    <text x="38" y="593" font-size="267" font-weight="900" letter-spacing="-28">FINALE</text>
    <text x="54" y="788" font-size="46" font-weight="800" letter-spacing="-2">ONE HUNDRED VISIONS.</text>
    <text x="54" y="840" font-size="46" font-weight="800" letter-spacing="-2">ONE STRANGE FUTURE.</text>
    <text x="1146" y="778" text-anchor="end" font-size="23" font-weight="700" letter-spacing="3">OCTOBER 08–10</text>
    <text x="1146" y="818" text-anchor="end" font-size="23" font-weight="700" letter-spacing="3">EVERYWHERE</text>
    <text x="1146" y="858" text-anchor="end" font-size="18" font-weight="700" letter-spacing="2">ART / SOUND / CODE / PERFORMANCE</text>
  </g>
  <circle cx="695" cy="128" r="10" fill="#101010"/>
  <circle cx="728" cy="128" r="10" fill="#101010"/>
  <circle cx="761" cy="128" r="10" fill="#101010"/>
</svg>
