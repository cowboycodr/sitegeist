<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Nightjar FM</title><desc id="desc">A nocturnal radio dial and the words Broadcasts after dark.</desc>
  <rect width="1200" height="900" fill="#090c0c"/>
  <path d="M0 92h1200M0 808h1200" stroke="#2a3230"/>
  <g fill="none" stroke="#303936">
    <circle cx="875" cy="450" r="276"/><circle cx="875" cy="450" r="220"/><circle cx="875" cy="450" r="140"/>
    <circle cx="875" cy="450" r="250" stroke-dasharray="3 18"/>
  </g>
  <path d="M875 450L1038 254" stroke="#ef7147" stroke-width="4"/>
  <circle cx="875" cy="450" r="22" fill="#e7ff65"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="64" fill="#ded9cc" font-size="24" font-weight="700">NIGHTJAR FM</text>
    <text x="1130" y="62" fill="#8c938d" font-size="14" text-anchor="end" letter-spacing="3">89.7 NIGHT</text>
    <text x="70" y="202" fill="#e7ff65" font-size="16" font-weight="700" letter-spacing="4">LIVE FROM 11:00 PM</text>
    <text x="60" y="440" fill="#ded9cc" font-size="160" font-weight="800" letter-spacing="-12">After</text>
    <text x="60" y="592" fill="none" stroke="#ded9cc" stroke-width="2" font-size="160" font-weight="600" letter-spacing="-12">dark.</text>
    <text x="70" y="744" fill="#8c938d" font-size="22">Independent transmissions through the night.</text>
    <text x="1130" y="850" fill="#ded9cc" font-size="15" text-anchor="end" letter-spacing="3">AMBIENT / EXPERIMENTAL / LEFT-FIELD</text>
  </g>
  <circle cx="1090" cy="133" r="8" fill="#ef7147"/><text x="1070" y="139" fill="#ded9cc" font-family="Arial" font-size="15" text-anchor="end" letter-spacing="2">ON AIR</text>
</svg>
